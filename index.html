}

function FairnessPage({ doctors, leaves, nightData, coverages, today }) {
  const [scope,setScope] = useState("month");
  const now = new Date(today);
  const dates = (()=>{ if(scope==="month") return monthDays(now.getFullYear(),now.getMonth()).map(x=>x.date); const out=[]; for(let m=0;m<12;m++) monthDays(now.getFullYear(),m).forEach(x=>out.push(x.date)); return out; })();
  const rows = doctors.map(d=>{ const s=doctorSessions(d,dates,nightData,coverages,leaves); return { d, contrib:s.covers+s.eveningExtra, covers:s.covers, eve:s.eveningExtra, care:s.care }; }).sort((a,b)=>b.contrib-a.contrib);
  const avg = rows.length ? rows.reduce((a,r)=>a+r.contrib,0)/rows.length : 0;
  const max = Math.max(1, ...rows.map(r=>r.contrib));
  const most = rows[0], least = rows[rows.length-1];
  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>⚖️ مؤشر مساهمة الأطباء</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["month","الشهر"],["year","السنة"]].map(([k,l])=><button key={k} onClick={()=>setScope(k)} style={{ padding:"7px 15px", border:"none", fontSize:12.5, fontWeight:700, background:scope===k?C.primary:"var(--surface)", color:scope===k?"#fff":C.sub }}>{l}</button>)}
        </div>
      </div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:8 }}>المساهمة = التغطيات المنفّذة + المسائي الإضافي. متوسط القسم: <b style={{ color:C.primary }}>{avg.toFixed(1)}</b></div>
    </div>
    {most && least && <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأكثر مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{most.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.primary }}>{most.contrib}</div></div>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأقل مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{least.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.warn }}>{least.contrib}</div></div>
    </div>}
    <div style={{ ...card(), padding:14 }}>
      {rows.map((r,i)=>{ const pct=Math.round(r.contrib/max*100); const above=r.contrib>=avg; return (
        <div key={r.d.id} style={{ marginBottom:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
            <span style={{ fontWeight:800, color:C.muted, minWidth:18, fontSize:12 }}>{i+1}</span>
            <Avatar doc={r.d} size={24}/>
            <span style={{ flex:1, fontSize:13, fontWeight:600 }}>د.{r.d.name}</span>
            <span style={{ fontSize:11, color:C.sub }}>تغطيات {r.covers} · مسائي+ {r.eve}</span>
            <span style={{ fontWeight:800, color:above?C.primary:C.warn, minWidth:24, textAlign:"center" }}>{r.contrib}</span>
          </div>
          <div style={{ height:8, background:"var(--surface2)", borderRadius:6, overflow:"hidden" }}><div style={{ width:pct+"%", height:"100%", background:above?`linear-gradient(90deg,${C.primary},${C.eve})`:C.warn, borderRadius:6 }} /></div>
        </div>
      ); })}
    </div>
  </div>;
}

function AlertsPage({ doctors, leaves, nightData, coverages, today, fd, settings, onGoto }) {
  const s = { ...DEFAULT_SETTINGS, ...settings };
  const now = new Date(today);
  const al = [];
  const ana = analyzeMonth(now.getFullYear(), now.getMonth(), doctors, leaves, nightData, coverages, s.restRule!==false);
  ana.conflicts.forEach(c=> al.push({ sev:"err", t:c.text, go:"engine" }));
  ana.gaps.forEach(g=>{ const o=fd(g.ownerId); al.push({ sev:"warn", t:`عيادة ${o?"د."+o.name:""} مكشوفة ${dmy(g.date)} (${g.period==="am"?"صباحاً":"ظهراً"})`, go:"engine" }); });
  leaves.forEach(l=>{ const du=Math.round((new Date(l.start)-now)/864e5); if(du>0&&du<=3){ const d=fd(l.doctorId); if(d) al.push({ sev:"warn", t:`إجازة د.${d.name} تبدأ بعد ${du} ${du===1?"يوم":"أيام"}`, go:"leaves" }); } });
  doctors.forEach(d=>{ let n=0; monthDays(now.getFullYear(),now.getMonth()).forEach(({date})=>{ if(((nightData[date]||{}).doctors||[]).includes(d.id)) n++; }); if(n>(+s.capEvening||CAP_EVENING)) al.push({ sev:"err", t:`د.${d.name} تجاوز حدّ المناوبات (${n}/${s.capEvening})`, go:"doctors" }); });
  monthDays(now.getFullYear(),now.getMonth()).forEach(({date,di})=>{ const onLv=doctors.filter(d=>onLeave(d,date,leaves)).length; if(onLv>=(+s.capLeaveDay||CAP_LEAVE_DAY)) al.push({ sev:"warn", t:`تواجد منخفض ${dmy(date)} ${DAYS[di]} — ${onLv} في إجازة`, go:"leaves" }); });
  al.sort((a,b)=>(a.sev==="err"?0:1)-(b.sev==="err"?0:1));
  const SEV = { err:{ fg:C.err, ic:"!", tag:"t-bad", lbl:"عاجل" }, warn:{ fg:C.warn, ic:"~", tag:"t-warn", lbl:"مراجعة" } };
  return <div className="fade">
    <div className="card" style={{ padding:18, marginBottom:16 }}>
      <div className="ctitle">🔔 مركز التنبيهات <span style={{ fontWeight:400, color:C.muted, fontSize:12 }}>({al.length})</span></div>
      <div className="csub" style={{ margin:0 }}>تعارضات · عيادات مكشوفة · حدود · إجازات قادمة</div>
    </div>
    {al.length===0 ? <Empty icon="✅" title="لا تنبيهات" hint="كل شيء متوازن" /> :
      <div className="card" style={{ padding:8 }}>
        {al.map((a,i)=>{ const c=SEV[a.sev]; return (
          <div key={i} className="row" onClick={()=>onGoto(a.go)} style={{ cursor:"pointer" }}>
            <div className="rav" style={{ background:c.fg }}>{c.ic}</div>
            <div style={{ flex:1 }}><div className="nm" style={{ fontSize:13 }}>{a.t}</div></div>
            <span className={"tag "+c.tag}>{c.lbl}</span>
          </div>
        ); })}
      </div>}
  </div>;
}

function makeReports({ doctors, leaves, nightData, coverages, fd, settings, dates, label, ref, shown }) {
  const restRule = settings?.restRule!==false;
  const slotT = (d,di,p)=>{ const sl=(d.sched?.[di]?.[p])||""; return sl?SLOT_AR[sl]||sl:"—"; };
  const perTxt = p => p==="am"?"عيادة الصباح":p==="pm"?"عيادة الظهر":p==="nextAm"?"عيادة صباح الغد":"العيادة المسائية";
  const covsOf = d => { const out=[]; coverages.filter(c=>c.coverDoctorId===d.id&&dates.includes(c.date)).forEach(c=>out.push({date:c.date,period:c.period,ownerId:c.absentId,reason:c.reason})); dates.forEach(dt=>{ const cv=(nightData[dt]||{}).coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===d.id) out.push({date:dt,period:sl,ownerId:null,reason:"evening"}); }); }); }); return out.sort((a,b)=>a.date.localeCompare(b.date)); };
  const eveOf = d => dates.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(d.id));
  const lvOf = d => leaves.filter(l=>l.doctorId===d.id && l.start<=dates[dates.length-1] && l.end>=dates[0]);

  const reportCSS = `<style>
    .pb{page-break-before:always}
    .pdoc{padding-top:2px}
    .dhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px;padding-bottom:12px;border-bottom:2px solid #eef3f8}
    .dav{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,${C.primary},${C.eve});color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
    .dnm{font-size:18px;font-weight:800;color:#0d1b2a}
    .dmt{font-size:11.5px;color:#64748b;margin-top:3px}
    .sgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
    .stile{flex:1 1 90px;border-radius:13px;padding:11px 8px;text-align:center;border:1px solid #eef3f8}
    .stile b{font-size:21px;font-weight:800;display:block;line-height:1}
    .stile span{font-size:10.5px;color:#64748b;margin-top:4px;display:block}
    .bdg{padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;display:inline-block}
    .b-eve{background:#ede9fe;color:#6d28d9}.b-norm{background:#e3f5f2;color:${C.primaryD}}
    .cov-c{color:${C.primaryD};font-weight:600}
  </style>`;
  const tile = (v,l,bg,fg)=>`<div class="stile" style="background:${bg}"><b style="color:${fg}">${v}</b><span>${l}</span></div>`;
  const docReportBody = d => {
    const s = doctorSessions(d, dates, nightData, coverages, leaves);
    const cv = covsOf(d); const ev = eveOf(d); const lv = lvOf(d);
    const coveredAway = coverages.filter(c=>c.absentId===d.id && dates.includes(c.date));
    const summary = `<div class="sgrid">
      ${tile(s.care,"الرعاية","#e3f5f2",C.primaryD)}
      ${tile(s.evening,"المسائي","#ede9fe","#6d28d9")}
      ${tile(s.covers,"التغطيات","#e6f6f4","#0b7e77")}
      ${tile(s.support,"الدعم","#eef2f7","#475569")}
      ${tile(lv.length,"إجازات","#fbf1df","#b45309")}
      ${tile(s.total,"إجمالي العمل","#0d1b2a","#ffffff")}
    </div>`;
    const evTbl = ev.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${ev.map(dt=>{ const fixed=(d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td><span class="bdg ${fixed?"b-eve":"b-norm"}">${fixed?"مسائي ثابت":"مسائي / تغطية"}</span></td></tr>`; }).join("")}</tbody></table>`
      : `<p>لا يوجد دوام مسائي في هذه الفترة</p>`;
    const cvTbl = cv.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td class="cov-c" style="text-align:start">تم تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} بـ <b>د.${d.name}</b> بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`
      : `<p>لا توجد تغطيات في هذه الفترة</p>`;
    const schedTbl = `<table><thead><tr><th>اليوم</th><th>صباح (٠٨:٠٠–١٢:٠٠)</th><th>ظهر (١٣:٠٠–١٦:٠٠)</th><th>مساء (١٦:٠٠–٢٣:٠٠)</th></tr></thead><tbody>${DAYS.map((dn,di)=>`<tr><td style="font-weight:700;background:#f4f8fb;color:${C.primaryD}">${dn}</td><td>${SLOT_AR[(d.sched?.[di]?.am)||""]||"—"}</td><td>${SLOT_AR[(d.sched?.[di]?.pm)||""]||"—"}</td><td>${((d.sched?.[di]?.eve)||(d.nightDays||[]).includes(di))?"🌙 مسائي ثابت":"—"}</td></tr>`).join("")}</tbody></table>`;
    const awayTbl = coveredAway.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>من قام بتغطيته</th></tr></thead><tbody>${coveredAway.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تمت تغطية ${perFull(c.period)} الخاصة به بـ <b>د.${fd(c.coverDoctorId)?.name||"—"}</b> بسبب ${coverReasonAr(d.id,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`
      : `<p>لم تُغطَّ عيادته من قِبل أحد في هذه الفترة</p>`;
    const lvTbl = lv.length
      ? `<table><thead><tr><th style="width:150px">من</th><th style="width:150px">إلى</th><th>النوع</th><th>العيادة</th></tr></thead><tbody>${lv.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(l=>`<tr><td style="font-weight:600">${dmyFull(l.start)}</td><td style="font-weight:600">${dmyFull(l.end)}</td><td>${LEAVE_AR[l.type]||"إجازة"}</td><td>${l.clinicClosed?"مغلقة":"تُغطّى"}</td></tr>`).join("")}</tbody></table>`
      : `<p>لا إجازات في هذه الفترة</p>`;
    return `<div class="dhead"><span class="dav">${sn(d.name).slice(0,2)}</span><div><div class="dnm">د.${d.name}</div><div class="dmt">${rankLabel(rankOf(d))} · ${posLabel(d.adminPosition,d)} · ${label}</div></div></div>
      ${summary}
      <h2>🏥 الجدول الأسبوعي الثابت</h2>${schedTbl}
      <h2>🌙 الدوام المسائي (${ev.length})</h2>${evTbl}
      <h2>🩹 من قام بتغطيته (${coveredAway.length})</h2>${awayTbl}
      <h2>🔄 تغطياته لزملائه (${cv.length})</h2>${cvTbl}
      <h2>🏖 إجازاته (${lv.length})</h2>${lvTbl}`;
  };
  const printDoctor = d => printDoc(`تقرير — د.${d.name} (${label})`, reportCSS+`<div class="pdoc">${docReportBody(d)}</div>`, false);
  const printAll = () => { if(!shown.length) return; printDoc(`تقرير الأطباء — ${label}`, reportCSS+shown.map((d,i)=>`<div class="pdoc ${i>0?"pb":""}">${docReportBody(d)}</div>`).join(""), false); };
  const printDepartment = () => {
    const gaps=[], conflicts=[];
    dates.forEach(dt=>{ const r=analyzeDay(dt,doctors,leaves,nightData,coverages,null,restRule); (r.gaps||[]).forEach(g=>gaps.push({ date:dt, di:(g.di!=null?g.di:new Date(dt).getDay()), ownerId:g.ownerId, period:g.period, reason:g.reason||"" })); (r.conflicts||[]).forEach(c=>conflicts.push({ date:dt, text:c.text||c.reason||"تعارض" })); });
    gaps.sort((a,b)=>a.date.localeCompare(b.date));
    const issueCSS = `<style>.alert{border-radius:14px;padding:14px 16px;margin-bottom:14px}.alert.bad{background:#fef2f2;border:1px solid #fecaca}.alert.ok{background:#ecfdf5;border:1px solid #bbf7d0}.alert h2{margin:0 0 8px;border:none;padding:0}.alert.bad h2{color:#b91c1c}.alert.bad h2::before{background:#ef4444}.alert.ok h2{color:#15803d}.alert.ok h2::before{background:#16a34a}.wsched td.s{background:#f4f8fb;font-weight:700;color:${C.primaryD}}</style>`;
    const gapRows = gaps.map(g=>`<tr><td>${dmy(g.date)}</td><td>${DAYS[g.di]||""}</td><td style="font-weight:700">د.${fd(g.ownerId)?.name||"—"}</td><td>${perTxt(g.period)}</td><td style="text-align:start">${g.reason}</td></tr>`).join("");
    const confRows = conflicts.map(c=>`<tr><td>${dmy(c.date)}</td><td style="text-align:start">${c.text}</td></tr>`).join("");
    const review = (gaps.length||conflicts.length)
      ? `<div class="alert bad"><h2>⚠️ يحتاج مراجعة — عيادات مكشوفة (${gaps.length}) · تعارضات (${conflicts.length})</h2>${gaps.length?`<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الطبيب صاحب العيادة</th><th>الفترة</th><th>السبب</th></tr></thead><tbody>${gapRows}</tbody></table>`:""}${conflicts.length?`<table style="margin-top:10px"><thead><tr><th>التاريخ</th><th>وصف التعارض</th></tr></thead><tbody>${confRows}</tbody></table>`:""}</div>`
      : `<div class="alert ok"><h2>✅ لا عيادات مكشوفة ولا تعارضات خلال ${label}</h2></div>`;
    const docs = doctors.map(d=>{
      const sx=doctorSessions(d,dates,nightData,coverages,leaves); const ev=eveOf(d); const cv=covsOf(d); const lv=lvOf(d);
      const sched = DAYS.map((dn,di)=>`<tr><td class="s">${dn}</td><td>${SLOT_AR[(d.sched?.[di]?.am)||""]||"—"}</td><td>${SLOT_AR[(d.sched?.[di]?.pm)||""]||"—"}</td><td>${((d.sched?.[di]?.eve)||(d.nightDays||[]).includes(di))?"🌙 مسائي ثابت":"—"}</td></tr>`).join("");
      const evTbl = ev.length?`<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${ev.map(dt=>{ const fixed=(d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td>${fixed?"مسائي ثابت":"مسائي / تغطية"}</td></tr>`; }).join("")}</tbody></table>`:`<p>لا يوجد</p>`;
      const cvTbl = cv.length?`<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تم تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} بـ <b>د.${d.name}</b> بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`:`<p>لا يوجد</p>`;
      const lvTbl = lv.length?`<table><thead><tr><th>من</th><th>إلى</th></tr></thead><tbody>${lv.map(l=>`<tr><td>${dmy(l.start)}</td><td>${dmy(l.end)}</td></tr>`).join("")}</tbody></table>`:`<p>لا يوجد</p>`;
      return `<div class="pdoc pb"><div class="dhead"><span class="dav">${sn(d.name).slice(0,2)}</span><div><div class="dnm">د.${d.name}</div><div class="dmt">${rankLabel(rankOf(d))} · رعاية ${sx.care} · مسائي ثابت ${sx.eveningFixed} · مسائي إضافي ${sx.eveningExtra} · تغطيات ${sx.covers}</div></div></div><h2>🏥 الجدول الأسبوعي الثابت</h2><table class="wsched"><thead><tr><th>اليوم</th><th>صباح</th><th>ظهر</th><th>مساء</th></tr></thead><tbody>${sched}</tbody></table><h2>🌙 الدوام المسائي (${ev.length})</h2>${evTbl}<h2>🔄 التغطيات (${cv.length})</h2>${cvTbl}<h2>🏖 الإجازات (${lv.length})</h2>${lvTbl}</div>`;
    }).join("");
    printDoc(`مراجعة جدول القسم الشامل — ${label}`, reportCSS+issueCSS+review+docs, false);
  };

  // ════════ تقارير مركّزة: عدد المناوبات / عدد التغطيات — بكل الأيام، لطبيب معيّن أو كامل القسم ════════
  const focusCSS = `<style>
    .sumbar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
    .sumtile{flex:1 1 100px;border-radius:13px;padding:12px 8px;text-align:center;border:1px solid #eef3f8;background:#f4f8fb}
    .sumtile b{font-size:22px;font-weight:800;display:block;color:${C.primaryD};line-height:1}
    .sumtile span{font-size:10.5px;color:#64748b;margin-top:4px;display:block}
    .totrow td{background:#0d1b2a;color:#fff;font-weight:800}
  </style>`;
  const printEveningReport = () => {
    const perDoctorRows = shown.map(d=>{
      const ev = eveOf(d);
      const fixedN = ev.filter(dt=>(d.nightDays||[]).includes(dayIdx(dt))).length;
      const extraN = ev.length - fixedN;
      return { d, ev, fixedN, extraN };
    }).sort((a,b)=>b.ev.length-a.ev.length);
    const totalShifts = perDoctorRows.reduce((a,r)=>a+r.ev.length,0);
    const summary = `<div class="sumbar">
      <div class="sumtile"><b>${totalShifts}</b><span>إجمالي المناوبات</span></div>
      <div class="sumtile"><b>${perDoctorRows.reduce((a,r)=>a+r.fixedN,0)}</b><span>ثابتة</span></div>
      <div class="sumtile"><b>${perDoctorRows.reduce((a,r)=>a+r.extraN,0)}</b><span>إضافية</span></div>
      <div class="sumtile"><b>${dates.filter(dt=>((nightData[dt]||{}).doctors||[]).length>0).length}</b><span>أيام فيها مناوبة</span></div>
    </div>`;
    const totalsTbl = shown.length>1 ? `<h2>📊 إجمالي المناوبات لكل طبيب (مرتّب تنازلياً)</h2><table><thead><tr><th style="text-align:start">الطبيب</th><th>ثابتة</th><th>إضافية</th><th>الإجمالي</th></tr></thead><tbody>${perDoctorRows.map(r=>`<tr><td style="text-align:start;font-weight:700">د.${r.d.name}</td><td>${r.fixedN}</td><td>${r.extraN}</td><td style="font-weight:800;color:${C.primaryD}">${r.ev.length}</td></tr>`).join("")}<tr class="totrow"><td style="text-align:start">الإجمالي</td><td>${perDoctorRows.reduce((a,r)=>a+r.fixedN,0)}</td><td>${perDoctorRows.reduce((a,r)=>a+r.extraN,0)}</td><td>${totalShifts}</td></tr></tbody></table>` : "";
    let dayByDay;
    if(shown.length===1){
      const r = perDoctorRows[0];
      dayByDay = r.ev.length ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${r.ev.map(dt=>{ const fixed=(r.d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td>${fixed?"🌙 مسائي ثابت":"🌙 مسائي إضافي"}</td></tr>`; }).join("")}</tbody></table>` : `<p>لا مناوبات مسائية خلال ${label}</p>`;
    } else {
      const rows = dates.map(dt=>{ const docs=((nightData[dt]||{}).doctors||[]).map(id=>fd(id)).filter(Boolean); if(!docs.length) return null; const di=dayIdx(dt); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td style="text-align:start">${docs.map(dr=>{ const fixed=(dr.nightDays||[]).includes(di); return `د.${dr.name}${fixed?" (ثابت)":" (إضافي)"}`; }).join("، ")}</td></tr>`; }).filter(Boolean).join("");
      dayByDay = rows ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>الأطباء المناوبون</th></tr></thead><tbody>${rows}</tbody></table>` : `<p>لا مناوبات مسائية خلال ${label}</p>`;
    }
    const title = shown.length===1 ? `تقرير المناوبات — د.${shown[0].name} (${label})` : `تقرير المناوبات — كامل القسم (${label})`;
    printDoc(title, reportCSS+focusCSS+summary+totalsTbl+`<h2>🌙 كل الأيام</h2>`+dayByDay, false);
  };
  const printCoverageReport = () => {
    const perDoctorRows = shown.map(d=>({ d, cv:covsOf(d) })).sort((a,b)=>b.cv.length-a.cv.length);
    const totalCov = perDoctorRows.reduce((a,r)=>a+r.cv.length,0);
    const byReason = {};
    perDoctorRows.forEach(r=>r.cv.forEach(c=>{ const key=coverReasonAr(c.ownerId,c.date,c.reason,leaves); byReason[key]=(byReason[key]||0)+1; }));
    // ── من تمت تغطيته أكثر (صاحب العيادة الغائب/المناوب)، ولماذا بالتفصيل — يشمل كل القسم بصرف النظر عن اختيار "طبيب معيّن" أعلاه، لأنه سؤال مختلف (مَن يحتاج تغطية) ──
    const coveredMap = {};
    const bumpCovered = (ownerId, reasonLabel) => { if(ownerId==null) return; if(!coveredMap[ownerId]) coveredMap[ownerId]={count:0,reasons:{}}; coveredMap[ownerId].count++; coveredMap[ownerId].reasons[reasonLabel]=(coveredMap[ownerId].reasons[reasonLabel]||0)+1; };
    coverages.filter(c=>dates.includes(c.date)).forEach(c=>{ bumpCovered(c.absentId, coverReasonAr(c.absentId,c.date,c.reason,leaves)); });
    dates.forEach(dt=>{
      const nd=nightData[dt]||{}; const cv=nd.coverages||{};
      const di0=dayIdx(dt); const ndi=dayIdx(nextWork(dt));
      ["am","pm","nextAm"].forEach(slot=>{
        (cv[slot]||[]).forEach(()=>{
          const sl=slot==="nextAm"?"am":slot; const sdi=slot==="nextAm"?ndi:di0;
          const owner=(nd.doctors||[]).find(id=>{ const o=fd(id); return o&&isClinic(getSlot(o,sdi,sl)); });
          bumpCovered(owner, slot==="nextAm"?"راحة بعد مسائي":"دوام مسائي");
        });
      });
    });
    const coveredRows = Object.entries(coveredMap).map(([id,v])=>({ d:fd(+id), count:v.count, reasons:v.reasons })).filter(r=>r.d).sort((a,b)=>b.count-a.count);
    const allReasonKeys = [...new Set(coveredRows.flatMap(r=>Object.keys(r.reasons)))];
    const coveredTbl = coveredRows.length ? `<h2>🩺 مَن تمت تغطيته أكثر (صاحب العيادة الغائب/المناوب) — ولماذا بالتفصيل</h2><table><thead><tr><th style="text-align:start">الطبيب</th><th>الإجمالي</th>${allReasonKeys.map(k=>`<th>${k}</th>`).join("")}</tr></thead><tbody>${coveredRows.map(r=>`<tr><td style="text-align:start;font-weight:700">د.${r.d.name}</td><td style="font-weight:800;color:${C.err}">${r.count}</td>${allReasonKeys.map(k=>`<td>${r.reasons[k]||"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>` : "";
    const summary = `<div class="sumbar">
      <div class="sumtile"><b>${totalCov}</b><span>إجمالي التغطيات</span></div>
      <div class="sumtile"><b>${dates.filter(dt=>coverages.some(c=>c.date===dt)||Object.values(((nightData[dt]||{}).coverages)||{}).some(a=>a&&a.length)).length}</b><span>أيام فيها تغطية</span></div>
      ${Object.entries(byReason).map(([k,v])=>`<div class="sumtile"><b>${v}</b><span>${k}</span></div>`).join("")}
    </div>`;
    const totalsTbl = shown.length>1 ? `<h2>📊 إجمالي التغطيات لكل طبيب مغطٍّ (مرتّب تنازلياً)</h2><table><thead><tr><th style="text-align:start">الطبيب</th><th>عدد التغطيات</th></tr></thead><tbody>${perDoctorRows.map(r=>`<tr><td style="text-align:start;font-weight:700">د.${r.d.name}</td><td style="font-weight:800;color:${C.primaryD}">${r.cv.length}</td></tr>`).join("")}<tr class="totrow"><td style="text-align:start">الإجمالي</td><td>${totalCov}</td></tr></tbody></table>` : "";
    let dayByDay;
    if(shown.length===1){
      const r = perDoctorRows[0];
      dayByDay = r.cv.length ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${r.cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} — بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>` : `<p>لا تغطيات خلال ${label}</p>`;
    } else {
      const rows = [];
      dates.forEach(dt=>{
        const items=[];
        coverages.filter(c=>c.date===dt).forEach(c=>items.push(`د.${fd(c.coverDoctorId)?.name||"—"} ◂ ${c.absentId?("د."+(fd(c.absentId)?.name||"—")):"—"} (${perAr(c.period)})`));
        const cv=(nightData[dt]||{}).coverages||{};
        ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>items.push(`د.${fd(id)?.name||"—"} ◂ طبيب المسائي (${perAr(sl)})`)); });
        if(items.length) rows.push(`<tr><td style="font-weight:600">${dmyFull(dt)}</td><td style="text-align:start">${items.join("<br>")}</td></tr>`);
      });
      dayByDay = rows.length ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>التغطيات (المغطّي ◂ الغائب)</th></tr></thead><tbody>${rows.join("")}</tbody></table>` : `<p>لا تغطيات خلال ${label}</p>`;
    }
    const title = shown.length===1 ? `تقرير التغطيات — د.${shown[0].name} (${label})` : `تقرير التغطيات — كامل القسم (${label})`;
    printDoc(title, reportCSS+focusCSS+summary+totalsTbl+coveredTbl+`<h2>🔄 كل الأيام</h2>`+dayByDay, false);
  };

  const printDoctorTimetable = d => {
    const [y,m] = ref.split("-"); const Y=+y, Mo=+m-1;
    const last = new Date(Y, Mo+1, 0).getDate();
    const WK = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const TIMES = { am:"08:00–12:00", pm:"13:00–16:00", nextAm:"08:00–12:00 (الغد)", eve:"16:00–23:00" };
    let totClin=0, totCov=0;
    const rows=[];
    for(let day=1; day<=last; day++){
      const date = `${Y}-${String(Mo+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const jsDay = new Date(date).getDay();
      const di = dayIdx(date);
      if(di<0){ const h=holidayInfo(date); const txt = h ? `🎉 ${h.name}${h.onCall?(" · مناوب: د."+(fd(h.onCall)?.name||"")):" · بدون مناوب"}` : "عطلة نهاية الأسبوع"; rows.push(`<tr class="we"><td>${dmy(date)}</td><td>${WK[jsDay]}</td><td colspan="6" style="color:${h?"#6d28d9":"#94a3b8"};font-weight:${h?"700":"400"}">${txt}</td></tr>`); continue; }
      const nd = nightData[date]||{};
      const isEve = (nd.doctors||[]).includes(d.id);
      const onLvP = p => onLeave(d,date,leaves,p); const closedP = p => clinicClosedOnLeave(d,date,leaves,p);
      const indiv = coverages.filter(c=>c.date===date);
      const cellFor = per => { const slot=getSlot(d,di,per); const away=indiv.some(x=>x.period===per && x.absentId===d.id); if(onLvP(per)) return closedP(per)?`<span class="lv">إجازة</span>`:(slot?(SLOT_AR[slot]||slot):"—"); if(away) return `<span class="aw">غُطّيت عنه</span>`; if(!slot) return "—"; return SLOT_AR[slot]||slot; };
      const amC=cellFor("am"), pmC=cellFor("pm");
      const eveC = isEve?`<span class="ev">عيادة مسائية</span>`:"—";
      const covs=[];
      indiv.forEach(x=>{ if(x.coverDoctorId===d.id) covs.push(`${perFull(x.period)} (${TIMES[x.period]||""}) لـ د.${fd(x.absentId)?.name||"—"} بسبب ${coverReasonAr(x.absentId,date,x.reason,leaves)}`); });
      ["am","pm","nextAm"].forEach(sl=>{ (nd.coverages?.[sl]||[]).forEach(id=>{ if(id===d.id) covs.push(`${perFull(sl)} (${TIMES[sl]||""}) لطبيب المسائي بسبب دوام مسائي`); }); });
      let clin=0;
      { const a=getSlot(d,di,"am"), b=getSlot(d,di,"pm"); if(!onLvP("am")&&a&&DIRECT_SLOTS.includes(a)&&!indiv.some(x=>x.period==="am"&&x.absentId===d.id)) clin++; if(!onLvP("pm")&&b&&DIRECT_SLOTS.includes(b)&&!indiv.some(x=>x.period==="pm"&&x.absentId===d.id)) clin++; }
      if(isEve) clin+=2;
      const covCnt=covs.length;
      totClin+=clin; totCov+=covCnt;
      rows.push(`<tr><td>${dmy(date)}</td><td>${DAYS[di]}</td><td>${amC}</td><td>${pmC}</td><td>${eveC}</td><td style="text-align:start;font-size:11px">${covs.join("<br>")||"—"}</td><td><b>${clin}</b></td><td><b>${covCnt}</b></td></tr>`);
    }
    const css = `<style>.we td{background:#f8fafc}.lv{color:#d12b30;font-weight:700}.aw{color:#b45309;font-weight:600}.ev{color:#6d28d9;font-weight:700;background:#ede9fe;border-radius:6px;padding:1px 8px}.tot td{background:#0d1b2a;color:#fff;font-weight:800;font-size:13px}.tt{font-size:11px;color:#64748b;margin:0 0 12px;background:#f6f9fc;border:1px solid #e8eef3;border-radius:10px;padding:9px 12px}thead th small{font-weight:500;opacity:.9}</style>`;
    const note = `<p class="tt">الفترات: <b>صباح 08:00–12:00</b> · <b>ظهر 13:00–16:00</b> · <b>مساء 16:00–23:00</b> (تُحتسب فترتين). «فترات الرعاية» تشمل المسائي ×2 والتغطيات المنفّذة.</p>`;
    const head = `<div class="dhead"><span class="dav">${sn(d.name).slice(0,2)}</span><div><div class="dnm">د.${d.name}</div><div class="dmt">${rankLabel(rankOf(d))} · الجدول الشهري التفصيلي · ${dmy(`${Y}-${String(Mo+1).padStart(2,"0")}-01`)} ← ${dmy(`${Y}-${String(Mo+1).padStart(2,"0")}-${String(last).padStart(2,"0")}`)}</div></div></div>`;
    const table = `<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>صباح<br><small>08:00–12:00</small></th><th>ظهر<br><small>13:00–16:00</small></th><th>مساء<br><small>16:00–23:00</small></th><th>التغطيات (بالأوقات)</th><th>فترات الرعاية</th><th>تغطيات</th></tr></thead><tbody>${rows.join("")}<tr class="tot"><td colspan="6">الإجمالي الشهري</td><td>${totClin}</td><td>${totCov}</td></tr></tbody></table>`;
    printDoc(`الجدول الشهري التفصيلي — د.${d.name} (${MONTHS[Mo]} ${Y})`, reportCSS+css+head+note+table, true);
  };

  return { printDoctor, printAll, printDepartment, printEveningReport, printCoverageReport, printDoctorTimetable };
}

        <div><label style={label}>الرمز السري</label><input value={nf.pin} onChange={e=>set("pin",e.target.value)} style={sIn} /></div>

function DoctorPortal({ doctor, doctors, leaves, nightData, coverages, today, fd }) {
  const now = new Date(today);
  const md = monthDays(now.getFullYear(), now.getMonth()).map(x=>x.date);
  const s = doctorSessions(doctor, md, nightData, coverages, leaves);
  const myLeaves = leaves.filter(l=>l.doctorId===doctor.id);
  const evDates = Object.entries(nightData).filter(([dt,nd])=>(nd.doctors||[]).includes(doctor.id) && dt.slice(0,7)===`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`).map(([dt])=>dt).sort();
  const myCovs = [];
  coverages.filter(c=>c.coverDoctorId===doctor.id).forEach(c=>myCovs.push({ date:c.date, period:c.period, ownerId:c.absentId }));
  Object.entries(nightData).forEach(([dt,nd])=>{ const cv=nd.coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===doctor.id) myCovs.push({ date:dt, period:sl, ownerId:null }); }); }); });
  myCovs.sort((a,b)=>a.date.localeCompare(b.date));
  const perTxt = p => p==="am"?"عيادة الصباح":p==="pm"?"عيادة الظهر":p==="nextAm"?"عيادة صباح الغد":"العيادة المسائية";
  const tiles = [["رعاية مباشرة",s.care,C.primary],["دعم",s.support,"#64748b"],["مسائي",s.evening,"var(--eve)"],["تغطيات",s.covers,"var(--primary-d)"],["إجمالي العمل",s.total,"var(--ink)"],["إجازات",myLeaves.length,C.warn]];
  return <div className="fade">
    <div style={{ ...card(), padding:"18px 18px", marginBottom:14, display:"flex", alignItems:"center", gap:12 }}>
      <Avatar doc={doctor} size={48}/>
      <div><div style={{ fontSize:17, fontWeight:800 }}>د.{doctor.name}</div><div style={{ fontSize:12, color:C.sub }}>{rankLabel(rankOf(doctor))} · هدف الرعاية {directTarget(doctor)} · {MONTHS[now.getMonth()]}</div></div>
    </div>
    <div style={{ display:"flex", flexWrap:"wrap", gap:10, marginBottom:14 }}>
      {tiles.map(([l,v,col])=><div key={l} style={{ ...card(), flex:"1 1 70px", padding:"14px 8px", textAlign:"center" }}><div style={{ fontSize:24, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{l}</div></div>)}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:10 }}>🏥 جدول العيادات</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:5 }}>
        {DAYS.map((dn,di)=>(<div key={di} style={{ textAlign:"center" }}>
          <div style={{ fontSize:10.5, color:C.sub, fontWeight:700, marginBottom:4 }}>{dn}</div>
          {["am","pm","eve"].map(p=>{ const sl=(doctor.sched?.[di]?.[p])||(p==="eve"&&(doctor.nightDays||[]).includes(di)?"clinic":""); const st=p==="eve"?{bg:sl?"#ECEAFE":"var(--surface2)",fg:"var(--eve)",t:"🌙 مسائي"}:slotStyle(sl); return <div key={p} style={{ background:st.bg, color:st.fg, fontSize:10.5, fontWeight:700, borderRadius:7, padding:"6px 2px", marginBottom:3, border:p==="eve"&&sl?"1px solid #C7BEFB":"none" }}>{sl?st.t:"—"}</div>; })}
        </div>))}
      </div>
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🌙 الدوام المسائي ({evDates.length})</div>
      {evDates.length? <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{evDates.map(dt=><span key={dt} style={{ background:"var(--eveSoft)", color:"var(--eve)", fontSize:11.5, fontWeight:700, borderRadius:8, padding:"5px 10px" }}>{dmy(dt)}</span>)}</div> : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🔄 التغطيات المؤدّاة ({myCovs.length})</div>
      {myCovs.length? myCovs.map((c,i)=>(<div key={i} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ color:C.muted, minWidth:78 }}>{dmy(c.date)}</span>
        <span style={{ flex:1 }}>{c.ownerId?`عيادة د.${fd(c.ownerId)?.name||""}`:"تغطية عيادة"} · {perTxt(c.period)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🏖 الإجازات ({myLeaves.length})</div>
      {myLeaves.length? myLeaves.map(l=>(<div key={l.id} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ flex:1 }}>{dmy(l.start)} ← {dmy(l.end)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
  </div>;
}

function App() {
  const [doctors, _setDoctors]     = useState(()=>{ const st=S.get("v2_docs"); return (st&&st.length)?st:SEED_DOCTORS; });
  const [leaves, _setLeaves]       = useState(()=>S.get("v2_leaves")||[]);
  const [nightData, _setNight]     = useState(()=>S.get("v2_night")||{});
  const [coverages, _setCoverages] = useState(()=>S.get("v2_cov")||[]);
  const undoRef = React.useRef([]);
  const [undoN, setUndoN] = useState(0);
  const [undoOpen, setUndoOpen] = useState(false);
  const pushUndo = label => {
    try{
      const now = Date.now();
      const last = undoRef.current[undoRef.current.length-1];
      if(last && last.label===label && (now-last.at)<5000){
        last.at = now; // ── نفس نوع التعديل خلال ٥ ثوانٍ → يُعامَل كخطوة منطقية واحدة (لا نكدّس عشرات الخطوات الصغيرة لعملية واحدة، مثل تعيين عدة عيادات مكشوفة تباعاً) ──
      } else {
        undoRef.current.push({ label, at:now, snap: JSON.stringify({ nightData, coverages, leaves, doctors }) });
        if(undoRef.current.length>25) undoRef.current.shift();
      }
      setUndoN(undoRef.current.length);
    }catch(e){}
  };
  const restoreToIndex = idx => {
    const it = undoRef.current[idx]; if(!it) return;
    try{
      const o = JSON.parse(it.snap);
      _setNight(o.nightData||{}); _setCoverages(o.coverages||[]); _setLeaves(o.leaves||[]); _setDoctors(o.doctors||[]);
      undoRef.current = undoRef.current.slice(0, idx); // نرجع لما قبل هذه الخطوة، فتُحذف هي وكل ما بعدها من القائمة
      setUndoN(undoRef.current.length);
      setUndoOpen(false);
      showToast(`↩︎ تمت الاستعادة إلى ما قبل: ${it.label}`);
    }catch(e){ showToast("تعذّر التراجع","err"); }
  };
  const doUndo = () => setUndoOpen(o=>!o); // الزر الآن يفتح لوحة الخطوات بدل التراجع الأعمى الفوري
  const setDoctors   = (v)=>{ pushUndo("تعديل الأطباء");   _setDoctors(v); };
  const setLeaves    = (v)=>{ pushUndo("تعديل الإجازات");  _setLeaves(v); };
  const setNight     = (v)=>{ pushUndo("تعديل المسائي");   _setNight(v); };
  const setCoverages = (v)=>{ pushUndo("تعديل التغطيات");  _setCoverages(v); };
  const [settings, setSettings]   = useState(()=>S.get("v2_settings")||{});
  const [holidays, setHolidays]   = useState(()=>S.get("v2_holidays")||[]);
  HOLIDAYS = buildHolidayMap(holidays);
  applyPosSSOverrides(settings?.adminPosSS);

  const [audit, setAudit]         = useState(()=>S.get("v2_audit")||[]);
  const [users, setUsers]         = useState(()=>{ const u=S.get("v2_users"); return (u&&u.length)?u:[{ id:uid(), username:"admin", pin:"0000", role:"head", doctorId:null }]; });
  const [session, setSession]     = useState(()=>S.get("v2_session")||null);
  const [official, setOfficial]   = useState(()=>{ const o=S.get("v2_official"); return o ? { nightData:o.nightData, coverages:o.coverages } : null; }); // تطبيع: نسخ قديمة كانت تخزّن الأطباء/الإجازات/الإعدادات أيضاً — الاعتماد الآن خاص بالجدول فقط
  const [collapsed, setCollapsed] = useState(()=>!!S.get("v2_navcollapsed"));
  const [sbOpen, setSbOpen] = useState(false);
  const [,forceDark] = useState(0);
  const [zoom,setZoom] = useState(()=>{ const z=+S.get("v2_zoom"); return (z>=0.9&&z<=1.3)?z:1; });
  const changeZoom = d => setZoom(z=>{ const n=Math.round(Math.min(1.3,Math.max(0.9,z+d))*100)/100; document.documentElement.style.setProperty("--z", n); document.documentElement.classList.toggle("zbig", n>1.05); S.set("v2_zoom", n); return n; });
  const toggleDark = () => { const dk=document.documentElement.getAttribute("data-theme")==="dark"; document.documentElement.setAttribute("data-theme", dk?"light":"dark"); S.set("v2_dark", !dk); if(THEMES[_tk]&&THEMES[_tk].dark){ setTimeout(()=>location.reload(),60); return; } forceDark(x=>x+1); };
  const [page, setPage]           = useState("dashboard");
  const [toast, setToast]         = useState(null);
  const [cloudReady, setCloudReady] = useState(false); // true بعد محاولة التحميل الأولى من السحابة (نجحت أو فشلت)
  const [cloudSyncState, setCloudSyncState] = useState("idle"); // idle | syncing | synced | error — المزامنة نشطة دائماً تلقائياً على كل جهاز
  useEffect(()=>S.set("v2_docs",doctors),[doctors]);
  useEffect(()=>S.set("v2_leaves",leaves),[leaves]);
  useEffect(()=>S.set("v2_night",nightData),[nightData]);
  useEffect(()=>S.set("v2_cov",coverages),[coverages]);
  useEffect(()=>S.set("v2_settings",settings),[settings]);
  useEffect(()=>{ S.set("v2_holidays",holidays); HOLIDAYS=buildHolidayMap(holidays); },[holidays]);
  useEffect(()=>S.set("v2_audit",audit),[audit]);
  useEffect(()=>S.set("v2_users",users),[users]);
  useEffect(()=>S.set("v2_session",session),[session]);
  useEffect(()=>S.set("v2_navcollapsed",collapsed),[collapsed]);
  // ── تصحيح ذاتي دائم وشامل — بمبدأ "التحقق المستمر" بدل ملاحقة كل حدث على حدة: كل تغطية (وكل مناوبة) تُعاد التحقق من صحتها الفعلية بكل مرة، بصرف النظر كيف نشأت أو كيف تغيّر سببها لاحقاً (إضافة/حذف/تعديل إجازة، إزالة مناوبة يدوياً، إلخ) — لو لم يعد للغياب سبب حقيقي قائم الآن، تُعتبر تغطية/مناوبة يتيمة وتُزال تلقائياً، بلا أي ثغرة متبقية ──
  // ── إصلاح بيانات قديمة: أي تغطية/إجازة تشترك بمعرّف مكرر تُعطى معرّفاً جديداً فريداً (نتيجة خلل المعرّف السابق) ──
  useEffect(()=>{
    const seen=new Set(); let dup=false; coverages.forEach(c=>{ if(seen.has(c.id)) dup=true; seen.add(c.id); });
    if(dup) _setCoverages(cs=>{ const u=new Set(); return cs.map(c=>{ if(u.has(c.id)) { const n={...c,id:uid()}; u.add(n.id); return n; } u.add(c.id); return c; }); });
  },[coverages]);
  useEffect(()=>{
    const seen=new Set(); let dup=false; leaves.forEach(l=>{ if(seen.has(l.id)) dup=true; seen.add(l.id); });
    if(dup) _setLeaves(ls=>{ const u=new Set(); return ls.map(l=>{ if(u.has(l.id)) { const n={...l,id:uid()}; u.add(n.id); return n; } u.add(l.id); return l; }); });
  },[leaves]);
  useEffect(()=>{
    let touchedNight=false, touchedCov=false; let fixedCount=0;
    // ── ربط كل ما يُزال بسبب إجازة بسجل الإجازة نفسها: مناوباته (eveRemoved) وتغطياته لغيره (displaced) — لتظهر في نافذة إجازته، وتُستعاد تلقائياً لو حُذفت الإجازة ──
    const leaveOf = (docId,ds,per) => leaves.find(l=>l.doctorId===docId && l.start<=ds && ds<=l.end && leaveHits(l,per));
    const leaveUpd = {}; // leaveId -> { eve:Set, disp:[] }
    const bump = (L) => (leaveUpd[L.id] = leaveUpd[L.id] || { eve:new Set(), disp:[] });

    // ١) مناوبته المسائية الخاصة به: يستحيل أن يكون مناوباً وهو بإجازة بنفس اليوم
    const n2 = {...nightData};
    const eveCovStale = new Set();
    Object.keys(n2).forEach(ds=>{
      const day = n2[ds]; if(!day || !(day.doctors||[]).length) return;
      const removed = day.doctors.filter(id=>{ const d=doctors.find(x=>x.id===id); return d && onLeave(d,ds,leaves,"eve"); });
      if(removed.length){
        n2[ds]={ ...day, doctors:day.doctors.filter(id=>!removed.includes(id)) }; touchedNight=true; fixedCount+=removed.length;
        removed.forEach(id=>{ const L=leaveOf(id,ds,"eve"); if(!L) return; bump(L).eve.add(ds);
          // تغطيات عياداته بسبب هذه المناوبة (نفس اليوم + راحة صباح اليوم التالي) — تُزال معها وتُحفظ بسجل الإجازة لتعود لو أُلغيت الإجازة
          coverages.forEach(c=>{ if(c.absentId!==id || eveCovStale.has(c)) return; if((c.reason==="evening" && c.date===ds) || (c.reason==="post_evening" && prevWorkDay(c.date)===ds)){ eveCovStale.add(c); bump(L).disp.push({ kind:"evecov", date:c.date, period:c.period, rec:c }); } }); });
      }
    });

    // ١ب) تغطيات "دوام مسائي" المدمجة بجدول اليوم نفسه (am/pm/nextAm) — يتيمة لو لم يبقَ أي طبيب مناوب فعلياً تلك الفترة يملك عيادة مطابقة (بعد إزالة إجازاتهم أعلاه)
    Object.keys(n2).forEach(ds=>{
      const day = n2[ds]; if(!day || !day.coverages) return;
      const di0 = dayIdx(ds), ndi = dayIdx(nextWork(ds));
      const cv = {...day.coverages}; let cvChanged=false;
      ["am","pm"].forEach(sl=>{ if((cv[sl]||[]).length && !(day.doctors||[]).some(id=>{ const o=doctors.find(x=>x.id===id); return o && isClinic(getSlot(o,di0,sl)); })){ cv[sl]=[]; cvChanged=true; fixedCount++; } });
      if((cv.nextAm||[]).length && !(day.doctors||[]).some(id=>{ const o=doctors.find(x=>x.id===id); return o && isClinic(getSlot(o,ndi,"am")); })){ cv.nextAm=[]; cvChanged=true; fixedCount++; }
      if(cvChanged){ n2[ds]={ ...n2[ds], coverages:cv }; touchedNight=true; }
    });

    // ١ج) تغطيات مدمجة بالمسائي (صباح/ظهر/صباح الغد) يؤديها طبيب أصبح بإجازة ذلك اليوم — تُزال وتُربط بإجازته لإعادة تعيين بديل
    Object.keys(n2).forEach(ds=>{
      const day = n2[ds]; if(!day || !day.coverages) return;
      const di0 = dayIdx(ds), nDate = nextWork(ds), ndi = dayIdx(nDate);
      const cv = {...day.coverages}; let cvChanged=false;
      [["am",ds,di0,"am"],["pm",ds,di0,"pm"],["nextAm",nDate,ndi,"am"]].forEach(([sl,date,sdi,per])=>{
        const ids = cv[sl]||[];
        const gone = ids.filter(id=>{ const d=doctors.find(x=>x.id===id); return d && onLeave(d,date,leaves,per); });
        if(!gone.length) return;
        cv[sl] = ids.filter(id=>!gone.includes(id)); cvChanged=true; fixedCount+=gone.length;
        const owner = (day.doctors||[]).find(id=>{ const o=doctors.find(x=>x.id===id); return o && isClinic(getSlot(o,sdi,per)); });
        gone.forEach(id=>{ const L=leaveOf(id,date,per); if(L) bump(L).disp.push({ kind:"night", dayKey:ds, slot:sl, date, period:per, ownerId:owner??null, coverId:id }); });
      });
      if(cvChanged){ n2[ds]={ ...n2[ds], coverages:cv }; touchedNight=true; }
    });

    // ٢) كل تغطية: هل ما زال للطبيب الغائب سبب فعلي حقيقي يستدعيها اليوم؟ (إجازة قائمة الآن، أو مناوبة مسائية فعلية نفس اليوم، أو مناوبة اليوم السابق لراحة ما بعد المسائي)
    const ownerJustified = c => {
      const d = doctors.find(x=>x.id===c.absentId); if(!d) return false;
      if(onLeave(d, c.date, leaves, c.period)) return true;                                        // غائب فعلاً بإجازة قائمة هذا اليوم
      if(((n2[c.date]||{}).doctors||[]).includes(c.absentId)) return true;                // مناوب مسائياً فعلاً نفس اليوم (عيادته تحتاج تغطية بسببها)
      const pw = prevWorkDay(c.date);
      if(pw && ((n2[pw]||{}).doctors||[]).includes(c.absentId)) return true;              // كان مناوباً اليوم السابق (راحة ما بعد المسائي)
      return false;
    };
    const staleIds = new Set(eveCovStale);
    coverages.forEach(c=>{
      if(!ownerJustified(c)){ staleIds.add(c); return; }
      const coverDoc = doctors.find(x=>x.id===c.coverDoctorId);
      if(coverDoc && onLeave(coverDoc, c.date, leaves, c.period)){                                  // المغطّي نفسه أصبح بإجازة — تُزال وتُربط بإجازته لإعادة تعيين بديل
        staleIds.add(c);
        const L=leaveOf(c.coverDoctorId,c.date,c.period); if(L) bump(L).disp.push({ kind:"cov", date:c.date, period:c.period, ownerId:c.absentId, coverId:c.coverDoctorId, rec:c });
      }
    });
    if(staleIds.size){ touchedCov=true; fixedCount+=staleIds.size; }

    if(!touchedNight && !touchedCov) return;
    if(touchedNight) _setNight(()=>n2);
    if(touchedCov) _setCoverages(cs=>cs.filter(c=>!staleIds.has(c))); // الحذف بالسجل نفسه لا بالمعرّف (حماية من أي معرّف مكرر قديم)
    if(Object.keys(leaveUpd).length) _setLeaves(ls=>ls.map(l=>{ const u=leaveUpd[l.id]; if(!u) return l;
      return { ...l, eveRemoved:[...new Set([...(l.eveRemoved||[]), ...u.eve])], displaced:[...(l.displaced||[]), ...u.disp] }; }));
    logAudit&&logAudit(`تصحيح تلقائي: إزالة ${fixedCount} تكليف (مناوبة/تغطية) لم يعد له سبب فعلي قائم`);
  },[leaves, nightData, coverages]);

  // ── تصحيح ذاتي إضافي: تغطية سببها "دوام مسائي" يجب أن تُحذف تلقائياً بمجرد زوال ذلك المسائي نفسه (أياً كان سبب إزالته — إجازة، تبديل، تعديل يدوي، إلخ) — لا تبقى تغطية معلَّقة لمناوبة لم تعد موجودة ──
  useEffect(()=>{
    const orphaned = coverages.filter(c=>{
      if(c.reason==="evening") return !((nightData[c.date]||{}).doctors||[]).includes(c.absentId);
      if(c.reason==="post_evening") return !((nightData[prevWorkDay(c.date)]||{}).doctors||[]).includes(c.absentId);
      return false;
    });
    if(!orphaned.length) return;
    const ids = new Set(orphaned);
    _setCoverages(cs=>cs.filter(c=>!ids.has(c)));
    logAudit&&logAudit(`تصحيح تلقائي: إزالة ${orphaned.length} تغطية لم يعد لها مناوبة مسائية مرتبطة بها`);
  },[nightData, coverages]);

  useEffect(()=>{ if(official) S.set("v2_official",official); },[official]);

  // ── تحميل أوّلي من السحابة عند فتح التطبيق: لو فيه بيانات مشتركة محفوظة، تحل محل النسخة المحلية فوراً ──
  const [cloudSafeToSave, setCloudSafeToSave] = useState(false); // لا يُسمح بالحفظ للسحابة إلا بعد نجاح التحميل فعلياً — لمنع الكتابة فوق البيانات الحقيقية بنسخة محلية فارغة عند أي فشل اتصال
  useEffect(()=>{ (async()=>{
    try{

      if(remote){
        if(remote.doctors) _setDoctors(remote.doctors);

        if(remote.coverages) _setCoverages(remote.coverages);
        if(remote.settings) setSettings(remote.settings);

      }

      setOfficial(remote?.official ? { nightData:remote.official.nightData, coverages:remote.official.coverages } : { nightData: remote?.nightData || nightData, coverages: remote?.coverages || coverages });

      setCloudSyncState("synced"); setCloudSafeToSave(true);
      if(remote) cloudBackupIfDue(remote); // نسخة احتياطية أسبوعية تلقائية صامتة — لا تعطّل أي شيء لو فشلت
    }catch(e){

      setOfficial(o=>o || { nightData, coverages }); // نهيّئ محلياً على الأقل حتى تعمل شارة "معتمد/غير معتمد" بشكل صحيح دون اتصال
      setCloudSyncState("error"); setCloudSafeToSave(false);
      setTimeout(()=>showToast("⚠️ تعذّر الاتصال بالسحابة — تعمل الآن بنسخة محلية فقط ولن تُزامَن تعديلاتك حتى تضغط ☁️ لإعادة المحاولة","err"),400);

  // ── حفظ تلقائي مؤجَّل (debounce) للسحابة عند أي تغيير في البيانات المشتركة — فقط بعد تأكيد نجاح التحميل الأوّلي (cloudSafeToSave)، لمنع الكتابة فوق بيانات الأجهزة الأخرى بنسخة محلية ناقصة عند أي عطل اتصال ──
  const cloudSaveTimer = React.useRef(null);

            {undoN>0 && <span style={{ position:"absolute", top:-5, insetInlineEnd:-5, background:C.err, color:"#fff", fontSize:10, fontWeight:800, borderRadius:20, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px" }}>{undoN}</span>}

          {undoN>0 && <span style={{ position:"absolute", top:-5, insetInlineEnd:-5, background:C.err, color:"#fff", fontSize:10, fontWeight:800, borderRadius:20, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px" }}>{undoN}</span>}
        </button>
        <button className="icobtn bell" title="التنبيهات" onClick={()=>setPage("alerts")}><span className="n"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button className="icobtn" onClick={logout} title="تسجيل الخروج" style={{ color:C.err, borderColor:"#fecaca" }}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
      <div className="content">
        {pending && <div style={{ background:"var(--warnSoft)", border:`1px solid ${C.warn}`, borderRadius:14, padding:"12px 14px", marginBottom:14, boxShadow:"0 8px 22px rgba(224,152,43,.18)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom: diffList.length?9:0 }}>
            <span style={{ fontSize:13, fontWeight:800, color:C.warn }}>🟡 الجدول الشهري فيه تعديلات غير معتمدة</span>
            <span style={{ fontSize:11.5, color:C.sub }}>الرابط الحي والإحصائيات تعرض آخر نسخة معتمدة حتى تعتمد</span>
            <div style={{ display:"flex", gap:8, marginInlineStart:"auto", flexWrap:"wrap" }}>
              <button onClick={()=>{ if(confirm("تراجع عن كل التغييرات غير المعتمدة؟")) revert(); }} style={{ ...sGhost, color:C.err, borderColor:"#fecaca", padding:"8px 14px", fontSize:12.5 }}>↩︎ تراجع</button>
              {canApprove
                ? <button onClick={approve} style={{ display:"flex", alignItems:"center", gap:8, background:GRAD(`linear-gradient(135deg,${C.primary},var(--primary-d))`), color:"#fff", border:"none", borderRadius:12, padding:"10px 20px", fontSize:14, fontWeight:800, cursor:"pointer", boxShadow:_FLAT?"none":"0 6px 16px rgba(15,163,154,.35)", fontFamily:"inherit" }}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ width:19, height:19 }}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                    حفظ واعتماد{cloudCfg()?" ونشر":""}
                  </button>
                : <span style={{ fontSize:12, color:C.warn, fontWeight:700, alignSelf:"center" }}>بانتظار اعتماد رئيس القسم</span>}
            </div>
          </div>
          {diffList.length>0 && <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            {diffList.map((t,i)=><span key={i} style={{ fontSize:11, fontWeight:700, color:C.warn, background:"var(--surface)", border:`1px solid ${C.warn}55`, borderRadius:20, padding:"3px 10px" }}>{t}</span>)}
          </div>}
        </div>}
        {pageEl}
      </div>
    </div>
    <div className={"scrim2"+(sbOpen?" show":"")} onClick={()=>setSbOpen(false)} />
    {undoOpen && <UndoPanel items={undoRef.current} onRestore={restoreToIndex} onClose={()=>setUndoOpen(false)} />}
    <Toast toast={toast} />
  </div>;
}

// ── حاجز أخطاء يعرض الخطأ الفعلي على الشاشة مباشرة بدل صفحة بيضاء صامتة — يسمح بمعرفة السبب من أي جهاز بلا أدوات مطوّرين ──
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err:null, info:null }; }
  static getDerivedStateFromError(err){ return { err }; }
  componentDidCatch(err, info){ this.setState({ info }); console.error("Render error:", err, info); }
  render(){
    if(this.state.err){
      return React.createElement("div", { style:{ direction:"rtl", fontFamily:"sans-serif", padding:22, background:"#fff5f5", minHeight:"100vh", color:"#7f1d1d" } },
        React.createElement("div", { style:{ fontSize:18, fontWeight:800, marginBottom:10 } }, "⚠️ حدث خطأ برمجي — التقط صورة لهذه الشاشة وأرسلها"),
        React.createElement("div", { style:{ fontSize:14, fontWeight:700, marginBottom:8, whiteSpace:"pre-wrap" } }, String(this.state.err && (this.state.err.message||this.state.err))),
        React.createElement("pre", { style:{ fontSize:11, background:"#fff", border:"1px solid #fca5a5", borderRadius:8, padding:12, overflowX:"auto", whiteSpace:"pre-wrap", direction:"ltr", textAlign:"left" } }, String((this.state.err && this.state.err.stack) || "") + "\n\n" + String((this.state.info && this.state.info.componentStack) || "")),
        React.createElement("button", { onClick:()=>location.reload(), style:{ marginTop:14, padding:"10px 18px", fontSize:14, fontWeight:700, background:"#dc2626", color:"#fff", border:"none", borderRadius:8, cursor:"pointer" } }, "🔄 إعادة تحميل الصفحة")
      );
    }
    return this.props.children;
  }
}
window.addEventListener("error", e=>{
  const root = document.getElementById("root");
  if(root && !root.hasChildNodes()){
    root.innerHTML = `<div style="direction:rtl;font-family:sans-serif;padding:22px;background:#fff5f5;min-height:100vh;color:#7f1d1d"><div style="font-size:18px;font-weight:800;margin-bottom:10px">⚠️ خطأ قبل بدء التطبيق — التقط صورة لهذه الشاشة وأرسلها</div><div style="font-size:14px;font-weight:700;white-space:pre-wrap">${(e.message||"").replace(/</g,"&lt;")}</div><pre style="font-size:11px;background:#fff;border:1px solid #fca5a5;border-radius:8px;padding:12px;overflow-x:auto;white-space:pre-wrap;direction:ltr;text-align:left">${((e.error&&e.error.stack)||"").replace(/</g,"&lt;")}\nفي: ${(e.filename||"")}:${e.lineno||""}:${e.colno||""}</pre></div>`;
  }
});

const container = document.getElementById("root");
ReactDOM.createRoot(container).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
