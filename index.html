      return { doc, fixedN, extraN, covs, load:Math.max(0,(extraN*2)+covs-absD) };
    }).filter(s=>s.fixedN||s.extraN||s.covs).sort((a,b)=>b.load-a.load);
    const rows = stats.map(s=>`<tr><td>${s.doc.name}</td><td style="text-align:center">${s.fixedN}</td><td style="text-align:center">${s.extraN}</td><td style="text-align:center">${s.covs}</td><td style="text-align:center;font-weight:bold">${s.load}</td></tr>`).join("");
    const totalN = stats.reduce((a,s)=>a+s.fixedN+s.extraN,0);
    const totalC = stats.reduce((a,s)=>a+s.covs,0);
    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>تقرير ${MONTHS[month.m]} ${month.y}</title>
    <style>body{font-family:Tahoma,sans-serif;padding:24px;direction:rtl;color:#1e293b}h1{text-align:center;font-size:22px;margin-bottom:2px}.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
    .cards{display:flex;gap:14px;justify-content:center;margin-bottom:24px}.card{border:1px solid #e2e8f0;border-radius:12px;padding:16px 24px;text-align:center}.card .n{font-size:28px;font-weight:800;color:#1e3a5f}.card .l{font-size:12px;color:#64748b}
    table{width:100%;border-collapse:collapse}th{background:#1e3a5f;color:#fff;padding:9px}td{border:1px solid #e2e8f0;padding:8px}tr:nth-child(even){background:#f8fafc}
    .btn{position:fixed;top:12px;left:12px;background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:700}@media print{.btn{display:none}}</style></head><body>
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <h1>التقرير الشهري</h1><div class="sub">مركز طب الأسنان التخصصي — قسم إصلاح الأسنان — ${MONTHS[month.m]} ${month.y}</div>
    ${isApproved ? `<div style="text-align:center;margin-bottom:14px"><span style="display:inline-block;border:2px solid #15803d;color:#15803d;border-radius:8px;padding:4px 16px;font-weight:bold;font-size:13px">✅ نسخة معتمدة</span></div>` : `<div style="text-align:center;margin-bottom:14px"><span style="display:inline-block;border:2px solid #d97706;color:#d97706;border-radius:8px;padding:4px 16px;font-weight:bold;font-size:13px">📝 مسوّدة — غير معتمدة</span></div>`}
    <div class="cards"><div class="card"><div class="n">${totalN}</div><div class="l">إجمالي الدوام المسائي</div></div><div class="card"><div class="n">${totalC}</div><div class="l">إجمالي التغطيات</div></div><div class="card"><div class="n">${stats.length}</div><div class="l">أطباء مشاركون</div></div></div>
    <table><thead><tr><th>الطبيب</th><th>مسائي ثابت</th><th>مسائي إضافي</th><th>تغطيات</th><th>العبء الإضافي</th></tr></thead><tbody>${rows||'<tr><td colspan=5 style="text-align:center">لا بيانات</td></tr>'}</tbody></table>
    <div style="margin-top:30px;text-align:left;font-size:13px;color:#1e293b;border-top:2px solid #e2e8f0;padding-top:14px;width:240px"><div style="font-weight:bold">رئيس قسم إصلاح الأسنان</div><div style="margin-top:6px">د. أمل العسكر</div><div style="margin-top:18px;color:#94a3b8">التوقيع: ............................</div></div>
    </body></html>`;
    setPreviewHtml(html);
  };

  const exportBackup = () => {
    const data = { docs:S.get("fin_docs"), leaves:S.get("fin_leaves"), night:S.get("fin_night"), cov:S.get("fin_cov"), exported:new Date().toISOString() };
    downloadFile(JSON.stringify(data,null,2), `نسخة_احتياطية_${new Date().toISOString().split("T")[0]}.json`, "application/json");
  };

  // Summary counts
  const summary = useMemo(() => {
    let assigned=0, pending=0, totalCov=0;
    calDays.forEach(({date,di}) => {
      const nd = nightData[date];
      if (nd?.doctors?.length) {
        assigned++;
        const nextDi = dayIdx(nextWork(date));
        const covs = nd.coverages||{};
        nd.doctors.forEach(did=>{
          const d = fd(did); if(!d) return;
          if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
          if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
          if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
        });
        totalCov += (covs.am||[]).length+(covs.pm||[]).length+(covs.nextAm||[]).length;
      }
    });
    return { assigned, pending, totalCov, indiv: coverages.filter(c=>{const [y,m]=c.date.split("-");return +y===month.y&&+m===month.m+1;}).length };
  }, [nightData, coverages, calDays, month]);

  const filledDays = calDays.filter(({date}) => {
    const nd = nightData[date];
    const hasCov = coverages.some(c=>c.date===date);
    // show any day that exists in nightData (even empty, just created), has coverages, or is selected
    const has = (nd?.doctors?.length) || hasCov || (nd && date===selDate);
    if (filter==="all") return has;
    if (filter==="pending") {
      if (!nd?.doctors?.length) return false;
      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    if (filter==="done") {
      if (!nd?.doctors?.length) return false;
      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return !nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    return has;
  }).filter(({date,di,day}) => {
    if (!search.trim()) return true;
    const q = search.trim();
    // match by date number or doctor name
    if (String(day).includes(q) || date.includes(q) || DAYS[di].includes(q)) return true;
    const nd = nightData[date]||{};
    const names = [...(nd.doctors||[]), ...(nd.coverages?.am||[]), ...(nd.coverages?.pm||[]), ...(nd.coverages?.nextAm||[])].map(id=>fd(id)?.name||"").join(" ");
    const covNames = coverages.filter(c=>c.date===date).map(c=>fd(c.coverDoctorId)?.name||"").join(" ");
    return (names+" "+covNames).includes(q);
  });

  return (
    <div style={{ display:"flex", gap:14 }}>
      <div style={{ flex:1, minWidth:0 }}>
        {/* 1) Month nav + stat boxes */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
          <button onClick={()=>setMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})} style={Btn.nav}>→</button>
          <div style={{ fontWeight:800, fontSize:16, minWidth:120, textAlign:"center" }}>{MONTHS[month.m]} {month.y}</div>
          <button onClick={()=>setMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})} style={Btn.nav}>←</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:14 }}>
          {[{l:"أيام معيّنة",v:summary.assigned,c:"#1d4ed8",bg:"#eff6ff"},
            {l:"تغطيات معلّقة",v:summary.pending,c:"#dc2626",bg:"#fef2f2"},
            {l:"تغطيات مُعيّنة",v:summary.totalCov,c:"#15803d",bg:"#f0fdf4"},
            {l:"تغطيات فردية",v:summary.indiv,c:"#ea580c",bg:"#fff7ed"},
          ].map(({l,v,c,bg})=>(
            <div key={l} style={{ background:bg, borderRadius:11, padding:"12px 6px", textAlign:"center" }}>
              <div style={{ fontSize:26, fontWeight:800, color:c }}>{v}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>{l}</div>
            </div>
          ))}
        </div>

        {/* 2) Tools & commands (collapsible) */}
        <div style={{ background:"#fff", border:"1px solid #eef2f7", borderRadius:12, marginBottom:14, overflow:"hidden" }}>
          <div onClick={()=>setShowTools(s=>!s)} style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 14px", cursor:"pointer", background:"#f8fafc" }}>
            <span style={{ fontWeight:700, fontSize:13, flex:1 }}>⚙️ الأوامر والخيارات</span>
            <span style={{ fontSize:12, color:"#94a3b8" }}>{showTools?"▲ إخفاء":"▼ عرض"}</span>
          </div>
          {showTools && (
            <div style={{ padding:14, display:"flex", flexWrap:"wrap", gap:8 }}>
              <button onClick={()=>onAutoFill(month.y,month.m,"gaps")} style={{ ...Btn.primary, background:"linear-gradient(135deg,#1e3a5f,#2c5282)" }}>⚡ إكمال الناقص</button>
              <button onClick={()=>onAutoFill(month.y,month.m,"all")} style={{ ...Btn.nav, color:"#2c5282", borderColor:"#cdddec" }}>🔄 توزيع كامل</button>
              <button onClick={()=>{ const pm = month.m===0?{y:month.y-1,m:11}:{y:month.y,m:month.m-1}; onCopyMonth(pm.y,pm.m,month.y,month.m); }} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>📋 نسخ الشهر السابق</button>
              <button onClick={()=>setShowSwap(s=>!s)} style={{ ...Btn.nav, color:"#7c3aed", borderColor:"#ddd6fe" }}>🔁 تبديل مناوبين</button>
              <span style={{ width:1, background:"#e2e8f0", margin:"0 2px" }} />
              <button onClick={printPDF} style={{ ...Btn.nav, color:"#15803d", borderColor:"#bbf7d0" }}>🖨️ جدول</button>
              <button onClick={printCalendar} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>📅 تقويم</button>
              <button onClick={printBoxes} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>🔲 مربعات</button>
              <button onClick={printReport} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>📄 تقرير شهري</button>
              <button onClick={printDoctorSheets} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>🗂️ أوراق الأطباء</button>
              <span style={{ width:1, background:"#e2e8f0", margin:"0 2px" }} />
              <button onClick={exportExcel} style={{ ...Btn.nav, color:"#15803d", borderColor:"#bbf7d0" }}>📊 Excel</button>
              <button onClick={exportICS} style={{ ...Btn.nav, color:"#2c5282", borderColor:"#cdddec" }}>📆 تقويم الجوال</button>
              <button onClick={shareWhatsApp} style={{ ...Btn.nav, color:"#16a34a", borderColor:"#bbf7d0" }}>📲 واتساب</button>
              <span style={{ width:1, background:"#e2e8f0", margin:"0 2px" }} />
              {confirmClear ? (
                <span style={{ display:"inline-flex", gap:4, alignItems:"center" }}>
                  <span style={{ fontSize:11, color:"#dc2626", fontWeight:700 }}>متأكد؟</span>
                  <button onClick={()=>{ onClearMonth(month.y,month.m); setConfirmClear(false); }} style={{ ...Btn.nav, background:"#dc2626", color:"#fff", border:"none" }}>نعم، صفّر</button>
                  <button onClick={()=>setConfirmClear(false)} style={Btn.nav}>إلغاء</button>
                </span>
              ) : (
                <button onClick={()=>setConfirmClear(true)} style={{ ...Btn.nav, color:"#dc2626", borderColor:"#fecaca" }}>🗑️ تصفير الشهر</button>
              )}
            </div>
          )}
        </div>

        {/* 3) Date picker + search + status filter */}
        <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center", background:"#fff", border:"1px solid #eef2f7", borderRadius:12, padding:12 }}>
          <input type="date" style={{ ...SEL, width:"auto", flex:"0 0 auto" }} onChange={e=>{ if(e.target.value){ if(dayIdx(e.target.value)<0){ return; } onEnsureDay(e.target.value); setSelDate(e.target.value); setMonth({ y:+e.target.value.split("-")[0], m:+e.target.value.split("-")[1]-1 }); } }} value="" />
          <input type="text" placeholder="🔍 بحث باسم طبيب أو تاريخ..." value={search} onChange={e=>setSearch(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 180px", minWidth:140 }} />
          {search && <button onClick={()=>setSearch("")} style={{ ...Btn.nav, color:"#dc2626" }}>✕</button>}
          <div style={{ flex:1 }} />
          {[["all","الكل"],["pending","⚠️ معلّق"],["done","✅ مكتمل"]].map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{ padding:"5px 12px", borderRadius:7, fontSize:11, fontWeight:700, cursor:"pointer", border: filter===k?"2px solid #1e3a5f":"1px solid #e2e8f0", background: filter===k?"#eff4fa":"#fff", color: filter===k?"#1e3a5f":"#64748b" }}>{l}</button>
          ))}
        </div>

        {/* Calendar (secondary, toggle) */}
        {showCal && (
          <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", border:"1px solid #e2e8f0", marginBottom:16 }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", background:"#0f172a" }}>
              {DAYS.map(d => <div key={d} style={{ padding:"8px", textAlign:"center", color:"#93b4d8", fontWeight:700, fontSize:11 }}>{d}</div>)}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
              {Array.from({ length:firstOffset }, (_,i) => <div key={`e${i}`} style={{ minHeight:70, background:"#f8fafc", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9" }} />)}
              {calDays.map(({ date, di, day }) => {
                const nd = nightData[date] || {};
                const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                const covs = nd.coverages || {};
                const isT = date===today; const isSel = selDate===date;
                return (
                  <div key={date} onClick={() => setSelDate(isSel?null:date)}
                    style={{ minHeight:70, padding:"4px 5px", cursor:"pointer", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9",
                      background: isSel?"#eff6ff":isT?"#fffbeb":"#fff", outline: isSel?"2px solid #2563eb":isT?"2px solid #f59e0b":"none" }}>
                    <div style={{ fontSize:9, color:isT?"#d97706":"#94a3b8", fontWeight:isT?700:400, marginBottom:2 }}>{day}</div>
                    {docs.map(d => <div key={d.id} style={{ background:d.color+"22", border:`1px solid ${d.color}55`, borderRadius:3, padding:"1px 4px", marginBottom:1, fontSize:8, fontWeight:700, color:d.color }}>🌙 {d.name}</div>)}
                    {!docs.length && <div style={{ fontSize:8, color:"#d1d5db", textAlign:"center", paddingTop:8 }}>—</div>}
                    {(covs.am||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#15803d" }}>(ص) {d.name}</div>)}
                    {(covs.pm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#0891b2" }}>(ظ) {d.name}</div>)}
                    {(covs.nextAm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#1e3a5f" }}>(غد ص) {d.name}</div>)}
                    {coverages.filter(c=>c.date===date).map(c=>{const cd=fd(c.coverDoctorId);return cd&&<div key={c.id} style={{ fontSize:7, color:"#ea580c" }}>(تغطية) {cd.name}</div>;})}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Swap panel */}
        {showSwap && (
          <div style={{ background:"#faf5ff", border:"1px solid #ddd6fe", borderRadius:12, padding:16, marginBottom:16 }}>
            <div style={{ fontWeight:700, fontSize:14, color:"#6d28d9", marginBottom:10 }}>🔁 تبديل مناوبين عبر الشهر كامل</div>
            <div style={{ fontSize:11, color:"#94a3b8", marginBottom:12 }}>كل مناوبات وتغطيات الطبيب الأول تنتقل للثاني والعكس.</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
              <select value={swapA} onChange={e=>setSwapA(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 140px" }}>
                <option value="">الطبيب الأول...</option>
                {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <span style={{ fontSize:18 }}>⇄</span>
              <select value={swapB} onChange={e=>setSwapB(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 140px" }}>
                <option value="">الطبيب الثاني...</option>
                {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <button onClick={()=>{ onSwap(+swapA,+swapB); setSwapA(""); setSwapB(""); setShowSwap(false); }}
                style={{ background:"#7c3aed", color:"#fff", border:"none", borderRadius:8, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>تبديل</button>
            </div>
          </div>
        )}

        {/* Approval bar */}
        <div style={{ background: isApproved?"#f0fdf4":"#fff7ed", border:`1px solid ${isApproved?"#bbf7d0":"#fed7aa"}`, borderRadius:12, padding:"12px 16px", marginBottom:16, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
          <span style={{ fontSize:22 }}>{isApproved?"✅":"📝"}</span>
          <div style={{ flex:1, minWidth:140 }}>
            <div style={{ fontWeight:700, fontSize:14, color: isApproved?"#15803d":"#c2410c" }}>
              {isApproved ? `الجدول معتمد — ${MONTHS[month.m]} ${month.y}` : `مسوّدة — ${MONTHS[month.m]} ${month.y}`}
            </div>
            <div style={{ fontSize:11, color:"#94a3b8" }}>
              {isApproved ? `اعتُمد بتاريخ ${new Date(isApproved).toLocaleDateString("ar")}` : "اعتمد الجدول قبل إرساله للأطباء"}
            </div>
          </div>
          {isApproved ? (
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              <button onClick={shareWhatsApp} style={{ background:"#16a34a", color:"#fff", border:"none", borderRadius:8, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>📲 مشاركة الجدول للجميع</button>
              <button onClick={()=>onApprove(monthKey, null)} style={{ ...Btn.nav, color:"#dc2626", borderColor:"#fecaca" }}>↩️ إلغاء الاعتماد (تعديل)</button>
            </div>
          ) : (
            <button onClick={()=>onApprove(monthKey, new Date().toISOString())} style={{ background:"#15803d", color:"#fff", border:"none", borderRadius:8, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>✅ اعتماد نهائي</button>
          )}
        </div>

        {/* Sub-tabs: night schedule vs extra coverages */}
        <div style={{ display:"flex", gap:8, marginBottom:14 }}>
          <button onClick={()=>setSubTab("night")} style={{ flex:1, padding:"11px", borderRadius:10, border:"none", cursor:"pointer", fontSize:14, fontWeight:700, background: subTab==="night"?"linear-gradient(135deg,#1e3a5f,#2c5282)":"#fff", color: subTab==="night"?"#fff":"#64748b", boxShadow: subTab==="night"?"0 4px 12px rgba(30,58,95,.25)":"0 1px 4px rgba(0,0,0,.05)" }}>🌙 الدوام المسائي وتغطياته</button>
          <button onClick={()=>setSubTab("extra")} style={{ flex:1, padding:"11px", borderRadius:10, border:"none", cursor:"pointer", fontSize:14, fontWeight:700, background: subTab==="extra"?"linear-gradient(135deg,#ea580c,#f97316)":"#fff", color: subTab==="extra"?"#fff":"#64748b", boxShadow: subTab==="extra"?"0 4px 12px rgba(234,88,12,.25)":"0 1px 4px rgba(0,0,0,.05)" }}>🔄 التغطيات الإضافية (طارئة)</button>
        </div>

        {subTab==="extra" ? (
          <ExtraCoveragesView date={null} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} calDays={calDays} month={month} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} />
        ) : (
        /* 4) MAIN: section header + view toggle */
        <div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
            <span style={{ fontWeight:800, fontSize:15 }}>🌙 الدوام المسائي</span>
            <span style={{ fontSize:12, fontWeight:400, color:"#94a3b8" }}>({filledDays.length} يوم)</span>
            <div style={{ flex:1 }} />
            <span style={{ fontSize:11, color:"#64748b" }}>طريقة العرض:</span>
            <div style={{ display:"flex", gap:0, border:"1px solid #cdddec", borderRadius:8, overflow:"hidden" }}>
              <button onClick={()=>setViewMode("table")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="table"?"#1e3a5f":"#fff", color: viewMode==="table"?"#fff":"#64748b" }}>📋 جدول</button>
              <button onClick={()=>setViewMode("boxes")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="boxes"?"#1e3a5f":"#fff", color: viewMode==="boxes"?"#fff":"#64748b" }}>🔲 مربعات</button>
              <button onClick={()=>setViewMode("calendar")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="calendar"?"#1e3a5f":"#fff", color: viewMode==="calendar"?"#fff":"#64748b" }}>📅 تقويم</button>
            </div>
          </div>
          {filledDays.length === 0 ? (
            <div style={{ textAlign:"center", color:"#94a3b8", padding:"34px 16px", fontSize:14, background:"linear-gradient(135deg,#f8fafc,#eff4fa)", borderRadius:14, border:"2px dashed #cdddec" }}>
              ✨ لا توجد أيام بعد — افتح ⚙️ الأوامر واضغط <strong>⚡ إكمال الناقص</strong> أو اختر تاريخاً
            </div>
          ) : viewMode==="table" ? (
            <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", boxShadow:"0 4px 16px rgba(30,58,95,.06)" }}>
              {/* Column header */}
              <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", background:"#1e3a5f", color:"#fff", fontSize:13, fontWeight:700 }}>
                <div style={{ minWidth:54, textAlign:"center" }}>التاريخ</div>
                <div style={{ minWidth:75 }}>اليوم</div>
                <div style={{ flex:1 }}>الدوام المسائي والتغطيات</div>
                <div style={{ minWidth:70, textAlign:"center" }}>الحالة</div>
                <div style={{ width:16 }} />
              </div>
              <div style={{ display:"flex", flexDirection:"column" }}>
                {filledDays.map(({ date, di, day }) => (
                  <DayCard key={date} date={date} di={di} day={day}
                    nd={nightData[date]||{}} indiv={coverages.filter(c=>c.date===date)}
                    doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd}
                    expanded={selDate===date} onToggle={()=>setSelDate(selDate===date?null:date)}
                    onAddDoc={onAddDoc} onRemoveDoc={onRemoveDoc} onAddCov={onAddCov} onRemoveCov={onRemoveCov} onResetDay={onResetDay} onSetNote={onSetNote} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} />
                ))}
              </div>
            </div>
          ) : viewMode==="boxes" ? (
            /* Boxes view */
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))", gap:12 }}>
              {filledDays.map(({ date, di, day }) => {
                const nd = nightData[date]||{}; const covs = nd.coverages||{};
                const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                const indiv = coverages.filter(c=>c.date===date);
                const isSel = selDate===date;
                return (
                  <div key={date} onClick={()=>setSelDate(isSel?null:date)} style={{ background:"#fff", borderRadius:12, border: isSel?"2px solid #2c5282":"1px solid #eef2f7", overflow:"hidden", cursor:"pointer", boxShadow:"0 2px 8px rgba(30,58,95,.05)" }}>
                    <div style={{ background:"#1e3a5f", color:"#fff", padding:"7px 12px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontWeight:800, fontSize:16 }}>{day}/{month.m+1}</span>
                      <span style={{ fontSize:12, fontWeight:700 }}>{DAYS[di]}</span>
                    </div>
                    <div style={{ padding:10 }}>
                      {docs.length ? docs.map(d=>{
                        const myCov = [];
                        const nDi = dayIdx(nextWork(date));
                        if (isClinic(getSlot(d,di,"am")))  (covs.am||[]).forEach(id=>{const c=fd(id);if(c)myCov.push(`ص: ${c.name}`);});
                        if (isClinic(getSlot(d,di,"pm")))  (covs.pm||[]).forEach(id=>{const c=fd(id);if(c)myCov.push(`ظ: ${c.name}`);});
                        if (isClinic(getSlot(d,nDi,"am"))) (covs.nextAm||[]).forEach(id=>{const c=fd(id);if(c)myCov.push(`غد ص: ${c.name}`);});
                        return (
                          <div key={d.id} style={{ marginBottom:7 }}>
                            <span style={{ background:d.color+"1e", color:d.color, border:`1px solid ${d.color}55`, borderRadius:6, padding:"3px 9px", fontSize:12, fontWeight:700, display:"inline-block" }}>🌙 {d.name}</span>
                            {myCov.map((t,i)=><div key={i} style={{ fontSize:10, color:"#15803d", marginTop:2 }}>↳ {t}</div>)}
                          </div>
                        );
                      }) : <div style={{ fontSize:11, color:"#cbd5e1" }}>لا دوام مسائي</div>}
                      {indiv.map(c=>{const cd=fd(c.coverDoctorId);return cd&&<div key={c.id} style={{ fontSize:10, color:"#ea580c", marginTop:3 }}>🔄 {cd.name} ({(c.period==="am"?"ص":c.period==="evening"?"مسائي":"ظ")})</div>;})}
                      {nd.note && <div style={{ fontSize:10, color:"#a16207", marginTop:4, background:"#fffbeb", borderRadius:5, padding:"2px 6px" }}>📝 {nd.note}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : null}
          {/* Calendar view */}
          {viewMode==="calendar" && filledDays.length>0 && (
            <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", border:"1px solid #e2e8f0" }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", background:"#1e3a5f" }}>
                {DAYS.map(d => <div key={d} style={{ padding:"9px", textAlign:"center", color:"#fff", fontWeight:700, fontSize:12 }}>{d}</div>)}
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
                {Array.from({ length:firstOffset }, (_,i) => <div key={`e${i}`} style={{ minHeight:90, background:"#f8fafc", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9" }} />)}
                {calDays.map(({ date, di, day }) => {
                  const nd = nightData[date] || {}; const covs = nd.coverages || {};
                  const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                  const isT = date===today; const isSel = selDate===date;
                  return (
                    <div key={date} onClick={() => setSelDate(isSel?null:date)}
                      style={{ minHeight:90, padding:"5px 6px", cursor:"pointer", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9",
                        background: isSel?"#eff6ff":isT?"#fffbeb":"#fff", outline: isSel?"2px solid #2c5282":"none" }}>
                      <div style={{ fontSize:10, color:isT?"#d97706":"#94a3b8", fontWeight:700, marginBottom:3 }}>{day}</div>
                      {docs.map(d => <div key={d.id} style={{ background:d.color+"1e", border:`1px solid ${d.color}55`, borderRadius:4, padding:"2px 5px", marginBottom:2, fontSize:9, fontWeight:700, color:d.color }}>🌙 {d.name}</div>)}
                      {!docs.length && <div style={{ fontSize:9, color:"#d1d5db", textAlign:"center", paddingTop:6 }}>—</div>}
                      {(covs.am||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:8, color:"#15803d" }}>(ص) {d.name}</div>)}
                      {(covs.pm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:8, color:"#0891b2" }}>(ظ) {d.name}</div>)}
                      {coverages.filter(c=>c.date===date).map(c=>{const cd=fd(c.coverDoctorId);return cd&&<div key={c.id} style={{ fontSize:8, color:"#ea580c" }}>🔄 {cd.name}</div>;})}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {/* Selected day editor in boxes/calendar mode */}
          {(viewMode==="boxes"||viewMode==="calendar") && selDate && (
            <div style={{ marginTop:14, background:"#fff", borderRadius:12, border:"2px solid #2c5282", overflow:"hidden" }}>
              <DayCard date={selDate} di={dayIdx(selDate)} day={+selDate.split("-")[2]}
                nd={nightData[selDate]||{}} indiv={coverages.filter(c=>c.date===selDate)}
                doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd}
                expanded={true} onToggle={()=>setSelDate(null)}
                onAddDoc={onAddDoc} onRemoveDoc={onRemoveDoc} onAddCov={onAddCov} onRemoveCov={onRemoveCov} onResetDay={onResetDay} onSetNote={onSetNote} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} />
            </div>
          )}

          {/* Per-doctor monthly summary */}
          {filledDays.length>0 && (() => {
            const summ = doctors.map(doc=>{
              let nights=0, covs=0;
              calDays.forEach(({date,di})=>{
                const nd=nightData[date]||{}; const c=nd.coverages||{};
                if((nd.doctors||[]).includes(doc.id)) nights++;
                covs += ((c.am||[]).includes(doc.id)?1:0)+((c.pm||[]).includes(doc.id)?1:0)+((c.nextAm||[]).includes(doc.id)?1:0);
              });
              covs += coverages.filter(c=>{const [y,m]=c.date.split("-");return c.coverDoctorId===doc.id&&+y===month.y&&+m===month.m+1;}).length;
              return { doc, nights, covs };
            }).filter(s=>s.nights||s.covs).sort((a,b)=>b.nights-a.nights);
            if (!summ.length) return null;
            return (
              <div style={{ marginTop:18, background:"#fff", borderRadius:12, padding:16, border:"1px solid #eef2f7" }}>
                <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>📊 ملخص الشهر لكل طبيب</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:8 }}>
                  {summ.map(({doc,nights,covs})=>(
                    <div key={doc.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", background:"#f8fafc", borderRadius:9, borderRight:`4px solid ${doc.color}` }}>
                      <span style={{ flex:1, fontSize:12, fontWeight:700, color:"#1e293b" }}>{doc.name}</span>
                      <span style={{ fontSize:11, color:"#1d4ed8", fontWeight:700, background:"#eff4fb", borderRadius:5, padding:"2px 7px" }}>🌙 {nights}</span>
                      {covs>0 && <span style={{ fontSize:11, color:"#15803d", fontWeight:700, background:"#eefaf3", borderRadius:5, padding:"2px 7px" }}>🔄 {covs}</span>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
        )}
      </div>

      {/* PDF preview modal (fallback if download blocked) */}
      {previewHtml && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:9998, display:"flex", flexDirection:"column", padding:20 }} onClick={()=>setPreviewHtml(null)}>
          <div style={{ background:"#fff", borderRadius:12, flex:1, overflow:"hidden", display:"flex", flexDirection:"column", maxWidth:900, margin:"0 auto", width:"100%" }} onClick={e=>e.stopPropagation()}>
            <div style={{ padding:"12px 16px", borderBottom:"1px solid #e2e8f0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <strong style={{ fontSize:14 }}>معاينة الجدول للنشر</strong>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{ const win=window.frames["pdfframe"]; if(win) win.print(); }} style={{ ...Btn.primary }}>🖨️ طباعة</button>
                <button onClick={()=>setPreviewHtml(null)} style={Btn.secondary}>إغلاق</button>
              </div>
            </div>
            <iframe name="pdfframe" title="preview" srcDoc={previewHtml} style={{ flex:1, border:"none", width:"100%" }} />
          </div>
        </div>
      )}
    </div>
  );
}

// DAY CARD — vibrant, inline-editable day card
// ══════════════════════════════════════════════════════
const DAY_GRADIENTS = [
  "#1e3a5f", "#2c5282", "#3b6ca8", "#2c5282", "#1e3a5f",
];

// Extra (emergency) individual coverages view — separate from night-shift coverages
function ExtraCoveragesView({ doctors, leaves, nightData, coverages, fd, calDays, month, onAddIndiv, onRemoveIndiv }) {
  const monthCovs = coverages.filter(c=>{ const [y,m]=c.date.split("-"); return +y===month.y && +m===month.m+1; });
  const byDate = {};
  monthCovs.forEach(c=>{ (byDate[c.date] = byDate[c.date]||[]).push(c); });
  const dates = Object.keys(byDate).sort();
  const REASONS = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" };
  const periodLabel = p => p==="am"?"☀️ صباح":p==="evening"?"🌙 مسائي":"🌅 ظهر";
  const [pickDate, setPickDate] = useState("");

  return (
    <div>
      <div style={{ background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:10, padding:"10px 14px", marginBottom:14, fontSize:12, color:"#9a3412" }}>
        ℹ️ التغطيات الإضافية الطارئة (غياب/مرض/عذر) — مستقلة عن تغطيات الدوام المسائي المخطّطة. لإضافة تغطية، اختر يوماً ثم سجّلها.
      </div>

      {/* Day picker to add */}
      <div style={{ background:"#fff", border:"1px solid #eef2f7", borderRadius:12, padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>➕ تسجيل تغطية طارئة جديدة</div>
        <input type="date" value={pickDate} onChange={e=>setPickDate(e.target.value)} style={{ ...SEL, marginBottom:10 }} />
        {pickDate && dayIdx(pickDate)>=0 && (
          <IndivCoverageAdder date={pickDate} di={dayIdx(pickDate)} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} onAddIndiv={onAddIndiv} forceOpen={true} />
        )}
        {pickDate && dayIdx(pickDate)<0 && <div style={{ fontSize:12, color:"#dc2626" }}>اختر يوم عمل (الأحد-الخميس)</div>}
      </div>

      {/* List of existing extra coverages */}
      <div style={{ fontWeight:800, fontSize:15, marginBottom:12 }}>🔄 التغطيات الطارئة المسجّلة ({monthCovs.length})</div>
      {dates.length===0 ? (
        <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px", fontSize:13, background:"#f8fafc", borderRadius:12, border:"2px dashed #e2e8f0" }}>لا توجد تغطيات طارئة هذا الشهر</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {dates.map(date=>{
            const di = dayIdx(date); const d = +date.split("-")[2];
            return (
              <div key={date} style={{ background:"#fff", border:"1px solid #fed7aa", borderRadius:11, overflow:"hidden" }}>
                <div style={{ background:"#fff7ed", padding:"8px 12px", display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ background:"#ea580c", color:"#fff", borderRadius:7, padding:"3px 10px", fontSize:13, fontWeight:800 }}>{d}/{month.m+1}</span>
                  <span style={{ fontWeight:700, fontSize:13, color:"#9a3412" }}>{DAYS[di]}</span>
                </div>
                <div style={{ padding:10 }}>
                  {byDate[date].map(c=>{
                    const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null;
                    return cd&&(
                      <div key={c.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", background:"#fffdf9", border:"1px solid #fed7aa", borderRadius:8, marginBottom:5, fontSize:12 }}>
                        <span style={{ background:"#fff7ed", color:"#ea580c", borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:700 }}>{periodLabel(c.period)}</span>
                        <span style={{ flex:1, color:"#9a3412" }}><strong>{cd.name}</strong>{ad?` يغطّي عن ${ad.name}`:""} {c.reason?`(${REASONS[c.reason]||c.reason})`:""}</span>
                        <button onClick={()=>onRemoveIndiv(c.id)} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:14 }}>✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Extra (emergency) individual coverages view END

// Inline adder for individual (absence-based) coverage within a day card
function IndivCoverageAdder({ date, di, doctors, leaves, nightData, coverages, fd, onAddIndiv, forceOpen }) {
  const [open, setOpen] = useState(!!forceOpen);
  const [absentId, setAbsentId] = useState("");
  const [reason, setReason] = useState("absence");
  const [covByPeriod, setCovByPeriod] = useState({ am:"", pm:"", evening:"" });

  const PERIODS = [
    { key:"am", label:"☀️ صباح" },
    { key:"pm", label:"🌅 ظهر" },
    { key:"evening", label:"🌙 مسائي" },
  ];
  const REASONS = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" };

  const ad = doctors.find(d=>d.id===+absentId);

  // For each period: does the absent doctor have a clinic? is it already covered by night schedule?
  const periodInfo = (key) => {
    if (!ad) return { hasClinic:false };
    let hasClinic;
    if (key==="evening") hasClinic = (nightData[date]?.doctors||[]).includes(ad.id) || (ad.nightDays||[]).includes(di);
    else hasClinic = isClinic(getSlot(ad, di, key));
    // already covered via night schedule (only am/pm, when absent doctor is the night doctor)
    let alreadyCov = null;
    if (key!=="evening" && (nightData[date]?.doctors||[]).includes(ad.id)) {
      const ids = (nightData[date]?.coverages||{})[key]||[];
      if (ids.length) alreadyCov = ids.map(id=>fd(id)?.name).filter(Boolean).join("، ");
    }
    return { hasClinic, alreadyCov };
  };

  const busyIds = (key) => {
    const nd = nightData[date]||{}; const c = nd.coverages||{};
    const ids = [...(c[key]||[])];
    coverages.forEach(cv=>{ if(cv.date===date && cv.period===key) ids.push(cv.coverDoctorId); });
    return ids;
  };

  // periods needing coverage (has clinic, not already covered)
  const neededPeriods = ad ? PERIODS.filter(p=>{ const info=periodInfo(p.key); return info.hasClinic && !info.alreadyCov; }) : [];
  const anyAssigned = Object.entries(covByPeriod).some(([k,v])=>v && neededPeriods.find(p=>p.key===k));

  const save = () => {
    if (!ad || !anyAssigned) return;
    let count = 0;
    neededPeriods.forEach(p=>{
      const cid = covByPeriod[p.key];
      if (cid) { onAddIndiv({ date, period:p.key, coverDoctorId:+cid, absentId:+absentId, reason }); count++; }
    });
    setAbsentId(""); setReason("absence"); setCovByPeriod({ am:"", pm:"", evening:"" }); setOpen(false);
  };

  if (!open) return (
    <button onClick={()=>setOpen(true)} style={{ width:"100%", padding:"8px", background:"#fff", border:"1px dashed #fdba74", borderRadius:7, color:"#ea580c", cursor:"pointer", fontSize:12, fontWeight:700, marginTop:2 }}>➕ تسجيل غياب طبيب وتغطية فتراته</button>
  );

  return (
    <div style={{ background:"#fffdf9", border:"1px solid #fed7aa", borderRadius:10, padding:12, marginTop:4 }}>
      <div style={{ display:"flex", gap:6, marginBottom:10 }}>
        <select value={absentId} onChange={e=>{ setAbsentId(e.target.value); setCovByPeriod({am:"",pm:"",evening:""}); }} style={{ ...SEL, fontSize:12, flex:2 }}>
          <option value="">اختر الطبيب الغائب...</option>
          {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
        <select value={reason} onChange={e=>setReason(e.target.value)} style={{ ...SEL, fontSize:12, flex:1 }}>
          {Object.entries(REASONS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
      </div>

      {ad && (
        <div style={{ marginBottom:10 }}>
          <div style={{ fontSize:11, color:"#92400e", fontWeight:700, marginBottom:8, background:"#fff7ed", borderRadius:6, padding:"6px 10px" }}>
            📋 فترات د.{ad.name.replace("د.","")} يوم {DAYS[di]} — يغيب اليوم كاملاً:
          </div>
          {PERIODS.map(p=>{
            const info = periodInfo(p.key);
            if (!info.hasClinic) {
              return (
                <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#f8fafc", borderRadius:7, fontSize:11, color:"#94a3b8" }}>
                  <span style={{ minWidth:60, fontWeight:700 }}>{p.label}</span>
                  <span>— لا يوجد لديه عيادة</span>
                </div>
              );
            }
            if (info.alreadyCov) {
              return (
                <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#fffbeb", border:"1px solid #fde68a", borderRadius:7, fontSize:11, color:"#b45309" }}>
                  <span style={{ minWidth:60, fontWeight:700 }}>{p.label}</span>
                  <span>✓ مُغطّاة في الدوام المسائي ({info.alreadyCov})</span>
                </div>
              );
            }
            const busy = busyIds(p.key);
            return (
              <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:7 }}>
                <span style={{ minWidth:60, fontWeight:700, fontSize:11, color:"#15803d" }}>{p.label}</span>
                <span style={{ fontSize:10, color:"#15803d", whiteSpace:"nowrap" }}>يغطّيها:</span>
                <select value={covByPeriod[p.key]} onChange={e=>setCovByPeriod(s=>({...s,[p.key]:e.target.value}))} style={{ ...SEL, fontSize:11, flex:1 }}>
                  <option value="">اختر...</option>
                  {doctors.filter(d=>d.id!==+absentId).map(d=>{
                    const ol = onLeave(d,date,leaves); const bz = busy.includes(d.id);
                    return <option key={d.id} value={d.id} disabled={ol||bz}>{ol?`🚫 ${d.name} (إجازة)`:bz?`⛔ ${d.name} (مشغول)`:d.name}</option>;
                  })}
                </select>
              </div>
            );
          })}
          {neededPeriods.length===0 && (
            <div style={{ fontSize:11, color:"#94a3b8", textAlign:"center", padding:"6px" }}>لا توجد فترات تحتاج تغطية فردية لهذا الطبيب اليوم</div>
          )}
        </div>
      )}

      <div style={{ display:"flex", gap:6 }}>
        <button onClick={save} disabled={!anyAssigned} style={{ flex:1, padding:"8px", background:anyAssigned?"#ea580c":"#fed7aa", color:"#fff", border:"none", borderRadius:7, fontSize:12, fontWeight:700, cursor:anyAssigned?"pointer":"default" }}>حفظ التغطيات</button>
        <button onClick={()=>{ setOpen(false); setAbsentId(""); setCovByPeriod({am:"",pm:"",evening:""}); }} style={{ padding:"8px 16px", background:"#fff", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, cursor:"pointer" }}>إلغاء</button>
      </div>
    </div>
  );
}

function DayCard({ date, di, day, nd, indiv, doctors, leaves, nightData, coverages, fd, expanded, onToggle, onAddDoc, onRemoveDoc, onAddCov, onRemoveCov, onResetDay, onSetNote, onAddIndiv, onRemoveIndiv }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const nightDocs = nd.doctors || [];
  const covs = nd.coverages || { am:[], pm:[], nextAm:[] };
  const nextDate = nextWork(date);
  const nextDi = dayIdx(nextDate);
  const grad = DAY_GRADIENTS[di] || DAY_GRADIENTS[0];

  // coverage needs per night doctor
  const docNeeds = (doc) => {
    const needs = [];
    if (isClinic(getSlot(doc,di,"am")))     needs.push({ key:"am",     label:"☀️ صباحاً",     covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,di,"pm")))     needs.push({ key:"pm",     label:"🌅 ظهراً",      covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,nextDi,"am"))) needs.push({ key:"nextAm", label:"🌄 الغد صباحاً", covDate:nextDate, covDi:nextDi });
    return needs;
  };

  let pending = 0;
  nightDocs.map(id=>fd(id)).filter(Boolean).forEach(d=>{
    if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
    if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
    if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
  });
  const done = pending===0 && nightDocs.length>0;

  return (
    <div style={{ background: expanded?"#f8fbff":"#fff", borderBottom:"1px solid #eef2f7", borderRight: expanded?"4px solid #2c5282":"4px solid transparent", transition:"all .15s" }}>
      {/* Table-style row */}
      <div onClick={onToggle} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", cursor:"pointer" }}>
        {/* Date badge */}
        <div style={{ background:grad, color:"#fff", borderRadius:9, minWidth:54, height:46, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
          <span style={{ fontSize:17, fontWeight:800, lineHeight:1 }}>{day}</span>
          <span style={{ fontSize:9, opacity:.9, marginTop:1 }}>/{date.split("-")[1]}</span>
        </div>
        {/* Day name */}
        <div style={{ minWidth:75, flexShrink:0 }}>
          <div style={{ fontWeight:700, fontSize:15, color:"#1e293b" }}>{DAYS[di]}</div>
          <div style={{ fontSize:11, color:"#94a3b8" }}>{date}</div>
        </div>
        {/* Names + coverages */}
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4, minWidth:0 }}>
          {nightDocs.map(id=>fd(id)).filter(Boolean).map(d=>{
            // Only show coverage for the period where THIS doctor actually has a clinic
            const myCovs = [];
            const nextDi2 = dayIdx(nextWork(date));
            if (isClinic(getSlot(d,di,"am")))    (covs.am||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push(`صباحاً: ${c.name}`);});
            if (isClinic(getSlot(d,di,"pm")))    (covs.pm||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push(`ظهراً: ${c.name}`);});
            if (isClinic(getSlot(d,nextDi2,"am")))(covs.nextAm||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push(`غداً صباحاً: ${c.name}`);});
            return (
              <div key={d.id} style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                <span style={{ background:d.color+"18", color:d.color, border:`1px solid ${d.color}55`, borderRadius:6, padding:"3px 11px", fontSize:13, fontWeight:700 }}>🌙 {d.name}</span>
                {myCovs.map((t,i)=><span key={i} style={{ fontSize:11, color:"#15803d", background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:5, padding:"2px 8px" }}>↳ {t}</span>)}
              </div>
            );
          })}
          {nightDocs.length===0 && <span style={{ fontSize:13, color:"#cbd5e1" }}>— لا دوام مسائي</span>}
          {indiv.map(c=>{const cd=fd(c.coverDoctorId);return cd&&<span key={c.id} style={{ background:"#fff7ed", color:"#ea580c", border:"1px solid #fed7aa", borderRadius:6, padding:"2px 9px", fontSize:12, width:"fit-content" }}>🔄 تغطية فردية: {cd.name}</span>;})}
          {nd.note && <span style={{ fontSize:11, color:"#a16207", background:"#fffbeb", border:"1px solid #fde68a", borderRadius:6, padding:"2px 9px", width:"fit-content" }}>📝 {nd.note}</span>}
        </div>
        {/* Status */}
        <div style={{ minWidth:70, textAlign:"center", flexShrink:0 }}>
          {done && <span style={{ background:"#f0fdf4", color:"#15803d", borderRadius:14, padding:"3px 11px", fontSize:11, fontWeight:700 }}>✅ مكتمل</span>}
          {pending>0 && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:14, padding:"3px 11px", fontSize:11, fontWeight:700 }}>⚠️ {pending}</span>}
        </div>
        <span style={{ fontSize:14, color:"#94a3b8", flexShrink:0, width:16 }}>{expanded?"▲":"▼"}</span>
      </div>

      {/* Expanded body - inline editing */}
      {expanded && (
        <div style={{ padding:"4px 16px 14px", borderTop:"1px solid #eef2f7" }}>
          {/* Per-day conflict banner */}
          {(() => {
            const dayConflicts = [];
            (nd.doctors||[]).forEach(nid=>{
              ["am","pm"].forEach(slot=>{
                const nightCov = (covs[slot]||[]).length>0;
                const dup = indiv.filter(c=>c.period===slot && c.absentId===nid);
                if (nightCov && dup.length) dayConflicts.push(`عيادة ${fd(nid)?.name} (${slot==="am"?"صباح":"ظهر"}) مُغطّاة مرتين`);
              });
            });
            // same cover doctor twice in same period
            ["am","pm"].forEach(slot=>{
              const ids = [...(covs[slot]||[]), ...indiv.filter(c=>c.period===slot).map(c=>c.coverDoctorId)];
              const dups = ids.filter((x,i)=>ids.indexOf(x)!==i);
              dups.forEach(id=>dayConflicts.push(`${fd(id)?.name} مسجّل مرتين في ${slot==="am"?"صباح":"ظهر"}`));
            });
            if (!dayConflicts.length) return null;
            return (
              <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:9, padding:"8px 12px", marginBottom:10 }}>
                <div style={{ fontSize:12, fontWeight:700, color:"#dc2626", marginBottom:3 }}>⚠️ تعارض في هذا اليوم</div>
                {[...new Set(dayConflicts)].map((t,i)=><div key={i} style={{ fontSize:11, color:"#991b1b" }}>🔴 {t}</div>)}
              </div>
            );
          })()}
          {/* Night doctors with their coverage needs */}
          {nightDocs.map(id=>fd(id)).filter(Boolean).map(d => {
            const needs = docNeeds(d);
            return (
              <div key={d.id} style={{ marginBottom:10, border:`1px solid ${d.color}33`, borderRadius:11, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, background:d.color+"14", padding:"7px 10px" }}>
                  <div style={{ ...AV, background:d.color, width:26, height:26, fontSize:9 }}>{sn(d.name).slice(0,2)}</div>
                  <span style={{ flex:1, fontSize:13, fontWeight:700, color:d.color }}>🌙 {d.name}</span>
                  {(() => {
                    const covLines = docNeeds(d).map(n=>{ const ids=covs[n.key]||[]; const nm=ids.map(id=>fd(id)?.name).filter(Boolean).join("، "); return `- ${n.label}: ${nm?("يغطّيها "+nm):"تحتاج تغطية"}`; }).join("\n");
                    const subject = `تنبيه دوام مسائي — ${DAYS[di]} ${date}`;
                    const body = `عزيزي الطبيب ${d.name}،\n\nلديك دوام مسائي يوم ${DAYS[di]} الموافق ${date}.\n${covLines?("\nالتغطيات:\n"+covLines):""}\n\nمركز طب الأسنان التخصصي\nرئيس قسم إصلاح الأسنان\nد. أمل العسكر`;
                    const href = `mailto:${d.email||""}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    const waText = `🌙 تنبيه دوام مسائي\n\nعزيزي الطبيب ${d.name}،\nلديك دوام مسائي يوم ${DAYS[di]} الموافق ${date}.${covLines?("\n\nالتغطيات:\n"+covLines):""}\n\nمركز طب الأسنان التخصصي\nرئيس قسم إصلاح الأسنان\nد. أمل العسكر`;
                    const waHref = `https://wa.me/${(d.phone||"").replace(/[^0-9]/g,"")}?text=${encodeURIComponent(waText)}`;
                    return (
                      <>
                        <a href={waHref} target="_blank" rel="noopener noreferrer"
                          style={{ background:"#fff", border:"1px solid #bbf7d0", color:"#16a34a", cursor:"pointer", fontSize:11, borderRadius:6, padding:"3px 9px", fontWeight:700, textDecoration:"none", display:"inline-block" }}
                          title={d.phone?`واتساب إلى ${d.phone}`:"أضف رقم الجوال في صفحة الأطباء"}>📲</a>
                        <a href={href} target="_blank" rel="noopener noreferrer"
                          style={{ background:"#fff", border:`1px solid ${d.color}44`, color:d.color, cursor:"pointer", fontSize:11, borderRadius:6, padding:"3px 9px", fontWeight:700, textDecoration:"none", display:"inline-block" }}
                          title={d.email?`إرسال تنبيه إلى ${d.email}`:"لا يوجد إيميل — أضفه في صفحة الأطباء"}>📧</a>
                      </>
                    );
                  })()}
                  <button onClick={()=>onRemoveDoc(date,d.id)} style={{ background:"#fff", border:`1px solid ${d.color}44`, color:"#dc2626", cursor:"pointer", fontSize:12, borderRadius:6, padding:"2px 7px" }}>✕</button>
                </div>
                <div style={{ padding:"8px 10px" }}>
                  {needs.length===0 ? (
                    <div style={{ fontSize:10, color:"#15803d", background:"#f0fdf4", borderRadius:6, padding:"4px 8px" }}>✅ لا يحتاج تغطية — لا توجد عيادة في جدوله هذا اليوم</div>
                  ) : needs.map(({key,label,covDate,covDi}) => {
                    const assigned = (covs[key]||[]).map(id=>fd(id)).filter(Boolean);
                    const avail = getAvailable(doctors, nightDocs, covDi, covDate, key==="pm"?"pm":"am", leaves, nightData, { [key]: covs[key]||[] }, coverages);
                    const freeDocs = avail.filter(x=>x.status==="free");
                    const warnDocs = avail.filter(x=>x.status==="warn");
                    return (
                      <div key={key} style={{ marginBottom:7 }}>
                        <div style={{ fontSize:10, fontWeight:700, color:"#64748b", marginBottom:3 }}>{label} — تحتاج تغطية</div>
                        {assigned.map(cd=>(
                          <div key={cd.id} style={{ display:"flex", alignItems:"center", gap:5, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:6, padding:"3px 7px", marginBottom:3 }}>
                            <span style={{ flex:1, fontSize:11, color:"#15803d", fontWeight:600 }}>✓ يغطّيها {cd.name}</span>
                            <button onClick={()=>onRemoveCov(date,key,cd.id)} style={{ background:"none", border:"none", color:"#94a3b8", cursor:"pointer", fontSize:11 }}>✕</button>
                          </div>
                        ))}
                        <select style={{ ...SEL, fontSize:11, padding:"6px 7px" }} value="" onChange={e=>{ if(e.target.value) onAddCov(date,key,+e.target.value); }}>
                          <option value="">➕ تثبيت طبيب متاح ({freeDocs.length})</option>
                          {freeDocs.length>0 && <optgroup label="✅ متاح (فارغ)">{freeDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>{fdoc.name}</option>)}</optgroup>}
                          {warnDocs.length>0 && <optgroup label="⚠️ لديه التزام">{warnDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>⚠️ {fdoc.name}</option>)}</optgroup>}
                        </select>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Add night doctor */}
          {nightDocs.length<3 && (
            <select style={{ ...SEL, marginBottom:8 }} value="" onChange={e=>{ if(e.target.value) onAddDoc(date,+e.target.value); }}>
              <option value="">➕ إضافة طبيب للدوام المسائي...</option>
              {doctors.filter(d=>!nightDocs.includes(d.id)).map(d=>{
                const ol = onLeave(d,date,leaves);
                const blocked = (d.blockedDays||[]).includes(di);
                const label = ol ? `🚫 ${d.name} (إجازة)` : blocked ? `⛔ ${d.name} (لا يعمل ${DAYS[di]})` : d.name;
                return <option key={d.id} value={d.id} disabled={ol||blocked}>{label}{(d.nightDays||[]).includes(di)?" (ثابت)":""}</option>;
              })}
            </select>
          )}

          {/* Individual coverages on this day — full editor */}
          <div style={{ marginTop:8, paddingTop:10, borderTop:"2px dashed #fed7aa" }}>
            <div style={{ fontSize:12, fontWeight:700, color:"#ea580c", marginBottom:6 }}>🔄 تغطيات فردية (غياب / إجازة / عذر)</div>
            {indiv.map(c=>{
              const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null;
              const reasonLabel = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" }[c.reason]||c.reason||"";
              return cd&&(
                <div key={c.id} style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:7, padding:"5px 9px", marginBottom:4 }}>
                  <span style={{ flex:1, color:"#9a3412" }}>
                    <strong>{cd.name}</strong> يغطّي {(c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً")}
                    {ad?` — بدلاً من ${ad.name}`:""}{reasonLabel?` (${reasonLabel})`:""}
                  </span>
                  <button onClick={()=>onRemoveIndiv(c.id)} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:13 }}>✕</button>
                </div>
              );
            })}
            <IndivCoverageAdder date={date} di={di} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} onAddIndiv={onAddIndiv} />
          </div>

          {/* Day note */}
          <div style={{ marginTop:6, marginBottom:8 }}>
            <input type="text" defaultValue={nd.note||""} placeholder="📝 ملاحظة لهذا اليوم..."
              onBlur={e=>onSetNote && onSetNote(date, e.target.value)}
              style={{ width:"100%", padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:12, outline:"none", background:"#fffef5" }} />
          </div>
          {/* Footer actions */}
          {nightDocs.length>0 && (
            <div style={{ marginTop:6, display:"flex", justifyContent:"flex-end" }}>
              {confirmReset ? (
                <span style={{ display:"inline-flex", gap:6, alignItems:"center" }}>
                  <span style={{ fontSize:11, color:"#dc2626", fontWeight:700 }}>مسح اليوم؟</span>
                  <button onClick={()=>{ onResetDay(date); setConfirmReset(false); }} style={{ ...Btn.danger, background:"#dc2626", color:"#fff", border:"none" }}>نعم</button>
                  <button onClick={()=>setConfirmReset(false)} style={Btn.secondary}>لا</button>
                </span>
              ) : (
                <button onClick={()=>setConfirmReset(true)} style={{ ...Btn.danger }}>🔁 إعادة تعيين اليوم</button>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DOCTORS PAGE
// ══════════════════════════════════════════════════════
function DoctorsPage({ doctors, leaves, today, fd, onUpdateDocs, showToast }) {
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [changed, setChanged] = useState({});
  const [newDocName, setNewDocName] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const SLOT_OPTS = [["","— فراغ"],["clinic","🦷 عيادة"],["admin","📋 إداري"],["training","🎓 تدريب"],["audit","📊 تدقيق"],["virtual","💻 افتراضية"]];

  const updateSched = (docId, di, p, v) => {
    onUpdateDocs(doctors.map(d => d.id!==docId ? d : { ...d, sched:{ ...d.sched, [di]:{ ...d.sched[di], [p]:v } } }));
    setChanged(prev => ({ ...prev, [docId]:true }));
  };

  const toggleNightDay = (docId, di) => {
    onUpdateDocs(doctors.map(d => {
      if (d.id !== docId) return d;
      const cur = Array.isArray(d.nightDays) ? d.nightDays : [];
      const next = cur.includes(di) ? cur.filter(x=>x!==di) : [...cur, di].sort();
      return { ...d, nightDays: next };
    }));
  };

  const [confirmDel, setConfirmDel] = useState(null);
  const deleteDoc = id => {
    onUpdateDocs(doctors.filter(d => d.id!==id));
    setConfirmDel(null);
    showToast("تم حذف الطبيب", "warn");
  };

  const addDoc = () => {
    const name = newDocName.trim();
    if (!name) return;
    const colors = ["#2c5282","#0ea5e9","#10b981","#f59e0b","#3b6ca8","#84cc16","#f97316","#14b8a6"];
    const nd = { id:Date.now(), name, color:colors[Math.floor(Math.random()*colors.length)], nightDays:[], email:"", sched:Object.fromEntries([0,1,2,3,4].map(d=>[d,{am:"",pm:""}])) };
    onUpdateDocs([...doctors, nd]);
    setExpanded(nd.id);
    setNewDocName("");
    setShowAdd(false);
    showToast(`تم إضافة ${name}`);
  };

  return (
    <div>
      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        <input style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="🔍 بحث..." value={search} onChange={e=>setSearch(e.target.value)} />
        <button onClick={()=>setShowAdd(s=>!s)} style={Btn.primary}>+ إضافة طبيب</button>
      </div>
      {showAdd && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:14, marginBottom:14, display:"flex", gap:8, alignItems:"center" }}>
          <input autoFocus style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="اسم الطبيب الجديد..." value={newDocName} onChange={e=>setNewDocName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addDoc(); }} />
          <button onClick={addDoc} style={Btn.primary}>حفظ</button>
          <button onClick={()=>{ setShowAdd(false); setNewDocName(""); }} style={Btn.secondary}>إلغاء</button>
        </div>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {doctors.filter(d=>d.name.includes(search)).map(doc => {
          const ol = onLeave(doc, today, leaves);
          const isExp = expanded === doc.id;
          const isDirty = changed[doc.id];
          return (
            <div key={doc.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden", borderRight:`4px solid ${doc.color}` }}>
              {/* Header */}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", cursor:"pointer" }} onClick={() => setExpanded(isExp?null:doc.id)}>
                <div style={{ ...AV, background:doc.color, width:38, height:38, fontSize:13 }}>{sn(doc.name).slice(0,2)}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:700, fontSize:14 }}>{doc.name}</div>
                  <div style={{ color:"#94a3b8", fontSize:11, display:"flex", gap:6 }}>
                    <span>{wSlots(doc)} فترة/أسبوع</span>
                    {(doc.nightDays||[]).length>0 && <span style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:4, padding:"1px 6px", fontSize:10 }}>🌙 {(doc.nightDays||[]).map(d=>DAYS[d]).join("، ")}</span>}
                  </div>
                </div>
                {/* Mini grid */}
                <div style={{ display:"flex", gap:3 }}>
                  {[0,1,2,3,4].map(di => (
                    <div key={di}>
                      <div style={{ fontSize:8, color:"#94a3b8", textAlign:"center", marginBottom:2 }}>{["أح","إث","ثل","أر","خم"][di]}</div>
                      {["am","pm"].map(p => {
                        const t = getSlot(doc,di,p);
                        const sc = SLOT_COLORS[t] || SLOT_COLORS[""];
                        return <div key={p} style={{ width:18, height:18, borderRadius:3, background:sc.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, marginBottom:2, color:sc.text }}>{sc.icon}</div>;
                      })}
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:4 }} onClick={e=>e.stopPropagation()}>
                  {ol && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:4, padding:"2px 6px", fontSize:9, fontWeight:700 }}>إجازة</span>}
                  {isDirty && <button style={{ ...Btn.primary, padding:"3px 8px", fontSize:10 }} onClick={() => setChanged(p=>({...p,[doc.id]:false}))}>💾</button>}
                  {confirmDel===doc.id ? (
                    <>
                      <button style={{ ...Btn.danger, padding:"4px 8px", background:"#dc2626", color:"#fff", border:"none" }} onClick={() => deleteDoc(doc.id)}>تأكيد</button>
                      <button style={{ ...Btn.secondary, padding:"4px 8px" }} onClick={() => setConfirmDel(null)}>✕</button>
                    </>
                  ) : (
                    <button style={{ ...Btn.danger, padding:"4px 8px" }} onClick={() => setConfirmDel(doc.id)}>🗑</button>
                  )}
                </div>
                <span style={{ color:"#94a3b8", fontSize:11 }}>{isExp?"▲":"▼"}</span>
              </div>

              {/* Expanded */}
              {isExp && (
                <div style={{ borderTop:"1px solid #f1f5f9", padding:14, background:"#f8fafc" }}>
                  {/* Email field */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span>📧</span>
                      <div style={{ fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>البريد للتنبيهات</div>
                      <input type="email" value={doc.email||""} placeholder="doctor@example.com"
                        onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,email:e.target.value}))}
                        style={{ flex:1, padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left" }} />
                    </div>
                  </div>
                  {/* Phone field for WhatsApp */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span>📲</span>
                      <div style={{ fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>الجوال (واتساب)</div>
                      <input type="tel" value={doc.phone||""} placeholder="9665xxxxxxxx"
                        onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,phone:e.target.value}))}
                        style={{ flex:1, padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left" }} />
                    </div>

                      })}

                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span>🚫</span>
                      <div style={{ fontSize:12, fontWeight:600 }}>أيام لا يعمل فيها <span style={{ color:"#94a3b8", fontWeight:400 }}>(تُستبعد من التوزيع التلقائي)</span></div>
                    </div>
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                      {DAYS.map((d,i) => {
                        const active = (doc.blockedDays||[]).includes(i);
                        return (
                          <button key={i} onClick={() => onUpdateDocs(doctors.map(x=>{ if(x.id!==doc.id) return x; const cur=Array.isArray(x.blockedDays)?x.blockedDays:[]; return {...x, blockedDays: cur.includes(i)?cur.filter(y=>y!==i):[...cur,i].sort()}; }))}
                            style={{ padding:"6px 12px", borderRadius:7, fontSize:12, fontWeight:700, cursor:"pointer", border: active?"2px solid #dc2626":"1px solid #e2e8f0",
                              background: active?"#fef2f2":"#f8fafc", color: active?"#dc2626":"#64748b" }}>
                            {active?"🚫 ":""}{d}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  {/* Schedule table: rows = days, columns = ص / م / مسائي */}
                  <div style={{ fontWeight:700, fontSize:12, color:"#475569", marginBottom:8 }}>الجدول الأسبوعي</div>
                  <div style={{ overflowX:"auto" }}>
                    <table style={{ borderCollapse:"collapse", width:"100%", minWidth:380 }}>
                      <thead>
                        <tr style={{ background:"#5b8def" }}>
                          <th style={{ padding:"6px 10px", fontSize:12, color:"#fff", fontWeight:700, minWidth:70 }}>اليوم</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>ص</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>م</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>مسائي</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[0,1,2,3,4].map(di => {
                          const isFixedEve = (doc.nightDays||[]).includes(di);
                          return (
                            <tr key={di}>
                              <td style={{ padding:"4px 10px", fontWeight:700, fontSize:12, color:"#fff", background:"#7ea4e6", textAlign:"center" }}>{DAYS[di]}</td>
                              {["am","pm"].map(period => {
                                const raw = getSlot(doc,di,period);
                                const val = (raw==="clinic_am"||raw==="clinic_pm") ? "clinic" : raw;
                                const sc = SLOT_COLORS[val] || SLOT_COLORS[""];
                                return (
                                  <td key={period} style={{ padding:"3px 4px" }}>
                                    <select value={val} onChange={e => updateSched(doc.id,di,period,e.target.value)}
                                      style={{ width:"100%", padding:"8px 4px", borderRadius:6, border:`2px solid ${val?sc.text:"#e2e8f0"}`, background:sc.bg, color:sc.text, fontSize:13, fontWeight:600, cursor:"pointer", outline:"none" }}>
                                      {SLOT_OPTS.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                                    </select>
                                  </td>
                                );
                              })}
                              {/* Evening column - reflects fixed night day */}
                              <td style={{ padding:"3px 4px", textAlign:"center" }}>
                                {isFixedEve ? (
                                  <div style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:6, padding:"6px 3px", fontSize:11, fontWeight:700 }}>🌙 عيادة</div>
                                ) : (
                                  <div style={{ color:"#cbd5e1", fontSize:11 }}>—</div>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{ fontSize:10, color:"#94a3b8", marginTop:6 }}>💡 عمود "مسائي" يعكس يوم المناوبة الثابت تلقائياً — عدّله من الأعلى</div>
                  {isDirty && <div style={{ marginTop:8, display:"flex", justifyContent:"flex-end" }}><button style={Btn.primary} onClick={()=>setChanged(p=>({...p,[doc.id]:false}))}>💾 حفظ</button></div>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// LEAVES PAGE
// ══════════════════════════════════════════════════════
function LeavesPage({ doctors, leaves, fd, onUpdate, showToast }) {
  const [form, setForm] = useState({ doctorId:"", start:"", end:"", type:"annual" });
  const [show, setShow] = useState(false);
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };

  const add = () => {
    if (!form.doctorId||!form.start||!form.end) return;
    const next = [...leaves, { id:Date.now(), doctorId:+form.doctorId, start:form.start, end:form.end, type:form.type }];
    onUpdate(next);
    setForm({ doctorId:"", start:"", end:"", type:"annual" });
    setShow(false);
    showToast("تم تسجيل الإجازة");
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontWeight:700 }}>الإجازات ({leaves.length})</div>
        <button style={Btn.primary} onClick={()=>setShow(true)}>+ إجازة جديدة</button>
      </div>
      {show && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>🏖 إجازة جديدة</div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الطبيب</label>
            <select style={SEL} value={form.doctorId} onChange={e=>setForm(p=>({...p,doctorId:e.target.value}))}>
              <option value="">اختر...</option>
              {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>النوع</label>
            <select style={SEL} value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>
              {Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>من</label>
              <input type="date" style={SEL} value={form.start} onChange={e=>setForm(p=>({...p,start:e.target.value}))} />
            </div>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>إلى</label>
              <input type="date" style={SEL} value={form.end} onChange={e=>setForm(p=>({...p,end:e.target.value}))} />
            </div>
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button style={Btn.primary} onClick={add}>حفظ</button>
            <button style={Btn.secondary} onClick={()=>setShow(false)}>إلغاء</button>
          </div>
        </div>
      )}
      {leaves.length===0 && <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px 0" }}>لا توجد إجازات</div>}
      {leaves.map(l => {
        const d = fd(l.doctorId); if (!d) return null;
        const days = Math.round((new Date(l.end)-new Date(l.start))/86400000)+1;
        return (
          <div key={l.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", marginBottom:7, display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ ...AV, background:d.color, width:34, height:34, fontSize:12 }}>{sn(d.name).slice(0,2)}</div>

              <div style={{ fontWeight:700 }}>{d.name}</div>

  );
}
