                <div style={{ flex:"1 1 170px", minWidth:150 }}><CoverPicker list={pickListR(c.absentId,di,date,c.period)} cur={c.coverDoctorId} onPick={cid=>{ setCoverages(cs=>cs.map(x=>x.id===c.id?{ ...x, coverDoctorId:cid }:x)); logAudit&&logAudit(`تغيير مغطّي ${dmy(date)} ← د.${fd(cid)?.name||""}`); }} /></div>
                <button onClick={()=>removeCovIndiv(c.id)} title="حذف التغطية" style={{ ...sGhost, color:C.err, padding:"5px 10px" }}>🗑</button>
              </div>)}

            {r.conflicts.length>0 && <>{sec("⛔",`تعارضات (${r.conflicts.length})`)}{r.conflicts.map((c,i)=><div key={i} style={{ ...row, background:"var(--dangerSoft)", fontSize:12.5, color:C.err, fontWeight:700 }}>{c.text}</div>)}</>}
            {onLv.length>0 && <>{sec("🏖","في إجازة اليوم")}<div style={{ fontSize:12.5, color:C.sub, lineHeight:1.9 }}>{onLv.map(d=>"د."+d.name).join("، ")}</div></>}

            {sec("⚙️","إجراءات اليوم")}
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {(docs.length>0||req>0) && <button onClick={()=>closeEveningDay(date)} style={{ ...sGhost, flex:"1 1 160px" }}>🌙 إلغاء المسائي فقط</button>}
              {dayCovs.length>0 && <button onClick={()=>{ if(confirm(`حذف كل تغطيات يوم ${dmy(date)}؟`)) clearDayCovs(date); }} style={{ ...sGhost, flex:"1 1 160px" }}>🧹 حذف كل التغطيات</button>}
              <button onClick={()=>closeDayAll(date)} style={{ ...sGhost, flex:"1 1 160px", color:C.err, borderColor:C.err }}>🚫 إغلاق اليوم بالكامل</button>
            </div>
          </>}
          </div>
        </div>
      </div>; })()}
    {peekId!=null && fd(peekId) && (()=>{
      const pd = fd(peekId); const inMo = ds => ds && ds.startsWith(pre);
      const eve = monthDates.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(pd.id));
      const did = []; // تغطيات قام بها لغيره
      coverages.forEach(c=>{ if(c.coverDoctorId===pd.id && inMo(c.date)) did.push({ date:c.date, period:c.period, owner:fd(c.absentId) }); });
      monthDates.forEach(ds=>{ const nd=nightData[ds]||{}; const cv=nd.coverages||{}; const di0=dayIdx(ds), nD=nextWork(ds), ndi=dayIdx(nD);
        [["am",ds,di0,"am"],["pm",ds,di0,"pm"],["nextAm",nD,ndi,"am"]].forEach(([sl,date,sdi,per])=>{ if((cv[sl]||[]).includes(pd.id)){ const ow=(nd.doctors||[]).map(id=>fd(id)).find(o=>o&&isClinic(getSlot(o,sdi,per))); did.push({ date, period:per, owner:ow }); } }); });
      did.sort((a,b)=>a.date.localeCompare(b.date));
      const got = coverages.filter(c=>c.absentId===pd.id && inMo(c.date)).sort((a,b)=>a.date.localeCompare(b.date)); // عياداته التي غُطّيت عنه
      const lvs = leaves.filter(l=>l.doctorId===pd.id && l.start<=pre+"-31" && l.end>=pre+"-01");
      const TY = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };
      const tile = (n,t,c) => <div style={{ flex:"1 1 70px", background:"var(--surface2)", borderRadius:11, padding:"9px 6px", textAlign:"center" }}><div style={{ fontSize:20, fontWeight:800, color:c }}>{n}</div><div style={{ fontSize:10.5, color:C.sub, fontWeight:600 }}>{t}</div></div>;
      const sec = (title,items,empty) => <div style={{ marginTop:12 }}><div style={{ fontSize:12.5, fontWeight:800, marginBottom:6 }}>{title}</div>{items.length?items:<div style={{ fontSize:11.5, color:C.muted }}>{empty}</div>}</div>;
      const row = (k,txt) => <div key={k} style={{ fontSize:12, background:"var(--surface2)", borderRadius:8, padding:"6px 10px", marginBottom:4 }}>{txt}</div>;
      return <div onClick={()=>setPeekId(null)} style={{ position:"fixed", inset:0, zIndex:200, background:"rgba(15,23,42,.4)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"6vh 14px", overflowY:"auto" }}>
        <div onClick={e=>e.stopPropagation()} style={{ background:"var(--surface)", borderRadius:16, boxShadow:"0 24px 60px rgba(0,0,0,.3)", width:"min(94vw, 460px)", maxHeight:"86vh", overflowY:"auto" }}>
          <div style={{ display:"flex", alignItems:"center", gap:11, padding:"14px 16px", borderBottom:`1px solid ${C.line}`, position:"sticky", top:0, background:"var(--surface)" }}>
            <Avatar doc={pd} size={38}/>
            <div style={{ flex:1, minWidth:0 }}><div style={{ fontWeight:800, fontSize:15 }}>د.{pd.name}</div><div style={{ fontSize:11.5, color:C.sub }}>{MONTHS[mo.m]} {mo.y}{(pd.nightDays||[]).length?` · مسائي ثابت: ${(pd.nightDays||[]).map(i=>DAYS[i]).join("، ")}`:" · دوّار"}</div></div>
            <button onClick={()=>setPeekId(null)} style={{ background:"var(--surface2)", border:"none", borderRadius:10, width:32, height:32, fontSize:18, color:C.muted, cursor:"pointer" }}>×</button>
          </div>
          <div style={{ padding:"12px 16px 16px" }}>
            <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
              {tile(eve.length,"مناوبات","var(--eve)")}{tile(did.length,"تغطيات قام بها",C.primary)}{tile(got.length,"غُطّي عنه",C.warn)}{tile(lvs.length,"إجازات",C.err)}
            </div>
            {sec("🌙 مناوباته المسائية", eve.map(ds=>row(ds, `${DAYS[dayIdx(ds)]||""} ${dmy(ds)}`)), "لا مناوبات هذا الشهر")}
            {sec("🔄 تغطيات قام بها لغيره", did.map((x,i)=>row("d"+i, `${dmy(x.date)} ${perAr(x.period)} — عيادة ${x.owner?"د."+x.owner.name:"طبيب المسائي"}`)), "لا تغطيات")}
            {sec("🩺 عياداته التي غُطّيت عنه", got.map(c=>row(c.id, `${dmy(c.date)} ${perAr(c.period)} — غطّاها د.${fd(c.coverDoctorId)?.name||"؟"} · ${coverReasonAr(c.absentId,c.date,c.reason,leaves)}`)), "لا شيء")}
            {sec("🏖 إجازاته", lvs.map(l=>row(l.id, `${TY[l.type]||"إجازة"} · ${dmy(l.start)} ← ${dmy(l.end)}`)), "لا إجازات هذا الشهر")}
          </div>
        </div>
      </div>; })()}
  </div>;
}

// ════════════════════════════════ LEAVES ════════════════════════════════
function LeavesPage({ doctors, leaves, nightData, coverages, today, fd, setLeaves, setCoverages, setNight, showToast, logAudit, settings }) {
  const restRule = settings?.restRule!==false;
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", permission:"استئذان", other:"أخرى" };
  const PERIOD_AR = { "":"اليوم كامل", am:"الصباح فقط", pm:"الظهر فقط" };
  const [f, setF] = useState({ doctorId:"", type:"annual", start:"", end:"", clinicClosed:true, period:"" });
  const add = () => {
    if(!f.doctorId||!f.start||!f.end){showToast("أكمل الحقول","warn");return;}
    if(f.end<f.start){showToast("التواريخ غير صحيحة","err");return;}
    if(f.type==="permission" && !f.period){ showToast("اختر الفترة التي سيغيب عنها (الصباح أو الظهر)","warn"); return; }
    const clash = leaves.find(l=>l.doctorId===+f.doctorId && l.start<=f.end && f.start<=l.end && (!l.period || !f.period || l.period===f.period)); // استئذان صباح + استئذان ظهر لنفس اليوم مسموح
    if(clash){ showToast(`للطبيب إجازة مسجّلة تتداخل مع هذه الفترة (${dmy(clash.start)} ← ${dmy(clash.end)}) — احذفها أو عدّل التواريخ`,"warn"); return; }
    setLeaves(ls=>[...ls,{id:uid(),doctorId:+f.doctorId,type:f.type,start:f.start,end:f.end,clinicClosed:f.clinicClosed, ...(f.period?{period:f.period}:{})}]);
    setF({doctorId:"",type:"annual",start:"",end:"",clinicClosed:true,period:""});
    logAudit&&logAudit(`تسجيل ${TYPES[f.type]||"إجازة"} د.${fd(+f.doctorId)?.name||""}${f.period?` — ${PERIOD_AR[f.period]}`:""}`);
    showToast("تم تسجيل الإجازة — سيُزال تلقائياً من أي مناوبة/تغطية متعارضة"); // التصحيح الفعلي يجري بتصحيح ذاتي شامل مستقل (App-level)، يعمل لأي مصدر تعارض لا فقط الإضافة هنا
  };
  const del = id => {
    const l = leaves.find(x=>x.id===id); if(!l) return;
    const nextDay = ds=>{ const x=new Date(ds); x.setDate(x.getDate()+1); return x.toISOString().split("T")[0]; };
    const inRange = ds => ds>=l.start && ds<=l.end;
    setLeaves(ls=>ls.filter(x=>x.id!==id));
    // ── استعادة ما أُزيل بسبب هذه الإجازة: مناوباته المسائية وتغطياته لغيره — فقط لو مكانها ما زال شاغراً (لم يُعيَّن بديل) ──
    const eveBack = l.eveRemoved||[];
    const dispNight = (l.displaced||[]).filter(x=>x.kind==="night");
    const dispCov = (l.displaced||[]).filter(x=>x.kind==="cov");
    const eveCov = (l.displaced||[]).filter(x=>x.kind==="evecov" && x.rec);
    // الأيام التي ستعود له مناوبتها فعلاً (نفس شرط الاستعادة أدناه) — لإرجاع تغطيات عياداته المرتبطة بتلك المناوبة
    const eveRestored = new Set(eveBack.filter(ds=>{ const day=nightData[ds]; if(!day) return false; const docs=day.doctors||[]; return !docs.includes(l.doctorId) && docs.length < (day.eveningSlots||1); }));
    const otherLeaves = leaves.filter(x=>x.id!==id);
    const coverFree = (cid, ds, per, cs) => { const cd=doctors.find(x=>x.id===cid); if(!cd) return false; if(onLeave(cd,ds,otherLeaves,per)) return false;
      if(cs.some(c=>c.date===ds && c.period===per && c.coverDoctorId===cid)) return false;               // مشغول بتغطية أخرى نفس الفترة
      if(((nightData[ds]||{}).doctors||[]).includes(cid)) return false;                                  // صار مناوباً مسائياً نفس اليوم
      if(per==="am" && restRule && ((nightData[prevCalDay(ds)]||{}).doctors||[]).includes(cid)) return false; // راحة بعد مسائي
      if(isClinic(getSlot(cd,dayIdx(ds),per)) && !cs.some(c=>c.date===ds && c.period===per && c.absentId===cid)) return false; // عيادته قائمة
      return true; };
    if(eveBack.length || dispNight.length){
      setNight(nd=>{ const n={...nd};
        eveBack.forEach(ds=>{ const day=n[ds]; if(!day) return; const docs=day.doctors||[]; if(docs.includes(l.doctorId) || docs.length >= (day.eveningSlots||1)) return; n[ds]={ ...day, doctors:[...docs, l.doctorId] }; });
        dispNight.forEach(x=>{ const day=n[x.dayKey]; if(!day) return; const cv={am:[],pm:[],nextAm:[],...(day.coverages||{})}; if((cv[x.slot]||[]).length) return; cv[x.slot]=[x.coverId]; n[x.dayKey]={ ...day, coverages:cv }; });
        return n; });
    }
    setCoverages(cs=>{
      const kept = cs.filter(c=>{
        if(c.absentId!==l.doctorId) return true;
        if(c.reason==="leave" && inRange(c.date)) return false;                       // تغطية الإجازة
        if(c.reason==="post_evening" && inRange((()=>{const x=new Date(c.date);x.setDate(x.getDate()-1);return x.toISOString().split("T")[0];})())) return false; // راحة بعد مسائي أثناء الإجازة
        return true;
      });
      const back = dispCov.filter(x=>x.rec && !kept.some(c=>c.date===x.date && c.period===x.period && c.absentId===x.ownerId)).map(x=>({ ...x.rec, id:uid() }));
      const out = [...kept, ...back];
      // تغطيات عياداته المرتبطة بمناوبته المسائية (نفس اليوم + راحة صباح اليوم التالي) — تعود مع عودة المناوبة، فقط لو المغطّي ما زال متاحاً
      eveCov.forEach(x=>{ const r=x.rec; const eveDay = r.reason==="post_evening" ? prevWorkDay(r.date) : r.date; if(!eveRestored.has(eveDay)) return;
        if(out.some(c=>c.date===r.date && c.period===r.period && c.absentId===r.absentId)) return;
        if(!coverFree(r.coverDoctorId, r.date, r.period, out)) return;
        out.push({ ...r, id:uid() }); });
      return out;
    });
    logAudit&&logAudit(`حذف إجازة د.${fd(l.doctorId)?.name||""} — إلغاء تغطيات عياداته، واستعادة مناوباته وتغطياته لغيره (إن لم يُعيَّن بديل)`);
    showToast&&showToast("تم حذف الإجازة — أُلغيت تغطيات عياداته، واستُعيدت مناوباته وتغطياته حيث لم يُعيَّن بديل");
  };
  const autoCoverLeave = l => { const d=fd(l.doctorId); if(!d) return; const [ly]=l.start.split("-"); const yd=[]; for(let m=0;m<12;m++) yd.push(...monthDays(+ly,m).map(x=>x.date)); const load=id=>{ const s=doctorSessions(doctors.find(x=>x.id===id),yd,nightData,coverages,leaves); return s.covers; }; const AUTO_OVERRIDE_SLOTS=["admin","audit","virtual"]; const adds=[]; const used={}; const runningLoad={}; const s=new Date(l.start),e=new Date(l.end); for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4) continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; ["am","pm"].forEach(p=>{ if(l.period && l.period!==p) return; if(!isClinic(getSlot(d,wi,p))) return; if(coverages.some(c=>c.date===ds&&c.period===p&&c.absentId===d.id)) return; const av=getAvailable(doctors,[d.id],wi,ds,p,leaves,nightData,{},coverages,true).filter(a=>a.status!=="leave"&&(a.status==="free"||AUTO_OVERRIDE_SLOTS.includes(getSlot(a.doc,wi,p)))).map(a=>({a,L:load(a.doc.id)+(runningLoad[a.doc.id]||0)})).sort((x,y)=>x.L-y.L); const key=ds+"|"+p; const taken=used[key]||[]; const pick=av.find(x=>!taken.includes(x.a.doc.id)); if(pick){ adds.push({id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:pick.a.doc.id,reason:"leave"}); (used[key]=used[key]||[]).push(pick.a.doc.id); runningLoad[pick.a.doc.id]=(runningLoad[pick.a.doc.id]||0)+1; } }); } if(!adds.length){ showToast("لا عيادات مكشوفة أو لا متاح","warn"); return; } setCoverages(cs=>[...cs,...adds]); showToast(`تمت تغطية ${adds.length} عيادة بالأنسب`); };
  const sorted = leaves.slice().sort((a,b)=>b.start.localeCompare(a.start));
  const [openMonths,setOpenMonths] = useState(()=>new Set([today.slice(0,7), ...leaves.filter(l=>l.end>=today).map(l=>l.start.slice(0,7))])); // الشهر الحالي + أي شهر فيه إجازة قائمة/قادمة مفتوحة تلقائياً
  const loadCache = {}; // عبء التغطيات السنوي لكل طبيب — يُحسب مرة واحدة لكل عرض بدل تكراره لكل قائمة اختيار
  const [editKey,setEditKey] = useState(null); // عيادة مغطّاة يجري تغيير بديلها
  const toggleMonth = key => setOpenMonths(o=>{ const n=new Set(o); n.has(key)?n.delete(key):n.add(key); return n; });

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🏖 تسجيل إجازة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الطبيب</label><select value={f.doctorId} onChange={e=>setF({...f,doctorId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>النوع</label><select value={f.type} onChange={e=>{ const t=e.target.value; setF({...f,type:t, ...(t==="permission"?{ period:"", end:f.start, clinicClosed:false }:{ period:"" })}); }} style={sIn}>{Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        {f.type==="permission"
          ? <div style={{ gridColumn:"1 / -1" }}><label style={label}>تاريخ الاستئذان</label><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value,end:e.target.value})} style={sIn} /></div>
          : <>
            <div><label style={label}>من</label><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value, ...((!f.end||f.end<e.target.value)?{end:e.target.value}:{})})} style={sIn} /></div>
            <div><label style={label}>إلى</label><input type="date" value={f.end} onChange={e=>setF({...f,end:e.target.value})} style={sIn} /></div>
          </>}
      </div>
      {f.type==="permission" && (()=>{
        /* ── الاستئذان: يظهر جدول الطبيب ذلك اليوم (صباح/ظهر) ويُختار ما يغيب عنه فقط ── */
        const d=doctors.find(x=>x.id===+f.doctorId); const wi=f.start?dayIdx(f.start):-1;
        if(!d || !f.start) return <div style={{ marginTop:12, fontSize:12.5, color:C.muted, background:"var(--surface2)", borderRadius:12, padding:"10px 12px" }}>اختر الطبيب والتاريخ ليظهر جدوله ذلك اليوم.</div>;
        if(wi<0) return <div style={{ marginTop:12, fontSize:12.5, color:C.err, background:"var(--dangerSoft)", borderRadius:12, padding:"10px 12px" }}>هذا اليوم ليس يوم عمل.</div>;
        const lbl = sl => !sl ? "لا شيء" : isClinic(sl) ? "عيادة" : (SLOT_AR[sl]||sl);
        const eveToday = ((nightData[f.start]||{}).doctors||[]).includes(d.id);
        const cardP = (p, icon, name) => { const sl=getSlot(d,wi,p); const on=f.period===p; const cl=isClinic(sl);
          return <button key={p} onClick={()=>setF({...f,period:on?"":p})} style={{ flex:1, textAlign:"start", cursor:"pointer", fontFamily:"inherit", borderRadius:16, padding:"12px 14px", border:`2px solid ${on?C.primary:C.line}`, background:on?"var(--primarySoft)":"var(--surface)" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}><span style={{ fontSize:15, fontWeight:800, color:on?C.primary:C.text, flex:1 }}>{icon} {name}</span><span style={{ width:20, height:20, borderRadius:6, border:`2px solid ${on?C.primary:C.line}`, background:on?C.primary:"transparent", color:"#fff", fontSize:13, lineHeight:"16px", textAlign:"center" }}>{on?"✓":""}</span></div>
            <div style={{ fontSize:13, color:cl?C.text:C.muted, marginTop:4, fontWeight:600 }}>{lbl(sl)}</div>
            <div style={{ fontSize:11.5, marginTop:4, color:on?C.primary:C.muted, fontWeight:700 }}>{on ? (cl?"غائب — تُطلب تغطيتها":"غائب") : "متواجد"}</div>
          </button>; };
        return <div style={{ marginTop:12 }}>
          <label style={label}>جدول د.{d.name.replace(/^د\.\s*/,"")} يوم {DAYS[wi]} — اضغط الفترة التي سيغيب عنها</label>
          <div style={{ display:"flex", gap:8 }}>{cardP("am","☀️","الصباح")}{cardP("pm","🌤","الظهر")}</div>
          {eveToday && <div style={{ fontSize:11.5, color:C.eve, marginTop:6, fontWeight:700 }}>🌙 مناوب مسائي هذا اليوم{f.period==="pm" ? " — استئذان الظهر يُلغي مناوبته ويُطلب بديل" : ""}</div>}
          {!f.period && <div style={{ fontSize:11.5, color:C.muted, marginTop:6 }}>لم تُحدَّد فترة بعد. إذا كان غائباً اليوم كاملاً اختر النوع «طارئة» أو «أخرى».</div>}
        </div>; })()}
      {f.type!=="permission" && <label style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, fontSize:13, color:C.sub, cursor:"pointer" }}>
        <input type="checkbox" checked={f.clinicClosed} onChange={e=>setF({...f,clinicClosed:e.target.checked})} /> العيادة مغلقة خلال الإجازة (لا تحتاج تغطية)
      </label>}
      <button onClick={add} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة</button>
    </div>

    {sorted.length===0 ? <Empty icon="🏖" title="لا إجازات مسجّلة" /> :
      (()=>{
        const groups=[]; const byKey={};
        sorted.forEach(l=>{ const k=l.start.slice(0,7); if(!byKey[k]){ byKey[k]={ key:k, items:[] }; groups.push(byKey[k]); } byKey[k].items.push(l); });
        const curKey=today.slice(0,7);
        return groups.map(({key,items})=>{
          const [y,m]=key.split("-"); const label=`${MONTHS[+m-1]} ${y}`;
          const isOpen = openMonths.has(key);
          return <div key={key} style={{ marginBottom:14 }}>
            <div onClick={()=>toggleMonth(key)} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer", padding:"10px 14px", borderRadius:12, background:key===curKey?"var(--primarySoft)":"var(--surface2)", border:`1px solid ${key===curKey?C.primary:C.line}`, marginBottom:isOpen?10:0 }}>
              <span style={{ fontWeight:800, fontSize:14, color:key===curKey?C.primaryD:C.text }}>{label}</span>
              {key===curKey && <span style={{ fontSize:10, fontWeight:700, background:C.primary, color:"#fff", borderRadius:20, padding:"2px 8px" }}>الحالي</span>}
              <span style={{ fontSize:11.5, color:C.muted }}>{items.length} إجازة</span>
              <span style={{ flex:1 }} />
              <span style={{ color:C.muted, fontSize:12 }}>{isOpen?"▲":"▼"}</span>
            </div>
            {isOpen && <div className="grid-cards">{items.map(l=>{ const d=fd(l.doctorId); if(!d) return null;
        // impact
        // ── ما يخص هذا الطبيب وحده: عياداته، مناوباته المسائية، وتغطياته التي كان يؤديها لغيره — لا شيء عن زملاء لا علاقة لهم بإجازته ──
        const clinics=[];
        const s=new Date(l.start),e=new Date(l.end);
        for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4)continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
          ["am","pm"].forEach(p=>{ if(l.period && l.period!==p) return; /* استئذان جزئي: عيادة الفترة الأخرى قائمة ولا تظهر هنا */ if(isClinic(getSlot(d,wi,p))){ const ex=coverages.find(c=>c.date===ds&&c.period===p&&c.absentId===d.id); clinics.push({ds,p,cov:ex?ex.coverDoctorId:null}); } });
        }
        // مناوباته المسائية التي أُزيل منها بسبب هذه الإجازة ولم يُعيَّن بديل بعد
        const evening = (l.eveRemoved||[]).filter(ds=>{ const nd=nightData[ds]||{}; return (nd.doctors||[]).length < (nd.eveningSlots||1); }).sort();
        // تغطياته التي كان يؤديها لغيره وأُلغيت بسبب إجازته — ما زالت بلا بديل
        const gapCache = {}; const gapsOn = ds => (gapCache[ds] = gapCache[ds] || analyzeDay(ds, doctors, leaves, nightData, coverages, null, restRule).gaps);
        const seen = new Set();
        const myCovs = (l.displaced||[]).filter(x=>{
          if(x.kind==="evecov" || x.ownerId==null) return false;
          const k = `${x.date}|${x.period}|${x.ownerId}`; if(seen.has(k)) return false; seen.add(k);
          return gapsOn(x.date).some(g=>g.ownerId===x.ownerId && g.period===x.period);
        }).map(x=>({ ...x, di:dayIdx(x.date) })).sort((a,b)=>a.date.localeCompare(b.date));
        const uncoveredClinics = l.clinicClosed!==false?0:clinics.filter(c=>!c.cov).length;
        // عيادات بديل المناوبة (التي يتركها بسبب المسائي نفس اليوم + صباح الغد للراحة) ولم تُغطَّ بعد
        const replGaps = [];
        (l.eveRepl||[]).forEach(r=>{ if(!((nightData[r.date]||{}).doctors||[]).includes(r.docId)) return;
          const nx=(()=>{ const x=new Date(r.date); x.setDate(x.getDate()+1); return x.toISOString().split("T")[0]; })();
          [r.date, nx].forEach(ds=>gapsOn(ds).filter(g=>g.ownerId===r.docId && (ds===r.date || g.period==="am")).forEach(g=>{ if(!replGaps.some(x=>x.date===g.date&&x.period===g.period&&x.ownerId===g.ownerId)) replGaps.push({ ...g, reason: ds===r.date?"evening":"post_evening" }); })); });
        replGaps.sort((a,b)=>a.date.localeCompare(b.date)||a.period.localeCompare(b.period));
        const uncovered = uncoveredClinics + evening.length + myCovs.length + replGaps.length;
        const chip = l.clinicClosed!==false && evening.length===0 && myCovs.length===0 && replGaps.length===0 ? {t:"العيادة مغلقة", bg:"var(--surface2)", fg:C.sub}
          : uncovered>0 ? {t:`مكشوف ${uncovered}`, bg:"var(--dangerSoft)", fg:C.err}
          : {t:"مغطّاة ✓", bg:"var(--okSoft)", fg:C.ok};
        // ── كل تفاصيل الإجازة تظهر مباشرة داخل البطاقة (بلا نافذة منبثقة) ──
        const [ly] = l.start.split("-");
        const yd = []; for(let m=0;m<12;m++) yd.push(...monthDays(+ly,m).map(x=>x.date));
        const md = monthDays(+l.start.split("-")[0], +l.start.split("-")[1]-1).map(x=>x.date);
        const loadOf = id => { const k=ly+"|"+id; if(loadCache[k]==null) loadCache[k]=doctorSessions(doctors.find(x=>x.id===id), yd, nightData, coverages, leaves).covers; return loadCache[k]; };
        const pickFor = (wi,ds,period) => rankPickList(getAvailable(doctors,[d.id],wi,ds,period,leaves,nightData,{},coverages,true).map(a=>({ ...a, load:loadOf(a.doc.id), commit:a.status==="warn"?(SLOT_COMMIT[getSlot(a.doc,wi,period)]||"التزام"):null, busyType: a.status==="busy" ? (()=>{ const sl=getSlot(a.doc,wi,period); return isClinic(sl)?"عيادة":(SLOT_AR[sl]||"عيادة"); })() : null })), wi, period);
        const pickForOwner = (ownerId,wi,ds,period) => rankPickList(getAvailable(doctors,[ownerId,d.id],wi,ds,period,leaves,nightData,{},coverages,true).map(a=>({ ...a, load:loadOf(a.doc.id), commit:a.status==="warn"?(SLOT_COMMIT[getSlot(a.doc,wi,period)]||"التزام"):null, busyType: a.status==="busy" ? (()=>{ const sl=getSlot(a.doc,wi,period); return isClinic(sl)?"عيادة":(SLOT_AR[sl]||"عيادة"); })() : null })), wi, period);
        const assignOther = (ownerId,ds,p,cid,reason="absence") => { setCoverages(cs=>[...cs.filter(c=>!(c.date===ds&&c.period===p&&c.absentId===ownerId)), {id:uid(),absentId:ownerId,date:ds,period:p,coverDoctorId:cid,reason}]); logAudit&&logAudit(`بديل لعيادة د.${fd(ownerId)?.name||"؟"} (${perAr(p)} ${dmy(ds)}) ← د.${fd(cid)?.name||"؟"}`); showToast("تم تعيين البديل"); };
        const eveLoad = id => md.reduce((a,dt)=>a+(((nightData[dt]||{}).doctors||[]).includes(id)?1:0),0);
        const nextCal = ds => { const x=new Date(ds); x.setDate(x.getDate()+1); return x.toISOString().split("T")[0]; };
        // ── بديل المناوبة: يُستبعد من الأولوية مَن عليه تغطية نهارية نفس اليوم، أو مناوبة أمس/غداً (تتالٍ)، ويُفضَّل الأقل مناوبات ثم الأقل عيادات تحتاج تغطية بسبب المناوبة ──
        const evePick = ds => { const nightDocs=(nightData[ds]?.doctors)||[]; const prevE=((nightData[prevCalDay(ds)]||{}).doctors)||[]; const nd1=nextCal(ds); const nextE=((nightData[nd1]||{}).doctors)||[]; const wi=dayIdx(ds), nwi=dayIdx(nd1);
          const dayDuty = id => coverages.some(c=>c.date===ds && c.coverDoctorId===id && (c.period==="am"||c.period==="pm"));
          const cost = x => (isClinic(getSlot(x,wi,"am"))?1:0) + (isClinic(getSlot(x,wi,"pm"))?1:0) + ((restRule && nwi>=0 && isClinic(getSlot(x,nwi,"am")))?1:0);
          const out = doctors.filter(x=>x.id!==d.id&&!nightDocs.includes(x.id)).map(x=>{ const lv=onLeave(x,ds,leaves,"eve"); const fixedAny=(x.nightDays||[]).length>0;
            const why = lv?null : fixedAny?"عيادة مسائية ثابتة" : dayDuty(x.id)?"مكلّف بتغطية نهارية نفس اليوم" : (prevE.includes(x.id)||nextE.includes(x.id))?"مناوبة متتالية" : null;
            return { doc:x, status: lv?"leave":why?"warn":"free", commit:why, load:eveLoad(x.id), cost:cost(x) }; })
            .sort((a,b)=>(({free:0,warn:1,busy:2,leave:3}[a.status])-({free:0,warn:1,busy:2,leave:3}[b.status]))||(a.load-b.load)||(a.cost-b.cost));
          if(out[0] && out[0].status==="free") out[0]={ ...out[0], best:true }; return out; };
        const assignClinic = (ds,p,cid) => { setCoverages(cs=>[...cs.filter(c=>!(c.date===ds&&c.period===p&&c.absentId===d.id)), {id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:cid,reason:"leave"}]); logAudit&&logAudit(`بديل إجازة د.${d.name} (${perAr(p)} ${dmy(ds)}) ← د.${fd(cid)?.name||"؟"}`); showToast("تم تعيين البديل"); };
        const assignEve = (ds,cid) => {
          const day0 = nightData[ds]||{doctors:[],coverages:{am:[],pm:[],nextAm:[]}};
          const docs=[...new Set((day0.doctors||[]).map(x=>x===d.id?cid:x))]; if(!docs.includes(cid)) docs.push(cid);
          setNight&&setNight(n=>({ ...n, [ds]:{ ...(n[ds]||day0), doctors:docs } }));
          // يُحفظ البديل بسجل الإجازة — عياداته التي يتركها بسبب المناوبة تظهر بالأسفل ليختار رئيس القسم من يغطيها (بلا تغطية تلقائية)
          setLeaves(ls=>ls.map(x=>x.id===l.id ? { ...x, eveRepl:[...(x.eveRepl||[]).filter(r=>r.date!==ds), { date:ds, docId:cid }] } : x));
          logAudit&&logAudit(`بديل مسائي إجازة د.${d.name} (${dmy(ds)}) ← د.${fd(cid)?.name||"؟"}`);
          showToast("تم تعيين بديل المسائي — راجع عياداته بالأسفل واختر من يغطيها"); };
        const openClinics = l.clinicClosed!==false ? [] : clinics;
        const rowS = { display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", padding:"7px 0", borderTop:`1px dashed ${C.line2}` };
        const lab = t => <span style={{ fontSize:12.5, fontWeight:700, color:C.text, minWidth:118 }}>{t}</span>;
        const secT = (icon,t,col,n) => <div style={{ fontSize:12.5, fontWeight:800, color:col, margin:"10px 0 2px" }}>{icon} {t}{n>0&&<span style={{ color:C.err }}> · {n}</span>}</div>;
        const pickerBox = el => <div style={{ flex:"1 1 220px", minWidth:0 }}>{el}</div>;
        return <div key={l.id} style={{ ...card(), padding:"12px 14px", borderInlineStart:`4px solid ${uncovered>0?C.err:(chip.fg===C.ok?C.ok:C.line)}` }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <Avatar doc={d} size={36}/>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>{d.name}</div>
              <div style={{ fontSize:11.5, color:C.sub }}>{TYPES[l.type]||"إجازة"} · {l.start===l.end?dmy(l.start):<>{dmy(l.start)} ← {dmy(l.end)}</>}{l.period && <b style={{ color:l.period==="am"?"#92400E":"#3730A3", marginInlineStart:6 }}>{l.period==="am"?"☀️ الصباح فقط":"🌤 الظهر فقط"}</b>}</div>
            </div>
            <span style={{ fontSize:10.5, fontWeight:700, background:chip.bg, color:chip.fg, borderRadius:20, padding:"4px 11px", whiteSpace:"nowrap" }}>{chip.t}</span>
            {uncoveredClinics>0 && <button onClick={()=>autoCoverLeave(l)} title="تغطية عياداته بالأنسب" style={{ background:"var(--primarySoft)", border:"none", borderRadius:10, width:34, height:30, fontSize:14, color:C.primary, cursor:"pointer", flexShrink:0 }}>⚡</button>}
            <button onClick={()=>{ if(confirm("حذف هذه الإجازة؟")) del(l.id); }} title="حذف الإجازة" style={{ background:"var(--dangerSoft)", border:"none", borderRadius:10, width:34, height:30, fontSize:14, color:C.err, cursor:"pointer", flexShrink:0 }}>🗑</button>
          </div>
          {l.clinicClosed!==false
            ? <div style={{ fontSize:11.5, color:C.muted, marginTop:8 }}>🏥 العيادة مغلقة — {clinics.length?`${clinics.length} فترة عيادة لا تحتاج تغطية`:"لا عيادات خلال الإجازة"}</div>
            : <>{secT("🏥","عياداته",C.text,uncoveredClinics)}
              {openClinics.length===0 && <div style={{ fontSize:11.5, color:C.muted }}>لا عيادات خلال الإجازة</div>}
              {openClinics.map((c,i)=>{ const k=`${l.id}|${c.ds}|${c.p}`; const editing=editKey===k; return <div key={i} style={rowS}>
                {lab(`${DAYS[dayIdx(c.ds)]||""} ${dmy(c.ds)} · ${c.p==="am"?"صباح":"ظهر"}`)}
                {c.cov && !editing ? <><span style={{ fontSize:12.5, color:C.ok, fontWeight:700, flex:1 }}>✓ د.{fd(c.cov)?.name}</span><button onClick={()=>setEditKey(k)} style={{ ...sGhost, padding:"3px 10px", fontSize:11 }}>تغيير</button></>
                  : pickerBox(<CoverPicker list={pickFor(dayIdx(c.ds),c.ds,c.p)} cur={c.cov} onPick={cid=>{ assignClinic(c.ds,c.p,cid); setEditKey(null); }} />)}
              </div>; })}</>}
          {(evening.length>0 || replGaps.length>0) && <>
            {secT("🌙","مناوباته المسائية",C.eve,evening.length)}
            {evening.map((ds,i)=><div key={"e"+i} style={rowS}>{lab(`${DAYS[dayIdx(ds)]||""} ${dmy(ds)}`)}{pickerBox(<CoverPicker list={evePick(ds)} cur={null} onPick={cid=>assignEve(ds,cid)} />)}</div>)}
            {replGaps.length>0 && <>
              <div style={{ display:"flex", alignItems:"center", gap:8, margin:"8px 0 2px" }}>
                <div style={{ flex:1, fontSize:12, fontWeight:700, color:C.text }}>عيادات البديل بسبب المناوبة <span style={{ color:C.err }}>· {replGaps.length}</span></div>
                <button onClick={()=>{ let n=0; const run={}; const pool=[...coverages]; replGaps.forEach(g=>{ const list=pickForOwner(g.ownerId,g.di,g.date,g.period).filter(a=>a.status==="free"||a.flex).filter(a=>!pool.some(c=>c.date===g.date&&c.period===g.period&&c.coverDoctorId===a.doc.id)).sort((x,y)=>(x.load+(run[x.doc.id]||0))-(y.load+(run[y.doc.id]||0))); const pk=list[0]; if(!pk) return; pool.push({id:uid(),absentId:g.ownerId,date:g.date,period:g.period,coverDoctorId:pk.doc.id,reason:g.reason}); run[pk.doc.id]=(run[pk.doc.id]||0)+1; n++; }); const adds=pool.slice(coverages.length); if(adds.length) setCoverages(cs=>[...cs,...adds]); showToast(n<replGaps.length?`غُطّيت ${n} — تبقّى ${replGaps.length-n} تحتاج اختياراً يدوياً`:`غُطّيت ${n} عيادة بالأنسب`, n<replGaps.length?"warn":undefined); }} style={{ ...sBtn(C.primary), padding:"5px 11px", fontSize:11.5 }}>⚡ تغطيتها بالأنسب</button>
              </div>
              {replGaps.map((g,i)=><div key={"r"+i} style={rowS}>{lab(`${dmy(g.date)} ${g.period==="am"?"صباح":"ظهر"} · د.${fd(g.ownerId)?.name||"؟"}`)}{pickerBox(<CoverPicker list={pickForOwner(g.ownerId,g.di,g.date,g.period)} cur={null} onPick={cid=>assignOther(g.ownerId,g.date,g.period,cid,g.reason)} />)}</div>)}
            </>}
          </>}
          {myCovs.length>0 && <>
            {secT("🔄","تغطياته التي كان يؤديها",C.warn,myCovs.length)}
            {myCovs.map((x,i)=><div key={"c"+i} style={rowS}>{lab(`${dmy(x.date)} ${x.period==="am"?"صباح":"ظهر"} · عيادة د.${fd(x.ownerId)?.name||"؟"}`)}{pickerBox(<CoverPicker list={pickForOwner(x.ownerId,x.di,x.date,x.period)} cur={null} onPick={cid=>assignOther(x.ownerId,x.date,x.period,cid, x.kind==="night" ? (x.slot==="nextAm"?"post_evening":"evening") : ((x.rec&&x.rec.reason)||"absence"))} />)}</div>)}
          </>}
        </div>;
      })}</div>}
          </div>;
        });
      })()}
  </div>;
}

// ════════════════════════════════ DOCTORS ════════════════════════════════
function DoctorsPage({ doctors, leaves, nightData, coverages, today, fd, setDoctors, showToast, logAudit }) {
  const [open, setOpen] = useState(null);
  const [newName, setNewName] = useState("");
  const [q, setQ] = useState("");
  const [flt, setFlt] = useState("all");
  const [sortK, setSortK] = useState(()=>S.get("v2_docs_sort")||"order");
  useEffect(()=>S.set("v2_docs_sort",sortK),[sortK]);
  const [view, setView] = useState(()=>S.get("v2_docs_view")==="matrix"?"matrix":"cards");
  useEffect(()=>S.set("v2_docs_view",view),[view]);
  const normN = s => String(s||"").replace(/^د\.?\s*/,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();
  const addDoc = () => { const nm=newName.trim().replace(/^د\.?\s*/,""); if(!nm){showToast("أدخل الاسم","warn");return;} if(doctors.some(d=>normN(d.name)===normN(nm))){ showToast("هذا الطبيب موجود مسبقاً","warn"); return; } const id=uid(); setDoctors(ds=>[...ds,{ id, name:nm, color:PALETTE[ds.length%PALETTE.length], nightDays:[], blockedDays:[], rank:"specialist", adminPosition:"none", sched:{0:{am:"",pm:"",eve:""},1:{am:"",pm:"",eve:""},2:{am:"",pm:"",eve:""},3:{am:"",pm:"",eve:""},4:{am:"",pm:"",eve:""}} }]); setNewName(""); setOpen(id); setView("cards"); logAudit&&logAudit(`إضافة طبيب: ${nm}`); };
  const upd = (id,patch) => setDoctors(ds=>ds.map(d=>d.id===id?{...d,...patch}:d));
  const setSlot = (id,di,p,v) => setDoctors(ds=>ds.map(d=>{ if(d.id!==id)return d; const sched={...d.sched}; sched[di]={...sched[di],[p]:v}; const patch={...d,sched}; if(p==="eve"){ patch.nightDays=[0,1,2,3,4].filter(x=>sched[x]&&sched[x].eve); } return patch; }));
  const copySched = (id,fromId) => { const src=fd(fromId); if(!src) return; setDoctors(ds=>ds.map(d=>{ if(d.id!==id) return d; const sched={}; for(let i=0;i<5;i++) sched[i]={ am:getSlot(src,i,"am")||"", pm:getSlot(src,i,"pm")||"", eve:(src.sched?.[i]?.eve)||((src.nightDays||[]).includes(i)?"clinic":"") }; return { ...d, sched, nightDays:[0,1,2,3,4].filter(x=>sched[x].eve) }; })); showToast(`نُسخ جدول د.${src.name}`); };
  const clearSched = id => setDoctors(ds=>ds.map(d=>d.id!==id?d:{ ...d, nightDays:[], sched:{0:{am:"",pm:"",eve:""},1:{am:"",pm:"",eve:""},2:{am:"",pm:"",eve:""},3:{am:"",pm:"",eve:""},4:{am:"",pm:"",eve:""}} }));
  const toggleBlocked = (id,di) => setDoctors(ds=>ds.map(d=>{ if(d.id!==id) return d; const b=new Set(d.blockedDays||[]); b.has(di)?b.delete(di):b.add(di); return { ...d, blockedDays:[...b].sort() }; }));
  const del = id => { const dn=fd(id)?.name||""; setDoctors(ds=>ds.filter(d=>d.id!==id)); logAudit&&logAudit(`حذف طبيب: د.${dn}`); };
  const [y,m]=today.split("-"); const monthPre=`${y}-${m}`;
  const eveCountThisMonth = id => Object.keys(nightData||{}).filter(dt=>dt.startsWith(monthPre) && ((nightData[dt]||{}).doctors||[]).includes(id)).length;
  const covCountThisMonth = id => (coverages||[]).filter(c=>c.coverDoctorId===id && String(c.date).startsWith(monthPre)).length + Object.keys(nightData||{}).filter(dt=>dt.startsWith(monthPre)).reduce((a,dt)=>{ const cv=(nightData[dt]||{}).coverages||{}; return a+["am","pm","nextAm"].reduce((b,s)=>b+((cv[s]||[]).filter(x=>x===id).length),0); },0);
  const activeLeaveOf = id => (leaves||[]).find(l=>l.doctorId===id && today>=l.start && today<=l.end);
  const nextLeaveOf = id => (leaves||[]).filter(l=>l.doctorId===id && l.start>today).sort((a,b)=>a.start.localeCompare(b.start))[0];
  const tdi = dayIdx(today);
  const hasMail = d => String(d.email||"").includes("@");
  const eveOn = (d,di) => !!((d.sched?.[di]?.eve)||(d.nightDays||[]).includes(di));
  const todayOf = d => {
    if(tdi<0) return null;
    const lv = activeLeaveOf(d.id);
    if(lv && !lv.period) return { t:`🏖 ${LEAVE_AR[lv.type]||"إجازة"}`, bg:"var(--warnSoft)", fg:C.warn };
    if(((nightData[today]||{}).doctors||[]).includes(d.id)) return { t:"🌙 مسائي اليوم", bg:"var(--eveSoft)", fg:"var(--eve)" };
    const a=getSlot(d,tdi,"am"), p=getSlot(d,tdi,"pm");
    const lab = (s,per) => lv && lv.period===per ? "استئذان" : (SLOT_AR[s]||"—");
    if(!a && !p && !(lv&&lv.period)) return { t:"اليوم: بلا فترات", bg:"var(--surface2)", fg:C.muted };
    return { t:`اليوم: ${lab(a,"am")} · ${lab(p,"pm")}`, bg:"var(--surface2)", fg:C.sub };
  };

  const rows = doctors.map((d,i)=>({ d, i, lv:activeLeaveOf(d.id), eveN:eveCountThisMonth(d.id), covN:covCountThisMonth(d.id) }));
  const fixedByDay = [0,1,2,3,4].map(di=>doctors.filter(d=>eveOn(d,di)).length);
  const onLvN = rows.filter(r=>r.lv && !r.lv.period).length;
  const noMailN = doctors.filter(d=>!hasMail(d)).length;
  const FLT = [["all","الكل",doctors.length],["leave","في إجازة اليوم",onLvN],["fixed","لهم مسائي ثابت",doctors.filter(d=>(d.nightDays||[]).length).length],["nofixed","بلا مسائي ثابت",doctors.filter(d=>!(d.nightDays||[]).length).length],["nomail","بلا بريد",noMailN]];
  const qn = normN(q);
  const shown = rows.filter(r=>(!qn || normN(r.d.name).includes(qn)) && (flt==="all" || (flt==="leave"&&r.lv&&!r.lv.period) || (flt==="fixed"&&(r.d.nightDays||[]).length) || (flt==="nofixed"&&!(r.d.nightDays||[]).length) || (flt==="nomail"&&!hasMail(r.d))))
    .sort((a,b)=> sortK==="name" ? a.d.name.localeCompare(b.d.name,"ar") : sortK==="eve" ? b.eveN-a.eveN : sortK==="cov" ? b.covN-a.covN : a.i-b.i);

  const ABBR = { clinic:"ع", clinic_am:"ع", clinic_pm:"ع", virtual:"ف", audit:"ق", training:"ت", admin:"إ", committee:"ل" };
  const cellSt = (s,eve) => eve ? { bg:s?"var(--eveSoft)":"var(--surface2)", fg:"var(--eve)", t:s?"🌙":"" } : (()=>{ const st=slotStyle(s); return { bg:s?st.bg:"var(--surface2)", fg:st.fg, t:s?(ABBR[s]||(SLOT_AR[s]||"").slice(0,1)):"" }; })();
  const MiniWeek = ({d}) => <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:3 }}>
    {[0,1,2,3,4].map(di=><div key={di} style={{ minWidth:0 }}>
      <div style={{ fontSize:9, fontWeight:700, color:di===tdi?C.primary:C.muted, textAlign:"center", marginBottom:2 }}>{DAYS[di]}</div>
      {["am","pm"].map(p=>{ const s=getSlot(d,di,p); const st=slotStyle(s); return <div key={p} title={SLOT_AR[s]||"فراغ"} style={{ height:16, borderRadius:4, marginBottom:2, background:s?st.bg:"var(--surface2)", color:st.fg, fontSize:9, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", border:`1px solid ${s?st.fg+"33":"transparent"}` }}>{s?SLOT_AR[s]:""}</div>; })}
      <div style={{ height:6, borderRadius:3, background:eveOn(d,di)?"var(--eve)":"transparent" }} title={eveOn(d,di)?"مسائي ثابت":""} />
    </div>)}
  </div>;

  return <div className="fade">
    <style>{`.dm-tbl th,.dm-tbl td{border-top:1px solid var(--line2)}.dm-tbl tbody tr:hover td{filter:brightness(.97)}@media(max-width:760px){.dm-hide{display:none}}`}</style>
    {/* ── شريط علوي ── */}
    <div style={{ ...card(), padding:14, marginBottom:14 }}>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 بحث بالاسم" style={{ ...sIn, flex:"2 1 180px" }} />
        <div style={{ display:"flex", gap:6, flex:"3 1 260px" }}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="اسم طبيب جديد" style={{ ...sIn, flex:1 }} onKeyDown={e=>e.key==="Enter"&&addDoc()} />
          <button onClick={addDoc} style={sBtn(C.primary)}>＋ إضافة</button>
        </div>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", marginTop:10 }}>
        {FLT.map(([k,l,n])=>{ if(k!=="all"&&!n) return null; const on=flt===k; return <button key={k} onClick={()=>setFlt(k)} style={{ border:`1.5px solid ${on?C.primary:C.line}`, background:on?C.primary:"var(--surface)", color:on?"#fff":C.sub, borderRadius:999, padding:"5px 12px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>{l} {n}</button>; })}
        <span style={{ flex:1 }} />
        <select value={sortK} onChange={e=>setSortK(e.target.value)} style={{ ...sIn, width:"auto", padding:"6px 9px", fontSize:12.5 }}>
          <option value="order">ترتيب القسم</option><option value="name">أبجدي</option><option value="eve">الأكثر مسائي (الشهر)</option><option value="cov">الأكثر تغطية (الشهر)</option>
        </select>
        <div style={{ display:"flex", background:"var(--surface2)", borderRadius:10, padding:3, gap:2 }}>
          {[["cards","▦ بطاقات"],["matrix","▤ الجدول الأسبوعي"]].map(([k,l])=><button key={k} onClick={()=>setView(k)} style={{ border:"none", borderRadius:8, padding:"6px 11px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit", background:view===k?"var(--surface)":"transparent", color:view===k?C.primary:C.sub, boxShadow:view===k?"0 1px 3px rgba(0,0,0,.08)":"none" }}>{l}</button>)}
        </div>
      </div>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:12, paddingTop:12, borderTop:`1px solid ${C.line2}`, alignItems:"center" }}>
        <span style={{ fontSize:12, fontWeight:800, color:C.sub }}>🌙 المسائي الثابت:</span>
        {[0,1,2,3,4].map(di=><span key={di} style={{ fontSize:12, background:"var(--eveSoft)", color:"var(--eve)", borderRadius:999, padding:"3px 10px", fontWeight:700 }}>{DAYS[di]} {fixedByDay[di]}</span>)}
        <span style={{ flex:1 }} />
        {onLvN>0 && <span style={{ fontSize:12, color:C.warn, fontWeight:700 }}>🏖 {onLvN} في إجازة اليوم</span>}
        {noMailN>0 && <span style={{ fontSize:12, color:C.err, fontWeight:700 }}>✉️ {noMailN} بلا بريد</span>}
      </div>
    </div>

    {doctors.length===0 ? <Empty icon="👨‍⚕️" title="لا أطباء بعد" hint="أضف أول طبيب من الأعلى" /> :
     shown.length===0 ? <Empty icon="🔍" title="لا نتائج" hint="غيّر البحث أو التصفية" /> :

    view==="matrix" ? <div style={{ ...card(), padding:0, overflow:"hidden" }}>
      <div style={{ overflowX:"auto" }}>
        <table className="dm-tbl" style={{ width:"100%", borderCollapse:"collapse", fontSize:11.5, minWidth:640 }}>
          <thead>
            <tr style={{ background:"var(--surface2)" }}>
              <th rowSpan={2} style={{ padding:"8px 10px", textAlign:"start", fontSize:12, position:"sticky", insetInlineStart:0, background:"var(--surface2)", zIndex:1 }}>الطبيب</th>
              {[0,1,2,3,4].map(di=><th key={di} colSpan={3} style={{ padding:"7px 4px", fontSize:12, color:di===tdi?C.primary:C.text, borderInlineStart:`2px solid ${C.line}` }}>{DAYS[di]}{di===tdi?" •":""}</th>)}
            </tr>
            <tr style={{ background:"var(--surface2)" }}>
              {[0,1,2,3,4].map(di=>["ص","ظ","م"].map((p,pi)=><th key={di+p} style={{ padding:"3px 2px", fontSize:10, color:C.muted, fontWeight:700, borderInlineStart:pi===0?`2px solid ${C.line}`:"none" }}>{p}</th>))}
            </tr>
          </thead>
          <tbody>{shown.map(({d,lv},ri)=><tr key={d.id} onClick={()=>{ setView("cards"); setOpen(d.id); setTimeout(()=>document.getElementById("doc-"+d.id)?.scrollIntoView({behavior:"smooth",block:"start"}),80); }} style={{ cursor:"pointer" }}>
            <td style={{ padding:"6px 10px", fontWeight:700, whiteSpace:"nowrap", position:"sticky", insetInlineStart:0, background:ri%2?"var(--rowAlt)":"var(--surface)", boxShadow:`inset -3px 0 0 ${d.color}`, zIndex:1 }}>د.{d.name}{lv&&!lv.period?<span style={{ color:C.warn, fontSize:10 }}> 🏖</span>:null}</td>
            {[0,1,2,3,4].map(di=>[["am",false],["pm",false],["eve",true]].map(([p,ev],pi)=>{ const s=ev?(eveOn(d,di)?"clinic":""):getSlot(d,di,p); const c=cellSt(s,ev); return <td key={di+p} style={{ padding:2, borderInlineStart:pi===0?`2px solid ${C.line}`:"none", background:ri%2?"var(--rowAlt)":"var(--surface)" }}><div title={ev?(s?"مسائي ثابت":""):(SLOT_AR[s]||"فراغ")} style={{ height:24, borderRadius:5, background:c.bg, color:c.fg, fontWeight:800, fontSize:10.5, display:"flex", alignItems:"center", justifyContent:"center" }}>{c.t}</div></td>; }))}
          </tr>)}</tbody>
          <tfoot><tr style={{ background:"var(--primarySoft)" }}>
            <td style={{ padding:"7px 10px", fontWeight:800, fontSize:11.5, color:C.primaryD, position:"sticky", insetInlineStart:0, background:"var(--primarySoft)", zIndex:1 }}>عيادات فعلية</td>
            {[0,1,2,3,4].map(di=>[["am",false],["pm",false],["eve",true]].map(([p,ev],pi)=>{ const n=shown.filter(({d})=>ev?eveOn(d,di):isClinic(getSlot(d,di,p))).length; return <td key={di+p} style={{ textAlign:"center", fontWeight:800, color:ev?"var(--eve)":C.primaryD, borderInlineStart:pi===0?`2px solid ${C.line}`:"none", padding:"6px 2px" }}>{n}</td>; }))}
          </tr></tfoot>
        </table>
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:10, padding:"10px 14px", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line2}` }}>
        {[["clinic","ع = عيادة"],["virtual","ف = افتراضية"],["audit","ق = تدقيق"],["training","ت = تدريب"],["admin","إ = إداري"]].map(([s,l])=>{ const st=slotStyle(s); return <span key={s} style={{ display:"inline-flex", alignItems:"center", gap:4 }}><i style={{ width:12, height:12, borderRadius:3, background:st.bg, border:`1px solid ${st.fg}55`, display:"inline-block" }} />{l}</span>; })}
        <span>🌙 = مسائي ثابت · اضغط الصف للتعديل</span>
      </div>
    </div> :

      <div className="grid-cards">{shown.map(({d,lv,eveN,covN})=>{ const isOpen=open===d.id; const nextLv=nextLeaveOf(d.id); const tdy=todayOf(d); return (
        <div key={d.id} id={"doc-"+d.id} style={{ ...card(), overflow:"hidden", borderInlineStart:`4px solid ${d.color}`, gridColumn:isOpen?"1 / -1":undefined }}>
          <div onClick={()=>setOpen(isOpen?null:d.id)} style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px 8px", cursor:"pointer" }}>
            <Avatar doc={d} size={36}/>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:800, fontSize:14, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>د.{d.name}</div>
              <div style={{ fontSize:11, color:C.sub }}>{rankLabel(rankOf(d))}{posSS(d.adminPosition,d)>1?` · ${posLabel(d.adminPosition,d)}`:""} · هدف الرعاية {directTarget(d)}</div>
            </div>
            <Kebab items={[
              { icon:"✏️", label:isOpen?"إغلاق التعديل":"تعديل", onClick:()=>setOpen(isOpen?null:d.id) },
              { icon:"🗑", label:"حذف الطبيب", danger:true, onClick:()=>{ if(confirm(`حذف د.${d.name}؟`)) del(d.id); } },
            ]} />
          </div>
          <div style={{ padding:"0 14px 12px" }}>
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:9 }}>
              {tdy && <span style={{ fontSize:10.5, fontWeight:700, background:tdy.bg, color:tdy.fg, borderRadius:20, padding:"3px 9px" }}>{tdy.t}</span>}
              <span style={{ fontSize:10.5, fontWeight:700, background:"var(--eveSoft)", color:"var(--eve)", borderRadius:20, padding:"3px 9px" }}>🌙 {eveN} هذا الشهر</span>
              {covN>0 && <span style={{ fontSize:10.5, fontWeight:700, background:"var(--primarySoft)", color:C.primaryD, borderRadius:20, padding:"3px 9px" }}>🔄 {covN} تغطية</span>}
              {!lv && nextLv && <span style={{ fontSize:10.5, fontWeight:700, background:"var(--surface2)", color:C.sub, borderRadius:20, padding:"3px 9px" }}>🏖 {dmy(nextLv.start)}</span>}
              {!hasMail(d) && <span style={{ fontSize:10.5, fontWeight:700, background:"var(--dangerSoft)", color:C.err, borderRadius:20, padding:"3px 9px" }}>✉️ بلا بريد</span>}
              {d.partnerId && <span style={{ fontSize:10.5, fontWeight:700, background:"var(--surface2)", color:C.sub, borderRadius:20, padding:"3px 9px" }}>🔗 د.{fd(d.partnerId)?.name||"—"}</span>}
            </div>
            {!isOpen && <div onClick={()=>setOpen(d.id)} style={{ cursor:"pointer" }}><MiniWeek d={d} /></div>}
          </div>

          {isOpen && <div style={{ padding:"12px 14px 14px", borderTop:`1px solid ${C.line2}`, background:"color-mix(in srgb,var(--surface2) 45%,var(--surface))" }}>
            <div style={{ fontSize:12.5, fontWeight:800, marginBottom:8 }}>👤 البيانات</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10, marginBottom:14 }}>
              <div><label style={label}>الاسم</label><input value={d.name} onChange={e=>upd(d.id,{name:e.target.value})} style={sIn} /></div>
              <div><label style={label}>البريد الإلكتروني (للتذكير)</label><input type="email" value={d.email||""} onChange={e=>upd(d.id,{email:e.target.value.trim()})} placeholder="doctor@example.com" style={{ ...sIn, direction:"ltr", textAlign:"left" }} /></div>
              <div><label style={label}>الدرجة</label><select value={rankOf(d)} onChange={e=>upd(d.id,{rank:e.target.value})} style={sIn}><option value="specialist">أخصائي</option><option value="consultant">استشاري</option></select></div>
              <div><label style={label}>المنصب الإداري (هدف الرعاية = ١٠ − SS)</label><select value={normPos(d.adminPosition,d)} onChange={e=>upd(d.id,{adminPosition:e.target.value})} style={sIn}>{ADMIN_POS.map(pp=><option key={pp.code} value={pp.code}>{pp.code} · {pp.ar} — SS {pp.ss} · DS {10-pp.ss}</option>)}</select></div>
              <div><label style={label}>🔗 شريك العيادة (يُفضَّل عند التغطية)</label><select value={d.partnerId||""} onChange={e=>upd(d.id,{partnerId:e.target.value?+e.target.value:null})} style={sIn}><option value="">— بلا شريك —</option>{doctors.filter(x=>x.id!==d.id).map(x=><option key={x.id} value={x.id}>د.{x.name}</option>)}</select></div>
              <div><label style={label}>اللون</label><div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>{PALETTE.map(c=><button key={c} onClick={()=>upd(d.id,{color:c})} style={{ width:24, height:24, borderRadius:"50%", background:c, border:d.color===c?"3px solid var(--ink)":"2px solid var(--surface)", cursor:"pointer" }} />)}</div></div>
            </div>

            <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:6 }}>
              <div style={{ flex:1, fontSize:12.5, fontWeight:800 }}>🏥 الجدول الأسبوعي</div>
              <select value="" onChange={e=>{ if(e.target.value && confirm("استبدال جدول هذا الطبيب بجدول الطبيب المختار؟")) copySched(d.id,+e.target.value); }} style={{ ...sIn, width:"auto", padding:"6px 9px", fontSize:12 }}>
                <option value="">📋 نسخ جدول من…</option>
                {doctors.filter(x=>x.id!==d.id).map(x=><option key={x.id} value={x.id}>د.{x.name}</option>)}
              </select>
              <button onClick={()=>{ if(confirm("مسح كل فترات الجدول الأسبوعي؟")) clearSched(d.id); }} style={{ ...sGhost, padding:"6px 10px", fontSize:12, color:C.err }}>مسح</button>
            </div>
            <div style={{ fontSize:10.5, color:C.muted, marginBottom:6 }}>🌙 «مساء» = عيادة مسائية ثابتة (تُحسب فترتين)، والأيام المسائية الثابتة تُشتق منها تلقائياً.</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,minmax(0,1fr))", gap:6, marginBottom:8 }}>
              {[0,1,2,3,4].map(di=><div key={di} style={{ minWidth:0 }}>
                <div style={{ fontSize:11, fontWeight:800, color:di===tdi?C.primary:C.sub, textAlign:"center", marginBottom:4 }}>{DAYS[di]}</div>
                {[["am","صباح"],["pm","ظهر"]].map(([p,pl])=>{ const v=getSlot(d,di,p); const st=slotStyle(v); return (
                  <div key={p} style={{ marginBottom:5 }}>
                    <div style={{ fontSize:9, color:C.muted, marginBottom:2, textAlign:"center" }}>{pl}</div>
                    <select value={v} onChange={e=>setSlot(d.id,di,p,e.target.value)} style={{ width:"100%", border:`1px solid ${v?st.fg+"55":C.line}`, background:v?st.bg:"var(--surface)", color:v?st.fg:C.text, borderRadius:8, padding:"6px 2px", fontSize:11, fontWeight:v?700:400 }}>{SLOT_OPTS.map(([sv,l])=><option key={sv} value={sv}>{l}</option>)}</select>
                  </div>
                ); })}
                <div style={{ fontSize:9, color:C.muted, marginBottom:2, textAlign:"center" }}>مساء</div>
                {(()=>{ const ev=eveOn(d,di); return <button onClick={()=>setSlot(d.id,di,"eve",ev?"":"clinic")} style={{ width:"100%", border:`1px solid ${ev?"#C7BEFB":C.line}`, background:ev?"var(--eveSoft)":"var(--surface)", color:ev?"var(--eve)":C.muted, borderRadius:8, padding:"6px 2px", fontSize:11, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>{ev?"🌙 ثابت":"—"}</button>; })()}
              </div>)}
            </div>

            <div style={{ fontSize:12.5, fontWeight:800, margin:"14px 0 4px" }}>⛔ أيام لا يُكلَّف فيها بمسائي إضافي</div>
            <div style={{ fontSize:10.5, color:C.muted, marginBottom:6 }}>عند التوزيع التلقائي أو اقتراح البدلاء لا يُختار في هذه الأيام (مثلاً لظرف ثابت).</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:14 }}>
              {[0,1,2,3,4].map(di=>{ const on=(d.blockedDays||[]).includes(di); return <button key={di} onClick={()=>toggleBlocked(d.id,di)} style={{ border:`1.5px solid ${on?C.err:C.line}`, background:on?"var(--dangerSoft)":"var(--surface)", color:on?C.err:C.sub, borderRadius:999, padding:"6px 14px", fontSize:12.5, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>{on?"⛔ ":""}{DAYS[di]}</button>; })}
            </div>

            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>{ logAudit&&logAudit(`تعديل بيانات د.${d.name}`); showToast("تم حفظ بيانات الطبيب"); setOpen(null); }} style={{ ...sBtn(C.primary), flex:1 }}>💾 حفظ وإغلاق</button>
              <button onClick={()=>{ if(confirm(`حذف د.${d.name}؟`)) del(d.id); }} style={{ ...sGhost, color:C.err }}>🗑 حذف</button>
            </div>
          </div>}
        </div>
      ); })}</div>}
  </div>;
}

// ════════════════════════════════ STATS ════════════════════════════════
function StatsPage({ doctors, leaves, nightData, coverages, today, fd, settings, initialTab }) {
  const [preset,setPreset] = useState(()=>{ const v=S.get("v2_stats_preset"); return ["week","month","quarter","year","custom"].includes(v)?v:"month"; });
  useEffect(()=>S.set("v2_stats_preset",preset),[preset]);
  const [tab,setTab] = useState(()=>{ if(initialTab) return initialTab; const t=S.get("v2_stats_tab"); return ["summary","doctors","reports"].includes(t)?t:"summary"; });
  useEffect(()=>S.set("v2_stats_tab",tab),[tab]);
  useEffect(()=>{ if(initialTab) setTab(initialTab); },[initialTab]);
  const [anchor,setAnchor] = useState(today);
  const [rangeFrom,setRangeFrom] = useState(()=>today.slice(0,8)+"01");
  const [rangeTo,setRangeTo] = useState(today);
  const [sel,setSel] = useState(null);
  const [full,setFull] = useState(false);
  const [sortK,setSortK] = useState("load");
  const [sortDir,setSortDir] = useState(1);
  const [stFilter,setStFilter] = useState("all");
  const [repDoc,setRepDoc] = useState("all");

  const period = (()=>{
    const [y,m] = anchor.split("-").map(Number);
    if(preset==="week"){ const t=new Date(anchor); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const dates=[]; for(let i=0;i<5;i++){ const d=new Date(sun); d.setDate(sun.getDate()+i); dates.push(d.toISOString().split("T")[0]); } return { dates, label:`أسبوع ${dmy(dates[0])} ← ${dmy(dates[4])}` }; }
    if(preset==="month"){ return { dates:monthDays(y,m-1).map(x=>x.date), label:`${MONTHS[m-1]} ${y}` }; }
    if(preset==="quarter"){ const start=y*12+(m-1)-2; const dates=[]; for(let i=0;i<3;i++){ const a=start+i; dates.push(...monthDays(Math.floor(a/12),((a%12)+12)%12).map(x=>x.date)); } const sY=Math.floor(start/12), sM=((start%12)+12)%12; return { dates, label:`${MONTHS[sM]} ${sY} ← ${MONTHS[m-1]} ${y}` }; }
    if(preset==="year"){ const dates=[]; for(let i=0;i<12;i++) dates.push(...monthDays(y,i).map(x=>x.date)); return { dates, label:`سنة ${y}` }; }
    const dates=[]; const s=new Date(rangeFrom), e=new Date(rangeTo); if(e>=s){ for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)) dates.push(d.toISOString().split("T")[0]); } return { dates, label:`${dmy(rangeFrom)} ← ${dmy(rangeTo)}` };
  })();
  const md = period.dates;
  const shiftAnchor = n => { const d=new Date(anchor); if(preset==="week") d.setDate(d.getDate()+7*n); else if(preset==="month") d.setMonth(d.getMonth()+n); else if(preset==="quarter") d.setMonth(d.getMonth()+3*n); else if(preset==="year") d.setFullYear(d.getFullYear()+n); setAnchor(d.toISOString().split("T")[0]); };
  const workdaysN = md.filter(dt=>dayIdx(dt)>=0).length;
  const loadStatus = (care,target) => { if(!target||target<=0) return { key:"na", color:"#64748b", label:"—" }; const r=care/target; if(r>=1.05) return { key:"over", color:"#064E3B", label:"أكثر من المطلوب" }; if(r>=0.90) return { key:"meets", color:"#16A34A", label:"مطابق للمطلوب" }; if(r>=0.65) return { key:"under", color:"#CA8A04", label:"ناقص" }; return { key:"vlow", color:"#DC2626", label:"ناقص جداً" }; };

  const overview = doctors.map(d=>{
    const sess=doctorSessions(d, md, nightData, coverages, leaves);
    const annualDays = md.filter(dt=>dayIdx(dt)>=0 && leaves.some(l=>l.doctorId===d.id && l.type==="annual" && dt>=l.start && dt<=l.end)).length;
    const otherLeaveDays = md.filter(dt=>dayIdx(dt)>=0 && leaves.some(l=>l.doctorId===d.id && l.type && l.type!=="annual" && l.type!=="permission" && dt>=l.start && dt<=l.end)).length;
    const eff = Math.max(0, workdaysN - annualDays);
    const target = Math.round(directTarget(d) * eff / 5);
    const oc = clinicOccupancy(d, md, nightData, coverages, leaves);
    const occ = { own:oc.own, scheduled:oc.scheduled, away:oc.coveredAway+oc.onLeaveMissed, covers:sess.covers, evening:sess.evening, total:oc.own+sess.covers+sess.evening };
    let st = loadStatus(sess.care,target);
    if(annualDays>0 && st.key==="na") st = { key:"leave", color:"#2563EB", label:"في إجازة سنوية" };
    const ratio = target ? sess.care/target : -1;
    const contrib = sess.covers + (sess.eveningExtra||0);
    return { d, sess, target, annualDays, otherLeaveDays, occ, st, ratio, contrib };
  });
  const occSum = overview.reduce((a,o)=>({ own:a.own+o.occ.own, covers:a.covers+o.occ.covers, evening:a.evening+o.occ.evening, total:a.total+o.occ.total }), {own:0,covers:0,evening:0,total:0});
  const occMax = Math.max(1, ...overview.map(o=>o.occ.total));
  const OCC_COL = { own:C.primary, covers:"#E0982B", evening:"var(--eve)" };
  const totalCov = overview.reduce((a,o)=>a+o.sess.covers,0);
  const absentCov = overview.reduce((a,o)=>a+o.sess.absentCovered,0);
  const totalEve = overview.reduce((a,o)=>a+o.sess.evening,0);
  const lvDays = overview.reduce((a,o)=>a+o.annualDays+o.otherLeaveDays,0);
  const annSum = overview.reduce((a,o)=>a+o.annualDays,0);
  const ST_ORDER = [["over","أكثر من المطلوب","#064E3B"],["meets","مطابق","#16A34A"],["under","ناقص","#CA8A04"],["vlow","ناقص جداً","#DC2626"],["leave","إجازة سنوية","#2563EB"]];
  const stCount = Object.fromEntries(ST_ORDER.map(([k])=>[k, overview.filter(o=>o.st.key===k).length]));

  const printOcc = (list,titleSuffix="") => {
    const rows = list.map(({d,occ})=>`<tr><td style="text-align:start;font-weight:700">د.${d.name}</td><td><b>${occ.total}</b></td><td>${occ.own} / ${occ.scheduled}</td><td>${occ.covers}</td><td>${occ.evening}</td><td>${occ.away}</td><td>${occ.total?Math.round(occ.covers/occ.total*100):0}%</td></tr>`).join("");
    const sum = list.reduce((a,o)=>({ own:a.own+o.occ.own, covers:a.covers+o.occ.covers, evening:a.evening+o.occ.evening, total:a.total+o.occ.total }), {own:0,covers:0,evening:0,total:0});
    const table = `<table><thead><tr><th style="text-align:start">الطبيب</th><th>إجمالي العيادات المشغولة</th><th>عياداته (اشتغلها / المجدولة)</th><th>تغطياته لزملائه</th><th>مسائي</th><th>عياداته التي غاب عنها</th><th>نسبة التغطيات</th></tr></thead><tbody>${rows}${list.length>1?`<tr style="background:#eef6f8;font-weight:800"><td style="text-align:start">الإجمالي</td><td>${sum.total}</td><td>${sum.own}</td><td>${sum.covers}</td><td>${sum.evening}</td><td>—</td><td>${sum.total?Math.round(sum.covers/sum.total*100):0}%</td></tr>`:""}</tbody></table><p style="margin-top:10px">إشغال العيادات = عياداته التي اشتغلها فعلاً + تغطياته لزملائه + العيادات المسائية (${period.label}). العيادة التي غاب عنها (إجازة/مسائي/راحة) لا تُحسب له بل لمن غطّاها.</p>`;
    printDoc(`إشغال العيادات${titleSuffix} — ${period.label}`, table, true);
  };
  const printWorkload = (list,titleSuffix="") => {
    const css = `<style>.bdg{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;display:inline-block}.lgnd{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px}.lgnd span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#475569}.lgnd i{width:14px;height:14px;border-radius:4px;display:inline-block}</style>`;
    const legend = `<div class="lgnd">${ST_ORDER.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
    const rows = list.map(({d,sess,target,annualDays=0,st})=>{ const pct=target?Math.round(sess.care/target*100):0; return `<tr><td style="text-align:start;font-weight:700">د.${d.name}</td><td>${rankLabel(rankOf(d))}</td><td><b style="color:${st.color}">${sess.care}</b></td><td>${target}</td><td>${pct}%</td><td>${sess.evening}</td><td>${sess.covers}</td><td>${annualDays?`${annualDays}ي`:"—"}</td><td><span class="bdg" style="background:${st.color}">${st.label}</span></td></tr>`; }).join("");
    const table = `<table><thead><tr><th style="text-align:start">الطبيب</th><th>الدرجة</th><th>الرعاية</th><th>المطلوب</th><th>النسبة</th><th>المسائي</th><th>التغطيات</th><th>إجازة سنوية</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table><p style="margin-top:10px">المعيار: الرعاية الفعلية مقابل الهدف (${period.label}). المسائي يُحتسب فترتين. <b>أيام الإجازة السنوية مُستثناة من المطلوب</b>، أما المرضية/الطارئة/الأخرى فتبقى ضمن الاحتساب.</p>`;
    printDoc(`العبء الوظيفي${titleSuffix} — ${period.label}`, css+legend+table, true);
  };
  const exportAll = () => {
    const rows=[["الطبيب","الدرجة","الرعاية","المطلوب","النسبة %","الحالة","عياداته (اشتغلها)","عياداته المجدولة","تغطياته","مسائي","إجمالي الإشغال","غاب عن","إجازة سنوية (أيام)","إجازات أخرى (أيام)"]];
    overview.forEach(o=>rows.push(["د."+o.d.name, rankLabel(rankOf(o.d)), o.sess.care, o.target, o.target?Math.round(o.sess.care/o.target*100):0, o.st.label, o.occ.own, o.occ.scheduled, o.occ.covers, o.occ.evening, o.occ.total, o.occ.away, o.annualDays, o.otherLeaveDays]));
    downloadCSV(`إحصائيات-${period.label}.csv`, rows);
  };

  const monthRef = (preset==="custom" ? (md[md.length-1]||today) : preset==="quarter"||preset==="year" ? anchor : anchor);
  const repShown = repDoc==="all" ? doctors : doctors.filter(d=>d.id===+repDoc);
  const rep = makeReports({ doctors, leaves, nightData, coverages, fd, settings, dates:md, label:period.label, ref:monthRef, shown:repShown });

  /* ── ترتيب وتصفية جدول الأطباء ── */
  const SORTS = { load:o=>o.ratio, occ:o=>o.occ.total, covers:o=>o.occ.covers, evening:o=>o.occ.evening, own:o=>o.occ.own, leave:o=>o.annualDays+o.otherLeaveDays, contrib:o=>o.contrib };
  const tableRows = overview.filter(o=>stFilter==="all"||o.st.key===stFilter).slice().sort((a,b)=>{ if(sortK==="name") return sortDir*a.d.name.localeCompare(b.d.name,"ar"); const f=SORTS[sortK]||SORTS.load; return sortDir*(f(a)-f(b)); });
  const sortBy = k => { if(sortK===k) setSortDir(x=>-x); else { setSortK(k); setSortDir(k==="name"?1:(k==="load"?1:-1)); } };
  const Th = ({k,children,cls,w}) => <th className={cls} onClick={()=>sortBy(k)} style={{ cursor:"pointer", padding:"10px 8px", fontSize:11.5, fontWeight:800, color:sortK===k?C.primary:C.sub, textAlign:k==="name"?"start":"center", whiteSpace:"nowrap", width:w, userSelect:"none" }}>{children}{sortK===k?(sortDir>0?" ▲":" ▼"):""}</th>;

  const seg = (items,val,set) => <div style={{ display:"flex", background:"var(--surface2)", borderRadius:12, padding:3, gap:2, flexWrap:"wrap" }}>
    {items.map(([k,l])=><button key={k} onClick={()=>set(k)} style={{ flex:1, minWidth:62, border:"none", borderRadius:9, padding:"8px 10px", fontSize:12.5, fontWeight:700, cursor:"pointer", fontFamily:"inherit", background:val===k?"var(--surface)":"transparent", color:val===k?C.primary:C.sub, boxShadow:val===k?"0 1px 3px rgba(0,0,0,.08)":"none" }}>{l}</button>)}
  </div>;
  const Kpi = ({v,l,sub,col}) => <div style={{ ...card(), flex:"1 1 140px", padding:"14px 14px" }}><div style={{ fontSize:11.5, color:C.sub, fontWeight:700 }}>{l}</div><div style={{ fontSize:26, fontWeight:800, color:col||C.text, lineHeight:1.2, marginTop:4 }}>{v}</div>{sub && <div style={{ fontSize:11, color:C.muted, marginTop:3 }}>{sub}</div>}</div>;
  const pctOf = (v,t) => t?Math.round(v/t*100):0;
  const MiniList = ({title,items,empty,val}) => <div style={{ ...card(), flex:"1 1 230px", padding:14 }}>
    <div style={{ fontSize:12.5, fontWeight:800, marginBottom:8 }}>{title}</div>
    {items.length===0 ? <div style={{ fontSize:12, color:C.muted }}>{empty}</div> : items.map((o,i)=><div key={o.d.id} onClick={()=>setSel(o.d.id)} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 6px", borderRadius:9, cursor:"pointer", background:i%2?"transparent":"var(--surface2)" }}>
      <span style={{ fontSize:11, fontWeight:800, color:C.muted, minWidth:14 }}>{i+1}</span>
      <span style={{ flex:1, fontSize:13, fontWeight:600, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>د.{o.d.name}</span>
      {val(o)}
    </div>)}
  </div>;
  const RepItem = ({ic,t,sub,on,dis}) => <button disabled={dis} onClick={on} style={{ display:"flex", alignItems:"center", gap:12, width:"100%", textAlign:"start", padding:"12px 14px", background:"var(--surface)", border:`1.5px solid ${C.line}`, borderRadius:14, cursor:dis?"not-allowed":"pointer", opacity:dis?.45:1, fontFamily:"inherit", color:C.text }}>
    <span style={{ width:38, height:38, borderRadius:11, background:"var(--primarySoft)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>{ic}</span>
    <span style={{ flex:1, minWidth:0 }}><span style={{ display:"block", fontSize:13.5, fontWeight:800 }}>{t}</span><span style={{ display:"block", fontSize:11.5, color:C.sub, marginTop:2 }}>{sub}</span></span>
    <span style={{ color:C.muted, fontSize:16 }}>‹</span>
  </button>;

  const active = overview.filter(o=>o.st.key!=="leave");
  const topCov = overview.filter(o=>o.occ.covers>0).sort((a,b)=>b.occ.covers-a.occ.covers).slice(0,5);
  const lowContrib = active.slice().sort((a,b)=>a.contrib-b.contrib||a.ratio-b.ratio).slice(0,5);
  const under = overview.filter(o=>o.st.key==="vlow"||o.st.key==="under").sort((a,b)=>a.ratio-b.ratio).slice(0,5);

  return <div className="fade">
    <style>{`@media(max-width:760px){.st-hm{display:none}.st-tbl td,.st-tbl th{padding:8px 5px!important}.st-ld{width:110px!important}}.st-tbl tbody tr:hover td{background:var(--hover)!important}`}</style>
    {/* ── الفترة + الأقسام ── */}
    <div style={{ ...card(), padding:14, marginBottom:14 }}>
      {seg([["summary","📊 الملخص"],["doctors","👨‍⚕️ الأطباء"],["reports","🖨 التقارير"]], tab, setTab)}
      <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, flexWrap:"wrap" }}>
        <div style={{ flex:"1 1 320px" }}>{seg([["week","أسبوع"],["month","شهر"],["quarter","٣ أشهر"],["year","سنة"],["custom","مخصص"]], preset, setPreset)}</div>
        {preset!=="custom" ? <div style={{ display:"flex", alignItems:"center", gap:6, flex:"1 1 260px" }}>
          <button onClick={()=>shiftAnchor(-1)} style={{ ...sGhost, width:36, padding:"7px 0" }}>‹</button>
          <div style={{ flex:1, textAlign:"center", fontWeight:800, fontSize:13.5, color:C.primaryD }}>{period.label}</div>
          <button onClick={()=>shiftAnchor(1)} style={{ ...sGhost, width:36, padding:"7px 0" }}>›</button>
          {anchor!==today && <button onClick={()=>setAnchor(today)} style={{ ...sGhost, padding:"7px 10px", fontSize:12 }}>الآن</button>}
        </div> : <div style={{ display:"flex", alignItems:"center", gap:6, flex:"1 1 260px" }}>
          <input type="date" value={rangeFrom} onChange={e=>e.target.value&&setRangeFrom(e.target.value)} style={{ ...sIn, padding:"7px 9px" }} />
          <span style={{ color:C.muted }}>←</span>
          <input type="date" value={rangeTo} onChange={e=>e.target.value&&setRangeTo(e.target.value)} style={{ ...sIn, padding:"7px 9px" }} />
        </div>}
      </div>
    </div>

    {doctors.length===0 ? <Empty icon="📈" title="لا بيانات بعد" /> : <>

    {tab==="summary" && <>
      <div style={{ display:"flex", flexWrap:"wrap", gap:10, marginBottom:14 }}>
        <Kpi l="🏥 عيادات مشغولة" v={occSum.total} sub={`${workdaysN} يوم عمل`} />
        <Kpi l="🔄 تغطيات منفّذة" v={totalCov} col="#B7701B" sub={`${pctOf(occSum.covers,occSum.total)}% من الإشغال`} />
        <Kpi l="🌙 مناوبات مسائية" v={totalEve} col="var(--eve)" sub={`${pctOf(occSum.evening,occSum.total)}% من الإشغال`} />
        <Kpi l="🏖 أيام إجازة" v={lvDays} col={C.warn} sub={annSum?`منها سنوية ${annSum}`:"—"} />
      </div>

      <div style={{ ...card(), padding:16, marginBottom:14 }}>
        <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:10 }}><div style={{ flex:1, fontSize:14, fontWeight:800 }}>⚖️ العبء الوظيفي</div><div style={{ fontSize:11.5, color:C.muted }}>الرعاية الفعلية مقابل المطلوب · اضغط للتفاصيل</div></div>
        <div style={{ display:"flex", height:14, borderRadius:8, overflow:"hidden", background:"var(--surface2)" }}>
          {ST_ORDER.map(([k,,c])=>stCount[k]>0 && <div key={k} style={{ width:(stCount[k]/overview.length*100)+"%", background:c }} />)}
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginTop:12 }}>
          {ST_ORDER.map(([k,l,c])=><button key={k} disabled={!stCount[k]} onClick={()=>{ setStFilter(k); setTab("doctors"); }} style={{ display:"inline-flex", alignItems:"center", gap:7, border:`1.5px solid ${C.line}`, background:"var(--surface)", borderRadius:999, padding:"6px 12px", fontSize:12.5, fontWeight:700, cursor:stCount[k]?"pointer":"default", opacity:stCount[k]?1:.45, fontFamily:"inherit", color:C.text }}><i style={{ width:10, height:10, borderRadius:3, background:c, display:"inline-block" }} />{l}<b style={{ color:c }}>{stCount[k]}</b></button>)}
        </div>
      </div>

      <div style={{ ...card(), padding:16, marginBottom:14 }}>
        <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:10 }}><div style={{ flex:1, fontSize:14, fontWeight:800 }}>🏥 تركيبة إشغال العيادات</div><div style={{ fontSize:18, fontWeight:800 }}>{occSum.total}</div></div>
        <div style={{ display:"flex", height:14, borderRadius:8, overflow:"hidden", background:"var(--surface2)" }}>
          {[["own",occSum.own],["covers",occSum.covers],["evening",occSum.evening]].map(([k,v])=>v>0&&<div key={k} style={{ width:(v/Math.max(1,occSum.total)*100)+"%", background:OCC_COL[k] }} />)}
        </div>
        <div style={{ display:"flex", gap:16, flexWrap:"wrap", fontSize:12, color:C.sub, marginTop:10 }}>
          {[["own","عياداتهم",occSum.own],["covers","تغطيات",occSum.covers],["evening","مسائي",occSum.evening]].map(([k,l,v])=><span key={k} style={{ display:"inline-flex", alignItems:"center", gap:6 }}><i style={{ width:10, height:10, borderRadius:3, background:OCC_COL[k], display:"inline-block" }} />{l} <b style={{ color:C.text }}>{v}</b> <span style={{ color:C.muted }}>({pctOf(v,occSum.total)}%)</span></span>)}
        </div>
      </div>

      <div style={{ display:"flex", flexWrap:"wrap", gap:12 }}>
        <MiniList title="🔄 الأكثر تغطية" items={topCov} empty="لا تغطيات في الفترة" val={o=><b style={{ color:"#B7701B", fontSize:14 }}>{o.occ.covers}</b>} />
        <MiniList title="🔻 الأقل مساهمة (تغطيات + مسائي إضافي)" items={lowContrib} empty="—" val={o=><b style={{ color:C.warn, fontSize:14 }}>{o.contrib}</b>} />
        <MiniList title="⚠️ عبء ناقص" items={under} empty="✓ لا أحد تحت المطلوب" val={o=><span style={{ fontSize:12, fontWeight:800, color:o.st.color }}>{pctOf(o.sess.care,o.target)}%</span>} />
      </div>
    </>}

    {tab==="doctors" && <div style={{ ...card(), padding:0, overflow:"hidden" }}>
      <div style={{ display:"flex", alignItems:"center", gap:6, padding:"12px 14px", flexWrap:"wrap", borderBottom:`1px solid ${C.line2}` }}>
        {[["all","الكل",C.primary],...ST_ORDER].map(([k,l,c])=>{ const n=k==="all"?overview.length:stCount[k]; if(k!=="all"&&!n) return null; const on=stFilter===k; return <button key={k} onClick={()=>setStFilter(k)} style={{ border:`1.5px solid ${on?c:C.line}`, background:on?c:"var(--surface)", color:on?"#fff":C.sub, borderRadius:999, padding:"5px 12px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>{l} {n}</button>; })}
        <span style={{ flex:1 }} />
        <span style={{ fontSize:11, color:C.muted }}>اضغط عنوان العمود للترتيب · الصف للتفاصيل</span>
      </div>
      <div style={{ overflowX:"auto" }}>
        <table className="st-tbl" style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
          <thead><tr style={{ background:"var(--surface2)" }}>
            <Th k="name">الطبيب</Th><Th k="load" w={170} cls="st-ld">العبء (الرعاية/المطلوب)</Th><Th k="own" cls="st-hm">عياداته</Th><Th k="covers">تغطيات</Th><Th k="evening">مسائي</Th><Th k="occ" cls="st-hm">الإشغال</Th><Th k="leave" cls="st-hm">إجازة</Th>
          </tr></thead>
          <tbody>{tableRows.map((o,i)=>{ const pct=o.target?Math.min(100,Math.round(o.sess.care/o.target*100)):0; const bg=i%2?"var(--rowAlt)":"var(--surface)"; const td={ padding:"9px 8px", textAlign:"center", background:bg, borderTop:`1px solid ${C.line2}` }; return <tr key={o.d.id} onClick={()=>setSel(o.d.id)} style={{ cursor:"pointer" }}>
            <td style={{ ...td, textAlign:"start", boxShadow:`inset -4px 0 0 ${o.st.color}` }}><div style={{ fontWeight:700, whiteSpace:"nowrap" }}>د.{o.d.name}</div><div style={{ fontSize:10.5, color:C.muted }}>{rankLabel(rankOf(o.d))}</div></td>
            <td style={td}>{o.st.key==="leave" ? <span style={{ fontSize:11.5, fontWeight:700, color:o.st.color }}>🏖 إجازة سنوية</span> : <div>
              <div style={{ display:"flex", alignItems:"baseline", justifyContent:"center", gap:4 }}><b style={{ color:o.st.color, fontSize:14 }}>{o.sess.care}</b><span style={{ color:C.muted, fontSize:11.5 }}>/ {o.target}</span><span style={{ fontSize:11, fontWeight:700, color:o.st.color, marginInlineStart:4 }}>{o.target?Math.round(o.sess.care/o.target*100):0}%</span></div>
              <div style={{ height:5, background:"var(--surface2)", borderRadius:4, overflow:"hidden", marginTop:4 }}><div style={{ width:pct+"%", height:"100%", background:o.st.color }} /></div>
            </div>}</td>
            <td className="st-hm" style={td}><b style={{ color:OCC_COL.own }}>{o.occ.own}</b><span style={{ color:C.muted, fontSize:11 }}>/{o.occ.scheduled}</span></td>
            <td style={{ ...td, fontWeight:800, color:o.occ.covers?"#B7701B":C.muted }}>{o.occ.covers}</td>
            <td style={{ ...td, fontWeight:800, color:o.occ.evening?"var(--eve)":C.muted }}>{o.occ.evening}</td>
            <td className="st-hm" style={td}><div style={{ fontWeight:800 }}>{o.occ.total}</div><div style={{ display:"flex", height:4, borderRadius:3, overflow:"hidden", background:"var(--surface2)", marginTop:3, minWidth:50 }}>{[["own",o.occ.own],["covers",o.occ.covers],["evening",o.occ.evening]].map(([k,v])=>v>0&&<div key={k} style={{ width:(v/occMax*100)+"%", background:OCC_COL[k] }} />)}</div></td>
            <td className="st-hm" style={{ ...td, color:(o.annualDays+o.otherLeaveDays)?C.warn:C.muted, fontWeight:700 }}>{(o.annualDays+o.otherLeaveDays)||"—"}</td>
          </tr>; })}</tbody>
        </table>
      </div>
      {tableRows.length===0 && <div style={{ padding:20, textAlign:"center", color:C.muted, fontSize:13 }}>لا أطباء بهذه الحالة</div>}
    </div>}

    {tab==="reports" && <>
      <div style={{ ...card(), padding:14, marginBottom:12, display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
        <div style={{ fontSize:13, fontWeight:800 }}>التقرير عن:</div>
        <select value={repDoc} onChange={e=>setRepDoc(e.target.value)} style={{ ...sIn, flex:"1 1 220px", width:"auto" }}>
          <option value="all">كامل القسم</option>
          {doctors.map(d=><option key={d.id} value={d.id}>د.{d.name}</option>)}
        </select>
