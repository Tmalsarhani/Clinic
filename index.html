// DOCTORS PAGE
// ══════════════════════════════════════════════════════
function DoctorsPage({ doctors, leaves, today, fd, onUpdateDocs, showToast }) {
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [changed, setChanged] = useState({});
  const [newDocName, setNewDocName] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const SLOT_OPTS = [["","— فراغ"],["clinic","🦷 عيادة"],["admin","📋 إداري"],["training","🎓 تدريب"],["audit","📊 تدقيق"],["virtual","💻 افتراضية"]];

  const updateSched = (docId, di, p, v) => {
    onUpdateDocs(doctors.map(d => d.id!==docId ? d : { ...d, sched:{ ...d.sched, [di]:{ ...d.sched[di], [p]:v } } }));
    setChanged(prev => ({ ...prev, [docId]:true }));
  };

  const toggleNightDay = (docId, di) => {
    onUpdateDocs(doctors.map(d => {
      if (d.id !== docId) return d;
      const cur = Array.isArray(d.nightDays) ? d.nightDays : [];
      const next = cur.includes(di) ? cur.filter(x=>x!==di) : [...cur, di].sort();
      return { ...d, nightDays: next };
    }));
  };

  const [confirmDel, setConfirmDel] = useState(null);
  const deleteDoc = id => {
    onUpdateDocs(doctors.filter(d => d.id!==id));
    setConfirmDel(null);
    showToast("تم حذف الطبيب", "warn");
  };

  const addDoc = () => {
    const name = newDocName.trim();
    if (!name) return;
    const colors = ["#2c5282","#0ea5e9","#10b981","#f59e0b","#3b6ca8","#84cc16","#f97316","#14b8a6"];
    const nd = { id:Date.now(), name, color:colors[Math.floor(Math.random()*colors.length)], nightDays:[], email:"", sched:Object.fromEntries([0,1,2,3,4].map(d=>[d,{am:"",pm:""}])) };
    onUpdateDocs([...doctors, nd]);
    setExpanded(nd.id);
    setNewDocName("");
    setShowAdd(false);
    showToast(`تم إضافة ${name}`);
  };

  return (
    <div>
      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        <input style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="🔍 بحث..." value={search} onChange={e=>setSearch(e.target.value)} />
        <button onClick={()=>setShowAdd(s=>!s)} style={Btn.primary}>+ إضافة طبيب</button>
      </div>
      {showAdd && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:14, marginBottom:14, display:"flex", gap:8, alignItems:"center" }}>
          <input autoFocus style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="اسم الطبيب الجديد..." value={newDocName} onChange={e=>setNewDocName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addDoc(); }} />
          <button onClick={addDoc} style={Btn.primary}>حفظ</button>
          <button onClick={()=>{ setShowAdd(false); setNewDocName(""); }} style={Btn.secondary}>إلغاء</button>
        </div>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {doctors.filter(d=>d.name.includes(search)).map(doc => {
          const ol = onLeave(doc, today, leaves);
          const isExp = expanded === doc.id;
          const isDirty = changed[doc.id];
          return (
            <div key={doc.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden", borderRight:`4px solid ${doc.color}` }}>
              {/* Header */}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", cursor:"pointer" }} onClick={() => setExpanded(isExp?null:doc.id)}>
                <div style={{ ...AV, background:doc.color, width:38, height:38, fontSize:13 }}>{sn(doc.name).slice(0,2)}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:700, fontSize:14 }}>{doc.name}</div>
                  <div style={{ color:"#94a3b8", fontSize:11, display:"flex", gap:6 }}>
                    <span>{wSlots(doc)} فترة/أسبوع</span>
                    {(doc.nightDays||[]).length>0 && <span style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:4, padding:"1px 6px", fontSize:10 }}>🌙 {(doc.nightDays||[]).map(d=>DAYS[d]).join("، ")}</span>}
                  </div>
                </div>
                {/* Mini grid */}
                <div style={{ display:"flex", gap:3 }}>
                  {[0,1,2,3,4].map(di => (
                    <div key={di}>
                      <div style={{ fontSize:8, color:"#94a3b8", textAlign:"center", marginBottom:2 }}>{["أح","إث","ثل","أر","خم"][di]}</div>
                      {["am","pm"].map(p => {
                        const t = getSlot(doc,di,p);
                        const sc = SLOT_COLORS[t] || SLOT_COLORS[""];
                        return <div key={p} style={{ width:18, height:18, borderRadius:3, background:sc.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, marginBottom:2, color:sc.text }}>{sc.icon}</div>;
                      })}
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:4 }} onClick={e=>e.stopPropagation()}>
                  {ol && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:4, padding:"2px 6px", fontSize:9, fontWeight:700 }}>إجازة</span>}
                  {isDirty && <button style={{ ...Btn.primary, padding:"3px 8px", fontSize:10 }} onClick={() => setChanged(p=>({...p,[doc.id]:false}))}>💾</button>}
                  {confirmDel===doc.id ? (
                    <>
                      <button style={{ ...Btn.danger, padding:"4px 8px", background:"#dc2626", color:"#fff", border:"none" }} onClick={() => deleteDoc(doc.id)}>تأكيد</button>
                      <button style={{ ...Btn.secondary, padding:"4px 8px" }} onClick={() => setConfirmDel(null)}>✕</button>
                    </>
                  ) : (
                    <button style={{ ...Btn.danger, padding:"4px 8px" }} onClick={() => setConfirmDel(doc.id)}>🗑</button>
                  )}
                </div>
                <span style={{ color:"#94a3b8", fontSize:11 }}>{isExp?"▲":"▼"}</span>
              </div>

              {/* Expanded */}
              {isExp && (
                <div style={{ borderTop:"1px solid #f1f5f9", padding:14, background:"#f8fafc" }}>
                  {/* Edit name */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ fontSize:12, fontWeight:600, marginBottom:6 }}>✏️ اسم الطبيب</div>
                    <input type="text" value={doc.name}
                      onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,name:e.target.value}))}
                      style={{ width:"100%", padding:"8px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:13, fontWeight:700, outline:"none" }} />
                  </div>
                  {/* Rank: consultant / specialist */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ fontSize:12, fontWeight:600, marginBottom:6 }}>🎖️ الدرجة (تحدّد العبء المتوقّع)</div>
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={()=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,rank:"consultant"}))} style={{ flex:1, padding:"9px", borderRadius:8, fontSize:12, fontWeight:700, cursor:"pointer", border:(doc.rank==="consultant")?"2px solid #1e3a5f":"1px solid #e2e8f0", background:(doc.rank==="consultant")?"#eff4fa":"#fff", color:(doc.rank==="consultant")?"#1e3a5f":"#64748b" }}>استشاري (8 فترات)</button>
                      <button onClick={()=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,rank:"specialist"}))} style={{ flex:1, padding:"9px", borderRadius:8, fontSize:12, fontWeight:700, cursor:"pointer", border:(doc.rank!=="consultant")?"2px solid #15803d":"1px solid #e2e8f0", background:(doc.rank!=="consultant")?"#f0fdf4":"#fff", color:(doc.rank!=="consultant")?"#15803d":"#64748b" }}>أخصائي (9 فترات)</button>
                    </div>
                  </div>
                  {/* Night days - multi select toggle */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span>🌙</span>
                      <div style={{ fontSize:12, fontWeight:600 }}>أيام الدوام المسائي الثابت <span style={{ color:"#94a3b8", fontWeight:400 }}>(يمكن اختيار أكثر من يوم)</span></div>
                    </div>
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                      {DAYS.map((d,i) => {
                        const active = (doc.nightDays||[]).includes(i);
                        return (
                          <button key={i} onClick={() => toggleNightDay(doc.id, i)}
                            style={{ padding:"6px 12px", borderRadius:7, fontSize:12, fontWeight:700, cursor:"pointer", border: active?"2px solid #1e3a5f":"1px solid #e2e8f0",
                              background: active?"#0f1e36":"#f8fafc", color: active?"#93b4d8":"#64748b" }}>
                            {active?"🌙 ":""}{d}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  {/* Blocked days - doctor cannot work */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span>🚫</span>
                      <div style={{ fontSize:12, fontWeight:600 }}>أيام لا يعمل فيها <span style={{ color:"#94a3b8", fontWeight:400 }}>(تُستبعد من التوزيع التلقائي)</span></div>
                    </div>
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                      {DAYS.map((d,i) => {
                        const active = (doc.blockedDays||[]).includes(i);
                        return (
                          <button key={i} onClick={() => onUpdateDocs(doctors.map(x=>{ if(x.id!==doc.id) return x; const cur=Array.isArray(x.blockedDays)?x.blockedDays:[]; return {...x, blockedDays: cur.includes(i)?cur.filter(y=>y!==i):[...cur,i].sort()}; }))}
                            style={{ padding:"6px 12px", borderRadius:7, fontSize:12, fontWeight:700, cursor:"pointer", border: active?"2px solid #dc2626":"1px solid #e2e8f0",
                              background: active?"#fef2f2":"#f8fafc", color: active?"#dc2626":"#64748b" }}>
                            {active?"🚫 ":""}{d}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  {/* Schedule table: rows = days, columns = ص / م / مسائي */}
                  <div style={{ fontWeight:700, fontSize:12, color:"#475569", marginBottom:8 }}>الجدول الأسبوعي</div>
                  <div style={{ overflowX:"auto" }}>
                    <table style={{ borderCollapse:"collapse", width:"100%", minWidth:380 }}>
                      <thead>
                        <tr style={{ background:"#5b8def" }}>
                          <th style={{ padding:"6px 10px", fontSize:12, color:"#fff", fontWeight:700, minWidth:70 }}>اليوم</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>ص</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>م</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>مسائي</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[0,1,2,3,4].map(di => {
                          const isFixedEve = (doc.nightDays||[]).includes(di);
                          return (
                            <tr key={di}>
                              <td style={{ padding:"4px 10px", fontWeight:700, fontSize:12, color:"#fff", background:"#7ea4e6", textAlign:"center" }}>{DAYS[di]}</td>
                              {["am","pm"].map(period => {
                                const raw = getSlot(doc,di,period);
                                const val = (raw==="clinic_am"||raw==="clinic_pm") ? "clinic" : raw;
                                const sc = SLOT_COLORS[val] || SLOT_COLORS[""];
                                return (
                                  <td key={period} style={{ padding:"3px 4px" }}>
                                    <select value={val} onChange={e => updateSched(doc.id,di,period,e.target.value)}
                                      style={{ width:"100%", padding:"8px 4px", borderRadius:6, border:`2px solid ${val?sc.text:"#e2e8f0"}`, background:sc.bg, color:sc.text, fontSize:13, fontWeight:600, cursor:"pointer", outline:"none" }}>
                                      {SLOT_OPTS.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                                    </select>
                                  </td>
                                );
                              })}
                              {/* Evening column - reflects fixed night day */}
                              <td style={{ padding:"3px 4px", textAlign:"center" }}>
                                {isFixedEve ? (
                                  <div style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:6, padding:"6px 3px", fontSize:11, fontWeight:700 }}>🌙 عيادة</div>
                                ) : (
                                  <div style={{ color:"#cbd5e1", fontSize:11 }}>—</div>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{ fontSize:10, color:"#94a3b8", marginTop:6 }}>💡 عمود "مسائي" يعكس يوم المناوبة الثابت تلقائياً — عدّله من الأعلى</div>
                  {/* Contact info at bottom */}
                  <div style={{ marginTop:14, paddingTop:12, borderTop:"1px dashed #cbd5e1" }}>
                    <div style={{ fontSize:11, fontWeight:700, color:"#64748b", marginBottom:8 }}>📇 معلومات التواصل</div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span>📧</span>
                      <input type="email" value={doc.email||""} placeholder="البريد الإلكتروني"
                        onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,email:e.target.value}))}
                        style={{ flex:1, padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left" }} />
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span>📲</span>
                      <input type="tel" value={doc.phone||""} placeholder="الجوال (واتساب) 9665xxxxxxxx"
                        onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,phone:e.target.value}))}
                        style={{ flex:1, padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left" }} />
                    </div>
                    {/* Login account creation — links by email */}
                    <div style={{ marginTop:12, paddingTop:12, borderTop:"1px dashed #cbd5e1" }}>
                      <div style={{ fontSize:11, fontWeight:700, color:"#64748b", marginBottom:8 }}>🔐 حساب الدخول للطبيب</div>
                      <CreateLoginButton doc={doc} showToast={showToast} />
                      <div style={{ fontSize:10, color:"#94a3b8", marginTop:6, lineHeight:1.6 }}>الطبيب يدخل ببريده أعلاه فيرى صفحته فقط (قراءة فقط). تأكّد من تعبئة البريد قبل الإنشاء.</div>
                    </div>
                  </div>
                  {isDirty && <div style={{ marginTop:8, display:"flex", justifyContent:"flex-end" }}><button style={Btn.primary} onClick={()=>setChanged(p=>({...p,[doc.id]:false}))}>💾 حفظ</button></div>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// LEAVES PAGE
// ══════════════════════════════════════════════════════
function LeavesPage({ doctors, leaves, nightData, coverages, today, fd, onUpdate, onAddIndiv, onRemoveIndiv, showToast }) {
  const [form, setForm] = useState({ doctorId:"", start:"", end:"", type:"annual", clinicClosed:true });
  const [show, setShow] = useState(false);
  const [err, setErr] = useState("");
  const [manageLeave, setManageLeave] = useState(null); // leave id whose coverage is being managed
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };

  const add = () => {
    if (!form.doctorId||!form.start||!form.end) { setErr("الرجاء تعبئة الطبيب وتاريخ البداية والنهاية"); return; }
    if (form.end < form.start) { setErr("⚠️ تاريخ النهاية قبل تاريخ البداية — تحقّق من التواريخ"); return; }
    setErr("");
    const next = [...leaves, { id:Date.now(), doctorId:+form.doctorId, start:form.start, end:form.end, type:form.type, clinicClosed:form.clinicClosed }];
    onUpdate(next);
    setForm({ doctorId:"", start:"", end:"", type:"annual", clinicClosed:true });
    setShow(false);
    showToast("تم تسجيل الإجازة");
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontWeight:700 }}>الإجازات ({leaves.length})</div>
        <button style={Btn.primary} onClick={()=>setShow(true)}>+ إجازة جديدة</button>
      </div>
      {show && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>🏖 إجازة جديدة</div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الطبيب</label>
            <select style={SEL} value={form.doctorId} onChange={e=>setForm(p=>({...p,doctorId:e.target.value}))}>
              <option value="">اختر...</option>
              {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>النوع</label>
            <select style={SEL} value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>
              {Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:6 }}>حالة العيادة خلال الإجازة</label>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>setForm(p=>({...p,clinicClosed:true}))} style={{ flex:1, padding:"10px", borderRadius:9, fontSize:12, fontWeight:700, cursor:"pointer", border: form.clinicClosed?"2px solid #15803d":"1px solid #e2e8f0", background: form.clinicClosed?"#f0fdf4":"#fff", color: form.clinicClosed?"#15803d":"#64748b" }}>🔒 العيادة مغلقة (لا تغطية)</button>
              <button onClick={()=>setForm(p=>({...p,clinicClosed:false}))} style={{ flex:1, padding:"10px", borderRadius:9, fontSize:12, fontWeight:700, cursor:"pointer", border: !form.clinicClosed?"2px solid #ea580c":"1px solid #e2e8f0", background: !form.clinicClosed?"#fff7ed":"#fff", color: !form.clinicClosed?"#ea580c":"#64748b" }}>🔄 العيادة قائمة (تحتاج تغطية)</button>
            </div>
          </div>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>من</label>
              <input type="date" style={SEL} value={form.start} max={form.end||undefined} onChange={e=>{setForm(p=>({...p,start:e.target.value}));setErr("");}} />
            </div>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>إلى</label>
              <input type="date" style={SEL} value={form.end} min={form.start||undefined} onChange={e=>{setForm(p=>({...p,end:e.target.value}));setErr("");}} />
            </div>
          </div>
          {err && <div style={{ background:"#fef2f2", border:"1px solid #fecaca", color:"#dc2626", borderRadius:8, padding:"8px 12px", fontSize:12, fontWeight:700, marginBottom:10 }}>{err}</div>}
          <div style={{ display:"flex", gap:8 }}>
            <button style={Btn.primary} onClick={add}>حفظ</button>
            <button style={Btn.secondary} onClick={()=>{setShow(false);setErr("");}}>إلغاء</button>
          </div>
        </div>
      )}
      {leaves.length===0 && <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px 0" }}>لا توجد إجازات</div>}
      {leaves.map(l => {
        const d = fd(l.doctorId); if (!d) return null;
        const days = Math.round((new Date(l.end)-new Date(l.start))/86400000)+1;
        const needsCover = l.clinicClosed===false;
        const isManaging = manageLeave===l.id;
        // compute ALL the absent doctor's duties needing cover during the leave
        const slots = [];
        if (needsCover) {
          const s=new Date(l.start), e=new Date(l.end);
          for(let dt=new Date(s); dt<=e; dt.setDate(dt.getDate()+1)){
            const di=dt.getDay(); if(di===5||di===6) continue; const wi=di;
            if(di>4) continue;
            const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
            const ndDay = nightData[ds]||{}; const cds = ndDay.coverages||{};
            // 1) own clinics (am/pm)
            ["am","pm"].forEach(per=>{
              if(isClinic(getSlot(d,wi,per))){
                const existing=(coverages||[]).find(c=>c.date===ds&&c.period===per&&c.absentId===d.id);
                slots.push({ ds, per, wi, kind:"clinic", covered: existing? existing.coverDoctorId : null, covId: existing?existing.id:null });
              }
            });
            // 2) evening shift this day → needs a replacement night doctor
            if((ndDay.doctors||[]).includes(d.id)){
              slots.push({ ds, per:"evening", wi, kind:"evening", covered:null, covId:null });
            }
            // 3) carried coverages: this doctor is covering someone else (am/pm/nextAm) this day
            ["am","pm","nextAm"].forEach(slot=>{
              if((cds[slot]||[]).includes(d.id)){
                slots.push({ ds, per:slot, wi, kind:"carried", covered:null, covId:null });
              }
            });
            // 3b) carried morning coverage from the PREVIOUS workday's nextAm (lands on this morning)
            let pStr=null;
            for(let k=1;k<=4;k++){ const p=new Date(dt); p.setDate(dt.getDate()-k); if(p.getDay()!==5&&p.getDay()!==6){ pStr=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`; break; } }
            if(pStr){ const pna=((nightData[pStr]?.coverages||{}).nextAm||[]); if(pna.includes(d.id)){ slots.push({ ds, per:"am", wi, kind:"carried", carriedFrom:pStr, covered:null, covId:null }); } }
            // 3c) individual coverage where this doctor is the cover on this day
            (coverages||[]).forEach(cv=>{ if(cv.date===ds && cv.coverDoctorId===d.id){ slots.push({ ds, per:cv.period, wi, kind:"carried", covered:null, covId:null }); } });
          }
        }
        const allCovered = slots.length>0 && slots.every(s=>s.covered || s.kind==="evening" || s.kind==="carried");
        const unresolvedNote = slots.filter(s=>s.kind==="evening"||s.kind==="carried").length;
        return (
          <div key={l.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", marginBottom:7 }}>
           <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ ...AV, background:d.color, width:34, height:34, fontSize:12 }}>{sn(d.name).slice(0,2)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700 }}>{d.name}</div>
              <div style={{ fontSize:11, color:"#64748b" }}>{l.start} → {l.end} ({days} أيام) — {TYPES[l.type]}</div>
              <div style={{ fontSize:10, fontWeight:700, marginTop:3, color: l.clinicClosed!==false?"#15803d":"#ea580c" }}>{l.clinicClosed!==false?"🔒 العيادة مغلقة (لا تغطية)":(allCovered?"✅ التغطية مكتملة ومعتمدة":"🔄 العيادة قائمة — تحتاج تعيين مغطّين")}</div>
            </div>
            {needsCover && <button style={{ ...Btn.secondary, background:isManaging?"#1e3a5f":"#f1f5f9", color:isManaging?"#fff":"#64748b" }} onClick={()=>setManageLeave(isManaging?null:l.id)}>{isManaging?"إغلاق":"🩺 إدارة التغطية"}</button>}
            <button style={Btn.danger} onClick={()=>onUpdate(leaves.filter(x=>x.id!==l.id))}>🗑</button>
           </div>
           {/* Smart coverage manager */}
           {isManaging && needsCover && (
             <div style={{ marginTop:12, paddingTop:12, borderTop:"2px dashed #fed7aa" }}>
               <div style={{ fontSize:12, fontWeight:800, color:"#c2410c", marginBottom:8 }}>🩺 أين يعمل {d.name} خلال الإجازة — عيّن المغطّي لكل فترة</div>
               {slots.length===0 && <div style={{ fontSize:12, color:"#94a3b8" }}>لا توجد عيادات لهذا الطبيب في أيام الإجازة.</div>}
               {slots.map((s,i)=>{
                 const lblr = makeLoadLabeler(computeLoadMap(+s.ds.split("-")[0], +s.ds.split("-")[1]-1, doctors, nightData, coverages, leaves));
                 const perL = s.per==="am"?"صباحاً":s.per==="pm"?"ظهراً":s.per==="nextAm"?"صباح اليوم التالي":"مسائي";
                 const an = analyzeDay(s.ds, doctors, leaves, nightData, coverages, null);
                 const occ = an.occupied||{am:{},pm:{},evening:{}};
                 const periodKey = s.per==="nextAm"?"am":s.per==="evening"?"evening":s.per;
                 const cands = doctors.filter(x=> x.id!==d.id && !onLeave(x,s.ds,leaves) && !(x.blockedDays||[]).includes(s.wi) && !(occ[periodKey]?.[x.id]?.length) && !(occ.evening?.[x.id]?.length) && !isClinic(getSlot(x,s.wi,periodKey==="evening"?"am":periodKey)));
                 const kindBadge = s.kind==="clinic"?{t:"🏥 عيادته",c:"#0891b2"}:s.kind==="evening"?{t:"🌙 دوام مسائي",c:"#7c3aed"}:{t:"🔄 يغطّي زميلاً",c:"#ea580c"};
                 return (
                   <div key={i} style={{ background:s.covered?"#f0fdf4":"#fff7ed", border:`1px solid ${s.covered?"#bbf7d0":"#fed7aa"}`, borderRadius:8, padding:"8px 10px", marginBottom:6 }}>
                     <div style={{ display:"flex", gap:6, alignItems:"center", marginBottom:5, flexWrap:"wrap" }}>
                       <span style={{ fontSize:10, fontWeight:800, color:"#fff", background:kindBadge.c, borderRadius:5, padding:"2px 7px" }}>{kindBadge.t}</span>
                       <span style={{ fontSize:11, fontWeight:700, color:"#9a3412" }}>📅 {s.ds} — {perL}</span>
                     </div>
                     {s.kind==="clinic" ? (
                       s.covered ? (
                         <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                           <span style={{ flex:1, fontSize:12, color:"#15803d", fontWeight:700 }}>✓ يغطّيها {fd(s.covered)?.name}</span>
                           <button onClick={()=>{ onRemoveIndiv(s.covId); }} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:12 }}>✕ تغيير</button>
                         </div>
                       ) : (
                         <select style={{ ...SEL, fontSize:12 }} value="" onChange={ev=>{ if(ev.target.value){ onAddIndiv({ date:s.ds, period:s.per, coverDoctorId:+ev.target.value, absentId:d.id, reason: l.type==="sick"?"sick":l.type==="emergency"?"emergency":"absence" }); } }}>
                           <option value="">➕ اختر المغطّي ({cands.length} متاح)</option>
                           {cands.map(x=>{const L=lblr(x.id);return <option key={x.id} value={x.id}>{L.icon} {x.name} — {L.text} ({L.val})</option>;})}
                         </select>
                       )
                     ) : s.kind==="evening" ? (
                       <div style={{ fontSize:11, color:"#7c3aed", fontWeight:600 }}>
                         ⚠️ هذا الطبيب مكلّف بالدوام المسائي هذا اليوم. عيّن بديلاً من صفحة «إدارة الدوام والتغطيات» ليوم {s.ds} (احذفه من الدوام وأضف طبيباً آخر).
                       </div>
                     ) : (
                       <div style={{ fontSize:11, color:"#ea580c", fontWeight:600 }}>
                         ⚠️ هذا الطبيب يغطّي زميلاً ({perL}) هذا اليوم. أعد تعيين المغطّي من صفحة «إدارة الدوام والتغطيات» ليوم {s.ds}.
                       </div>
                     )}
                   </div>
                 );
               })}
               {slots.length>0 && (() => {
                 const clinicSlots = slots.filter(s=>s.kind==="clinic");
                 const clinicDone = clinicSlots.every(s=>s.covered);
                 const others = slots.filter(s=>s.kind!=="clinic").length;
                 return (
                 <div style={{ marginTop:8, padding:"8px 12px", borderRadius:8, fontSize:12, fontWeight:700, textAlign:"center", background:clinicDone?"#f0fdf4":"#fef2f2", color:clinicDone?"#15803d":"#dc2626", border:`1px solid ${clinicDone?"#bbf7d0":"#fecaca"}` }}>
                   {clinicDone ? "✅ تمت تغطية كل عيادات الطبيب — منعكسة على الجدول" : `⚠️ متبقّي ${clinicSlots.filter(s=>!s.covered).length} عيادة بدون مغطٍّ`}
                   {others>0 && <div style={{ marginTop:4, color:"#7c3aed", fontWeight:600 }}>+ {others} تكليف (دوام مسائي/تغطية) يحتاج إعادة تعيين من صفحة الجدول</div>}
                 </div>
                 );
               })()}
             </div>
           )}
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// COVERAGE PAGE (individual coverages = absence/excuse)
// ══════════════════════════════════════════════════════
function CoveragePage({ doctors, leaves, coverages, nightData, fd, onAdd, onRemove, showToast }) {
  const [form, setForm] = useState({ absentId:"", date:"", period:"am", coverDoctorId:"", reason:"absence" });
  const [show, setShow] = useState(false);
  const REASONS = { absence:"غياب", excuse:"عذر", emergency:"طارئ", other:"أخرى" };
  const PERIODS = { am:"☀️ صباح", pm:"🌅 ظهر", evening:"🌙 مسائي" };

  // Available doctors for the selected slot
  const availForForm = useMemo(() => {
    if (!form.date) return [];
    const di = dayIdx(form.date);
    if (di < 0) return [];
    return getAvailable(doctors, form.absentId?[+form.absentId]:[], di, form.date, form.period, leaves, nightData, {}, coverages);
  }, [form.date, form.period, form.absentId, doctors, leaves, nightData]);

  // Check if the absent doctor actually has a clinic in the selected period
  const absentHasClinic = useMemo(() => {
    if (!form.absentId || !form.date) return null; // null = not applicable yet
    const di = dayIdx(form.date);
    if (di < 0) return null;
    const ad = doctors.find(d=>d.id===+form.absentId);
    if (!ad) return null;
    if (form.period === "evening") {
      // Evening: doctor has a night assignment that day OR a fixed night day
      const hasNight = (nightData[form.date]?.doctors||[]).includes(ad.id) || (ad.nightDays||[]).includes(di);
      return hasNight;
    }
    return isClinic(getSlot(ad, di, form.period));
  }, [form.absentId, form.date, form.period, doctors, nightData]);

  // Check if the absent doctor's clinic in this period is ALREADY covered via the night schedule
  const alreadyCoveredBy = useMemo(() => {
    if (!form.absentId || !form.date || form.period==="evening") return null;
    const ad = doctors.find(d=>d.id===+form.absentId);
    if (!ad) return null;
    // The absent doctor's clinic gets covered in night schedule if THEY are the night doctor that day
    // and the matching coverage slot (am/pm) is filled.
    const nd = nightData[form.date]||{};
    if (!(nd.doctors||[]).includes(ad.id)) return null; // they're not the night doctor → night coverage doesn't apply
    const covs = nd.coverages||{};
    const ids = covs[form.period]||[];
    if (!ids.length) return null;
    const names = ids.map(id=>fd(id)?.name).filter(Boolean).join("، ");
    return names || null;
  }, [form.absentId, form.date, form.period, doctors, nightData]);

  const submit = () => {
    if (!form.date || !form.coverDoctorId) { showToast("أكمل البيانات", "warn"); return; }
    if (dayIdx(form.date) < 0) { showToast("اختر يوم عمل (أحد-خميس)", "warn"); return; }
    // Block coverage if the absent doctor has NO clinic in that period
    if (form.absentId && absentHasClinic === false) {
      showToast("الطبيب الغائب ليس لديه عيادة في هذه الفترة — لا تحتاج تغطية", "warn");
      return;
    }
    // Block if this period is already covered via night schedule
    if (alreadyCoveredBy) {
      showToast(`هذه الفترة مُغطّاة بالفعل عبر جدول الدوام المسائي (${alreadyCoveredBy})`, "warn");
      return;
    }
    // Block if the chosen cover doctor is already busy this same real period
    const conflict = (() => {
      const nd = nightData[form.date]||{}; const c = nd.coverages||{};
      const sameSlotIds = [...(c[form.period]||[])];
      // also night doctor themselves occupy evening; for am/pm check coverages
      coverages.forEach(cv=>{ if(cv.date===form.date && cv.period===form.period) sameSlotIds.push(cv.coverDoctorId); });
      return sameSlotIds.includes(+form.coverDoctorId);
    })();
    if (conflict) {
      showToast("الطبيب المُغطّي مشغول في نفس الفترة بتغطية أخرى", "warn");
      return;
    }
    onAdd({
      date: form.date,
      period: form.period,
      coverDoctorId: +form.coverDoctorId,
      absentId: form.absentId ? +form.absentId : null,
      reason: form.reason,
    });
    setForm({ absentId:"", date:"", period:"am", coverDoctorId:"", reason:"absence" });
    setShow(false);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontWeight:700 }}>التغطيات الفردية ({coverages.length})</div>
        <button style={Btn.primary} onClick={()=>setShow(true)}>+ تغطية جديدة</button>
      </div>

      <div style={{ background:"#fffbeb", border:"1px solid #fde68a", borderRadius:8, padding:"8px 12px", marginBottom:14, fontSize:12, color:"#92400e" }}>
        ℹ️ التغطيات الفردية مستقلة عن الدوام المسائي — تُستخدم لتغطية غياب أو عذر طبيب في فترة معينة.
      </div>

      {show && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>🔄 تغطية فردية جديدة</div>

          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الطبيب الغائب (اختياري)</label>
            <select style={SEL} value={form.absentId} onChange={e=>setForm(p=>({...p,absentId:e.target.value}))}>
              <option value="">— بدون تحديد</option>
              {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>

          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>التاريخ</label>
              <input type="date" style={SEL} value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value,coverDoctorId:""}))} />
            </div>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الفترة</label>
              <select style={SEL} value={form.period} onChange={e=>setForm(p=>({...p,period:e.target.value,coverDoctorId:""}))}>
                {Object.entries(PERIODS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
          </div>

          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>السبب</label>
            <select style={SEL} value={form.reason} onChange={e=>setForm(p=>({...p,reason:e.target.value}))}>
              {Object.entries(REASONS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>

          <div style={{ marginBottom:12 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>طبيب التغطية {form.date && `(${availForForm.filter(x=>x.status==="free").length} متاح)`}</label>
            {(() => {
              const lblr = form.date ? makeLoadLabeler(computeLoadMap(+form.date.split("-")[0], +form.date.split("-")[1]-1, doctors, nightData, coverages, leaves)) : (()=>({icon:"",text:"",val:0}));
              const optLabel = (d) => { const L=lblr(d.id); return L.text?`${L.icon} ${d.name} — ${L.text} (${L.val})`:d.name; };
              return (
              <select style={SEL} value={form.coverDoctorId} onChange={e=>setForm(p=>({...p,coverDoctorId:e.target.value}))} disabled={!form.date}>
                <option value="">{form.date ? "اختر طبيباً..." : "اختر التاريخ أولاً"}</option>
                {availForForm.filter(x=>x.status==="free").length > 0 && (
                  <optgroup label="✅ أطباء فارغون (متاحون)">
                    {availForForm.filter(x=>x.status==="free").map(({doc:d})=><option key={d.id} value={d.id}>{optLabel(d)}</option>)}
                  </optgroup>
                )}
                {availForForm.filter(x=>x.status==="warn").length > 0 && (
                  <optgroup label="⚠️ لديه التزام آخر">
                    {availForForm.filter(x=>x.status==="warn").map(({doc:d})=><option key={d.id} value={d.id}>⚠️ {optLabel(d)}</option>)}
                  </optgroup>
                )}
              </select>
              );
            })()}
          </div>

          {/* Warning: absent doctor has no clinic in this period */}
          {form.absentId && absentHasClinic === false && (
            <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:12, color:"#dc2626", fontWeight:600 }}>
              🚫 {fd(+form.absentId)?.name} ليس لديه عيادة في {PERIODS[form.period]} هذا اليوم — لا تحتاج تغطية
            </div>
          )}
          {form.absentId && absentHasClinic === true && !alreadyCoveredBy && (
            <div style={{ background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:12, color:"#15803d", fontWeight:600 }}>
              ✓ {fd(+form.absentId)?.name} لديه عيادة في {PERIODS[form.period]} — التغطية مطلوبة
            </div>
          )}
          {alreadyCoveredBy && (
            <div style={{ background:"#fffbeb", border:"1px solid #fde68a", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:12, color:"#b45309", fontWeight:600 }}>
              ⚠️ فترة {PERIODS[form.period]} لـ {fd(+form.absentId)?.name} مُغطّاة بالفعل في جدول الدوام المسائي بواسطة {alreadyCoveredBy} — لا حاجة لتغطية فردية
            </div>
          )}

          <div style={{ display:"flex", gap:8 }}>
            <button style={{ ...Btn.primary, opacity:((form.absentId && absentHasClinic===false)||alreadyCoveredBy)?0.5:1 }} onClick={submit} disabled={(form.absentId && absentHasClinic===false)||!!alreadyCoveredBy}>حفظ</button>
            <button style={Btn.secondary} onClick={()=>setShow(false)}>إلغاء</button>
          </div>
        </div>
      )}

      {coverages.length===0 && <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px 0" }}>لا توجد تغطيات فردية</div>}
      {[...coverages].sort((a,b)=>a.date.localeCompare(b.date)).map(c => {
        const cd = fd(c.coverDoctorId);
        const ad = c.absentId ? fd(c.absentId) : null;
        if (!cd) return null;
        const di = dayIdx(c.date);
        return (
          <div key={c.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", marginBottom:7, display:"flex", alignItems:"center", gap:10, borderRight:"4px solid #ea580c" }}>
            <div style={{ ...AV, background:cd.color, width:34, height:34, fontSize:12 }}>{sn(cd.name).slice(0,2)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, fontSize:13 }}>🔄 {cd.name} <span style={{ fontWeight:400, color:"#64748b", fontSize:11 }}>يغطّي {PERIODS[c.period]}</span></div>
              <div style={{ fontSize:11, color:"#64748b" }}>
                {di>=0 ? DAYS[di] : ""} {c.date}
                {ad && ` — بدلاً من ${ad.name}`}
                {` — ${REASONS[c.reason]}`}
              </div>
            </div>
            <button style={Btn.danger} onClick={()=>onRemove(c.id)}>🗑</button>
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// STATS PAGE  (tasks count + avg comparison + color class)
// ══════════════════════════════════════════════════════
function StatsPage({ doctors, nightData, coverages, leaves }) {
  const [selId, setSelId] = useState("");
  const [period, setPeriod] = useState("month"); // week|month|month2|month3|year|custom
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");

  // Compute per-doctor stats within a date filter
  const inRange = (dateStr, range) => {
    const d = new Date(dateStr);
    const now = new Date();
    if (range === "week") {
      const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
      return d >= weekAgo && d <= now;
    }
    if (range === "month") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if (range === "month2") { const back=new Date(now); back.setMonth(now.getMonth()-2); return d>=back && d<=now; }
    if (range === "month3") { const back=new Date(now); back.setMonth(now.getMonth()-3); return d>=back && d<=now; }
    if (range === "year") return d.getFullYear()===now.getFullYear();
    if (range === "custom") {
      if (!customFrom || !customTo) return true;
      return d >= new Date(customFrom) && d <= new Date(customTo);
    }
    return true;
  };

  const calcStats = (doc, range) => {
    const fixedDays = doc.nightDays || [];
    let fixedNights = 0, extraNights = 0;
    Object.entries(nightData).forEach(([date, nd]) => {
      if (!(nd.doctors||[]).includes(doc.id)) return;
      if (range !== "all" && !inRange(date, range)) return;
      const di = dayIdx(date);
      if (fixedDays.includes(di)) fixedNights++; else extraNights++;
    });
    let nightCovs = 0;
    Object.entries(nightData).forEach(([date,nd])=>{
      if (range !== "all" && !inRange(date, range)) return;
      const c = nd.coverages||{};
      nightCovs += ((c.am||[]).includes(doc.id)?1:0)+((c.pm||[]).includes(doc.id)?1:0)+((c.nextAm||[]).includes(doc.id)?1:0);
    });
    const indivCovs = (coverages||[]).filter(c=>c.coverDoctorId===doc.id && (range==="all"||inRange(c.date,range))).length;
    const totalCovs = nightCovs + indivCovs;
    const myLeaves = leaves.filter(l=>l.doctorId===doc.id && (range==="all"||inRange(l.start,range)));
    const leaveDays = myLeaves.reduce((a,l)=>a+Math.round((new Date(l.end)-new Date(l.start))/86400000)+1, 0);
    const absenceDays = myLeaves.filter(l=>l.type==="sick"||l.type==="emergency").reduce((a,l)=>a+Math.round((new Date(l.end)-new Date(l.start))/86400000)+1, 0);
    // الدوام المسائي يُحسب كيوم كامل (شفتين) في العبء
    const tasks = Math.max(0, (extraNights * 2) + totalCovs - absenceDays);
    // فترات العمل الفعلية (النظام الجديد): كل فترة عمل=1، مسائي=2، تغطية=1، الفراغ=0
    let workedPeriods = 0;
    const dimDates = new Set();
    Object.keys(nightData).forEach(d=>{ if(range==="all"||inRange(d,range)) dimDates.add(d); });
    (coverages||[]).forEach(c=>{ if(range==="all"||inRange(c.date,range)) dimDates.add(c.date); });
    dimDates.forEach(date=>{
      const di=dayIdx(date); if(di<0) return;
      const nd=nightData[date]||{}; const c=nd.coverages||{};
      const pwf=(ds)=>{const dd=new Date(ds);for(let i=1;i<=4;i++){const p=new Date(dd);p.setDate(dd.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null;};
      const pw=pwf(date); const prevNextAm=pw?((nightData[pw]?.coverages||{}).nextAm||[]):[];
      const dind=(coverages||[]).filter(x=>x.date===date);
      if((nd.doctors||[]).includes(doc.id)) workedPeriods+=2;
      ["am","pm"].forEach(per=>{
        if(!isClinic(getSlot(doc,di,per))) return;
        const onLv=onLeave(doc,date,leaves);
        const isEve=(nd.doctors||[]).includes(doc.id);
        const indCov=dind.some(x=>x.period===per&&x.absentId===doc.id);
        const nCov=isEve&&(per==="am"?[...(c.am||[]),...prevNextAm].length>0:(c.pm||[]).length>0);
        if(!(onLv||indCov||nCov)) workedPeriods+=1;
      });
      (c.am||[]).forEach(id=>{if(id===doc.id)workedPeriods+=1;});
      (c.pm||[]).forEach(id=>{if(id===doc.id)workedPeriods+=1;});
      prevNextAm.forEach(id=>{if(id===doc.id)workedPeriods+=1;});
      dind.forEach(x=>{if(x.coverDoctorId===doc.id)workedPeriods+=1;});
    });
    const rank = rankOf(doc);
    const expected = RANK_REF[rank] || 9;
    return { fixedNights, extraNights, nightCovs, indivCovs, totalCovs, leaveDays, absenceDays, tasks, myLeaves, workedPeriods, expected, rank };
  };

  const classify = (t) => t<=1 ? { label:"خفيف", color:"#15803d", bg:"#f0fdf4", border:"#bbf7d0" }
    : t<=3 ? { label:"متوسط", color:"#d97706", bg:"#fffbeb", border:"#fde68a" }
    : { label:"مرتفع", color:"#dc2626", bg:"#fef2f2", border:"#fecaca" };

  // Overview totals (current month)
  const overview = doctors.map(doc => ({ doc, s: calcStats(doc, "month") })).sort((a,b)=>b.s.tasks-a.s.tasks);
  const totTasks = overview.reduce((a,x)=>a+x.s.tasks,0);
  const avgTasks = doctors.length ? totTasks/doctors.length : 0;

  const selDoc = doctors.find(d=>d.id===+selId);
  const PERIODS = { week:"أسبوع", month:"شهر", month2:"شهرين", month3:"3 أشهر", year:"سنة", custom:"فترة مخصّصة" };
  const SLOT_LABEL = { clinic:"عيادة", clinic_am:"عيادة", clinic_pm:"عيادة", admin:"إداري", training:"تدريب", audit:"تدقيق", virtual:"افتراضية", "":"—" };
  const LEAVE_TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };

  return (
    <div>
      {/* Doctor selector */}
      <div style={{ background:"linear-gradient(135deg,#1e3a5f,#2c5282)", borderRadius:14, padding:"16px 18px", marginBottom:16 }}>
        <div style={{ color:"#cdddec", fontSize:12, fontWeight:700, marginBottom:8 }}>👨‍⚕️ اختر طبيباً لعرض تفاصيله الكاملة</div>
        <select value={selId} onChange={e=>setSelId(e.target.value)} style={{ width:"100%", padding:"11px 12px", borderRadius:9, border:"none", fontSize:14, fontWeight:700, color:"#1e293b", cursor:"pointer", outline:"none" }}>
          <option value="">— عرض النظرة العامة لكل الأطباء —</option>
          {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      {/* DETAIL VIEW for selected doctor */}
      {selDoc ? (() => {
        const s = calcStats(selDoc, period);
        const cls = classify(s.tasks);
        return (
          <div>
            {/* Profile header */}
            <div style={{ background:"#fff", borderRadius:14, padding:16, marginBottom:14, borderRight:`6px solid ${selDoc.color}`, display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ ...AV, background:selDoc.color, width:54, height:54, fontSize:20, borderRadius:14 }}>{sn(selDoc.name).slice(0,2)}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:800, fontSize:18 }}>{selDoc.name}</div>
                <div style={{ fontSize:12, color:"#64748b", display:"flex", gap:8, flexWrap:"wrap", marginTop:4 }}>
                  <span>{wSlots(selDoc)} فترة/أسبوع</span>
                  {(selDoc.nightDays||[]).length>0 && <span style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:5, padding:"1px 8px" }}>🌙 مسائي ثابت: {(selDoc.nightDays||[]).map(d=>DAYS[d]).join("، ")}</span>}
                </div>
              </div>
            </div>

            {/* Period toggle */}
            <div style={{ display:"flex", gap:6, marginBottom:10, flexWrap:"wrap" }}>
              {Object.entries(PERIODS).map(([k,l])=>(
                <button key={k} onClick={()=>setPeriod(k)} style={{ flex:"1 1 80px", padding:"9px", borderRadius:9, fontSize:12, fontWeight:700, cursor:"pointer", border: period===k?"2px solid #1e3a5f":"1px solid #e2e8f0", background: period===k?"#eff4fa":"#fff", color: period===k?"#1e3a5f":"#64748b" }}>{l}</button>
              ))}
            </div>
            {period==="custom" && (
              <div style={{ display:"flex", gap:8, marginBottom:14, alignItems:"center", flexWrap:"wrap", background:"#f8fafc", borderRadius:9, padding:10 }}>
                <span style={{ fontSize:12, color:"#64748b" }}>من:</span>
                <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 130px" }} />
                <span style={{ fontSize:12, color:"#64748b" }}>إلى:</span>
                <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 130px" }} />
              </div>
            )}

            {/* Stat cards */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))", gap:8, marginBottom:14 }}>
              {[{i:"🌙",l:"مسائي ثابت",v:s.fixedNights,c:"#64748b"},
                {i:"➕",l:"مسائي إضافي",v:s.extraNights,c:"#1d4ed8"},
                {i:"🔄",l:"تغطيات",v:s.totalCovs,c:"#15803d"},
                {i:"🏥",l:"غياب",v:s.absenceDays,c:"#dc2626"},
                {i:"🏖",l:"إجازات",v:s.leaveDays,c:"#d97706"},
              ].map(({i,l,v,c})=>(
                <div key={l} style={{ background:"#fff", border:"1px solid #e2e8f0", borderTop:`3px solid ${c}`, borderRadius:10, padding:"10px 6px", textAlign:"center" }}>
                  <div style={{ fontSize:18 }}>{i}</div>
                  <div style={{ fontSize:22, fontWeight:800, color:c }}>{v}</div>
                  <div style={{ fontSize:9, color:"#64748b" }}>{l}</div>
                </div>
              ))}
            </div>

            {/* Worked periods vs rank reference */}
            {(() => {
              const wp = s.workedPeriods||0; const exp = s.expected||9;
              const diff = wp - exp;
              const col = diff>1 ? "#dc2626" : diff< -1 ? "#d97706" : "#15803d";
              const bg = diff>1 ? "#fef2f2" : diff< -1 ? "#fffbeb" : "#f0fdf4";
              return (
                <div style={{ background:bg, border:`1px solid ${col}33`, borderRadius:12, padding:"14px 16px", marginBottom:14, display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:34, fontWeight:800, color:col }}>{wp}</div>
                    <div style={{ fontSize:10, color:"#64748b" }}>فترات العمل الفعلية</div>
                  </div>
                  <div style={{ flex:1, minWidth:160 }}>
                    <div style={{ fontWeight:800, color:col, fontSize:14 }}>{rankLabel(s.rank)} — المتوقّع {exp} فترة</div>
                    <div style={{ fontSize:12, color:"#64748b", marginTop:3 }}>
                      {diff>1 ? `أعلى من المتوقّع بـ ${diff} فترة` : diff< -1 ? `أقل من المتوقّع بـ ${Math.abs(diff)} فترة` : "ضمن المعدّل المتوقّع ✓"}
                    </div>
                    <div style={{ fontSize:10, color:"#94a3b8", marginTop:4 }}>كل فترة عمل=1 · مسائي=2 · تغطية=1 · الفراغ=0 · ما يُغطّى لا يُحسب</div>
                  </div>
                </div>
              );
            })()}

            {/* Extra load badge */}
            <div style={{ background:cls.bg, border:`1px solid ${cls.border}`, borderRadius:12, padding:"12px 16px", marginBottom:14, display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ fontSize:34, fontWeight:800, color:cls.color }}>{s.tasks}</div>
              <div>
                <div style={{ fontWeight:700, color:cls.color }}>العبء الإضافي ({PERIODS[period]}) — {cls.label}</div>
                <div style={{ fontSize:11, color:"#64748b" }}>= (مسائي إضافي ×2 شفتين + تغطيات) − غياب</div>
              </div>
            </div>

            {/* Weekly schedule */}
            <div style={{ background:"#fff", borderRadius:12, padding:14, marginBottom:14, border:"1px solid #e2e8f0" }}>
              <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📅 الجدول الأسبوعي</div>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", minWidth:340 }}>
                  <thead><tr style={{ background:"#5b8def" }}>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>اليوم</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>ص</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>م</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>مسائي</th>
                  </tr></thead>
                  <tbody>
                    {[0,1,2,3,4].map(di=>{
                      const isEve = (selDoc.nightDays||[]).includes(di);
                      const am = getSlot(selDoc,di,"am"), pm = getSlot(selDoc,di,"pm");
                      const cellStyle = (v) => ({ padding:"6px", fontSize:11, textAlign:"center", border:"1px solid #f1f5f9", background:(SLOT_COLORS[v]||SLOT_COLORS[""]).bg, color:(SLOT_COLORS[v]||SLOT_COLORS[""]).text, fontWeight:600 });
                      return (
                        <tr key={di}>
                          <td style={{ padding:"6px", fontSize:11, fontWeight:700, color:"#fff", background:"#7ea4e6", textAlign:"center" }}>{DAYS[di]}</td>
                          <td style={cellStyle(am)}>{am?SLOT_LABEL[am]:"—"}</td>
                          <td style={cellStyle(pm)}>{pm?SLOT_LABEL[pm]:"—"}</td>
                          <td style={{ padding:"6px", fontSize:11, textAlign:"center", border:"1px solid #f1f5f9", background:isEve?"#0f1e36":"#fff", color:isEve?"#93b4d8":"#cbd5e1", fontWeight:700 }}>{isEve?"🌙 عيادة":"—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Leaves */}
            <div style={{ background:"#fff", borderRadius:12, padding:14, border:"1px solid #e2e8f0" }}>
              <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>🏖 الإجازات ({PERIODS[period]})</div>
              {s.myLeaves.length===0 ? (
                <div style={{ fontSize:12, color:"#94a3b8", textAlign:"center", padding:"10px 0" }}>لا توجد إجازات في هذه الفترة</div>
              ) : s.myLeaves.map(l=>{
                const days = Math.round((new Date(l.end)-new Date(l.start))/86400000)+1;
                return (
                  <div key={l.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", background:"#f8fafc", borderRadius:8, marginBottom:5, fontSize:12 }}>
                    <span style={{ background: l.type==="sick"||l.type==="emergency"?"#fef2f2":"#fffbeb", color: l.type==="sick"||l.type==="emergency"?"#dc2626":"#d97706", borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:700 }}>{LEAVE_TYPES[l.type]}</span>
                    <span style={{ flex:1 }}>{l.start} ← {l.end}</span>
                    <strong>{days} أيام</strong>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })() : (
        /* OVERVIEW — compact list of all doctors (current month) */
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:14 }}>
            <div style={{ background:"#fff", border:"1px solid #cdddec", borderTop:"3px solid #1e3a5f", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>📊</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#1e3a5f" }}>{avgTasks.toFixed(1)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>متوسط العبء/طبيب</div>
            </div>
            <div style={{ background:"#fff", border:"1px solid #bfdbfe", borderTop:"3px solid #1d4ed8", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>🌙</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#1d4ed8" }}>{overview.reduce((a,x)=>a+x.s.fixedNights+x.s.extraNights,0)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>إجمالي الدوام المسائي</div>
            </div>
            <div style={{ background:"#fff", border:"1px solid #bbf7d0", borderTop:"3px solid #15803d", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>🔄</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#15803d" }}>{overview.reduce((a,x)=>a+x.s.totalCovs,0)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>إجمالي التغطيات</div>
            </div>
          </div>

          <div style={{ fontSize:11, color:"#94a3b8", marginBottom:8 }}>النظرة العامة للشهر الحالي — مرتّبة حسب العبء. اضغط أي طبيب لتفاصيله.</div>
          <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
            {overview.map(({doc,s})=>{
              const cls = classify(s.tasks);
              const vsAvg = s.tasks - avgTasks;
              const statBox = (label, val, color, bg) => (
                <div style={{ background:bg, borderRadius:8, padding:"5px 4px", textAlign:"center", minWidth:52 }}>
                  <div style={{ fontSize:15, fontWeight:800, color, lineHeight:1 }}>{val}</div>
                  <div style={{ fontSize:9, color:"#94a3b8", marginTop:2 }}>{label}</div>
                </div>
              );
              return (
                <div key={doc.id} onClick={()=>setSelId(String(doc.id))} style={{ display:"flex", alignItems:"center", gap:10, background:"#fff", border:"1px solid #eef2f7", borderRadius:11, padding:"10px 12px", cursor:"pointer", borderRight:`4px solid ${doc.color}` }}>
                  <div style={{ ...AV, background:doc.color, width:34, height:34, fontSize:11, borderRadius:9 }}>{sn(doc.name).slice(0,2)}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:700, fontSize:14, color:"#1e293b" }}>{doc.name}</div>
                    <div style={{ fontSize:10, fontWeight:700, marginTop:2, color: Math.abs(vsAvg)<0.5?"#94a3b8":vsAvg>0?"#dc2626":"#15803d" }}>
                      {Math.abs(vsAvg)<0.5?"≈ ضمن المتوسط":vsAvg>0?`▲ أعلى من المتوسط بـ ${vsAvg.toFixed(1)}`:`▼ أقل من المتوسط بـ ${Math.abs(vsAvg).toFixed(1)}`}
                    </div>
                  </div>
                  {/* Clear stat boxes */}
                  <div style={{ display:"flex", gap:5 }}>
                    {statBox("مسائي", s.fixedNights+s.extraNights, "#1d4ed8", "#eff4fb")}
                    {statBox("تغطيات", s.totalCovs, "#15803d", "#eefaf3")}
                    {s.absenceDays>0 && statBox("غياب", s.absenceDays, "#dc2626", "#fdeef0")}
                    <div style={{ background:cls.bg, border:`1px solid ${cls.border}`, borderRadius:8, padding:"5px 8px", textAlign:"center", minWidth:54 }}>
                      <div style={{ fontSize:16, fontWeight:800, color:cls.color, lineHeight:1 }}>{s.tasks}</div>
                      <div style={{ fontSize:9, color:cls.color, marginTop:2, fontWeight:700 }}>العبء</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
