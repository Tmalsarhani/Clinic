    const totalShifts = perDoctorRows.reduce((a,r)=>a+r.ev.length,0);
    const summary = `<div class="sumbar">
      <div class="sumtile"><b>${totalShifts}</b><span>إجمالي المناوبات</span></div>
      <div class="sumtile"><b>${perDoctorRows.reduce((a,r)=>a+r.fixedN,0)}</b><span>ثابتة</span></div>
      <div class="sumtile"><b>${perDoctorRows.reduce((a,r)=>a+r.extraN,0)}</b><span>إضافية</span></div>
      <div class="sumtile"><b>${dates.filter(dt=>((nightData[dt]||{}).doctors||[]).length>0).length}</b><span>أيام فيها مناوبة</span></div>
    </div>`;
    const totalsTbl = shown.length>1 ? `<h2>📊 إجمالي المناوبات لكل طبيب (مرتّب تنازلياً)</h2><table><thead><tr><th style="text-align:start">الطبيب</th><th>ثابتة</th><th>إضافية</th><th>الإجمالي</th></tr></thead><tbody>${perDoctorRows.map(r=>`<tr><td style="text-align:start;font-weight:700">د.${r.d.name}</td><td>${r.fixedN}</td><td>${r.extraN}</td><td style="font-weight:800;color:${C.primaryD}">${r.ev.length}</td></tr>`).join("")}<tr class="totrow"><td style="text-align:start">الإجمالي</td><td>${perDoctorRows.reduce((a,r)=>a+r.fixedN,0)}</td><td>${perDoctorRows.reduce((a,r)=>a+r.extraN,0)}</td><td>${totalShifts}</td></tr></tbody></table>` : "";
    let dayByDay;
    if(shown.length===1){
      const r = perDoctorRows[0];
      dayByDay = r.ev.length ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${r.ev.map(dt=>{ const fixed=(r.d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td>${fixed?"🌙 مسائي ثابت":"🌙 مسائي إضافي"}</td></tr>`; }).join("")}</tbody></table>` : `<p>لا مناوبات مسائية خلال ${label}</p>`;
    } else {
      const rows = dates.map(dt=>{ const docs=((nightData[dt]||{}).doctors||[]).map(id=>fd(id)).filter(Boolean); if(!docs.length) return null; const di=dayIdx(dt); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td style="text-align:start">${docs.map(dr=>{ const fixed=(dr.nightDays||[]).includes(di); return `د.${dr.name}${fixed?" (ثابت)":" (إضافي)"}`; }).join("، ")}</td></tr>`; }).filter(Boolean).join("");
      dayByDay = rows ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>الأطباء المناوبون</th></tr></thead><tbody>${rows}</tbody></table>` : `<p>لا مناوبات مسائية خلال ${label}</p>`;
    }
    const title = shown.length===1 ? `تقرير المناوبات — د.${shown[0].name} (${label})` : `تقرير المناوبات — كامل القسم (${label})`;
    printDoc(title, reportCSS+focusCSS+summary+totalsTbl+`<h2>🌙 كل الأيام</h2>`+dayByDay, false);
  };
  const printCoverageReport = () => {
    const perDoctorRows = shown.map(d=>({ d, cv:covsOf(d) })).sort((a,b)=>b.cv.length-a.cv.length);
    const totalCov = perDoctorRows.reduce((a,r)=>a+r.cv.length,0);
    const byReason = {};
    perDoctorRows.forEach(r=>r.cv.forEach(c=>{ const key=coverReasonAr(c.ownerId,c.date,c.reason,leaves); byReason[key]=(byReason[key]||0)+1; }));
    const summary = `<div class="sumbar">
      <div class="sumtile"><b>${totalCov}</b><span>إجمالي التغطيات</span></div>
      <div class="sumtile"><b>${dates.filter(dt=>coverages.some(c=>c.date===dt)||Object.values(((nightData[dt]||{}).coverages)||{}).some(a=>a&&a.length)).length}</b><span>أيام فيها تغطية</span></div>
      ${Object.entries(byReason).slice(0,2).map(([k,v])=>`<div class="sumtile"><b>${v}</b><span>${k}</span></div>`).join("")}
    </div>`;
    const totalsTbl = shown.length>1 ? `<h2>📊 إجمالي التغطيات لكل طبيب (مرتّب تنازلياً)</h2><table><thead><tr><th style="text-align:start">الطبيب</th><th>عدد التغطيات</th></tr></thead><tbody>${perDoctorRows.map(r=>`<tr><td style="text-align:start;font-weight:700">د.${r.d.name}</td><td style="font-weight:800;color:${C.primaryD}">${r.cv.length}</td></tr>`).join("")}<tr class="totrow"><td style="text-align:start">الإجمالي</td><td>${totalCov}</td></tr></tbody></table>` : "";
    let dayByDay;
    if(shown.length===1){
      const r = perDoctorRows[0];
      dayByDay = r.cv.length ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${r.cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} — بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>` : `<p>لا تغطيات خلال ${label}</p>`;
    } else {
      const rows = [];
      dates.forEach(dt=>{
        const items=[];
        coverages.filter(c=>c.date===dt).forEach(c=>items.push(`د.${fd(c.coverDoctorId)?.name||"—"} ◂ ${c.absentId?("د."+(fd(c.absentId)?.name||"—")):"—"} (${perAr(c.period)})`));
        const cv=(nightData[dt]||{}).coverages||{};
        ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>items.push(`د.${fd(id)?.name||"—"} ◂ طبيب المسائي (${perAr(sl)})`)); });
        if(items.length) rows.push(`<tr><td style="font-weight:600">${dmyFull(dt)}</td><td style="text-align:start">${items.join("<br>")}</td></tr>`);
      });
      dayByDay = rows.length ? `<table><thead><tr><th style="width:170px">اليوم والتاريخ</th><th>التغطيات (المغطّي ◂ الغائب)</th></tr></thead><tbody>${rows.join("")}</tbody></table>` : `<p>لا تغطيات خلال ${label}</p>`;
    }
    const title = shown.length===1 ? `تقرير التغطيات — د.${shown[0].name} (${label})` : `تقرير التغطيات — كامل القسم (${label})`;
    printDoc(title, reportCSS+focusCSS+summary+totalsTbl+`<h2>🔄 كل الأيام</h2>`+dayByDay, false);
  };

  const printDoctorTimetable = d => {
    const [y,m] = ref.split("-"); const Y=+y, Mo=+m-1;
    const last = new Date(Y, Mo+1, 0).getDate();
    const WK = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const TIMES = { am:"08:00–12:00", pm:"13:00–16:00", nextAm:"08:00–12:00 (الغد)", eve:"16:00–23:00" };
    let totClin=0, totCov=0;
    const rows=[];
    for(let day=1; day<=last; day++){
      const date = `${Y}-${String(Mo+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const jsDay = new Date(date).getDay();
      const di = dayIdx(date);
      if(di<0){ const h=holidayInfo(date); const txt = h ? `🎉 ${h.name}${h.onCall?(" · مناوب: د."+(fd(h.onCall)?.name||"")):" · بدون مناوب"}` : "عطلة نهاية الأسبوع"; rows.push(`<tr class="we"><td>${dmy(date)}</td><td>${WK[jsDay]}</td><td colspan="6" style="color:${h?"#6d28d9":"#94a3b8"};font-weight:${h?"700":"400"}">${txt}</td></tr>`); continue; }
      const nd = nightData[date]||{};
      const isEve = (nd.doctors||[]).includes(d.id);
      const onLv = onLeave(d,date,leaves); const closed = clinicClosedOnLeave(d,date,leaves);
      const indiv = coverages.filter(c=>c.date===date);
      const cellFor = per => { const slot=getSlot(d,di,per); const away=indiv.some(x=>x.period===per && x.absentId===d.id); if(onLv) return closed?`<span class="lv">إجازة</span>`:(slot?(SLOT_AR[slot]||slot):"—"); if(away) return `<span class="aw">غُطّيت عنه</span>`; if(!slot) return "—"; return SLOT_AR[slot]||slot; };
      const amC=cellFor("am"), pmC=cellFor("pm");
      const eveC = isEve?`<span class="ev">عيادة مسائية</span>`:"—";
      const covs=[];
      indiv.forEach(x=>{ if(x.coverDoctorId===d.id) covs.push(`${perFull(x.period)} (${TIMES[x.period]||""}) لـ د.${fd(x.absentId)?.name||"—"} بسبب ${coverReasonAr(x.absentId,date,x.reason,leaves)}`); });
      ["am","pm","nextAm"].forEach(sl=>{ (nd.coverages?.[sl]||[]).forEach(id=>{ if(id===d.id) covs.push(`${perFull(sl)} (${TIMES[sl]||""}) لطبيب المسائي بسبب دوام مسائي`); }); });
      let clin=0;
      if(!onLv){ const a=getSlot(d,di,"am"), b=getSlot(d,di,"pm"); if(a&&DIRECT_SLOTS.includes(a)&&!indiv.some(x=>x.period==="am"&&x.absentId===d.id)) clin++; if(b&&DIRECT_SLOTS.includes(b)&&!indiv.some(x=>x.period==="pm"&&x.absentId===d.id)) clin++; }
      if(isEve) clin+=2;
      const covCnt=covs.length;
      totClin+=clin; totCov+=covCnt;
      rows.push(`<tr><td>${dmy(date)}</td><td>${DAYS[di]}</td><td>${amC}</td><td>${pmC}</td><td>${eveC}</td><td style="text-align:start;font-size:11px">${covs.join("<br>")||"—"}</td><td><b>${clin}</b></td><td><b>${covCnt}</b></td></tr>`);
    }
    const css = `<style>.we td{background:#f8fafc}.lv{color:#d12b30;font-weight:700}.aw{color:#b45309;font-weight:600}.ev{color:#6d28d9;font-weight:700;background:#ede9fe;border-radius:6px;padding:1px 8px}.tot td{background:#0d1b2a;color:#fff;font-weight:800;font-size:13px}.tt{font-size:11px;color:#64748b;margin:0 0 12px;background:#f6f9fc;border:1px solid #e8eef3;border-radius:10px;padding:9px 12px}thead th small{font-weight:500;opacity:.9}</style>`;
    const note = `<p class="tt">الفترات: <b>صباح 08:00–12:00</b> · <b>ظهر 13:00–16:00</b> · <b>مساء 16:00–23:00</b> (تُحتسب فترتين). «فترات الرعاية» تشمل المسائي ×2 والتغطيات المنفّذة.</p>`;
    const head = `<div class="dhead"><span class="dav">${sn(d.name).slice(0,2)}</span><div><div class="dnm">د.${d.name}</div><div class="dmt">${rankLabel(rankOf(d))} · الجدول الشهري التفصيلي · ${dmy(`${Y}-${String(Mo+1).padStart(2,"0")}-01`)} ← ${dmy(`${Y}-${String(Mo+1).padStart(2,"0")}-${String(last).padStart(2,"0")}`)}</div></div></div>`;
    const table = `<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>صباح<br><small>08:00–12:00</small></th><th>ظهر<br><small>13:00–16:00</small></th><th>مساء<br><small>16:00–23:00</small></th><th>التغطيات (بالأوقات)</th><th>فترات الرعاية</th><th>تغطيات</th></tr></thead><tbody>${rows.join("")}<tr class="tot"><td colspan="6">الإجمالي الشهري</td><td>${totClin}</td><td>${totCov}</td></tr></tbody></table>`;
    printDoc(`الجدول الشهري التفصيلي — د.${d.name} (${MONTHS[Mo]} ${Y})`, reportCSS+css+head+note+table, true);
  };

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>📊 تقارير الأطباء</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden", flexWrap:"wrap" }}>
          {[["week","أسبوعي"],["month","شهري"]].map(([k,l])=><button key={k} onClick={()=>setScope(k)} style={{ padding:"7px 15px", border:"none", fontSize:12.5, fontWeight:700, background:scope===k?C.primary:"var(--surface)", color:scope===k?"#fff":C.sub }}>{l}</button>)}
          {[2,3,4,6,12].map(n=><button key={n} onClick={()=>{ setScope("multi"); setMonthsN(n); }} style={{ padding:"7px 12px", border:"none", borderInlineStart:`1px solid ${C.line}`, fontSize:12.5, fontWeight:700, background:(scope==="multi"&&monthsN===n)?C.primary:"var(--surface)", color:(scope==="multi"&&monthsN===n)?"#fff":C.sub }}>{n} أشهر</button>)}
          <button onClick={()=>setScope("range")} style={{ padding:"7px 12px", border:"none", borderInlineStart:`1px solid ${C.line}`, fontSize:12.5, fontWeight:700, background:scope==="range"?C.primary:"var(--surface)", color:scope==="range"?"#fff":C.sub }}>📅 من/إلى</button>
          <button onClick={()=>setScope("grid")} style={{ padding:"7px 12px", border:"none", borderInlineStart:`1px solid ${C.line}`, fontSize:12.5, fontWeight:700, background:scope==="grid"?C.primary:"var(--surface)", color:scope==="grid"?"#fff":C.sub }}>🗓 اختيار أشهر</button>
        </div>
      </div>
      {scope==="range" && (
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap" }}>
          <div style={{ flex:"1 1 130px" }}><div style={{ fontSize:11, color:C.sub, marginBottom:3 }}>من</div><input type="date" value={rangeFrom} onChange={e=>setRangeFrom(e.target.value)} style={sIn} /></div>
          <div style={{ flex:"1 1 130px" }}><div style={{ fontSize:11, color:C.sub, marginBottom:3 }}>إلى</div><input type="date" value={rangeTo} onChange={e=>setRangeTo(e.target.value)} style={sIn} /></div>
        </div>
      )}
      {scope==="grid" && (
        <div style={{ marginBottom:10 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:9 }}>
            <button onClick={()=>setGridYear(y=>y-1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>‹</button>
            <div style={{ flex:1, textAlign:"center", fontWeight:700, fontSize:13.5 }}>{gridYear}</div>
            <button onClick={()=>setGridYear(y=>y+1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>›</button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6 }}>
            {MONTHS.map((mn,mi)=>(
              <button key={mi} onClick={()=>toggleGridMonth(mi)} style={{ padding:"10px 4px", borderRadius:10, border:`1.5px solid ${gridMonths.has(mi)?C.primary:C.line}`, background:gridMonths.has(mi)?"var(--primarySoft)":"var(--surface)", color:gridMonths.has(mi)?C.primaryD:C.sub, fontSize:12, fontWeight:700, cursor:"pointer" }}>{mn}</button>
            ))}
          </div>
        </div>
      )}
      {(scope==="week"||scope==="month"||scope==="multi") && <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
        <button onClick={()=>nav(-1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>‹</button>
        <div style={{ flex:1, textAlign:"center", fontWeight:700, fontSize:13.5 }}>{label}</div>
        <button onClick={()=>nav(1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>›</button>
      </div>}
      {(scope==="range"||scope==="grid") && <div style={{ textAlign:"center", fontWeight:700, fontSize:13.5, marginBottom:10, color:C.primaryD }}>{label}</div>}
      <select value={sel} onChange={e=>setSel(e.target.value)} style={{ ...sIn, marginBottom:10 }}>
        <option value="all">كل الأطباء</option>
        {doctors.map(d=><option key={d.id} value={d.id}>د.{d.name}</option>)}
      </select>
      <div style={{ fontSize:11, color:C.muted, marginBottom:8 }}>التقارير أدناه تُطبَّق على: <b style={{ color:C.primaryD }}>{sel==="all"?"كامل القسم":("د."+(fd(+sel)?.name||""))}</b> — غيّرها من القائمة أعلاه.</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
        <button onClick={printEveningReport} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:5, background:"var(--eveSoft)", border:`1px solid #C7BEFB`, borderRadius:12, padding:"13px 8px", cursor:"pointer", fontFamily:"inherit" }}>
          <span style={{ fontSize:22 }}>🌙</span>
          <span style={{ fontSize:12.5, fontWeight:800, color:"var(--eve)" }}>تقرير المناوبات</span>
          <span style={{ fontSize:10, color:C.sub, textAlign:"center" }}>عدد المناوبات + كل الأيام</span>
        </button>
        <button onClick={printCoverageReport} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:5, background:"var(--primarySoft)", border:`1px solid ${C.primary}55`, borderRadius:12, padding:"13px 8px", cursor:"pointer", fontFamily:"inherit" }}>
          <span style={{ fontSize:22 }}>🔄</span>
          <span style={{ fontSize:12.5, fontWeight:800, color:C.primaryD }}>تقرير التغطيات</span>
          <span style={{ fontSize:10, color:C.sub, textAlign:"center" }}>عدد التغطيات + كل الأيام</span>
        </button>
      </div>
      <button onClick={printAll} style={{ ...sGhost, width:"100%" }}>🖨 طباعة {sel==="all"?"الكل (كل طبيب بصفحة)":"الطبيب المحدد"}</button>
      <button onClick={printDepartment} style={{ ...sBtn(C.primaryD), width:"100%", marginTop:8 }}>🗂 مراجعة جدول القسم الشامل (تعارضات + عيادات مكشوفة + كل طبيب)</button>
    </div>

    {shown.map(d=>{ const s=doctorSessions(d,dates,nightData,coverages,leaves); const cv=covsOf(d); const ev=eveOf(d); const lv=lvOf(d); return (
      <div key={d.id} style={{ ...card(), padding:16, marginBottom:12 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <Avatar doc={d} size={36}/>
          <div style={{ flex:1 }}><div style={{ fontWeight:700, fontSize:14 }}>د.{d.name}</div><div style={{ fontSize:11, color:C.sub }}>{rankLabel(rankOf(d))} · هدف {directTarget(d)}</div></div>
          <button onClick={()=>printDoctor(d)} style={{ ...sGhost, padding:"7px 12px", fontSize:12 }}>🖨 تقرير</button><button onClick={()=>printDoctorTimetable(d)} style={{ ...sGhost, padding:"7px 12px", fontSize:12 }}>🗓 شهري تفصيلي</button>
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:12 }}>
          {[["رعاية",s.care,C.primary],["مسائي ثابت",s.eveningFixed,"var(--eve)"],["مسائي إضافي",s.eveningExtra,"#b45309"],["تغطيات",s.covers,"var(--primary-d)"],["دعم",s.support,"#64748b"],["إجمالي",s.total,"var(--ink)"]].map(([l,v,col])=>(
            <div key={l} style={{ flex:"1 1 64px", background:"var(--surface2)", borderRadius:9, padding:"9px 6px", textAlign:"center" }}><div style={{ fontSize:18, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:10, color:C.sub, marginTop:2 }}>{l}</div></div>
          ))}
        </div>
        <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, marginBottom:6 }}>🏥 الجدول الأسبوعي</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:10 }}>
          {DAYS.map((dn,di)=>(<div key={di} style={{ textAlign:"center" }}>
            <div style={{ fontSize:9.5, color:C.sub, fontWeight:700, marginBottom:3 }}>{dn}</div>
            {["am","pm","eve"].map(p=>{ const sl=(d.sched?.[di]?.[p])||(p==="eve"&&(d.nightDays||[]).includes(di)?"clinic":""); const st=p==="eve"?{bg:sl?"#ECEAFE":"var(--surface2)",fg:"var(--eve)",t:"🌙 مسائي"}:slotStyle(sl); return <div key={p} style={{ background:st.bg, color:st.fg, fontSize:9.5, fontWeight:700, borderRadius:6, padding:"5px 1px", marginBottom:2, border:p==="eve"&&sl?"1px solid #C7BEFB":"none" }}>{sl?st.t:"—"}</div>; })}
          </div>))}
        </div>
        {ev.length>0 && <div style={{ fontSize:11.5, marginBottom:5 }}>🌙 مسائي: {ev.map(dt=>dmy(dt)).join("، ")}</div>}
        {cv.length>0 && <div style={{ fontSize:11.5, marginBottom:5 }}>🔄 تغطيات: {cv.map(c=>`${dmy(c.date)} ${perTxt(c.period)}`).join("، ")}</div>}
        {!ev.length && !cv.length && <div style={{ fontSize:11.5, color:C.muted }}>لا دوام مسائي ولا تغطيات في هذه الفترة</div>}
      </div>
    ); })}
  </div>;
}

function AuditPage({ audit }) {
  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontSize:15, fontWeight:700 }}>📜 سجل النشاط <span style={{ fontWeight:400, color:C.muted, fontSize:12 }}>({audit.length})</span></div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:3 }}>توثيق العمليات (أحدث أولاً) — لا يُحذف تلقائياً</div>
    </div>
    {audit.length===0 ? <Empty icon="📜" title="لا نشاط بعد" hint="ستظهر هنا التغطيات والإجازات وتعديلات الأطباء" /> :
      <div style={{ ...card(), padding:14 }}>
        {audit.map(a=>{ const stColor={"معتمدة":{bg:"#ecfdf5",fg:"#047857"},"مسودة":{bg:"#fffbeb",fg:"#b45309"},"ملغاة":{bg:"#fef2f2",fg:"#b91c1c"}}[a.status]||{bg:"#eef2f7",fg:C.sub}; return (
          <div key={a.id} style={{ display:"flex", gap:10, padding:"9px 0", borderBottom:`1px solid ${C.line2}`, alignItems:"flex-start" }}>
            <span style={{ fontSize:10.5, color:C.muted, minWidth:96 }}>{new Date(a.at).toLocaleString("ar",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:12.5, color:C.text }}>{a.action}</div>
              {a.by && <div style={{ fontSize:10.5, color:C.muted, marginTop:2 }}>بواسطة: {a.by}</div>}
            </div>

          </div>
        ); })}
      </div>}
  </div>;
}

// ════════════════════════════════ USERS / RBAC ════════════════════════════════
const ROLE_AR = { head:"رئيس القسم", deputy:"نائب رئيس القسم", doctor:"طبيب" };

function LoginScreen({ users, onLogin }) {
  const [u,setU] = useState("");
  const [p,setP] = useState("");
  const [err,setErr] = useState("");
  const go = () => { const f=users.find(x=>x.username.trim().toLowerCase()===u.trim().toLowerCase() && String(x.pin)===String(p)); if(f){ setErr(""); onLogin(f); } else setErr("اسم المستخدم أو الرمز غير صحيح"); };
  return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:`linear-gradient(135deg,${C.primaryD},${C.primary})`, padding:20 }}>
    <div style={{ background:"var(--surface)", borderRadius:20, padding:"30px 26px", width:"100%", maxWidth:360, boxShadow:"0 20px 60px rgba(0,0,0,.25)" }}>
      <div style={{ textAlign:"center", marginBottom:22 }}>

function DoctorPortal({ doctor, doctors, leaves, nightData, coverages, today, fd }) {
  const now = new Date(today);
  const md = monthDays(now.getFullYear(), now.getMonth()).map(x=>x.date);
  const s = doctorSessions(doctor, md, nightData, coverages, leaves);
  const myLeaves = leaves.filter(l=>l.doctorId===doctor.id);
  const evDates = Object.entries(nightData).filter(([dt,nd])=>(nd.doctors||[]).includes(doctor.id) && dt.slice(0,7)===`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`).map(([dt])=>dt).sort();
  const myCovs = [];
  coverages.filter(c=>c.coverDoctorId===doctor.id).forEach(c=>myCovs.push({ date:c.date, period:c.period, ownerId:c.absentId }));
  Object.entries(nightData).forEach(([dt,nd])=>{ const cv=nd.coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===doctor.id) myCovs.push({ date:dt, period:sl, ownerId:null }); }); }); });
  myCovs.sort((a,b)=>a.date.localeCompare(b.date));
  const perTxt = p => p==="am"?"عيادة الصباح":p==="pm"?"عيادة الظهر":p==="nextAm"?"عيادة صباح الغد":"العيادة المسائية";
  const tiles = [["رعاية مباشرة",s.care,C.primary],["دعم",s.support,"#64748b"],["مسائي",s.evening,"var(--eve)"],["تغطيات",s.covers,"var(--primary-d)"],["إجمالي العمل",s.total,"var(--ink)"],["إجازات",myLeaves.length,C.warn]];
  return <div className="fade">
    <div style={{ ...card(), padding:"18px 18px", marginBottom:14, display:"flex", alignItems:"center", gap:12 }}>
      <Avatar doc={doctor} size={48}/>
      <div><div style={{ fontSize:17, fontWeight:800 }}>د.{doctor.name}</div><div style={{ fontSize:12, color:C.sub }}>{rankLabel(rankOf(doctor))} · هدف الرعاية {directTarget(doctor)} · {MONTHS[now.getMonth()]}</div></div>
    </div>
    <div style={{ display:"flex", flexWrap:"wrap", gap:10, marginBottom:14 }}>
      {tiles.map(([l,v,col])=><div key={l} style={{ ...card(), flex:"1 1 70px", padding:"14px 8px", textAlign:"center" }}><div style={{ fontSize:24, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{l}</div></div>)}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:10 }}>🏥 جدول العيادات</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:5 }}>
        {DAYS.map((dn,di)=>(<div key={di} style={{ textAlign:"center" }}>
          <div style={{ fontSize:10.5, color:C.sub, fontWeight:700, marginBottom:4 }}>{dn}</div>
          {["am","pm","eve"].map(p=>{ const sl=(doctor.sched?.[di]?.[p])||(p==="eve"&&(doctor.nightDays||[]).includes(di)?"clinic":""); const st=p==="eve"?{bg:sl?"#ECEAFE":"var(--surface2)",fg:"var(--eve)",t:"🌙 مسائي"}:slotStyle(sl); return <div key={p} style={{ background:st.bg, color:st.fg, fontSize:10.5, fontWeight:700, borderRadius:7, padding:"6px 2px", marginBottom:3, border:p==="eve"&&sl?"1px solid #C7BEFB":"none" }}>{sl?st.t:"—"}</div>; })}
        </div>))}
      </div>
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🌙 الدوام المسائي ({evDates.length})</div>
      {evDates.length? <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{evDates.map(dt=><span key={dt} style={{ background:"var(--eveSoft)", color:"var(--eve)", fontSize:11.5, fontWeight:700, borderRadius:8, padding:"5px 10px" }}>{dmy(dt)}</span>)}</div> : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🔄 التغطيات المؤدّاة ({myCovs.length})</div>
      {myCovs.length? myCovs.map((c,i)=>(<div key={i} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ color:C.muted, minWidth:78 }}>{dmy(c.date)}</span>
        <span style={{ flex:1 }}>{c.ownerId?`عيادة د.${fd(c.ownerId)?.name||""}`:"تغطية عيادة"} · {perTxt(c.period)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🏖 الإجازات ({myLeaves.length})</div>
      {myLeaves.length? myLeaves.map(l=>(<div key={l.id} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ flex:1 }}>{dmy(l.start)} ← {dmy(l.end)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
  </div>;
}

function App() {
  const [doctors, _setDoctors]     = useState(()=>{ const st=S.get("v2_docs"); return (st&&st.length)?st:SEED_DOCTORS; });
  const [leaves, _setLeaves]       = useState(()=>S.get("v2_leaves")||[]);
  const [nightData, _setNight]     = useState(()=>S.get("v2_night")||{});
  const [coverages, _setCoverages] = useState(()=>S.get("v2_cov")||[]);
  const undoRef = React.useRef([]);
  const [undoN, setUndoN] = useState(0);
  const pushUndo = label => { try{ undoRef.current.push({ label, snap: JSON.stringify({ nightData, coverages, leaves, doctors }) }); if(undoRef.current.length>15) undoRef.current.shift(); setUndoN(undoRef.current.length); }catch(e){} };
  const doUndo = () => { const it=undoRef.current.pop(); setUndoN(undoRef.current.length); if(!it){ showToast("لا يوجد إجراء للتراجع","warn"); return; } try{ const o=JSON.parse(it.snap); _setNight(o.nightData||{}); _setCoverages(o.coverages||[]); _setLeaves(o.leaves||[]); _setDoctors(o.doctors||[]); showToast(`↩︎ تراجع: ${it.label}`); }catch(e){ showToast("تعذّر التراجع","err"); } };
  const setDoctors   = (v)=>{ pushUndo("تعديل الأطباء");   _setDoctors(v); };
  const setLeaves    = (v)=>{ pushUndo("تعديل الإجازات");  _setLeaves(v); };
  const setNight     = (v)=>{ pushUndo("تعديل المسائي");   _setNight(v); };
  const setCoverages = (v)=>{ pushUndo("تعديل التغطيات");  _setCoverages(v); };
  const [settings, setSettings]   = useState(()=>S.get("v2_settings")||{});
  const [holidays, setHolidays]   = useState(()=>S.get("v2_holidays")||[]);
  HOLIDAYS = buildHolidayMap(holidays);

  const [audit, setAudit]         = useState(()=>S.get("v2_audit")||[]);
  const [users, setUsers]         = useState(()=>{ const u=S.get("v2_users"); return (u&&u.length)?u:[{ id:uid(), username:"admin", pin:"0000", role:"head", doctorId:null }]; });
  const [session, setSession]     = useState(()=>S.get("v2_session")||null);
  const [official, setOfficial]   = useState(()=>S.get("v2_official")||null);
  const [collapsed, setCollapsed] = useState(()=>!!S.get("v2_navcollapsed"));
  const [sbOpen, setSbOpen] = useState(false);
  const [,forceDark] = useState(0);
  const toggleDark = () => { const dk=document.documentElement.getAttribute("data-theme")==="dark"; document.documentElement.setAttribute("data-theme", dk?"light":"dark"); S.set("v2_dark", !dk); forceDark(x=>x+1); };
  const [page, setPage]           = useState("dashboard");
  const [toast, setToast]         = useState(null);
  const [cloudReady, setCloudReady] = useState(false); // true بعد محاولة التحميل الأولى من السحابة (نجحت أو فشلت)
  const [cloudSyncState, setCloudSyncState] = useState(cloudCfg()?"idle":"off"); // off | idle | syncing | synced | error
  useEffect(()=>S.set("v2_docs",doctors),[doctors]);
  useEffect(()=>S.set("v2_leaves",leaves),[leaves]);
  useEffect(()=>S.set("v2_night",nightData),[nightData]);
  useEffect(()=>S.set("v2_cov",coverages),[coverages]);
  useEffect(()=>S.set("v2_settings",settings),[settings]);
  useEffect(()=>{ S.set("v2_holidays",holidays); HOLIDAYS=buildHolidayMap(holidays); },[holidays]);
  useEffect(()=>S.set("v2_audit",audit),[audit]);
  useEffect(()=>S.set("v2_users",users),[users]);
  useEffect(()=>S.set("v2_session",session),[session]);
  useEffect(()=>S.set("v2_navcollapsed",collapsed),[collapsed]);
  useEffect(()=>{ if(official) S.set("v2_official",official); },[official]);

  // ── تحميل أوّلي من السحابة عند فتح التطبيق: لو فيه بيانات مشتركة محفوظة، تحل محل النسخة المحلية فوراً ──
  useEffect(()=>{ (async()=>{
    if(cloudCfg()){
      try{
        const remote = await cloudLoadState();
        if(remote){
          if(remote.doctors) _setDoctors(remote.doctors);
          if(remote.leaves) _setLeaves(remote.leaves);
          if(remote.nightData) _setNight(remote.nightData);
          if(remote.coverages) _setCoverages(remote.coverages);
          if(remote.settings) setSettings(remote.settings);
          if(remote.holidays){ setHolidays(remote.holidays); HOLIDAYS=buildHolidayMap(remote.holidays); }
          if(remote.audit) setAudit(remote.audit);
          if(remote.users && remote.users.length) setUsers(remote.users);
          if(remote.official) setOfficial(remote.official);
          setCloudSyncState("synced");
        }
      }catch(e){ setCloudSyncState("error"); }
    }
    setCloudReady(true);
  })(); },[]);

  // ── حفظ تلقائي مؤجَّل (debounce) للسحابة عند أي تغيير في البيانات المشتركة — بعد اكتمال التحميل الأوّلي فقط، لمنع الكتابة فوق بيانات الأجهزة الأخرى بنسخة محلية قديمة ──
  const cloudSaveTimer = React.useRef(null);
  useEffect(()=>{
    if(!cloudReady || !cloudCfg()) return;
    setCloudSyncState("syncing");
    if(cloudSaveTimer.current) clearTimeout(cloudSaveTimer.current);
    cloudSaveTimer.current = setTimeout(()=>{
      cloudSaveState({ doctors, leaves, nightData, coverages, settings, holidays, audit, users, official })
        .then(ok=>setCloudSyncState(ok?"synced":"error"))
        .catch(()=>setCloudSyncState("error"));
    }, 1500);
    return ()=>{ if(cloudSaveTimer.current) clearTimeout(cloudSaveTimer.current); };
  },[cloudReady, doctors, leaves, nightData, coverages, settings, holidays, audit, users, official]);

  const cloudSyncNow = async () => {
    if(!cloudCfg()){ showToast("فعّل الرابط الحي من الإعدادات أولاً لتفعيل المزامنة","warn"); return; }
    setCloudSyncState("syncing"); showToast("جارٍ التحديث من السحابة…");
    try{
      const remote = await cloudLoadState();
      if(remote){
        if(remote.doctors) _setDoctors(remote.doctors);
        if(remote.leaves) _setLeaves(remote.leaves);
        if(remote.nightData) _setNight(remote.nightData);
        if(remote.coverages) _setCoverages(remote.coverages);
        if(remote.settings) setSettings(remote.settings);
        if(remote.holidays){ setHolidays(remote.holidays); HOLIDAYS=buildHolidayMap(remote.holidays); }
        if(remote.audit) setAudit(remote.audit);
        if(remote.users && remote.users.length) setUsers(remote.users);
        if(remote.official) setOfficial(remote.official);
        setCloudSyncState("synced"); showToast("✓ تم التحديث بأحدث بيانات من كل الأجهزة");
      } else { showToast("لا توجد بيانات سحابية محفوظة بعد — سيُنشأ أول نسخة عند أي تعديل","warn"); }
    }catch(e){ setCloudSyncState("error"); showToast("تعذّر التحديث من السحابة","err"); }
  };
  const today = new Date().toISOString().split("T")[0];
  const fd = id => doctors.find(d=>d.id===id);
  const showToast = (msg,kind="ok") => { setToast({msg,kind}); setTimeout(()=>setToast(null), kind==="err"?6000:2200); };
  const currentUser = users.find(u=>u.id===(session&&session.userId)) || null;
  const role = currentUser && currentUser.role;
  const logout = () => { setSession(null); setPage("dashboard"); };
  const logAudit = (action,status) => setAudit(a=>[{ id:uid(), at:Date.now(), action, status:status||"مسودة", by:(currentUser&&currentUser.username)||"—" },...a].slice(0,500));

  // ──────── طبقة الاعتماد (مسودة → اعتماد / تراجع) ────────
  const snap = () => ({ doctors, leaves, nightData, coverages, settings });
  const off = official || snap();
  useEffect(()=>{ if(!official) setOfficial(snap()); }, []);
  const pending = JSON.stringify(snap()) !== JSON.stringify(off);
  const canApprove = role==="head" || role==="deputy";
  const computeDiff = () => { const a=snap(); const cnt=(o,k)=>(o[k]||[]).length; const eve=o=>Object.values(o.nightData||{}).reduce((x,d)=>x+((d.doctors||[]).length),0); const diff=[];
    if(cnt(off,"doctors")!==cnt(a,"doctors")) diff.push(`الأطباء ${cnt(off,"doctors")}→${cnt(a,"doctors")}`);
    if(cnt(off,"leaves")!==cnt(a,"leaves")) diff.push(`الإجازات ${cnt(off,"leaves")}→${cnt(a,"leaves")}`);
    if(cnt(off,"coverages")!==cnt(a,"coverages")) diff.push(`التغطيات ${cnt(off,"coverages")}→${cnt(a,"coverages")}`);
    if(eve(off)!==eve(a)) diff.push(`مناوبات مسائية ${eve(off)}→${eve(a)}`);
    if(JSON.stringify(off.settings)!==JSON.stringify(a.settings)) diff.push("تعديل الإعدادات");
    return diff; };
  const diffList = pending ? computeDiff() : [];
  const approve = () => { const diff=computeDiff(); logAudit(`اعتماد رسمي${diff.length?(" — "+diff.join("، ")):""}`,"معتمدة"); const a=snap(); setOfficial(a);
    if(cloudCfg()){ showToast("✓ تم الاعتماد — جارٍ النشر للرابط الحي…"); cloudPublish(a).then(()=>{ S.set("v2_published_at", new Date().toISOString()); showToast("✓ نُشر للرابط الحي — الرابط محدَّث للجميع"); }).catch(()=>showToast("الاعتماد تم، لكن تعذّر النشر للرابط — تحقّق من إعدادات Firebase","warn")); }
    else showToast("✓ تم الاعتماد وتحديث الإحصائيات"); };
  const publishNow = () => { if(!cloudCfg()){ showToast("فعّل الرابط الحي من الإعدادات أولاً","warn"); setPage("settings"); return; } const a=snap(); showToast("جارٍ النشر…"); cloudPublish(a).then(()=>{ S.set("v2_published_at", new Date().toISOString()); showToast("✓ نُشر — الرابط الحي يعكس الحالة الحالية"); }).catch(e=>showToast("تعذّر النشر — تحقق من الإعدادات","err")); };
  const revert = () => { setDoctors(off.doctors); setLeaves(off.leaves); setNight(off.nightData); setCoverages(off.coverages); setSettings(off.settings||{}); logAudit("تراجع عن التغييرات غير المعتمدة","ملغاة"); showToast("تم التراجع لآخر نسخة معتمدة"); };
  const saveDraft = () => { logAudit("حفظ كمسودة (بانتظار الاعتماد)","مسودة"); showToast("حُفظت كمسودة"); };

  const TABS = [["dashboard","الرئيسية","◧"],["engine","الدوام والتغطيات","🌙"],["leaves","الإجازات","🏖"],["doctors","الأطباء","👨‍⚕️"],["stats","الإحصائيات","📈"],["reports","التقارير","📊"],["alerts","التنبيهات","🔔"],["audit","سجل النشاط","📜"],["settings","الإعدادات","⚙️"], ...(role==="head"?[["users","المستخدمون","👥"]]:[])];
  const cur = TABS.find(t=>t[0]===page);
  const subt = { dashboard:"نظرة عامة وتنبيهات", engine:"المحرك — حلول · مسائي · تغطيات", leaves:"تسجيل الإجازات وأثرها", doctors:"بيانات الأطباء وجداولهم", stats:"العبء الوظيفي", fairness:"ترتيب الأطباء حسب المساهمة", reports:"تقارير شهرية قابلة للطباعة", alerts:"تعارضات وحدود وإجازات", audit:"توثيق العمليات", settings:"الحدود والقواعد", users:"حسابات المستخدمين والصلاحيات" };
  const pageEl = <>
      {page==="dashboard" && <Dashboard doctors={off.doctors} leaves={off.leaves} nightData={off.nightData} coverages={off.coverages} today={today} fd={fd} onGoto={setPage} settings={settings} />}
      {page==="engine" && <EnginePage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setNight={setNight} setCoverages={setCoverages} showToast={showToast} logAudit={logAudit} settings={settings} holidays={holidays} />}
      {page==="leaves" && <LeavesPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setLeaves={setLeaves} setCoverages={setCoverages} setNight={setNight} showToast={showToast} logAudit={logAudit} />}
      {page==="doctors" && <DoctorsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setDoctors={setDoctors} showToast={showToast} logAudit={logAudit} />}
      {page==="stats" && <StatsPage doctors={off.doctors} leaves={off.leaves} nightData={off.nightData} coverages={off.coverages} today={today} fd={fd} />}
      {page==="fairness" && <FairnessPage doctors={off.doctors} leaves={off.leaves} nightData={off.nightData} coverages={off.coverages} today={today} />}
      {page==="reports" && <ReportsPage doctors={off.doctors} leaves={off.leaves} nightData={off.nightData} coverages={off.coverages} today={today} fd={fd} settings={settings} />}
      {page==="alerts" && <AlertsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} settings={settings} onGoto={setPage} />}
      {page==="audit" && <AuditPage audit={audit} />}
      {page==="settings" && <SettingsPage settings={settings} setSettings={setSettings} showToast={showToast} holidays={holidays} setHolidays={setHolidays} doctors={doctors} publishNow={publishNow} />}
      {page==="users" && role==="head" && <UsersPage users={users} setUsers={setUsers} doctors={doctors} currentUser={currentUser} showToast={showToast} />}
  </>;

  // ---- Auth gating ----
  // ── انتظار تحميل السحابة أولاً (لو كانت مفعّلة) قبل عرض أي بيانات، لتفادي ظهور نسخة محلية قديمة ثم استبدالها فجأة ──
  if(cloudCfg() && !cloudReady){
    return <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:14, background:"var(--bg)" }}>
      <div style={{ width:52, height:52, borderRadius:16, background:`linear-gradient(135deg,${C.primary},${C.accent})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, color:"#fff", fontWeight:800, animation:"fade 1.2s ease-in-out infinite alternate" }}>ط</div>
      <div style={{ fontSize:13.5, color:C.sub, fontWeight:600 }}>جارٍ تحميل أحدث بيانات القسم…</div>
    </div>;
  }
  if(!currentUser) return <LoginScreen users={users} onLogin={u=>{ setSession({userId:u.id}); setPage("dashboard"); }} />;
  if(role==="doctor"){ const myDoc=doctors.find(d=>d.id===currentUser.doctorId); return (
    <div style={{ minHeight:"100vh", background:"var(--bg)" }}>
      <header className="topbar" style={{ paddingInline:18 }}>
        <div className="brand" style={{ padding:0, gap:10 }}>
          <div className="logo" style={{ width:38, height:38 }}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
          <div><div style={{ fontWeight:700, fontSize:15, color:"var(--ink)" }}>حسابي</div><div style={{ fontSize:11, color:C.muted }}>جدولك · تغطياتك · إحصائياتك</div></div>
        </div>
        <div style={{ marginInlineStart:"auto", display:"flex", alignItems:"center", gap:10 }}>
          <button className="icobtn" onClick={doUndo} title={undoN?`تراجع عن آخر إجراء (${undoN})`:"لا إجراءات للتراجع"} style={{ position:"relative", opacity:undoN?1:.45 }}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
            {undoN>0 && <span style={{ position:"absolute", top:-5, insetInlineEnd:-5, background:C.err, color:"#fff", fontSize:10, fontWeight:800, borderRadius:20, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px" }}>{undoN}</span>}
          </button>
        <div className="tog" onClick={toggleDark} title="الوضع الليلي/النهاري"><div className="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></div></div>
          <button className="icobtn" onClick={logout} title="تسجيل الخروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </header>
      <div className="content" style={{ maxWidth:880, margin:"0 auto" }}>{ myDoc ? <DoctorPortal doctor={myDoc} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} /> : <Empty icon="⚠️" title="لا يوجد طبيب مرتبط بحسابك" hint="تواصل مع رئيس القسم" /> }</div>
      <Toast toast={toast} />
    </div>
  ); }

  const tInfo = analyzeDay(today, doctors, leaves, nightData, coverages, null, settings?.restRule!==false);
  const tabMap = Object.fromEntries(TABS.map(t=>[t[0],t]));
  const GRP1=["dashboard","engine","leaves","doctors","stats"], GRP2=["reports","alerts","audit","settings","users"];
  const renderLink = id => { const t=tabMap[id]; if(!t) return null; const badge = id==="leaves"&&leaves.length ? leaves.length : (id==="engine"&&tInfo.gaps.length ? tInfo.gaps.length : 0); return <button key={id} className={"navlink"+(page===id?" active":"")} onClick={()=>{ setPage(id); setSbOpen(false); }} title={t[1]}><Ico n={id}/><span className="nav-label">{t[1]}</span>{badge?<span className="badge">{badge}</span>:null}</button>; };
  return <div className="shell">
    <aside className={"sidebar"+(collapsed?" collapsed":"")+(sbOpen?" open":"")}>
      <div className="brand">
        <div className="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
        <div className="brand-text"><div style={{ fontWeight:700, fontSize:15, color:C.text }}>الجداول الطبية</div><div style={{ fontSize:11, color:C.muted }}>إدارة الدوام والتغطيات</div></div>
      </div>
      <div className="navlbl">عام</div>
      {GRP1.map(renderLink)}
      <div className="navlbl">التحليلات</div>
      {GRP2.map(renderLink)}
      <div className="side-foot">
        <div className="uchip"><div className="av">{(currentUser.username||"؟").slice(0,2)}</div><div className="utxt"><div className="nm">{currentUser.username}</div><div className="rl">{ROLE_AR[role]}</div></div></div>
        <button onClick={logout} title="تسجيل الخروج" style={{ ...sGhost, width:"100%", padding:"9px 10px", fontSize:12.5, marginTop:8, display:"flex", alignItems:"center", justifyContent:"center", gap:8, color:C.err, borderColor:"#fecaca" }}>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          {!collapsed && <span>تسجيل الخروج</span>}
        </button>
      </div>
    </aside>
    <div className="main">
      <div className="topbar">
        <button className="icobtn menubtn" onClick={()=>setSbOpen(true)} title="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <button className="icobtn" onClick={()=>setCollapsed(c=>!c)} title="تصغير القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 4v16M4 8l-3 4 3 4"/></svg></button>
        <div style={{ flex:1, minWidth:0, display:"flex", alignItems:"center", gap:9 }}>
          <div style={{ minWidth:0 }}>
            <h1 style={{ margin:0, fontSize:17, fontWeight:700, color:"var(--ink)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{cur?cur[1]:""}</h1>
            <p style={{ margin:"1px 0 0", fontSize:12, color:C.muted, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{subt[page]}</p>
          </div>
          {pending && <button onClick={()=>window.scrollTo({top:0,behavior:"smooth"})} title="لديك تغييرات غير معتمدة — اضغط للانتقال للأعلى" style={{ display:"inline-flex", alignItems:"center", gap:5, background:"var(--warnSoft)", border:`1px solid ${C.warn}`, color:C.warn, borderRadius:20, padding:"4px 10px", fontSize:11, fontWeight:800, cursor:"pointer", flexShrink:0, fontFamily:"inherit" }}>
            <span style={{ width:7, height:7, borderRadius:"50%", background:C.warn, display:"inline-block" }} />غير معتمد
          </button>}
          {(()=>{ if(!cloudCfg()) return null; const m={ idle:{c:C.muted,t:"☁️ متصل"}, syncing:{c:C.primary,t:"🔄 جارٍ المزامنة…"}, synced:{c:C.ok,t:"☁️ متزامن"}, error:{c:C.err,t:"⚠️ تعذّرت المزامنة"}, off:{c:C.muted,t:"☁️ متصل"} }[cloudSyncState]; return (
            <button onClick={cloudSyncNow} title="اضغط لتحديث فوري من السحابة (أي تعديل من جهاز آخر)" style={{ display:"inline-flex", alignItems:"center", gap:5, background:"var(--surface2)", border:`1px solid ${C.line}`, color:m.c, borderRadius:20, padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer", flexShrink:0, fontFamily:"inherit" }}>{m.t}</button>
          ); })()}
        </div>
        <div className="qstats">
          <span className="qchip"><i className="dot" style={{ background:C.ok }}></i>تغطيات <b>{coverages.length}</b></span>
          <span className="qchip"><i className="dot" style={{ background:C.warn }}></i>إجازات <b>{leaves.length}</b></span>
          <span className="qchip"><i className="dot" style={{ background:C.err }}></i>شاغر اليوم <b>{tInfo.gaps.length}</b></span>
        </div>
        <div className="tog" onClick={toggleDark} title="الوضع الليلي/النهاري"><div className="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></div></div>
        <button className="icobtn" onClick={doUndo} title={undoN?`تراجع عن آخر إجراء (${undoN})`:"لا إجراءات للتراجع"} style={{ position:"relative", opacity:undoN?1:.45, color:undoN?C.err:C.muted, borderColor:undoN?"#fecaca":C.line }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
          {undoN>0 && <span style={{ position:"absolute", top:-5, insetInlineEnd:-5, background:C.err, color:"#fff", fontSize:10, fontWeight:800, borderRadius:20, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px" }}>{undoN}</span>}
        </button>
        <button className="icobtn bell" title="التنبيهات" onClick={()=>setPage("alerts")}><span className="n"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button className="icobtn" onClick={logout} title="تسجيل الخروج" style={{ color:C.err, borderColor:"#fecaca" }}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
      <div className="content">
        {pending && <div style={{ background:"var(--warnSoft)", border:`1px solid ${C.warn}`, borderRadius:14, padding:"12px 14px", marginBottom:14, boxShadow:"0 8px 22px rgba(224,152,43,.18)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom: diffList.length?9:0 }}>
            <span style={{ fontSize:13, fontWeight:800, color:C.warn }}>🟡 تغييرات غير معتمدة</span>
            <span style={{ fontSize:11.5, color:C.sub }}>الإحصائيات تعرض آخر نسخة معتمدة حتى الاعتماد</span>
            <div style={{ display:"flex", gap:8, marginInlineStart:"auto", flexWrap:"wrap" }}>
              <button onClick={()=>{ if(confirm("تراجع عن كل التغييرات غير المعتمدة؟")) revert(); }} style={{ ...sGhost, color:C.err, borderColor:"#fecaca", padding:"8px 14px", fontSize:12.5 }}>↩︎ تراجع</button>
              {canApprove
                ? <button onClick={approve} style={{ ...sBtn(C.primary), padding:"8px 22px", fontSize:13 }}>✓ اعتماد رسمي{cloudCfg()?" + نشر":""}</button>
                : <span style={{ fontSize:12, color:C.warn, fontWeight:700, alignSelf:"center" }}>بانتظار اعتماد رئيس القسم</span>}
            </div>
          </div>
          {diffList.length>0 && <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            {diffList.map((t,i)=><span key={i} style={{ fontSize:11, fontWeight:700, color:C.warn, background:"var(--surface)", border:`1px solid ${C.warn}55`, borderRadius:20, padding:"3px 10px" }}>{t}</span>)}
          </div>}
        </div>}
        {pageEl}
      </div>
    </div>
    <div className={"scrim2"+(sbOpen?" show":"")} onClick={()=>setSbOpen(false)} />
    <Toast toast={toast} />
  </div>;
}

const container = document.getElementById("root");
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
