              </div>
            ); })}
          </div>
          <div style={{ fontSize:11, color:C.muted, marginTop:8, textAlign:"center" }}>اضغط أي يوم للتعديل</div>
        </div>
      ) : listDays.length===0 ? <Empty icon="🌙" title="لا أيام مطابقة" hint="استخدم «توزيع تلقائي» أو «إضافة يوم» من الأدوات" /> :
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {listDays.map(({date,di})=>{
            const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
            const open=sel===date; const nDi=dayIdx(nextWork(date)); const cv=nd.coverages||{};
            return <div key={date} style={{ border:`1px solid ${open?C.accent:C.line}`, borderRadius:12, overflow:"hidden" }}>
              <div onClick={()=>setSel(open?null:date)} style={{ padding:"11px 13px", cursor:"pointer", background: open?"#f0fdfa":"#fff" }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ minWidth:42, textAlign:"center" }}><div style={{ fontSize:16, fontWeight:800, color:C.primary }}>{date.split("-")[2]}</div><div style={{ fontSize:9.5, color:C.muted }}>{DAYS[di]}</div></div>
                  <div style={{ flex:1, display:"flex", flexWrap:"wrap", gap:5 }}>
                    {docs.length?docs.map(d=><span key={d.id} style={{ display:"inline-flex", alignItems:"center", gap:5, background:d.color+"14", color:d.color, border:`1px solid ${d.color}30`, borderRadius:20, padding:"3px 11px 3px 4px", fontSize:12.5, fontWeight:700 }}><Avatar doc={d} size={20}/>د.{d.name}</span>):<span style={{ fontSize:12.5, color:C.muted }}>— لا دوام مسائي</span>}
                  </div>
                  <span style={{ color:C.muted, fontSize:12 }}>{open?"▲":"▼"}</span>
                </div>
                {covLines(date).length>0 && <div style={{ marginTop:8, paddingTop:8, borderTop:`1px dashed ${C.line2}`, display:"flex", flexDirection:"column", gap:4 }}>
                  {covLines(date).map((t,i)=><div key={i} style={{ fontSize:12, color:C.primaryD, fontWeight:600 }}>🔄 {t}</div>)}
                </div>}
              </div>
              {open && <div style={{ padding:"4px 13px 13px", borderTop:`1px solid ${C.line2}` }}>
                <div style={label}>الطبيب المسائي</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
                  {doctors.map(d=>{ const on=(nd.doctors||[]).includes(d.id); const lv=onLeave(d,date,leaves); return (
                    <button key={d.id} onClick={()=>toggleEvening(date,d.id)} disabled={lv&&!on} style={{ border:`1px solid ${on?d.color:C.line}`, background:on?d.color:"#fff", color:on?"#fff":(lv?C.muted:C.text), borderRadius:18, padding:"5px 12px", fontSize:12, fontWeight:600, opacity:lv&&!on?.5:1 }}>د.{d.name}{lv?" (إجازة)":""}</button>
                  ); })}
                </div>
                {docs.map(d=>{ const needs=[]; if(isClinic(getSlot(d,di,"am")))needs.push(["am","صباح",di]); if(isClinic(getSlot(d,di,"pm")))needs.push(["pm","ظهر",di]); if(isClinic(getSlot(d,nDi,"am")))needs.push(["nextAm","صباح الغد",nDi]);
                  if(clinicClosedOnLeave(d,date,leaves)||!needs.length) return null;
                  return <div key={d.id} style={{ background:"#f8fafc", borderRadius:10, padding:"9px 11px", marginBottom:6 }}>
                    <div style={{ fontSize:11.5, color:C.sub, marginBottom:6 }}>تغطية عيادة د.{d.name}</div>
                    {needs.map(([slot,lbl,sdi])=>{ const isNext=slot==="nextAm"; const cur=isNext?((cv[slot]||[])[0]):ownerCover(date,d.id,slot); const pl=pickList(d.id, sdi, isNext?nextWork(date):date, isNext?"am":slot); return (
                      <div key={slot} style={{ marginBottom:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:5 }}>
                          <span style={{ fontSize:11, color:C.muted, minWidth:64 }}>{lbl}</span>
                          {cur && <span style={{ fontSize:11.5, color:C.primaryD, fontWeight:700 }}>✓ د.{fd(cur)?.name}</span>}
                          {cur && <button onClick={()=>isNext?clearCov(date,slot):clearOwnerCover(date,d.id,slot)} style={{ ...sGhost, color:C.err, padding:"2px 8px", fontSize:11 }}>إزالة</button>}
                        </div>
                        <CoverPicker list={pl} cur={cur} onPick={cid=>isNext?setCov(date,slot,cid):setOwnerCover(date,d.id,slot,cid)} />
                      </div>
                    ); })}
                  </div>;
                })}
                {coverages.filter(c=>c.date===date).length>0 && <div style={{ marginTop:6 }}>
                  {coverages.filter(c=>c.date===date).map(c=>{ const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; return cd&&(
                    <div key={c.id} style={{ display:"flex", alignItems:"center", gap:7, fontSize:12, background:"#f0fdfa", borderRadius:8, padding:"5px 9px", marginBottom:4 }}>
                      <span style={{ color:C.primary, fontWeight:700 }}>🔄 د.{cd.name} يغطّي عيادة{ad?` د.${ad.name}`:""} {perAr(c.period)}</span>
                      <span style={{ flex:1 }}/><button onClick={()=>removeCovIndiv(c.id)} style={{ ...sGhost, color:C.err, padding:"3px 9px" }}>حذف</button>
                    </div>
                  ); })}
                </div>}
                <button onClick={()=>{ setSel(null); showToast("تم حفظ اليوم"); }} style={{ ...sBtn(C.primary), width:"100%", marginTop:8 }}>💾 حفظ اليوم</button>
              </div>}
            </div>;
          })}
        </div>}
    </div>

    {/* Section 3: individual coverage */}
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🔄 تغطية فردية / بديلة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الغائب (اختياري)</label><select value={cf.absentId} onChange={e=>setCf({...cf,absentId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>الفترة</label><select value={cf.period} onChange={e=>setCf({...cf,period:e.target.value})} style={sIn}><option value="am">صباح</option><option value="pm">ظهر</option><option value="evening">مسائي</option></select></div>
        <div><label style={label}>التاريخ</label><input type="date" value={cf.date} onChange={e=>setCf({...cf,date:e.target.value})} style={sIn} /></div>
        <div><label style={label}>المغطّي</label><select value={cf.coverId} onChange={e=>setCf({...cf,coverId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
      </div>
      <button onClick={submitCov} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة تغطية</button>
    </div>
  </div>;
}

// ════════════════════════════════ LEAVES ════════════════════════════════
function LeavesPage({ doctors, leaves, nightData, coverages, today, fd, setLeaves, setCoverages, showToast, logAudit }) {
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };
  const [f, setF] = useState({ doctorId:"", type:"annual", start:"", end:"", clinicClosed:true });
  const add = () => { if(!f.doctorId||!f.start||!f.end){showToast("أكمل الحقول","warn");return;} if(f.end<f.start){showToast("التواريخ غير صحيحة","err");return;} setLeaves(ls=>[...ls,{id:uid(),doctorId:+f.doctorId,type:f.type,start:f.start,end:f.end,clinicClosed:f.clinicClosed}]); setF({doctorId:"",type:"annual",start:"",end:"",clinicClosed:true}); logAudit&&logAudit(`تسجيل إجازة د.${fd(+f.doctorId)?.name||""} (${f.type})`); showToast("تم تسجيل الإجازة"); };
  const del = id => setLeaves(ls=>ls.filter(l=>l.id!==id));
  const autoCoverLeave = l => { const d=fd(l.doctorId); if(!d) return; const md=monthDays(+l.start.split("-")[0],+l.start.split("-")[1]-1).map(x=>x.date); const load=id=>doctorSessions(doctors.find(x=>x.id===id),md,nightData,coverages,leaves).direct; const adds=[]; const used={}; const s=new Date(l.start),e=new Date(l.end); for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4) continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; ["am","pm"].forEach(p=>{ if(!isClinic(getSlot(d,wi,p))) return; if(coverages.some(c=>c.date===ds&&c.period===p&&c.absentId===d.id)) return; const av=getAvailable(doctors,[d.id],wi,ds,p,leaves,nightData,{},coverages).filter(a=>a.status!=="leave").map(a=>({a,L:load(a.doc.id)})).sort((x,y)=>(x.a.status==="free"?0:1)-(y.a.status==="free"?0:1)||x.L-y.L); const key=ds+"|"+p; const taken=used[key]||[]; const pick=av.find(x=>!taken.includes(x.a.doc.id)); if(pick){ adds.push({id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:pick.a.doc.id,reason:"leave"}); (used[key]=used[key]||[]).push(pick.a.doc.id); } }); } if(!adds.length){ showToast("لا عيادات مكشوفة أو لا متاح","warn"); return; } setCoverages(cs=>[...cs,...adds]); showToast(`تمت تغطية ${adds.length} عيادة بالأنسب`); };
  const sorted = leaves.slice().sort((a,b)=>b.start.localeCompare(a.start));

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🏖 تسجيل إجازة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الطبيب</label><select value={f.doctorId} onChange={e=>setF({...f,doctorId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>النوع</label><select value={f.type} onChange={e=>setF({...f,type:e.target.value})} style={sIn}>{Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={label}>من</label><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value})} style={sIn} /></div>
        <div><label style={label}>إلى</label><input type="date" value={f.end} onChange={e=>setF({...f,end:e.target.value})} style={sIn} /></div>
      </div>
      <label style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, fontSize:13, color:C.sub, cursor:"pointer" }}>
        <input type="checkbox" checked={f.clinicClosed} onChange={e=>setF({...f,clinicClosed:e.target.checked})} /> العيادة مغلقة خلال الإجازة (لا تحتاج تغطية)
      </label>
      <button onClick={add} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة</button>
    </div>

    {sorted.length===0 ? <Empty icon="🏖" title="لا إجازات مسجّلة" /> :
      <div className="grid-cards">{sorted.map(l=>{ const d=fd(l.doctorId); if(!d) return null;
        // impact
        const clinics=[],carried=[],evening=[];
        const s=new Date(l.start),e=new Date(l.end);
        for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4)continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; const nd=nightData[ds]||{}; const cds=nd.coverages||{};
          ["am","pm"].forEach(p=>{ if(isClinic(getSlot(d,wi,p))){ const ex=coverages.find(c=>c.date===ds&&c.period===p&&c.absentId===d.id); clinics.push({ds,p,cov:ex?ex.coverDoctorId:null}); } });
          if((nd.doctors||[]).includes(d.id)) evening.push(ds);
          ["am","pm","nextAm"].forEach(sl=>{ if((cds[sl]||[]).includes(d.id)) carried.push({ds,p:sl}); });
          coverages.forEach(cv=>{ if(cv.date===ds&&cv.coverDoctorId===d.id) carried.push({ds,p:cv.period}); });
        }
        const uncovered = l.clinicClosed!==false?0:clinics.filter(c=>!c.cov).length;
        return <div key={l.id} style={{ ...card(), padding:14 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
            <Avatar doc={d} size={34}/>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>{d.name}</div>
              <div style={{ fontSize:11.5, color:C.sub }}>{TYPES[l.type]} · {dmy(l.start)} ← {dmy(l.end)}</div>
            </div>
            <Kebab items={[
              (l.clinicClosed===false) && { icon:"⚡", label:"تغطية تلقائية", onClick:()=>autoCoverLeave(l) },
              { icon:"🗑", label:"حذف الإجازة", danger:true, onClick:()=>{ if(confirm("حذف هذه الإجازة؟")) del(l.id); } },
            ]} />
          </div>
          {/* weekly schedule */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:10 }}>
            {[0,1,2,3,4].map(di=><div key={di} style={{ border:`1px solid ${C.line2}`, borderRadius:8, overflow:"hidden", textAlign:"center" }}>
              <div style={{ background:"#f8fafc", fontSize:9, fontWeight:700, color:C.sub, padding:"3px 0" }}>{DAYS[di]}</div>
              {["am","pm"].map(p=>{ const sl=getSlot(d,di,p); const dir=DIRECT_SLOTS.includes(sl); return <div key={p} style={{ fontSize:9, padding:"4px 1px", color:dir?C.primary:C.muted, background:dir?"#f0fdfa":"#fff", fontWeight:dir?700:400 }}>{SLOT_AR[sl]||"—"}</div>; })}
            </div>)}
          </div>
          {/* impact */}
          <div style={{ background:"#f8fbfc", borderRadius:10, padding:"9px 11px" }}>
            <div style={{ fontSize:11.5, fontWeight:700, color:C.text, marginBottom:5 }}>🏥 عياداته خلال الإجازة ({clinics.length}){uncovered>0&&<span style={{ color:C.err }}> · مكشوف {uncovered}</span>}</div>
            {uncovered>0 && <button onClick={()=>autoCoverLeave(l)} style={{ ...sBtn(C.primary), padding:"7px 13px", fontSize:12, marginBottom:7 }}>⚡ تغطية عيادات الإجازة بالأنسب</button>}
            {clinics.length===0?<div style={{ fontSize:11, color:C.muted }}>لا عيادات</div>:clinics.map((c,i)=><div key={i} style={{ fontSize:11, color:C.sub, padding:"1px 0" }}>• {dmy(c.ds)} {perAr(c.p)} — {c.cov?<span style={{ color:C.ok }}>✓ {fd(c.cov)?.name}</span>:(l.clinicClosed!==false?<span style={{ color:C.ok }}>مغلقة</span>:<span style={{ color:C.err }}>مكشوفة</span>)}</div>)}
            {carried.length>0&&<div style={{ fontSize:11, color:C.warn, marginTop:6 }}>🔄 تغطياته لزملاء: {carried.length} — تحتاج إعادة تعيين</div>}
            {evening.length>0&&<div style={{ fontSize:11, color:"#7c3aed", marginTop:3 }}>🌙 دوامه المسائي: {evening.length} — يحتاج بديلاً</div>}
          </div>
        </div>;
      })}</div>}
  </div>;
}

// ════════════════════════════════ DOCTORS ════════════════════════════════
function DoctorsPage({ doctors, leaves, today, fd, setDoctors, showToast, logAudit }) {
  const [open, setOpen] = useState(null);
  const [newName, setNewName] = useState("");
  const addDoc = () => { if(!newName.trim()){showToast("أدخل الاسم","warn");return;} const id=uid(); setDoctors(ds=>[...ds,{ id, name:newName.trim(), color:PALETTE[ds.length%PALETTE.length], nightDays:[], blockedDays:[], rank:"specialist", adminPosition:"none", sched:{0:{am:"",pm:""},1:{am:"",pm:""},2:{am:"",pm:""},3:{am:"",pm:""},4:{am:"",pm:""}} }]); setNewName(""); setOpen(id); logAudit&&logAudit(`إضافة طبيب: ${newName.trim()}`); };

  const setSlot = (id,di,p,v) => setDoctors(ds=>ds.map(d=>{ if(d.id!==id)return d; const sched={...d.sched}; sched[di]={...sched[di],[p]:v}; return {...d,sched}; }));
  const del = id => { const dn=fd(id)?.name||""; setDoctors(ds=>ds.filter(d=>d.id!==id)); logAudit&&logAudit(`حذف طبيب: د.${dn}`); };

      <button onClick={addDoc} style={sBtn(C.primary)}>إضافة</button>
    </div>

            <Avatar doc={d} size={34}/>

            <Kebab items={[
              { icon:"✏️", label:isOpen?"إغلاق التعديل":"تعديل", onClick:()=>setOpen(isOpen?null:d.id) },
              { icon:"🗑", label:"حذف الطبيب", danger:true, onClick:()=>{ if(confirm(`حذف د.${d.name}؟`)) del(d.id); } },

            <span style={{ color:C.muted }}>{isOpen?"▲":"▼"}</span>

              <div><label style={label}>المنصب الإداري</label><select value={d.adminPosition||"none"} onChange={e=>upd(d.id,{adminPosition:e.target.value})} style={sIn}>{Object.entries(POS_LABEL).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
              <div><label style={label}>اللون</label><div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>{PALETTE.map(c=><button key={c} onClick={()=>upd(d.id,{color:c})} style={{ width:22, height:22, borderRadius:"50%", background:c, border:d.color===c?"2px solid #1e293b":"2px solid #fff" }} />)}</div></div>
            </div>
            <label style={label}>الأيام المسائية الثابتة</label>
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:12 }}>
              {[0,1,2,3,4].map(di=>{ const on=(d.nightDays||[]).includes(di); return <button key={di} onClick={()=>upd(d.id,{nightDays:on?(d.nightDays||[]).filter(x=>x!==di):[...(d.nightDays||[]),di]})} style={{ border:`1px solid ${on?C.primary:C.line}`, background:on?C.primary:"#fff", color:on?"#fff":C.text, borderRadius:16, padding:"5px 12px", fontSize:12 }}>{DAYS[di]}</button>; })}
            </div>
            <label style={label}>جدول العيادات الأسبوعي (صباح / مساء)</label>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:6, marginBottom:8 }}>
              {[0,1,2,3,4].map(di=><div key={di}>
                <div style={{ fontSize:10.5, fontWeight:700, color:C.sub, textAlign:"center", marginBottom:4 }}>{DAYS[di]}</div>
                {[["am","ص"],["pm","م"]].map(([p,pl])=>{ const v=getSlot(d,di,p); const st=slotStyle(v); return (

// ════════════════════════════════ STATS ════════════════════════════════
function StatsPage({ doctors, leaves, nightData, coverages, today, fd }) {
  const [mode,setMode] = useState("week");
  const [anchor,setAnchor] = useState(today);
  const [sel,setSel] = useState(null);
  const [full,setFull] = useState(false);
  const period = (()=>{ if(mode==="week"){ const t=new Date(anchor); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const dates=[]; for(let i=0;i<5;i++){ const d=new Date(sun); d.setDate(sun.getDate()+i); dates.push(d.toISOString().split("T")[0]); } return { dates, label:`أسبوع ${dmy(dates[0])} ← ${dmy(dates[4])}`, weeks:1 }; } const [y,m]=anchor.split("-"); const dates=monthDays(+y,+m-1).map(x=>x.date); return { dates, label:`${MONTHS[+m-1]} ${y}`, weeks:Math.max(1,Math.round(dates.length/5)) }; })();
  const md = period.dates;
  const overview = doctors.map(d=>{ const sess=doctorSessions(d, md, nightData, coverages, leaves); return { d, sess, target: directTarget(d)*period.weeks }; }).sort((a,b)=>b.sess.care-a.sess.care);
  const worked = overview.filter(o=>o.sess.attended>0||o.sess.covers>0).length;
  const absentCov = overview.reduce((a,o)=>a+o.sess.absentCovered,0);
  const totalCov = overview.reduce((a,o)=>a+o.sess.covers,0);
  const totalEve = overview.reduce((a,o)=>a+o.sess.evening,0);
  const shiftAnchor = n => { const d=new Date(anchor); if(mode==="week") d.setDate(d.getDate()+7*n); else d.setMonth(d.getMonth()+n); setAnchor(d.toISOString().split("T")[0]); };

    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>📈 العبء الوظيفي</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["week","أسبوعي"],["month","شهري"]].map(([k,l])=><button key={k} onClick={()=>setMode(k)} style={{ padding:"7px 16px", border:"none", fontSize:12.5, fontWeight:700, background:mode===k?C.primary:"#fff", color:mode===k?"#fff":C.sub }}>{l}</button>)}
        </div>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <button onClick={()=>shiftAnchor(-1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>‹</button>
        <div style={{ flex:1, textAlign:"center", fontWeight:700, fontSize:13.5, minWidth:140 }}>{period.label}</div>
        <button onClick={()=>shiftAnchor(1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>›</button>
        <input type="date" value={anchor} onChange={e=>e.target.value&&setAnchor(e.target.value)} style={{ ...sIn, width:"auto", padding:"6px 9px" }} />
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
        {[["أطباء عملوا بعيادة",worked,C.primary],["غياب مغطّى",absentCov,C.warn],["تغطيات منفّذة",totalCov,"#0e7490"],["مناوبات مسائية",totalEve,"#7c3aed"]].map(([l,v,col])=>(
          <div key={l} style={{ flex:"1 1 110px", background:"#f8fafc", borderRadius:10, padding:"10px", textAlign:"center" }}><div style={{ fontSize:20, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:10.5, color:C.sub, marginTop:3 }}>{l}</div></div>
        ))}
      </div>

    {doctors.length===0 ? <Empty icon="📈" title="لا بيانات بعد" /> :
      <div className="grid-cards">{overview.map(({d,sess,target})=>{
        const pct = target?Math.min(100,Math.round(sess.care/target*100)):0;
        return <div key={d.id} onClick={()=>setSel(d.id)} style={{ ...card(), padding:14, cursor:"pointer" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>

            <span>مسائي: <b style={{ color:"#7c3aed" }}>{sess.evening}</b></span>
            <span>تغطيات: <b style={{ color:"#0e7490" }}>{sess.covers}</b></span>
          </div>
        </div>;
      })}</div>}
    {sel!=null && (()=>{ const sd=fd(sel); if(!sd) return null;
      const ev=md.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(sd.id));
      const cov=[];
      md.forEach(dt=>{ const cv=(nightData[dt]||{}).coverages||{}; ["am","pm","nextAm"].forEach(slot=>{ (cv[slot]||[]).forEach(id=>{ if(id===sd.id){ const di0=slot==="nextAm"?dayIdx(nextWork(dt)):dayIdx(dt); const sl=slot==="nextAm"?"am":slot; const owner=((nightData[dt]||{}).doctors||[]).map(x=>fd(x)).find(o=>o&&CLINIC_SLOTS.includes(getSlot(o,di0,sl))); cov.push({ key:dt+slot, date:dt, plabel:slot==="nextAm"?"صباح اليوم التالي":perAr(slot), owner:owner?owner.name:null }); } }); }); });
      coverages.filter(c=>c.coverDoctorId===sd.id&&md.includes(c.date)).forEach(c=>{ const ad=c.absentId?fd(c.absentId):null; cov.push({ key:c.id, date:c.date, plabel:perAr(c.period), owner:ad?ad.name:null }); });
      const myLeaves=leaves.filter(l=>l.doctorId===sd.id).sort((a,b)=>b.start.localeCompare(a.start));
      const sess=doctorSessions(sd, md, nightData, coverages, leaves);
      const LT={annual:"سنوية",sick:"مرضية",emergency:"طارئة",other:"أخرى"};
      const stat=(lbl,val,col)=><div style={{ flex:"1 1 70px", background:"#f8fafc", borderRadius:10, padding:"10px", textAlign:"center" }}><div style={{ fontSize:20, fontWeight:800, color:col }}>{val}</div><div style={{ fontSize:10.5, color:C.sub, marginTop:3 }}>{lbl}</div></div>;
      return <div onClick={()=>setSel(null)} style={{ position:"fixed", inset:0, background:"rgba(20,30,40,.5)", zIndex:100, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"20px 14px", overflowY:"auto" }}>
        <div onClick={e=>e.stopPropagation()} style={{ background:"#fff", borderRadius:full?12:18, maxWidth:full?1000:560, width:"100%", minHeight:full?"94vh":"auto", padding:18, boxShadow:"0 20px 60px rgba(0,0,0,.3)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:14 }}>
            <Avatar doc={sd} size={48}/>
            <div style={{ flex:1 }}><div style={{ fontSize:17, fontWeight:700 }}>د.{sd.name}</div><div style={{ fontSize:12, color:C.sub }}>{rankLabel(rankOf(sd))} · {POS_LABEL[sd.adminPosition||"none"]}</div></div>
            <button onClick={()=>setFull(f=>!f)} style={{ ...sGhost, padding:"6px 12px" }} title="توسيع/تصغير">{full?"⤡ تصغير":"⤢ توسيع"}</button><button onClick={()=>{setSel(null);setFull(false);}} style={{ ...sGhost, padding:"6px 12px" }}>✕</button>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:16 }}>
            {stat("رعاية",sess.care,C.primary)}{stat("مسائي",sess.evening,"#7c3aed")}{stat("تغطيات",cov.length,"#0e7490")}{stat("إجازات",myLeaves.length,C.warn)}
          </div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:6 }}>🏥 جدول العيادات</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:16 }}>
            {[0,1,2,3,4].map(di=><div key={di} style={{ border:`1px solid ${C.line2}`, borderRadius:8, overflow:"hidden", textAlign:"center" }}><div style={{ background:"#f8fafc", fontSize:9, fontWeight:700, color:C.sub, padding:"3px 0" }}>{DAYS[di]}</div>{["am","pm"].map(p=>{ const sl=getSlot(sd,di,p); const dir=DIRECT_SLOTS.includes(sl); return <div key={p} style={{ fontSize:9, padding:"4px 1px", color:dir?C.primary:C.muted, background:dir?"#f0fdfa":"#fff", fontWeight:dir?700:400 }}>{SLOT_AR[sl]||"—"}</div>; })}</div>)}
          </div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🌙 الدوام المسائي ({ev.length})</div>
          <div style={{ fontSize:12, color:C.sub, marginBottom:16 }}>{ev.length?ev.map(dmy).join("، "):"—"}</div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🔄 التغطيات المؤدّاة ({cov.length})</div>
          <div style={{ marginBottom:16 }}>{cov.length?cov.map(c=><div key={c.key} style={{ fontSize:11.5, color:C.sub, padding:"2px 0" }}>• {dmy(c.date)} — {c.plabel}{c.owner?` · عيادة د.${c.owner}`:""}</div>):<div style={{ fontSize:12, color:C.muted }}>—</div>}</div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🏖 الإجازات ({myLeaves.length})</div>
          <div>{myLeaves.length?myLeaves.map(l=><div key={l.id} style={{ fontSize:11.5, color:C.sub, padding:"2px 0" }}>• {LT[l.type]} · {dmy(l.start)} ← {dmy(l.end)}</div>):<div style={{ fontSize:12, color:C.muted }}>—</div>}</div>
        </div>
      </div>;
    })()}
  </div>;
}

function FairnessPage({ doctors, leaves, nightData, coverages, today }) {
  const [scope,setScope] = useState("month");
  const now = new Date(today);
  const dates = (()=>{ if(scope==="month") return monthDays(now.getFullYear(),now.getMonth()).map(x=>x.date); const out=[]; for(let m=0;m<12;m++) monthDays(now.getFullYear(),m).forEach(x=>out.push(x.date)); return out; })();
  const rows = doctors.map(d=>{ const s=doctorSessions(d,dates,nightData,coverages,leaves); return { d, contrib:s.covers+s.eveningExtra, covers:s.covers, eve:s.eveningExtra, care:s.care }; }).sort((a,b)=>b.contrib-a.contrib);
  const avg = rows.length ? rows.reduce((a,r)=>a+r.contrib,0)/rows.length : 0;
  const max = Math.max(1, ...rows.map(r=>r.contrib));
  const most = rows[0], least = rows[rows.length-1];
  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>⚖️ مؤشر مساهمة الأطباء</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["month","الشهر"],["year","السنة"]].map(([k,l])=><button key={k} onClick={()=>setScope(k)} style={{ padding:"7px 15px", border:"none", fontSize:12.5, fontWeight:700, background:scope===k?C.primary:"#fff", color:scope===k?"#fff":C.sub }}>{l}</button>)}
        </div>
      </div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:8 }}>المساهمة = التغطيات المنفّذة + المسائي الإضافي. متوسط القسم: <b style={{ color:C.primary }}>{avg.toFixed(1)}</b></div>
    </div>
    {most && least && <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأكثر مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{most.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.primary }}>{most.contrib}</div></div>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأقل مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{least.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.warn }}>{least.contrib}</div></div>
    </div>}
    <div style={{ ...card(), padding:14 }}>
      {rows.map((r,i)=>{ const pct=Math.round(r.contrib/max*100); const above=r.contrib>=avg; return (
        <div key={r.d.id} style={{ marginBottom:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
            <span style={{ fontWeight:800, color:C.muted, minWidth:18, fontSize:12 }}>{i+1}</span>
            <Avatar doc={r.d} size={24}/>
            <span style={{ flex:1, fontSize:13, fontWeight:600 }}>د.{r.d.name}</span>
            <span style={{ fontSize:11, color:C.sub }}>تغطيات {r.covers} · مسائي+ {r.eve}</span>
            <span style={{ fontWeight:800, color:above?C.primary:C.warn, minWidth:24, textAlign:"center" }}>{r.contrib}</span>
          </div>
          <div style={{ height:8, background:"#eef3f8", borderRadius:6, overflow:"hidden" }}><div style={{ width:pct+"%", height:"100%", background:above?C.accent:C.warn, borderRadius:6 }} /></div>
        </div>
      ); })}
    </div>
  </div>;
}

function AlertsPage({ doctors, leaves, nightData, coverages, today, fd, settings, onGoto }) {
  const s = { ...DEFAULT_SETTINGS, ...settings };
  const now = new Date(today);
  const al = [];
  const ana = analyzeMonth(now.getFullYear(), now.getMonth(), doctors, leaves, nightData, coverages);
  ana.conflicts.forEach(c=> al.push({ sev:"err", t:c.text, go:"engine" }));
  ana.gaps.forEach(g=>{ const o=fd(g.ownerId); al.push({ sev:"warn", t:`عيادة ${o?"د."+o.name:""} مكشوفة ${dmy(g.date)} (${g.period==="am"?"صباحاً":"ظهراً"})`, go:"engine" }); });
  leaves.forEach(l=>{ const du=Math.round((new Date(l.start)-now)/864e5); if(du>0&&du<=3){ const d=fd(l.doctorId); if(d) al.push({ sev:"warn", t:`إجازة د.${d.name} تبدأ بعد ${du} ${du===1?"يوم":"أيام"}`, go:"leaves" }); } });
  doctors.forEach(d=>{ let n=0; monthDays(now.getFullYear(),now.getMonth()).forEach(({date})=>{ if(((nightData[date]||{}).doctors||[]).includes(d.id)) n++; }); if(n>s.capEvening) al.push({ sev:"err", t:`د.${d.name} تجاوز حدّ المناوبات (${n}/${s.capEvening})`, go:"doctors" }); });
  monthDays(now.getFullYear(),now.getMonth()).forEach(({date,di})=>{ const onLv=doctors.filter(d=>onLeave(d,date,leaves)).length; if(onLv>=s.capLeaveDay) al.push({ sev:"warn", t:`تواجد منخفض ${dmy(date)} ${DAYS[di]} — ${onLv} في إجازة`, go:"leaves" }); });
  al.sort((a,b)=>(a.sev==="err"?0:1)-(b.sev==="err"?0:1));
  const SEV = { err:{bg:"#fef2f2",bd:"#fecaca",fg:"#b91c1c",ic:"⛔"}, warn:{bg:"#fffbeb",bd:"#fde68a",fg:"#b45309",ic:"⚠️"} };
  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontSize:15, fontWeight:700 }}>🔔 مركز التنبيهات <span style={{ fontWeight:400, color:C.muted, fontSize:12 }}>({al.length})</span></div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:3 }}>تعارضات · عيادات مكشوفة · حدود · إجازات قادمة</div>
    </div>
    {al.length===0 ? <Empty icon="✅" title="لا تنبيهات" hint="كل شيء متوازن" /> :
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {al.map((a,i)=>{ const c=SEV[a.sev]; return (
          <div key={i} onClick={()=>onGoto(a.go)} style={{ display:"flex", alignItems:"center", gap:10, background:c.bg, border:`1px solid ${c.bd}`, borderRadius:11, padding:"11px 13px", cursor:"pointer" }}>
            <span style={{ fontSize:16 }}>{c.ic}</span>
            <span style={{ flex:1, fontSize:13, color:c.fg, fontWeight:600 }}>{a.t}</span>
            <span style={{ fontSize:11, color:C.muted }}>›</span>
          </div>
        ); })}
      </div>}
  </div>;
}

function ReportsPage({ doctors, leaves, nightData, coverages, today, fd }) {
  const [scope,setScope] = useState("month");
  const [ref,setRef]     = useState(today);
  const [sel,setSel]     = useState("all");
  const weekDatesOf = r => { const t=new Date(r); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const out=[]; for(let i=0;i<5;i++){ const dd=new Date(sun); dd.setDate(sun.getDate()+i); out.push(dd.toISOString().split("T")[0]); } return out; };
  const rd = new Date(ref);
  const dates = scope==="week" ? weekDatesOf(ref) : monthDays(rd.getFullYear(), rd.getMonth()).map(x=>x.date);
  const label = scope==="week" ? `أسبوع ${dmy(dates[0])} – ${dmy(dates[dates.length-1])}` : `${MONTHS[rd.getMonth()]} ${rd.getFullYear()}`;
  const nav = dir => { const d=new Date(ref); if(scope==="week") d.setDate(d.getDate()+dir*7); else d.setMonth(d.getMonth()+dir); setRef(d.toISOString().split("T")[0]); };
  const slotT = (d,di,p)=>{ const sl=(d.sched?.[di]?.[p])||""; return sl?SLOT_AR[sl]||sl:"—"; };
  const perTxt = p => p==="am"?"صباحاً":p==="pm"?"ظهراً":p==="nextAm"?"صباح الغد":"مساءً";
  const covsOf = d => { const out=[]; coverages.filter(c=>c.coverDoctorId===d.id&&dates.includes(c.date)).forEach(c=>out.push({date:c.date,period:c.period,ownerId:c.absentId})); dates.forEach(dt=>{ const cv=(nightData[dt]||{}).coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===d.id) out.push({date:dt,period:sl,ownerId:null}); }); }); }); return out.sort((a,b)=>a.date.localeCompare(b.date)); };
  const eveOf = d => dates.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(d.id));
  const lvOf = d => leaves.filter(l=>l.doctorId===d.id && l.start<=dates[dates.length-1] && l.end>=dates[0]);
  const shown = sel==="all" ? doctors : doctors.filter(d=>d.id===+sel);

  const printDoctor = d => {
    const s = doctorSessions(d, dates, nightData, coverages, leaves);
    const sched = DAYS.map((dn,di)=>`<tr><td>${dn}</td><td>${slotT(d,di,"am")}</td><td>${slotT(d,di,"pm")}</td></tr>`).join("");
    const cv = covsOf(d); const ev = eveOf(d); const lv = lvOf(d);
    const reasonAr = r => r==="leave"?"إجازة":r==="evening"?"دوام مسائي":r==="absence"?"غياب/عذر":(r||"—");
    const coveredAway = coverages.filter(c=>c.absentId===d.id && dates.includes(c.date)).sort((a,b)=>a.date.localeCompare(b.date));
    const dayLog = dates.map(dt=>{
      const di=new Date(dt).getDay();
      const isEve=((nightData[dt]||{}).doctors||[]).includes(d.id);
      const onLv=onLeave(d,dt,leaves); const closed=clinicClosedOnLeave(d,dt,leaves);
      const am=(d.sched?.[di]?.am)||""; const pm=(d.sched?.[di]?.pm)||"";
      const cellAm = onLv?(closed?"إجازة":(SLOT_AR[am]||"—")):(SLOT_AR[am]||"—");
      const cellPm = onLv?(closed?"إجازة":(SLOT_AR[pm]||"—")):(SLOT_AR[pm]||"—");
      const tc = cv.filter(c=>c.date===dt).map(c=>`${perTxt(c.period)}${c.ownerId?" د."+(fd(c.ownerId)?.name||""):""}`).join("، ")||"—";
      const st = onLv?(closed?"إجازة (عيادة مغلقة)":"إجازة (عيادة قائمة)"):(isEve?"دوام مسائي":"عمل عادي");
      return `<tr><td>${dmy(dt)}</td><td>${DAYS[di]||"-"}</td><td>${cellAm}</td><td>${cellPm}</td><td>${isEve?"🌙":"—"}</td><td>${tc}</td><td>${st}</td></tr>`;
    }).join("");
    const body = `
      <table><tr><th>الطبيب</th><td>د.${d.name}</td><th>الدرجة</th><td>${rankLabel(rankOf(d))}</td></tr>
      <tr><th>الفترة</th><td>${label}</td><th>هدف الرعاية</th><td>${directTarget(d)}</td></tr></table>
      <h2>ملخص الأعمال</h2>
      <table><thead><tr><th>الرعاية</th><th>التغطيات المنفّذة</th><th>المسائي</th><th>عيادات غُطّيت عنه</th><th>الإجازات</th></tr></thead>
      <tbody><tr><td>${s.care}</td><td>${s.covers}</td><td>${s.evening}</td><td>${coveredAway.length}</td><td>${lv.length}</td></tr></tbody></table>
      <h2>الجدول الأسبوعي الثابت</h2>
      <table><thead><tr><th>اليوم</th><th>صباح</th><th>ظهر</th></tr></thead><tbody>${sched}</tbody></table>
      <h2>السجل اليومي — كل ما قام به (${dates.length} يوم)</h2>
      <table><thead><tr><th>التاريخ</th><th>اليوم</th><th>صباح</th><th>ظهر</th><th>مسائي</th><th>تغطية قام بها</th><th>الحالة</th></tr></thead><tbody>${dayLog}</tbody></table>
      <h2>الدوام المسائي (${ev.length})</h2>
      ${ev.length?`<table><thead><tr><th>التاريخ</th></tr></thead><tbody>${ev.map(dt=>`<tr><td>${dmy(dt)} ${DAYS[new Date(dt).getDay()]||""}</td></tr>`).join("")}</tbody></table>`:"<p>لا يوجد</p>"}
      <h2>التغطيات المؤدّاة (${cv.length})</h2>
      ${cv.length?`<table><thead><tr><th>التاريخ</th><th>الفترة</th><th>العيادة المغطّاة</th></tr></thead><tbody>${cv.map(c=>`<tr><td>${dmy(c.date)}</td><td>${perTxt(c.period)}</td><td>${c.ownerId?("د."+(fd(c.ownerId)?.name||"")):"تغطية عيادة"}</td></tr>`).join("")}</tbody></table>`:"<p>لا يوجد</p>"}
      <h2>غياباته / عياداته المغطّاة عنه (${coveredAway.length})</h2>
      ${coveredAway.length?`<table><thead><tr><th>التاريخ</th><th>الفترة</th><th>غطّاها</th><th>السبب</th></tr></thead><tbody>${coveredAway.map(c=>`<tr><td>${dmy(c.date)}</td><td>${perTxt(c.period)}</td><td>د.${fd(c.coverDoctorId)?.name||""}</td><td>${reasonAr(c.reason)}</td></tr>`).join("")}</tbody></table>`:"<p>لا يوجد</p>"}
      <h2>الإجازات (${lv.length})</h2>
      ${lv.length?`<table><thead><tr><th>من</th><th>إلى</th></tr></thead><tbody>${lv.map(l=>`<tr><td>${dmy(l.start)}</td><td>${dmy(l.end)}</td></tr>`).join("")}</tbody></table>`:"<p>لا يوجد</p>"}`;
    printDoc(`تقرير شامل — د.${d.name} (${label})`, body, true);
  };
  const printAll = () => shown.forEach((d,i)=>setTimeout(()=>printDoctor(d), i*400));

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>📊 تقارير الأطباء</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["week","أسبوعي"],["month","شهري"]].map(([k,l])=><button key={k} onClick={()=>setScope(k)} style={{ padding:"7px 15px", border:"none", fontSize:12.5, fontWeight:700, background:scope===k?C.primary:"#fff", color:scope===k?"#fff":C.sub }}>{l}</button>)}
        </div>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
        <button onClick={()=>nav(-1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>‹</button>
        <div style={{ flex:1, textAlign:"center", fontWeight:700, fontSize:13.5 }}>{label}</div>
        <button onClick={()=>nav(1)} style={{ ...sGhost, width:34, padding:"6px 0" }}>›</button>
      </div>
      <select value={sel} onChange={e=>setSel(e.target.value)} style={{ ...sIn, marginBottom:10 }}>
        <option value="all">كل الأطباء</option>
        {doctors.map(d=><option key={d.id} value={d.id}>د.{d.name}</option>)}
      </select>
      <button onClick={printAll} style={{ ...sGhost, width:"100%" }}>🖨 طباعة {sel==="all"?"الكل (كل طبيب بصفحة)":"الطبيب المحدد"}</button>
    </div>

    {shown.map(d=>{ const s=doctorSessions(d,dates,nightData,coverages,leaves); const cv=covsOf(d); const ev=eveOf(d); const lv=lvOf(d); return (
      <div key={d.id} style={{ ...card(), padding:16, marginBottom:12 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
          <Avatar doc={d} size={36}/>
          <div style={{ flex:1 }}><div style={{ fontWeight:700, fontSize:14 }}>د.{d.name}</div><div style={{ fontSize:11, color:C.sub }}>{rankLabel(rankOf(d))} · هدف {directTarget(d)}</div></div>
          <button onClick={()=>printDoctor(d)} style={{ ...sGhost, padding:"7px 12px", fontSize:12 }}>🖨 طباعة الجدول</button>
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:12 }}>
          {[["رعاية",s.care,C.primary],["تغطيات",s.covers,"#0e7490"],["مسائي",s.evening,"#7c3aed"],["إجازات",lv.length,C.warn]].map(([l,v,col])=>(
            <div key={l} style={{ flex:"1 1 64px", background:"#f8fafc", borderRadius:9, padding:"9px 6px", textAlign:"center" }}><div style={{ fontSize:18, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:10, color:C.sub, marginTop:2 }}>{l}</div></div>
          ))}
        </div>
        <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, marginBottom:6 }}>🏥 الجدول الأسبوعي</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:10 }}>
          {DAYS.map((dn,di)=>(<div key={di} style={{ textAlign:"center" }}>
            <div style={{ fontSize:9.5, color:C.sub, fontWeight:700, marginBottom:3 }}>{dn}</div>
            {["am","pm"].map(p=>{ const sl=(d.sched?.[di]?.[p])||""; const st=slotStyle(sl); return <div key={p} style={{ background:st.bg, color:st.fg, fontSize:9.5, fontWeight:700, borderRadius:6, padding:"5px 1px", marginBottom:2 }}>{sl?st.t:"—"}</div>; })}
          </div>))}
        </div>
        {ev.length>0 && <div style={{ fontSize:11.5, marginBottom:5 }}>🌙 مسائي: {ev.map(dt=>dmy(dt)).join("، ")}</div>}
        {cv.length>0 && <div style={{ fontSize:11.5, marginBottom:5 }}>🔄 تغطيات: {cv.map(c=>`${dmy(c.date)} ${perTxt(c.period)}`).join("، ")}</div>}
        {!ev.length && !cv.length && <div style={{ fontSize:11.5, color:C.muted }}>لا دوام مسائي ولا تغطيات في هذه الفترة</div>}
      </div>
    ); })}
  </div>;
}

function DoctorPortal({ doctor, doctors, leaves, nightData, coverages, today, fd }) {
  const now = new Date(today);
  const md = monthDays(now.getFullYear(), now.getMonth()).map(x=>x.date);
  const s = doctorSessions(doctor, md, nightData, coverages, leaves);
  const myLeaves = leaves.filter(l=>l.doctorId===doctor.id);
  const evDates = Object.entries(nightData).filter(([dt,nd])=>(nd.doctors||[]).includes(doctor.id) && dt.slice(0,7)===`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`).map(([dt])=>dt).sort();
  const myCovs = [];
  coverages.filter(c=>c.coverDoctorId===doctor.id).forEach(c=>myCovs.push({ date:c.date, period:c.period, ownerId:c.absentId }));
  Object.entries(nightData).forEach(([dt,nd])=>{ const cv=nd.coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===doctor.id) myCovs.push({ date:dt, period:sl, ownerId:null }); }); }); });
  myCovs.sort((a,b)=>a.date.localeCompare(b.date));
  const perTxt = p => p==="am"?"صباحاً":p==="pm"?"ظهراً":p==="nextAm"?"صباح الغد":"مساءً";
  const tiles = [["رعاية",s.care,C.primary],["مسائي",s.evening,"#7c3aed"],["تغطيات",s.covers,"#0e7490"],["إجازات",myLeaves.length,C.warn]];
  return <div className="fade">
    <div style={{ ...card(), padding:"18px 18px", marginBottom:14, display:"flex", alignItems:"center", gap:12 }}>
      <Avatar doc={doctor} size={48}/>
      <div><div style={{ fontSize:17, fontWeight:800 }}>د.{doctor.name}</div><div style={{ fontSize:12, color:C.sub }}>{rankLabel(rankOf(doctor))} · هدف الرعاية {directTarget(doctor)} · {MONTHS[now.getMonth()]}</div></div>
    </div>
    <div style={{ display:"flex", flexWrap:"wrap", gap:10, marginBottom:14 }}>
      {tiles.map(([l,v,col])=><div key={l} style={{ ...card(), flex:"1 1 70px", padding:"14px 8px", textAlign:"center" }}><div style={{ fontSize:24, fontWeight:800, color:col }}>{v}</div><div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{l}</div></div>)}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:10 }}>🏥 جدول العيادات</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:5 }}>
        {DAYS.map((dn,di)=>(<div key={di} style={{ textAlign:"center" }}>
          <div style={{ fontSize:10.5, color:C.sub, fontWeight:700, marginBottom:4 }}>{dn}</div>
          {["am","pm"].map(p=>{ const sl=(doctor.sched?.[di]?.[p])||""; const st=slotStyle(sl); return <div key={p} style={{ background:st.bg, color:st.fg, fontSize:10.5, fontWeight:700, borderRadius:7, padding:"6px 2px", marginBottom:3 }}>{sl?st.t:"—"}</div>; })}
        </div>))}
      </div>
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🌙 الدوام المسائي ({evDates.length})</div>
      {evDates.length? <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{evDates.map(dt=><span key={dt} style={{ background:"#ede9fe", color:"#6d28d9", fontSize:11.5, fontWeight:700, borderRadius:8, padding:"5px 10px" }}>{dmy(dt)}</span>)}</div> : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🔄 التغطيات المؤدّاة ({myCovs.length})</div>
      {myCovs.length? myCovs.map((c,i)=>(<div key={i} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ color:C.muted, minWidth:78 }}>{dmy(c.date)}</span>
        <span style={{ flex:1 }}>{c.ownerId?`عيادة د.${fd(c.ownerId)?.name||""}`:"تغطية عيادة"} · {perTxt(c.period)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontWeight:700, fontSize:13.5, marginBottom:8 }}>🏖 الإجازات ({myLeaves.length})</div>
      {myLeaves.length? myLeaves.map(l=>(<div key={l.id} style={{ display:"flex", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.line2}`, fontSize:12.5 }}>
        <span style={{ flex:1 }}>{dmy(l.start)} ← {dmy(l.end)}</span>
      </div>)) : <div style={{ fontSize:12, color:C.muted }}>—</div>}
    </div>
  </div>;
}

// ════════════════════════════════ APP ════════════════════════════════
function App() {
  const [doctors, setDoctors]     = useState(()=>{ const st=S.get("v2_docs"); return (st&&st.length)?st:SEED_DOCTORS; });
  const [leaves, setLeaves]       = useState(()=>S.get("v2_leaves")||[]);
  const [nightData, setNight]     = useState(()=>S.get("v2_night")||{});
  const [coverages, setCoverages] = useState(()=>S.get("v2_cov")||[]);
  const [settings, setSettings]   = useState(()=>S.get("v2_settings")||{});
  const [audit, setAudit]         = useState(()=>S.get("v2_audit")||[]);
  const [users, setUsers]         = useState(()=>{ const u=S.get("v2_users"); return (u&&u.length)?u:[{ id:uid(), username:"admin", pin:"0000", role:"head", doctorId:null }]; });
  const [session, setSession]     = useState(()=>S.get("v2_session")||null);
  const [collapsed, setCollapsed] = useState(()=>!!S.get("v2_navcollapsed"));
  const [page, setPage]           = useState("dashboard");
  const [toast, setToast]         = useState(null);
  useEffect(()=>S.set("v2_docs",doctors),[doctors]);
  useEffect(()=>S.set("v2_leaves",leaves),[leaves]);
  useEffect(()=>S.set("v2_night",nightData),[nightData]);
  useEffect(()=>S.set("v2_cov",coverages),[coverages]);
  useEffect(()=>S.set("v2_settings",settings),[settings]);
  useEffect(()=>S.set("v2_audit",audit),[audit]);
  useEffect(()=>S.set("v2_users",users),[users]);
  useEffect(()=>S.set("v2_session",session),[session]);
  useEffect(()=>S.set("v2_navcollapsed",collapsed),[collapsed]);
  const logAudit = action => setAudit(a=>[{ id:uid(), at:Date.now(), action },...a].slice(0,500));
  const today = new Date().toISOString().split("T")[0];
  const fd = id => doctors.find(d=>d.id===id);
  const showToast = (msg,kind="ok") => { setToast({msg,kind}); setTimeout(()=>setToast(null),2200); };
  const currentUser = users.find(u=>u.id===(session&&session.userId)) || null;
  const role = currentUser && currentUser.role;
  const logout = () => { setSession(null); setPage("dashboard"); };

  const TABS = [["dashboard","الرئيسية","◧"],["engine","الدوام والتغطيات","🌙"],["leaves","الإجازات","🏖"],["doctors","الأطباء","👨‍⚕️"],["stats","الإحصائيات","📈"],["fairness","مؤشر مساهمة الأطباء","⚖️"],["reports","التقارير","📊"],["alerts","التنبيهات","🔔"],["audit","سجل النشاط","📜"],["settings","الإعدادات","⚙️"], ...(role==="head"?[["users","المستخدمون","👥"]]:[])];
  const cur = TABS.find(t=>t[0]===page);
  const subt = { dashboard:"نظرة عامة وتنبيهات", engine:"المحرك — حلول · مسائي · تغطيات", leaves:"تسجيل الإجازات وأثرها", doctors:"بيانات الأطباء وجداولهم", stats:"العبء الوظيفي", fairness:"ترتيب الأطباء حسب المساهمة", reports:"تقارير شهرية قابلة للطباعة", alerts:"تعارضات وحدود وإجازات", audit:"توثيق العمليات", settings:"الحدود والقواعد", users:"حسابات المستخدمين والصلاحيات" };
  const pageEl = <>
      {page==="dashboard" && <Dashboard doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} onGoto={setPage} />}
      {page==="engine" && <EnginePage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setNight={setNight} setCoverages={setCoverages} showToast={showToast} logAudit={logAudit} />}
      {page==="leaves" && <LeavesPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setLeaves={setLeaves} setCoverages={setCoverages} showToast={showToast} logAudit={logAudit} />}
      {page==="doctors" && <DoctorsPage doctors={doctors} leaves={leaves} today={today} fd={fd} setDoctors={setDoctors} showToast={showToast} logAudit={logAudit} />}
      {page==="stats" && <StatsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} />}
      {page==="fairness" && <FairnessPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} />}
      {page==="reports" && <ReportsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} />}
      {page==="alerts" && <AlertsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} settings={settings} onGoto={setPage} />}
      {page==="audit" && <AuditPage audit={audit} />}
      {page==="settings" && <SettingsPage settings={settings} setSettings={setSettings} showToast={showToast} />}
      {page==="users" && role==="head" && <UsersPage users={users} setUsers={setUsers} doctors={doctors} currentUser={currentUser} showToast={showToast} />}
  </>;

  // ---- Auth gating ----
  if(!currentUser) return <LoginScreen users={users} onLogin={u=>{ setSession({userId:u.id}); setPage("dashboard"); }} />;
  if(role==="doctor"){ const myDoc=doctors.find(d=>d.id===currentUser.doctorId); return (
    <div style={{ maxWidth:780, margin:"0 auto", minHeight:"100vh", background:C.bg }}>
      <div style={{ background:`linear-gradient(135deg,${C.primaryD},${C.primary})`, color:"#fff", padding:"15px 18px", display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ flex:1 }}><div style={{ fontSize:16, fontWeight:800 }}>حسابي</div><div style={{ fontSize:11.5, opacity:.85 }}>جدولك · تغطياتك · إحصائياتك</div></div>
        <button onClick={logout} style={{ background:"rgba(255,255,255,.2)", color:"#fff", border:"none", borderRadius:9, padding:"7px 15px", fontWeight:700, fontSize:12.5, cursor:"pointer" }}>خروج</button>
      </div>
      <div style={{ padding:"16px 14px 40px" }}>{ myDoc ? <DoctorPortal doctor={myDoc} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} /> : <Empty icon="⚠️" title="لا يوجد طبيب مرتبط بحسابك" hint="تواصل مع رئيس القسم" /> }</div>
      <Toast toast={toast} />
    </div>
  ); }

  return <div className="shell">
    <aside className={"sidebar"+(collapsed?" collapsed":"")}>
      <div className="brand">
        <div style={{ width:40, height:40, borderRadius:12, background:`linear-gradient(135deg,${C.primary},${C.accent})`, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:800, flexShrink:0 }}>ط</div>
        <div className="brand-text"><div style={{ fontWeight:700, fontSize:15.5 }}>الجداول الطبية</div><div style={{ fontSize:11, color:C.sub }}>إدارة الدوام</div></div>
      </div>
      <button className="collapse-btn" onClick={()=>setCollapsed(c=>!c)} title={collapsed?"توسيع القائمة":"تصغير القائمة"}>
        <span className="cic">{collapsed?"»":"«"}</span><span className="collapse-txt">تصغير القائمة</span>
      </button>
      {TABS.map(([id,lbl,ic])=>(
        <button key={id} className={"navbtn"+(page===id?" active":"")} onClick={()=>setPage(id)} title={lbl}><span className="ic">{ic}</span><span className="nav-label">{lbl}</span></button>
      ))}
      <div style={{ flex:1 }} />
      <div style={{ padding:"10px 6px", borderTop:`1px solid ${C.line2}` }}>
        <div className="user-text">
          <div style={{ fontSize:12.5, fontWeight:700 }}>{currentUser.username}</div>
          <div style={{ fontSize:10.5, color:C.sub, marginBottom:7 }}>{ROLE_AR[role]}</div>
        </div>
        <button onClick={logout} title="تسجيل الخروج" style={{ ...sGhost, width:"100%", padding:"7px", fontSize:collapsed?16:12 }}>{collapsed?"⎋":"تسجيل الخروج"}</button>
      </div>
      <div className="user-text" style={{ fontSize:11, color:C.muted, textAlign:"center", padding:"6px 0" }}>{doctors.length} طبيب · {MONTHS[new Date().getMonth()]}</div>
    </aside>
    <div className="main">
      <div className="topbar" style={{ display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ flex:1 }}>
          <h1>{cur?cur[2]+" "+cur[1]:""}</h1>
          <p>{subt[page]}</p>
        </div>
        <button onClick={logout} style={{ ...sGhost, padding:"7px 13px", fontSize:12.5, whiteSpace:"nowrap" }}>خروج</button>
      </div>
      <div className="content">{pageEl}</div>
    </div>
    <div className="bottomnav" style={{ overflowX:"auto" }}>
      {TABS.map(([id,lbl,ic])=>(
        <button key={id} onClick={()=>setPage(id)} style={{ flex:"0 0 auto", minWidth:62, background:"none", border:"none", padding:"9px 4px 8px", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:page===id?C.primary:C.muted }}>
          <span style={{ fontSize:17 }}>{ic}</span>
          <span style={{ fontSize:9.5, fontWeight:page===id?700:500, whiteSpace:"nowrap" }}>{lbl}</span>
        </button>
      ))}
    </div>
    <Toast toast={toast} />
  </div>;
}

const container = document.getElementById("root");
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
