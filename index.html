          <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>🔄 تغطية فردية جديدة</div>

          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الطبيب الغائب (اختياري)</label>
            <select style={SEL} value={form.absentId} onChange={e=>setForm(p=>({...p,absentId:e.target.value}))}>
              <option value="">— بدون تحديد</option>
              {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>

          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>التاريخ</label>
              <input type="date" style={SEL} value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value,coverDoctorId:""}))} />
            </div>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الفترة</label>
              <select style={SEL} value={form.period} onChange={e=>setForm(p=>({...p,period:e.target.value,coverDoctorId:""}))}>
                {Object.entries(PERIODS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
          </div>

          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>السبب</label>
            <select style={SEL} value={form.reason} onChange={e=>setForm(p=>({...p,reason:e.target.value}))}>
              {Object.entries(REASONS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>

          <div style={{ marginBottom:12 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>طبيب التغطية {form.date && `(${availForForm.filter(x=>x.status==="free").length} متاح)`}</label>
            <select style={SEL} value={form.coverDoctorId} onChange={e=>setForm(p=>({...p,coverDoctorId:e.target.value}))} disabled={!form.date}>
              <option value="">{form.date ? "اختر طبيباً..." : "اختر التاريخ أولاً"}</option>
              {availForForm.filter(x=>x.status==="free").length > 0 && (
                <optgroup label="✅ أطباء فارغون (متاحون)">
                  {availForForm.filter(x=>x.status==="free").map(({doc:d})=><option key={d.id} value={d.id}>{d.name}</option>)}
                </optgroup>
              )}
              {availForForm.filter(x=>x.status==="warn").length > 0 && (
                <optgroup label="⚠️ لديه التزام آخر">
                  {availForForm.filter(x=>x.status==="warn").map(({doc:d})=><option key={d.id} value={d.id}>⚠️ {d.name}</option>)}
                </optgroup>
              )}
            </select>
          </div>

          {/* Warning: absent doctor has no clinic in this period */}
          {form.absentId && absentHasClinic === false && (
            <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:12, color:"#dc2626", fontWeight:600 }}>
              🚫 {fd(+form.absentId)?.name} ليس لديه عيادة في {PERIODS[form.period]} هذا اليوم — لا تحتاج تغطية
            </div>
          )}
          {form.absentId && absentHasClinic === true && (
            <div style={{ background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:8, padding:"8px 12px", marginBottom:12, fontSize:12, color:"#15803d", fontWeight:600 }}>
              ✓ {fd(+form.absentId)?.name} لديه عيادة في {PERIODS[form.period]} — التغطية مطلوبة
            </div>
          )}

          <div style={{ display:"flex", gap:8 }}>
            <button style={{ ...Btn.primary, opacity:(form.absentId && absentHasClinic===false)?0.5:1 }} onClick={submit} disabled={form.absentId && absentHasClinic===false}>حفظ</button>
            <button style={Btn.secondary} onClick={()=>setShow(false)}>إلغاء</button>
          </div>
        </div>
      )}

      {coverages.length===0 && <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px 0" }}>لا توجد تغطيات فردية</div>}
      {[...coverages].sort((a,b)=>a.date.localeCompare(b.date)).map(c => {
        const cd = fd(c.coverDoctorId);
        const ad = c.absentId ? fd(c.absentId) : null;
        if (!cd) return null;
        const di = dayIdx(c.date);
        return (
          <div key={c.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", marginBottom:7, display:"flex", alignItems:"center", gap:10, borderRight:"4px solid #ea580c" }}>
            <div style={{ ...AV, background:cd.color, width:34, height:34, fontSize:12 }}>{sn(cd.name).slice(0,2)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, fontSize:13 }}>🔄 {cd.name} <span style={{ fontWeight:400, color:"#64748b", fontSize:11 }}>يغطّي {PERIODS[c.period]}</span></div>
              <div style={{ fontSize:11, color:"#64748b" }}>
                {di>=0 ? DAYS[di] : ""} {c.date}
                {ad && ` — بدلاً من ${ad.name}`}
                {` — ${REASONS[c.reason]}`}
              </div>
            </div>
            <button style={Btn.danger} onClick={()=>onRemove(c.id)}>🗑</button>
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// STATS PAGE  (tasks count + avg comparison + color class)
// ══════════════════════════════════════════════════════
function StatsPage({ doctors, nightData, coverages, leaves }) {
  const [selId, setSelId] = useState("");
  const [period, setPeriod] = useState("month"); // week | month | year

  // Compute per-doctor stats within a date filter
  const inRange = (dateStr, range) => {
    const d = new Date(dateStr);
    const now = new Date();
    if (range === "week") {
      const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
      return d >= weekAgo && d <= now;
    }
    if (range === "month") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if (range === "year") return d.getFullYear()===now.getFullYear();
    return true;
  };

  const calcStats = (doc, range) => {
    const fixedDays = doc.nightDays || [];
    let fixedNights = 0, extraNights = 0;
    Object.entries(nightData).forEach(([date, nd]) => {
      if (!(nd.doctors||[]).includes(doc.id)) return;
      if (range !== "all" && !inRange(date, range)) return;
      const di = dayIdx(date);
      if (fixedDays.includes(di)) fixedNights++; else extraNights++;
    });
    let nightCovs = 0;
    Object.entries(nightData).forEach(([date,nd])=>{
      if (range !== "all" && !inRange(date, range)) return;
      const c = nd.coverages||{};
      nightCovs += ((c.am||[]).includes(doc.id)?1:0)+((c.pm||[]).includes(doc.id)?1:0)+((c.nextAm||[]).includes(doc.id)?1:0);
    });
    const indivCovs = (coverages||[]).filter(c=>c.coverDoctorId===doc.id && (range==="all"||inRange(c.date,range))).length;
    const totalCovs = nightCovs + indivCovs;
    const myLeaves = leaves.filter(l=>l.doctorId===doc.id && (range==="all"||inRange(l.start,range)));
    const leaveDays = myLeaves.reduce((a,l)=>a+Math.round((new Date(l.end)-new Date(l.start))/86400000)+1, 0);
    const absenceDays = myLeaves.filter(l=>l.type==="sick"||l.type==="emergency").reduce((a,l)=>a+Math.round((new Date(l.end)-new Date(l.start))/86400000)+1, 0);
    const tasks = Math.max(0, extraNights + totalCovs - absenceDays);
    return { fixedNights, extraNights, nightCovs, indivCovs, totalCovs, leaveDays, absenceDays, tasks, myLeaves };
  };

  const classify = (t) => t<=1 ? { label:"خفيف", color:"#15803d", bg:"#f0fdf4", border:"#bbf7d0" }
    : t<=3 ? { label:"متوسط", color:"#d97706", bg:"#fffbeb", border:"#fde68a" }
    : { label:"مرتفع", color:"#dc2626", bg:"#fef2f2", border:"#fecaca" };

  // Overview totals (current month)
  const overview = doctors.map(doc => ({ doc, s: calcStats(doc, "month") })).sort((a,b)=>b.s.tasks-a.s.tasks);
  const totTasks = overview.reduce((a,x)=>a+x.s.tasks,0);
  const avgTasks = doctors.length ? totTasks/doctors.length : 0;

  const selDoc = doctors.find(d=>d.id===+selId);
  const PERIODS = { week:"أسبوعي", month:"شهري", year:"سنوي" };
  const SLOT_LABEL = { clinic:"عيادة", clinic_am:"عيادة", clinic_pm:"عيادة", admin:"إداري", training:"تدريب", audit:"تدقيق", virtual:"افتراضية", "":"—" };
  const LEAVE_TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };

  return (
    <div>
      {/* Doctor selector */}
      <div style={{ background:"linear-gradient(135deg,#1e3a5f,#2c5282)", borderRadius:14, padding:"16px 18px", marginBottom:16 }}>
        <div style={{ color:"#cdddec", fontSize:12, fontWeight:700, marginBottom:8 }}>👨‍⚕️ اختر طبيباً لعرض تفاصيله الكاملة</div>
        <select value={selId} onChange={e=>setSelId(e.target.value)} style={{ width:"100%", padding:"11px 12px", borderRadius:9, border:"none", fontSize:14, fontWeight:700, color:"#1e293b", cursor:"pointer", outline:"none" }}>
          <option value="">— عرض النظرة العامة لكل الأطباء —</option>
          {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      {/* DETAIL VIEW for selected doctor */}
      {selDoc ? (() => {
        const s = calcStats(selDoc, period);
        const cls = classify(s.tasks);
        return (
          <div>
            {/* Profile header */}
            <div style={{ background:"#fff", borderRadius:14, padding:16, marginBottom:14, borderRight:`6px solid ${selDoc.color}`, display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ ...AV, background:selDoc.color, width:54, height:54, fontSize:20, borderRadius:14 }}>{sn(selDoc.name).slice(0,2)}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:800, fontSize:18 }}>{selDoc.name}</div>
                <div style={{ fontSize:12, color:"#64748b", display:"flex", gap:8, flexWrap:"wrap", marginTop:4 }}>
                  <span>{wSlots(selDoc)} فترة/أسبوع</span>
                  {(selDoc.nightDays||[]).length>0 && <span style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:5, padding:"1px 8px" }}>🌙 مسائي ثابت: {(selDoc.nightDays||[]).map(d=>DAYS[d]).join("، ")}</span>}
                </div>
              </div>
            </div>

            {/* Period toggle */}
            <div style={{ display:"flex", gap:6, marginBottom:14 }}>
              {Object.entries(PERIODS).map(([k,l])=>(
                <button key={k} onClick={()=>setPeriod(k)} style={{ flex:1, padding:"9px", borderRadius:9, fontSize:13, fontWeight:700, cursor:"pointer", border: period===k?"2px solid #1e3a5f":"1px solid #e2e8f0", background: period===k?"#eff4fa":"#fff", color: period===k?"#1e3a5f":"#64748b" }}>{l}</button>
              ))}
            </div>

            {/* Stat cards */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))", gap:8, marginBottom:14 }}>
              {[{i:"🌙",l:"مسائي ثابت",v:s.fixedNights,c:"#64748b"},
                {i:"➕",l:"مسائي إضافي",v:s.extraNights,c:"#1d4ed8"},
                {i:"🔄",l:"تغطيات",v:s.totalCovs,c:"#15803d"},
                {i:"🏥",l:"غياب",v:s.absenceDays,c:"#dc2626"},
                {i:"🏖",l:"إجازات",v:s.leaveDays,c:"#d97706"},
              ].map(({i,l,v,c})=>(
                <div key={l} style={{ background:"#fff", border:"1px solid #e2e8f0", borderTop:`3px solid ${c}`, borderRadius:10, padding:"10px 6px", textAlign:"center" }}>
                  <div style={{ fontSize:18 }}>{i}</div>
                  <div style={{ fontSize:22, fontWeight:800, color:c }}>{v}</div>
                  <div style={{ fontSize:9, color:"#64748b" }}>{l}</div>
                </div>
              ))}
            </div>

            {/* Extra load badge */}
            <div style={{ background:cls.bg, border:`1px solid ${cls.border}`, borderRadius:12, padding:"12px 16px", marginBottom:14, display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ fontSize:34, fontWeight:800, color:cls.color }}>{s.tasks}</div>
              <div>
                <div style={{ fontWeight:700, color:cls.color }}>العبء الإضافي ({PERIODS[period]}) — {cls.label}</div>
                <div style={{ fontSize:11, color:"#64748b" }}>= (مسائي إضافي + تغطيات) − غياب</div>
              </div>
            </div>

            {/* Weekly schedule */}
            <div style={{ background:"#fff", borderRadius:12, padding:14, marginBottom:14, border:"1px solid #e2e8f0" }}>
              <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📅 الجدول الأسبوعي</div>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", minWidth:340 }}>
                  <thead><tr style={{ background:"#5b8def" }}>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>اليوم</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>ص</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>م</th>
                    <th style={{ padding:"6px", fontSize:11, color:"#fff" }}>مسائي</th>
                  </tr></thead>
                  <tbody>
                    {[0,1,2,3,4].map(di=>{
                      const isEve = (selDoc.nightDays||[]).includes(di);
                      const am = getSlot(selDoc,di,"am"), pm = getSlot(selDoc,di,"pm");
                      const cellStyle = (v) => ({ padding:"6px", fontSize:11, textAlign:"center", border:"1px solid #f1f5f9", background:(SLOT_COLORS[v]||SLOT_COLORS[""]).bg, color:(SLOT_COLORS[v]||SLOT_COLORS[""]).text, fontWeight:600 });
                      return (
                        <tr key={di}>
                          <td style={{ padding:"6px", fontSize:11, fontWeight:700, color:"#fff", background:"#7ea4e6", textAlign:"center" }}>{DAYS[di]}</td>
                          <td style={cellStyle(am)}>{am?SLOT_LABEL[am]:"—"}</td>
                          <td style={cellStyle(pm)}>{pm?SLOT_LABEL[pm]:"—"}</td>
                          <td style={{ padding:"6px", fontSize:11, textAlign:"center", border:"1px solid #f1f5f9", background:isEve?"#0f1e36":"#fff", color:isEve?"#93b4d8":"#cbd5e1", fontWeight:700 }}>{isEve?"🌙 عيادة":"—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Leaves */}
            <div style={{ background:"#fff", borderRadius:12, padding:14, border:"1px solid #e2e8f0" }}>
              <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>🏖 الإجازات ({PERIODS[period]})</div>
              {s.myLeaves.length===0 ? (
                <div style={{ fontSize:12, color:"#94a3b8", textAlign:"center", padding:"10px 0" }}>لا توجد إجازات في هذه الفترة</div>
              ) : s.myLeaves.map(l=>{
                const days = Math.round((new Date(l.end)-new Date(l.start))/86400000)+1;
                return (
                  <div key={l.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", background:"#f8fafc", borderRadius:8, marginBottom:5, fontSize:12 }}>
                    <span style={{ background: l.type==="sick"||l.type==="emergency"?"#fef2f2":"#fffbeb", color: l.type==="sick"||l.type==="emergency"?"#dc2626":"#d97706", borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:700 }}>{LEAVE_TYPES[l.type]}</span>
                    <span style={{ flex:1 }}>{l.start} ← {l.end}</span>
                    <strong>{days} أيام</strong>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })() : (
        /* OVERVIEW — compact list of all doctors (current month) */
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:14 }}>
            <div style={{ background:"#fff", border:"1px solid #cdddec", borderTop:"3px solid #1e3a5f", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>📊</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#1e3a5f" }}>{avgTasks.toFixed(1)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>متوسط العبء/طبيب</div>
            </div>
            <div style={{ background:"#fff", border:"1px solid #bfdbfe", borderTop:"3px solid #1d4ed8", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>🌙</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#1d4ed8" }}>{overview.reduce((a,x)=>a+x.s.fixedNights+x.s.extraNights,0)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>إجمالي الدوام المسائي</div>
            </div>
            <div style={{ background:"#fff", border:"1px solid #bbf7d0", borderTop:"3px solid #15803d", borderRadius:12, padding:14, textAlign:"center" }}>
              <div style={{ fontSize:24 }}>🔄</div>
              <div style={{ fontSize:26, fontWeight:800, color:"#15803d" }}>{overview.reduce((a,x)=>a+x.s.totalCovs,0)}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>إجمالي التغطيات</div>
            </div>
          </div>

          <div style={{ fontSize:11, color:"#94a3b8", marginBottom:8 }}>النظرة العامة للشهر الحالي — مرتّبة حسب العبء. اضغط أي طبيب لتفاصيله.</div>
          <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
            {overview.map(({doc,s})=>{
              const cls = classify(s.tasks);
              const vsAvg = s.tasks - avgTasks;
              return (
                <div key={doc.id} onClick={()=>setSelId(String(doc.id))} style={{ display:"flex", alignItems:"center", gap:10, background:"#fff", border:`1px solid ${cls.border}`, borderRadius:9, padding:"8px 12px", cursor:"pointer", borderRight:`4px solid ${doc.color}` }}>
                  <div style={{ ...AV, background:doc.color, width:30, height:30, fontSize:10 }}>{sn(doc.name).slice(0,2)}</div>
                  <div style={{ flex:1, fontWeight:700, fontSize:13 }}>{doc.name}</div>
                  <div style={{ display:"flex", gap:4, fontSize:10 }}>
                    <span style={{ color:"#1d4ed8" }}>🌙{s.fixedNights+s.extraNights}</span>
                    <span style={{ color:"#15803d" }}>🔄{s.totalCovs}</span>
                    {s.absenceDays>0 && <span style={{ color:"#dc2626" }}>🏥{s.absenceDays}</span>}
                  </div>
                  <div style={{ background:cls.bg, color:cls.color, border:`1px solid ${cls.border}`, borderRadius:14, padding:"3px 10px", fontSize:12, fontWeight:800, minWidth:28, textAlign:"center" }}>{s.tasks}</div>
                  <span style={{ fontSize:9, fontWeight:700, minWidth:60, textAlign:"left", color: Math.abs(vsAvg)<0.5?"#94a3b8":vsAvg>0?"#dc2626":"#15803d" }}>
                    {Math.abs(vsAvg)<0.5?"≈ المتوسط":vsAvg>0?`▲ +${vsAvg.toFixed(1)}`:`▼ ${vsAvg.toFixed(1)}`}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// SHARED STYLES
// ══════════════════════════════════════════════════════
const AV = { width:36, height:36, borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:13, color:"#fff", flexShrink:0 };
const SEL = { width:"100%", padding:"7px 8px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, background:"#fff", outline:"none", boxSizing:"border-box" };
const Btn = {
  primary:   { background:"linear-gradient(135deg,#1e3a5f,#3b6ca8)", border:"none", borderRadius:7, color:"#fff", fontWeight:700, padding:"7px 14px", cursor:"pointer", fontSize:12 },
  secondary: { background:"#f1f5f9", border:"1px solid #e2e8f0", borderRadius:7, color:"#64748b", fontWeight:600, padding:"7px 14px", cursor:"pointer", fontSize:12 },
  danger:    { padding:"5px 9px", background:"#fef2f2", border:"1px solid #fecaca", borderRadius:6, color:"#dc2626", cursor:"pointer", fontSize:11 },
