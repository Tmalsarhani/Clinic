<head>

<style>
  :root{
    --primary:#0FA39A; --primary-d:#0B7E77; --accent:#14B8A6; --eve:#6D5DF6;
    --bg:#EEF3F8; --card:#ffffff; --line:#E4ECF3; --line2:#EEF3F8;
    --text:#34465A; --sub:#64748b; --muted:#8A9BB0;
    --ok:#16A34A; --warn:#E0982B; --err:#E5484D;
    --shadow:0 1px 2px rgba(16,40,70,.04), 0 8px 24px rgba(16,40,70,.06);
    --shadow-lg:0 14px 38px rgba(16,40,70,.12);
    --r:18px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'IBM Plex Sans Arabic','Tajawal',Tahoma,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  #root{ min-height:100vh; }
  .loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--sub); direction:rtl; font-size:15px; font-family:'IBM Plex Sans Arabic',Tahoma; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#c3d2e0; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#aebccb; }
  button,input,select,textarea{ font-family:inherit; }
  button{ transition:all .15s ease; cursor:pointer; }
  button:active{ transform:scale(.98); }
  input,select{ outline:none; }
  input:focus,select:focus{ border-color:var(--primary)!important; box-shadow:0 0 0 4px rgba(15,163,154,.14); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .fade{ animation:fade .25s ease; }
  /* ── full web layout ── */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:250px; flex-shrink:0; background:#fff; border-left:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 14px; }
  .brand{ display:flex; align-items:center; gap:11px; padding:6px 10px 20px; }
  .navbtn{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; border:none; background:none; font-size:14.5px; font-weight:600; color:var(--sub); cursor:pointer; text-align:start; width:100%; margin-bottom:3px; }
  .navbtn .ic{ font-size:18px; width:22px; text-align:center; }
  .navbtn.active{ background:#ecfdf5; color:var(--primary); }
  .navbtn:not(.active):hover{ background:#f3f6f9; }
  .collapse-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:9px; margin-bottom:12px; border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--sub); font-size:13.5px; font-weight:800; cursor:pointer; }
  .collapse-btn:hover{ background:#f3f6f9; color:var(--primary); }
  .collapse-btn .cic{ font-size:18px; line-height:1; }
  .sidebar.collapsed{ width:74px; padding:18px 9px; }
  .sidebar.collapsed .brand{ justify-content:center; padding:6px 0 18px; }
  .sidebar.collapsed .brand-text, .sidebar.collapsed .nav-label, .sidebar.collapsed .user-text, .sidebar.collapsed .collapse-txt{ display:none; }
  .sidebar.collapsed .navbtn{ justify-content:center; padding:12px 0; gap:0; }
  .sidebar.collapsed .collapse-btn{ padding:9px 0; }
  .draftbar{ position:fixed; inset-inline:0; bottom:0; z-index:60; padding:10px 14px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 22px rgba(16,40,60,.10); display:flex; gap:8px; align-items:center; }
  @media(max-width:760px){ .draftbar{ bottom:0; } }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ background:#fff; border-bottom:1px solid var(--line); padding:15px 28px; position:sticky; top:0; z-index:40; }
  .topbar h1{ margin:0; font-size:18px; font-weight:700; }
  .topbar p{ margin:2px 0 0; font-size:12.5px; color:var(--sub); }
  .content{ padding:26px 28px; max-width:1160px; width:100%; margin:0 auto; }
  .bottomnav{ display:none; }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; align-items:start; }
  @media (max-width:620px){
    .content{ padding:16px 15px 40px; }
    .grid-cards{ grid-template-columns:1fr; }
  }
  /* ── low-risk polish layer (cosmetic + a11y only) ── */
  html{ -webkit-text-size-adjust:100%; }
  body{ line-height:1.5; -moz-osx-font-smoothing:grayscale; -webkit-tap-highlight-color:transparent; text-rendering:optimizeLegibility; }
  ::selection{ background:rgba(20,184,166,.22); }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled{ cursor:not-allowed; }
  input,select,textarea{ transition:border-color .15s ease, box-shadow .15s ease; }
  .navbtn.active{ box-shadow:inset 3px 0 0 var(--primary); }
  .topbar{ box-shadow:0 1px 0 rgba(16,40,60,.03); }
  @media (max-width:1024px){ .content{ padding:22px 18px; } }
  @supports (padding:max(0px)){ .bottomnav{ padding-bottom:max(env(safe-area-inset-bottom),0px); } }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }

/* ===================== NEW DESIGN SYSTEM (matches approved mockup) ===================== */
:root{
  --surface:#FFFFFF; --surface2:#F6F9FC; --hover:#F0F5FA; --ink:#0D1B2A;
  --primarySoft:#E3F5F2; --eveSoft:#ECEAFE; --okSoft:#E7F6EC; --warnSoft:#FBF1DF; --dangerSoft:#FCEBEC;
  --shadowH:0 6px 16px rgba(16,40,70,.08), 0 16px 40px rgba(16,40,70,.10);
}
html[data-theme="dark"]{
  --bg:#0A111E; --surface:#101B2C; --surface2:#142136; --hover:#172741; --card:#101B2C;
  --ink:#EEF3FA; --text:#B7C4D6; --sub:#8696AD; --muted:#647189; --line:#22324A; --line2:#1B2A40;
  --primarySoft:rgba(15,163,154,.18); --eveSoft:rgba(109,93,246,.20);
  --okSoft:rgba(22,163,74,.18); --warnSoft:rgba(224,152,43,.18); --dangerSoft:rgba(229,72,77,.18);
}
html[data-theme="dark"] body{ background:var(--bg); }
body{ transition:background .3s ease, color .3s ease; }
body{ zoom:1.08; }
@media(max-width:760px){ body{ zoom:1.05; } }

/* layout */
.shell{ display:flex; min-height:100vh; }
.sidebar{ width:264px; flex-shrink:0; background:var(--surface); border-inline-end:1px solid var(--line); border-inline-start:none;
  position:fixed; inset-inline-start:0; top:0; bottom:0; height:100vh; display:flex; flex-direction:column;
  padding:18px 14px; z-index:40; transition:width .28s cubic-bezier(.4,0,.2,1); overflow-y:auto; }
.sidebar.collapsed{ width:80px; padding:18px 10px; }
.main{ flex:1; margin-inline-start:264px; transition:margin .28s cubic-bezier(.4,0,.2,1); min-width:0; }
.sidebar.collapsed ~ .main{ margin-inline-start:80px; }

/* brand */
.brand{ display:flex; align-items:center; gap:11px; padding:6px 8px 16px; }
.brand .logo{ width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--eve));
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(15,163,154,.35); }
.brand .logo svg{ width:22px;height:22px;stroke-width:2; }
.sidebar.collapsed .brand{ justify-content:center; padding:6px 0 16px; }
.sidebar.collapsed .brand-text{ display:none; }

/* nav */
.navlbl{ font-size:10.5px; font-weight:600; color:var(--muted); padding:14px 12px 6px; letter-spacing:.4px; }
.sidebar.collapsed .navlbl{ font-size:0; text-align:center; }
.navlink{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:13px; border:none; background:none;
  color:var(--text); font-family:inherit; font-size:13.5px; font-weight:500; cursor:pointer; width:100%; text-align:start;
  position:relative; transition:background .18s,color .18s; margin-bottom:2px; }
.navlink svg{ width:21px;height:21px;flex-shrink:0;stroke-width:1.9; }
.navlink:hover{ background:var(--hover); color:var(--ink); }
.navlink.active{ background:var(--primarySoft); color:var(--primary); font-weight:600; }
.navlink.active::before{ content:""; position:absolute; inset-inline-end:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:22px; border-radius:4px 0 0 4px; background:var(--primary); }
.navlink .nav-label{ white-space:nowrap; }
.navlink .badge{ margin-inline-start:auto; background:var(--dangerSoft); color:var(--err); font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:20px; }
.sidebar.collapsed .navlink{ justify-content:center; padding:11px 0; gap:0; }
.sidebar.collapsed .navlink .nav-label,.sidebar.collapsed .navlink .badge{ display:none; }
.sidebar.collapsed .navlink.active::before{ inset-inline-end:-10px; }

/* user footer */
.side-foot{ margin-top:auto; padding-top:12px; border-top:1px solid var(--line); }
.uchip{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:13px; }
.uchip .av{ width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-d));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0; }
.uchip .nm{ font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap; }
.uchip .rl{ font-size:11px;color:var(--muted);white-space:nowrap; }
.sidebar.collapsed .uchip .utxt{ display:none; }

/* topbar */
.topbar{ position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding:0 24px; height:66px;
  display:flex; align-items:center; gap:12px; }
.icobtn{ width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;transition:.18s; }
.icobtn:hover{ background:var(--hover); color:var(--ink); }
.icobtn svg{ width:20px;height:20px;stroke-width:1.9; }
.tbsearch{ flex:1; max-width:420px; position:relative; }
.tbsearch input{ width:100%;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);
  padding:0 42px 0 14px;font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:.18s; }
.tbsearch input:focus{ border-color:var(--primary); background:var(--surface); box-shadow:0 0 0 4px var(--primarySoft); }
.tbsearch svg{ position:absolute; inset-inline-start:13px; top:11px; width:20px;height:20px; color:var(--muted); }
.qstats{ display:flex; gap:8px; margin-inline-start:auto; }
.qchip{ display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text);white-space:nowrap; }
.qchip b{ color:var(--ink); } .qchip .dot{ width:8px;height:8px;border-radius:50%; }
.bell{ position:relative; } .bell .n{ position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--err);border:2px solid var(--surface); }
.tog{ width:46px;height:26px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:.25s; }
.tog .k{ position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:.25s;color:var(--warn); }
.tog .k svg{ width:13px;height:13px; }
html[data-theme="dark"] .tog{ background:var(--primary); } html[data-theme="dark"] .tog .k{ inset-inline-end:24px; color:var(--eve); }

.content{ padding:24px 26px 60px; max-width:1320px; }

/* responsive */
.menubtn{ display:none; }
@media (max-width:1080px){ .qstats{ display:none; } }
@media (max-width:760px){
  .sidebar{ transform:translateX(-100%); transition:transform .28s, width .28s; }
  html[dir="rtl"] .sidebar{ transform:translateX(100%); }
  .sidebar.open{ transform:none !important; box-shadow:20px 0 60px rgba(0,0,0,.3); }
  .main{ margin-inline-start:0 !important; }
  .menubtn{ display:flex; }
  .content{ padding:18px 14px 80px; }
}
.scrim2{ display:none; position:fixed; inset:0; background:rgba(8,16,28,.5); z-index:35; }
.scrim2.show{ display:block; }


/* ===== dashboard / component layer ===== */
.grid{ display:grid; gap:18px; }
.g4{ grid-template-columns:repeat(4,1fr); } .g3{ grid-template-columns:repeat(3,1fr); } .g2{ grid-template-columns:repeat(2,1fr); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s; }
.stat{ padding:20px; position:relative; overflow:hidden; }
.stat:hover{ transform:translateY(-3px); box-shadow:var(--shadowH); }
.stat .spine{ position:absolute; inset-inline-start:0; top:18px; bottom:18px; width:4px; border-radius:0 4px 4px 0; }
.stat .ic{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.stat .ic svg{ width:24px; height:24px; stroke-width:1.9; }
.stat .num{ font-size:34px; font-weight:700; color:var(--ink); line-height:1; letter-spacing:-1px; }
.stat .lbl{ font-size:13px; color:var(--muted); margin-top:7px; font-weight:500; }
.stat .delta{ position:absolute; top:20px; inset-inline-end:20px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; }
.up{ background:var(--okSoft); color:var(--ok); } .down{ background:var(--dangerSoft); color:var(--err); } .mut{ background:var(--surface2); color:var(--muted); }
.ctitle{ display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700; color:var(--ink); margin:0 0 4px; }
.csub{ font-size:12px; color:var(--muted); margin:0 0 16px; }
.gauge-wrap{ display:flex; align-items:center; gap:20px; padding:22px; }
.gauge{ position:relative; width:132px; height:132px; flex-shrink:0; }
.gauge .ctr{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.gauge .ctr b{ font-size:28px; font-weight:700; color:var(--ink); letter-spacing:-1px; } .gauge .ctr span{ font-size:11px; color:var(--muted); }
.glegend{ display:flex; flex-direction:column; gap:11px; flex:1; }
.gl{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text); } .gl .d{ width:11px; height:11px; border-radius:4px; } .gl b{ color:var(--ink); margin-inline-start:auto; font-weight:700; }
.fbar{ margin-bottom:14px; } .fbar:last-child{ margin-bottom:0; }
.fbar .top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; } .fbar .top b{ color:var(--ink); font-weight:600; } .fbar .top span{ color:var(--muted); }
.track{ height:9px; border-radius:6px; background:var(--surface2); overflow:hidden; }
.fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,var(--primary),var(--eve)); transform-origin:right; animation:grow 1s cubic-bezier(.2,.7,.2,1); }
@keyframes grow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
.row{ display:flex; align-items:center; gap:13px; padding:12px; border-radius:14px; transition:.18s; }
.row:hover{ background:var(--hover); }
.row .rav{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex-shrink:0; }
.row .nm{ font-size:13.5px; font-weight:600; color:var(--ink); }
.row .mt{ font-size:11.5px; color:var(--muted); }
.tag{ font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap; }
.t-ok{ background:var(--okSoft); color:var(--ok); } .t-warn{ background:var(--warnSoft); color:var(--warn); }
.t-bad{ background:var(--dangerSoft); color:var(--err); } .t-eve{ background:var(--eveSoft); color:var(--eve); } .t-pri{ background:var(--primarySoft); color:var(--primary); }
@media(max-width:920px){ .g4{ grid-template-columns:repeat(2,1fr); } .g3,.g2{ grid-template-columns:1fr; } }
@media(max-width:560px){ .g4{ grid-template-columns:1fr; } }


/* ===== interactive calendar ===== */
.cal-wrap{ display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
.cal-grid2{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.wd{ text-align:center; font-size:14px; font-weight:800; color:var(--muted); padding-bottom:4px; }
.cell{ min-height:150px; border-radius:14px; border:1px solid var(--line); background:var(--surface2); padding:10px; display:flex; flex-direction:column; gap:5px; transition:.16s; position:relative; }
.cell:hover{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primarySoft); }
.cell.ok{ background:var(--okSoft); border-color:transparent; }
.cell.warn{ background:var(--warnSoft); border-color:transparent; }
.cell.bad{ background:var(--dangerSoft); border-color:transparent; }
.cell.drag{ border:2px dashed var(--primary); background:var(--primarySoft); box-shadow:0 0 0 3px var(--primarySoft); }
.cell.dim{ opacity:.32; filter:grayscale(.4); }
.cell .dn{ font-size:15px; font-weight:800; color:var(--ink); min-width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--surface); padding:0 6px; }
.cchip{ display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:5px 9px; font-size:12.5px; font-weight:700; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.04); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cchip .d{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cpool{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); position:sticky; top:84px; }
.cpool h3{ font-size:13px; font-weight:700; color:var(--ink); margin:0 0 3px; }
.cpool .hint{ font-size:11px; color:var(--muted); margin:0 0 12px; line-height:1.5; }
.pchip{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:11px; background:var(--surface2); margin-bottom:6px; cursor:grab; border:1px solid transparent; transition:.15s; }
.pchip:hover{ border-color:var(--primary); background:var(--hover); }
.pchip:active{ cursor:grabbing; }
.pchip .pav{ width:28px; height:28px; border-radius:9px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:10.5px; flex-shrink:0; }
.pchip .pnm{ font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap; }
.pchip .pld{ font-size:10px; color:var(--muted); }
.callegend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--text); }
.callegend span{ display:inline-flex; align-items:center; gap:6px; }
.callegend i{ width:12px; height:12px; border-radius:4px; }
@media(max-width:920px){ .cal-wrap{ grid-template-columns:1fr; } .cpool{ position:static; } }

</style>
</head>
<body>
<div id="root"><div class="loading">جارٍ التحميل…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;



// ══════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const SLOT_COLORS = {
  "":          { bg:"#f1f5f9", text:"#94a3b8", icon:"—",  label:"فراغ" },
  "clinic":    { bg:"#dbeafe", text:"#1d4ed8", icon:"🦷", label:"عيادة" },
  "clinic_am": { bg:"#dbeafe", text:"#1d4ed8", icon:"🦷", label:"عيادة" },
  "clinic_pm": { bg:"#dbeafe", text:"#1d4ed8", icon:"🦷", label:"عيادة" },
  "admin":     { bg:"#ede9fe", text:"#1e3a5f", icon:"📋", label:"إداري" },
  "training":  { bg:"#dcfce7", text:"#15803d", icon:"🎓", label:"تدريب" },

// ══════════════════════════════════════════════════════
const isClinic = t => t === "clinic_am" || t === "clinic_pm" || t === "clinic";
const getSlot  = (doc, di, p) => doc?.sched?.[di]?.[p] || "";
const sn       = n => n.replace("د.","").replace("د ","").trim().slice(0,5);
const wSlots   = doc => {
  let count = 0;
  Object.values(doc.sched||{}).forEach(d => {
    if (d.am && d.am !== "") count += 1;
    if (d.pm && d.pm !== "") count += 1;
  });
  // Evening clinic counts as 2 periods per fixed evening day
  const eveDays = Array.isArray(doc.nightDays) ? doc.nightDays.length : (doc.nightDay !== null && doc.nightDay !== undefined ? 1 : 0);
  count += eveDays * 2;
  return count;
};
const onLeave  = (doc, date, leaves) => !date||!doc ? false : leaves.some(l=>l.doctorId===doc.id&&l.start<=date&&date<=l.end);
// True if doctor is on a leave that CLOSES the clinic on that date (no coverage needed)
const clinicClosedOnLeave = (doc, date, leaves) => !date||!doc ? false : (leaves||[]).some(l=>l.doctorId===doc.id && l.start<=date && date<=l.end && l.clinicClosed!==false);

let HOLIDAYS = {};
const isHoliday = ds => !!(HOLIDAYS && HOLIDAYS[ds]);
const holidayInfo = ds => (HOLIDAYS && HOLIDAYS[ds]) || null;
function eachDate(start,end){ const out=[]; if(!start) return out; let d=new Date(start); const last=new Date(end||start); if(isNaN(d.getTime())||isNaN(last.getTime())) return out; let guard=0; while(d<=last && guard++<400){ out.push(d.toISOString().split("T")[0]); d.setDate(d.getDate()+1); } return out; }
function buildHolidayMap(entries){ const m={}; (entries||[]).forEach(h=>{ eachDate(h.start,h.end).forEach(ds=>{ m[ds]={ name:h.name||"عطلة رسمية", onCall:h.onCall||null }; }); }); return m; }

const dayIdx = dateStr => {
  if(isHoliday(dateStr)) return -1;          // عطلة رسمية → يوم مقفل لا يُحسب
  const d = new Date(dateStr);
  const wd = d.getDay();
  return wd >= 5 ? -1 : wd;
};

const nextWork = dateStr => {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+1);
  while(d.getDay()>=5) d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
};

const fmtDate = dateStr => {
  const d = new Date(dateStr);
  return `${d.getDate()}/${d.getMonth()+1}`;
};

const needsCoverage = (doc, di) => ({
  am: isClinic(getSlot(doc, di, "am")),
  pm: isClinic(getSlot(doc, di, "pm")),
});

function getAvailable(doctors, excludeIds, di, date, period, leaves, nightData, coverageData, allCoverages, includeBusy) {
  // Doctors who are night doctors on THIS date (busy that evening / next morning)
  const nightDocIds = nightData[date]?.doctors || [];
  // Doctors already assigned to the SAME coverage slot
  const covDocIds = (coverageData[date]?.[period] || []);

  // Doctors busy covering ANY slot in nightData that maps to the SAME real time
  // same_am/same_pm -> on `date`; next_am -> on nextWork(date) morning
  const busyCovering = new Set();
  Object.entries(nightData).forEach(([d, nd]) => {
    const covs = nd.coverages || {};
    // covering same-day morning on `date`
    if (d === date && period === "am") (covs.am||[]).forEach(id => busyCovering.add(id));
    if (d === date && period === "pm") (covs.pm||[]).forEach(id => busyCovering.add(id));
    // a next_am coverage assigned on day `d` actually happens on nextWork(d) morning
    if (period === "am" && nextWork(d) === date) (covs.nextAm||[]).forEach(id => busyCovering.add(id));
    // a same-day coverage might coincide with someone's next_am target — already handled above
  });

  // Individual coverages at same date+period
  (allCoverages || []).forEach(c => {
    if (c.date === date && c.period === period) busyCovering.add(c.coverDoctorId);
  });

  // Rest rule: a doctor on evening duty the IMMEDIATELY PRECEDING calendar day is excluded from THIS morning (الراحة لليوم التالي مباشرة فقط؛ لا تنطبق بعد عطلة الجمعة/السبت)
  const restExclude = new Set();
  if (period === "am") { const pc = prevCalDay(date); ((nightData[pc]||{}).doctors||[]).forEach(id => restExclude.add(id)); }

  const allExclude = [...new Set([...excludeIds, ...nightDocIds, ...covDocIds, ...busyCovering, ...restExclude])];
  return doctors
    .filter(d => !allExclude.includes(d.id))
    .map(d => {
      if (onLeave(d, date, leaves)) return { doc: d, status: "leave" };
      const slot = getSlot(d, di, period);
      if (slot === "") return { doc: d, status: "free" };
      if (["admin","training","committee"].includes(slot)) return { doc: d, status: "warn", conflict: slot };
      return { doc: d, status: "busy" };
    })
    .filter(x => includeBusy ? true : x.status !== "busy")
    .sort((a,b) => (({free:0,warn:1,leave:2,busy:3}[a.status]) - ({free:0,warn:1,leave:2,busy:3}[b.status])));
}

function autoFill(year, month, doctors, leaves, nightData) {
  const result = { ...nightData };
  const dim = new Date(year, month+1, 0).getDate();
  const hasNight = d => Array.isArray(d.nightDays) && d.nightDays.length > 0;
  const fd = id => doctors.find(d => d.id === id);
  const fixed = doctors.filter(hasNight);
  const rotate = doctors.filter(d => !hasNight(d));
  const usage = {}; // how many evening shifts each doctor has this month

  // STEP 0: purge any doctor who is on leave from existing assignments
  Object.keys(result).forEach(date => {
    const nd = result[date];
    if (!nd?.doctors?.length) return;
    const kept = nd.doctors.filter(id => { const d = fd(id); return d && !onLeave(d, date, leaves); });
    result[date] = { ...nd, doctors: kept };
  });

  // Count existing usage for ROTATE doctors only (fixed don't count toward fairness)
  Object.values(result).forEach(nd => (nd.doctors||[]).forEach(id => { if(rotate.find(r=>r.id===id)) usage[id] = (usage[id]||0)+1; }));
  rotate.forEach(d => { if(usage[d.id]==null) usage[d.id]=0; });

  for (let day = 1; day <= dim; day++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const di = dayIdx(date);
    if (di < 0) continue;
    const existing = result[date]?.doctors || [];
    // how many evening clinics does this day need? (per-day setting, default 1)
    const need = result[date]?.eveningSlots || 1;

    // Fixed doctors for this weekday take priority for their slot, but never exceed the day's need
    const fixedDocs = fixed.filter(d => d.nightDays.includes(di) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di));
    let chosen = [...new Set([...fixedDocs.map(d=>d.id), ...existing])];
    if (chosen.length > need) chosen = chosen.slice(0, need); // don't add beyond the remaining/needed slots

    // Fill remaining slots with rotate doctors — FAIRNESS FIRST
    const nextDi = dayIdx(nextWork(date));
    const coverageNeed = d => (isClinic(getSlot(d,di,"am"))?1:0) + (isClinic(getSlot(d,di,"pm"))?1:0) + (isClinic(getSlot(d,nextDi,"am"))?1:0);
    const prevWork = (() => { const dt=new Date(date); do { dt.setDate(dt.getDate()-1); } while(dt.getDay()>=5); return dt.toISOString().split("T")[0]; })();
    const workedYesterday = d => (result[prevWork]?.doctors||[]).includes(d.id);

    while (chosen.length < need) {
      const avail = rotate.filter(d => !chosen.includes(d.id) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di))
        .sort((a,b) => {
          // PRIORITY 1: FAIRNESS — least evening shifts this month comes first
          const ua = usage[a.id]||0, ub = usage[b.id]||0;
          if (ua !== ub) return ua - ub;
          // PRIORITY 2: avoid consecutive (worked previous work day)
          const wa = workedYesterday(a)?1:0, wb = workedYesterday(b)?1:0;
          if (wa !== wb) return wa - wb;
          // PRIORITY 3: prefer doctors needing less coverage (fewer clinics to cover)
          return coverageNeed(a) - coverageNeed(b);
        });
      if (!avail.length) break;
      chosen.push(avail[0].id);
      usage[avail[0].id] = (usage[avail[0].id]||0) + 1;
    }

    if (chosen.length) {
      result[date] = { ...(result[date]||{}), doctors: chosen, coverages: result[date]?.coverages || { am: [], pm: [], nextAm: [] }, eveningSlots: need };
    }
  }
  return result;
}

// Detect conflicts: doctor on leave but assigned night/coverage, or double-booked same time
function detectConflicts(doctors, leaves, nightData, coverages) {
  const fd = id => doctors.find(d=>d.id===id);
  const conflicts = [];
  // 1. Night doctor on leave
  Object.entries(nightData).forEach(([date,nd])=>{
    (nd.doctors||[]).forEach(id=>{
      const d = fd(id); if(!d) return;
      if (onLeave(d, date, leaves)) conflicts.push({ type:"leave", date, text:`${d.name} له دوام مسائي يوم ${date} لكنه في إجازة` });
    });
    // coverage doctor on leave
    const covs = nd.coverages||{};
    ["am","pm","nextAm"].forEach(slot=>{
      (covs[slot]||[]).forEach(id=>{
        const d = fd(id); if(!d) return;
        const covDate = slot==="nextAm" ? nextWork(date) : date;
        if (onLeave(d, covDate, leaves)) conflicts.push({ type:"leave", date:covDate, text:`${d.name} يغطّي يوم ${covDate} لكنه في إجازة` });
      });
    });
  });
  // 2. Individual coverage doctor on leave
  (coverages||[]).forEach(c=>{
    const d = fd(c.coverDoctorId); if(!d) return;
    if (onLeave(d, c.date, leaves)) conflicts.push({ type:"leave", date:c.date, text:`${d.name} يغطّي (فردي) يوم ${c.date} لكنه في إجازة` });
  });
  // 3. Double-booked: same doctor covering 2 things same real period
  const slotKey = (date, period) => `${date}__${period}`;
  const booking = {}; // key -> [names]
  const addBooking = (date, period, id, label) => {
    const d = fd(id); if(!d) return;
    const k = slotKey(date, period);
    if(!booking[k]) booking[k] = [];
    if (booking[k].find(x=>x.id===id)) {
      conflicts.push({ type:"double", date, text:`${d.name} مسجّل مرتين في ${period==="am"?"صباح":"ظهر"} ${date}` });
    }
    booking[k].push({ id, label });
  };
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (covs.am||[]).forEach(id=>addBooking(date,"am",id));
    (covs.pm||[]).forEach(id=>addBooking(date,"pm",id));
    (covs.nextAm||[]).forEach(id=>addBooking(nextWork(date),"am",id));
  });
  (coverages||[]).forEach(c=>addBooking(c.date, c.period, c.coverDoctorId));

  // 4. Same clinic period covered TWICE: night-schedule coverage + individual coverage for same absent doctor
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (nd.doctors||[]).forEach(nightId=>{
      ["am","pm"].forEach(slot=>{
        const nightCovered = (covs[slot]||[]).length > 0;
        // individual coverage for the SAME night doctor, same date, same period
        const indiv = (coverages||[]).filter(c=>c.date===date && c.period===slot && c.absentId===nightId);
        if (nightCovered && indiv.length) {
          const nm = fd(nightId)?.name||"";
          conflicts.push({ type:"double", date, text:`عيادة ${nm} (${slot==="am"?"صباح":"ظهر"}) ${date} مُغطّاة مرتين: مرة في جدول الدوام ومرة بتغطية فردية` });
        }
      });
    });
  });
  // 5. Absent doctor (individual coverage) is themselves assigned a duty same day
  // Helper: find the previous workday's date string (whose nextAm coverage lands on `date`)
  const prevWorkOf = (dateStr) => {
    const d = new Date(dateStr);
    for (let i=1;i<=4;i++){
      const p = new Date(d); p.setDate(d.getDate()-i);
      const wd = p.getDay(); // 0=Sun..6=Sat ; skip Fri(5),Sat(6)
      if (wd!==5 && wd!==6) return `${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`;
    }
    return null;
  };
  (coverages||[]).forEach(c=>{
    if (!c.absentId) return;
    const absId = c.absentId;
    const nm = fd(absId)?.name||"";
    // a) assigned as a cover doctor in another individual coverage same date
    const asCover = (coverages||[]).some(o=>o.date===c.date && o.coverDoctorId===absId);
    // b) assigned in night-schedule coverage same date (am/pm of today)
    const nd = nightData[c.date]||{}; const cv = nd.coverages||{};
    const inTodayCov = [...(cv.am||[]),...(cv.pm||[])].includes(absId);
    // b2) assigned to cover "tomorrow morning" from the PREVIOUS workday's record (lands on c.date)
    const pw = prevWorkOf(c.date);
    const prevNd = pw ? (nightData[pw]||{}) : {};
    const inNextAmCov = ((prevNd.coverages||{}).nextAm||[]).includes(absId);
    // c) has a night shift same date
    const hasNight = (nd.doctors||[]).includes(absId);
    if (asCover || inTodayCov || inNextAmCov || hasNight) {
      conflicts.push({ type:"absent-busy", date:c.date, text:`${nm} مسجّل غائباً يوم ${c.date} لكنه مكلّف بتغطية/دوام نفس اليوم — راجع التكليف` });
    }
  });
  return conflicts;
}

// ══════════════════════════════════════════════════════
// UNIFIED ENGINE — single source of truth for a day
// For each real working period (am, pm) it computes:
//   - clinics that must be staffed (each doctor with a clinic that day)
//   - who is OCCUPIED that period (their own clinic, a coverage duty, an evening shift)
//   - whether each clinic-owner is ABSENT/on-leave (clinic open) → needs a cover
//   - GAPS (uncovered open clinics) + CONFLICTS (double-booked / absent-but-assigned)
//   - SUGGESTIONS (least-loaded free doctors) for each gap
// "evening" = the night shift itself. A doctor's own daytime clinic still needs cover when
//   they take an evening shift OR cover OR are absent (per user rule #1).
// ══════════════════════════════════════════════════════
function analyzeDay(date, doctors, leaves, nightData, coverages, loadMap, restRule=true) {
  const di = dayIdx(date);
  if (di < 0) return { gaps:[], conflicts:[], periods:{} };
  const fd = id => doctors.find(d=>d.id===id);
  const nd = nightData[date] || {};
  const covs = nd.coverages || {};
  const dayIndiv = (coverages||[]).filter(c=>c.date===date);

  // previous workday's nextAm coverage duties land on THIS morning
  const prevWorkOf = (ds) => { const d=new Date(ds); for(let i=1;i<=4;i++){const p=new Date(d);p.setDate(d.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null; };
  const pw = prevWorkOf(date);
  const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];
  const prevEveningDocs = (nightData[prevCalDay(date)]?.doctors)||[]; // مسائيو الأمس (اليوم التقويمي السابق مباشرة) → يُراحون هذا الصباح

  // ---- Build occupancy: who is busy each period, and why ----
  // periods we track for staffing: am, pm
  const PERS = ["am","pm"];
  const occupied = { am:{}, pm:{}, evening:{} }; // docId -> reason
  const mark = (per, id, reason) => { if(id==null) return; (occupied[per][id] = occupied[per][id]||[]).push(reason); };

  // evening shift holders (occupied all day effectively for their own daytime clinics)
  (nd.doctors||[]).forEach(id=>mark("evening", id, "دوام مسائي"));

  // each doctor's own clinic occupies them that period (unless their clinic is closed by leave, or they're absent/evening — those make it a GAP not occupancy)
  doctors.forEach(d=>{
    PERS.forEach(per=>{
      if (isClinic(getSlot(d,di,per))) mark(per, d.id, "عيادته");
    });
  });

  // night-schedule coverage duties (am/pm today, + nextAm from prev day lands on am)
  (covs.am||[]).forEach(id=>mark("am", id, "تغطية دوام مسائي"));
  (covs.pm||[]).forEach(id=>mark("pm", id, "تغطية دوام مسائي"));
  prevNextAm.forEach(id=>mark("am", id, "تغطية صباح الغد (من أمس)"));

  // individual coverage duties
  dayIndiv.forEach(c=>{ if(c.period==="am"||c.period==="pm") mark(c.period, c.coverDoctorId, "تغطية فردية"); else if(c.period==="evening") mark("evening", c.coverDoctorId, "تغطية مسائية"); });

  // ---- Determine absence per doctor (individual coverage with absentId, or on-leave) ----
  const absentReason = {}; // docId -> reason string
  doctors.forEach(d=>{ if(onLeave(d,date,leaves)) absentReason[d.id] = clinicClosedOnLeave(d,date,leaves) ? "إجازة (عيادة مغلقة)" : "إجازة (عيادة قائمة)"; });

  // ---- Compute gaps & conflicts per period ----
  const gaps = [];      // {date,di,period,ownerId,reason}
  const conflicts = []; // {type,date,text}
  const periods = { am:[], pm:[], evening:[] };

  // Doctors busy in the EVENING this day = original night doctors + anyone with an evening individual coverage
  const eveningBusy = new Set([...(nd.doctors||[])]);
  dayIndiv.forEach(c=>{ if(c.period==="evening") eveningBusy.add(c.coverDoctorId); });

  PERS.forEach(per=>{
    // each doctor who HAS a clinic this period
    doctors.forEach(d=>{
      if (!isClinic(getSlot(d,di,per))) return;
      const closed = clinicClosedOnLeave(d,date,leaves);
      // is this clinic owner unavailable to run their own clinic?
      const ownerEvening = eveningBusy.has(d.id);                   // took evening shift OR evening coverage
      const ownerAbsent  = !!absentReason[d.id] && !closed;          // absent/leave-open
      const ownerCovering = (occupied[per][d.id]||[]).some(r=>r.includes("تغطية")); // busy covering elsewhere same period
      const postEveningRest = restRule && per==="am" && prevEveningDocs.includes(d.id) && !ownerEvening && !ownerAbsent; // عمل مساءً أمس → عيادته صباح اليوم تحتاج تغطية (حسب إعداد قاعدة الراحة)
      const mustCover = (ownerEvening || ownerAbsent || ownerCovering || postEveningRest) && !closed;
      // who is assigned to cover THIS owner's clinic this period?
      const coversForOwner = [];
      // individual coverage explicitly targeting this owner+period
      dayIndiv.forEach(c=>{ if(c.period===per && c.absentId===d.id) coversForOwner.push(c.coverDoctorId); });
      // night-schedule coverage: if owner is a night doctor, their am/pm slot is covered by covs[per]
      if ((nd.doctors||[]).includes(d.id)) { const ids = per==="am"?[...(covs.am||[]),...prevNextAm]:(covs.pm||[]); if(ids.length) coversForOwner.push(...ids); }
      if (closed) {
        periods[per].push({ ownerId:d.id, state:"closed" });
        return;
      }
      if (mustCover && coversForOwner.length===0) {
        gaps.push({ date, di, period:per, ownerId:d.id, reason: ownerEvening?"دوام/تغطية مسائية":ownerAbsent?absentReason[d.id]:postEveningRest?"راحة بعد المسائي (أمس)":"مكلّف بتغطية أخرى" });
        periods[per].push({ ownerId:d.id, state:"gap" });
      } else if (mustCover) {
        periods[per].push({ ownerId:d.id, state:"covered", coverIds:coversForOwner });
      } else {
        periods[per].push({ ownerId:d.id, state:"self" }); // runs own clinic
      }
    });

    // CONFLICT: a doctor occupied 2+ ways same period (e.g., own clinic + a coverage duty, or two coverages)
    Object.entries(occupied[per]).forEach(([id,reasons])=>{
      const real = reasons.filter((r,i)=>reasons.indexOf(r)===i);
      // own clinic + covering at same time = conflict (can't be two places)
      const hasOwn = reasons.includes("عيادته");
      const hasCover = reasons.some(r=>r.includes("تغطية"));
      if (hasOwn && hasCover) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} لديه عيادته و مكلّف بتغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
      else if (reasons.length>=2 && reasons.filter(r=>r.includes("تغطية")).length>=2) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} مكلّف بأكثر من تغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
    });
  });

  // CONFLICT: absent doctor still assigned a duty (any period)
  Object.keys(absentReason).forEach(idStr=>{
    const id=+idStr;
    const dutyAm = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const dutyPm = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    const inNight = (nd.doctors||[]).includes(id);
    const dutyEve = inNight || (occupied.evening[id]||[]).some(r=>r.includes("تغطية"));
    if (dutyAm||dutyPm||dutyEve) conflicts.push({ type:"absent-busy", date, docId:id, inNight, text:`${fd(id)?.name||""} غائب/في إجازة يوم ${fmtDate(date)} لكنه مكلّف بتغطية/دوام نفس اليوم` });
  });

  // CONFLICT (RULE: one day = one task): evening-busy doctor also has a daytime coverage duty same day
  eveningBusy.forEach(id=>{
    const amDuty = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const pmDuty = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    if (amDuty||pmDuty) conflicts.push({ type:"evening-plus-cover", date, text:`${fd(id)?.name||""} له دوام/تغطية مسائية ومكلّف بتغطية نهارية نفس اليوم (${fmtDate(date)}) — غير مسموح` });
  });

  // ---- Suggestions for each gap: least-loaded, free that period, not absent, not the owner ----
  gaps.forEach(g=>{
    const busy = new Set(Object.keys(occupied[g.period]).map(Number));
    const prevEve = g.period==="am" ? new Set(((nightData[prevCalDay(date)]||{}).doctors)||[]) : new Set();
    const cands = doctors.filter(d=>
      d.id!==g.ownerId &&
      !busy.has(d.id) &&
      !absentReason[d.id] &&
      !prevEve.has(d.id) &&
      !onLeave(d,date,leaves) &&
      !(d.blockedDays||[]).includes(g.di)
    );
    cands.sort((a,b)=>((loadMap&&loadMap[a.id])||0)-((loadMap&&loadMap[b.id])||0));
    g.suggestions = cands.slice(0,3).map(d=>d.id);
  });

  return { gaps, conflicts, periods, occupied, absentReason };
}

// ─── CAPP 001 Physician Job Planning: Supportive Sessions (SS) by admin position ───
// Week = 10 sessions. Direct (CCS) target = 10 − SS (سلّم المناصب الإدارية — الملحق المرفق)

  { code:"H-1",  ss:7, ar:"مدير تنفيذي / مساعد COO / مدير تنفيذي مشارك" },

  { code:"H-5B", ss:1, ar:"بلا منصب إداري — غير استشاري" },

const POS_SS = Object.fromEntries(ADMIN_POS.map(p=>[p.code,p.ss]));
const POS_AR = Object.fromEntries(ADMIN_POS.map(p=>[p.code,p.ar]));
const POS_MIGRATE = { head:"H-4", chairperson:"H-3", director:"H-2" };
const normPos = (code,doc) => { if(POS_SS[code]!=null) return code; if(POS_MIGRATE[code]) return POS_MIGRATE[code]; return rankOf(doc)==="consultant"?"H-5A":"H-5B"; };
const posLabel = (code,doc) => { const c=normPos(code,doc); return `${c} · ${POS_AR[c]}`; };
const posSS = (code,doc) => POS_SS[normPos(code,doc)];
// العبء الوظيفي = هدف فترات الرعاية المباشرة أسبوعياً = ١٠ − SS
const directTarget = doc => 10 - posSS(doc?.adminPosition, doc);

// الفترات التي تُحسب Direct (رعاية مباشرة) — التدريب معتمد Direct بقرار القسم
const DIRECT_SLOTS = ["clinic","clinic_am","clinic_pm","virtual","audit","training"]; // الرعاية المباشرة
const SUPPORT_SLOTS = ["admin","committee"]; // الدعم: الإدارة واللجان
// previous working day (Sun–Thu) before a given date
const prevWorkDay = ds => { const dd=new Date(ds); for(let i=1;i<=4;i++){ const p=new Date(dd); p.setDate(dd.getDate()-i); if(p.getDay()!==5&&p.getDay()!==6) return `${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`; } return null; };
// اليوم التقويمي السابق مباشرة (لقاعدة الراحة بعد المسائي — لا يقفز فوق الجمعة/السبت)
const prevCalDay = ds => { const dd=new Date(ds); dd.setDate(dd.getDate()-1); return `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`; };

// ═══ الرعاية المباشرة = عدد الفترات الفعلية التي اشتغلها الطبيب ═══
// الرعاية المباشرة: عيادة، افتراضي، تدريب، تدقيق   |   الدعم: إدارة، لجان   |   الفراغ: لا يُحسب
// القاعدة: اشتغل الفترة = +1 · غاب = لا تُحسب · غُطّيت عنه = لا تُحسب له · تغطية أدّاها = +1 له
const CLINIC_SLOTS = ["clinic","clinic_am","clinic_pm","virtual"]; // العيادات التي قد تحتاج تغطية
function doctorSessions(doctor, dates, nightData, coverages, leaves) {
  let direct=0, support=0, covers=0, eveningFixed=0, eveningExtra=0, absentCovered=0;
  if (!doctor) return { direct:0, care:0, support:0, supportive:0, full:0, attended:0, covers:0, evening:0, eveningFixed:0, eveningExtra:0, absentCovered:0 };
  (dates||[]).forEach(date => {
    const di = dayIdx(date); if (di < 0) return;
    const nd = nightData[date] || {}; const c = nd.coverages || {};
    const onLv = onLeave(doctor, date, leaves||[]);
    const pw = prevWorkDay(date);
    const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm || []) : [];
    const dind = (coverages||[]).filter(x => x.date === date);
    const fixedEveHere = (doctor.nightDays||[]).includes(di);          // عيادة مسائية ثابتة (من جدول الطبيب)
    const assignedEve  = (nd.doctors||[]).includes(doctor.id);          // مُسند مسائياً في صفحة الدوام
    if (fixedEveHere && !onLv) eveningFixed += 1;                        // ثابت → رعاية (×2)
    if (assignedEve && !fixedEveHere && !onLv) eveningExtra += 1;        // فوق الثابت → مسائي إضافي (×2)
    const worksEve = fixedEveHere || assignedEve;
    if (!worksEve) {
      ["am","pm"].forEach(per => {
        const slot = getSlot(doctor, di, per);
        if (!slot) return;                                       // الفراغ لا يُحسب
        const isCare = DIRECT_SLOTS.includes(slot);
        const coveredAway = dind.some(x => x.period===per && x.absentId===doctor.id); // غُطّيت عنه
        if (onLv)        { if (isCare) absentCovered += 1; return; }   // غاب → لا تُحسب له
        if (coveredAway) { if (isCare) absentCovered += 1; return; }   // غطّى مكانه زميل → لا تُحسب له
        if (isCare) direct += 1;                                  // عيادة فعلية اشتغلها
        else if (SUPPORT_SLOTS.includes(slot)) support += 1;      // دعم (إدارة/لجان)
      });
    }
    // التغطيات التي أدّاها تُضاف له
    (c.am||[]).forEach(id => { if (id===doctor.id) covers += 1; });
    (c.pm||[]).forEach(id => { if (id===doctor.id) covers += 1; });
    prevNextAm.forEach(id => { if (id===doctor.id) covers += 1; });
    dind.forEach(x => { if (x.coverDoctorId===doctor.id) covers += 1; });
  });
  const evening = eveningFixed + eveningExtra;
  const care = direct + covers + eveningFixed*2 + eveningExtra*2;   // الرعاية = نهاري + تغطيات + (مسائي ثابت + إضافي)×2
  const total = care + support;
  return { direct, care, carePoints:care, daytimeCare:direct, eveningCare:evening*2, fixedCare:eveningFixed*2, extraEveCare:eveningExtra*2, total, support, supportive:support, full:total, attended:direct, covers, evening, eveningFixed, eveningExtra, absentCovered };
}

// Workload per doctor for a month, by ACTUAL worked periods.
// Rules: each worked period = 1; empty period = 0; evening shift = 2; coverage performed = 1.
// A doctor's own clinic period is NOT counted if it was covered by someone else, or the doctor is absent/on-leave.
function computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves) {
  const load = {}; doctors.forEach(d=>load[d.id]=0);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const fd = id => doctors.find(x=>x.id===id);

  // collect all working dates in the month (from nightData + coverages + every weekday with clinics)
  const dates = new Set();
  Object.keys(nightData||{}).forEach(d=>{ if(inM(d)) dates.add(d); });
  (coverages||[]).forEach(c=>{ if(inM(c.date)) dates.add(c.date); });
  // also include all weekdays of the month so own-clinic periods are counted even with no night/coverage
  const dim = new Date(year, monthIdx+1, 0).getDate();
  for(let d=1; d<=dim; d++){ const ds=`${year}-${String(monthIdx+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayIdx(ds)>=0) dates.add(ds); }

  dates.forEach(date=>{
    const di = dayIdx(date); if(di<0) return;
    const nd = nightData[date]||{}; const covs = nd.coverages||{};
    const prevWorkOf = (ds)=>{const dd=new Date(ds);for(let i=1;i<=4;i++){const p=new Date(dd);p.setDate(dd.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null;};
    const pw = prevWorkOf(date);
    const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];
    const dayIndiv = (coverages||[]).filter(c=>c.date===date);

    // 1) evening shift = +2
    (nd.doctors||[]).forEach(id=>{ load[id]=(load[id]||0)+2; });

    // 2) own clinic periods actually worked
    doctors.forEach(d=>{
      ["am","pm"].forEach(per=>{
        if (!isClinic(getSlot(d,di,per))) return; // empty/admin/etc → 0
        // is this period covered by someone else, or doctor unavailable?
        const onLv = onLeave(d,date,leaves||[]);
        const isEvening = (nd.doctors||[]).includes(d.id);
        const indivCoveredForThis = dayIndiv.some(c=>c.period===per && c.absentId===d.id);
        const nightCoveredForThis = isEvening && (per==="am" ? [...(covs.am||[]),...prevNextAm].length>0 : (covs.pm||[]).length>0);
        const coveredElsewhere = onLv || indivCoveredForThis || nightCoveredForThis;
        if (!coveredElsewhere) load[d.id]=(load[d.id]||0)+1; // worked own clinic
      });
    });

    // 3) coverage duties performed = +1 each
    (covs.am||[]).forEach(id=>load[id]=(load[id]||0)+1);
    (covs.pm||[]).forEach(id=>load[id]=(load[id]||0)+1);
    prevNextAm.forEach(id=>load[id]=(load[id]||0)+1);
    dayIndiv.forEach(c=>{ load[c.coverDoctorId]=(load[c.coverDoctorId]||0)+1; });
  });
  return load;
}

// Given a load map, return a function that labels a doctor's load relative to peers
function makeLoadLabeler(loadMap) {
  const vals = Object.values(loadMap||{}).filter(v=>v>0).sort((a,b)=>a-b);
  if (!vals.length) return () => ({ icon:"⚪", text:"—", val:0 });
  const lo = vals[Math.floor(vals.length/3)] || vals[0];
  const hi = vals[Math.floor(vals.length*2/3)] || vals[vals.length-1];
  return (id) => {
    const v = loadMap[id]||0;
    if (v===0) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v<=lo) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v>=hi) return { icon:"🔴", text:"الأكثر عبئاً", val:v };
    return { icon:"🟡", text:"متوسط", val:v };
  };
}

// Analyze every filled day in a month → aggregate gaps + conflicts
function analyzeMonth(year, monthIdx, doctors, leaves, nightData, coverages, restRule=true) {
  const load = computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const allGaps=[], allConflicts=[];
  const dates = new Set([...Object.keys(nightData||{}), ...(coverages||[]).map(c=>c.date)].filter(inM));
  [...dates].sort().forEach(date=>{
    const r = analyzeDay(date, doctors, leaves, nightData, coverages, load, restRule);
    allGaps.push(...r.gaps); allConflicts.push(...r.conflicts);
  });
  return { gaps:allGaps, conflicts:allConflicts, load };
}

// ════════ Toast ════════
function Toast({ toast }) {
  if (!toast) return null;
  const bg = toast.kind==="err"?C.err:toast.kind==="warn"?C.warn:C.primary;
  return <div style={{ position:"fixed", bottom:84, insetInlineStart:"50%", transform:"translateX(50%)", background:bg, color:"#fff", padding:"11px 20px", borderRadius:12, fontSize:13.5, fontWeight:600, zIndex:999, boxShadow:"0 8px 24px rgba(0,0,0,.18)" }}>{toast.msg}</div>;
}

// ════════ Empty state ════════
function Empty({ icon, title, hint }) {
  return <div style={{ textAlign:"center", padding:"40px 20px", color:C.muted }}>
    <div style={{ fontSize:34, marginBottom:8 }}>{icon}</div>
    <div style={{ fontSize:15, fontWeight:700, color:C.sub }}>{title}</div>
    {hint && <div style={{ fontSize:12.5, marginTop:5 }}>{hint}</div>}
  </div>;
}

// ════════ Doctor avatar ════════
function Avatar({ doc, size=30 }) {
  return <span style={{ width:size, height:size, borderRadius:"50%", background:doc.color, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:size*0.34, fontWeight:700, flexShrink:0 }}>{sn(doc.name).slice(0,2)}</span>;
}

// ════════ Kebab menu (⋮ options) ════════
function Kebab({ items }) {
  const [open,setOpen] = useState(false);
  return <span style={{ position:"relative", display:"inline-block" }}>
    <button onClick={e=>{ e.stopPropagation(); setOpen(o=>!o); }} style={{ background:"none", border:"none", padding:"4px 9px", fontSize:19, color:C.muted, cursor:"pointer", lineHeight:1, borderRadius:8 }}>⋮</button>
    {open && <>
      <div onClick={e=>{ e.stopPropagation(); setOpen(false); }} style={{ position:"fixed", inset:0, zIndex:60 }} />
      <div onClick={e=>e.stopPropagation()} style={{ position:"absolute", insetInlineEnd:0, top:"100%", marginTop:4, background:"var(--surface)", border:`1px solid ${C.line}`, borderRadius:12, boxShadow:"0 10px 30px rgba(16,40,60,.15)", zIndex:61, minWidth:160, overflow:"hidden" }}>
        {items.filter(Boolean).map((it,i,arr)=>(
          <button key={i} onClick={e=>{ e.stopPropagation(); setOpen(false); it.onClick(); }} style={{ display:"flex", alignItems:"center", gap:9, width:"100%", textAlign:"start", background:"none", border:"none", borderBottom: i<arr.length-1?`1px solid ${C.line2}`:"none", padding:"11px 14px", fontSize:13, fontWeight:600, color:it.danger?C.err:C.text, cursor:"pointer" }}>
            <span style={{ fontSize:14 }}>{it.icon}</span>{it.label}
          </button>
        ))}
      </div>
    </>}
  </span>;
}

// ════════ Color-coded coverage picker ════════
const ST_COLOR = s => s==="free" ? {bg:"#ecfdf5",bd:"#10b981",fg:"#047857",t:"متفرّغ"} : s==="warn" ? {bg:"#fffbeb",bd:"#f59e0b",fg:"#b45309",t:"التزام"} : s==="busy" ? {bg:"#eef2f7",bd:"#94a3b8",fg:"#475569",t:"في عيادته"} : {bg:"#fef2f2",bd:"#ef4444",fg:"#b91c1c",t:"إجازة"};
const SLOT_COMMIT = { clinic:"عيادة", clinic_am:"عيادة", clinic_pm:"عيادة", virtual:"افتراضي", audit:"تدقيق", training:"تدريب", admin:"إداري" };
function CoverPicker({ list, cur, onPick }) {
  const [ask,setAsk] = useState(null);
  if(!list.length) return <div style={{ fontSize:11.5, color:C.err, fontWeight:600 }}>لا يوجد طبيب</div>;
  const meta = a => a.status==="free" ? {dot:"🟢", t:a.load>0?("متاح · عبء "+a.load):"متاح"}
    : a.status==="warn" ? {dot:"🟠", t:a.commit?`التزام (${a.commit})`:"التزام"}
    : a.status==="busy" ? {dot:"⚪", t:a.busyType?`لديه ${a.busyType}`:"لديه عيادة"}
    : {dot:"🔴", t:"إجازة"};
  const choose2 = id => { if(!id) return; const a=list.find(x=>x.doc.id===id); if(!a) return; if(a.status==="free") onPick(a.doc.id); else setAsk(a); };
  return <>
    <select value="" onChange={e=>choose2(+e.target.value)} style={{ ...sIn, padding:"9px 11px", fontSize:13 }}>
      <option value="">— اختر بديلاً —</option>
      {list.map(a=>{ const m=meta(a); return <option key={a.doc.id} value={a.doc.id}>{m.dot} د.{a.doc.name} — {m.t}</option>; })}
    </select>
    {ask && <div onClick={()=>setAsk(null)} style={{ position:"fixed", inset:0, background:"rgba(15,30,45,.45)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"var(--surface)", borderRadius:16, padding:20, maxWidth:330, width:"100%", boxShadow:"0 20px 60px rgba(0,0,0,.3)" }}>
        <div style={{ fontSize:15, fontWeight:800, marginBottom:8 }}>⚠️ تنبيه تعارض</div>
        <div style={{ fontSize:13, color:C.text, lineHeight:1.7, marginBottom:16 }}>د. {ask.doc.name} {ask.status==="leave"?"في إجازة":ask.status==="busy"?`لديه ${ask.busyType||"عيادة"} في هذا الوقت`:"لديه التزام"+(ask.commit?` (${ask.commit})`:"")}.<br/>تكليفه يُحدث تعارضاً في الجدول. هل يوافق رئيس القسم على التكليف؟</div>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={()=>setAsk(null)} style={{ ...sGhost, flex:1, padding:"10px" }}>إلغاء</button>
          <button onClick={()=>{ onPick(ask.doc.id); setAsk(null); }} style={{ ...sBtn(C.primary), flex:1, padding:"10px" }}>نعم، كلّفه</button>
        </div>
      </div>
    </div>}
  </>;
}

// ════════════════════════════════ DASHBOARD ════════════════════════════════
function CountUp({ n }){ const [v,setV]=useState(0); useEffect(()=>{ let c=0; const t=+n||0; const step=Math.max(1,Math.round(t/26)); const iv=setInterval(()=>{ c+=step; if(c>=t){ c=t; clearInterval(iv); } setV(c); },22); return ()=>clearInterval(iv); },[n]); return <>{v}</>; }
function Ring({ pct }){ const r=54, circ=2*Math.PI*r; const [off,setOff]=useState(circ); useEffect(()=>{ const id=setTimeout(()=>setOff(circ-circ*(Math.max(0,Math.min(100,pct))/100)),120); return ()=>clearTimeout(id); },[pct]); return (
  <svg width="132" height="132" viewBox="0 0 132 132" style={{ transform:"rotate(-90deg)" }}>
    <circle cx="66" cy="66" r={r} fill="none" stroke="var(--surface2)" strokeWidth="13"/>
    <circle cx="66" cy="66" r={r} fill="none" stroke="url(#gaugeGrad)" strokeWidth="13" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} style={{ transition:"stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)" }}/>
    <defs><linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={C.primary}/><stop offset="1" stopColor={C.eve}/></linearGradient></defs>
  </svg>
); }
function Dashboard({ doctors, leaves, nightData, coverages, today, fd, onGoto, settings }) {
  const now = new Date();
  const [gaugeMonth, setGaugeMonth] = useState(0); // 0 = هذا الشهر، 1 = الشهر القادم
  const restRule = settings?.restRule!==false;
  const ana = useMemo(()=>analyzeMonth(now.getFullYear(), now.getMonth(), doctors, leaves, nightData, coverages, restRule), [doctors,leaves,nightData,coverages,restRule]);
  const eveningCount = Object.keys(nightData).filter(d=>{const[y,m]=d.split("-");return +y===now.getFullYear()&&+m===now.getMonth()+1;}).reduce((a,d)=>a+((nightData[d].doctors||[]).length?1:0),0);
  const stats = [
    { k:"الأطباء", v:doctors.length, c:C.primary, go:"doctors", i:"👨‍⚕️" },
    { k:"أيام مسائية", v:eveningCount, c:"#0369a1", go:"engine", i:"🌙" },
    { k:"تغطيات", v:coverages.length, c:"var(--primary-d)", go:"engine", i:"🔄" },
    { k:"مكشوفة", v:ana.gaps.length, c:ana.gaps.length?C.warn:C.ok, go:"engine", i:"⚠️" },
    { k:"تعارضات", v:ana.conflicts.length, c:ana.conflicts.length?C.err:C.ok, go:"engine", i:"⛔" },
  ];
  const alerts = [];
  ana.conflicts.forEach(c=>alerts.push({ sev:"err", t:c.text, go:"engine" }));
  ana.gaps.forEach(g=>alerts.push({ sev:"warn", t:`عيادة د.${fd(g.ownerId)?.name||""} (${perAr(g.period)}) ${dmy(g.date)} تحتاج تغطية`, go:"engine" }));
  leaves.forEach(l=>{ const du=Math.round((new Date(l.start)-new Date(today))/864e5); if(du>0&&du<=3){ const d=fd(l.doctorId); if(d) alerts.push({ sev:"warn", t:`إجازة د.${d.name} تبدأ بعد ${du} ${du===1?"يوم":"أيام"}`, go:"leaves" }); } });
  doctors.forEach(d=>{ const has=[0,1,2,3,4].some(di=>getSlot(d,di,"am")||getSlot(d,di,"pm")); if(!has) alerts.push({ sev:"warn", t:`د.${d.name} بلا جدول عيادات`, go:"doctors" }); });
  doctors.forEach(d=>{ let n=0; monthDays(now.getFullYear(),now.getMonth()).forEach(({date})=>{ if(((nightData[date]||{}).doctors||[]).includes(d.id)) n++; }); if(n>CAP_EVENING) alerts.push({ sev:"err", t:`د.${d.name} تجاوز حدّ المناوبات (${n}/${CAP_EVENING})`, go:"doctors" }); });
  monthDays(now.getFullYear(),now.getMonth()).forEach(({date,di})=>{ const onLv=doctors.filter(d=>onLeave(d,date,leaves)).length; if(onLv>=CAP_LEAVE_DAY) alerts.push({ sev:"warn", t:`تواجد منخفض ${dmy(date)} ${DAYS[di]} — ${onLv} في إجازة`, go:"leaves" }); });
  alerts.sort((a,b)=>(a.sev==="err"?0:1)-(b.sev==="err"?0:1));
  const dayInfo = date => { const nd=nightData[date]||{}; const cv=nd.coverages||{}; const evening=(nd.doctors||[]).map(id=>fd(id)?.name).filter(Boolean); const covs=[]; ["am","pm","nextAm"].forEach(slot=>{ (cv[slot]||[]).forEach(cid=>{ const c=fd(cid); if(c) covs.push(c.name); }); }); coverages.filter(c=>c.date===date).forEach(c=>{ const cd=fd(c.coverDoctorId); if(cd) covs.push(cd.name); }); const lv=doctors.filter(d=>onLeave(d,date,leaves)).map(d=>d.name); return {evening,covs,lv}; };
  const md = monthDays(now.getFullYear(),now.getMonth()).map(x=>x.date);
  const todayInfo = dayInfo(today);
  const eveningSlots = md.reduce((a,d)=>a+(((nightData[d]||{}).doctors||[]).length),0);
  const covMonth = coverages.filter(c=>{ const[y,m]=c.date.split("-"); return +y===now.getFullYear()&&+m===now.getMonth()+1; }).length;
  const leavesMonth = leaves.filter(l=> l.start<=md[md.length-1] && l.end>=md[0]).length;
  const gapDays=new Set(ana.gaps.map(g=>g.date)), confDays=new Set(ana.conflicts.map(c=>c.date));
  let okN=0,warnN=0,badN=0;
  md.forEach(d=>{ const active=((nightData[d]||{}).doctors||[]).length>0 || coverages.some(c=>c.date===d) || gapDays.has(d) || confDays.has(d); if(!active) return; if(gapDays.has(d)) badN++; else if(confDays.has(d)) warnN++; else okN++; });
  const totalActive=okN+warnN+badN, health=totalActive?Math.round(okN/totalActive*100):100;

  // ── حالة الشهر: يدعم عرض هذا الشهر أو الشهر القادم (الجدول عادة يُعتمد قبل دخول الشهر) ──
  const gaugeDate = new Date(now.getFullYear(), now.getMonth()+gaugeMonth, 1);
  const gaugeAna = useMemo(()=>analyzeMonth(gaugeDate.getFullYear(), gaugeDate.getMonth(), doctors, leaves, nightData, coverages, restRule), [doctors,leaves,nightData,coverages,gaugeMonth,restRule]);
  const gaugeMd = monthDays(gaugeDate.getFullYear(), gaugeDate.getMonth()).map(x=>x.date);
  const gaugeGapDays=new Set(gaugeAna.gaps.map(g=>g.date)), gaugeConfDays=new Set(gaugeAna.conflicts.map(c=>c.date));
  let gOkN=0,gWarnN=0,gBadN=0;
  gaugeMd.forEach(d=>{ const active=((nightData[d]||{}).doctors||[]).length>0 || coverages.some(c=>c.date===d) || gaugeGapDays.has(d) || gaugeConfDays.has(d); if(!active) return; if(gaugeGapDays.has(d)) gBadN++; else if(gaugeConfDays.has(d)) gWarnN++; else gOkN++; });
  const gaugeTotalActive=gOkN+gWarnN+gBadN, gaugeHealth=gaugeTotalActive?Math.round(gOkN/gaugeTotalActive*100):100;
  const contrib4 = doctors.map(d=>{ const sx=doctorSessions(d,md,nightData,coverages,leaves); return { d, c:sx.covers+sx.eveningExtra }; }).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,4);
  const maxC = contrib4[0]?.c||1;
  const needs = ana.gaps.slice(0,4);

  return <div className="fade">
    <div className="card" style={{ padding:"22px 24px", marginBottom:18, background:`linear-gradient(120deg,${C.primaryD},${C.primary} 65%,${C.eve})`, color:"#fff", border:"none", display:"flex", alignItems:"center", gap:14, flexWrap:"wrap", boxShadow:"0 12px 34px rgba(15,163,154,.28)" }}>
      <div style={{ flex:1, minWidth:200 }}>
        <div style={{ fontSize:22, fontWeight:700 }}>نظرة عامة على القسم 👋</div>
        <div style={{ fontSize:13, opacity:.92, marginTop:3 }}>{DAYS[new Date(today).getDay()]||""} · {now.getDate()} {MONTHS[now.getMonth()]} {now.getFullYear()}</div>
      </div>
      <button onClick={()=>onGoto("engine")} style={{ background:"rgba(255,255,255,.18)", color:"#fff", border:"1px solid rgba(255,255,255,.32)", borderRadius:13, padding:"11px 18px", fontWeight:600, fontSize:13.5, cursor:"pointer", display:"inline-flex", alignItems:"center", gap:8 }}>🌙 إدارة الدوام والتغطيات</button>
    </div>

    <div className="grid g4" style={{ marginBottom:18 }}>
      <div className="card stat"><div className="spine" style={{ background:C.primary }}></div><div className="ic" style={{ background:"var(--primarySoft)", color:C.primaryD }}><Ico n="doctors"/></div><div className="num"><CountUp n={doctors.length}/></div><div className="lbl">إجمالي الأطباء</div><span className="delta mut">{doctors.length} نشط</span></div>
      <div className="card stat"><div className="spine" style={{ background:C.eve }}></div><div className="ic" style={{ background:"var(--eveSoft)", color:C.eve }}><Ico n="engine"/></div><div className="num"><CountUp n={eveningSlots}/></div><div className="lbl">العيادات المسائية / الشهر</div></div>
      <div className="card stat"><div className="spine" style={{ background:C.ok }}></div><div className="ic" style={{ background:"var(--okSoft)", color:C.ok }}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9"><path d="M20 6L9 17l-5-5"/></svg></div><div className="num"><CountUp n={covMonth}/></div><div className="lbl">التغطيات هذا الشهر</div><span className="delta mut">{coverages.length} إجمالي الكل</span></div>
      <div className="card stat"><div className="spine" style={{ background:C.warn }}></div><div className="ic" style={{ background:"var(--warnSoft)", color:C.warn }}><Ico n="leaves"/></div><div className="num"><CountUp n={leavesMonth}/></div><div className="lbl">إجازات هذا الشهر</div><span className="delta mut">{leaves.length} إجمالي الكل</span></div>
    </div>

    <div className="grid g3" style={{ marginBottom:18 }}>
      <div className="card gauge-wrap">
        <div style={{ display:"flex", gap:6, marginBottom:10 }}>
          <button onClick={()=>setGaugeMonth(0)} style={{ flex:1, padding:"7px 8px", borderRadius:10, border:`1px solid ${gaugeMonth===0?C.primary:C.line}`, background:gaugeMonth===0?"var(--primarySoft)":"var(--surface)", color:gaugeMonth===0?C.primaryD:C.sub, fontWeight:700, fontSize:12, cursor:"pointer" }}>{MONTHS[now.getMonth()]}</button>
          <button onClick={()=>setGaugeMonth(1)} style={{ flex:1, padding:"7px 8px", borderRadius:10, border:`1px solid ${gaugeMonth===1?C.primary:C.line}`, background:gaugeMonth===1?"var(--primarySoft)":"var(--surface)", color:gaugeMonth===1?C.primaryD:C.sub, fontWeight:700, fontSize:12, cursor:"pointer" }}>{MONTHS[(now.getMonth()+1)%12]} (القادم)</button>
        </div>
        <div className="gauge"><Ring pct={gaugeHealth}/><div className="ctr"><b>{gaugeHealth}٪</b><span>صحة التغطية</span></div></div>
        <div className="glegend">
          <div className="ctitle" style={{ marginBottom:6 }}>حالة الشهر</div>
          <div className="gl"><span className="d" style={{ background:C.ok }}></span>مكتمل <b>{gOkN}</b></div>
          <div className="gl"><span className="d" style={{ background:C.warn }}></span>يحتاج مراجعة <b>{gWarnN}</b></div>
          <div className="gl"><span className="d" style={{ background:C.err }}></span>يوجد شاغر <b>{gBadN}</b></div>
        </div>
      </div>
      <div className="card" style={{ padding:20 }}>
        <div className="ctitle">⚖️ مؤشر العدالة</div><div className="csub">أعلى ٤ مساهمةً (تغطيات + مسائي إضافي)</div>
        {contrib4.length? contrib4.map(x=>(<div className="fbar" key={x.d.id}><div className="top"><b>د.{x.d.name}</b><span>{x.c}</span></div><div className="track"><div className="fill" style={{ width:(x.c/maxC*100)+"%" }}></div></div></div>)) : <div style={{ fontSize:12.5, color:C.muted }}>لا مساهمات بعد</div>}
      </div>
      <div className="card" style={{ padding:20 }}>
        <div className="ctitle">🌙 مسائي اليوم</div><div className="csub">{DAYS[new Date(today).getDay()]||"عطلة"} · {now.getDate()} {MONTHS[now.getMonth()]}</div>
        {todayInfo.evening.length? todayInfo.evening.map((n,i)=>(<div className="row" key={i}><div className="rav" style={{ background:C.eve }}>{n.slice(0,2)}</div><div style={{ flex:1 }}><div className="nm">د.{n}</div><div className="mt">عيادة مسائية · فترتان</div></div><span className="tag t-eve">مسائي</span></div>)) : <div style={{ fontSize:12.5, color:C.muted, padding:"8px 0" }}>لا مسائي اليوم</div>}
      </div>
    </div>

    <div className="grid g2">
      <div className="card" style={{ padding:20 }}>
        <div className="ctitle" style={{ color:C.err }}>⚠️ يحتاج إجراءً</div><div className="csub">عيادات شاغرة بانتظار التغطية</div>
        {needs.length? needs.map((g,i)=>(<div className="row" key={i} onClick={()=>onGoto("engine")} style={{ cursor:"pointer" }}><div className="rav" style={{ background:C.err }}>!</div><div style={{ flex:1 }}><div className="nm">{perAr(g.period)} — {DAYS[g.di]} {dmy(g.date)}</div><div className="mt">د.{fd(g.ownerId)?.name||"؟"} · {g.reason||""}</div></div><span className="tag t-bad">شاغر</span></div>)) : <div className="row"><div className="rav" style={{ background:C.ok }}>✓</div><div style={{ flex:1 }}><div className="nm">لا عيادات شاغرة</div><div className="mt">كل التغطيات مكتملة</div></div></div>}
      </div>
      <div className="card" style={{ padding:20 }}>
        <div className="ctitle">🔔 تنبيهات</div><div className="csub">تعارضات وحدود وإجازات قريبة</div>
        {alerts.length? alerts.slice(0,4).map((a,i)=>(<div className="row" key={i} onClick={()=>onGoto(a.go)} style={{ cursor:"pointer" }}><div className="rav" style={{ background:a.sev==="err"?C.err:C.warn }}>{a.sev==="err"?"!":"~"}</div><div style={{ flex:1 }}><div className="nm" style={{ fontSize:12.5 }}>{a.t}</div></div><span className={"tag "+(a.sev==="err"?"t-bad":"t-warn")}>{a.sev==="err"?"عاجل":"مراجعة"}</span></div>)) : <div className="row"><div className="rav" style={{ background:C.ok }}>✓</div><div style={{ flex:1 }}><div className="nm">لا تنبيهات</div><div className="mt">كل شيء على ما يرام</div></div></div>}
      </div>
    </div>

    <div className="card" style={{ padding:20, marginTop:18 }}>
      <div className="ctitle">🔄 التغطيات لكل يوم</div>
      <div className="csub">{MONTHS[now.getMonth()]} {now.getFullYear()}</div>
      {(()=>{ const mc = coverages.filter(c=>{ const[y,m]=c.date.split("-"); return +y===now.getFullYear()&&+m===now.getMonth()+1; }); const byDay={}; mc.forEach(c=>{ (byDay[c.date]=byDay[c.date]||[]).push(c); }); const dys=Object.keys(byDay).sort(); if(!dys.length) return <div style={{ fontSize:12.5, color:C.muted, padding:"8px 0" }}>لا تغطيات هذا الشهر</div>; return <div style={{ maxHeight:300, overflowY:"auto", margin:"0 -6px", padding:"0 6px" }}>{dys.map(dt=>(
        <div key={dt} className="row" style={{ alignItems:"flex-start", cursor:"pointer" }} onClick={()=>onGoto("engine")}>
          <div className="rav" style={{ background:C.primaryD, fontSize:13 }}>{byDay[dt].length}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="nm">{DAYS[new Date(dt).getDay()]||""} · {dmy(dt)}</div>
            <div className="mt" style={{ whiteSpace:"normal", lineHeight:1.7 }}>{byDay[dt].map((c,i)=>`د.${fd(c.coverDoctorId)?.name||"؟"} ◂ د.${fd(c.absentId)?.name||"؟"} (${perAr(c.period)})`).join("  ·  ")}</div>
          </div>
        </div>
      ))}</div>; })()}
    </div>
  </div>;
}



// ════════ الرابط الحي (Firebase Firestore REST) ════════
function cloudCfg(){ const c=S.get("v2_cloud"); return (c&&c.dbUrl)?c:null; } // {dbUrl, apiKey, email, password}
let __idTokenCache=null; // {token, exp}
async function getIdToken(cfg){
  if(__idTokenCache && __idTokenCache.exp>Date.now()+30000) return __idTokenCache.token;
  if(!cfg.apiKey||!cfg.email||!cfg.password) throw new Error("no-auth-config");
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(cfg.apiKey)}`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email:cfg.email, password:cfg.password, returnSecureToken:true })
  });
  if(!r.ok){ const t=await r.text(); throw new Error("auth-failed: "+r.status+" "+t.slice(0,150)); }
  const j=await r.json();
  __idTokenCache={ token:j.idToken, exp:Date.now()+(Number(j.expiresIn||3600)*1000) };
  return j.idToken;
}

function downloadCSV(filename, rows){
  const esc=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

// ════════════════════════════════ ENGINE (الدوام والتغطيات) ════════════════════════════════
function EnginePage({ doctors, leaves, nightData, coverages, today, fd, setNight, setCoverages, showToast, logAudit, settings, holidays }) {
  const now = new Date();

  const holidayMap = useMemo(()=>buildHolidayMap(holidays), [holidays]);

  const [mo, setMo] = useState(()=>{ const s=S.get("v2_lastmo"); return (s && typeof s.y==="number" && typeof s.m==="number") ? s : { y:now.getFullYear(), m:now.getMonth() }; });

  const days = useMemo(()=>monthDays(mo.y,mo.m), [mo]);
