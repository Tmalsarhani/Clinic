      <Tile ic="🌙" bg="var(--eveSoft)" fg="var(--eve)" v={eveningSlots} l="مناوبة مسائية" sub={`${eveDays} يوم · ${MONTHS[now.getMonth()]}`} go="engine" />
      <Tile ic="🔄" bg="var(--primarySoft)" fg={C.primary} v={covMonth} l="تغطية هذا الشهر" sub="مسجّلة ومعتمدة" go="stats" />
      <Tile ic="🏖" bg="var(--warnSoft)" fg="#B7701B" v={leavesMonth} l="إجازة هذا الشهر" sub={lvToday.length?`${lvToday.length} في إجازة اليوم`:"لا أحد في إجازة اليوم"} go="leaves" />
      <Tile ic="⛔" bg={ana.conflicts.length?"var(--dangerSoft)":"var(--okSoft)"} fg={ana.conflicts.length?C.err:C.ok} v={ana.conflicts.length} l="تعارضات" sub={ana.conflicts.length?"تحتاج مراجعة":"✓ لا يوجد"} go="engine" alert={ana.conflicts.length>0} />
      <Tile ic="👨‍⚕️" bg="var(--surface2)" fg={C.text} v={doctors.length} l="طبيب في القسم" go="doctors" />
    </div>

    {/* ═══ الأيام القادمة + صحة الشهر ═══ */}
    <div className="dsh-row">
      <div className="card" style={{ padding:18, minWidth:0 }}>
        <Head ic="📅" t="الأيام القادمة" sub="المسائي والحالة لخمسة أيام عمل" go="engine" goL="التقويم" />
        <div className="dsh-days">
          {upInfo.map(u=>{ const isT=u.ds===today; const st=u.closed?{bg:"var(--surface2)",c:C.muted,t:"مغلق"}:u.gaps?{bg:"var(--dangerSoft)",c:C.err,t:<>⚠ {u.gaps}<span className="dsh-hm"> مكشوفة</span></>}:u.conf?{bg:"var(--warnSoft)",c:C.warn,t:"تعارض"}:{bg:"var(--okSoft)",c:C.ok,t:<>✓<span className="dsh-hm"> مكتمل</span></>}; return (
            <div key={u.ds} onClick={()=>onGoto("engine")} style={{ cursor:"pointer", borderRadius:16, border:`1.5px solid ${isT?C.primary:C.line}`, background:isT?"var(--primarySoft)":"var(--surface)", padding:"10px 8px", textAlign:"center", minWidth:0 }}>
              <div style={{ fontSize:11.5, fontWeight:800, color:isT?C.primary:C.sub }}>{isT?"اليوم":DAYS[u.di]}</div>
              <div style={{ fontSize:20, fontWeight:800, lineHeight:1.2 }}>{+u.ds.slice(8)}</div>
              <div style={{ display:"flex", justifyContent:"center", minHeight:28, margin:"6px 0" }}>{u.eve.length ? u.eve.slice(0,3).map((d,i)=><span key={d.id} style={{ marginInlineStart:i?-8:0 }}><Av d={d} size={26}/></span>) : <span style={{ fontSize:11, color:C.muted, alignSelf:"center" }}>—</span>}</div>
              <div style={{ fontSize:10.5, fontWeight:800, color:st.c, background:st.bg, borderRadius:999, padding:"3px 4px", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{st.t}</div>
              {u.lv>0 && <div style={{ fontSize:10, color:C.muted, marginTop:4 }}>🏖 {u.lv}</div>}
            </div>); })}
        </div>
      </div>
      <div className="card" style={{ padding:18, minWidth:0 }}>
        <Head ic="💚" t="صحة الجدول" sub="نسبة الأيام المكتملة بلا شواغر" />
        <div style={{ display:"flex", gap:6, marginBottom:10 }}>
          {[0,1].map(k=><button key={k} onClick={()=>setGaugeMonth(k)} style={{ flex:1, padding:"6px 8px", borderRadius:10, border:`1.5px solid ${gaugeMonth===k?C.primary:C.line}`, background:gaugeMonth===k?"var(--primarySoft)":"var(--surface)", color:gaugeMonth===k?C.primaryD:C.sub, fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"inherit" }}>{MONTHS[(now.getMonth()+k)%12]}{k?" (القادم)":""}</button>)}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:16 }}>
          <div className="gauge" style={{ flexShrink:0 }}><Ring pct={gaugeHealth}/><div className="ctr"><b>{gaugeHealth}٪</b><span>مكتمل</span></div></div>
          <div style={{ flex:1, display:"flex", flexDirection:"column", gap:8, fontSize:12.5 }}>
            {[["مكتمل",gOkN,C.ok],["يحتاج مراجعة",gWarnN,C.warn],["فيه شاغر",gBadN,C.err]].map(([l,n,c])=><div key={l} style={{ display:"flex", alignItems:"center", gap:8 }}><i style={{ width:10, height:10, borderRadius:3, background:c, display:"inline-block" }} /><span style={{ flex:1, color:C.sub }}>{l}</span><b>{n}</b></div>)}
            {gaugeTotalActive===0 && <div style={{ fontSize:11, color:C.muted }}>لم يُنشأ جدول لهذا الشهر بعد</div>}
          </div>
        </div>
      </div>
    </div>

    {/* ═══ اليوم بالتفصيل + يحتاج إجراء + الأكثر مساهمة ═══ */}

const FIREBASE_DEFAULT = { dbUrl:"https://restorative-department-default-rtdb.europe-west1.firebasedatabase.app", apiKey:"AIzaSyAFgGIFTVBzpVagVWLJz80xxbstkonG3j4" };
function cloudCfg(){ const c=S.get("v2_cloud"); return (c&&c.dbUrl)?c:null; } // {dbUrl, apiKey, email, password} — يُستخدم فقط لزر "نشر رسمي" للرابط الحي العام (يحتاج حساب رئيس القسم)
let __idTokenCache=null; // {token, exp}
async function getIdToken(cfg){
  if(__idTokenCache && __idTokenCache.exp>Date.now()+30000) return __idTokenCache.token;
  if(!cfg.apiKey||!cfg.email||!cfg.password) throw new Error("no-auth-config");
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(cfg.apiKey)}`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email:cfg.email, password:cfg.password, returnSecureToken:true })
  });
  if(!r.ok){ const t=await r.text(); throw new Error("auth-failed: "+r.status+" "+t.slice(0,150)); }
  const j=await r.json();
  __idTokenCache={ token:j.idToken, exp:Date.now()+(Number(j.expiresIn||3600)*1000) };
  return j.idToken;
}
// دخول مجهول (Anonymous) تلقائي — يعمل على أي جهاز بلا أي بريد أو كلمة مرور، فقط لمزامنة بيانات القسم بين الأجهزة (وليس لنشر الرابط العام)
let __anonTokenCache=null; // {token, exp}
async function getAnonToken(){
  if(__anonTokenCache && __anonTokenCache.exp>Date.now()+30000) return __anonTokenCache.token;
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(FIREBASE_DEFAULT.apiKey)}`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ returnSecureToken:true })
  });
  if(!r.ok){ const t=await r.text(); throw new Error("anon-auth-failed: "+r.status+" "+t.slice(0,150)); }
  const j=await r.json();
  __anonTokenCache={ token:j.idToken, exp:Date.now()+(Number(j.expiresIn||3600)*1000) };
  return j.idToken;
}

// ════════ نسخ احتياطي أسبوعي تلقائي (على Firebase، منفصل عن البيانات الحيّة) ════════
async function cloudBackupIfDue(state){
  try{
    const idToken=await getAnonToken();
    const base=FIREBASE_DEFAULT.dbUrl.replace(/\/+$/,"");
    const metaUrl=`${base}/backups/_meta.json?auth=${encodeURIComponent(idToken)}`;
    const metaRes=await fetch(metaUrl,{cache:"no-store"});
    const meta = metaRes.ok ? await metaRes.json() : null;
    const lastAt = meta&&meta.lastAt ? new Date(meta.lastAt).getTime() : 0;
    const WEEK = 7*24*60*60*1000;
    if(Date.now()-lastAt < WEEK) return false; // لم يحن الأسبوع بعد
    const dateKey = new Date().toISOString().slice(0,10);
    const backupUrl=`${base}/backups/${dateKey}.json?auth=${encodeURIComponent(idToken)}`;
    const body = { ...state, _type:"clinic-backup", _version:1, exportedAt:new Date().toISOString(), auto:true };
    const r1=await fetch(backupUrl,{ method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    if(!r1.ok) return false;
    await fetch(metaUrl,{ method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ lastAt:new Date().toISOString() }) });
    return true;
  }catch(e){ return false; } // فشل صامت — لا يعطّل الاستخدام العادي للتطبيق
}
async function cloudListBackups(){
  const idToken=await getAnonToken();
  const base=FIREBASE_DEFAULT.dbUrl.replace(/\/+$/,"");
  const url=`${base}/backups.json?shallow=false&auth=${encodeURIComponent(idToken)}`;
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok) return [];
  const j=await res.json()||{};
  return Object.keys(j).filter(k=>k!=="_meta").sort().reverse().map(k=>({ key:k, data:j[k] }));
}

// ════════ مشاركة وتصدير ════════
function downloadCSV(filename, rows){
  const esc=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

// ════════════════════════════════ ENGINE (الدوام والتغطيات) ════════════════════════════════
// ════════════════════════════════ استيراد شهر قديم من Google Sheets ════════════════════════════════
// الصيغة المتوقعة (نسخ/لصق مباشر من الشيت): صف تواريخ مثل 3\5 ثم صف أسماء المسائي تحته بنفس الأعمدة،
// ثم سطر فيه كلمة "covering" وبعده بنفس الطريقة: dr.tareq (hanan) = طارق غطّى عيادة حنان. بلا أقواس = غطّى طبيب المسائي ذلك اليوم.
const EN_ALIAS = { amal:"امل", bassam:"بسام", basam:"بسام", hammadi:"الحمادي", alhammadi:"الحمادي", hamadi:"الحمادي", hanan:"حنان", maryam:"مريم", mariam:"مريم", mariyam:"مريم", farhan:"الفرحان", alfarhan:"الفرحان", tareq:"طارق", tariq:"طارق", tarek:"طارق", shatha:"شذا", shaza:"شذا", alaskar:"العسكر", askar:"العسكر", alasker:"العسكر", shahrani:"الشهراني", alshahrani:"الشهراني", buthina:"بثين", buthaina:"بثين", bothina:"بثين", thaerah:"ثائر", thaera:"ثائر", thaira:"ثائر", dima:"ديم", deema:"ديم", mudar:"مضر", modar:"مضر", mahdi:"مهدي", mehdi:"مهدي", askalan:"عسقلان", asqalan:"عسقلان", askalani:"عسقلان", qahtani:"القحطاني", alqahtani:"القحطاني", aziza:"عزيز", azizah:"عزيز", faiza:"فايز", faizah:"فايز", elham:"إلهام", ilham:"إلهام", ramel:"الرمل", alramel:"الرمل", ramal:"الرمل", muhaisen:"المحيسن", ghanim:"الغانم", kamal:"كمال", ibrahim:"الإبراهيم", alibrahim:"الإبراهيم" };
const EN_MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const normAr = s => String(s||"").replace(/^د(\.|\s)\s*/,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim();
const normTok = s => String(s||"").toLowerCase().replace(/\bdr\b\.?/g,"").replace(/د\./g,"").replace(/[.\s_\-]/g,"").trim();
function matchDoctor(tok, doctors, aliases){
  if(aliases && aliases[tok]!=null){ const d=doctors.find(x=>x.id===aliases[tok]); if(d) return { doc:d, how:"saved" }; }
  const frag = EN_ALIAS[tok] || (/[؀-ۿ]/.test(tok) ? tok : null);
  if(!frag) return { cands:[] };
  const f = normAr(frag);
  const cands = doctors.filter(d=>(" "+normAr(d.name)).includes(" "+f)); // من بداية كلمة فقط (لا يطابق "ديم" داخل "مريم")
  if(cands.length===1) return { doc:cands[0], how:"auto" };
  return { cands };
}
function parseSheetText(text){
  const rows = String(text||"").split(/\r?\n/).map(l=>l.split("\t"));
  const dateRe = /^\s*(\d{1,2})\s*[\\\/\-.]\s*(\d{1,2})\s*$/;
  let section = "eve"; const eve = {}, cov = {}; let monthGuess = null;
  const mHit = String(text).toLowerCase().match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/); if(mHit) monthGuess = EN_MONTHS.indexOf(mHit[1]);
  for(let i=0;i<rows.length;i++){
    const line = rows[i].join(" ");
    if(/cover/i.test(line) || /تغطي/.test(line)){ section="cov"; continue; }
    const dcells = rows[i].map((c,idx)=>{ const m=c.match(dateRe); return m?{ idx, d:+m[1], m:+m[2] }:null; }).filter(Boolean);
    if(!dcells.length) continue;
    // صف الأسماء = أول صف غير فارغ بعد صف التواريخ (ولا يحتوي تواريخ)
    let j=i+1; while(j<rows.length && !rows[j].some(c=>c.trim()) ) j++;
    if(j>=rows.length || rows[j].some(c=>dateRe.test(c))) continue;
    dcells.forEach(({idx,d,m})=>{
      if(monthGuess==null) monthGuess = m-1;
      const cell = (rows[j][idx]||"").trim(); if(!cell || /^[.\s…]+$/.test(cell)) return;
      const key = `${m}|${d}`;
      if(section==="eve"){ eve[key] = cell.split(/[,،+&]/).map(x=>x.trim()).filter(x=>x && !/^[.\s…]+$/.test(x)); }
      else { const out=[]; const re=/([^,،(]+?)\s*(?:\(([^)]*)\))?\s*(?:[,،]|$)/g; let mm; while((mm=re.exec(cell))){ const c=mm[1].trim(); if(!c || /^[.\s…]+$/.test(c)) continue; out.push({ cover:c, absent:(mm[2]||"").trim()||null }); } cov[key]=out; }
    });
    i=j;
  }
  return { eve, cov, monthGuess };
}

function ImportSheetModal({ doctors, nightData, coverages, defaultYear, onClose, onImport }){
  const [text,setText] = useState("");
  const [year,setYear] = useState(defaultYear);
  const [month,setMonth] = useState(null);
  const [aliases,setAliases] = useState(()=>S.get("v2_name_alias")||{});
  const [mode,setMode] = useState("replace");
  const [perOverride,setPerOverride] = useState({}); // key -> "am"|"pm"|"both"|"skip"
  const parsed = useMemo(()=>parseSheetText(text), [text]);
  const mIdx = month!=null ? month : parsed.monthGuess;
  const toks = useMemo(()=>{ const set=new Map(); const add=raw=>{ const t=normTok(raw); if(t) set.set(t, raw); };
    Object.values(parsed.eve).forEach(a=>a.forEach(add)); Object.values(parsed.cov).forEach(a=>a.forEach(x=>{ add(x.cover); if(x.absent) add(x.absent); })); return [...set.entries()]; }, [parsed]);
  const resolve = tok => matchDoctor(normTok(tok), doctors, aliases);
  const idOf = raw => resolve(raw).doc?.id ?? null;
  const unresolved = toks.filter(([t])=>!matchDoctor(t,doctors,aliases).doc);
  const ds = (m,d) => `${year}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const nm = id => doctors.find(x=>x.id===id)?.name || "؟";

  // ── بناء المعاينة: المسائي + التغطيات مع استنتاج الفترة والسبب ──
  const plan = useMemo(()=>{
    const days = {}; const warns = [];
    Object.entries(parsed.eve).forEach(([k,names])=>{ const [m,d]=k.split("|").map(Number); const date=ds(m,d); (days[date]=days[date]||{date,eve:[],covs:[]}).eve = names.map(n=>({ raw:n, id:idOf(n) })); });
    Object.entries(parsed.cov).forEach(([k,list])=>{ const [m,d]=k.split("|").map(Number); const date=ds(m,d); (days[date]=days[date]||{date,eve:[],covs:[]}).covs = list.map(x=>({ ...x, coverId:idOf(x.cover), absentIdExplicit:x.absent?idOf(x.absent):null })); });
    const eveOf = date => (days[date]?.eve||[]).map(e=>e.id).filter(Boolean);
    Object.values(days).forEach(day=>{
      const di = dayIdx(day.date);
      if(di<0) warns.push(`${day.date}: ليس يوم عمل (جمعة/سبت أو عطلة) — تحقّق من السنة`);
      const prevE = eveOf(prevCalDay(day.date));
      const needers = [...eveOf(day.date).map(id=>({id,why:"evening"})), ...prevE.map(id=>({id,why:"post_evening"}))];
      const used = new Set();
      day.covs.forEach((c,ci)=>{
        const key = `${day.date}|${ci}`;
        let absent = c.absentIdExplicit, why = null;
        /* بلا أقواس فقط → طبيب المسائي/الراحة ذلك اليوم. أما اسم بين قوسين لم يُعرف بعد فيبقى مجهولاً حتى تحدّده */
        if(!absent && !c.absent){ const n = needers.find(x=>!used.has(x.id) && ["am","pm"].some(p=>isClinic(getSlot(doctors.find(d=>d.id===x.id),di,p)))); if(n){ absent=n.id; why=n.why; } }
        if(absent){ used.add(absent); if(!why) why = eveOf(day.date).includes(absent) ? "evening" : prevE.includes(absent) ? "post_evening" : "absence"; }
        const own = absent ? doctors.find(d=>d.id===absent) : null;
        const clinicPers = own && di>=0 ? ["am","pm"].filter(p=>isClinic(getSlot(own,di,p))) : [];
        let auto = why==="post_evening" ? (clinicPers.includes("am")?["am"]:[]) : clinicPers;
        const cvd = c.coverId ? doctors.find(d=>d.id===c.coverId) : null;
        if(auto.length>1 && cvd){ const free = auto.filter(p=>!isClinic(getSlot(cvd,di,p))); if(free.length) auto = free; }
        const ov = perOverride[key];
        const pers = ov==="skip" ? [] : ov==="both" ? ["am","pm"] : ov ? [ov] : auto;
        Object.assign(c, { key, absentId:absent, why, pers, autoPers:auto });
      });
    });
    const list = Object.values(days).sort((a,b)=>a.date.localeCompare(b.date));
    // تحقّق من اليوم: عمود الأحد يجب أن يقع فعلاً يوم أحد بالسنة المختارة
    const wrongDays = list.filter(d=>dayIdx(d.date)<0).length;
    return { list, warns, wrongDays };
  }, [parsed, year, aliases, doctors, perOverride]);

  const counts = useMemo(()=>{ let e=0,c=0,bad=0; plan.list.forEach(d=>{ e+=d.eve.filter(x=>x.id).length; d.covs.forEach(x=>{ if(x.coverId && x.absentId && x.pers.length) c+=x.pers.length; else bad++; }); }); return {e,c,bad}; }, [plan]);
  const setAlias = (tok,id) => { const n={...aliases}; if(id) n[tok]=+id; else delete n[tok]; setAliases(n); S.set("v2_name_alias", n); };
  const doImport = () => {
    if(mIdx==null){ return; }
    const newNight = {}; const newCovs = [];
    plan.list.forEach(day=>{
      const ids=[...new Set(day.eve.map(x=>x.id).filter(Boolean))];
      if(ids.length) newNight[day.date] = { doctors:ids, coverages:{am:[],pm:[],nextAm:[]}, note:"مستورد", eveningSlots:ids.length };
      day.covs.forEach(c=>{ if(!c.coverId||!c.absentId) return; c.pers.forEach(p=>newCovs.push({ id:uid(), absentId:c.absentId, date:day.date, period:p, coverDoctorId:c.coverId, reason:c.why||"absence" })); });
    });
    onImport({ y:year, m:mIdx, mode, newNight, newCovs });
  };
  const perLbl = p => p==="am"?"صباح":"ظهر";
  const whyLbl = w => w==="evening"?"مناوب مساءً":w==="post_evening"?"راحة بعد المسائي":"غياب (يحتاج إجازة مسجّلة وإلا يُحذف)";

  return <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:210, background:"rgba(15,23,42,.45)", display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"4vh 12px", overflowY:"auto" }}>
    <div onClick={e=>e.stopPropagation()} style={{ background:"var(--surface)", borderRadius:16, width:"min(96vw,860px)", boxShadow:"0 24px 60px rgba(0,0,0,.3)" }}>

        <div style={{ flex:1, fontSize:16, fontWeight:800 }}>📥 استيراد شهر من Google Sheets</div>
        <button onClick={onClose} style={{ background:"var(--surface2)", border:"none", borderRadius:10, width:32, height:32, fontSize:18, color:C.muted, cursor:"pointer" }}>×</button>

        <div style={{ fontSize:12, color:C.sub, lineHeight:1.8, marginBottom:8 }}>في الشيت: حدّد الجدول كاملاً (المسائي + covering) ← نسخ ← الصق هنا. التواريخ مثل <b>3\5</b> والأسماء تحتها. في التغطيات: <b>dr.tareq (hanan)</b> = طارق غطّى عيادة حنان، وبلا أقواس = غطّى طبيب المسائي ذلك اليوم.</div>

              <div style={{ flex:"1 1 180px", minWidth:150 }}>

                {day.covs.map(c=><div key={c.key} style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap", fontSize:12.5, marginBottom:3 }}>

                  <select value={perOverride[c.key]||""} onChange={e=>setPerOverride(o=>({ ...o, [c.key]:e.target.value||undefined }))} style={{ border:`1px solid ${C.line}`, borderRadius:7, padding:"2px 5px", fontSize:11.5, background:"var(--surface)", color:C.text }}>
                    <option value="">{c.autoPers.length? "تلقائي: "+c.autoPers.map(perLbl).join("+") : "تلقائي: لا عيادة"}</option><option value="am">صباح</option><option value="pm">ظهر</option><option value="both">الفترتان</option><option value="skip">تجاهل</option>
                  </select>
                  {c.absentId && <span style={{ fontSize:10.5, color:c.why==="absence"?C.err:C.muted }}>{whyLbl(c.why)}</span>}
                </div>)}

            </div>)}
            {plan.list.length===0 && <div style={{ padding:14, fontSize:12.5, color:C.muted }}>لم أجد تواريخ — تأكّد من النسخ مع الأعمدة (Tab) كما هي من الشيت.</div>}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:12, flexWrap:"wrap" }}>
            <div style={{ flex:1, fontSize:12.5, color:C.sub }}>سيُستورد: <b style={{ color:"var(--eve)" }}>{counts.e}</b> مناوبة · <b style={{ color:C.primary }}>{counts.c}</b> تغطية{counts.bad>0 && <span style={{ color:C.err }}> · {counts.bad} سطر ناقص سيُتجاهل</span>}{mode==="replace" && mIdx!=null && <span> · سيُستبدل كامل {MONTHS[mIdx]} {year}</span>}</div>
            <button disabled={mIdx==null || !plan.list.length} onClick={doImport} style={{ ...sBtn(C.primary), opacity:(mIdx==null||!plan.list.length)?.5:1 }}>📥 استيراد</button>
          </div>
        </>}
      </div>
    </div>
  </div>;
}

function EnginePage({ doctors, leaves, nightData, coverages, today, fd, setNight, setCoverages, showToast, logAudit, settings, holidays }) {
  const now = new Date();
  const restRule = settings?.restRule!==false;
  const holidayMap = useMemo(()=>buildHolidayMap(holidays), [holidays]);
  const holInfo = ds => holidayMap[ds]||null;
  const [mo, setMo] = useState(()=>{ const s=S.get("v2_lastmo"); return (s && typeof s.y==="number" && typeof s.m==="number") ? s : { y:now.getFullYear(), m:now.getMonth() }; });
  useEffect(()=>S.set("v2_lastmo", mo), [mo]);
  const [sel, setSel] = useState(null);
  const [picks, setPicks] = useState({});
  const days = useMemo(()=>monthDays(mo.y,mo.m), [mo]);
  const calDays = useMemo(()=>{ const dim=new Date(mo.y,mo.m+1,0).getDate(); const out=[]; for(let d=1;d<=dim;d++){ const date=`${mo.y}-${String(mo.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; const wd=new Date(date).getDay(); if(wd>=5) continue; out.push({ date, di:wd, day:d, holiday:holInfo(date) }); } return out; }, [mo,holidayMap]);
  const ana = useMemo(()=>analyzeMonth(mo.y,mo.m,doctors,leaves,nightData,coverages,restRule), [mo,doctors,leaves,nightData,coverages,restRule]);
  const gaps = ana.gaps.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.period.localeCompare(b.period));
  const gapKey = g => `${g.date}|${g.period}|${g.ownerId}`;
  const monthDates = days.map(x=>x.date);
  const monthAssignments = useMemo(()=> days.flatMap(({date,di})=> ((nightData[date]||{}).doctors||[]).map(id=>({date,di,docId:id,key:`${date}|${id}`}))).sort((a,b)=>a.date.localeCompare(b.date)), [days,nightData]);
  const yearDates = useMemo(()=>{ const out=[]; for(let m=0;m<=mo.m;m++) out.push(...monthDays(mo.y,m).map(x=>x.date)); return out; }, [mo.y,mo.m]);
  // ── عدد التغطيات وحده (بلا خلط بعبء العيادة اليومي) — طبيب جدوله اليومي أخف (عيادات/إداري أقل) عبؤه الكلي أقل أصلاً، فلو رتّبنا حسب العبء الكلي سيخسر زميله الأثقل يومياً كل تنافس رغم تساويهما بعدد التغطيات — هذا بالضبط سبب استحواذ طبيب واحد على أغلب التغطيات سابقاً ──
  const coverLoadMap = useMemo(()=>{ const m={}; doctors.forEach(d=>{ m[d.id]=doctorSessions(d, yearDates, nightData, coverages, leaves).covers; }); return m; }, [mo,doctors,nightData,coverages,leaves,yearDates]);
  const coverThisMoMap = useMemo(()=>{ const m={}; doctors.forEach(d=>{ m[d.id]=doctorSessions(d, monthDates, nightData, coverages, leaves).covers; }); return m; }, [mo,doctors,nightData,coverages,leaves,monthDates]); // للحدّ الأقصى (تغطية واحدة بالشهر) إن كان مفعَّلاً
  const eveLoadMap = useMemo(()=>{ const m={}; doctors.forEach(d=>m[d.id]=0); monthDates.forEach(dt=>((nightData[dt]||{}).doctors||[]).forEach(id=>{ m[id]=(m[id]||0)+1; })); return m; }, [mo,doctors,nightData]);
  const rankAvail = arr => arr.filter(a=>a.status!=="leave"); // بلا أي فرز حسب العبء — bestForGap يفرز بنفسه حسب عدد التغطيات فقط
  const availForGap = g => rankAvail(getAvailable(doctors,[g.ownerId],g.di,g.date,g.period,leaves,nightData,{},coverages,true));
  const busyReason = (doc,di,period) => { const sl=getSlot(doc,di,period); if(isClinic(sl)) return "عيادة"; return SLOT_AR[sl]||"عيادة"; }; // يوضّح "تدقيق"/"افتراضي" بدل تعميم "عيادة" على كل شغل نهاري
  const pickList = (excludeId,di,date,period) => getAvailable(doctors,[excludeId],di,date,period,leaves,nightData,{},coverages,true).map(a=>({ ...a, load:coverLoadMap[a.doc.id]||0, commit: a.status==="warn" ? (SLOT_COMMIT[getSlot(a.doc,di,period)]||"التزام") : null, busyType: a.status==="busy" ? busyReason(a.doc,di,period) : null })).sort(()=>0);
  const pickListR = (excludeId,di,date,period) => rankPickList(pickList(excludeId,di,date,period), di, period);

  const ensureDay = date => setNight(nd=>nd[date]?nd:{...nd,[date]:{doctors:[],coverages:{am:[],pm:[],nextAm:[]},note:""}});
  const pushCov = cov => setCoverages(cs=>[...cs,{id:uid(),...cov}]);
  const addCovIndiv = cov => { pushCov(cov); showToast("تم تسجيل التغطية"); };
  const removeCovIndiv = id => setCoverages(cs=>cs.filter(c=>c.id!==id));
  const eveningOwner = g => ((nightData[g.date]||{}).doctors||[]).includes(g.ownerId);
  const addNightCov = (date,slot,cid) => setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; if(!(cv[slot]||[]).includes(cid)) cv[slot]=[...(cv[slot]||[]),cid]; d.coverages=cv; return {...nd,[date]:d}; });
  const ownerCover = (date,ownerId,period) => { const c=coverages.find(x=>x.date===date&&x.absentId===ownerId&&x.period===period&&x.reason==="evening"); return c?c.coverDoctorId:undefined; };
  const setOwnerCover = (date,ownerId,period,cid) => setCoverages(cs=>[...cs.filter(c=>!(c.date===date&&c.absentId===ownerId&&c.period===period&&c.reason==="evening")), {id:uid(),absentId:ownerId,date,period,coverDoctorId:cid,reason:"evening"}]);
  const clearOwnerCover = (date,ownerId,period) => setCoverages(cs=>cs.filter(c=>!(c.date===date&&c.absentId===ownerId&&c.period===period&&c.reason==="evening")));
  const placeCover = (g,cid) => {
    if(eveningOwner(g)&&(g.period==="am"||g.period==="pm")) setOwnerCover(g.date,g.ownerId,g.period,cid);
    else {
      const owner=fd(g.ownerId);
      const onLv = owner && onLeave(owner,g.date,leaves,g.period);
      const pcd=(()=>{ const dt=new Date(g.date); dt.setDate(dt.getDate()-1); return dt.getDay()>=5?null:dt.toISOString().split("T")[0]; })();
      const prevEve = pcd && ((nightData[pcd]||{}).doctors||[]).includes(g.ownerId);
      const reason = onLv ? "leave" : (g.period==="am" && prevEve) ? "post_evening" : "absence";
      pushCov({absentId:g.ownerId,date:g.date,period:g.period,coverDoctorId:cid,reason});
    }
    logAudit&&logAudit(`تغطية عيادة د.${fd(g.ownerId)?.name||"؟"} — بـ د.${fd(cid)?.name||"؟"} (${perAr(g.period)} ${dmy(g.date)})`);
  };
  // ── شريك العيادة: لو الطبيب صاحب الفجوة له "شريك عيادة" محدَّد ومؤهَّل، يُفضَّل تلقائياً على أي أحد آخر — قبل معيار العبء ──
  // ── الأهلية التلقائية: متفرّغ تماماً، أو عنده إداري/تدقيق/افتراضي (أعمال مرنة قابلة للمقاطعة) — التدريب والعيادة الفعلية والإجازة تبقى مستبعدة من الاختيار التلقائي ──
  const AUTO_OVERRIDE_SLOTS = ["admin","audit","virtual"];
  const isAutoEligible = (a,g) => a.status==="free" || (a.status!=="leave" && AUTO_OVERRIDE_SLOTS.includes(getSlot(a.doc,g.di,g.period)));
  const underCap = (docId, runningLoad) => !(settings?.capOnePerMonth && ((coverThisMoMap[docId]||0)+(runningLoad[docId]||0))>=1); // حدّ أقصى تغطية واحدة بالشهر (إن كان مفعَّلاً) — يشمل ما تراكم بنفس عملية الحل الحالية أيضاً
  const bestForGap = (g, av, taken=[], runningLoad={}) => {
    const partnerId = fd(g.ownerId)?.partnerId;
    if(partnerId){ const p = av.find(a=>a.doc.id===partnerId && isAutoEligible(a,g) && underCap(a.doc.id,runningLoad) && !taken.includes(a.doc.id)); if(p) return p; }
    // ── لا أفضلية لـ"المتفرّغ تماماً" على "الإداري/التدقيق/الافتراضي" — الكل يتنافس بمعيار عدد التغطيات وحده (لا العبء اليومي الكلي)، وإلا استمر نفس الطبيب "الفارغ دائماً" أو "الأخف يومياً" يستحوذ على أغلب التغطيات ──
    const eligible = av.filter(a=>isAutoEligible(a,g) && underCap(a.doc.id,runningLoad) && !taken.includes(a.doc.id));
    eligible.sort((a,b)=> (((coverLoadMap[a.doc.id]||0)+(runningLoad[a.doc.id]||0)) - ((coverLoadMap[b.doc.id]||0)+(runningLoad[b.doc.id]||0))));
    return eligible[0];
  };
  const coverGap = g => { const av=availForGap(g); const s=picks[gapKey(g)]; const cid=s?+s:(bestForGap(g,av)?.doc?.id); if(!cid){showToast("لا يوجد طبيب مؤهَّل تلقائياً — اختر يدوياً","warn");return;} placeCover(g,cid); showToast("تمت التغطية"); };
  const coverAll = (onlyDate) => {
    let n=0; const used={}; let skipped=0;
    const runningLoad={}; // ── يحسب تراكم التعيينات خلال نفس عملية "حل الكل" — بدونه، مَن يبدأ بأقل عبء يفوز بكل العيادات المكشوفة دفعة واحدة لأن loadMap لا يتحدّث أثناء الحلقة ──
    const targetGaps = onlyDate ? gaps.filter(g=>g.date===onlyDate) : gaps;
    targetGaps.forEach(g=>{
      const av=availForGap(g);
      const key=g.date+"|"+g.period; const taken=used[key]||[];
      const s=picks[gapKey(g)];
      let pick;
      if(s) pick=+s;
      else {
        const best = bestForGap(g,av,taken,runningLoad);
        pick = best?.doc?.id;
      }
      if(pick){ placeCover(g,pick); (used[key]=used[key]||[]).push(pick); runningLoad[pick]=(runningLoad[pick]||0)+1; n++; }
      else skipped++; // كل المتاحين لديهم تدريب/عيادة فعلية/إجازة فقط — لا يُختار أحد تلقائياً، يحتاج قراراً يدوياً من رئيس القسم
    });
    if(n && skipped) showToast(`غُطّيت ${n} عيادة بالأنسب — تبقّت ${skipped} تحتاج اختياراً يدوياً`,"warn");
    else if(n) showToast(`غُطّيت ${n} عيادة بالأنسب`);
    else if(skipped) showToast(`لم تُحل أي عيادة تلقائياً — اختر يدوياً لكل حالة`,"warn");
    else showToast("لا يوجد متاح");
  };

  const toggleEvening = (date,id) => { ensureDay(date); setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{am:[],pm:[],nextAm:[]}})}; const has=(d.doctors||[]).includes(id); d.doctors=has?d.doctors.filter(x=>x!==id):[...(d.doctors||[]),id]; return {...nd,[date]:d}; }); const nextDay=(()=>{ const dt=new Date(date); dt.setDate(dt.getDate()+1); return dt.toISOString().split("T")[0]; })(); setCoverages(cs=>cs.filter(c=>!(c.absentId===id && ((c.date===date && c.reason==="evening") || (c.date===nextDay && c.reason==="post_evening"))))); };
  // ── تبديل بين طبيبين بمناوبتين مختلفتين — يبدّل مباشرة بدل ٤ خطوات يدوية (إزالة/إضافة لكل جانب) ──
  const [swapResolvePending, setSwapResolvePending] = useState(null); // [dateA, dateB] بعد التبديل مباشرة، لحلّ أي عيادة نهارية جديدة احتاجها كل طرف بسبب انتقاله ليوم آخر
  const swapEvening = (dateA,docA,dateB,docB) => {
    if(!dateA||!docA||!dateB||!docB){ showToast("اختر المناوبتين كاملتين","warn"); return; }
    if(dateA===dateB && docA===docB){ showToast("اختر مناوبتين مختلفتين","warn"); return; }
    toggleEvening(dateA,docA); toggleEvening(dateA,docB);
    if(dateA!==dateB){ toggleEvening(dateB,docB); toggleEvening(dateB,docA); }
    logAudit&&logAudit(`تبديل مسائي: د.${fd(docA)?.name||"؟"} (${dmy(dateA)}) ↔ د.${fd(docB)?.name||"؟"} (${dmy(dateB)})`);
    showToast(`✓ تم التبديل: د.${fd(docA)?.name||"؟"} ↔ د.${fd(docB)?.name||"؟"} — جارٍ حلّ أي عيادة نهارية محتاجة تلقائياً…`);
    setSwapResolvePending([dateA,dateB]);
  };
  useEffect(()=>{
    if(!swapResolvePending) return;
    const t = setTimeout(()=>{
      const [dA,dB] = swapResolvePending;
      coverAll(dA);
      if(dB!==dA) coverAll(dB);
      setSwapResolvePending(null);
    }, 300);
    return ()=>clearTimeout(t);
  }, [swapResolvePending, nightData]);
  const setCov = (date,slot,id) => { if(!id) return; setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; cv[slot]=[+id]; d.coverages=cv; return {...nd,[date]:d}; }); };
  const clearCov = (date,slot) => setNight(nd=>{ const d={...(nd[date]||{})}; const cv={...(d.coverages||{})}; cv[slot]=[]; d.coverages=cv; return {...nd,[date]:d}; });

  const autoEvening = () => { const next=autoFill(mo.y,mo.m,doctors,leaves,nightData); setNight(()=>next); showToast("تم التوزيع التلقائي للمسائي"); };
  const [reqPerDay, setReqPerDay] = useState(()=>{ const v=S.get("v2_reqperday"); return v!=null?v:1; });
  useEffect(()=>S.set("v2_reqperday",reqPerDay),[reqPerDay]);
  const [dayReq, setDayReq] = useState(()=>S.get("v2_dayreq")||{});
  useEffect(()=>S.set("v2_dayreq",dayReq),[dayReq]);
  const [showSetup, setShowSetup] = useState(false);
