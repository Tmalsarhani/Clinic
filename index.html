// HELPERS
// ══════════════════════════════════════════════════════
const isClinic = t => t === "clinic_am" || t === "clinic_pm" || t === "clinic";
const getSlot  = (doc, di, p) => doc?.sched?.[di]?.[p] || "";
const sn       = n => n.replace("د.","").replace("د ","").trim().slice(0,5);
const wSlots   = doc => {
  let count = 0;
  Object.values(doc.sched||{}).forEach(d => {
    if (d.am && d.am !== "") count += 1;
    if (d.pm && d.pm !== "") count += 1;
  });
  // Evening clinic counts as 2 periods per fixed evening day
  const eveDays = Array.isArray(doc.nightDays) ? doc.nightDays.length : (doc.nightDay !== null && doc.nightDay !== undefined ? 1 : 0);
  count += eveDays * 2;
  return count;
};
const onLeave  = (doc, date, leaves) => !date||!doc ? false : leaves.some(l=>l.doctorId===doc.id&&l.start<=date&&date<=l.end);

const dayIdx = dateStr => {
  const d = new Date(dateStr);
  const map = {0:0,1:1,2:2,3:3,4:4}; // Sun=0..Thu=4
  const wd = d.getDay();
  return wd >= 5 ? -1 : wd;
};

const nextWork = dateStr => {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+1);
  while(d.getDay()>=5) d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
};

const mailtoAlert = (doc, subject, body) => {
  const to = doc.email || "";
  const url = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = url;
};

const fmtDate = dateStr => {
  const d = new Date(dateStr);
  return `${d.getDate()}/${d.getMonth()+1}`;
};

const needsCoverage = (doc, di) => ({
  am: isClinic(getSlot(doc, di, "am")),
  pm: isClinic(getSlot(doc, di, "pm")),
});

function getAvailable(doctors, excludeIds, di, date, period, leaves, nightData, coverageData, allCoverages) {
  // Doctors who are night doctors on THIS date (busy that evening / next morning)
  const nightDocIds = nightData[date]?.doctors || [];
  // Doctors already assigned to the SAME coverage slot
  const covDocIds = (coverageData[date]?.[period] || []);

  // Doctors busy covering ANY slot in nightData that maps to the SAME real time
  // same_am/same_pm -> on `date`; next_am -> on nextWork(date) morning
  const busyCovering = new Set();
  Object.entries(nightData).forEach(([d, nd]) => {
    const covs = nd.coverages || {};
    // covering same-day morning on `date`
    if (d === date && period === "am") (covs.am||[]).forEach(id => busyCovering.add(id));
    if (d === date && period === "pm") (covs.pm||[]).forEach(id => busyCovering.add(id));
    // a next_am coverage assigned on day `d` actually happens on nextWork(d) morning
    if (period === "am" && nextWork(d) === date) (covs.nextAm||[]).forEach(id => busyCovering.add(id));
    // a same-day coverage might coincide with someone's next_am target — already handled above
  });

  // Individual coverages at same date+period
  (allCoverages || []).forEach(c => {
    if (c.date === date && c.period === period) busyCovering.add(c.coverDoctorId);
  });

  const allExclude = [...new Set([...excludeIds, ...nightDocIds, ...covDocIds, ...busyCovering])];
  return doctors
    .filter(d => !allExclude.includes(d.id))
    .map(d => {
      if (onLeave(d, date, leaves)) return { doc: d, status: "leave" };
      const slot = getSlot(d, di, period);
      if (slot === "") return { doc: d, status: "free" };
      if (["admin","training","committee"].includes(slot)) return { doc: d, status: "warn", conflict: slot };
      return { doc: d, status: "busy" };
    })
    .filter(x => x.status !== "busy")
    .sort((a,b) => ({free:0,warn:1,leave:2}[a.status] - {free:0,warn:1,leave:2}[b.status]));
}

function autoFill(year, month, doctors, leaves, nightData) {
  const result = { ...nightData };
  const dim = new Date(year, month+1, 0).getDate();
  const hasNight = d => Array.isArray(d.nightDays) && d.nightDays.length > 0;
  const fd = id => doctors.find(d => d.id === id);
  const fixed = doctors.filter(hasNight);
  const rotate = doctors.filter(d => !hasNight(d));
  const usage = {};

  // STEP 0: purge any doctor who is on leave from existing assignments
  Object.keys(result).forEach(date => {
    const nd = result[date];
    if (!nd?.doctors?.length) return;
    const kept = nd.doctors.filter(id => { const d = fd(id); return d && !onLeave(d, date, leaves); });
    result[date] = { ...nd, doctors: kept };
  });

  // Count existing usage (after purge)
  Object.values(result).forEach(nd => (nd.doctors||[]).forEach(id => usage[id] = (usage[id]||0)+1));

  for (let day = 1; day <= dim; day++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const di = dayIdx(date);
    if (di < 0) continue;
    if (result[date]?.doctors?.length) continue; // skip days already filled

    // All doctors with THIS weekday as a fixed evening
    const fixedDocs = fixed.filter(d => d.nightDays.includes(di) && !onLeave(d, date, leaves));
    if (fixedDocs.length) {
      result[date] = { doctors: fixedDocs.slice(0,3).map(d=>d.id), coverages: { am: [], pm: [], nextAm: [] } };
      fixedDocs.forEach(d => usage[d.id] = (usage[d.id]||0) + 1);
    } else {
      const nextDi = dayIdx(nextWork(date));
      // needsCoverage = has clinic am/pm today OR clinic am next work day
      const coverageNeed = d => (isClinic(getSlot(d,di,"am"))?1:0) + (isClinic(getSlot(d,di,"pm"))?1:0) + (isClinic(getSlot(d,nextDi,"am"))?1:0);
      const avail = rotate.filter(d => !onLeave(d, date, leaves))
        .sort((a,b) => {
          // PRIORITY 1: doctors who need NO coverage come first
          const ca = coverageNeed(a), cb = coverageNeed(b);
          if (ca !== cb) return ca - cb;
          // PRIORITY 2: least loaded (fair distribution)
          return (usage[a.id]||0) - (usage[b.id]||0);
        });
      if (avail.length) {
        result[date] = { doctors: [avail[0].id], coverages: { am: [], pm: [], nextAm: [] } };
        usage[avail[0].id] = (usage[avail[0].id]||0) + 1;
      }
    }
  }
  return result;
}

const PIN_CODE = "1133";
function LoginGate({ onSuccess }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  const submit = (val) => {
    if (val === PIN_CODE) { onSuccess(); }
    else { setError(true); setPin(""); setTimeout(()=>setError(false), 1500); }
  };

  const press = (n) => {
    const next = (pin + n).slice(0,4);
    setPin(next);
    if (next.length === 4) setTimeout(()=>submit(next), 150);
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"linear-gradient(135deg,#0f1e36,#1e3a5f,#2c5282)", direction:"rtl", fontFamily:"'Segoe UI',Tahoma,sans-serif" }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"32px 28px", width:320, boxShadow:"0 20px 60px rgba(0,0,0,.3)", textAlign:"center" }}>
        <div style={{ fontSize:44, marginBottom:8 }}>⚕</div>
        <div style={{ fontWeight:800, fontSize:18, color:"#1e293b" }}>نظام الدوام المسائي</div>
        <div style={{ fontSize:12, color:"#94a3b8", marginBottom:20 }}>مركز دمام الطبي</div>

        {/* PIN dots */}
        <div style={{ display:"flex", justifyContent:"center", gap:12, marginBottom:8 }}>
          {[0,1,2,3].map(i => (
            <div key={i} style={{ width:16, height:16, borderRadius:"50%", border:`2px solid ${error?"#dc2626":"#2c5282"}`, background: i<pin.length ? (error?"#dc2626":"#2c5282") : "transparent", transition:"all .15s" }} />
          ))}
        </div>
        <div style={{ height:18, fontSize:12, color:"#dc2626", fontWeight:700, marginBottom:8 }}>{error ? "رقم سري خاطئ" : ""}</div>

        {/* Keypad */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10 }}>
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} onClick={()=>press(String(n))} style={keyBtn}>{n}</button>
          ))}
          <button onClick={()=>setPin("")} style={{ ...keyBtn, fontSize:14, color:"#94a3b8" }}>مسح</button>
          <button onClick={()=>press("0")} style={keyBtn}>0</button>
          <button onClick={()=>setPin(p=>p.slice(0,-1))} style={{ ...keyBtn, fontSize:18, color:"#94a3b8" }}>⌫</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
function App() {
  const [authed, setAuthed] = useState(() => S.get("fin_auth") === true);
  const [doctors,   setDoctors]   = useState(() => S.get("fin_docs")   || INIT_DOCTORS);
  const [leaves,    setLeaves]    = useState(() => S.get("fin_leaves")  || []);
  const [nightData, setNightData] = useState(() => S.get("fin_night")   || {});
  const [absences,  setAbsences]  = useState(() => S.get("fin_abs")     || []);
  const [coverages, setCoverages] = useState(() => S.get("fin_cov")     || []);
  const [page,      setPage]      = useState("dashboard");
  const [toast,     setToast]     = useState(null);
  const today = new Date().toISOString().split("T")[0];

  const showToast = (msg, type="ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2500);
  };

  const fd = id => doctors.find(d => d.id === id);

  const save = () => {
    S.set("fin_docs",   doctors);
    S.set("fin_leaves", leaves);
    S.set("fin_night",  nightData);
    S.set("fin_abs",    absences);
    S.set("fin_cov",    coverages);
  };

  const updateDocs = next => { setDoctors(next); S.set("fin_docs", next); };
  const updateNight = next => { setNightData(next); S.set("fin_night", next); };
  const updateCoverages = next => { setCoverages(next); S.set("fin_cov", next); };

  const addIndivCoverage = (cov) => {
    const next = [...coverages, { id:Date.now(), ...cov }];
    updateCoverages(next);
    showToast("✅ تم تسجيل التغطية");
  };
  const removeIndivCoverage = (id) => {
    updateCoverages(coverages.filter(c => c.id !== id));
    showToast("تم الحذف", "warn");
  };

  const ensureDay = (date) => {
    if (!nightData[date]) {
      updateNight({ ...nightData, [date]: { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } } });
    }
  };

  const addNightDoc = (date, docId) => {
    if (onLeave(fd(docId), date, leaves)) { showToast("الطبيب في إجازة","warn"); return; }
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    if (cur.doctors.includes(docId)) return;
    if (cur.doctors.length >= 3) { showToast("الحد الأقصى 3 مناوبين","warn"); return; }
    const next = { ...nightData, [date]: { ...cur, doctors: [...cur.doctors, docId] } };
    updateNight(next);
    showToast("✅ تم إضافة المناوب");
  };

  const removeNightDoc = (date, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const next = { ...nightData, [date]: { ...cur, doctors: cur.doctors.filter(id => id !== docId) } };
    updateNight(next);
  };

  const addCoverage = (date, slot, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const covs = cur.coverages || { am:[], pm:[], nextAm:[] };
    if ((covs[slot]||[]).includes(docId)) return;
    const next = { ...nightData, [date]: { ...cur, coverages: { ...covs, [slot]: [...(covs[slot]||[]), docId] } } };
    updateNight(next);
    showToast("✅ تم تعيين التغطية");
  };

  const removeCoverage = (date, slot, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const covs = cur.coverages || { am:[], pm:[], nextAm:[] };
    const next = { ...nightData, [date]: { ...cur, coverages: { ...covs, [slot]: (covs[slot]||[]).filter(id => id !== docId) } } };
    updateNight(next);
  };

  const clearMonth = (year, month) => {
    const next = { ...nightData };
    Object.keys(next).forEach(date => {
      const [y,m] = date.split("-");
      if (+y===year && +m===month+1) delete next[date];
    });
    updateNight(next);
    showToast("تم تصفير الشهر", "warn");
  };

  const resetDay = (date) => {
    const next = { ...nightData };
    delete next[date];
    updateNight(next);
    showToast("تم إعادة تعيين اليوم", "warn");
  };

  const copyDay = (fromDate, toDate) => {
    const src = nightData[fromDate];
    if (!src) { showToast("لا يوجد دوام في اليوم المصدر", "warn"); return; }
    const next = { ...nightData, [toDate]: JSON.parse(JSON.stringify(src)) };
    updateNight(next);
    showToast("تم نسخ الدوام");
  };

  const setDayNote = (date, note) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const next = { ...nightData, [date]: { ...cur, note } };
    updateNight(next);
  };

  const pendingCount = useMemo(() => {
    let count = 0;
    Object.entries(nightData).forEach(([date, nd]) => {
      (nd.doctors||[]).forEach(did => {
        const d = fd(did); if (!d) return;
        const di = dayIdx(date);
        const ndi = dayIdx(nextWork(date));
        const covs = nd.coverages || {};
        if (isClinic(getSlot(d,di,"am"))  && !(covs.am||[]).length)     count++;
        if (isClinic(getSlot(d,di,"pm"))  && !(covs.pm||[]).length)     count++;
        if (isClinic(getSlot(d,ndi,"am")) && !(covs.nextAm||[]).length) count++;
      });
    });
    return count;
  }, [nightData, doctors]);

  const TABS = [
    { id:"dashboard",icon:"📊", label:"لوحة التحكم" },
    { id:"monthly",  icon:"🌙", label:"الدوام المسائي" },
    { id:"coverage", icon:"🔄", label:"التغطيات الفردية" },
    { id:"doctors",  icon:"👨‍⚕️", label:"الأطباء" },
    { id:"leaves",   icon:"🏖", label:"الإجازات" },
    { id:"stats",    icon:"📈", label:"الإحصائيات" },
  ];

  if (!authed) return <LoginGate onSuccess={() => { setAuthed(true); S.set("fin_auth", true); }} />;

  return (
    <div style={{ display:"flex", minHeight:"100vh", background:"#f0f4f8", direction:"rtl", fontFamily:"'Segoe UI',Tahoma,sans-serif", fontSize:14 }}>
      {/* SIDEBAR */}
      <aside style={{ width:210, background:"#fff", display:"flex", flexDirection:"column", flexShrink:0, boxShadow:"2px 0 12px rgba(0,0,0,.04)", zIndex:2 }}>
        <div style={{ padding:"22px 18px 16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ width:38, height:38, borderRadius:11, background:"linear-gradient(135deg,#1e3a5f,#2c5282)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, color:"#fff", boxShadow:"0 4px 12px rgba(30,58,95,.35)" }}>⚕</div>
            <div>
              <div style={{ color:"#1e293b", fontWeight:800, fontSize:14 }}>الجداول الطبية</div>
              <div style={{ color:"#94a3b8", fontSize:10 }}>مركز دمام الطبي</div>
            </div>
          </div>
        </div>
        <div style={{ height:1, background:"#f1f5f9", margin:"0 16px 10px" }} />
        <nav style={{ padding:"0 12px", flex:1 }}>
          {TABS.map(t => {
            const active = page===t.id;
            return (
              <button key={t.id} onClick={() => setPage(t.id)}
                style={{ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"11px 14px", borderRadius:10, border:"none", cursor:"pointer", fontSize:13, fontWeight:active?700:500, marginBottom:4, transition:"all .15s", position:"relative",
                  background: active ? "linear-gradient(135deg,#1e3a5f,#2c5282)" : "transparent",
                  color: active ? "#fff" : "#64748b",
                  boxShadow: active ? "0 4px 12px rgba(30,58,95,.3)" : "none",
                }}>
                <span style={{ width:26, height:26, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, background: active?"rgba(255,255,255,.2)":"#f1f5f9" }}>{t.icon}</span>
                {t.label}
                {t.id==="monthly" && pendingCount>0 && (
                  <span style={{ position:"absolute", left:10, background:"#ef4444", color:"#fff", borderRadius:10, padding:"1px 7px", fontSize:10, fontWeight:700 }}>{pendingCount}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div style={{ padding:14, margin:12, borderRadius:12, background:"linear-gradient(135deg,#eff4fa,#e2ecf7)" }}>
          <div style={{ color:"#94a3b8", fontSize:10, marginBottom:8 }}>📅 {today}</div>
          <button onClick={() => { save(); showToast("✅ تم الحفظ"); }}
            style={{ width:"100%", padding:"8px", background:"linear-gradient(135deg,#1e3a5f,#2c5282)", border:"none", borderRadius:8, color:"#fff", cursor:"pointer", fontSize:11, fontWeight:700, boxShadow:"0 3px 10px rgba(30,58,95,.25)" }}>
            💾 حفظ الكل
          </button>
          <button onClick={() => { S.set("fin_auth", false); setAuthed(false); }}
            style={{ width:"100%", padding:"6px", marginTop:6, background:"transparent", border:"1px solid #cdddec", borderRadius:8, color:"#2c5282", cursor:"pointer", fontSize:10, fontWeight:600 }}>
            🔒 قفل
          </button>
        </div>
      </aside>

      {/* MAIN */}
      <main style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
        <div style={{ background:"#fff", padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", boxShadow:"0 1px 8px rgba(0,0,0,.03)" }}>
          <div>
            <div style={{ fontWeight:800, fontSize:18, color:"#1e293b" }}>{TABS.find(t=>t.id===page)?.label}</div>
            <div style={{ fontSize:11, color:"#94a3b8" }}>الرئيسية / {TABS.find(t=>t.id===page)?.label}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:12, color:"#64748b", fontWeight:600 }}>{MONTHS[new Date().getMonth()]} {new Date().getFullYear()}</span>
            <div style={{ width:36, height:36, borderRadius:10, background:"linear-gradient(135deg,#1e3a5f,#2c5282)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:700, fontSize:14 }}>د</div>
          </div>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:22 }}>
          {page==="dashboard" && <DashboardPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} today={today} onGoto={setPage} />}
          {page==="monthly" && <MonthlyPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} today={today} onAutoFill={(y,m) => { const next=autoFill(y,m,doctors,leaves,nightData); updateNight(next); showToast("✅ تم التوزيع التلقائي"); }} onAddDoc={addNightDoc} onRemoveDoc={removeNightDoc} onAddCov={addCoverage} onRemoveCov={removeCoverage} onClearMonth={clearMonth} onResetDay={resetDay} onCopyDay={copyDay} onSetNote={setDayNote} onEnsureDay={ensureDay} />}
          {page==="coverage" && <CoveragePage doctors={doctors} leaves={leaves} coverages={coverages} nightData={nightData} fd={fd} onAdd={addIndivCoverage} onRemove={removeIndivCoverage} showToast={showToast} />}
          {page==="doctors"  && <DoctorsPage doctors={doctors} leaves={leaves} today={today} fd={fd} onUpdateDocs={updateDocs} showToast={showToast} />}
          {page==="leaves"   && <LeavesPage doctors={doctors} leaves={leaves} fd={fd} onUpdate={(next) => { setLeaves(next); S.set("fin_leaves",next); }} showToast={showToast} />}
          {page==="stats"    && <StatsPage doctors={doctors} nightData={nightData} coverages={coverages} leaves={leaves} />}
        </div>
      </main>

      {toast && (
        <div style={{ position:"fixed", bottom:20, left:"50%", transform:"translateX(-50%)", background: toast.type==="warn"?"#d97706":"#15803d", color:"#fff", padding:"10px 24px", borderRadius:28, fontWeight:700, fontSize:13, zIndex:9999, boxShadow:"0 4px 16px rgba(0,0,0,.2)" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DASHBOARD PAGE (Material-style)
// ══════════════════════════════════════════════════════
function DashboardPage({ doctors, leaves, nightData, coverages, fd, today, onGoto }) {
  const now = new Date();
  const thisMonth = (ds) => { const [y,m]=ds.split("-"); return +y===now.getFullYear() && +m===now.getMonth()+1; };

  // Stats
  const monthNights = Object.entries(nightData).filter(([d,nd])=>thisMonth(d)&&(nd.doctors||[]).length);
  const totalNightAssigns = monthNights.reduce((a,[,nd])=>a+(nd.doctors||[]).length,0);
  const totalCovs = Object.entries(nightData).filter(([d])=>thisMonth(d)).reduce((a,[,nd])=>{const c=nd.coverages||{};return a+(c.am||[]).length+(c.pm||[]).length+(c.nextAm||[]).length;},0) + coverages.filter(c=>thisMonth(c.date)).length;
  const activeLeaves = leaves.filter(l=>l.start<=today && today<=l.end).length;
  let pending = 0;
  Object.entries(nightData).forEach(([date,nd])=>{
    if(!thisMonth(date)) return;
    const di=dayIdx(date), nextDi=dayIdx(nextWork(date)), covs=nd.coverages||{};
    (nd.doctors||[]).map(id=>fd(id)).filter(Boolean).forEach(d=>{
      if(isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)pending++;
      if(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)pending++;
      if(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length)pending++;
    });
  });

  const cards = [
    { icon:"🌙", label:"الدوام المسائي (الشهر)", val:totalNightAssigns, grad:"linear-gradient(135deg,#1e3a5f,#2c5282)", page:"monthly" },
    { icon:"🔄", label:"التغطيات (الشهر)", val:totalCovs, grad:"linear-gradient(135deg,#2c5282,#3b6ca8)", page:"coverage" },
    { icon:"⚠️", label:"تغطيات معلّقة", val:pending, grad:"linear-gradient(135deg,#b91c1c,#dc2626)", page:"monthly" },
    { icon:"🏖", label:"إجازات حالية", val:activeLeaves, grad:"linear-gradient(135deg,#1e3a5f,#2c5282)", page:"leaves" },
  ];

  // Per-day distribution chart (this month) — nights count per day-of-week
  const byWeekday = [0,1,2,3,4].map(di => {
    let count = 0;
    Object.entries(nightData).forEach(([date,nd])=>{ if(thisMonth(date)&&dayIdx(date)===di) count+=(nd.doctors||[]).length; });
    return count;
  });
  const maxWd = Math.max(...byWeekday, 1);

  // Top loaded doctors (this month extra load)
  const loads = doctors.map(doc=>{
    const fixedDays = doc.nightDays||[];
    let extra=0, covCount=0;
    Object.entries(nightData).forEach(([date,nd])=>{
      if(!thisMonth(date)) return;
      if((nd.doctors||[]).includes(doc.id) && !fixedDays.includes(dayIdx(date))) extra++;
      const c=nd.coverages||{};
      covCount += ((c.am||[]).includes(doc.id)?1:0)+((c.pm||[]).includes(doc.id)?1:0)+((c.nextAm||[]).includes(doc.id)?1:0);
    });
    covCount += coverages.filter(c=>c.coverDoctorId===doc.id && thisMonth(c.date)).length;
    return { doc, load: extra+covCount };
  }).filter(x=>x.load>0).sort((a,b)=>b.load-a.load).slice(0,6);
  const maxLoad = Math.max(...loads.map(l=>l.load), 1);

  return (
    <div>
      {/* Stat cards */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:16, marginBottom:20 }}>
        {cards.map(c => (
          <div key={c.label} onClick={()=>onGoto(c.page)} style={{ background:"#fff", borderRadius:16, padding:"18px", cursor:"pointer", boxShadow:"0 2px 12px rgba(0,0,0,.05)", position:"relative", overflow:"hidden", transition:"transform .15s" }}>
            <div style={{ position:"absolute", top:-12, left:16, width:52, height:52, borderRadius:14, background:c.grad, display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, boxShadow:"0 6px 16px rgba(0,0,0,.18)" }}>{c.icon}</div>
            <div style={{ textAlign:"left", paddingTop:6 }}>
              <div style={{ fontSize:11, color:"#94a3b8", fontWeight:600, marginBottom:2 }}>{c.label}</div>
              <div style={{ fontSize:30, fontWeight:800, color:"#1e293b" }}>{c.val}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Charts row */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:20 }}>
        {/* Bar chart: nights per weekday */}
        <div style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 2px 12px rgba(0,0,0,.05)" }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>🌙 توزيع الدوام المسائي</div>
          <div style={{ fontSize:11, color:"#94a3b8", marginBottom:16 }}>عدد المناوبات حسب اليوم (هذا الشهر)</div>
          <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-around", height:140, gap:8 }}>
            {byWeekday.map((v,di)=>(
              <div key={di} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
                <div style={{ fontSize:11, fontWeight:700, color:"#1e3a5f" }}>{v}</div>
                <div style={{ width:"100%", maxWidth:40, height:`${(v/maxWd)*100}%`, minHeight:4, background:"linear-gradient(180deg,#c026d3,#1e3a5f)", borderRadius:"6px 6px 0 0", transition:"height .3s" }} />
                <div style={{ fontSize:10, color:"#64748b", fontWeight:600 }}>{DAYS[di].slice(0,3)}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Top loaded doctors */}
        <div style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 2px 12px rgba(0,0,0,.05)" }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>📈 أكثر الأطباء عبئاً</div>
          <div style={{ fontSize:11, color:"#94a3b8", marginBottom:16 }}>العبء الإضافي (هذا الشهر)</div>
          {loads.length===0 ? <div style={{ fontSize:12, color:"#cbd5e1", textAlign:"center", padding:"30px 0" }}>لا يوجد عبء إضافي بعد</div> :
            loads.map(({doc,load})=>(
              <div key={doc.id} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:9 }}>
                <span style={{ fontSize:11, fontWeight:600, minWidth:90, maxWidth:110, color:"#475569" }}>{doc.name}</span>
                <div style={{ flex:1, height:10, background:"#f1f5f9", borderRadius:6, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${(load/maxLoad)*100}%`, background:`linear-gradient(90deg,${doc.color},${doc.color}aa)`, borderRadius:6 }} />
                </div>
                <span style={{ fontSize:12, fontWeight:800, color:doc.color, minWidth:18, textAlign:"center" }}>{load}</span>
              </div>
            ))
          }
        </div>
      </div>

      {/* Quick actions */}
      <div style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 2px 12px rgba(0,0,0,.05)" }}>
        <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>⚡ إجراءات سريعة</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:10 }}>
          {[{l:"🌙 الدوام المسائي",p:"monthly",g:"linear-gradient(135deg,#1e3a5f,#2c5282)"},
            {l:"🔄 تغطية فردية",p:"coverage",g:"linear-gradient(135deg,#2c5282,#3b6ca8)"},
            {l:"👨‍⚕️ الأطباء",p:"doctors",g:"linear-gradient(135deg,#0f1e36,#1e3a5f)"},
            {l:"📈 الإحصائيات",p:"stats",g:"linear-gradient(135deg,#3b6ca8,#5a8bc4)"},
          ].map(b=>(
            <button key={b.p} onClick={()=>onGoto(b.p)} style={{ padding:"14px", borderRadius:12, border:"none", cursor:"pointer", color:"#fff", fontWeight:700, fontSize:13, background:b.g, boxShadow:"0 4px 12px rgba(0,0,0,.12)" }}>{b.l}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// MONTHLY PAGE
// ══════════════════════════════════════════════════════
function MonthlyPage({ doctors, leaves, nightData, coverages, fd, today, onAutoFill, onAddDoc, onRemoveDoc, onAddCov, onRemoveCov, onClearMonth, onResetDay, onCopyDay, onSetNote, onEnsureDay }) {
  const now = new Date();
  const [month, setMonth] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [selDate, setSelDate] = useState(null);
  const [filter, setFilter] = useState("all"); // all | pending | done
  const [showCal, setShowCal] = useState(false); // calendar is secondary
  const [confirmClear, setConfirmClear] = useState(false);
  const [previewHtml, setPreviewHtml] = useState(null);

  const calDays = useMemo(() => {
    const dim = new Date(month.y, month.m+1, 0).getDate();
    return Array.from({ length:dim }, (_,i) => {
      const d = i+1;
      const date = `${month.y}-${String(month.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      return { date, di: dayIdx(date), day: d };
    }).filter(x => x.di >= 0);
  }, [month]);

  const firstOffset = calDays[0]?.di ?? 0;

  const printPDF = () => {
    const chip = (d) => `<span style="display:inline-block;background:${d.color}22;color:${d.color};border:1px solid ${d.color}55;border-radius:5px;padding:2px 10px;margin:2px;font-weight:700">${d.name}</span>`;
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;

    // ── TABLE 1: Evening shifts — date + night doctor + their coverages described relative to shift
    const eveRows = calDays.filter(({date}) => (nightData[date]?.doctors||[]).length)
      .map(({ date, di }) => {
        const nd = nightData[date];
        const covs = nd.coverages || {};
        const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
        const nextDi = dayIdx(nextWork(date));
        // For EACH night doctor, build their own coverage status block
        const perDoc = docs.map(d => {
          const needs = [];
          if (isClinic(getSlot(d,di,"am")))     needs.push({ key:"am", label:"صباحاً" });
          if (isClinic(getSlot(d,di,"pm")))     needs.push({ key:"pm", label:"ظهراً" });
          if (isClinic(getSlot(d,nextDi,"am"))) needs.push({ key:"nextAm", label:"اليوم التالي صباحاً" });
          if (needs.length === 0) {
            return `<div style="margin-bottom:6px"><strong style="color:${d.color}">🌙 ${d.name}</strong> <span style="color:#16a34a;font-size:11px">— لا يحتاج تغطية (لا عيادة)</span></div>`;
          }
          const lines = needs.map(n => {
            const coverIds = covs[n.key]||[];
            if (!coverIds.length) return `<div style="font-size:11px;color:#dc2626;margin-right:14px">• عيادة ${n.label}: ⚠️ تحتاج تغطية (غير معيّنة)</div>`;
            const names = coverIds.map(id=>fd(id)?.name).filter(Boolean).join("، ");
            return `<div style="font-size:11px;color:#15803d;margin-right:14px">• عيادة ${n.label}: يغطّيها ${names}</div>`;
          }).join("");
          return `<div style="margin-bottom:6px"><strong style="color:${d.color}">🌙 ${d.name}</strong>${lines}</div>`;
        }).join("");
        return `<tr>
          <td style="text-align:center;vertical-align:top"><strong>${dmy(date)}</strong></td>
          <td style="text-align:center;vertical-align:top">${DAYS[di]}</td>
          <td>${perDoc}</td>
        </tr>`;
      }).join("");

    // ── TABLE 2: Coverages organized by ACTUAL occurrence date (the day the cover doctor actually works)
    // Collect all coverage events keyed by actual date
    const covByDate = {}; // date -> [{coverDoc, period, detail}]
    const pushCov = (actualDate, coverId, period, detail) => {
      const cd = fd(coverId); if(!cd) return;
      if(!covByDate[actualDate]) covByDate[actualDate] = [];
      covByDate[actualDate].push({ cd, period, detail });
    };
    // From night-shift coverages
    calDays.forEach(({ date, di }) => {
      const nd = nightData[date] || {};
      const covs = nd.coverages || {};
      const nightNames = (nd.doctors||[]).map(id=>fd(id)?.name).filter(Boolean).join("، ");
      const nextDate = nextWork(date);
      (covs.am||[]).forEach(id=>pushCov(date,   id, "صباحاً", `عيادة ${nightNames} (مناوب ${DAYS[di]} ${dmy(date)})`));
      (covs.pm||[]).forEach(id=>pushCov(date,   id, "ظهراً",  `عيادة ${nightNames} (مناوب ${DAYS[di]} ${dmy(date)})`));
      (covs.nextAm||[]).forEach(id=>pushCov(nextDate, id, "صباحاً", `عيادة ${nightNames} (مناوب ${DAYS[di]} ${dmy(date)} — اليوم التالي)`));
    });
    // From individual coverages
    (coverages||[]).forEach(c => {
      const ad = c.absentId ? fd(c.absentId) : null;
      pushCov(c.date, c.coverDoctorId, c.period==="am"?"صباحاً":"ظهراً", `تغطية فردية${ad?` بدلاً من ${ad.name}`:""}`);
    });

    // Build table 2 rows sorted by actual date
    const covRows = Object.keys(covByDate).sort().map(date => {
      const di = dayIdx(date);
      const items = covByDate[date];
      return items.map((it,idx) => `<tr>
        ${idx===0?`<td rowspan="${items.length}" style="text-align:center;vertical-align:middle"><strong>${dmy(date)}</strong><br><span style="color:#64748b;font-size:12px">${di>=0?DAYS[di]:""}</span></td>`:""}
        <td>${chip(it.cd)}</td>
        <td style="text-align:center">${it.period}</td>
        <td style="font-size:12px">${it.detail}</td>
      </tr>`).join("");
    }).join("");

    const eveTable = eveRows
      ? `<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الدوام المسائي والتغطيات لكل طبيب</th></tr></thead><tbody>${eveRows}</tbody></table>`
      : `<p style="text-align:center;color:#94a3b8">لا يوجد دوام مسائي مسجّل</p>`;
    const covTable = covRows
      ? `<table><thead><tr><th>التاريخ الفعلي</th><th>الطبيب المُغطّي</th><th>الفترة</th><th>العيادة المُغطّاة</th></tr></thead><tbody>${covRows}</tbody></table>`
      : `<p style="text-align:center;color:#94a3b8">لا توجد تغطيات</p>`;

    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>جدول ${MONTHS[month.m]} ${month.y}</title>
    <style>
      body{font-family:Tahoma,sans-serif;padding:24px;direction:rtl;color:#1e293b}
      h1{text-align:center;font-size:22px;margin-bottom:2px}
      .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
      h2{font-size:16px;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid #1e3a8a;color:#1e3a8a}
      table{width:100%;border-collapse:collapse;margin-bottom:10px}
      th{background:#1e3a8a;color:#fff;padding:9px 12px;font-size:13px;text-align:right}
      td{border:1px solid #e2e8f0;padding:8px 12px;font-size:13px}
      tr:nth-child(even){background:#f8fafc}
      .btn{position:fixed;top:12px;left:12px;background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
      @media print{.btn{display:none}body{padding:12px}}
    </style></head><body>
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <h1>جدول الدوام المسائي والتغطيات</h1>
    <div class="sub">مركز دمام الطبي — ${MONTHS[month.m]} ${month.y}</div>
    <h2>🌙 أولاً: جدول الدوام المسائي والتغطيات المرتبطة به</h2>
    ${eveTable}
    <h2>🔄 ثانياً: جدول التغطيات حسب اليوم الفعلي</h2>
    <div style="color:#64748b;font-size:12px;margin-bottom:8px">مرتّبة بتاريخ وقوع التغطية فعلياً (تغطية "اليوم التالي" تظهر في يومها الحقيقي)</div>
    ${covTable}
    </body></html>`;
    // Show in-app preview with print button (window.open is blocked in artifact sandbox)
    setPreviewHtml(html);
  };

  // Print as BOXES — each day a card with date, names, coverages
  const printBoxes = () => {
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;
    const boxes = calDays.filter(({date}) => (nightData[date]?.doctors||[]).length || coverages.some(c=>c.date===date))
      .map(({ date, di }) => {
        const nd = nightData[date] || {};
        const covs = nd.coverages || {};
        const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
        const nextDi = dayIdx(nextWork(date));
        // Per night doctor: their name + coverage status
        const docBlocks = docs.map(d => {
          const needs = [];
          if (isClinic(getSlot(d,di,"am")))     needs.push({ key:"am", label:"صباحاً" });
          if (isClinic(getSlot(d,di,"pm")))     needs.push({ key:"pm", label:"ظهراً" });
          if (isClinic(getSlot(d,nextDi,"am"))) needs.push({ key:"nextAm", label:"اليوم التالي صباحاً" });
          let inner = "";
          if (needs.length === 0) {
            inner = `<div class="cov-line" style="color:#16a34a">لا يحتاج تغطية</div>`;
          } else {
            inner = needs.map(n=>{
              const ids = covs[n.key]||[];
              if (!ids.length) return `<div class="cov-line" style="color:#dc2626">${n.label}: ⚠️ غير معيّنة</div>`;
              const names = ids.map(id=>fd(id)?.name).filter(Boolean).join("، ");
              return `<div class="cov-line">${n.label}: يغطّيها ${names}</div>`;
            }).join("");
          }
          return `<div class="doc-block"><span class="doc" style="background:${d.color}22;color:${d.color};border-color:${d.color}55">🌙 ${d.name}</span>${inner}</div>`;
        }).join("");
        const indivItems = coverages.filter(c=>c.date===date).map(c=>{ const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; return cd?`🔄 ${cd.name} (${c.period==="am"?"صباحاً":"ظهراً"})${ad?` بدلاً من ${ad.name}`:""}`:""; }).filter(Boolean);
        return `<div class="box">
          <div class="box-head"><span class="box-date">${dmy(date)}</span><span class="box-day">${DAYS[di]}</span></div>
          <div class="box-body">${docs.length ? docBlocks : '<span class="empty">لا دوام مسائي</span>'}</div>
          ${indivItems.length ? `<div class="box-indiv"><div class="cov-title">تغطيات فردية</div>${indivItems.map(l=>`<div class="cov-line">${l}</div>`).join("")}</div>` : ""}
        </div>`;
      }).join("");

    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>مربعات ${MONTHS[month.m]} ${month.y}</title>
    <style>
      body{font-family:Tahoma,sans-serif;padding:20px;direction:rtl;color:#1e293b;background:#fff}
      h1{text-align:center;font-size:20px;margin-bottom:2px}
      .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
      .box{border:1.5px solid #cdddec;border-radius:12px;overflow:hidden;page-break-inside:avoid}
      .box-head{background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
      .box-date{font-size:18px;font-weight:800}
      .box-day{font-size:13px;font-weight:700}
      .box-docs{padding:10px 12px;display:flex;flex-wrap:wrap;gap:5px}
      .box-body{padding:10px 12px}
      .doc-block{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #eef2f7}
      .doc-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
      .doc{display:inline-block;margin-bottom:4px;border:1px solid;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700}
      .empty{color:#94a3b8;font-size:12px}
      .box-cov{padding:0 12px 10px}
      .cov-title{font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;border-top:1px dashed #e2e8f0;padding-top:6px}
      .cov-line{font-size:11px;color:#15803d;margin-bottom:2px}
      .box-indiv{padding:0 12px 10px}
      .box-indiv .cov-line{color:#ea580c}
      .btn{position:fixed;top:12px;left:12px;background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
      @media print{.btn{display:none}body{padding:8px}}
    </style></head><body>
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <h1>جدول الدوام المسائي — مربعات</h1>
    <div class="sub">مركز دمام الطبي — ${MONTHS[month.m]} ${month.y}</div>
    <div class="grid">${boxes || '<p style="color:#94a3b8">لا توجد بيانات</p>'}</div>
    </body></html>`;
    setPreviewHtml(html);
  };

  // Summary counts
  const summary = useMemo(() => {
    let assigned=0, pending=0, totalCov=0;
    calDays.forEach(({date,di}) => {
      const nd = nightData[date];
      if (nd?.doctors?.length) {
        assigned++;
        const nextDi = dayIdx(nextWork(date));
        const covs = nd.coverages||{};
        nd.doctors.forEach(did=>{
          const d = fd(did); if(!d) return;
          if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
          if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
          if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
        });
        totalCov += (covs.am||[]).length+(covs.pm||[]).length+(covs.nextAm||[]).length;
      }
    });
    return { assigned, pending, totalCov, indiv: coverages.filter(c=>{const [y,m]=c.date.split("-");return +y===month.y&&+m===month.m+1;}).length };
  }, [nightData, coverages, calDays, month]);

  const filledDays = calDays.filter(({date}) => {
    const nd = nightData[date];
    const hasCov = coverages.some(c=>c.date===date);
    // show any day that exists in nightData (even empty, just created), has coverages, or is selected
    const has = (nd?.doctors?.length) || hasCov || (nd && date===selDate);
    if (filter==="all") return has;
    if (filter==="pending") {
      if (!nd?.doctors?.length) return false;
      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    if (filter==="done") {
      if (!nd?.doctors?.length) return false;
      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return !nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    return has;
  });

  return (
    <div style={{ display:"flex", gap:14 }}>
      <div style={{ flex:1, minWidth:0 }}>
        {/* Controls */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
          <button onClick={()=>setMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})} style={Btn.nav}>→</button>
          <div style={{ fontWeight:800, fontSize:16, minWidth:120, textAlign:"center" }}>{MONTHS[month.m]} {month.y}</div>
          <button onClick={()=>setMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})} style={Btn.nav}>←</button>
          <div style={{ flex:1 }} />
          <button onClick={()=>onAutoFill(month.y,month.m)} style={{ ...Btn.primary, background:"linear-gradient(135deg,#1e3a5f,#2c5282)" }}>⚡ توزيع تلقائي</button>
          <button onClick={printPDF} style={{ ...Btn.nav, color:"#15803d", borderColor:"#bbf7d0" }}>🖨️ جدول</button>
          <button onClick={printBoxes} style={{ ...Btn.nav, color:"#1e3a5f", borderColor:"#cdddec" }}>🔲 مربعات</button>
          {confirmClear ? (
            <span style={{ display:"inline-flex", gap:4, alignItems:"center" }}>
              <span style={{ fontSize:11, color:"#dc2626", fontWeight:700 }}>متأكد؟</span>
              <button onClick={()=>{ onClearMonth(month.y,month.m); setConfirmClear(false); }} style={{ ...Btn.nav, background:"#dc2626", color:"#fff", border:"none" }}>نعم، صفّر</button>
              <button onClick={()=>setConfirmClear(false)} style={Btn.nav}>إلغاء</button>
            </span>
          ) : (
            <button onClick={()=>setConfirmClear(true)} style={{ ...Btn.nav, color:"#dc2626", borderColor:"#fecaca" }}>🗑️ تصفير الشهر</button>
          )}
        </div>

        {/* Quick summary */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8, marginBottom:14 }}>
          {[{l:"أيام معيّنة",v:summary.assigned,c:"#1d4ed8",bg:"#eff6ff"},
            {l:"تغطيات معلّقة",v:summary.pending,c:"#dc2626",bg:"#fef2f2"},
            {l:"تغطيات مُعيّنة",v:summary.totalCov,c:"#15803d",bg:"#f0fdf4"},
            {l:"تغطيات فردية",v:summary.indiv,c:"#ea580c",bg:"#fff7ed"},
          ].map(({l,v,c,bg})=>(
            <div key={l} style={{ background:bg, borderRadius:9, padding:"8px 6px", textAlign:"center" }}>
              <div style={{ fontSize:22, fontWeight:800, color:c }}>{v}</div>
              <div style={{ fontSize:10, color:"#64748b" }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Add specific evening shift + filter row */}
        <div style={{ display:"flex", gap:8, marginBottom:12, flexWrap:"wrap", alignItems:"center" }}>
          <input type="date" style={{ ...SEL, width:"auto", flex:"0 0 auto" }} onChange={e=>{ if(e.target.value){ if(dayIdx(e.target.value)<0){ return; } onEnsureDay(e.target.value); setSelDate(e.target.value); setMonth({ y:+e.target.value.split("-")[0], m:+e.target.value.split("-")[1]-1 }); } }} value="" />
          <span style={{ fontSize:11, color:"#94a3b8" }}>← اختر تاريخاً لإضافة يوم دوام مسائي</span>
          <div style={{ flex:1 }} />
          {[["all","الكل"],["pending","⚠️ معلّق"],["done","✅ مكتمل"]].map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{ padding:"5px 12px", borderRadius:7, fontSize:11, fontWeight:700, cursor:"pointer", border: filter===k?"2px solid #1e3a5f":"1px solid #e2e8f0", background: filter===k?"#eff4fa":"#fff", color: filter===k?"#1e3a5f":"#64748b" }}>{l}</button>
          ))}
          <button onClick={()=>setShowCal(s=>!s)} style={{ ...Btn.nav, color: showCal?"#1e3a5f":"#64748b" }}>{showCal?"📋 إخفاء التقويم":"📅 عرض التقويم"}</button>
        </div>

        {/* Calendar (secondary, toggle) */}
        {showCal && (
          <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", border:"1px solid #e2e8f0", marginBottom:16 }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", background:"#0f172a" }}>
              {DAYS.map(d => <div key={d} style={{ padding:"8px", textAlign:"center", color:"#93b4d8", fontWeight:700, fontSize:11 }}>{d}</div>)}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
              {Array.from({ length:firstOffset }, (_,i) => <div key={`e${i}`} style={{ minHeight:70, background:"#f8fafc", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9" }} />)}
              {calDays.map(({ date, di, day }) => {
                const nd = nightData[date] || {};
                const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                const covs = nd.coverages || {};
                const isT = date===today; const isSel = selDate===date;
                return (
                  <div key={date} onClick={() => setSelDate(isSel?null:date)}
                    style={{ minHeight:70, padding:"4px 5px", cursor:"pointer", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9",
                      background: isSel?"#eff6ff":isT?"#fffbeb":"#fff", outline: isSel?"2px solid #2563eb":isT?"2px solid #f59e0b":"none" }}>
                    <div style={{ fontSize:9, color:isT?"#d97706":"#94a3b8", fontWeight:isT?700:400, marginBottom:2 }}>{day}</div>
                    {docs.map(d => <div key={d.id} style={{ background:d.color+"22", border:`1px solid ${d.color}55`, borderRadius:3, padding:"1px 4px", marginBottom:1, fontSize:8, fontWeight:700, color:d.color }}>🌙 {d.name}</div>)}
                    {!docs.length && <div style={{ fontSize:8, color:"#d1d5db", textAlign:"center", paddingTop:8 }}>—</div>}
                    {(covs.am||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#15803d" }}>(ص) {d.name}</div>)}
                    {(covs.pm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#0891b2" }}>(ظ) {d.name}</div>)}
                    {(covs.nextAm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#1e3a5f" }}>(غد ص) {d.name}</div>)}
                    {coverages.filter(c=>c.date===date).map(c=>{const cd=fd(c.coverDoctorId);return cd&&<div key={c.id} style={{ fontSize:7, color:"#ea580c" }}>(تغطية) {cd.name}</div>;})}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* MAIN: Vibrant day cards with inline editing */}
        <div>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:10, display:"flex", alignItems:"center", gap:8 }}>
            📋 أيام الدوام المسائي
            <span style={{ fontSize:11, fontWeight:400, color:"#94a3b8" }}>({filledDays.length} يوم)</span>
          </div>
          {filledDays.length === 0 ? (
            <div style={{ textAlign:"center", color:"#94a3b8", padding:"34px 16px", fontSize:13, background:"linear-gradient(135deg,#f8fafc,#eff4fa)", borderRadius:14, border:"2px dashed #cdddec" }}>
              ✨ لا توجد أيام بعد — اضغط <strong>⚡ توزيع تلقائي</strong> أو اختر تاريخاً لإضافة دوام مسائي
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {filledDays.map(({ date, di, day }) => (
                <DayCard key={date} date={date} di={di} day={day}
                  nd={nightData[date]||{}} indiv={coverages.filter(c=>c.date===date)}
                  doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd}
                  expanded={selDate===date} onToggle={()=>setSelDate(selDate===date?null:date)}
                  onAddDoc={onAddDoc} onRemoveDoc={onRemoveDoc} onAddCov={onAddCov} onRemoveCov={onRemoveCov} onResetDay={onResetDay} />
              ))}
            </div>
          )}
        </div>
      </div>

      {/* PDF preview modal (fallback if download blocked) */}
      {previewHtml && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:9998, display:"flex", flexDirection:"column", padding:20 }} onClick={()=>setPreviewHtml(null)}>
          <div style={{ background:"#fff", borderRadius:12, flex:1, overflow:"hidden", display:"flex", flexDirection:"column", maxWidth:900, margin:"0 auto", width:"100%" }} onClick={e=>e.stopPropagation()}>
            <div style={{ padding:"12px 16px", borderBottom:"1px solid #e2e8f0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <strong style={{ fontSize:14 }}>معاينة الجدول للنشر</strong>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{ const win=window.frames["pdfframe"]; if(win) win.print(); }} style={{ ...Btn.primary }}>🖨️ طباعة</button>
                <button onClick={()=>setPreviewHtml(null)} style={Btn.secondary}>إغلاق</button>
              </div>
            </div>
            <iframe name="pdfframe" title="preview" srcDoc={previewHtml} style={{ flex:1, border:"none", width:"100%" }} />
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DAY CARD — vibrant, inline-editable day card
// ══════════════════════════════════════════════════════
const DAY_GRADIENTS = [
  "linear-gradient(135deg,#0f1e36,#1e3a5f)", // Sun
  "linear-gradient(135deg,#1e3a5f,#2c5282)", // Mon
  "linear-gradient(135deg,#2c5282,#3b6ca8)", // Tue
  "linear-gradient(135deg,#1e3a5f,#3b6ca8)", // Wed
  "linear-gradient(135deg,#0f1e36,#2c5282)", // Thu
];

function DayCard({ date, di, day, nd, indiv, doctors, leaves, nightData, coverages, fd, expanded, onToggle, onAddDoc, onRemoveDoc, onAddCov, onRemoveCov, onResetDay }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const nightDocs = nd.doctors || [];
  const covs = nd.coverages || { am:[], pm:[], nextAm:[] };
  const nextDate = nextWork(date);
  const nextDi = dayIdx(nextDate);
  const grad = DAY_GRADIENTS[di] || DAY_GRADIENTS[0];

  // coverage needs per night doctor
  const docNeeds = (doc) => {
    const needs = [];
    if (isClinic(getSlot(doc,di,"am")))     needs.push({ key:"am",     label:"☀️ صباحاً",     covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,di,"pm")))     needs.push({ key:"pm",     label:"🌅 ظهراً",      covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,nextDi,"am"))) needs.push({ key:"nextAm", label:"🌄 الغد صباحاً", covDate:nextDate, covDi:nextDi });
    return needs;
  };

  let pending = 0;
  nightDocs.map(id=>fd(id)).filter(Boolean).forEach(d=>{
    if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
    if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
    if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
  });
  const done = pending===0 && nightDocs.length>0;

  return (
    <div style={{ background:"#fff", borderRadius:10, overflow:"hidden", boxShadow: expanded?"0 6px 20px rgba(79,70,229,.15)":"0 1px 3px rgba(0,0,0,.05)", border: expanded?"2px solid #2c5282":"1px solid #eef2f7", transition:"all .15s" }}>
      {/* Thin compact header row */}
      <div onClick={onToggle} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", cursor:"pointer", borderRight:`5px solid transparent`, borderImage:`${grad} 1` }}>
        {/* Day badge */}
        <div style={{ background:grad, color:"#fff", borderRadius:8, minWidth:38, height:38, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
          <span style={{ fontSize:15, fontWeight:800, lineHeight:1 }}>{day}</span>
          <span style={{ fontSize:8, opacity:.9 }}>{DAYS[di].slice(0,3)}</span>
        </div>
        {/* Day name + date */}
        <div style={{ flexShrink:0, minWidth:70 }}>
          <div style={{ fontWeight:700, fontSize:13, color:"#1e293b" }}>{DAYS[di]}</div>
          <div style={{ fontSize:10, color:"#94a3b8" }}>{date}</div>
        </div>
        {/* Inline chips (collapsed preview) */}
        <div style={{ flex:1, display:"flex", flexWrap:"wrap", gap:4, alignItems:"center", minWidth:0 }}>
          {nightDocs.map(id=>fd(id)).filter(Boolean).map(d=>(
            <span key={d.id} style={{ background:d.color+"18", color:d.color, border:`1px solid ${d.color}44`, borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:700 }}>🌙 {d.name}</span>
          ))}
          {nightDocs.length===0 && <span style={{ fontSize:10, color:"#cbd5e1" }}>— لا دوام</span>}
          {indiv.map(c=>{const cd=fd(c.coverDoctorId);return cd&&<span key={c.id} style={{ background:"#fff7ed", color:"#ea580c", border:"1px solid #fed7aa", borderRadius:5, padding:"2px 8px", fontSize:10 }}>🔄 {cd.name}</span>;})}
        </div>
        {/* Status + chevron */}
        {done && <span style={{ background:"#f0fdf4", color:"#15803d", borderRadius:14, padding:"2px 9px", fontSize:10, fontWeight:700, flexShrink:0 }}>✅</span>}
        {pending>0 && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:14, padding:"2px 9px", fontSize:10, fontWeight:700, flexShrink:0 }}>⚠️ {pending}</span>}
        <span style={{ fontSize:12, color:"#94a3b8", flexShrink:0 }}>{expanded?"▲":"▼"}</span>
      </div>

      {/* Expanded body - inline editing */}
      {expanded && (
        <div style={{ padding:"12px 14px", borderTop:"1px solid #f1f5f9" }}>
          {/* Night doctors with their coverage needs */}
          {nightDocs.map(id=>fd(id)).filter(Boolean).map(d => {
            const needs = docNeeds(d);
            return (
              <div key={d.id} style={{ marginBottom:10, border:`1px solid ${d.color}33`, borderRadius:11, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, background:d.color+"14", padding:"7px 10px" }}>
                  <div style={{ ...AV, background:d.color, width:26, height:26, fontSize:9 }}>{sn(d.name).slice(0,2)}</div>
                  <span style={{ flex:1, fontSize:13, fontWeight:700, color:d.color }}>🌙 {d.name}</span>
                  <button onClick={()=>{
                    const covLines = docNeeds(d).map(n=>{ const ids=covs[n.key]||[]; const nm=ids.map(id=>fd(id)?.name).filter(Boolean).join("، "); return `- ${n.label}: ${nm?("يغطّيها "+nm):"تحتاج تغطية"}`; }).join("\n");
                    mailtoAlert(d, `تنبيه دوام مسائي — ${DAYS[di]} ${date}`,
                      `عزيزي الطبيب ${d.name}،\n\nلديك دوام مسائي يوم ${DAYS[di]} الموافق ${date}.\n${covLines?("\nالتغطيات:\n"+covLines):""}\n\nمركز دمام الطبي`);
                  }} style={{ background:"#fff", border:`1px solid ${d.color}44`, color:d.color, cursor:"pointer", fontSize:11, borderRadius:6, padding:"2px 8px", fontWeight:700 }} title={d.email?`إرسال تنبيه إلى ${d.email}`:"لا يوجد إيميل — أضفه في صفحة الأطباء"}>📧 تنبيه</button>
                  <button onClick={()=>onRemoveDoc(date,d.id)} style={{ background:"#fff", border:`1px solid ${d.color}44`, color:"#dc2626", cursor:"pointer", fontSize:12, borderRadius:6, padding:"2px 7px" }}>✕</button>
                </div>
                <div style={{ padding:"8px 10px" }}>
                  {needs.length===0 ? (
                    <div style={{ fontSize:10, color:"#15803d", background:"#f0fdf4", borderRadius:6, padding:"4px 8px" }}>✅ لا يحتاج تغطية — لا توجد عيادة في جدوله هذا اليوم</div>
                  ) : needs.map(({key,label,covDate,covDi}) => {
                    const assigned = (covs[key]||[]).map(id=>fd(id)).filter(Boolean);
                    const avail = getAvailable(doctors, nightDocs, covDi, covDate, key==="pm"?"pm":"am", leaves, nightData, { [key]: covs[key]||[] }, coverages);
                    const freeDocs = avail.filter(x=>x.status==="free");
                    const warnDocs = avail.filter(x=>x.status==="warn");
                    return (
                      <div key={key} style={{ marginBottom:7 }}>
                        <div style={{ fontSize:10, fontWeight:700, color:"#64748b", marginBottom:3 }}>{label} — تحتاج تغطية</div>
                        {assigned.map(cd=>(
                          <div key={cd.id} style={{ display:"flex", alignItems:"center", gap:5, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:6, padding:"3px 7px", marginBottom:3 }}>
                            <span style={{ flex:1, fontSize:11, color:"#15803d", fontWeight:600 }}>✓ يغطّيها {cd.name}</span>
                            <button onClick={()=>onRemoveCov(date,key,cd.id)} style={{ background:"none", border:"none", color:"#94a3b8", cursor:"pointer", fontSize:11 }}>✕</button>
                          </div>
                        ))}
                        <select style={{ ...SEL, fontSize:11, padding:"6px 7px" }} value="" onChange={e=>{ if(e.target.value) onAddCov(date,key,+e.target.value); }}>
                          <option value="">➕ تثبيت طبيب متاح ({freeDocs.length})</option>
                          {freeDocs.length>0 && <optgroup label="✅ متاح (فارغ)">{freeDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>{fdoc.name}</option>)}</optgroup>}
                          {warnDocs.length>0 && <optgroup label="⚠️ لديه التزام">{warnDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>⚠️ {fdoc.name}</option>)}</optgroup>}
                        </select>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Add night doctor */}
          {nightDocs.length<3 && (
            <select style={{ ...SEL, marginBottom:8 }} value="" onChange={e=>{ if(e.target.value) onAddDoc(date,+e.target.value); }}>
              <option value="">➕ إضافة طبيب للدوام المسائي...</option>
              {doctors.filter(d=>!nightDocs.includes(d.id)).map(d=>{
                const ol = onLeave(d,date,leaves);
                return <option key={d.id} value={d.id} disabled={ol}>{ol?`🚫 ${d.name} (إجازة)`:d.name}{(d.nightDays||[]).includes(di)?" (ثابت)":""}</option>;
              })}
            </select>
          )}

          {/* Individual coverages on this day */}
          {indiv.length>0 && (
            <div style={{ marginTop:4, paddingTop:8, borderTop:"1px dashed #e2e8f0" }}>
              <div style={{ fontSize:10, fontWeight:700, color:"#ea580c", marginBottom:4 }}>🔄 تغطيات فردية (من صفحة التغطيات)</div>
              {indiv.map(c=>{const cd=fd(c.coverDoctorId);return cd&&(
                <div key={c.id} style={{ fontSize:10, color:"#ea580c", background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:5, padding:"3px 8px", marginBottom:3 }}>{cd.name} — {c.period==="am"?"صباحاً":"ظهراً"}</div>
              );})}
            </div>
          )}

          {/* Footer actions */}
          {nightDocs.length>0 && (
            <div style={{ marginTop:6, display:"flex", justifyContent:"flex-end" }}>
              {confirmReset ? (
                <span style={{ display:"inline-flex", gap:6, alignItems:"center" }}>
                  <span style={{ fontSize:11, color:"#dc2626", fontWeight:700 }}>مسح اليوم؟</span>
                  <button onClick={()=>{ onResetDay(date); setConfirmReset(false); }} style={{ ...Btn.danger, background:"#dc2626", color:"#fff", border:"none" }}>نعم</button>
                  <button onClick={()=>setConfirmReset(false)} style={Btn.secondary}>لا</button>
                </span>
              ) : (
                <button onClick={()=>setConfirmReset(true)} style={{ ...Btn.danger }}>🔁 إعادة تعيين اليوم</button>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DOCTORS PAGE
// ══════════════════════════════════════════════════════
function DoctorsPage({ doctors, leaves, today, fd, onUpdateDocs, showToast }) {
  const [search, setSearch] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [changed, setChanged] = useState({});
  const [newDocName, setNewDocName] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const SLOT_OPTS = [["","— فراغ"],["clinic","🦷 عيادة"],["admin","📋 إداري"],["training","🎓 تدريب"],["audit","📊 تدقيق"],["virtual","💻 افتراضية"]];

  const updateSched = (docId, di, p, v) => {
    onUpdateDocs(doctors.map(d => d.id!==docId ? d : { ...d, sched:{ ...d.sched, [di]:{ ...d.sched[di], [p]:v } } }));
    setChanged(prev => ({ ...prev, [docId]:true }));
  };

  const toggleNightDay = (docId, di) => {
    onUpdateDocs(doctors.map(d => {
      if (d.id !== docId) return d;
      const cur = Array.isArray(d.nightDays) ? d.nightDays : [];
      const next = cur.includes(di) ? cur.filter(x=>x!==di) : [...cur, di].sort();
      return { ...d, nightDays: next };
    }));
  };

  const [confirmDel, setConfirmDel] = useState(null);
  const deleteDoc = id => {
    onUpdateDocs(doctors.filter(d => d.id!==id));
    setConfirmDel(null);
    showToast("تم حذف الطبيب", "warn");
  };

  const addDoc = () => {
    const name = newDocName.trim();
    if (!name) return;
    const colors = ["#2c5282","#0ea5e9","#10b981","#f59e0b","#3b6ca8","#84cc16","#f97316","#14b8a6"];
    const nd = { id:Date.now(), name, color:colors[Math.floor(Math.random()*colors.length)], nightDays:[], email:"", sched:Object.fromEntries([0,1,2,3,4].map(d=>[d,{am:"",pm:""}])) };
    onUpdateDocs([...doctors, nd]);
    setExpanded(nd.id);
    setNewDocName("");
    setShowAdd(false);
    showToast(`تم إضافة ${name}`);
  };

  return (
    <div>
      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        <input style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="🔍 بحث..." value={search} onChange={e=>setSearch(e.target.value)} />
        <button onClick={()=>setShowAdd(s=>!s)} style={Btn.primary}>+ إضافة طبيب</button>
      </div>
      {showAdd && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:14, marginBottom:14, display:"flex", gap:8, alignItems:"center" }}>
          <input autoFocus style={{ flex:1, padding:"8px 12px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:13, outline:"none" }} placeholder="اسم الطبيب الجديد..." value={newDocName} onChange={e=>setNewDocName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addDoc(); }} />
          <button onClick={addDoc} style={Btn.primary}>حفظ</button>
          <button onClick={()=>{ setShowAdd(false); setNewDocName(""); }} style={Btn.secondary}>إلغاء</button>
        </div>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        {doctors.filter(d=>d.name.includes(search)).map(doc => {
          const ol = onLeave(doc, today, leaves);
          const isExp = expanded === doc.id;
          const isDirty = changed[doc.id];
          return (
            <div key={doc.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, overflow:"hidden", borderRight:`4px solid ${doc.color}` }}>
              {/* Header */}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", cursor:"pointer" }} onClick={() => setExpanded(isExp?null:doc.id)}>
                <div style={{ ...AV, background:doc.color, width:38, height:38, fontSize:13 }}>{sn(doc.name).slice(0,2)}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:700, fontSize:14 }}>{doc.name}</div>
                  <div style={{ color:"#94a3b8", fontSize:11, display:"flex", gap:6 }}>
                    <span>{wSlots(doc)} فترة/أسبوع</span>
                    {(doc.nightDays||[]).length>0 && <span style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:4, padding:"1px 6px", fontSize:10 }}>🌙 {(doc.nightDays||[]).map(d=>DAYS[d]).join("، ")}</span>}
                  </div>
                </div>
                {/* Mini grid */}
                <div style={{ display:"flex", gap:3 }}>
                  {[0,1,2,3,4].map(di => (
                    <div key={di}>
                      <div style={{ fontSize:8, color:"#94a3b8", textAlign:"center", marginBottom:2 }}>{["أح","إث","ثل","أر","خم"][di]}</div>
                      {["am","pm"].map(p => {
                        const t = getSlot(doc,di,p);
                        const sc = SLOT_COLORS[t] || SLOT_COLORS[""];
                        return <div key={p} style={{ width:18, height:18, borderRadius:3, background:sc.bg, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, marginBottom:2, color:sc.text }}>{sc.icon}</div>;
                      })}
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:4 }} onClick={e=>e.stopPropagation()}>
                  {ol && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:4, padding:"2px 6px", fontSize:9, fontWeight:700 }}>إجازة</span>}
                  {isDirty && <button style={{ ...Btn.primary, padding:"3px 8px", fontSize:10 }} onClick={() => setChanged(p=>({...p,[doc.id]:false}))}>💾</button>}
                  {confirmDel===doc.id ? (
                    <>
                      <button style={{ ...Btn.danger, padding:"4px 8px", background:"#dc2626", color:"#fff", border:"none" }} onClick={() => deleteDoc(doc.id)}>تأكيد</button>
                      <button style={{ ...Btn.secondary, padding:"4px 8px" }} onClick={() => setConfirmDel(null)}>✕</button>
                    </>
                  ) : (
                    <button style={{ ...Btn.danger, padding:"4px 8px" }} onClick={() => setConfirmDel(doc.id)}>🗑</button>
                  )}
                </div>
                <span style={{ color:"#94a3b8", fontSize:11 }}>{isExp?"▲":"▼"}</span>
              </div>

              {/* Expanded */}
              {isExp && (
                <div style={{ borderTop:"1px solid #f1f5f9", padding:14, background:"#f8fafc" }}>
                  {/* Email field */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span>📧</span>
                      <div style={{ fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>البريد للتنبيهات</div>
                      <input type="email" value={doc.email||""} placeholder="doctor@example.com"
                        onChange={e=>onUpdateDocs(doctors.map(x=>x.id!==doc.id?x:{...x,email:e.target.value}))}
                        style={{ flex:1, padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left" }} />
                    </div>
                  </div>
                  {/* Night days - multi select toggle */}
                  <div style={{ marginBottom:12, padding:"10px 12px", background:"#fff", borderRadius:8, border:"1px solid #e2e8f0" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <span>🌙</span>
                      <div style={{ fontSize:12, fontWeight:600 }}>أيام الدوام المسائي الثابت <span style={{ color:"#94a3b8", fontWeight:400 }}>(يمكن اختيار أكثر من يوم)</span></div>
                    </div>
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                      {DAYS.map((d,i) => {
                        const active = (doc.nightDays||[]).includes(i);
                        return (
                          <button key={i} onClick={() => toggleNightDay(doc.id, i)}
                            style={{ padding:"6px 12px", borderRadius:7, fontSize:12, fontWeight:700, cursor:"pointer", border: active?"2px solid #1e3a5f":"1px solid #e2e8f0",
                              background: active?"#0f1e36":"#f8fafc", color: active?"#93b4d8":"#64748b" }}>
                            {active?"🌙 ":""}{d}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  {/* Schedule table: rows = days, columns = ص / م / مسائي */}
                  <div style={{ fontWeight:700, fontSize:12, color:"#475569", marginBottom:8 }}>الجدول الأسبوعي</div>
                  <div style={{ overflowX:"auto" }}>
                    <table style={{ borderCollapse:"collapse", width:"100%", minWidth:380 }}>
                      <thead>
                        <tr style={{ background:"#5b8def" }}>
                          <th style={{ padding:"6px 10px", fontSize:12, color:"#fff", fontWeight:700, minWidth:70 }}>اليوم</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>ص</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>م</th>
                          <th style={{ padding:"6px 8px", fontSize:12, color:"#fff", fontWeight:700 }}>مسائي</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[0,1,2,3,4].map(di => {
                          const isFixedEve = (doc.nightDays||[]).includes(di);
                          return (
                            <tr key={di}>
                              <td style={{ padding:"4px 10px", fontWeight:700, fontSize:12, color:"#fff", background:"#7ea4e6", textAlign:"center" }}>{DAYS[di]}</td>
                              {["am","pm"].map(period => {
                                const val = getSlot(doc,di,period);
                                const sc = SLOT_COLORS[val] || SLOT_COLORS[""];
                                return (
                                  <td key={period} style={{ padding:"3px 4px" }}>
                                    <select value={val} onChange={e => updateSched(doc.id,di,period,e.target.value)}
                                      style={{ width:"100%", padding:"6px 3px", borderRadius:6, border:`2px solid ${val?sc.text:"#e2e8f0"}`, background:sc.bg, color:sc.text, fontSize:11, fontWeight:600, cursor:"pointer", outline:"none" }}>
                                      {SLOT_OPTS.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
                                    </select>
                                  </td>
                                );
                              })}
                              {/* Evening column - reflects fixed night day */}
                              <td style={{ padding:"3px 4px", textAlign:"center" }}>
                                {isFixedEve ? (
                                  <div style={{ background:"#0f1e36", color:"#93b4d8", borderRadius:6, padding:"6px 3px", fontSize:11, fontWeight:700 }}>🌙 عيادة</div>
                                ) : (
                                  <div style={{ color:"#cbd5e1", fontSize:11 }}>—</div>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{ fontSize:10, color:"#94a3b8", marginTop:6 }}>💡 عمود "مسائي" يعكس يوم المناوبة الثابت تلقائياً — عدّله من الأعلى</div>
                  {isDirty && <div style={{ marginTop:8, display:"flex", justifyContent:"flex-end" }}><button style={Btn.primary} onClick={()=>setChanged(p=>({...p,[doc.id]:false}))}>💾 حفظ</button></div>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// LEAVES PAGE
// ══════════════════════════════════════════════════════
function LeavesPage({ doctors, leaves, fd, onUpdate, showToast }) {
  const [form, setForm] = useState({ doctorId:"", start:"", end:"", type:"annual" });
  const [show, setShow] = useState(false);
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };

  const add = () => {
    if (!form.doctorId||!form.start||!form.end) return;
    const next = [...leaves, { id:Date.now(), doctorId:+form.doctorId, start:form.start, end:form.end, type:form.type }];
    onUpdate(next);
    setForm({ doctorId:"", start:"", end:"", type:"annual" });
    setShow(false);
    showToast("تم تسجيل الإجازة");
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontWeight:700 }}>الإجازات ({leaves.length})</div>
        <button style={Btn.primary} onClick={()=>setShow(true)}>+ إجازة جديدة</button>
      </div>
      {show && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>🏖 إجازة جديدة</div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>الطبيب</label>
            <select style={SEL} value={form.doctorId} onChange={e=>setForm(p=>({...p,doctorId:e.target.value}))}>
              <option value="">اختر...</option>
              {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>النوع</label>
            <select style={SEL} value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>
              {Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div style={{ display:"flex", gap:8, marginBottom:12 }}>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>من</label>
              <input type="date" style={SEL} value={form.start} onChange={e=>setForm(p=>({...p,start:e.target.value}))} />
            </div>
            <div style={{ flex:1 }}>
              <label style={{ display:"block", fontSize:11, color:"#64748b", fontWeight:700, marginBottom:4 }}>إلى</label>
              <input type="date" style={SEL} value={form.end} onChange={e=>setForm(p=>({...p,end:e.target.value}))} />
            </div>
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button style={Btn.primary} onClick={add}>حفظ</button>
            <button style={Btn.secondary} onClick={()=>setShow(false)}>إلغاء</button>
          </div>
        </div>
      )}
      {leaves.length===0 && <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px 0" }}>لا توجد إجازات</div>}
      {leaves.map(l => {
        const d = fd(l.doctorId); if (!d) return null;
        const days = Math.round((new Date(l.end)-new Date(l.start))/86400000)+1;
        return (
          <div key={l.id} style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:9, padding:"10px 14px", marginBottom:7, display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ ...AV, background:d.color, width:34, height:34, fontSize:12 }}>{sn(d.name).slice(0,2)}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700 }}>{d.name}</div>
              <div style={{ fontSize:11, color:"#64748b" }}>{l.start} → {l.end} ({days} أيام) — {TYPES[l.type]}</div>
            </div>
            <button style={Btn.danger} onClick={()=>onUpdate(leaves.filter(x=>x.id!==l.id))}>🗑</button>
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// COVERAGE PAGE (individual coverages = absence/excuse)
// ══════════════════════════════════════════════════════
function CoveragePage({ doctors, leaves, coverages, nightData, fd, onAdd, onRemove, showToast }) {
  const [form, setForm] = useState({ absentId:"", date:"", period:"am", coverDoctorId:"", reason:"absence" });
  const [show, setShow] = useState(false);
  const REASONS = { absence:"غياب", excuse:"عذر", emergency:"طارئ", other:"أخرى" };
  const PERIODS = { am:"☀️ صباح", pm:"🌅 ظهر" };

  // Available doctors for the selected slot
  const availForForm = useMemo(() => {
    if (!form.date) return [];
    const di = dayIdx(form.date);
    if (di < 0) return [];
    return getAvailable(doctors, form.absentId?[+form.absentId]:[], di, form.date, form.period, leaves, nightData, {}, coverages);
  }, [form.date, form.period, form.absentId, doctors, leaves, nightData]);

  // Check if the absent doctor actually has a clinic in the selected period
  const absentHasClinic = useMemo(() => {
    if (!form.absentId || !form.date) return null; // null = not applicable yet
    const di = dayIdx(form.date);
    if (di < 0) return null;
    const ad = doctors.find(d=>d.id===+form.absentId);
    if (!ad) return null;
    return isClinic(getSlot(ad, di, form.period));
  }, [form.absentId, form.date, form.period, doctors]);

  const submit = () => {
    if (!form.date || !form.coverDoctorId) { showToast("أكمل البيانات", "warn"); return; }
    if (dayIdx(form.date) < 0) { showToast("اختر يوم عمل (أحد-خميس)", "warn"); return; }
    // Block coverage if the absent doctor has NO clinic in that period
    if (form.absentId && absentHasClinic === false) {
      showToast("الطبيب الغائب ليس لديه عيادة في هذه الفترة — لا تحتاج تغطية", "warn");
      return;
    }
    onAdd({
      date: form.date,
      period: form.period,
      coverDoctorId: +form.coverDoctorId,
      absentId: form.absentId ? +form.absentId : null,
      reason: form.reason,
    });
    setForm({ absentId:"", date:"", period:"am", coverDoctorId:"", reason:"absence" });
    setShow(false);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontWeight:700 }}>التغطيات الفردية ({coverages.length})</div>
        <button style={Btn.primary} onClick={()=>setShow(true)}>+ تغطية جديدة</button>
      </div>

      <div style={{ background:"#fffbeb", border:"1px solid #fde68a", borderRadius:8, padding:"8px 12px", marginBottom:14, fontSize:12, color:"#92400e" }}>
        ℹ️ التغطيات الفردية مستقلة عن الدوام المسائي — تُستخدم لتغطية غياب أو عذر طبيب في فترة معينة.
      </div>

      {show && (
        <div style={{ background:"#fff", border:"1px solid #e2e8f0", borderRadius:10, padding:16, marginBottom:14 }}>
