      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return !nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    return has;
  }).filter(({date,di,day}) => {
    if (!search.trim()) return true;
    const q = search.trim();
    // match by date number or doctor name
    if (String(day).includes(q) || date.includes(q) || DAYS[di].includes(q)) return true;
    const nd = nightData[date]||{};
    const names = [...(nd.doctors||[]), ...(nd.coverages?.am||[]), ...(nd.coverages?.pm||[]), ...(nd.coverages?.nextAm||[])].map(id=>fd(id)?.name||"").join(" ");
    const covNames = coverages.filter(c=>c.date===date).map(c=>fd(c.coverDoctorId)?.name||"").join(" ");
    return (names+" "+covNames).includes(q);
  });

  return (

            <span style={{ background:"#f0fdf4", color:"#15803d", borderRadius:8, padding:"5px 10px", fontSize:12, fontWeight:700 }}>{summary.totalCov} تغطية</span>

            {summary.pending>0 && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:8, padding:"5px 10px", fontSize:12, fontWeight:700 }}>⚠️ {summary.pending} معلّقة</span>}

            </div>
          )}
        </div>

        {/* 3) Date picker + search + status filter */}
        <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center", background:"#fff", border:"1px solid #eef2f7", borderRadius:12, padding:12 }}>
          <input type="date" style={{ ...SEL, width:"auto", flex:"0 0 auto" }} onChange={e=>{ if(e.target.value){ if(dayIdx(e.target.value)<0){ return; } onEnsureDay(e.target.value); setSelDate(e.target.value); setMonth({ y:+e.target.value.split("-")[0], m:+e.target.value.split("-")[1]-1 }); } }} value="" />
          <input type="text" placeholder="🔍 بحث باسم طبيب أو تاريخ..." value={search} onChange={e=>setSearch(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 180px", minWidth:140 }} />
          {search && <button onClick={()=>setSearch("")} style={{ ...Btn.nav, color:"#dc2626" }}>✕</button>}
          <div style={{ flex:1 }} />
          {[["all","الكل"],["pending","⚠️ معلّق"],["done","✅ مكتمل"]].map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{ padding:"5px 12px", borderRadius:7, fontSize:11, fontWeight:700, cursor:"pointer", border: filter===k?"2px solid #1e3a5f":"1px solid #e2e8f0", background: filter===k?"#eff4fa":"#fff", color: filter===k?"#1e3a5f":"#64748b" }}>{l}</button>
          ))}
        </div>

        {/* Calendar (secondary, toggle) */}
        {showCal && (
          <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", border:"1px solid #e2e8f0", marginBottom:16 }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", background:"#0f172a" }}>
              {DAYS.map(d => <div key={d} style={{ padding:"8px", textAlign:"center", color:"#93b4d8", fontWeight:700, fontSize:11 }}>{d}</div>)}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
              {Array.from({ length:firstOffset }, (_,i) => <div key={`e${i}`} style={{ minHeight:70, background:"#f8fafc", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9" }} />)}
              {calDays.map(({ date, di, day }) => {
                const nd = nightData[date] || {};
                const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                const covs = nd.coverages || {};
                const isT = date===today; const isSel = selDate===date;
                return (
                  <div key={date} onClick={() => setSelDate(isSel?null:date)}
                    style={{ minHeight:70, padding:"4px 5px", cursor:"pointer", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9",
                      background: isSel?"#eff6ff":isT?"#fffbeb":"#fff", outline: isSel?"2px solid #2563eb":isT?"2px solid #f59e0b":"none" }}>
                    <div style={{ fontSize:9, color:isT?"#d97706":"#94a3b8", fontWeight:isT?700:400, marginBottom:2 }}>{day}</div>
                    {docs.map(d => <div key={d.id} style={{ background:d.color+"22", border:`1px solid ${d.color}55`, borderRadius:3, padding:"1px 4px", marginBottom:1, fontSize:8, fontWeight:700, color:d.color }}>🌙 {d.name}</div>)}
                    {!docs.length && <div style={{ fontSize:8, color:"#d1d5db", textAlign:"center", paddingTop:8 }}>—</div>}
                    {(covs.am||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#15803d" }}>(ص) {d.name}</div>)}
                    {(covs.pm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#0891b2" }}>(ظ) {d.name}</div>)}
                    {(covs.nextAm||[]).map(id=>fd(id)).filter(Boolean).map(d=><div key={d.id} style={{ fontSize:7, color:"#1e3a5f" }}>(غد ص) {d.name}</div>)}
                    {coverages.filter(c=>c.date===date).map(c=>{const cd=fd(c.coverDoctorId);return cd&&<div key={c.id} style={{ fontSize:7, color:"#ea580c" }}>(تغطية) {cd.name}</div>;})}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Swap panel */}
        {showSwap && (
          <div style={{ background:"#faf5ff", border:"1px solid #ddd6fe", borderRadius:12, padding:16, marginBottom:16 }}>
            <div style={{ fontWeight:700, fontSize:14, color:"#6d28d9", marginBottom:10 }}>🔁 تبديل مناوبين عبر الشهر كامل</div>
            <div style={{ fontSize:11, color:"#94a3b8", marginBottom:12 }}>كل مناوبات وتغطيات الطبيب الأول تنتقل للثاني والعكس.</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
              <select value={swapA} onChange={e=>setSwapA(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 140px" }}>
                <option value="">الطبيب الأول...</option>
                {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <span style={{ fontSize:18 }}>⇄</span>
              <select value={swapB} onChange={e=>setSwapB(e.target.value)} style={{ ...SEL, width:"auto", flex:"1 1 140px" }}>
                <option value="">الطبيب الثاني...</option>
                {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <button onClick={()=>{ onSwap(+swapA,+swapB); setSwapA(""); setSwapB(""); setShowSwap(false); }}
                style={{ background:"#7c3aed", color:"#fff", border:"none", borderRadius:8, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>تبديل</button>
            </div>
          </div>
        )}

        {/* Evening schedule (single column) */}
        <div>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
            <span style={{ fontWeight:800, fontSize:15 }}>🌙 الدوام المسائي</span>
            <span style={{ fontSize:12, fontWeight:400, color:"#94a3b8" }}>({filledDays.length} يوم)</span>
            <div style={{ flex:1 }} />
            <span style={{ fontSize:11, color:"#64748b" }}>طريقة العرض:</span>
            <div style={{ display:"flex", gap:0, border:"1px solid #cdddec", borderRadius:8, overflow:"hidden" }}>
              <button onClick={()=>setViewMode("calendar")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="calendar"?"#1e3a5f":"#fff", color: viewMode==="calendar"?"#fff":"#64748b" }}>📅 تقويم</button>
              <button onClick={()=>setViewMode("table")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="table"?"#1e3a5f":"#fff", color: viewMode==="table"?"#fff":"#64748b" }}>📋 جدول</button>
              <button onClick={()=>setViewMode("boxes")} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontSize:12, fontWeight:700, background: viewMode==="boxes"?"#1e3a5f":"#fff", color: viewMode==="boxes"?"#fff":"#64748b" }}>🔲 مربعات</button>
            </div>
          </div>
          {filledDays.length === 0 ? (
            <div style={{ textAlign:"center", color:"#94a3b8", padding:"34px 16px", fontSize:14, background:"linear-gradient(135deg,#f8fafc,#eff4fa)", borderRadius:14, border:"2px dashed #cdddec" }}>
              ✨ لا توجد أيام بعد — افتح ⚙️ الأوامر واضغط <strong>⚡ إكمال الناقص</strong> أو اختر تاريخاً
            </div>
          ) : viewMode==="table" ? (
            <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", boxShadow:"0 4px 16px rgba(30,58,95,.06)" }}>
              {/* Column header */}
              <div style={{ display:"flex", alignItems:"center", gap:14, padding:"12px 16px", background:"#1e3a5f", color:"#fff", fontSize:13, fontWeight:700 }}>
                <div style={{ minWidth:52, textAlign:"center" }}>اليوم</div>
                <div style={{ flex:1 }}>الدوام المسائي والتغطيات</div>
                <div style={{ minWidth:62, textAlign:"center" }}>الحالة</div>
                <div style={{ width:14 }} />
              </div>
              <div style={{ display:"flex", flexDirection:"column" }}>
                {filledDays.map(({ date, di, day }) => (
                  <DayCard key={date} date={date} di={di} day={day}
                    nd={nightData[date]||{}} indiv={coverages.filter(c=>c.date===date)}
                    doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd}
                    expanded={selDate===date} onToggle={()=>setSelDate(selDate===date?null:date)}
                    onAddDoc={onAddDoc} onRemoveDoc={onRemoveDoc} onAddCov={onAddCov} onRemoveCov={onRemoveCov} onResetDay={onResetDay} onSetNote={onSetNote} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} onSetSlots={onSetSlots} />
                ))}
              </div>
            </div>
          ) : viewMode==="boxes" ? (
            /* Boxes view — redesigned clean cards */
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:16 }}>
              {filledDays.map(({ date, di, day }) => {
                const nd = nightData[date]||{}; const covs = nd.coverages||{};
                const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                const indiv = coverages.filter(c=>c.date===date);
                const isSel = selDate===date;
                const r = analyzeDay(date, doctors, leaves, nightData, coverages, null);
                const slotL = p => p==="am"?"صباح":p==="pm"?"ظهر":"مسائي";
                const slotIcon = p => p==="am"?"☀️":p==="pm"?"🌅":"🌙";
                const hasIssue = r.gaps.length>0 || r.conflicts.length>0;
                const nDi = dayIdx(nextWork(date));
                return (
                  <div key={date} onClick={()=>setSelDate(isSel?null:date)} style={{ background:"#fff", borderRadius:18, border: isSel?"2.5px solid #2c5282":hasIssue?"1.5px solid #fcd9b6":"1px solid #edf1f6", overflow:"hidden", cursor:"pointer", boxShadow: isSel?"0 8px 24px rgba(44,82,130,.18)":"0 3px 14px rgba(30,58,95,.07)", transition:"all .15s" }}>
                    {/* Header */}
                    <div style={{ background:"linear-gradient(135deg,#1e3a5f,#2c5282)", color:"#fff", padding:"11px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div style={{ display:"flex", alignItems:"baseline", gap:6 }}>
                        <span style={{ fontWeight:800, fontSize:20 }}>{day}</span>
                        <span style={{ fontSize:12, opacity:.85 }}>/{month.m+1}</span>
                      </div>
                      <span style={{ fontSize:13, fontWeight:700, background:"rgba(255,255,255,.18)", borderRadius:20, padding:"3px 12px" }}>{DAYS[di]}</span>
                    </div>

                    {/* Two columns: evening + coverages side by side */}
                    <div style={{ display:"flex", gap:0, flexWrap:"wrap" }}>
                    {/* Section 1: Evening shift */}
                    <div style={{ padding:"12px 16px", flex:"1 1 150px", minWidth:0 }}>
                      <div style={{ fontSize:10, fontWeight:800, color:"#94a3b8", letterSpacing:"1px", marginBottom:9, display:"flex", alignItems:"center", gap:5 }}>
                        <span style={{ width:18, height:2, background:"#2c5282", borderRadius:2, display:"inline-block" }} />🌙 الدوام المسائي
                      </div>
                      {docs.length ? docs.map(d=>{
                        const myCov = [];
                        if (isClinic(getSlot(d,di,"am")))  (covs.am||[]).forEach(id=>{const c=fd(id);if(c)myCov.push({p:"am",n:c.name});});
                        if (isClinic(getSlot(d,di,"pm")))  (covs.pm||[]).forEach(id=>{const c=fd(id);if(c)myCov.push({p:"pm",n:c.name});});
                        if (isClinic(getSlot(d,nDi,"am"))) (covs.nextAm||[]).forEach(id=>{const c=fd(id);if(c)myCov.push({p:"nextAm",n:c.name});});
                        return (
                          <div key={d.id} style={{ marginBottom:10 }}>
                            {/* Doctor chip with avatar */}
                            <div style={{ display:"flex", alignItems:"center", gap:9, background:d.color+"12", borderRadius:11, padding:"8px 11px", border:`1px solid ${d.color}30` }}>
                              <div style={{ width:32, height:32, borderRadius:"50%", background:d.color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:12, flexShrink:0 }}>{sn(d.name).slice(0,2)}</div>
                              <span style={{ fontSize:15, fontWeight:800, color:d.color }}>{d.name}</span>
                            </div>
                            {/* Coverage of this doctor's clinics */}
                            {myCov.length>0 && (
                              <div style={{ marginTop:6, marginRight:10, display:"flex", flexDirection:"column", gap:4 }}>
                                {myCov.map((c,i)=>(
                                  <div key={i} style={{ display:"flex", alignItems:"center", gap:6, fontSize:12 }}>
                                    <span style={{ color:"#cbd5e1" }}>↳</span>
                                    <span style={{ fontSize:11 }}>{slotIcon(c.p)}</span>
                                    <span style={{ color:"#64748b" }}>{slotL(c.p)}:</span>
                                    <span style={{ fontWeight:700, color:"#15803d", background:"#f0fdf4", borderRadius:5, padding:"1px 8px" }}>{c.n}</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      }) : <div style={{ fontSize:12, color:"#cbd5e1", padding:"4px 0" }}>— لا يوجد دوام مسائي</div>}
                    </div>

                    {/* Section 2: Individual coverages (left column) */}
                    <div style={{ padding:"11px 16px", background:"#fffaf4", borderRight:"1px solid #f6e8d8", flex:"1 1 150px", minWidth:0 }}>
                        <div style={{ fontSize:10, fontWeight:800, color:"#c2410c", letterSpacing:"1px", marginBottom:8, display:"flex", alignItems:"center", gap:5 }}>
                          <span style={{ width:18, height:2, background:"#ea580c", borderRadius:2, display:"inline-block" }} />🔄 تغطيات فردية
                        </div>
                        {indiv.length>0 ? indiv.map(c=>{const cd=fd(c.coverDoctorId);const ad=c.absentId?fd(c.absentId):null;return cd&&(
                          <div key={c.id} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                            <span style={{ fontSize:10, background:"#fff1e6", color:"#ea580c", borderRadius:5, padding:"2px 7px", fontWeight:700, flexShrink:0 }}>{slotIcon(c.period)} {slotL(c.period)}</span>
                            <span style={{ fontSize:13, color:"#9a3412", fontWeight:700 }}>{cd.name}</span>
                            {ad && <span style={{ fontSize:11, color:"#c2937a" }}>بدل {ad.name}</span>}
                          </div>
                        );}) : <div style={{ fontSize:11, color:"#cbd5e1" }}>— لا توجد</div>}
                      </div>
                    </div>
                    {/* end two columns */}

                    {/* Gaps & conflicts */}
                    {hasIssue && (
                      <div style={{ padding:"9px 16px", background:"#fff5f5", borderTop:"1px solid #fdd" }}>
                        {r.gaps.map((g,i)=>(
                          <div key={`g${i}`} style={{ fontSize:11, color:"#c2410c", fontWeight:700, display:"flex", gap:5, marginBottom:2 }}>
                            <span>🔶</span><span>عيادة {fd(g.ownerId)?.name} ({slotL(g.period)}) مكشوفة{g.suggestions&&g.suggestions.length?` — اقترح: ${fd(g.suggestions[0])?.name}`:""}</span>
                          </div>
                        ))}
                        {[...new Set(r.conflicts.map(c=>c.text))].map((t,i)=>(
                          <div key={`c${i}`} style={{ fontSize:11, color:"#dc2626", fontWeight:700, display:"flex", gap:5 }}><span>🔴</span><span>{t}</span></div>
                        ))}
                      </div>
                    )}
                    {nd.note && <div style={{ fontSize:11, color:"#a16207", padding:"7px 16px", background:"#fffbeb", borderTop:"1px solid #fef0c7", display:"flex", gap:5 }}><span>📝</span><span>{nd.note}</span></div>}

                    {/* Tap hint */}
                    {!isSel && <div style={{ fontSize:10, color:"#cbd5e1", textAlign:"center", padding:"6px", borderTop:"1px solid #f8fafc" }}>اضغط للتعديل</div>}
                  </div>
                );
              })}
            </div>
          ) : null}
          {/* Calendar view */}
          {viewMode==="calendar" && filledDays.length>0 && (
            <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", border:"1px solid #e2e8f0" }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", background:"#1e3a5f" }}>
                {DAYS.map(d => <div key={d} style={{ padding:"9px", textAlign:"center", color:"#fff", fontWeight:700, fontSize:12 }}>{d}</div>)}
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
                {Array.from({ length:firstOffset }, (_,i) => <div key={`e${i}`} style={{ minHeight:90, background:"#f8fafc", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9" }} />)}
                {calDays.map(({ date, di, day }) => {
                  const nd = nightData[date] || {}; const covs = nd.coverages || {};
                  const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
                  const isT = date===today; const isSel = selDate===date;
                  return (
                    <div key={date} onClick={() => setSelDate(isSel?null:date)}
                      style={{ minHeight:90, padding:"5px 6px", cursor:"pointer", borderBottom:"1px solid #f1f5f9", borderLeft:"1px solid #f1f5f9",
                        background: isSel?"#eff6ff":isT?"#fffbeb":"#fff", outline: isSel?"2px solid #2c5282":"none" }}>
                      <div style={{ fontSize:10, color:isT?"#d97706":"#94a3b8", fontWeight:700, marginBottom:3 }}>{day}</div>
                      {docs.map(d => <div key={d.id} style={{ background:d.color+"1e", border:`1px solid ${d.color}55`, borderRadius:4, padding:"2px 5px", marginBottom:2, fontSize:9, fontWeight:700, color:d.color }}>🌙 {d.name}</div>)}
                      {!docs.length && <div style={{ fontSize:9, color:"#d1d5db", textAlign:"center", paddingTop:6 }}>—</div>}
                      {(() => {
                        const nDi = dayIdx(nextWork(date));
                        const ownerFor = (per) => docs.filter(d=>isClinic(getSlot(d, per==="nextAm"?nDi:di, per==="nextAm"?"am":per))).map(d=>d.name).join("، ");
                        const out = [];
                        (covs.am||[]).map(id=>fd(id)).filter(Boolean).forEach(d=>{const o=ownerFor("am");out.push(<div key={`am${d.id}`} style={{ fontSize:9, color:"#15803d", marginTop:1 }}>تغطية عيادة {o||"؟"} صباحاً: {d.name}</div>);});
                        (covs.pm||[]).map(id=>fd(id)).filter(Boolean).forEach(d=>{const o=ownerFor("pm");out.push(<div key={`pm${d.id}`} style={{ fontSize:9, color:"#0891b2", marginTop:1 }}>تغطية عيادة {o||"؟"} ظهراً: {d.name}</div>);});
                        // previous workday's nextAm lands on THIS morning → show it here
                        const dd=new Date(date); let pStr=null;
                        for(let i=1;i<=4;i++){const p=new Date(dd);p.setDate(dd.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6){pStr=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`;break;}}
                        if(pStr){ const pnd=nightData[pStr]||{}; const pdocs=(pnd.doctors||[]).map(id=>fd(id)).filter(Boolean); const owner=pdocs.filter(d=>isClinic(getSlot(d,di,"am"))).map(d=>d.name).join("، ");
                          ((pnd.coverages||{}).nextAm||[]).map(id=>fd(id)).filter(Boolean).forEach(d=>out.push(<div key={`pna${d.id}`} style={{ fontSize:9, color:"#15803d", marginTop:1 }}>تغطية عيادة {owner||"؟"} صباحاً (دوام أمس): {d.name}</div>)); }
                        return out;
                      })()}
                      {coverages.filter(c=>c.date===date).map(c=>{const cd=fd(c.coverDoctorId);const ad=c.absentId?fd(c.absentId):null;const per=c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً";return cd&&<div key={c.id} style={{ fontSize:9, color:"#ea580c", marginTop:1 }}>{ad?`تغطية عيادة ${ad.name} ${per}: ${cd.name}`:`تغطية فردية (${per}): ${cd.name}`}</div>;})}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {/* Selected day editor in boxes/calendar mode */}
          {(viewMode==="boxes"||viewMode==="calendar") && selDate && (
            <div style={{ marginTop:14, background:"#fff", borderRadius:12, border:"2px solid #2c5282", overflow:"hidden" }}>
              <DayCard date={selDate} di={dayIdx(selDate)} day={+selDate.split("-")[2]}
                nd={nightData[selDate]||{}} indiv={coverages.filter(c=>c.date===selDate)}
                doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd}
                expanded={true} onToggle={()=>setSelDate(null)}
                onAddDoc={onAddDoc} onRemoveDoc={onRemoveDoc} onAddCov={onAddCov} onRemoveCov={onRemoveCov} onResetDay={onResetDay} onSetNote={onSetNote} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} onSetSlots={onSetSlots} />
            </div>
          )}
          </div>

      {/* PDF preview modal (fallback if download blocked) */}
      {previewHtml && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:9998, display:"flex", flexDirection:"column", padding:20 }} onClick={()=>setPreviewHtml(null)}>
          <div style={{ background:"#fff", borderRadius:12, flex:1, overflow:"hidden", display:"flex", flexDirection:"column", maxWidth:900, margin:"0 auto", width:"100%" }} onClick={e=>e.stopPropagation()}>
            <div style={{ padding:"12px 16px", borderBottom:"1px solid #e2e8f0", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <strong style={{ fontSize:14 }}>معاينة الجدول للنشر</strong>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{ const win=window.frames["pdfframe"]; if(win) win.print(); }} style={{ ...Btn.primary }}>🖨️ طباعة</button>
                <button onClick={()=>setPreviewHtml(null)} style={Btn.secondary}>إغلاق</button>
              </div>
            </div>
            <iframe name="pdfframe" title="preview" srcDoc={previewHtml} style={{ flex:1, border:"none", width:"100%" }} />
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DAY CARD — vibrant, inline-editable day card
// ══════════════════════════════════════════════════════
const DAY_GRADIENTS = [
  "#1e3a5f", "#2c5282", "#3b6ca8", "#2c5282", "#1e3a5f",
];

// Extra (emergency) individual coverages view — separate from night-shift coverages
function ExtraCoveragesView({ doctors, leaves, nightData, coverages, fd, calDays, month, onAddIndiv, onRemoveIndiv }) {
  const monthCovs = coverages.filter(c=>{ const [y,m]=c.date.split("-"); return +y===month.y && +m===month.m+1; });
  const byDate = {};
  monthCovs.forEach(c=>{ (byDate[c.date] = byDate[c.date]||[]).push(c); });
  const dates = Object.keys(byDate).sort();
  const REASONS = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" };

        ℹ️ التغطيات الإضافية الطارئة (غياب/مرض/عذر) — مستقلة عن تغطيات الدوام المسائي المخطّطة. لإضافة تغطية، اختر يوماً ثم سجّلها.
      </div>

      {/* Day picker to add */}
      <div style={{ background:"#fff", border:"1px solid #eef2f7", borderRadius:12, padding:14, marginBottom:14 }}>

        )}
        {pickDate && dayIdx(pickDate)<0 && <div style={{ fontSize:12, color:"#dc2626" }}>اختر يوم عمل (الأحد-الخميس)</div>}
      </div>

      {/* List of existing extra coverages */}
      <div style={{ fontWeight:800, fontSize:15, marginBottom:12 }}>🔄 التغطيات الطارئة المسجّلة ({monthCovs.length})</div>
      {dates.length===0 ? (
        <div style={{ textAlign:"center", color:"#94a3b8", padding:"30px", fontSize:13, background:"#f8fafc", borderRadius:12, border:"2px dashed #e2e8f0" }}>لا توجد تغطيات طارئة هذا الشهر</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>

            return (
              <div key={date} style={{ background:"#fff", border:"1px solid #fed7aa", borderRadius:11, overflow:"hidden" }}>
                <div style={{ background:"#fff7ed", padding:"8px 12px", display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ background:"#ea580c", color:"#fff", borderRadius:7, padding:"3px 10px", fontSize:13, fontWeight:800 }}>{d}/{month.m+1}</span>
                  <span style={{ fontWeight:700, fontSize:13, color:"#9a3412" }}>{DAYS[di]}</span>
                </div>
                <div style={{ padding:10 }}>
                  {byDate[date].map(c=>{
                    const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null;
                    return cd&&(
                      <div key={c.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", background:"#fffdf9", border:"1px solid #fed7aa", borderRadius:8, marginBottom:5, fontSize:12 }}>
                        <span style={{ background:"#fff7ed", color:"#ea580c", borderRadius:5, padding:"2px 8px", fontSize:10, fontWeight:700 }}>{periodLabel(c.period)}</span>
                        <span style={{ flex:1, color:"#9a3412" }}><strong>{cd.name}</strong>{ad?` يغطّي عن ${ad.name}`:""} {c.reason?`(${REASONS[c.reason]||c.reason})`:""}</span>
                        <button onClick={()=>onRemoveIndiv(c.id)} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:14 }}>✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Inline adder for individual (absence-based) coverage within a day card
function IndivCoverageAdder({ date, di, doctors, leaves, nightData, coverages, fd, onAddIndiv, forceOpen }) {
  const [open, setOpen] = useState(!!forceOpen);
  const [absentId, setAbsentId] = useState("");
  const [reason, setReason] = useState("absence");
  const [covByPeriod, setCovByPeriod] = useState({ am:"", pm:"", evening:"" });

  const PERIODS = [
    { key:"am", label:"☀️ صباح" },
    { key:"pm", label:"🌅 ظهر" },
    { key:"evening", label:"🌙 مسائي" },
  ];
  const REASONS = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" };

  const ad = doctors.find(d=>d.id===+absentId);

  // For each period: does the absent doctor have a clinic? is it already covered by night schedule?
  const periodInfo = (key) => {
    if (!ad) return { hasClinic:false };
    let hasClinic;
    if (key==="evening") hasClinic = (nightData[date]?.doctors||[]).includes(ad.id) || (ad.nightDays||[]).includes(di);
    else hasClinic = isClinic(getSlot(ad, di, key));
    // already covered via night schedule (only am/pm, when absent doctor is the night doctor)
    let alreadyCov = null;
    if (key!=="evening" && (nightData[date]?.doctors||[]).includes(ad.id)) {
      const ids = (nightData[date]?.coverages||{})[key]||[];
      if (ids.length) alreadyCov = ids.map(id=>fd(id)?.name).filter(Boolean).join("، ");
    }
    return { hasClinic, alreadyCov };
  };

  const busyIds = (key) => {
    const nd = nightData[date]||{}; const c = nd.coverages||{};
    const ids = [...(c[key]||[])];
    // RULE: a doctor with an evening shift this day cannot cover ANY period (one day = one task)
    (nd.doctors||[]).forEach(id=>ids.push(id));
    // anyone with an evening individual coverage this day is also busy all day
    coverages.forEach(cv=>{ if(cv.date===date && cv.period==="evening") ids.push(cv.coverDoctorId); });
    coverages.forEach(cv=>{ if(cv.date===date && cv.period===key) ids.push(cv.coverDoctorId); });
    // a doctor covering ANY other period same day is also busy (can't be two places)
    coverages.forEach(cv=>{ if(cv.date===date) ids.push(cv.coverDoctorId); });
    // For morning: a doctor covering "tomorrow morning" from the previous workday lands here
    if (key==="am") {
      const d = new Date(date);
      for (let i=1;i<=4;i++){ const p=new Date(d); p.setDate(d.getDate()-i); const wd=p.getDay(); if(wd!==5&&wd!==6){ const ps=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`; ((nightData[ps]?.coverages||{}).nextAm||[]).forEach(id=>ids.push(id)); break; } }
    }
    // for am/pm: a doctor with their OWN clinic this period is busy
    if (key!=="evening") doctors.forEach(d=>{ if(isClinic(getSlot(d,di,key))) ids.push(d.id); });
    return [...new Set(ids)];
  };

  // periods needing coverage (has clinic, not already covered)
  const neededPeriods = ad ? PERIODS.filter(p=>{ const info=periodInfo(p.key); return info.hasClinic && !info.alreadyCov; }) : [];
  const anyAssigned = Object.entries(covByPeriod).some(([k,v])=>v && neededPeriods.find(p=>p.key===k));

  const save = () => {
    if (!ad || !anyAssigned) return;
    let count = 0;
    neededPeriods.forEach(p=>{
      const cid = covByPeriod[p.key];
      if (cid) { onAddIndiv({ date, period:p.key, coverDoctorId:+cid, absentId:+absentId, reason }); count++; }
    });
    setAbsentId(""); setReason("absence"); setCovByPeriod({ am:"", pm:"", evening:"" }); setOpen(false);
  };

  if (!open) return (
    <button onClick={()=>setOpen(true)} style={{ width:"100%", padding:"8px", background:"#fff", border:"1px dashed #fdba74", borderRadius:7, color:"#ea580c", cursor:"pointer", fontSize:12, fontWeight:700, marginTop:2 }}>➕ تسجيل غياب طبيب وتغطية فتراته</button>
  );

  return (
    <div style={{ background:"#fffdf9", border:"1px solid #fed7aa", borderRadius:10, padding:12, marginTop:4 }}>
      <div style={{ display:"flex", gap:6, marginBottom:10 }}>
        <select value={absentId} onChange={e=>{ setAbsentId(e.target.value); setCovByPeriod({am:"",pm:"",evening:""}); }} style={{ ...SEL, fontSize:12, flex:2 }}>
          <option value="">اختر الطبيب الغائب...</option>
          {doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
        <select value={reason} onChange={e=>setReason(e.target.value)} style={{ ...SEL, fontSize:12, flex:1 }}>
          {Object.entries(REASONS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
      </div>

      {ad && (
        <div style={{ marginBottom:10 }}>
          <div style={{ fontSize:11, color:"#92400e", fontWeight:700, marginBottom:8, background:"#fff7ed", borderRadius:6, padding:"6px 10px" }}>
            📋 فترات د.{ad.name.replace("د.","")} يوم {DAYS[di]} — يغيب اليوم كاملاً:
          </div>
          {PERIODS.map(p=>{
            const info = periodInfo(p.key);
            if (!info.hasClinic) {
              return (
                <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#f8fafc", borderRadius:7, fontSize:11, color:"#94a3b8" }}>
                  <span style={{ minWidth:60, fontWeight:700 }}>{p.label}</span>
                  <span>— لا يوجد لديه عيادة</span>
                </div>
              );
            }
            if (info.alreadyCov) {
              return (
                <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#fffbeb", border:"1px solid #fde68a", borderRadius:7, fontSize:11, color:"#b45309" }}>
                  <span style={{ minWidth:60, fontWeight:700 }}>{p.label}</span>
                  <span>✓ مُغطّاة في الدوام المسائي ({info.alreadyCov})</span>
                </div>
              );
            }
            const busy = busyIds(p.key);
            return (
              <div key={p.key} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 10px", marginBottom:5, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:7 }}>
                <span style={{ minWidth:60, fontWeight:700, fontSize:11, color:"#15803d" }}>{p.label}</span>
                <span style={{ fontSize:10, color:"#15803d", whiteSpace:"nowrap" }}>يغطّيها:</span>
                <select value={covByPeriod[p.key]} onChange={e=>setCovByPeriod(s=>({...s,[p.key]:e.target.value}))} style={{ ...SEL, fontSize:11, flex:1 }}>
                  <option value="">اختر...</option>
                  {doctors.filter(d=>d.id!==+absentId).map(d=>{
                    const ol = onLeave(d,date,leaves);
                    const hasEvening = (nightData[date]?.doctors||[]).includes(d.id);
                    const ownClinic = isClinic(getSlot(d,di,p.key));
                    const coveringElse = coverages.some(cv=>cv.date===date && cv.coverDoctorId===d.id && cv.period!==p.key);
                    const bz = busy.includes(d.id);
                    const reason = ol?"إجازة":hasEvening?"دوام مسائي":ownClinic?"عيادته":coveringElse?"تغطية أخرى":bz?"مشغول":null;
                    return <option key={d.id} value={d.id} disabled={!!reason}>{reason?`🚫 ${d.name} (${reason})`:d.name}</option>;
                  })}
                </select>
              </div>
            );
          })}
          {neededPeriods.length===0 && (
            <div style={{ fontSize:11, color:"#94a3b8", textAlign:"center", padding:"6px" }}>لا توجد فترات تحتاج تغطية فردية لهذا الطبيب اليوم</div>
          )}
        </div>
      )}

      <div style={{ display:"flex", gap:6 }}>
        <button onClick={save} disabled={!anyAssigned} style={{ flex:1, padding:"8px", background:anyAssigned?"#ea580c":"#fed7aa", color:"#fff", border:"none", borderRadius:7, fontSize:12, fontWeight:700, cursor:anyAssigned?"pointer":"default" }}>حفظ التغطيات</button>
        <button onClick={()=>{ setOpen(false); setAbsentId(""); setCovByPeriod({am:"",pm:"",evening:""}); }} style={{ padding:"8px 16px", background:"#fff", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, cursor:"pointer" }}>إلغاء</button>
      </div>
    </div>
  );
}

function DayCard({ date, di, day, nd, indiv, doctors, leaves, nightData, coverages, fd, expanded, onToggle, onAddDoc, onRemoveDoc, onAddCov, onRemoveCov, onResetDay, onSetNote, onAddIndiv, onRemoveIndiv, onSetSlots }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const nightDocs = nd.doctors || [];
  const covs = nd.coverages || { am:[], pm:[], nextAm:[] };
  const nextDate = nextWork(date);
  const nextDi = dayIdx(nextDate);
  const grad = DAY_GRADIENTS[di] || DAY_GRADIENTS[0];

  // coverage needs per night doctor
  const docNeeds = (doc) => {
    const needs = [];
    if (clinicClosedOnLeave(doc,date,leaves)) return needs; // clinic closed during leave
    if (isClinic(getSlot(doc,di,"am")))     needs.push({ key:"am",     label:"☀️ صباحاً",     covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,di,"pm")))     needs.push({ key:"pm",     label:"🌅 ظهراً",      covDate:date,     covDi:di });
    if (isClinic(getSlot(doc,nextDi,"am"))) needs.push({ key:"nextAm", label:"🌄 الغد صباحاً", covDate:nextDate, covDi:nextDi });
    return needs;
  };

  let pending = 0;
  nightDocs.map(id=>fd(id)).filter(Boolean).forEach(d=>{
    if (clinicClosedOnLeave(d,date,leaves)) return;
    if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
    if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
    if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
  });
  const dayAnalysis = analyzeDay(date, doctors, leaves, nightData, coverages, null);
  const hasConflict = dayAnalysis.conflicts.length > 0;
  const hasGap = dayAnalysis.gaps.length > 0;
  const done = pending===0 && !hasConflict && !hasGap && nightDocs.length>0;

  return (
    <div style={{ background: expanded?"#f8fbff":"#fff", borderBottom:"1px solid #eef2f7", borderRight: expanded?"4px solid #2c5282":"4px solid transparent", transition:"all .15s" }}>
      {/* Table-style row */}
      <div onClick={onToggle} style={{ display:"flex", alignItems:"center", gap:14, padding:"13px 16px", cursor:"pointer" }}>
        {/* Date badge */}
        <div style={{ background:grad, color:"#fff", borderRadius:12, minWidth:52, height:52, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0, boxShadow:"0 3px 8px rgba(30,58,95,.18)" }}>
          <span style={{ fontSize:20, fontWeight:800, lineHeight:1 }}>{day}</span>
          <span style={{ fontSize:10, opacity:.85, marginTop:2 }}>{DAYS[di]}</span>
        </div>
        {/* Names + coverages */}
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:6, minWidth:0 }}>
          {nightDocs.map(id=>fd(id)).filter(Boolean).map(d=>{
            const myCovs = [];
            const nextDi2 = dayIdx(nextWork(date));
            if (isClinic(getSlot(d,di,"am")))    (covs.am||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push({i:"☀️",n:c.name});});
            if (isClinic(getSlot(d,di,"pm")))    (covs.pm||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push({i:"🌅",n:c.name});});
            if (isClinic(getSlot(d,nextDi2,"am")))(covs.nextAm||[]).forEach(id=>{const c=fd(id);if(c)myCovs.push({i:"🌄",n:c.name});});
            return (
              <div key={d.id} style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                <span style={{ display:"inline-flex", alignItems:"center", gap:6, background:d.color+"14", color:d.color, border:`1px solid ${d.color}40`, borderRadius:20, padding:"4px 12px 4px 5px", fontSize:14, fontWeight:800 }}>
                  <span style={{ width:24, height:24, borderRadius:"50%", background:d.color, color:"#fff", display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:10 }}>{sn(d.name).slice(0,2)}</span>
                  {d.name}
                </span>
                {myCovs.map((c,i)=><span key={i} style={{ fontSize:11, color:"#15803d", background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:14, padding:"2px 9px", fontWeight:600 }}>{c.i} {c.n}</span>)}
              </div>
            );
          })}
          {nightDocs.length===0 && <span style={{ fontSize:13, color:"#cbd5e1" }}>— لا دوام مسائي</span>}
          {indiv.map(c=>{const cd=fd(c.coverDoctorId);return cd&&<span key={c.id} style={{ background:"#fff7ed", color:"#ea580c", border:"1px solid #fed7aa", borderRadius:14, padding:"2px 10px", fontSize:12, width:"fit-content", fontWeight:600 }}>🔄 {cd.name}</span>;})}
          {nd.note && <span style={{ fontSize:11, color:"#a16207", background:"#fffbeb", border:"1px solid #fde68a", borderRadius:8, padding:"2px 9px", width:"fit-content" }}>📝 {nd.note}</span>}
        </div>
        {/* Status */}
        <div style={{ minWidth:62, textAlign:"center", flexShrink:0, display:"flex", flexDirection:"column", gap:3, alignItems:"center" }}>
          {done && <span style={{ background:"#f0fdf4", color:"#15803d", borderRadius:14, padding:"4px 11px", fontSize:11, fontWeight:700 }}>✅</span>}
          {hasConflict && <span style={{ background:"#fef2f2", color:"#dc2626", borderRadius:14, padding:"4px 11px", fontSize:11, fontWeight:700 }}>🔴 تعارض</span>}
          {!hasConflict && (pending>0||hasGap) && <span style={{ background:"#fff7ed", color:"#c2410c", borderRadius:14, padding:"4px 11px", fontSize:11, fontWeight:700 }}>⚠️ {pending||dayAnalysis.gaps.length}</span>}
        </div>
        <span style={{ fontSize:13, color:"#cbd5e1", flexShrink:0, width:14 }}>{expanded?"▲":"▼"}</span>
      </div>

      {/* Expanded body - inline editing */}
      {expanded && (
        <div style={{ padding:"4px 16px 14px", borderTop:"1px solid #eef2f7" }}>
          {/* Per-day gaps & conflicts (unified engine) */}
          {(() => {
            const r = analyzeDay(date, doctors, leaves, nightData, coverages, null);
            const slotL = p => p==="am"?"صباح":p==="pm"?"ظهر":"مسائي";
            if (!r.gaps.length && !r.conflicts.length) return null;
            return (
              <div style={{ marginBottom:10 }}>
                {r.gaps.length>0 && (
                  <div style={{ background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:9, padding:"8px 12px", marginBottom:6 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:"#c2410c", marginBottom:3 }}>🔶 عيادات مكشوفة</div>
                    {r.gaps.map((g,i)=>(
                      <div key={i} style={{ fontSize:11, color:"#9a3412", marginTop:2 }}>
                        🔸 عيادة {fd(g.ownerId)?.name} ({slotL(g.period)}) — {g.reason}
                        {g.suggestions&&g.suggestions.length>0 && <span style={{ color:"#15803d" }}> — يُقترح: {g.suggestions.map(id=>fd(id)?.name).join("، ")}</span>}
                      </div>
                    ))}
                  </div>
                )}
                {r.conflicts.length>0 && (
                  <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:9, padding:"8px 12px" }}>
                    <div style={{ fontSize:12, fontWeight:700, color:"#dc2626", marginBottom:3 }}>⚠️ تعارض</div>
                    {[...new Set(r.conflicts.map(c=>c.text))].map((t,i)=><div key={i} style={{ fontSize:11, color:"#991b1b" }}>🔴 {t}</div>)}
                  </div>
                )}
              </div>
            );
          })()}
          {/* Header bar: evening clinics count for this day */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, padding:"8px 10px", background:"#eff4fa", borderRadius:8 }}>
            <span style={{ fontSize:11, fontWeight:700, color:"#1e3a5f", flex:1 }}>🌙 عدد العيادات المسائية المطلوبة هذا اليوم</span>
            {[1,2,3].map(n=>(
              <button key={n} onClick={()=>onSetSlots(date,n)} style={{ width:30, height:30, borderRadius:7, border:(nd.eveningSlots||1)===n?"2px solid #1e3a5f":"1px solid #cdddec", background:(nd.eveningSlots||1)===n?"#1e3a5f":"#fff", color:(nd.eveningSlots||1)===n?"#fff":"#64748b", fontWeight:800, fontSize:13, cursor:"pointer" }}>{n}</button>
            ))}
          </div>

          {/* Two columns: right = evening shift (navy bg), left = coverages (orange bg) */}
          <div style={{ display:"flex", gap:10, alignItems:"flex-start", flexWrap:"wrap" }}>
            {/* RIGHT column: evening shift */}
            <div style={{ flex:"1 1 260px", minWidth:0, background:"#f3f7fc", border:"1px solid #dbe7f3", borderRadius:12, padding:"10px 12px" }}>
              <div style={{ fontSize:13, fontWeight:800, color:"#1e3a5f", marginBottom:8, paddingBottom:5, borderBottom:"2px solid #dbe7f3" }}>🌙 الدوام المسائي</div>
          {/* Night doctors with their coverage needs */}
          {nightDocs.map(id=>fd(id)).filter(Boolean).map((d, idx) => {
            const needs = docNeeds(d);
            const arNum = ["١","٢","٣","٤"][idx]||(idx+1);
            return (
              <div key={d.id} style={{ marginBottom:10, border:`1px solid ${d.color}33`, borderRadius:11, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, background:d.color+"14", padding:"7px 10px" }}>
                  <span style={{ fontSize:10, fontWeight:800, color:"#fff", background:d.color, borderRadius:5, padding:"2px 6px", flexShrink:0 }}>العيادة المسائية {arNum}</span>
                  <div style={{ ...AV, background:d.color, width:26, height:26, fontSize:9 }}>{sn(d.name).slice(0,2)}</div>
                  <span style={{ flex:1, fontSize:13, fontWeight:700, color:d.color }}>{d.name}</span>
                  <button onClick={()=>onRemoveDoc(date,d.id)} style={{ background:"#fff", border:`1px solid ${d.color}44`, color:"#dc2626", cursor:"pointer", fontSize:12, borderRadius:6, padding:"2px 7px" }}>✕</button>
                </div>
                <div style={{ padding:"8px 10px" }}>
                  {needs.length===0 ? (
                    <div style={{ fontSize:10, color:"#15803d", background:"#f0fdf4", borderRadius:6, padding:"4px 8px" }}>✅ لا يحتاج تغطية — لا توجد عيادة في جدوله هذا اليوم</div>
                  ) : needs.map(({key,label,covDate,covDi}) => {
                    const assigned = (covs[key]||[]).map(id=>fd(id)).filter(Boolean);
                    const isCovered = assigned.length>0;
                    const avail = getAvailable(doctors, nightDocs, covDi, covDate, key==="pm"?"pm":"am", leaves, nightData, { [key]: covs[key]||[] }, coverages);
                    const freeDocs = avail.filter(x=>x.status==="free");
                    const warnDocs = avail.filter(x=>x.status==="warn");
                    return (
                      <div key={key} style={{ marginBottom:7 }}>
                        <div style={{ fontSize:10, fontWeight:700, color:isCovered?"#15803d":"#c2410c", marginBottom:3 }}>{label} — {isCovered?"مُغطّاة ✓":"تحتاج تغطية"}</div>
                        {assigned.map(cd=>(
                          <div key={cd.id} style={{ display:"flex", alignItems:"center", gap:5, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:6, padding:"3px 7px", marginBottom:3 }}>
                            <span style={{ flex:1, fontSize:11, color:"#15803d", fontWeight:600 }}>✓ يغطّيها {cd.name}</span>
                            <button onClick={()=>onRemoveCov(date,key,cd.id)} style={{ background:"none", border:"none", color:"#94a3b8", cursor:"pointer", fontSize:11 }}>✕ إزالة</button>
                          </div>
                        ))}
                        {!isCovered && (() => {
                          const [yy,mm] = date.split("-");
                          const lblr = makeLoadLabeler(computeLoadMap(+yy, +mm-1, doctors, nightData, coverages, leaves));
                          const optLabel = (fdoc) => { const L=lblr(fdoc.id); return `${L.icon} ${fdoc.name} — ${L.text} (${L.val})`; };
                          return (
                          <select style={{ ...SEL, fontSize:11, padding:"6px 7px" }} value="" onChange={e=>{ if(e.target.value) onAddCov(date,key,+e.target.value); }}>
                            <option value="">➕ تثبيت طبيب متاح ({freeDocs.length})</option>
                            {freeDocs.length>0 && <optgroup label="✅ متاح (فارغ)">{freeDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>{optLabel(fdoc)}</option>)}</optgroup>}
                            {warnDocs.length>0 && <optgroup label="⚠️ لديه التزام">{warnDocs.map(({doc:fdoc})=><option key={fdoc.id} value={fdoc.id}>⚠️ {optLabel(fdoc)}</option>)}</optgroup>}
                          </select>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Add night doctor */}
          {nightDocs.length < (nd.eveningSlots||1) && (() => {
            const an = analyzeDay(date, doctors, leaves, nightData, coverages, null);
            const occ = an.occupied || { am:{}, pm:{}, evening:{} };
            const [yy,mm] = date.split("-");
            const lblr = makeLoadLabeler(computeLoadMap(+yy, +mm-1, doctors, nightData, coverages, leaves));
            const busyReason = (d) => {
              if (onLeave(d,date,leaves)) return "إجازة";
              if ((d.blockedDays||[]).includes(di)) return `لا يعمل ${DAYS[di]}`;
              const r = [];
              if ((occ.evening[d.id]||[]).length) r.push("دوام/تغطية مسائية");
              const amCov = (occ.am[d.id]||[]).filter(x=>x.includes("تغطية"));
              const pmCov = (occ.pm[d.id]||[]).filter(x=>x.includes("تغطية"));
              if (amCov.length) r.push("تغطية صباح");
              if (pmCov.length) r.push("تغطية ظهر");
              return r.length ? r.join("، ") : null;
            };
            return (
            <select style={{ ...SEL, marginBottom:8 }} value="" onChange={e=>{ if(e.target.value) onAddDoc(date,+e.target.value); }}>
              <option value="">➕ إضافة طبيب للدوام المسائي...</option>
              {doctors.filter(d=>!nightDocs.includes(d.id)).map(d=>{
                const reason = busyReason(d);
                const L = lblr(d.id);
                const fixedTag = (d.nightDays||[]).includes(di)?" (ثابت)":"";
                const label = reason ? `🚫 ${d.name} (${reason})` : `${L.icon} ${d.name} — ${L.text} (${L.val})${fixedTag}`;
                return <option key={d.id} value={d.id} disabled={!!reason}>{label}</option>;
              })}
            </select>
            );
          })()}
            </div>

            {/* LEFT column: coverages */}
            <div style={{ flex:"1 1 260px", minWidth:0, background:"#fff8f1", border:"1px solid #fbe2cc", borderRadius:12, padding:"10px 12px" }}>
              <div style={{ fontSize:13, fontWeight:800, color:"#ea580c", marginBottom:8, paddingBottom:5, borderBottom:"2px solid #fbe2cc" }}>🔄 التغطيات</div>
          {/* Individual coverages on this day — display only (add from dedicated page) */}
          <div>
            {indiv.length ? indiv.map(c=>{
              const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null;
              const reasonLabel = { absence:"غياب", sick:"إجازة مرضية", emergency:"طارئ", excuse:"عذر" }[c.reason]||c.reason||"";
              return cd&&(
                <div key={c.id} style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:7, padding:"5px 9px", marginBottom:4 }}>
                  <span style={{ flex:1, color:"#9a3412" }}>
                    <strong>{cd.name}</strong> يغطّي {(c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً")}
                    {ad?` — بدلاً من ${ad.name}`:""}{reasonLabel?` (${reasonLabel})`:""}
                  </span>
                  <button onClick={()=>onRemoveIndiv(c.id)} style={{ background:"none", border:"none", color:"#dc2626", cursor:"pointer", fontSize:13 }}>✕</button>
                </div>
              );
            }) : <div style={{ fontSize:11, color:"#94a3b8", marginBottom:6 }}>— لا توجد تغطيات</div>}
          </div>
          <div style={{ marginTop:6, fontSize:10, color:"#c2937a" }}>الغياب والتغطيات تُسجَّل من صفحة «🏖 الإجازات»</div>
            </div>
          </div>
          {/* end two columns */}

          {/* Day note */}
          <div style={{ marginTop:6, marginBottom:8 }}>
            <input type="text" defaultValue={nd.note||""} placeholder="📝 ملاحظة لهذا اليوم..."
              onBlur={e=>onSetNote && onSetNote(date, e.target.value)}
              style={{ width:"100%", padding:"7px 10px", border:"1px solid #e2e8f0", borderRadius:8, fontSize:12, outline:"none", background:"#fffef5" }} />
          </div>
          {/* Footer actions */}
          {nightDocs.length>0 && (
            <div style={{ marginTop:6, display:"flex", justifyContent:"flex-end" }}>
              {confirmReset ? (
                <span style={{ display:"inline-flex", gap:6, alignItems:"center" }}>
                  <span style={{ fontSize:11, color:"#dc2626", fontWeight:700 }}>مسح اليوم؟</span>
                  <button onClick={()=>{ onResetDay(date); setConfirmReset(false); }} style={{ ...Btn.danger, background:"#dc2626", color:"#fff", border:"none" }}>نعم</button>
                  <button onClick={()=>setConfirmReset(false)} style={Btn.secondary}>لا</button>
                </span>
              ) : (
                <button onClick={()=>setConfirmReset(true)} style={{ ...Btn.danger }}>🔁 إعادة تعيين اليوم</button>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
