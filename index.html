  const ana = useMemo(()=>analyzeMonth(mo.y,mo.m,doctors,leaves,nightData,coverages,restRule), [mo,doctors,leaves,nightData,coverages,restRule]);
  const gaps = ana.gaps.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.period.localeCompare(b.period));
  const gapKey = g => `${g.date}|${g.period}|${g.ownerId}`;
  const monthDates = days.map(x=>x.date);
  const yearDates = useMemo(()=>{ const out=[]; for(let m=0;m<=mo.m;m++) out.push(...monthDays(mo.y,m).map(x=>x.date)); return out; }, [mo.y,mo.m]);
  const loadMap = useMemo(()=>{ const m={}; doctors.forEach(d=>{ const s=doctorSessions(d, yearDates, nightData, coverages, leaves); m[d.id]=s.total; }); return m; }, [mo,doctors,nightData,coverages,leaves,yearDates]);
  const eveLoadMap = useMemo(()=>{ const m={}; doctors.forEach(d=>m[d.id]=0); monthDates.forEach(dt=>((nightData[dt]||{}).doctors||[]).forEach(id=>{ m[id]=(m[id]||0)+1; })); return m; }, [mo,doctors,nightData]);
  const rankAvail = arr => arr.filter(a=>a.status!=="leave").map(a=>({ ...a, load:loadMap[a.doc.id]||0 })).sort((a,b)=> (a.status==="free"?0:1)-(b.status==="free"?0:1) || a.load-b.load);
  const availForGap = g => rankAvail(getAvailable(doctors,[g.ownerId],g.di,g.date,g.period,leaves,nightData,{},coverages));
  const busyReason = (doc,di,period) => { const sl=getSlot(doc,di,period); if(isClinic(sl)) return "عيادة"; return SLOT_AR[sl]||"عيادة"; }; // يوضّح "تدقيق"/"افتراضي" بدل تعميم "عيادة" على كل شغل نهاري
  const pickList = (excludeId,di,date,period) => getAvailable(doctors,[excludeId],di,date,period,leaves,nightData,{},coverages,true).map(a=>({ ...a, load:loadMap[a.doc.id]||0, commit: a.status==="warn" ? (SLOT_COMMIT[getSlot(a.doc,di,period)]||"التزام") : null, busyType: a.status==="busy" ? busyReason(a.doc,di,period) : null })).sort((a,b)=> (({free:0,warn:1,busy:2,leave:3}[a.status])-({free:0,warn:1,busy:2,leave:3}[b.status])) || (a.load-b.load));

  const ensureDay = date => setNight(nd=>nd[date]?nd:{...nd,[date]:{doctors:[],coverages:{am:[],pm:[],nextAm:[]},note:""}});
  const pushCov = cov => setCoverages(cs=>[...cs,{id:uid(),...cov}]);
  const addCovIndiv = cov => { pushCov(cov); showToast("تم تسجيل التغطية"); };
  const removeCovIndiv = id => setCoverages(cs=>cs.filter(c=>c.id!==id));
  const eveningOwner = g => ((nightData[g.date]||{}).doctors||[]).includes(g.ownerId);
  const addNightCov = (date,slot,cid) => setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; if(!(cv[slot]||[]).includes(cid)) cv[slot]=[...(cv[slot]||[]),cid]; d.coverages=cv; return {...nd,[date]:d}; });
  const ownerCover = (date,ownerId,period) => { const c=coverages.find(x=>x.date===date&&x.absentId===ownerId&&x.period===period&&x.reason==="evening"); return c?c.coverDoctorId:undefined; };
  const setOwnerCover = (date,ownerId,period,cid) => setCoverages(cs=>[...cs.filter(c=>!(c.date===date&&c.absentId===ownerId&&c.period===period&&c.reason==="evening")), {id:uid(),absentId:ownerId,date,period,coverDoctorId:cid,reason:"evening"}]);
  const clearOwnerCover = (date,ownerId,period) => setCoverages(cs=>cs.filter(c=>!(c.date===date&&c.absentId===ownerId&&c.period===period&&c.reason==="evening")));
  const placeCover = (g,cid) => {
    if(eveningOwner(g)&&(g.period==="am"||g.period==="pm")) setOwnerCover(g.date,g.ownerId,g.period,cid);
    else {
      const owner=fd(g.ownerId);
      const onLv = owner && onLeave(owner,g.date,leaves);
      const pcd=(()=>{ const dt=new Date(g.date); dt.setDate(dt.getDate()-1); return dt.getDay()>=5?null:dt.toISOString().split("T")[0]; })();
      const prevEve = pcd && ((nightData[pcd]||{}).doctors||[]).includes(g.ownerId);
      const reason = onLv ? "leave" : (g.period==="am" && prevEve) ? "post_evening" : "absence";
      pushCov({absentId:g.ownerId,date:g.date,period:g.period,coverDoctorId:cid,reason});
    }
    logAudit&&logAudit(`تغطية عيادة د.${fd(g.ownerId)?.name||"؟"} — بـ د.${fd(cid)?.name||"؟"} (${perAr(g.period)} ${dmy(g.date)})`);
  };
  const coverGap = g => { const av=availForGap(g); const s=picks[gapKey(g)]; const cid=s?+s:(av.find(a=>a.status==="free")?.doc?.id); if(!cid){showToast("لا يوجد طبيب متفرّغ — اختر يدوياً","warn");return;} placeCover(g,cid); showToast("تمت التغطية"); };
  const coverAll = () => {
    let n=0; const used={}; let skipped=0;
    const runningLoad={}; // ── يحسب تراكم التعيينات خلال نفس عملية "حل الكل" — بدونه، مَن يبدأ بأقل عبء يفوز بكل العيادات المكشوفة دفعة واحدة لأن loadMap لا يتحدّث أثناء الحلقة ──
    gaps.forEach(g=>{
      const av=availForGap(g);
      const ranked=av.slice().sort((a,b)=> (a.status==="free"?0:1)-(b.status==="free"?0:1) || (((loadMap[a.doc.id]||0)+(runningLoad[a.doc.id]||0)) - ((loadMap[b.doc.id]||0)+(runningLoad[b.doc.id]||0))));
      const s=picks[gapKey(g)]; const key=g.date+"|"+g.period; const taken=used[key]||[];
      const pick = s?+s : (ranked.find(a=>a.status==="free" && !taken.includes(a.doc.id))?.doc?.id);
      if(pick){ placeCover(g,pick); (used[key]=used[key]||[]).push(pick); runningLoad[pick]=(runningLoad[pick]||0)+1; n++; }
      else skipped++; // كل المتاحين لديهم التزام (تدقيق/افتراضي/إداري) — لا يُختار أحد تلقائياً، يحتاج قراراً يدوياً من رئيس القسم
    });
    if(n && skipped) showToast(`غُطّيت ${n} عيادة بالأنسب — تبقّت ${skipped} تحتاج اختياراً يدوياً (كل المتاحين لديهم التزام)`,"warn");
    else if(n) showToast(`غُطّيت ${n} عيادة بالأنسب`);
    else if(skipped) showToast(`لم تُحل أي عيادة تلقائياً — كل المتاحين لديهم التزام (تدقيق/افتراضي/إداري)، اختر يدوياً لكل حالة`,"warn");
    else showToast("لا يوجد متاح");
  };

  const toggleEvening = (date,id) => { ensureDay(date); setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{am:[],pm:[],nextAm:[]}})}; const has=(d.doctors||[]).includes(id); d.doctors=has?d.doctors.filter(x=>x!==id):[...(d.doctors||[]),id]; return {...nd,[date]:d}; }); const nextDay=(()=>{ const dt=new Date(date); dt.setDate(dt.getDate()+1); return dt.toISOString().split("T")[0]; })(); setCoverages(cs=>cs.filter(c=>!(c.absentId===id && ((c.date===date && c.reason==="evening") || (c.date===nextDay && c.reason==="post_evening"))))); };
  const setCov = (date,slot,id) => { if(!id) return; setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; cv[slot]=[+id]; d.coverages=cv; return {...nd,[date]:d}; }); };
  const clearCov = (date,slot) => setNight(nd=>{ const d={...(nd[date]||{})}; const cv={...(d.coverages||{})}; cv[slot]=[]; d.coverages=cv; return {...nd,[date]:d}; });

  const autoEvening = () => { const next=autoFill(mo.y,mo.m,doctors,leaves,nightData); setNight(()=>next); showToast("تم التوزيع التلقائي للمسائي"); };
  const [reqPerDay, setReqPerDay] = useState(()=>{ const v=S.get("v2_reqperday"); return v!=null?v:1; });
  useEffect(()=>S.set("v2_reqperday",reqPerDay),[reqPerDay]);
  const [dayReq, setDayReq] = useState(()=>S.get("v2_dayreq")||{});
  useEffect(()=>S.set("v2_dayreq",dayReq),[dayReq]);
  const [showSetup, setShowSetup] = useState(false);
  const [trimPick, setTrimPick] = useState(null); // {date, target} — عند تخفيض العدد لأقل من المعيّنين حالياً
  const setReq = (date,n) => { const val=Math.max(0,n); setDayReq(r=>({ ...r, [date]:val })); setNight(nd=> nd[date] ? {...nd, [date]:{...nd[date], eveningSlots:val}} : nd); };
  const decDay = (date,target) => { const assigned=(nightData[date]?.doctors)||[]; if(target>=0 && assigned.length>target){ setTrimPick({date,target}); } else { setReq(date,target); } };
  const removeForTrim = (date,docId,target) => { toggleEvening(date,docId); setReq(date,target); setTrimPick(null); logAudit&&logAudit(`إزالة د.${fd(docId)?.name||""} من مسائي ${dmy(date)} (تخفيض العدد المطلوب)`); showToast("تم تحديث اليوم"); };
  const monthPrefix = `${mo.y}-${String(mo.m+1).padStart(2,"0")}`;
  const monthConfigured = useMemo(()=> days.some(d=>dayReq[d.date]!=null) || Object.keys(nightData).some(k=>k.startsWith(monthPrefix)), [days,dayReq,nightData,monthPrefix]);
  const needOf = date => (dayReq[date]!=null ? dayReq[date] : (monthConfigured ? reqPerDay : 0));
  useEffect(()=>{ if(!monthConfigured) setShowSetup(true); }, [mo.y, mo.m]);
  const createEmpty = () => { setNight(nd=>{ const n={...nd}; days.forEach(({date})=>{ const need=needOf(date); if(need>0){ n[date]={ ...(n[date]||{coverages:{am:[],pm:[],nextAm:[]},note:""}), doctors:[], eveningSlots:need }; } }); return n; }); logAudit&&logAudit("إنشاء جدول مسائي فارغ حسب عدد العيادات"); showToast("تم إنشاء جدول فارغ — اختر الأطباء أو وزّع تلقائياً"); setShowSetup(false); };
  const distributeFixed = () => { setNight(nd=>{ const n={...nd};
    // ── عدالة بين أصحاب نفس اليوم الثابت: لو أكثر من طبيب "ثابت" لنفس يوم الأسبوع (مثلاً ٥ أطباء كلهم الأحد) وعدد المطلوب أقل منهم،
    // كان الفائز دائماً نفس الطبيب (الأول بترتيب القائمة) بلا أي تناوب — الآن يُختار الأقل مناوبة هذه السنة، ثم مَن مرّت عليه مدة أطول منذ آخر مرة ──
    const priorMonthsInYear = []; for(let m=0; m<mo.m; m++) priorMonthsInYear.push(m);
    const priorYearDates = priorMonthsInYear.flatMap(m=>monthDays(mo.y,m).map(x=>x.date));
    const usage={}; doctors.forEach(d=>usage[d.id]=0);
    priorYearDates.forEach(dt=>((nd[dt]||{}).doctors||[]).forEach(id=>usage[id]=(usage[id]||0)+1));
    monthDates.forEach(dt=>((n[dt]||{}).doctors||[]).forEach(id=>usage[id]=(usage[id]||0)+1));
    const lastAssigned={}; doctors.forEach(d=>lastAssigned[d.id]=null);
    Object.keys(nd).sort().forEach(dt=>{ ((nd[dt]||{}).doctors||[]).forEach(id=>{ lastAssigned[id]=dt; }); });
    const recency = d => lastAssigned[d.id] ? new Date(lastAssigned[d.id]).getTime() : -Infinity;
    days.forEach(({date,di})=>{
      const need=needOf(date); if(need<=0) return;
      const cur=(n[date]?.doctors)?[...n[date].doctors]:[];
      const eligible = doctors.filter(d=>(d.nightDays||[]).includes(di) && !onLeave(d,date,leaves) && !(d.blockedDays||[]).includes(di) && !cur.includes(d.id));
      eligible.sort((a,b)=> (usage[a.id]-usage[b.id]) || (recency(a)-recency(b)) || a.name.localeCompare(b.name,"ar"));
      eligible.forEach(d=>{ if(cur.length<need){ cur.push(d.id); usage[d.id]++; lastAssigned[d.id]=date; } });
      n[date]={ ...(n[date]||{coverages:{am:[],pm:[],nextAm:[]},note:""}), doctors:cur, eveningSlots:need };
    });
    return n; }); logAudit&&logAudit("توزيع الأطباء أصحاب الأيام الثابتة"); showToast("تم وضع أصحاب الأيام الثابتة — والباقي فارغ"); };
  const fillRef = React.useRef({ leftover:0, report:null });
  const fillAvailable = () => {
    const planFill = (allowCommitted) => {
      setNight(nd=>{
        const n={...nd}; let leftover=0;
        // ── عدالة سنوية: يُحسب مجموع مناوبات كل طبيب منذ بداية السنة (يناير) وحتى الشهر الماضي — يبدأ من صفر مع كل سنة جديدة ──
        // فالطبيب الذي ناوب أقل منذ بداية السنة يُعطى أولوية هذا الشهر تلقائياً (نفس منطق "الأقل عبئاً" لكن على مستوى السنة)
        const priorMonthsInYear = []; for(let m=0; m<mo.m; m++) priorMonthsInYear.push(m);
        const priorYearDates = priorMonthsInYear.flatMap(m=>monthDays(mo.y,m).map(x=>x.date));
        const usage={}, thisMoUsage={}; doctors.forEach(d=>{ usage[d.id]=0; thisMoUsage[d.id]=0; });
        priorYearDates.forEach(dt=>((nd[dt]||{}).doctors||[]).forEach(id=>usage[id]=(usage[id]||0)+1));
        monthDates.forEach(dt=>((n[dt]||{}).doctors||[]).forEach(id=>{ usage[id]=(usage[id]||0)+1; thisMoUsage[id]=(thisMoUsage[id]||0)+1; }));
        // ── عدالة لكل يوم أسبوع على حدة: بعض الأيام (كالاثنين) قد يكون فيها عدد أطباء "متاحين" أقل (البقية عندهم عيادة ثابتة ذلك اليوم) ──
        // فحتى مع عدالة إجمالية صحيحة، قد يتكرر نفس الطبيب لنفس يوم الأسبوع تحديداً. هذا العدّاد يمنع ذلك بحساب كل يوم أسبوع منفصلاً
        const weekdayUsage={}; doctors.forEach(d=>{ weekdayUsage[d.id]=[0,0,0,0,0]; });
        [...priorYearDates, ...monthDates].forEach(dt=>{ const wi=dayIdx(dt); if(wi<0) return; ((nd[dt]||{}).doctors||[]).forEach(id=>{ if(!weekdayUsage[id]) weekdayUsage[id]=[0,0,0,0,0]; weekdayUsage[id][wi]++; }); });
        // ── كسر التعادل بالتناوب لا بالأبجدية: عند تساوي كل معايير العدالة أعلاه، من المهم عدم اختيار نفس الطبيب دائماً بسبب ترتيب اسمه ──
        // (كان الترتيب الأبجدي يفوز في كل تعادل، فيتكرر نفس الاسم كل شهر) — الآن يُفضَّل مَن مرّت عليه مدة أطول منذ آخر مناوبة له
        const lastAssigned={}; doctors.forEach(d=>lastAssigned[d.id]=null);
        Object.keys(nd).sort().forEach(dt=>{ ((nd[dt]||{}).doctors||[]).forEach(id=>{ lastAssigned[id]=dt; }); });
        const recency = d => lastAssigned[d.id] ? new Date(lastAssigned[d.id]).getTime() : -Infinity; // لم يُناوب من قبل = أولوية قصوى
        days.forEach(({date,di})=>{
          const need=needOf(date); if(need<=0) return;
          const cur=(n[date]?.doctors)?[...n[date].doctors]:[];
          const prevEve=((n[prevCalDay(date)]||{}).doctors)||[];
          const ndd=(()=>{ const dt=new Date(date); dt.setDate(dt.getDate()+1); return dt.toISOString().split("T")[0]; })();
          const nDi=dayIdx(ndd);                                                       // فهرس يوم الغد (-1 لو عطلة)
          const mornFreeNext = d => nDi<0 ? true : !DIRECT_SLOTS.includes(getSlot(d,nDi,"am")); // صباح الغد فارغ؟
          const base = d => !((d.nightDays||[]).length>0)                              // أصحاب المسائي الثابت لا يدخلون الإضافي
                          && !cur.includes(d.id) && !onLeave(d,date,leaves) && !(d.blockedDays||[]).includes(di);
          // ── فصل تام بين "عدد المناوبات" و"العبء النهاري": المناوبة تناوب إجباري متساوٍ بحت، لا يتأثر بعبء العيادات النهارية إطلاقاً ──
          const rank = (a,b)=> (usage[a.id]-usage[b.id])                               // ① الأقل مناوبات (هذه السنة) — المعيار الحاسم الوحيد للعدد
                            || ((weekdayUsage[a.id][di]||0)-(weekdayUsage[b.id][di]||0)) // ②  الأقل مناوبات لنفس يوم الأسبوع هذا تحديداً
                            || ((mornFreeNext(a)?0:1)-(mornFreeNext(b)?0:1))            // ③ يُفضّل من صباح غده فارغ (سلامة راحته، لا عبء)
                            || (recency(a)-recency(b))                                  // ④ من مرّت عليه مدة أطول منذ آخر مناوبة (لا الأبجدية)
                            || a.name.localeCompare(b.name,"ar");
          const freeT = doctors.filter(d=>base(d)&&!prevEve.includes(d.id)).sort(rank);                      // متاح (لم يعمل مساء أمس)
          const commT = allowCommitted ? doctors.filter(d=>base(d)&&prevEve.includes(d.id)).sort(rank) : []; // عمل مساء أمس (بموافقة)
          const queue=[...freeT, ...commT];
          while(cur.length<need && queue.length){ const pk=queue.shift(); cur.push(pk.id); usage[pk.id]++; thisMoUsage[pk.id]++; lastAssigned[pk.id]=date; weekdayUsage[pk.id][di]=(weekdayUsage[pk.id][di]||0)+1; }
          if(cur.length<need) leftover += (need-cur.length);
          n[date]={ ...(n[date]||{coverages:{am:[],pm:[],nextAm:[]},note:""}), doctors:cur, eveningSlots:need };

    const cards = doctors.map((d,idx) => {

      const evRows = evDates.map(dt=>{ const di=dayIdx(dt); const fixed=(d.nightDays||[]).includes(di); return `<tr><td>${dmy(dt)}</td><td>${DAYS[di]||""}</td><td><span class="badge ${fixed?"b-fix":"b-ext"}">${fixed?"مسائي ثابت":"مسائي/تغطية"}</span></td></tr>`; }).join("");
      const covItems = [];

      md.forEach(dt=>{ const cv=(nightData[dt]||{}).coverages||{}; [["am","عيادة الصباح"],["pm","عيادة الظهر"],["nextAm","عيادة صباح الغد"]].forEach(([sl,lbl])=>{ (cv[sl]||[]).forEach(id=>{ if(id===d.id) covItems.push({ date:dt, detail:`تغطية ${lbl} — عن طبيب المسائي` }); }); }); });

    printDoc(`تقرير الأطباء — ${MONTHS[mo.m]} ${mo.y}`, extra+cards);
  };

  const _calOff = () => calDays.length?calDays[0].di:0;
  const _calHead = () => DAYS.map(d=>`<div class="wd">${d}</div>`).join("");
  const _buildCal = render => { const off=_calOff(); let cells=""; for(let i=0;i<off;i++) cells+='<div class="cell empty"></div>'; calDays.forEach(({date,day,holiday})=>{ if(holiday){ cells+=`<div class="cell" style="background:#6d28d9;color:#fff"><div class="dnum" style="background:rgba(255,255,255,.25);color:#fff">${day}</div><div style="font-size:11px;font-weight:800;margin-top:4px">🎉 عطلة رسمية</div><div style="font-size:10.5px;margin-top:2px">${holiday.name}</div></div>`; return; } cells+=`<div class="cell"><div class="dnum">${day}</div>${render(date)}</div>`; }); return `<div class="cal">${_calHead()}</div><div class="cal">${cells}</div>`; };
  const _eveCal = () => _buildCal(date=>{ const docs=((nightData[date]||{}).doctors||[]).map(id=>fd(id)?.name).filter(Boolean); const req=((nightData[date]||{}).eveningSlots!=null?(nightData[date].eveningSlots):needOf(date))||0; const empty=Math.max(0,req-docs.length); return docs.map(n=>`<div class="eve">🌙 د.${n}</div>`).join("") + (empty>0?`<div class="eve" style="background:#fff7ed;border-color:#fed7aa;color:#b45309">🌙 ${empty} عيادة فارغة</div>`:"") || '<div class="dim">—</div>'; });

  const printMergedCal = () => openPrint(`التقويم الموحّد — ${MONTHS[mo.m]} ${mo.y}`, `<h2>🗓 المسائي والتغطيات معاً</h2>${_mergedCal()}`);

    const hasNight = nd && ((nd.doctors||[]).length || nd.eveningSlots>0 || ["am","pm","nextAm"].some(s=>(nd.coverages?.[s]||[]).length));
    const hasCov = coverages.some(c=>c.date===d.date);
    const hasLeave = leaves.some(l=>d.date>=l.start && d.date<=l.end);
    return hasNight || hasCov || hasLeave;
  });
  const statusOf = date => { const r=analyzeDay(date,doctors,leaves,nightData,coverages,null,restRule); const nd=nightData[date]||{}; return ((nd.doctors||[]).length && r.gaps.length===0 && r.conflicts.length===0) ? "done":"pending"; };
  const listDays = filled.filter(d=>{ if(sFilter!=="all" && statusOf(d.date)!==sFilter) return false; if(search){ const q=search.trim(); const nd=nightData[d.date]||{}; const names=(nd.doctors||[]).map(id=>fd(id)?.name||"").join(" ")+" "+coverages.filter(c=>c.date===d.date).map(c=>fd(c.coverDoctorId)?.name||"").join(" "); if(!names.includes(q)&&!d.date.includes(q)) return false; } return true; });
  const offset = calDays.length?calDays[0].di:0;
  const covLines = date => { const nd=nightData[date]||{}; const cv=nd.coverages||{}; const out=[]; const di0=dayIdx(date); const ndi=dayIdx(nextWork(date)); ["am","pm","nextAm"].forEach(slot=>{ (cv[slot]||[]).forEach(cid=>{ const cdr=fd(cid); if(!cdr) return; const sl=slot==="nextAm"?"am":slot; const sdi=slot==="nextAm"?ndi:di0; const owner=(nd.doctors||[]).map(id=>fd(id)).find(o=>o&&isClinic(getSlot(o,sdi,sl))); out.push(`تم تغطية ${perFull(slot)} لـ ${owner?("د."+owner.name):"طبيب المسائي"} بـ د.${cdr.name} بسبب دوام مسائي`); }); }); coverages.filter(c=>c.date===date).forEach(c=>{ const cdr=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; if(cdr) out.push(`تم تغطية ${perFull(c.period)} لـ ${ad?("د."+ad.name):"—"} بـ د.${cdr.name} بسبب ${coverReasonAr(c.absentId,date,c.reason,leaves)}`); }); return out; };

  const weekDays = (()=>{ const t=new Date(wkRef); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const out=[]; for(let i=0;i<5;i++){ const d=new Date(sun); d.setDate(sun.getDate()+i); out.push(d.toISOString().split("T")[0]); } return out; })();

              <button onClick={()=>{ setExportOpen(false); const rows=[["التاريخ","اليوم","المسائي","التغطيات"]]; days.forEach(({date,di})=>{ const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)?.name).filter(Boolean).map(n=>"د."+n).join(" ، "); const cvs=coverages.filter(c=>c.date===date).map(c=>`تغطية ${perFull(c.period)} لـ د.${fd(c.absentId)?.name||"—"} بـ د.${fd(c.coverDoctorId)?.name||"—"} (${coverReasonAr(c.absentId,c.date,c.reason,leaves)})`).join(" | "); if(docs||cvs) rows.push([dmy(date), DAYS[di]||"", docs, cvs]); }); downloadCSV(`جدول-${MONTHS[mo.m]}-${mo.y}.csv`, rows); showToast("تم تنزيل ملف Excel (CSV)"); }} style={{ display:"block", width:"100%", textAlign:"start", background:"none", border:"none", borderRadius:10, padding:"9px 11px", cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:600, color:C.text }}>📊 تصدير Excel</button>

              ); } const lines=covLines(date); const isT=date===today; const match=dayMatches(date,[],lines.length>0?"warn":"ok"); return (

      })() : listDays.length===0 ? <Empty icon="🌙" title="لا أيام مطابقة" hint="استخدم «توزيع تلقائي» أو «إضافة يوم» من الأدوات" /> :
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {listDays.map(({date,di})=>{
            const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
            const open=sel===date; const nDi=dayIdx(nextWork(date)); const cv=nd.coverages||{};
            const reqEve=(nd.eveningSlots!=null?nd.eveningSlots:needOf(date))||0; const emptyEve=Math.max(0,reqEve-(nd.doctors||[]).length);

                    {emptyEve>0 && <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:"var(--warnSoft)", color:C.warn, border:`1px solid ${C.warn}`, borderRadius:20, padding:"3px 11px", fontSize:12, fontWeight:700 }}>🌙 {emptyEve} عيادة مسائية فارغة</span>}

                <div style={label}>الطبيب المسائي {nd.eveningSlots>0&&<span style={{ color:C.muted, fontWeight:400 }}>· المطلوب {nd.eveningSlots} · المعيّن {(nd.doctors||[]).length}</span>}</div>
                {(() => {

                  const optList = doctors.filter(d=>!assigned.includes(d.id)).map(d=>{ const lv=onLeave(d,date,leaves); const fixedHere=(d.nightDays||[]).includes(di); const fixedAny=(d.nightDays||[]).length>0; const el=eveLoadMap[d.id]||0; const rank=lv?4:fixedHere?1:fixedAny?3:2; const note=lv?"إجازة":fixedHere?"عيادة مسائية ثابتة":fixedAny?"لديه مسائي ثابت":`متاح · مسائيات ${el}`; return { d, rank, el, note }; }).sort((a,b)=> a.rank-b.rank || a.el-b.el || a.d.name.localeCompare(b.d.name,"ar"));
                  const slots=[]; for(let i=0;i<Math.max(reqN,1);i++) slots.push(assigned[i]!=null?assigned[i]:null);
                  return <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:10 }}>
                    {slots.map((id,i)=>{ if(id!=null){ const d=fd(id); if(!d) return null; return (

                      </div>
                    ); } return (
                      <div key={"e"+i} style={{ display:"inline-flex", flexDirection:"column", gap:5, border:`2px dashed ${C.warn}`, background:"var(--warnSoft)", borderRadius:12, padding:"8px 10px", minWidth:175 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6 }}>

                          <button onClick={()=>decDay(date,reqN-1)} title="إلغاء هذه العيادة" style={{ background:"none", border:"none", color:C.warn, cursor:"pointer", fontSize:15, lineHeight:1, padding:0 }}>×</button>
                        </div>

                        </select>
                      </div>

                    <div style={{ display:"inline-flex", flexDirection:"column", gap:5, border:`1px dashed ${C.line}`, borderRadius:12, padding:"8px 10px", minWidth:160 }}>
                      <span style={{ fontSize:11, fontWeight:600, color:C.muted }}>+ طبيب إضافي (اختياري)</span>

                        <option value="">إضافة…</option>
                        {optList.map(({d,note})=><option key={d.id} value={d.id}>د.{d.name} — {note}</option>)}
                      </select>
                    </div>
                  </div>;
                })()}
                {docs.map(d=>{ const needs=[]; if(isClinic(getSlot(d,di,"am")))needs.push(["am","عيادة الصباح",di]); if(isClinic(getSlot(d,di,"pm")))needs.push(["pm","عيادة الظهر",di]);
                  if(clinicClosedOnLeave(d,date,leaves)||!needs.length) return null;

                    {needs.map(([slot,lbl,sdi])=>{ const isNext=slot==="nextAm"; const cur=isNext?((cv[slot]||[])[0]):ownerCover(date,d.id,slot); const pl=pickList(d.id, sdi, isNext?nextWork(date):date, isNext?"am":slot); return (
                      <div key={slot} style={{ marginBottom:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:5 }}>
                          <span style={{ fontSize:11, color:C.muted, minWidth:64 }}>{lbl}</span>
                          {cur && <span style={{ fontSize:11.5, color:C.primaryD, fontWeight:700 }}>✓ د.{fd(cur)?.name}</span>}
                          {cur && <button onClick={()=>isNext?clearCov(date,slot):clearOwnerCover(date,d.id,slot)} style={{ ...sGhost, color:C.err, padding:"2px 8px", fontSize:11 }}>إزالة</button>}
                        </div>
                        <CoverPicker list={pl} cur={cur} onPick={cid=>isNext?setCov(date,slot,cid):setOwnerCover(date,d.id,slot,cid)} />
                      </div>
                    ); })}
                  </div>;
                })}
                {coverages.filter(c=>c.date===date).length>0 && <div style={{ marginTop:6 }}>
                  {coverages.filter(c=>c.date===date).map(c=>{ const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; return cd&&(
                    <div key={c.id} style={{ display:"flex", alignItems:"center", gap:7, fontSize:12, background:"var(--primarySoft)", borderRadius:8, padding:"5px 9px", marginBottom:4 }}>
                      <span style={{ color:C.primary, fontWeight:700 }}>🔄 د.{cd.name} يغطّي عيادة{ad?` د.${ad.name}`:""} {perAr(c.period)}</span>
                      <span style={{ flex:1 }}/><button onClick={()=>removeCovIndiv(c.id)} style={{ ...sGhost, color:C.err, padding:"3px 9px" }}>حذف</button>
                    </div>
                  ); })}
                </div>}
                <button onClick={()=>{ setSel(null); showToast("تم حفظ اليوم"); }} style={{ ...sBtn(C.primary), width:"100%", marginTop:8 }}>💾 حفظ اليوم</button>
              </div>}
            </div>;
          })}
        </div>}
    </div>
  </div>;
}

// ════════════════════════════════ LEAVES ════════════════════════════════
function LeavesPage({ doctors, leaves, nightData, coverages, today, fd, setLeaves, setCoverages, setNight, showToast, logAudit }) {
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };
  const [f, setF] = useState({ doctorId:"", type:"annual", start:"", end:"", clinicClosed:true });
  const add = () => { if(!f.doctorId||!f.start||!f.end){showToast("أكمل الحقول","warn");return;} if(f.end<f.start){showToast("التواريخ غير صحيحة","err");return;} setLeaves(ls=>[...ls,{id:uid(),doctorId:+f.doctorId,type:f.type,start:f.start,end:f.end,clinicClosed:f.clinicClosed}]); setF({doctorId:"",type:"annual",start:"",end:"",clinicClosed:true}); logAudit&&logAudit(`تسجيل إجازة د.${fd(+f.doctorId)?.name||""} (${f.type})`); showToast("تم تسجيل الإجازة"); };
  const del = id => {
    const l = leaves.find(x=>x.id===id); if(!l) return;
    const nextDay = ds=>{ const x=new Date(ds); x.setDate(x.getDate()+1); return x.toISOString().split("T")[0]; };
    const inRange = ds => ds>=l.start && ds<=l.end;
    setLeaves(ls=>ls.filter(x=>x.id!==id));
    setCoverages(cs=>cs.filter(c=>{
      if(c.absentId!==l.doctorId) return true;
      if(c.reason==="leave" && inRange(c.date)) return false;                       // تغطية الإجازة
      if(c.reason==="post_evening" && inRange((()=>{const x=new Date(c.date);x.setDate(x.getDate()-1);return x.toISOString().split("T")[0];})())) return false; // راحة بعد مسائي أثناء الإجازة
      return true;
    }));
    logAudit&&logAudit(`حذف إجازة د.${fd(l.doctorId)?.name||""} وإلغاء تغطياتها المرتبطة`);
    showToast&&showToast("تم حذف الإجازة وإلغاء التغطيات المرتبطة بها");
  };
  const autoCoverLeave = l => { const d=fd(l.doctorId); if(!d) return; const [ly]=l.start.split("-"); const yd=[]; for(let m=0;m<12;m++) yd.push(...monthDays(+ly,m).map(x=>x.date)); const load=id=>{ const s=doctorSessions(doctors.find(x=>x.id===id),yd,nightData,coverages,leaves); return s.total; }; const adds=[]; const used={}; const s=new Date(l.start),e=new Date(l.end); for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4) continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; ["am","pm"].forEach(p=>{ if(!isClinic(getSlot(d,wi,p))) return; if(coverages.some(c=>c.date===ds&&c.period===p&&c.absentId===d.id)) return; const av=getAvailable(doctors,[d.id],wi,ds,p,leaves,nightData,{},coverages).filter(a=>a.status==="free").map(a=>({a,L:load(a.doc.id)})).sort((x,y)=>x.L-y.L); const key=ds+"|"+p; const taken=used[key]||[]; const pick=av.find(x=>!taken.includes(x.a.doc.id)); if(pick){ adds.push({id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:pick.a.doc.id,reason:"leave"}); (used[key]=used[key]||[]).push(pick.a.doc.id); } }); } if(!adds.length){ showToast("لا عيادات مكشوفة أو لا متاح","warn"); return; } setCoverages(cs=>[...cs,...adds]); showToast(`تمت تغطية ${adds.length} عيادة بالأنسب`); };
  const sorted = leaves.slice().sort((a,b)=>b.start.localeCompare(a.start));
  const [open,setOpen] = useState(()=>new Set());
  const toggle = id => setOpen(o=>{ const n=new Set(o); n.has(id)?n.delete(id):n.add(id); return n; });
  const [openMonths,setOpenMonths] = useState(()=>new Set([today.slice(0,7)]));
  const toggleMonth = key => setOpenMonths(o=>{ const n=new Set(o); n.has(key)?n.delete(key):n.add(key); return n; });

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🏖 تسجيل إجازة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الطبيب</label><select value={f.doctorId} onChange={e=>setF({...f,doctorId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>النوع</label><select value={f.type} onChange={e=>setF({...f,type:e.target.value})} style={sIn}>{Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={label}>من</label><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value})} style={sIn} /></div>
        <div><label style={label}>إلى</label><input type="date" value={f.end} onChange={e=>setF({...f,end:e.target.value})} style={sIn} /></div>
      </div>
      <label style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, fontSize:13, color:C.sub, cursor:"pointer" }}>
        <input type="checkbox" checked={f.clinicClosed} onChange={e=>setF({...f,clinicClosed:e.target.checked})} /> العيادة مغلقة خلال الإجازة (لا تحتاج تغطية)
      </label>
      <button onClick={add} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة</button>
    </div>

    {sorted.length===0 ? <Empty icon="🏖" title="لا إجازات مسجّلة" /> :
      (()=>{
        const groups=[]; const byKey={};
        sorted.forEach(l=>{ const k=l.start.slice(0,7); if(!byKey[k]){ byKey[k]={ key:k, items:[] }; groups.push(byKey[k]); } byKey[k].items.push(l); });
        const curKey=today.slice(0,7);
        return groups.map(({key,items})=>{
          const [y,m]=key.split("-"); const label=`${MONTHS[+m-1]} ${y}`;
          const isOpen = openMonths.has(key);
          return <div key={key} style={{ marginBottom:14 }}>
            <div onClick={()=>toggleMonth(key)} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer", padding:"10px 14px", borderRadius:12, background:key===curKey?"var(--primarySoft)":"var(--surface2)", border:`1px solid ${key===curKey?C.primary:C.line}`, marginBottom:isOpen?10:0 }}>
              <span style={{ fontWeight:800, fontSize:14, color:key===curKey?C.primaryD:C.text }}>{label}</span>
              {key===curKey && <span style={{ fontSize:10, fontWeight:700, background:C.primary, color:"#fff", borderRadius:20, padding:"2px 8px" }}>الحالي</span>}
              <span style={{ fontSize:11.5, color:C.muted }}>{items.length} إجازة</span>
              <span style={{ flex:1 }} />
              <span style={{ color:C.muted, fontSize:12 }}>{isOpen?"▲":"▼"}</span>
            </div>
            {isOpen && <div className="grid-cards">{items.map(l=>{ const d=fd(l.doctorId); if(!d) return null;
        // impact
        const clinics=[],carried=[],evening=[];
        const s=new Date(l.start),e=new Date(l.end);
        for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4)continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; const nd=nightData[ds]||{}; const cds=nd.coverages||{};
          ["am","pm"].forEach(p=>{ if(isClinic(getSlot(d,wi,p))){ const ex=coverages.find(c=>c.date===ds&&c.period===p&&c.absentId===d.id); clinics.push({ds,p,cov:ex?ex.coverDoctorId:null}); } });
          if((nd.doctors||[]).includes(d.id)) evening.push(ds);
          ["am","pm","nextAm"].forEach(sl=>{ if((cds[sl]||[]).includes(d.id)) carried.push({ds,p:sl}); });
          coverages.forEach(cv=>{ if(cv.date===ds&&cv.coverDoctorId===d.id) carried.push({ds,p:cv.period}); });
        }
        const uncovered = l.clinicClosed!==false?0:clinics.filter(c=>!c.cov).length;
        const isOpenCard = open.has(l.id);
        const chip = l.clinicClosed!==false ? {t:"العيادة مغلقة", bg:"var(--surface2)", fg:C.sub}
          : uncovered>0 ? {t:`مكشوف ${uncovered}`, bg:"var(--dangerSoft)", fg:C.err}
          : {t:"مغطّاة ✓", bg:"var(--okSoft)", fg:C.ok};
        return <div key={l.id} style={{ ...card(), padding:0, overflow:"hidden" }}>
          <div onClick={()=>toggle(l.id)} style={{ display:"flex", alignItems:"center", gap:10, padding:13, cursor:"pointer" }}>
            <Avatar doc={d} size={36}/>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>{d.name}</div>
              <div style={{ fontSize:11.5, color:C.sub }}>{TYPES[l.type]} · {dmy(l.start)} ← {dmy(l.end)}</div>
            </div>
            <span style={{ fontSize:10.5, fontWeight:700, background:chip.bg, color:chip.fg, borderRadius:20, padding:"4px 11px", whiteSpace:"nowrap" }}>{chip.t}</span>
            <span onClick={e=>e.stopPropagation()}>
              <Kebab items={[
                (l.clinicClosed===false) && { icon:"⚡", label:"تغطية تلقائية", onClick:()=>autoCoverLeave(l) },
                { icon:"🗑", label:"حذف الإجازة", danger:true, onClick:()=>{ if(confirm("حذف هذه الإجازة؟")) del(l.id); } },
              ]} />
            </span>
            <span style={{ color:C.muted, fontSize:11 }}>{isOpenCard?"▲":"▼"}</span>
          </div>
          {isOpenCard && (()=>{ 
            const [ly] = l.start.split("-");
            const yd = []; for(let m=0;m<12;m++) yd.push(...monthDays(+ly,m).map(x=>x.date));
            const md = monthDays(+l.start.split("-")[0], +l.start.split("-")[1]-1).map(x=>x.date);
            const loadOf = id => doctorSessions(doctors.find(x=>x.id===id), yd, nightData, coverages, leaves).total;
            const pickFor = (wi,ds,period) => getAvailable(doctors,[d.id],wi,ds,period,leaves,nightData,{},coverages,true).map(a=>({ ...a, load:loadOf(a.doc.id), commit:a.status==="warn"?(SLOT_COMMIT[getSlot(a.doc,wi,period)]||"التزام"):null, busyType: a.status==="busy" ? (()=>{ const sl=getSlot(a.doc,wi,period); return isClinic(sl)?"عيادة":(SLOT_AR[sl]||"عيادة"); })() : null })).sort((a,b)=> (({free:0,warn:1,busy:2,leave:3}[a.status])-({free:0,warn:1,busy:2,leave:3}[b.status])) || (a.load-b.load));
            const eveLoad = id => md.reduce((a,dt)=>a+(((nightData[dt]||{}).doctors||[]).includes(id)?1:0),0);
            const evePick = ds => { const nightDocs=(nightData[ds]?.doctors)||[]; return doctors.filter(x=>x.id!==d.id&&!nightDocs.includes(x.id)).map(x=>{ const lv=onLeave(x,ds,leaves); const fixedAny=(x.nightDays||[]).length>0; return { doc:x, status: lv?"leave":fixedAny?"warn":"free", commit: (fixedAny&&!lv)?"عيادة مسائية ثابتة":null, load:eveLoad(x.id) }; }).sort((a,b)=>(({free:0,warn:1,busy:2,leave:3}[a.status])-({free:0,warn:1,busy:2,leave:3}[b.status]))||(a.load-b.load)); };
            const assignClinic = (ds,p,cid) => { setCoverages(cs=>[...cs.filter(c=>!(c.date===ds&&c.period===p&&c.absentId===d.id)), {id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:cid,reason:"leave"}]); logAudit&&logAudit(`بديل إجازة د.${d.name} (${perAr(p)} ${dmy(ds)}) ← د.${fd(cid)?.name||"؟"}`); showToast("تم تعيين البديل"); };
            const assignEve = (ds,cid) => { setNight&&setNight(n=>{ const day=n[ds]||{doctors:[],coverages:{am:[],pm:[],nextAm:[]}}; const docs=[...new Set((day.doctors||[]).map(x=>x===d.id?cid:x))]; if(!docs.includes(cid)) docs.push(cid); return {...n,[ds]:{...day,doctors:docs}}; }); logAudit&&logAudit(`بديل مسائي إجازة د.${d.name} (${dmy(ds)}) ← د.${fd(cid)?.name||"؟"}`); showToast("تم تعيين بديل المسائي"); };
            const openClinics = l.clinicClosed!==false ? [] : clinics;
            return <div style={{ padding:"0 13px 14px" }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:10 }}>

                <div style={{ background:"var(--surface2)", fontSize:9, fontWeight:700, color:C.sub, padding:"3px 0" }}>{DAYS[di]}</div>
                {["am","pm"].map(p=>{ const sl=getSlot(d,di,p); const dir=DIRECT_SLOTS.includes(sl); return <div key={p} style={{ fontSize:9, padding:"4px 1px", color:dir?C.primary:C.muted, background:dir?"var(--primarySoft)":"var(--surface)", fontWeight:dir?700:400 }}>{SLOT_AR[sl]||"—"}</div>; })}
                {(()=>{ const fx=(d.sched?.[di]?.eve)||((d.nightDays||[]).includes(di)?"clinic":""); return <div style={{ fontSize:9, padding:"4px 1px", color:fx?"var(--eve)":C.muted, background:fx?"#ECEAFE":"var(--surface)", fontWeight:fx?700:400 }}>{fx?"🌙":"—"}</div>; })()}
              </div>)}
            </div>
            <div style={{ background:"var(--surface2)", borderRadius:10, padding:"9px 11px" }}>
              <div style={{ fontSize:11.5, fontWeight:700, color:C.text, marginBottom:5 }}>🏥 عياداته خلال الإجازة ({clinics.length}){uncovered>0&&<span style={{ color:C.err }}> · مكشوف {uncovered}</span>}</div>
              {uncovered>0 && <button onClick={()=>autoCoverLeave(l)} style={{ ...sBtn(C.primary), padding:"7px 13px", fontSize:12, marginBottom:9 }}>⚡ تغطية الكل بالأنسب</button>}
              {l.clinicClosed!==false && clinics.length>0 && <div style={{ fontSize:11, color:C.ok, marginBottom:4 }}>العيادة مغلقة خلال الإجازة — لا تحتاج تغطية.</div>}
              {openClinics.map((c,i)=><div key={i} style={{ marginBottom:9, paddingBottom:9, borderBottom:i<openClinics.length-1?`1px dashed ${C.line2}`:"none" }}>
                <div style={{ fontSize:11.5, fontWeight:700, color:C.text, marginBottom:5 }}>• {dmy(c.ds)} {perAr(c.p)} {c.cov?<span style={{ color:C.ok }}>— البديل: د.{fd(c.cov)?.name} (اضغط للتغيير)</span>:<span style={{ color:C.err }}>— اختر بديلاً</span>}</div>
                <CoverPicker list={pickFor(dayIdx(c.ds),c.ds,c.p)} cur={c.cov} onPick={cid=>assignClinic(c.ds,c.p,cid)} />
              </div>)}
              {clinics.length===0 && <div style={{ fontSize:11, color:C.muted }}>لا عيادات</div>}
              {carried.length>0&&<div style={{ fontSize:11, color:C.warn, marginTop:6 }}>🔄 تغطياته لزملاء: {carried.length} — تحتاج إعادة تعيين</div>}
              {evening.map((ds,i)=><div key={"e"+i} style={{ marginTop:9 }}>
                <div style={{ fontSize:11.5, fontWeight:700, color:C.eve, marginBottom:5 }}>🌙 بديل المسائي — {dmy(ds)}</div>
                <CoverPicker list={evePick(ds)} cur={null} onPick={cid=>assignEve(ds,cid)} />
              </div>)}
            </div>
          </div>; })()}
        </div>;
      })}</div>}
          </div>;
        });
      })()}
  </div>;
}

// ════════════════════════════════ STATS ════════════════════════════════
function StatsPage({ doctors, leaves, nightData, coverages, today, fd }) {
  const [mode,setMode] = useState("week");
  const [monthsN,setMonthsN] = useState(2);
  const [anchor,setAnchor] = useState(today);
  const [sel,setSel] = useState(null);
  const [full,setFull] = useState(false);
  const [rangeFrom,setRangeFrom] = useState(today);
  const [rangeTo,setRangeTo] = useState(today);
  const [gridYear,setGridYear] = useState(new Date(today).getFullYear());
  const [gridMonths,setGridMonths] = useState(()=>new Set([new Date(today).getMonth()]));
  const toggleGridMonth = m => setGridMonths(s=>{ const n=new Set(s); n.has(m)?n.delete(m):n.add(m); return n; });
  const period = (()=>{
    if(mode==="week"){ const t=new Date(anchor); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const dates=[]; for(let i=0;i<5;i++){ const d=new Date(sun); d.setDate(sun.getDate()+i); dates.push(d.toISOString().split("T")[0]); } return { dates, label:`أسبوع ${dmy(dates[0])} ← ${dmy(dates[4])}`, weeks:1 }; }
    if(mode==="month"){ const [y,m]=anchor.split("-"); const dates=monthDays(+y,+m-1).map(x=>x.date); return { dates, label:`${MONTHS[+m-1]} ${y}`, weeks:Math.max(1,Math.round(dates.length/5)) }; }
    if(mode==="range"){ const dates=[]; const s=new Date(rangeFrom), e=new Date(rangeTo); if(e>=s){ for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)) dates.push(d.toISOString().split("T")[0]); } return { dates, label:`${dmy(rangeFrom)} ← ${dmy(rangeTo)}`, weeks:Math.max(1,Math.round(dates.length/5)) }; }
    if(mode==="grid"){ const ms=[...gridMonths].sort((a,b)=>a-b); const dates=ms.flatMap(m=>monthDays(gridYear,m).map(x=>x.date)); const label = ms.length ? `${ms.map(m=>MONTHS[m]).join("، ")} ${gridYear}` : `لم تُحدَّد أشهر — ${gridYear}`; return { dates, label, weeks:Math.max(1,Math.round(dates.length/5)) }; }
    // multi: N months ending at anchor's month (inclusive)
    const [y,m]=anchor.split("-"); const Y=+y, M=+m-1;
    const startAbs = Y*12+M-(monthsN-1);
    const startY = Math.floor(startAbs/12), startM = ((startAbs%12)+12)%12;
    const dates=[]; for(let i=0;i<monthsN;i++){ const abs=startAbs+i; const yy=Math.floor(abs/12), mm=((abs%12)+12)%12; dates.push(...monthDays(yy,mm).map(x=>x.date)); }
    const label = monthsN===12 ? `${Y} (١٢ شهر)` : `${MONTHS[startM]} ${startY} ← ${MONTHS[M]} ${Y}`;
    return { dates, label, weeks:Math.max(1,Math.round(dates.length/5)) };
  })();
  const md = period.dates;
  const workdaysN = md.filter(dt=>dayIdx(dt)>=0).length;
  const overview = doctors.map(d=>{
    const sess=doctorSessions(d, md, nightData, coverages, leaves);
    const annualDays = md.filter(dt=>dayIdx(dt)>=0 && leaves.some(l=>l.doctorId===d.id && l.type==="annual" && dt>=l.start && dt<=l.end)).length;
    const otherLeaveDays = md.filter(dt=>dayIdx(dt)>=0 && leaves.some(l=>l.doctorId===d.id && l.type && l.type!=="annual" && dt>=l.start && dt<=l.end)).length;
    const eff = Math.max(0, workdaysN - annualDays);
    const target = Math.round(directTarget(d) * eff / 5);   // هدف اليوم = هدف الأسبوع ÷ ٥ × أيام العمل الفعلية (بلا تقريب أسابيع)
    return { d, sess, target, annualDays, otherLeaveDays };
  }).sort((a,b)=>b.sess.care-a.sess.care);
  const worked = overview.filter(o=>o.sess.attended>0||o.sess.covers>0).length;
  const absentCov = overview.reduce((a,o)=>a+o.sess.absentCovered,0);
  const totalCov = overview.reduce((a,o)=>a+o.sess.covers,0);
  const totalEve = overview.reduce((a,o)=>a+o.sess.evening,0);
  const shiftAnchor = n => { const d=new Date(anchor); if(mode==="week") d.setDate(d.getDate()+7*n); else if(mode==="month") d.setMonth(d.getMonth()+n); else if(mode==="multi") d.setMonth(d.getMonth()+monthsN*n); setAnchor(d.toISOString().split("T")[0]); };
  const loadStatus = (care,target) => { if(!target||target<=0) return { key:"na", color:"#64748b", label:"—" }; const r=care/target; if(r>=1.05) return { key:"over", color:"#064E3B", label:"أكثر من المطلوب" }; if(r>=0.90) return { key:"meets", color:"#16A34A", label:"مطابق للمطلوب" }; if(r>=0.65) return { key:"under", color:"#CA8A04", label:"ناقص" }; return { key:"vlow", color:"#DC2626", label:"ناقص جداً" }; };
  const printWorkload = (list,titleSuffix="") => {
    const css = `<style>.bdg{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;display:inline-block}.lgnd{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px}.lgnd span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#475569}.lgnd i{width:14px;height:14px;border-radius:4px;display:inline-block}</style>`;
    const legend = `<div class="lgnd"><span><i style="background:#064E3B"></i>أكثر من المطلوب</span><span><i style="background:#16A34A"></i>مطابق للمطلوب</span><span><i style="background:#CA8A04"></i>ناقص</span><span><i style="background:#DC2626"></i>ناقص جداً</span><span><i style="background:#2563EB"></i>في إجازة سنوية</span></div>`;
    const rows = list.map(({d,sess,target,annualDays=0})=>{ const st=loadStatus(sess.care,target); const onA=annualDays>0&&st.key==="na"; const col=onA?"#2563EB":st.color; const lbl=onA?"في إجازة سنوية":st.label; const pct=target?Math.round(sess.care/target*100):0; return `<tr><td style="text-align:start;font-weight:700">د.${d.name}</td><td>${rankLabel(rankOf(d))}</td><td><b style="color:${col}">${sess.care}</b></td><td>${target}</td><td>${pct}%</td><td>${sess.evening}</td><td>${sess.covers}</td><td>${annualDays?`${annualDays}ي`:"—"}</td><td><span class="bdg" style="background:${col}">${lbl}</span></td></tr>`; }).join("");

            <div style={{ flex:1, minWidth:0 }}><div style={{ fontWeight:700, fontSize:13.5 }}>{d.name}</div><div style={{ fontSize:11, color:C.sub }}>{rankLabel(rankOf(d))}</div></div>

            <div style={{ textAlign:"center" }}><div style={{ fontSize:18, fontWeight:800, color:badgeColor }}>{sess.care}</div><div style={{ fontSize:10, color:C.muted }}>/ {target}</div></div>

    {sel!=null && (()=>{ const sd=fd(sel); if(!sd) return null;
      const ev=md.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(sd.id));

      coverages.filter(c=>c.coverDoctorId===sd.id&&md.includes(c.date)).forEach(c=>{ const ad=c.absentId?fd(c.absentId):null; cov.push({ key:c.id, date:c.date, plabel:perAr(c.period), owner:ad?ad.name:null }); });
      const myLeaves=leaves.filter(l=>l.doctorId===sd.id).sort((a,b)=>b.start.localeCompare(a.start));
      const sess=doctorSessions(sd, md, nightData, coverages, leaves);
      const LT={annual:"سنوية",sick:"مرضية",emergency:"طارئة",other:"أخرى"};
      const stat=(lbl,val,col)=><div style={{ flex:"1 1 70px", background:"var(--surface2)", borderRadius:10, padding:"10px", textAlign:"center" }}><div style={{ fontSize:20, fontWeight:800, color:col }}>{val}</div><div style={{ fontSize:10.5, color:C.sub, marginTop:3 }}>{lbl}</div></div>;
      return <div onClick={()=>setSel(null)} style={{ position:"fixed", inset:0, background:"rgba(20,30,40,.5)", zIndex:100, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"20px 14px", overflowY:"auto" }}>

            <Avatar doc={sd} size={48}/>
            <div style={{ flex:1 }}><div style={{ fontSize:17, fontWeight:700 }}>د.{sd.name}</div><div style={{ fontSize:12, color:C.sub }}>{rankLabel(rankOf(sd))} · {posLabel(sd.adminPosition,sd)} · SS {posSS(sd.adminPosition,sd)} · DS {directTarget(sd)}</div></div>
            <button onClick={()=>setFull(f=>!f)} style={{ ...sGhost, padding:"6px 12px" }} title="توسيع/تصغير">{full?"⤡ تصغير":"⤢ توسيع"}</button><button onClick={()=>{setSel(null);setFull(false);}} style={{ ...sGhost, padding:"6px 12px" }}>✕</button>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:16 }}>
            {stat("رعاية مباشرة",sess.care,C.primary)}{stat("دعم",sess.support,"#64748b")}{stat("مسائي",sess.evening,"var(--eve)")}{stat("تغطيات",cov.length,"var(--primary-d)")}{stat("إجازات",myLeaves.length,C.warn)}{stat("إجمالي العمل",sess.total,"var(--ink)")}
          </div>
          <div style={{ background:"var(--surface2)", border:`1px solid ${C.line2}`, borderRadius:12, padding:13, marginBottom:16 }}>
            <div style={{ fontSize:12.5, fontWeight:800, marginBottom:10 }}>📐 توزيع الأسبوع — WS = ١٠ فترات</div>
            {[["DS · الرعاية المباشرة", sess.care, directTarget(sd), C.primary],["SS · الدعم", sess.support, posSS(sd.adminPosition,sd), "#64748b"]].map(([l,act,tgt,col])=>(
              <div key={l} style={{ marginBottom:10 }}>
                <div style={{ display:"flex", fontSize:11.5, marginBottom:4 }}><span style={{ flex:1, fontWeight:700 }}>{l}</span><span style={{ color:C.sub }}>الفعلي {act} · الهدف {tgt}</span></div>
                <div style={{ height:8, background:"var(--surface2)", borderRadius:6, overflow:"hidden" }}><div style={{ width:Math.min(100, tgt? (act/tgt*100):0)+"%", height:"100%", background:col }} /></div>
              </div>
            ))}
            <div style={{ fontSize:11, color:C.muted }}>الهدف الأسبوعي: SS {posSS(sd.adminPosition,sd)} دعم + DS {directTarget(sd)} رعاية = WS ١٠ ({posLabel(sd.adminPosition,sd)})</div>
          </div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:6 }}>🏥 جدول العيادات</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:16 }}>
            {[0,1,2,3,4].map(di=><div key={di} style={{ border:`1px solid ${C.line2}`, borderRadius:8, overflow:"hidden", textAlign:"center" }}><div style={{ background:"var(--surface2)", fontSize:9, fontWeight:700, color:C.sub, padding:"3px 0" }}>{DAYS[di]}</div>{["am","pm"].map(p=>{ const sl=getSlot(sd,di,p); const dir=DIRECT_SLOTS.includes(sl); return <div key={p} style={{ fontSize:9, padding:"4px 1px", color:dir?C.primary:C.muted, background:dir?"var(--primarySoft)":"var(--surface)", fontWeight:dir?700:400 }}>{SLOT_AR[sl]||"—"}</div>; })}{(()=>{ const fx=(sd.sched?.[di]?.eve)||((sd.nightDays||[]).includes(di)?"clinic":""); return <div style={{ fontSize:9, padding:"4px 1px", color:fx?"var(--eve)":C.muted, background:fx?"#ECEAFE":"var(--surface)", fontWeight:fx?700:400 }}>{fx?"🌙":"—"}</div>; })()}</div>)}
          </div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🌙 الدوام المسائي ({ev.length})</div>
          <div style={{ fontSize:12, color:C.sub, marginBottom:16 }}>{ev.length?ev.map(dmy).join("، "):"—"}</div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🔄 التغطيات المؤدّاة ({cov.length})</div>
          <div style={{ marginBottom:16 }}>{cov.length?cov.map(c=><div key={c.key} style={{ fontSize:11.5, color:C.sub, padding:"2px 0" }}>• {dmy(c.date)} — {c.plabel}{c.owner?` · عيادة د.${c.owner}`:""}</div>):<div style={{ fontSize:12, color:C.muted }}>—</div>}</div>
          <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>🏖 الإجازات ({myLeaves.length})</div>
          <div>{myLeaves.length?myLeaves.map(l=><div key={l.id} style={{ fontSize:11.5, color:C.sub, padding:"2px 0" }}>• {LT[l.type]} · {dmy(l.start)} ← {dmy(l.end)}</div>):<div style={{ fontSize:12, color:C.muted }}>—</div>}</div>
        </div>
      </div>;
    })()}
  </div>;
}

// ════════════════════════════════ SEED (أطباء القسم) ════════════════════════════════
const _SM = { c:"clinic", v:"virtual", a:"audit", t:"training", d:"admin", x:"" };
const _mkSched = r => { const s={}; for(let i=0;i<5;i++) s[i]={ pm:_SM[r[i][0]], am:_SM[r[i][1]], eve:"" }; return s; };
const _SEED = [
  ["محمد الشهراني",[0],[["c","c"],["x","t"],["c","d"],["d","c"],["c","d"]]],
  ["طارق السرحاني",[],[["x","t"],["c","c"],["x","c"],["c","t"],["c","c"]]],
  ["ثائرة المهناء",[0],[["c","c"],["v","a"],["c","x"],["c","x"],["x","c"]]],
  ["مهدي الشايب",[1],[["x","v"],["c","c"],["x","t"],["c","t"],["c","c"]]],
  ["ديمة كمال",[3],[["c","a"],["d","c"],["d","c"],["c","v"],["c","d"]]],
  ["مريم الإبراهيم",[2],[["c","x"],["x","c"],["c","a"],["c","c"],["v","c"]]],
  ["بثينة الغانم",[0],[["c","d"],["d","c"],["t","c"],["c","d"],["c","v"]]],
  ["عبدالرحمن الفرحان",[1],[["c","x"],["c","v"],["c","x"],["c","c"],["c","x"]]],
  ["أمل عسقلان",[0],[["c","a"],["c","d"],["d","c"],["c","v"],["c","d"]]],
  ["بسام القريافي",[2],[["x","x"],["c","v"],["c","c"],["x","x"],["c","x"]]],
  ["شذا القحطاني",[4],[["t","x"],["c","v"],["d","c"],["d","c"],["c","t"]]],
  ["أمل العسكر",[1],[["c","v"],["d","c"],["c","t"],["c","t"],["t","d"]]],
  ["فايزة الشهري",[1],[["d","d"],["c","c"],["d","d"],["c","c"],["d","d"]]],
  ["حنان المحيسن",[1],[["c","c"],["c","t"],["x","x"],["a","v"],["c","c"]]],
  ["محمد القحطاني",[0],[["d","c"],["t","c"],["d","t"],["c","d"],["c","d"]]],
  ["مضر فتيح",[4],[["c","t"],["c","d"],["c","d"],["t","c"],["d","c"]]],
  ["عزيزة دريهم",[4],[["d","v"],["d","d"],["c","d"],["c","c"],["c","c"]]],
];
const SEED_DOCTORS = _SEED.map((e,i)=>{ const sched=_mkSched(e[2]); (e[1]||[]).forEach(di=>{ if(sched[di]) sched[di].eve="clinic"; }); return { id:9001+i, name:e[0], color:PALETTE[i%PALETTE.length], nightDays:e[1], blockedDays:[], rank:"specialist", adminPosition:"none", sched }; });

const DEFAULT_SETTINGS = { capEvening:8, capLeaveDay:4, restRule:true };
function showPrintOverlay(docHtml){
  const prev=document.getElementById("__printOverlay"); if(prev) prev.remove();
  const ov=document.createElement("div"); ov.id="__printOverlay";
  ov.style.cssText="position:fixed;inset:0;z-index:100000;background:#0f1b2a;display:flex;flex-direction:column";
  const bar=document.createElement("div");
  bar.style.cssText="display:flex;gap:10px;align-items:center;padding:10px 14px;background:#0f1b2a;flex-shrink:0;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif";
  const closeB=document.createElement("button"); closeB.textContent="\u2715 \u0625\u063A\u0644\u0627\u0642";
  closeB.style.cssText="background:#e5484d;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer";
  const prn=document.createElement("button"); prn.textContent="\uD83D\uDDA8 \u0637\u0628\u0627\u0639\u0629 / \u062D\u0641\u0638 PDF";
  prn.style.cssText="background:#0FA39A;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer";
  const sp=document.createElement("div"); sp.style.cssText="margin-inline-start:auto;color:#fff;opacity:.7;font-size:12px"; sp.textContent="\u0645\u0639\u0627\u064A\u0646\u0629 \u0627\u0644\u062A\u0642\u0631\u064A\u0631";
  const ifr=document.createElement("iframe"); ifr.style.cssText="flex:1;border:0;width:100%;background:#fff";
  bar.appendChild(closeB); bar.appendChild(prn); bar.appendChild(sp); ov.appendChild(bar); ov.appendChild(ifr); document.body.appendChild(ov);
  const d=ifr.contentWindow.document; d.open(); d.write(docHtml); d.close();
  closeB.onclick=()=>ov.remove();
  prn.onclick=()=>{ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){ try{window.print()}catch(_){}} };
}

function FairnessPage({ doctors, leaves, nightData, coverages, today }) {
  const [scope,setScope] = useState("month");
  const now = new Date(today);
  const dates = (()=>{ if(scope==="month") return monthDays(now.getFullYear(),now.getMonth()).map(x=>x.date); const out=[]; for(let m=0;m<12;m++) monthDays(now.getFullYear(),m).forEach(x=>out.push(x.date)); return out; })();
  const rows = doctors.map(d=>{ const s=doctorSessions(d,dates,nightData,coverages,leaves); return { d, contrib:s.covers+s.eveningExtra, covers:s.covers, eve:s.eveningExtra, care:s.care }; }).sort((a,b)=>b.contrib-a.contrib);
  const avg = rows.length ? rows.reduce((a,r)=>a+r.contrib,0)/rows.length : 0;
  const max = Math.max(1, ...rows.map(r=>r.contrib));
  const most = rows[0], least = rows[rows.length-1];
  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>⚖️ مؤشر مساهمة الأطباء</div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["month","الشهر"],["year","السنة"]].map(([k,l])=><button key={k} onClick={()=>setScope(k)} style={{ padding:"7px 15px", border:"none", fontSize:12.5, fontWeight:700, background:scope===k?C.primary:"var(--surface)", color:scope===k?"#fff":C.sub }}>{l}</button>)}
        </div>
      </div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:8 }}>المساهمة = التغطيات المنفّذة + المسائي الإضافي. متوسط القسم: <b style={{ color:C.primary }}>{avg.toFixed(1)}</b></div>
    </div>
    {most && least && <div style={{ display:"flex", gap:10, marginBottom:14, flexWrap:"wrap" }}>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأكثر مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{most.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.primary }}>{most.contrib}</div></div>
      <div style={{ ...card(), flex:"1 1 150px", padding:14 }}><div style={{ fontSize:11, color:C.sub }}>الأقل مساهمة</div><div style={{ fontWeight:700, marginTop:3 }}>د.{least.d.name}</div><div style={{ fontSize:20, fontWeight:800, color:C.warn }}>{least.contrib}</div></div>
    </div>}
    <div style={{ ...card(), padding:14 }}>
      {rows.map((r,i)=>{ const pct=Math.round(r.contrib/max*100); const above=r.contrib>=avg; return (
        <div key={r.d.id} style={{ marginBottom:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
            <span style={{ fontWeight:800, color:C.muted, minWidth:18, fontSize:12 }}>{i+1}</span>
            <Avatar doc={r.d} size={24}/>
            <span style={{ flex:1, fontSize:13, fontWeight:600 }}>د.{r.d.name}</span>
            <span style={{ fontSize:11, color:C.sub }}>تغطيات {r.covers} · مسائي+ {r.eve}</span>
            <span style={{ fontWeight:800, color:above?C.primary:C.warn, minWidth:24, textAlign:"center" }}>{r.contrib}</span>
          </div>
          <div style={{ height:8, background:"var(--surface2)", borderRadius:6, overflow:"hidden" }}><div style={{ width:pct+"%", height:"100%", background:above?`linear-gradient(90deg,${C.primary},${C.eve})`:C.warn, borderRadius:6 }} /></div>
        </div>
      ); })}
    </div>
  </div>;
}

function AlertsPage({ doctors, leaves, nightData, coverages, today, fd, settings, onGoto }) {
  const s = { ...DEFAULT_SETTINGS, ...settings };
  const now = new Date(today);
  const al = [];
  const ana = analyzeMonth(now.getFullYear(), now.getMonth(), doctors, leaves, nightData, coverages, s.restRule!==false);
  ana.conflicts.forEach(c=> al.push({ sev:"err", t:c.text, go:"engine" }));
  ana.gaps.forEach(g=>{ const o=fd(g.ownerId); al.push({ sev:"warn", t:`عيادة ${o?"د."+o.name:""} مكشوفة ${dmy(g.date)} (${g.period==="am"?"صباحاً":"ظهراً"})`, go:"engine" }); });
  leaves.forEach(l=>{ const du=Math.round((new Date(l.start)-now)/864e5); if(du>0&&du<=3){ const d=fd(l.doctorId); if(d) al.push({ sev:"warn", t:`إجازة د.${d.name} تبدأ بعد ${du} ${du===1?"يوم":"أيام"}`, go:"leaves" }); } });
  doctors.forEach(d=>{ let n=0; monthDays(now.getFullYear(),now.getMonth()).forEach(({date})=>{ if(((nightData[date]||{}).doctors||[]).includes(d.id)) n++; }); if(n>s.capEvening) al.push({ sev:"err", t:`د.${d.name} تجاوز حدّ المناوبات (${n}/${s.capEvening})`, go:"doctors" }); });
  monthDays(now.getFullYear(),now.getMonth()).forEach(({date,di})=>{ const onLv=doctors.filter(d=>onLeave(d,date,leaves)).length; if(onLv>=s.capLeaveDay) al.push({ sev:"warn", t:`تواجد منخفض ${dmy(date)} ${DAYS[di]} — ${onLv} في إجازة`, go:"leaves" }); });
  al.sort((a,b)=>(a.sev==="err"?0:1)-(b.sev==="err"?0:1));
  const SEV = { err:{ fg:C.err, ic:"!", tag:"t-bad", lbl:"عاجل" }, warn:{ fg:C.warn, ic:"~", tag:"t-warn", lbl:"مراجعة" } };
  return <div className="fade">
    <div className="card" style={{ padding:18, marginBottom:16 }}>
      <div className="ctitle">🔔 مركز التنبيهات <span style={{ fontWeight:400, color:C.muted, fontSize:12 }}>({al.length})</span></div>
      <div className="csub" style={{ margin:0 }}>تعارضات · عيادات مكشوفة · حدود · إجازات قادمة</div>
    </div>
    {al.length===0 ? <Empty icon="✅" title="لا تنبيهات" hint="كل شيء متوازن" /> :
      <div className="card" style={{ padding:8 }}>
        {al.map((a,i)=>{ const c=SEV[a.sev]; return (
          <div key={i} className="row" onClick={()=>onGoto(a.go)} style={{ cursor:"pointer" }}>
            <div className="rav" style={{ background:c.fg }}>{c.ic}</div>
            <div style={{ flex:1 }}><div className="nm" style={{ fontSize:13 }}>{a.t}</div></div>
            <span className={"tag "+c.tag}>{c.lbl}</span>
          </div>
        ); })}
      </div>}
  </div>;
}

function ReportsPage({ doctors, leaves, nightData, coverages, today, fd, settings }) {
  const restRule = settings?.restRule!==false;
  const [scope,setScope] = useState("month");
  const [monthsN,setMonthsN] = useState(2);
  const [ref,setRef]     = useState(today);
  const [sel,setSel]     = useState("all");
  const [rangeFrom,setRangeFrom] = useState(today);
  const [rangeTo,setRangeTo] = useState(today);
  const [gridYear,setGridYear] = useState(new Date(today).getFullYear());
  const [gridMonths,setGridMonths] = useState(()=>new Set([new Date(today).getMonth()]));
  const toggleGridMonth = m => setGridMonths(s=>{ const n=new Set(s); n.has(m)?n.delete(m):n.add(m); return n; });
  const weekDatesOf = r => { const t=new Date(r); const sun=new Date(t); sun.setDate(t.getDate()-t.getDay()); const out=[]; for(let i=0;i<5;i++){ const dd=new Date(sun); dd.setDate(sun.getDate()+i); out.push(dd.toISOString().split("T")[0]); } return out; };
  const rd = new Date(ref);
  const multiRange = (()=>{ const Y=rd.getFullYear(), M=rd.getMonth(); const startAbs=Y*12+M-(monthsN-1); const startY=Math.floor(startAbs/12), startM=((startAbs%12)+12)%12; const dts=[]; for(let i=0;i<monthsN;i++){ const abs=startAbs+i; const yy=Math.floor(abs/12), mm=((abs%12)+12)%12; dts.push(...monthDays(yy,mm).map(x=>x.date)); } return { dates:dts, startY, startM }; })();
  const rangeDates = (()=>{ const out=[]; const s=new Date(rangeFrom), e=new Date(rangeTo); if(e>=s){ for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)) out.push(d.toISOString().split("T")[0]); } return out; })();
  const gridDates = (()=>{ const ms=[...gridMonths].sort((a,b)=>a-b); return ms.flatMap(m=>monthDays(gridYear,m).map(x=>x.date)); })();
  const dates = scope==="week" ? weekDatesOf(ref) : scope==="month" ? monthDays(rd.getFullYear(), rd.getMonth()).map(x=>x.date) : scope==="range" ? rangeDates : scope==="grid" ? gridDates : multiRange.dates;
  const label = scope==="week" ? `أسبوع ${dmy(dates[0])} – ${dmy(dates[dates.length-1])}` : scope==="month" ? `${MONTHS[rd.getMonth()]} ${rd.getFullYear()}` : scope==="range" ? `${dmy(rangeFrom)} ← ${dmy(rangeTo)}` : scope==="grid" ? (([...gridMonths].length ? [...gridMonths].sort((a,b)=>a-b).map(m=>MONTHS[m]).join("، ") : "لم تُحدَّد أشهر")+` ${gridYear}`) : (monthsN===12 ? `${rd.getFullYear()} (١٢ شهر)` : `${MONTHS[multiRange.startM]} ${multiRange.startY} ← ${MONTHS[rd.getMonth()]} ${rd.getFullYear()}`);
  const nav = dir => { const d=new Date(ref); if(scope==="week") d.setDate(d.getDate()+dir*7); else if(scope==="month") d.setMonth(d.getMonth()+dir); else if(scope==="multi") d.setMonth(d.getMonth()+monthsN*dir); setRef(d.toISOString().split("T")[0]); };
  const slotT = (d,di,p)=>{ const sl=(d.sched?.[di]?.[p])||""; return sl?SLOT_AR[sl]||sl:"—"; };
  const perTxt = p => p==="am"?"عيادة الصباح":p==="pm"?"عيادة الظهر":p==="nextAm"?"عيادة صباح الغد":"العيادة المسائية";
  const covsOf = d => { const out=[]; coverages.filter(c=>c.coverDoctorId===d.id&&dates.includes(c.date)).forEach(c=>out.push({date:c.date,period:c.period,ownerId:c.absentId,reason:c.reason})); dates.forEach(dt=>{ const cv=(nightData[dt]||{}).coverages||{}; ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===d.id) out.push({date:dt,period:sl,ownerId:null,reason:"evening"}); }); }); }); return out.sort((a,b)=>a.date.localeCompare(b.date)); };
  const eveOf = d => dates.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(d.id));
  const lvOf = d => leaves.filter(l=>l.doctorId===d.id && l.start<=dates[dates.length-1] && l.end>=dates[0]);
  const shown = sel==="all" ? doctors : doctors.filter(d=>d.id===+sel);

  const reportCSS = `<style>
    .pb{page-break-before:always}
    .pdoc{padding-top:2px}
    .dhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px;padding-bottom:12px;border-bottom:2px solid #eef3f8}
    .dav{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,${C.primary},${C.eve});color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
    .dnm{font-size:18px;font-weight:800;color:#0d1b2a}
    .dmt{font-size:11.5px;color:#64748b;margin-top:3px}
    .sgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
    .stile{flex:1 1 90px;border-radius:13px;padding:11px 8px;text-align:center;border:1px solid #eef3f8}
    .stile b{font-size:21px;font-weight:800;display:block;line-height:1}
    .stile span{font-size:10.5px;color:#64748b;margin-top:4px;display:block}
    .bdg{padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;display:inline-block}
    .b-eve{background:#ede9fe;color:#6d28d9}.b-norm{background:#e3f5f2;color:${C.primaryD}}
    .cov-c{color:${C.primaryD};font-weight:600}
  </style>`;
  const tile = (v,l,bg,fg)=>`<div class="stile" style="background:${bg}"><b style="color:${fg}">${v}</b><span>${l}</span></div>`;
  const docReportBody = d => {
    const s = doctorSessions(d, dates, nightData, coverages, leaves);
    const cv = covsOf(d); const ev = eveOf(d); const lv = lvOf(d);
    const coveredAway = coverages.filter(c=>c.absentId===d.id && dates.includes(c.date));
    const summary = `<div class="sgrid">
      ${tile(s.care,"الرعاية","#e3f5f2",C.primaryD)}
      ${tile(s.evening,"المسائي","#ede9fe","#6d28d9")}
      ${tile(s.covers,"التغطيات","#e6f6f4","#0b7e77")}
      ${tile(s.support,"الدعم","#eef2f7","#475569")}
      ${tile(lv.length,"إجازات","#fbf1df","#b45309")}
      ${tile(s.total,"إجمالي العمل","#0d1b2a","#ffffff")}
    </div>`;
    const evTbl = ev.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${ev.map(dt=>{ const fixed=(d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td><span class="bdg ${fixed?"b-eve":"b-norm"}">${fixed?"مسائي ثابت":"مسائي / تغطية"}</span></td></tr>`; }).join("")}</tbody></table>`
      : `<p>لا يوجد دوام مسائي في هذه الفترة</p>`;
    const cvTbl = cv.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td class="cov-c" style="text-align:start">تم تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} بـ <b>د.${d.name}</b> بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`
      : `<p>لا توجد تغطيات في هذه الفترة</p>`;
    const schedTbl = `<table><thead><tr><th>اليوم</th><th>صباح (٠٨:٠٠–١٢:٠٠)</th><th>ظهر (١٣:٠٠–١٦:٠٠)</th><th>مساء (١٦:٠٠–٢٣:٠٠)</th></tr></thead><tbody>${DAYS.map((dn,di)=>`<tr><td style="font-weight:700;background:#f4f8fb;color:${C.primaryD}">${dn}</td><td>${SLOT_AR[(d.sched?.[di]?.am)||""]||"—"}</td><td>${SLOT_AR[(d.sched?.[di]?.pm)||""]||"—"}</td><td>${((d.sched?.[di]?.eve)||(d.nightDays||[]).includes(di))?"🌙 مسائي ثابت":"—"}</td></tr>`).join("")}</tbody></table>`;
    const awayTbl = coveredAway.length
      ? `<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>من قام بتغطيته</th></tr></thead><tbody>${coveredAway.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تمت تغطية ${perFull(c.period)} الخاصة به بـ <b>د.${fd(c.coverDoctorId)?.name||"—"}</b> بسبب ${coverReasonAr(d.id,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`
      : `<p>لم تُغطَّ عيادته من قِبل أحد في هذه الفترة</p>`;
    const lvTbl = lv.length
      ? `<table><thead><tr><th style="width:150px">من</th><th style="width:150px">إلى</th><th>النوع</th><th>العيادة</th></tr></thead><tbody>${lv.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(l=>`<tr><td style="font-weight:600">${dmyFull(l.start)}</td><td style="font-weight:600">${dmyFull(l.end)}</td><td>${LEAVE_AR[l.type]||"إجازة"}</td><td>${l.clinicClosed?"مغلقة":"تُغطّى"}</td></tr>`).join("")}</tbody></table>`
      : `<p>لا إجازات في هذه الفترة</p>`;
    return `<div class="dhead"><span class="dav">${sn(d.name).slice(0,2)}</span><div><div class="dnm">د.${d.name}</div><div class="dmt">${rankLabel(rankOf(d))} · ${posLabel(d.adminPosition,d)} · ${label}</div></div></div>
      ${summary}
      <h2>🏥 الجدول الأسبوعي الثابت</h2>${schedTbl}
      <h2>🌙 الدوام المسائي (${ev.length})</h2>${evTbl}
      <h2>🩹 من قام بتغطيته (${coveredAway.length})</h2>${awayTbl}
      <h2>🔄 تغطياته لزملائه (${cv.length})</h2>${cvTbl}
      <h2>🏖 إجازاته (${lv.length})</h2>${lvTbl}`;
  };
  const printDoctor = d => printDoc(`تقرير — د.${d.name} (${label})`, reportCSS+`<div class="pdoc">${docReportBody(d)}</div>`, false);
  const printAll = () => { if(!shown.length) return; printDoc(`تقرير الأطباء — ${label}`, reportCSS+shown.map((d,i)=>`<div class="pdoc ${i>0?"pb":""}">${docReportBody(d)}</div>`).join(""), false); };
  const printDepartment = () => {
    const gaps=[], conflicts=[];
    dates.forEach(dt=>{ const r=analyzeDay(dt,doctors,leaves,nightData,coverages,null,restRule); (r.gaps||[]).forEach(g=>gaps.push({ date:dt, di:(g.di!=null?g.di:new Date(dt).getDay()), ownerId:g.ownerId, period:g.period, reason:g.reason||"" })); (r.conflicts||[]).forEach(c=>conflicts.push({ date:dt, text:c.text||c.reason||"تعارض" })); });
    gaps.sort((a,b)=>a.date.localeCompare(b.date));
    const issueCSS = `<style>.alert{border-radius:14px;padding:14px 16px;margin-bottom:14px}.alert.bad{background:#fef2f2;border:1px solid #fecaca}.alert.ok{background:#ecfdf5;border:1px solid #bbf7d0}.alert h2{margin:0 0 8px;border:none;padding:0}.alert.bad h2{color:#b91c1c}.alert.bad h2::before{background:#ef4444}.alert.ok h2{color:#15803d}.alert.ok h2::before{background:#16a34a}.wsched td.s{background:#f4f8fb;font-weight:700;color:${C.primaryD}}</style>`;
    const gapRows = gaps.map(g=>`<tr><td>${dmy(g.date)}</td><td>${DAYS[g.di]||""}</td><td style="font-weight:700">د.${fd(g.ownerId)?.name||"—"}</td><td>${perTxt(g.period)}</td><td style="text-align:start">${g.reason}</td></tr>`).join("");
    const confRows = conflicts.map(c=>`<tr><td>${dmy(c.date)}</td><td style="text-align:start">${c.text}</td></tr>`).join("");
    const review = (gaps.length||conflicts.length)
      ? `<div class="alert bad"><h2>⚠️ يحتاج مراجعة — عيادات مكشوفة (${gaps.length}) · تعارضات (${conflicts.length})</h2>${gaps.length?`<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الطبيب صاحب العيادة</th><th>الفترة</th><th>السبب</th></tr></thead><tbody>${gapRows}</tbody></table>`:""}${conflicts.length?`<table style="margin-top:10px"><thead><tr><th>التاريخ</th><th>وصف التعارض</th></tr></thead><tbody>${confRows}</tbody></table>`:""}</div>`
      : `<div class="alert ok"><h2>✅ لا عيادات مكشوفة ولا تعارضات خلال ${label}</h2></div>`;
    const docs = doctors.map(d=>{
      const sx=doctorSessions(d,dates,nightData,coverages,leaves); const ev=eveOf(d); const cv=covsOf(d); const lv=lvOf(d);
      const sched = DAYS.map((dn,di)=>`<tr><td class="s">${dn}</td><td>${SLOT_AR[(d.sched?.[di]?.am)||""]||"—"}</td><td>${SLOT_AR[(d.sched?.[di]?.pm)||""]||"—"}</td><td>${((d.sched?.[di]?.eve)||(d.nightDays||[]).includes(di))?"🌙 مسائي ثابت":"—"}</td></tr>`).join("");
      const evTbl = ev.length?`<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>النوع</th></tr></thead><tbody>${ev.map(dt=>{ const fixed=(d.nightDays||[]).includes(dayIdx(dt)); return `<tr><td style="font-weight:600">${dmyFull(dt)}</td><td>${fixed?"مسائي ثابت":"مسائي / تغطية"}</td></tr>`; }).join("")}</tbody></table>`:`<p>لا يوجد</p>`;
      const cvTbl = cv.length?`<table><thead><tr><th style="width:200px">اليوم والتاريخ</th><th>تفاصيل التغطية</th></tr></thead><tbody>${cv.map(c=>`<tr><td style="font-weight:600">${dmyFull(c.date)}</td><td style="text-align:start">تم تغطية ${perFull(c.period)} لـ ${c.ownerId?("د."+(fd(c.ownerId)?.name||"—")):"طبيب المسائي"} بـ <b>د.${d.name}</b> بسبب ${coverReasonAr(c.ownerId,c.date,c.reason,leaves)}</td></tr>`).join("")}</tbody></table>`:`<p>لا يوجد</p>`;
      const lvTbl = lv.length?`<table><thead><tr><th>من</th><th>إلى</th></tr></thead><tbody>${lv.map(l=>`<tr><td>${dmy(l.start)}</td><td>${dmy(l.end)}</td></tr>`).join("")}</tbody></table>`:`<p>لا يوجد</p>`;

    }).join("");
    printDoc(`مراجعة جدول القسم الشامل — ${label}`, reportCSS+issueCSS+review+docs, false);
  };

  // ════════ تقارير مركّزة: عدد المناوبات / عدد التغطيات — بكل الأيام، لطبيب معيّن أو كامل القسم ════════
  const focusCSS = `<style>
    .sumbar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
    .sumtile{flex:1 1 100px;border-radius:13px;padding:12px 8px;text-align:center;border:1px solid #eef3f8;background:#f4f8fb}
    .sumtile b{font-size:22px;font-weight:800;display:block;color:${C.primaryD};line-height:1}
    .sumtile span{font-size:10.5px;color:#64748b;margin-top:4px;display:block}
    .totrow td{background:#0d1b2a;color:#fff;font-weight:800}
  </style>`;
  const printEveningReport = () => {
    const perDoctorRows = shown.map(d=>{
      const ev = eveOf(d);

      const extraN = ev.length - fixedN;
      return { d, ev, fixedN, extraN };
