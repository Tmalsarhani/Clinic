<style>
  :root{
    --primary:#0f766e; --primary-d:#115e59; --accent:#14b8a6;
    --bg:#f4f7fa; --card:#ffffff; --line:#e7eef4; --line2:#eef3f8;
    --text:#2b3a4a; --sub:#64748b; --muted:#98a6b6;
    --ok:#0f766e; --warn:#b45309; --err:#be123c;
    --shadow:0 1px 2px rgba(16,40,60,.04), 0 6px 20px rgba(16,40,60,.05);
    --shadow-lg:0 10px 30px rgba(16,40,60,.10);
    --r:16px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'IBM Plex Sans Arabic','Tajawal',Tahoma,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  #root{ min-height:100vh; }
  .loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--sub); direction:rtl; font-size:15px; font-family:'IBM Plex Sans Arabic',Tahoma; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#cdd9e3; border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:#aebccb; }
  button,input,select,textarea{ font-family:inherit; }
  button{ transition:all .15s ease; cursor:pointer; }
  button:active{ transform:scale(.98); }
  input,select{ outline:none; }
  input:focus,select:focus{ border-color:var(--accent)!important; box-shadow:0 0 0 3px rgba(20,184,166,.12); }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .fade{ animation:fade .25s ease; }
  /* ── full web layout ── */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:250px; flex-shrink:0; background:#fff; border-left:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 14px; }
  .brand{ display:flex; align-items:center; gap:11px; padding:6px 10px 20px; }
  .navbtn{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; border:none; background:none; font-size:14.5px; font-weight:600; color:var(--sub); cursor:pointer; text-align:start; width:100%; margin-bottom:3px; }
  .navbtn .ic{ font-size:18px; width:22px; text-align:center; }
  .navbtn.active{ background:#ecfdf5; color:var(--primary); }
  .navbtn:not(.active):hover{ background:#f3f6f9; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ background:#fff; border-bottom:1px solid var(--line); padding:15px 28px; position:sticky; top:0; z-index:40; }
  .topbar h1{ margin:0; font-size:18px; font-weight:700; }
  .topbar p{ margin:2px 0 0; font-size:12.5px; color:var(--sub); }
  .content{ padding:26px 28px; max-width:1160px; width:100%; margin:0 auto; }
  .bottomnav{ display:none; }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px; align-items:start; }
  @media (max-width:880px){
    .sidebar{ display:none; }
    .bottomnav{ display:flex; position:fixed; bottom:0; inset-inline:0; background:#fff; border-top:1px solid var(--line); z-index:50; box-shadow:0 -2px 12px rgba(16,40,60,.05); }
    .content{ padding:16px 15px 86px; }
    .topbar{ padding:13px 16px; }
    .grid-cards{ grid-template-columns:1fr; }
  }

   sched:{0:{am:"",pm:""},1:{am:"clinic_am",pm:""},2:{am:"",pm:""},3:{am:"clinic_am",pm:""},4:{am:"",pm:""}}},
  {id:18, name:"د.ضياد النقيمش",    color:"#fb7185", nightDays:[], email:"",
   sched:{0:{am:"",pm:""},1:{am:"",pm:""},2:{am:"",pm:"clinic_pm"},3:{am:"",pm:""},4:{am:"",pm:""}}},
  {id:19, name:"د.بثينه الغانم",    color:"#a3e635", nightDays:[], email:"",
   sched:{0:{am:"clinic_am",pm:""},1:{am:"clinic_am",pm:""},2:{am:"clinic_am",pm:""},3:{am:"clinic_am",pm:""},4:{am:"clinic_am",pm:""}}},
  {id:20, name:"د. الفرحان",        color:"#fdba74", nightDays:[], email:"",
   sched:{0:{am:"",pm:"clinic_pm"},1:{am:"",pm:"clinic_pm"},2:{am:"",pm:"clinic_pm"},3:{am:"",pm:"clinic_pm"},4:{am:"",pm:"clinic_pm"}}},
  {id:21, name:"د.ثائره المهناء",   color:"#67e8f9", nightDays:[], email:"",
   sched:{0:{am:"clinic_am",pm:""},1:{am:"",pm:""},2:{am:"clinic_am",pm:""},3:{am:"clinic_am",pm:""},4:{am:"",pm:"clinic_pm"}}},
];

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
const isClinic = t => t === "clinic_am" || t === "clinic_pm" || t === "clinic";
const getSlot  = (doc, di, p) => doc?.sched?.[di]?.[p] || "";
const sn       = n => n.replace("د.","").replace("د ","").trim().slice(0,5);
const wSlots   = doc => {
  let count = 0;
  Object.values(doc.sched||{}).forEach(d => {
    if (d.am && d.am !== "") count += 1;
    if (d.pm && d.pm !== "") count += 1;
  });
  // Evening clinic counts as 2 periods per fixed evening day
  const eveDays = Array.isArray(doc.nightDays) ? doc.nightDays.length : (doc.nightDay !== null && doc.nightDay !== undefined ? 1 : 0);
  count += eveDays * 2;
  return count;
};
const onLeave  = (doc, date, leaves) => !date||!doc ? false : leaves.some(l=>l.doctorId===doc.id&&l.start<=date&&date<=l.end);
// True if doctor is on a leave that CLOSES the clinic on that date (no coverage needed)
const clinicClosedOnLeave = (doc, date, leaves) => !date||!doc ? false : (leaves||[]).some(l=>l.doctorId===doc.id && l.start<=date && date<=l.end && l.clinicClosed!==false);

const dayIdx = dateStr => {
  const d = new Date(dateStr);
  const map = {0:0,1:1,2:2,3:3,4:4}; // Sun=0..Thu=4
  const wd = d.getDay();
  return wd >= 5 ? -1 : wd;
};

const nextWork = dateStr => {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+1);
  while(d.getDay()>=5) d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
};

const fmtDate = dateStr => {
  const d = new Date(dateStr);
  return `${d.getDate()}/${d.getMonth()+1}`;
};

const needsCoverage = (doc, di) => ({
  am: isClinic(getSlot(doc, di, "am")),
  pm: isClinic(getSlot(doc, di, "pm")),
});

function getAvailable(doctors, excludeIds, di, date, period, leaves, nightData, coverageData, allCoverages) {
  // Doctors who are night doctors on THIS date (busy that evening / next morning)
  const nightDocIds = nightData[date]?.doctors || [];
  // Doctors already assigned to the SAME coverage slot
  const covDocIds = (coverageData[date]?.[period] || []);

  // Doctors busy covering ANY slot in nightData that maps to the SAME real time
  // same_am/same_pm -> on `date`; next_am -> on nextWork(date) morning
  const busyCovering = new Set();
  Object.entries(nightData).forEach(([d, nd]) => {
    const covs = nd.coverages || {};
    // covering same-day morning on `date`
    if (d === date && period === "am") (covs.am||[]).forEach(id => busyCovering.add(id));
    if (d === date && period === "pm") (covs.pm||[]).forEach(id => busyCovering.add(id));
    // a next_am coverage assigned on day `d` actually happens on nextWork(d) morning
    if (period === "am" && nextWork(d) === date) (covs.nextAm||[]).forEach(id => busyCovering.add(id));
    // a same-day coverage might coincide with someone's next_am target — already handled above
  });

  // Individual coverages at same date+period
  (allCoverages || []).forEach(c => {
    if (c.date === date && c.period === period) busyCovering.add(c.coverDoctorId);
  });

  const allExclude = [...new Set([...excludeIds, ...nightDocIds, ...covDocIds, ...busyCovering])];
  return doctors
    .filter(d => !allExclude.includes(d.id))
    .map(d => {
      if (onLeave(d, date, leaves)) return { doc: d, status: "leave" };
      const slot = getSlot(d, di, period);
      if (slot === "") return { doc: d, status: "free" };
      if (["admin","training","committee"].includes(slot)) return { doc: d, status: "warn", conflict: slot };
      return { doc: d, status: "busy" };
    })
    .filter(x => x.status !== "busy")
    .sort((a,b) => ({free:0,warn:1,leave:2}[a.status] - {free:0,warn:1,leave:2}[b.status]));
}

function autoFill(year, month, doctors, leaves, nightData) {
  const result = { ...nightData };
  const dim = new Date(year, month+1, 0).getDate();
  const hasNight = d => Array.isArray(d.nightDays) && d.nightDays.length > 0;
  const fd = id => doctors.find(d => d.id === id);
  const fixed = doctors.filter(hasNight);
  const rotate = doctors.filter(d => !hasNight(d));
  const usage = {}; // how many evening shifts each doctor has this month

  // STEP 0: purge any doctor who is on leave from existing assignments
  Object.keys(result).forEach(date => {
    const nd = result[date];
    if (!nd?.doctors?.length) return;
    const kept = nd.doctors.filter(id => { const d = fd(id); return d && !onLeave(d, date, leaves); });
    result[date] = { ...nd, doctors: kept };
  });

  // Count existing usage for ROTATE doctors only (fixed don't count toward fairness)
  Object.values(result).forEach(nd => (nd.doctors||[]).forEach(id => { if(rotate.find(r=>r.id===id)) usage[id] = (usage[id]||0)+1; }));
  rotate.forEach(d => { if(usage[d.id]==null) usage[d.id]=0; });

  for (let day = 1; day <= dim; day++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const di = dayIdx(date);
    if (di < 0) continue;
    const existing = result[date]?.doctors || [];
    // how many evening clinics does this day need? (per-day setting, default 1)
    const need = result[date]?.eveningSlots || 1;

    // Fixed doctors for this weekday always go in
    const fixedDocs = fixed.filter(d => d.nightDays.includes(di) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di));
    const chosen = [...new Set([...existing, ...fixedDocs.map(d=>d.id)])];

    // Fill remaining slots with rotate doctors — FAIRNESS FIRST
    const nextDi = dayIdx(nextWork(date));
    const coverageNeed = d => (isClinic(getSlot(d,di,"am"))?1:0) + (isClinic(getSlot(d,di,"pm"))?1:0) + (isClinic(getSlot(d,nextDi,"am"))?1:0);
    const prevWork = (() => { const dt=new Date(date); do { dt.setDate(dt.getDate()-1); } while(dt.getDay()>=5); return dt.toISOString().split("T")[0]; })();
    const workedYesterday = d => (result[prevWork]?.doctors||[]).includes(d.id);

    while (chosen.length < need) {
      const avail = rotate.filter(d => !chosen.includes(d.id) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di))
        .sort((a,b) => {
          // PRIORITY 1: FAIRNESS — least evening shifts this month comes first
          const ua = usage[a.id]||0, ub = usage[b.id]||0;
          if (ua !== ub) return ua - ub;
          // PRIORITY 2: avoid consecutive (worked previous work day)
          const wa = workedYesterday(a)?1:0, wb = workedYesterday(b)?1:0;
          if (wa !== wb) return wa - wb;
          // PRIORITY 3: prefer doctors needing less coverage (fewer clinics to cover)
          return coverageNeed(a) - coverageNeed(b);
        });
      if (!avail.length) break;
      chosen.push(avail[0].id);
      usage[avail[0].id] = (usage[avail[0].id]||0) + 1;
    }

    if (chosen.length) {
      result[date] = { ...(result[date]||{}), doctors: chosen, coverages: result[date]?.coverages || { am: [], pm: [], nextAm: [] }, eveningSlots: need };
    }
  }
  return result;
}

// Detect conflicts: doctor on leave but assigned night/coverage, or double-booked same time
function detectConflicts(doctors, leaves, nightData, coverages) {
  const fd = id => doctors.find(d=>d.id===id);
  const conflicts = [];
  // 1. Night doctor on leave
  Object.entries(nightData).forEach(([date,nd])=>{
    (nd.doctors||[]).forEach(id=>{
      const d = fd(id); if(!d) return;
      if (onLeave(d, date, leaves)) conflicts.push({ type:"leave", date, text:`${d.name} له دوام مسائي يوم ${date} لكنه في إجازة` });
    });
    // coverage doctor on leave
    const covs = nd.coverages||{};
    ["am","pm","nextAm"].forEach(slot=>{
      (covs[slot]||[]).forEach(id=>{
        const d = fd(id); if(!d) return;
        const covDate = slot==="nextAm" ? nextWork(date) : date;
        if (onLeave(d, covDate, leaves)) conflicts.push({ type:"leave", date:covDate, text:`${d.name} يغطّي يوم ${covDate} لكنه في إجازة` });
      });
    });
  });
  // 2. Individual coverage doctor on leave
  (coverages||[]).forEach(c=>{
    const d = fd(c.coverDoctorId); if(!d) return;
    if (onLeave(d, c.date, leaves)) conflicts.push({ type:"leave", date:c.date, text:`${d.name} يغطّي (فردي) يوم ${c.date} لكنه في إجازة` });
  });
  // 3. Double-booked: same doctor covering 2 things same real period
  const slotKey = (date, period) => `${date}__${period}`;
  const booking = {}; // key -> [names]
  const addBooking = (date, period, id, label) => {
    const d = fd(id); if(!d) return;
    const k = slotKey(date, period);
    if(!booking[k]) booking[k] = [];
    if (booking[k].find(x=>x.id===id)) {
      conflicts.push({ type:"double", date, text:`${d.name} مسجّل مرتين في ${period==="am"?"صباح":"ظهر"} ${date}` });
    }
    booking[k].push({ id, label });
  };
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (covs.am||[]).forEach(id=>addBooking(date,"am",id));
    (covs.pm||[]).forEach(id=>addBooking(date,"pm",id));
    (covs.nextAm||[]).forEach(id=>addBooking(nextWork(date),"am",id));
  });
  (coverages||[]).forEach(c=>addBooking(c.date, c.period, c.coverDoctorId));

  // 4. Same clinic period covered TWICE: night-schedule coverage + individual coverage for same absent doctor
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (nd.doctors||[]).forEach(nightId=>{
      ["am","pm"].forEach(slot=>{
        const nightCovered = (covs[slot]||[]).length > 0;
        // individual coverage for the SAME night doctor, same date, same period
        const indiv = (coverages||[]).filter(c=>c.date===date && c.period===slot && c.absentId===nightId);
        if (nightCovered && indiv.length) {
          const nm = fd(nightId)?.name||"";
          conflicts.push({ type:"double", date, text:`عيادة ${nm} (${slot==="am"?"صباح":"ظهر"}) ${date} مُغطّاة مرتين: مرة في جدول الدوام ومرة بتغطية فردية` });
        }
      });
    });
  });
  // 5. Absent doctor (individual coverage) is themselves assigned a duty same day
  // Helper: find the previous workday's date string (whose nextAm coverage lands on `date`)
  const prevWorkOf = (dateStr) => {
    const d = new Date(dateStr);
    for (let i=1;i<=4;i++){
      const p = new Date(d); p.setDate(d.getDate()-i);
      const wd = p.getDay(); // 0=Sun..6=Sat ; skip Fri(5),Sat(6)
      if (wd!==5 && wd!==6) return `${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`;
    }
    return null;
  };
  (coverages||[]).forEach(c=>{
    if (!c.absentId) return;
    const absId = c.absentId;
    const nm = fd(absId)?.name||"";
    // a) assigned as a cover doctor in another individual coverage same date
    const asCover = (coverages||[]).some(o=>o.date===c.date && o.coverDoctorId===absId);
    // b) assigned in night-schedule coverage same date (am/pm of today)
    const nd = nightData[c.date]||{}; const cv = nd.coverages||{};
    const inTodayCov = [...(cv.am||[]),...(cv.pm||[])].includes(absId);
    // b2) assigned to cover "tomorrow morning" from the PREVIOUS workday's record (lands on c.date)
    const pw = prevWorkOf(c.date);
    const prevNd = pw ? (nightData[pw]||{}) : {};
    const inNextAmCov = ((prevNd.coverages||{}).nextAm||[]).includes(absId);
    // c) has a night shift same date
    const hasNight = (nd.doctors||[]).includes(absId);
    if (asCover || inTodayCov || inNextAmCov || hasNight) {
      conflicts.push({ type:"absent-busy", date:c.date, text:`${nm} مسجّل غائباً يوم ${c.date} لكنه مكلّف بتغطية/دوام نفس اليوم — راجع التكليف` });
    }
  });
  return conflicts;
}

// ══════════════════════════════════════════════════════
// UNIFIED ENGINE — single source of truth for a day
// For each real working period (am, pm) it computes:
//   - clinics that must be staffed (each doctor with a clinic that day)
//   - who is OCCUPIED that period (their own clinic, a coverage duty, an evening shift)
//   - whether each clinic-owner is ABSENT/on-leave (clinic open) → needs a cover
//   - GAPS (uncovered open clinics) + CONFLICTS (double-booked / absent-but-assigned)
//   - SUGGESTIONS (least-loaded free doctors) for each gap
// "evening" = the night shift itself. A doctor's own daytime clinic still needs cover when
//   they take an evening shift OR cover OR are absent (per user rule #1).
// ══════════════════════════════════════════════════════
function analyzeDay(date, doctors, leaves, nightData, coverages, loadMap) {
  const di = dayIdx(date);
  if (di < 0) return { gaps:[], conflicts:[], periods:{} };
  const fd = id => doctors.find(d=>d.id===id);
  const nd = nightData[date] || {};
  const covs = nd.coverages || {};
  const dayIndiv = (coverages||[]).filter(c=>c.date===date);

  // previous workday's nextAm coverage duties land on THIS morning
  const prevWorkOf = (ds) => { const d=new Date(ds); for(let i=1;i<=4;i++){const p=new Date(d);p.setDate(d.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null; };
  const pw = prevWorkOf(date);
  const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];

  // ---- Build occupancy: who is busy each period, and why ----
  // periods we track for staffing: am, pm
  const PERS = ["am","pm"];
  const occupied = { am:{}, pm:{}, evening:{} }; // docId -> reason
  const mark = (per, id, reason) => { if(id==null) return; (occupied[per][id] = occupied[per][id]||[]).push(reason); };

  // evening shift holders (occupied all day effectively for their own daytime clinics)
  (nd.doctors||[]).forEach(id=>mark("evening", id, "دوام مسائي"));

  // each doctor's own clinic occupies them that period (unless their clinic is closed by leave, or they're absent/evening — those make it a GAP not occupancy)
  doctors.forEach(d=>{
    PERS.forEach(per=>{
      if (isClinic(getSlot(d,di,per))) mark(per, d.id, "عيادته");
    });
  });

  // night-schedule coverage duties (am/pm today, + nextAm from prev day lands on am)
  (covs.am||[]).forEach(id=>mark("am", id, "تغطية دوام مسائي"));
  (covs.pm||[]).forEach(id=>mark("pm", id, "تغطية دوام مسائي"));
  prevNextAm.forEach(id=>mark("am", id, "تغطية صباح الغد (من أمس)"));

  // individual coverage duties
  dayIndiv.forEach(c=>{ if(c.period==="am"||c.period==="pm") mark(c.period, c.coverDoctorId, "تغطية فردية"); else if(c.period==="evening") mark("evening", c.coverDoctorId, "تغطية مسائية"); });

  // ---- Determine absence per doctor (individual coverage with absentId, or on-leave) ----
  const absentReason = {}; // docId -> reason string
  dayIndiv.forEach(c=>{ if(c.absentId) absentReason[c.absentId] = "غياب/عذر"; });
  doctors.forEach(d=>{ if(onLeave(d,date,leaves)) absentReason[d.id] = clinicClosedOnLeave(d,date,leaves) ? "إجازة (عيادة مغلقة)" : "إجازة (عيادة قائمة)"; });

  // ---- Compute gaps & conflicts per period ----
  const gaps = [];      // {date,di,period,ownerId,reason}
  const conflicts = []; // {type,date,text}
  const periods = { am:[], pm:[], evening:[] };

  // Doctors busy in the EVENING this day = original night doctors + anyone with an evening individual coverage
  const eveningBusy = new Set([...(nd.doctors||[])]);
  dayIndiv.forEach(c=>{ if(c.period==="evening") eveningBusy.add(c.coverDoctorId); });

  PERS.forEach(per=>{
    // each doctor who HAS a clinic this period
    doctors.forEach(d=>{
      if (!isClinic(getSlot(d,di,per))) return;
      const closed = clinicClosedOnLeave(d,date,leaves);
      // is this clinic owner unavailable to run their own clinic?
      const ownerEvening = eveningBusy.has(d.id);                   // took evening shift OR evening coverage
      const ownerAbsent  = !!absentReason[d.id] && !closed;          // absent/leave-open
      const ownerCovering = (occupied[per][d.id]||[]).some(r=>r.includes("تغطية")); // busy covering elsewhere same period
      const mustCover = (ownerEvening || ownerAbsent || ownerCovering) && !closed;
      // who is assigned to cover THIS owner's clinic this period?
      const coversForOwner = [];
      // individual coverage explicitly targeting this owner+period
      dayIndiv.forEach(c=>{ if(c.period===per && c.absentId===d.id) coversForOwner.push(c.coverDoctorId); });
      // night-schedule coverage: if owner is a night doctor, their am/pm slot is covered by covs[per]
      if ((nd.doctors||[]).includes(d.id)) { const ids = per==="am"?[...(covs.am||[]),...prevNextAm]:(covs.pm||[]); if(ids.length) coversForOwner.push(...ids); }
      if (closed) {
        periods[per].push({ ownerId:d.id, state:"closed" });
        return;
      }
      if (mustCover && coversForOwner.length===0) {
        gaps.push({ date, di, period:per, ownerId:d.id, reason: ownerEvening?"دوام/تغطية مسائية":ownerAbsent?absentReason[d.id]:"مكلّف بتغطية أخرى" });
        periods[per].push({ ownerId:d.id, state:"gap" });
      } else if (mustCover) {
        periods[per].push({ ownerId:d.id, state:"covered", coverIds:coversForOwner });
      } else {
        periods[per].push({ ownerId:d.id, state:"self" }); // runs own clinic
      }
    });

    // CONFLICT: a doctor occupied 2+ ways same period (e.g., own clinic + a coverage duty, or two coverages)
    Object.entries(occupied[per]).forEach(([id,reasons])=>{
      const real = reasons.filter((r,i)=>reasons.indexOf(r)===i);
      // own clinic + covering at same time = conflict (can't be two places)
      const hasOwn = reasons.includes("عيادته");
      const hasCover = reasons.some(r=>r.includes("تغطية"));
      if (hasOwn && hasCover) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} لديه عيادته و مكلّف بتغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
      else if (reasons.length>=2 && reasons.filter(r=>r.includes("تغطية")).length>=2) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} مكلّف بأكثر من تغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
    });
  });

  // CONFLICT: absent doctor still assigned a duty (any period)
  Object.keys(absentReason).forEach(idStr=>{
    const id=+idStr;
    const dutyAm = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const dutyPm = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    const inNight = (nd.doctors||[]).includes(id);
    const dutyEve = inNight || (occupied.evening[id]||[]).some(r=>r.includes("تغطية"));
    if (dutyAm||dutyPm||dutyEve) conflicts.push({ type:"absent-busy", date, docId:id, inNight, text:`${fd(id)?.name||""} غائب/في إجازة يوم ${fmtDate(date)} لكنه مكلّف بتغطية/دوام نفس اليوم` });
  });

  // CONFLICT (RULE: one day = one task): evening-busy doctor also has a daytime coverage duty same day
  eveningBusy.forEach(id=>{
    const amDuty = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const pmDuty = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    if (amDuty||pmDuty) conflicts.push({ type:"evening-plus-cover", date, text:`${fd(id)?.name||""} له دوام/تغطية مسائية ومكلّف بتغطية نهارية نفس اليوم (${fmtDate(date)}) — غير مسموح` });
  });

  // ---- Suggestions for each gap: least-loaded, free that period, not absent, not the owner ----
  gaps.forEach(g=>{
    const busy = new Set(Object.keys(occupied[g.period]).map(Number));
    const cands = doctors.filter(d=>
      d.id!==g.ownerId &&
      !busy.has(d.id) &&
      !absentReason[d.id] &&
      !onLeave(d,date,leaves) &&
      !(d.blockedDays||[]).includes(g.di)
    );
    cands.sort((a,b)=>((loadMap&&loadMap[a.id])||0)-((loadMap&&loadMap[b.id])||0));
    g.suggestions = cands.slice(0,3).map(d=>d.id);
  });

  return { gaps, conflicts, periods, occupied, absentReason };
}

// Rank reference (expected work periods per week-cycle): consultant=8, specialist=9
const RANK_REF = { consultant:8, specialist:9 };

// ─── CAPP 001 Physician Job Planning: Supportive Sessions (SS) by admin position ───
// Week = 10 sessions. Direct (CCS) target = 10 - SS. (Hospitals column, Appendix 2)
const POS_SS = { head:3, chairperson:4, director:6 };
const POS_LABEL = { none:"بلا منصب إداري", head:"رئيس وحدة / قسم فرعي", chairperson:"رئيس قسم", director:"مدير" };
// العبء الوظيفي = هدف فترات الرعاية المباشرة أسبوعياً
const directTarget = doc => {
  const p = doc?.adminPosition || "none";
  if (p !== "none" && POS_SS[p] != null) return 10 - POS_SS[p];
  return RANK_REF[rankOf(doc)] || 9;
};
const ssTarget = doc => 10 - directTarget(doc);

// الفترات التي تُحسب Direct (رعاية مباشرة) — التدريب معتمد Direct بقرار القسم
const DIRECT_SLOTS = ["clinic","clinic_am","clinic_pm","virtual","audit","training"];
// previous working day (Sun–Thu) before a given date
const prevWorkDay = ds => { const dd=new Date(ds); for(let i=1;i<=4;i++){ const p=new Date(dd); p.setDate(dd.getDate()-i); if(p.getDay()!==5&&p.getDay()!==6) return `${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`; } return null; };

// فترات العمل الفعلية للطبيب عبر مجموعة تواريخ → {direct, supportive}
// القاعدة: عيادته المُغطّاة عنه تُلغى منه وتُنسب لمن غطّاها · مسائي = 2 Direct · تغطية = 1 Direct
function doctorSessions(doctor, dates, nightData, coverages, leaves) {
  let direct = 0, supportive = 0;
  if (!doctor) return { direct, supportive };
  (dates||[]).forEach(date => {
    const di = dayIdx(date); if (di < 0) return;
    const nd = nightData[date] || {}; const c = nd.coverages || {};
    const isEve = (nd.doctors||[]).includes(doctor.id);
    const onLv = onLeave(doctor, date, leaves||[]);
    const pw = prevWorkDay(date);
    const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm || []) : [];
    const dind = (coverages||[]).filter(x => x.date === date);
    if (isEve) {
      direct += 2;                         // دوام مسائي: عيادته النهارية تُغطّى وتنتقل للمُغطّي
    } else if (!onLv) {
      ["am","pm"].forEach(per => {
        const slot = getSlot(doctor, di, per);
        if (DIRECT_SLOTS.includes(slot)) {
          const indCov = dind.some(x => x.period===per && x.absentId===doctor.id);
          if (!indCov) direct += 1;        // حضرها بنفسه (لم تُغطَّ)
        } else if (slot === "admin" || slot === "") {
          supportive += 1;                 // إداري / فراغ
        }
      });
    }
    // تغطيات يؤدّيها لزملاء = +1 Direct لكل واحدة
    (c.am||[]).forEach(id => { if (id===doctor.id) direct += 1; });
    (c.pm||[]).forEach(id => { if (id===doctor.id) direct += 1; });
    prevNextAm.forEach(id => { if (id===doctor.id) direct += 1; });
    dind.forEach(x => { if (x.coverDoctorId===doctor.id) direct += 1; });
  });
  return { direct, supportive };
}

// Workload per doctor for a month, by ACTUAL worked periods.
// Rules: each worked period = 1; empty period = 0; evening shift = 2; coverage performed = 1.
// A doctor's own clinic period is NOT counted if it was covered by someone else, or the doctor is absent/on-leave.
function computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves) {
  const load = {}; doctors.forEach(d=>load[d.id]=0);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const fd = id => doctors.find(x=>x.id===id);

  // collect all working dates in the month (from nightData + coverages + every weekday with clinics)
  const dates = new Set();
  Object.keys(nightData||{}).forEach(d=>{ if(inM(d)) dates.add(d); });
  (coverages||[]).forEach(c=>{ if(inM(c.date)) dates.add(c.date); });
  // also include all weekdays of the month so own-clinic periods are counted even with no night/coverage
  const dim = new Date(year, monthIdx+1, 0).getDate();
  for(let d=1; d<=dim; d++){ const ds=`${year}-${String(monthIdx+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayIdx(ds)>=0) dates.add(ds); }

  dates.forEach(date=>{
    const di = dayIdx(date); if(di<0) return;
    const nd = nightData[date]||{}; const covs = nd.coverages||{};
    const prevWorkOf = (ds)=>{const dd=new Date(ds);for(let i=1;i<=4;i++){const p=new Date(dd);p.setDate(dd.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null;};
    const pw = prevWorkOf(date);
    const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];
    const dayIndiv = (coverages||[]).filter(c=>c.date===date);

    // 1) evening shift = +2
    (nd.doctors||[]).forEach(id=>{ load[id]=(load[id]||0)+2; });

    // 2) own clinic periods actually worked
    doctors.forEach(d=>{
      ["am","pm"].forEach(per=>{
        if (!isClinic(getSlot(d,di,per))) return; // empty/admin/etc → 0
        // is this period covered by someone else, or doctor unavailable?
        const onLv = onLeave(d,date,leaves||[]);
        const isEvening = (nd.doctors||[]).includes(d.id);
        const indivCoveredForThis = dayIndiv.some(c=>c.period===per && c.absentId===d.id);
        const nightCoveredForThis = isEvening && (per==="am" ? [...(covs.am||[]),...prevNextAm].length>0 : (covs.pm||[]).length>0);
        const coveredElsewhere = onLv || indivCoveredForThis || nightCoveredForThis;
        if (!coveredElsewhere) load[d.id]=(load[d.id]||0)+1; // worked own clinic
      });
    });

    // 3) coverage duties performed = +1 each
    (covs.am||[]).forEach(id=>load[id]=(load[id]||0)+1);
    (covs.pm||[]).forEach(id=>load[id]=(load[id]||0)+1);
    prevNextAm.forEach(id=>load[id]=(load[id]||0)+1);
    dayIndiv.forEach(c=>{ load[c.coverDoctorId]=(load[c.coverDoctorId]||0)+1; });
  });
  return load;
}

// Given a load map, return a function that labels a doctor's load relative to peers
function makeLoadLabeler(loadMap) {
  const vals = Object.values(loadMap||{}).filter(v=>v>0).sort((a,b)=>a-b);
  if (!vals.length) return () => ({ icon:"⚪", text:"—", val:0 });
  const lo = vals[Math.floor(vals.length/3)] || vals[0];
  const hi = vals[Math.floor(vals.length*2/3)] || vals[vals.length-1];
  return (id) => {
    const v = loadMap[id]||0;
    if (v===0) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v<=lo) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v>=hi) return { icon:"🔴", text:"الأكثر عبئاً", val:v };
    return { icon:"🟡", text:"متوسط", val:v };
  };
}

// Analyze every filled day in a month → aggregate gaps + conflicts
function analyzeMonth(year, monthIdx, doctors, leaves, nightData, coverages) {
  const load = computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const allGaps=[], allConflicts=[];
  const dates = new Set([...Object.keys(nightData||{}), ...(coverages||[]).map(c=>c.date)].filter(inM));
  [...dates].sort().forEach(date=>{
    const r = analyzeDay(date, doctors, leaves, nightData, coverages, load);
    allGaps.push(...r.gaps); allConflicts.push(...r.conflicts);
  });
  return { gaps:allGaps, conflicts:allConflicts, load };
}

  const stats = [

  const alerts = [];
  ana.conflicts.forEach(c=>alerts.push({ sev:"err", t:c.text, go:"engine" }));
  ana.gaps.forEach(g=>alerts.push({ sev:"warn", t:`عيادة د.${fd(g.ownerId)?.name||""} (${perAr(g.period)}) ${dmy(g.date)} تحتاج تغطية`, go:"engine" }));
  leaves.forEach(l=>{ const du=Math.round((new Date(l.start)-new Date(today))/864e5); if(du>0&&du<=3){ const d=fd(l.doctorId); if(d) alerts.push({ sev:"warn", t:`إجازة د.${d.name} تبدأ بعد ${du} ${du===1?"يوم":"أيام"}`, go:"leaves" }); } });
  doctors.forEach(d=>{ const has=[0,1,2,3,4].some(di=>getSlot(d,di,"am")||getSlot(d,di,"pm")); if(!has) alerts.push({ sev:"warn", t:`د.${d.name} بلا جدول عيادات`, go:"doctors" }); });
  doctors.forEach(d=>{ let n=0; monthDays(now.getFullYear(),now.getMonth()).forEach(({date})=>{ if(((nightData[date]||{}).doctors||[]).includes(d.id)) n++; }); if(n>CAP_EVENING) alerts.push({ sev:"err", t:`د.${d.name} تجاوز حدّ المناوبات (${n}/${CAP_EVENING})`, go:"doctors" }); });
  monthDays(now.getFullYear(),now.getMonth()).forEach(({date,di})=>{ const onLv=doctors.filter(d=>onLeave(d,date,leaves)).length; if(onLv>=CAP_LEAVE_DAY) alerts.push({ sev:"warn", t:`تواجد منخفض ${dmy(date)} ${DAYS[di]} — ${onLv} في إجازة`, go:"leaves" }); });
  alerts.sort((a,b)=>(a.sev==="err"?0:1)-(b.sev==="err"?0:1));

  return <div className="fade">
    <div style={{ ...card(), padding:"20px 22px", marginBottom:16, background:"linear-gradient(135deg,#0f766e,#0e7490)", color:"#fff", border:"none" }}>
      <div style={{ fontSize:13, opacity:.85 }}>{MONTHS[now.getMonth()]} {now.getFullYear()}</div>
      <div style={{ fontSize:21, fontWeight:700, marginTop:2 }}>نظرة عامة على القسم</div>
    </div>
    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(96px,1fr))", gap:10, marginBottom:18 }}>
      {stats.map(s=>(
        <div key={s.k} onClick={()=>onGoto(s.go)} style={{ ...card(), padding:"14px 12px", cursor:"pointer", textAlign:"center" }}>
          <div style={{ fontSize:26, fontWeight:800, color:s.c, lineHeight:1 }}>{s.v}</div>
          <div style={{ fontSize:11.5, color:C.sub, marginTop:5 }}>{s.k}</div>
        </div>
      ))}
    </div>
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontSize:14, fontWeight:700, marginBottom:4 }}>التنبيهات</div>
      {alerts.length===0 ? <div style={{ background:"#ecfdf5", color:C.ok, borderRadius:12, padding:"14px", textAlign:"center", fontWeight:700, fontSize:13.5, marginTop:8 }}>✓ لا توجد تنبيهات</div> :
        <div style={{ marginTop:6 }}>{alerts.map((a,i)=>(
          <div key={i} onClick={()=>onGoto(a.go)} style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 4px", borderTop:i>0?`1px solid ${C.line2}`:"none", cursor:"pointer" }}>
            <span style={{ width:8, height:8, borderRadius:"50%", background:a.sev==="err"?C.err:C.warn, flexShrink:0 }} />
            <span style={{ flex:1, fontSize:13, color:a.sev==="err"?C.err:C.text }}>{a.t}</span>
            <span style={{ color:C.muted, fontSize:13 }}>›</span>
          </div>
        ))}</div>}
    </div>
  </div>;
}

// ════════════════════════════════ ENGINE (الدوام والتغطيات) ════════════════════════════════
function EnginePage({ doctors, leaves, nightData, coverages, today, fd, setNight, setCoverages, showToast }) {
  const now = new Date();
  const [mo, setMo] = useState({ y:now.getFullYear(), m:now.getMonth() });
  const [sel, setSel] = useState(null);
  const [picks, setPicks] = useState({});
  const days = useMemo(()=>monthDays(mo.y,mo.m), [mo]);
  const ana = useMemo(()=>analyzeMonth(mo.y,mo.m,doctors,leaves,nightData,coverages), [mo,doctors,leaves,nightData,coverages]);
  const gaps = ana.gaps.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.period.localeCompare(b.period));
  const gapKey = g => `${g.date}|${g.period}|${g.ownerId}`;
  const monthDates = days.map(x=>x.date);
  const loadMap = useMemo(()=>{ const m={}; doctors.forEach(d=>{ m[d.id]=doctorSessions(d, monthDates, nightData, coverages, leaves).direct; }); return m; }, [mo,doctors,nightData,coverages,leaves]);
  const rankAvail = arr => arr.filter(a=>a.status!=="leave").map(a=>({ ...a, load:loadMap[a.doc.id]||0 })).sort((a,b)=> (a.status==="free"?0:1)-(b.status==="free"?0:1) || a.load-b.load);
  const availForGap = g => rankAvail(getAvailable(doctors,[g.ownerId],g.di,g.date,g.period,leaves,nightData,{},coverages));

  const ensureDay = date => setNight(nd=>nd[date]?nd:{...nd,[date]:{doctors:[],coverages:{am:[],pm:[],nextAm:[]},note:""}});
  const pushCov = cov => setCoverages(cs=>[...cs,{id:uid(),...cov}]);
  const addCovIndiv = cov => { pushCov(cov); showToast("تم تسجيل التغطية"); };
  const removeCovIndiv = id => setCoverages(cs=>cs.filter(c=>c.id!==id));
  const eveningOwner = g => ((nightData[g.date]||{}).doctors||[]).includes(g.ownerId);
  const addNightCov = (date,slot,cid) => setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; if(!(cv[slot]||[]).includes(cid)) cv[slot]=[...(cv[slot]||[]),cid]; d.coverages=cv; return {...nd,[date]:d}; });
  const placeCover = (g,cid) => { if(eveningOwner(g)&&(g.period==="am"||g.period==="pm")) addNightCov(g.date,g.period,cid); else pushCov({absentId:g.ownerId,date:g.date,period:g.period,coverDoctorId:cid,reason:"absence"}); };
  const coverGap = g => { const av=availForGap(g); const s=picks[gapKey(g)]; const cid=s?+s:(av[0]?.doc?.id); if(!cid){showToast("لا يوجد متاح","warn");return;} placeCover(g,cid); showToast("تمت التغطية"); };
  const coverAll = () => { let n=0; const used={}; gaps.forEach(g=>{ const av=availForGap(g); const s=picks[gapKey(g)]; const key=g.date+"|"+g.period; const taken=used[key]||[]; const pick = s?+s : (av.find(a=>!taken.includes(a.doc.id))?.doc?.id); if(pick){ placeCover(g,pick); (used[key]=used[key]||[]).push(pick); n++; } }); showToast(n?`غُطّيت ${n} عيادة بالأنسب`:"لا يوجد متاح"); };

  const toggleEvening = (date,id) => { ensureDay(date); setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{am:[],pm:[],nextAm:[]}})}; const has=(d.doctors||[]).includes(id); d.doctors=has?d.doctors.filter(x=>x!==id):[...(d.doctors||[]),id]; return {...nd,[date]:d}; }); };
  const setCov = (date,slot,id) => { if(!id) return; setNight(nd=>{ const d={...(nd[date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; cv[slot]=[+id]; d.coverages=cv; return {...nd,[date]:d}; }); };
  const clearCov = (date,slot) => setNight(nd=>{ const d={...(nd[date]||{})}; const cv={...(d.coverages||{})}; cv[slot]=[]; d.coverages=cv; return {...nd,[date]:d}; });

  const autoEvening = () => { const next=autoFill(mo.y,mo.m,doctors,leaves,nightData); setNight(()=>next); showToast("تم التوزيع التلقائي للمسائي"); };

  // individual coverage form
  const [cf, setCf] = useState({ absentId:"", date:"", period:"am", coverId:"" });
  const submitCov = () => { if(!cf.date||!cf.coverId){showToast("أكمل الحقول","warn");return;} addCovIndiv({ absentId:cf.absentId?+cf.absentId:null, date:cf.date, period:cf.period, coverDoctorId:+cf.coverId, reason:"absence" }); setCf({absentId:"",date:"",period:"am",coverId:""}); };

  // filters / view / tools
  const [search,setSearch] = useState("");
  const [sFilter,setSFilter] = useState("all");
  const [view,setView] = useState("list");
  const pre = `${mo.y}-${String(mo.m+1).padStart(2,"0")}`;
  const clearMonth = () => { if(!confirm("مسح كل مسائيات وتغطيات هذا الشهر؟")) return; setNight(nd=>{ const n={...nd}; Object.keys(n).forEach(k=>{ if(k.startsWith(pre)) delete n[k]; }); return n; }); setCoverages(cs=>cs.filter(c=>!String(c.date).startsWith(pre))); showToast("تم مسح الشهر"); };
  const copyPrev = () => { const pm=mo.m===0?11:mo.m-1, py=mo.m===0?mo.y-1:mo.y; const prevDays=monthDays(py,pm).filter(d=>(nightData[d.date]?.doctors||[]).length); if(!prevDays.length){showToast("لا بيانات في الشهر السابق","warn");return;} const byWd={}; prevDays.forEach(d=>{ (byWd[d.di]=byWd[d.di]||[]).push(nightData[d.date].doctors); }); const idx={0:0,1:0,2:0,3:0,4:0}; setNight(nd=>{ const n={...nd}; monthDays(mo.y,mo.m).forEach(d=>{ const q=byWd[d.di]; if(q&&q.length){ const docs=q[idx[d.di]%q.length]; idx[d.di]++; n[d.date]={ ...(n[d.date]||{coverages:{am:[],pm:[],nextAm:[]},note:""}), doctors:[...docs] }; } }); return n; }); showToast("تم نسخ نمط الشهر السابق"); };

  const openPrint = (title, body) => { const w=window.open("","_blank"); if(!w){ showToast("اسمح بالنوافذ المنبثقة","warn"); return; } w.document.write(`<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:26px;color:#1f2d3d}h1{font-size:20px;color:#0f766e}h2{font-size:15px;margin-top:20px;border-bottom:2px solid #0f766e;padding-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #cbd5e1;padding:7px 9px;font-size:12.5px;text-align:center}th{background:#0f766e;color:#fff}p{font-size:13px;line-height:1.7}@media print{.np{display:none}}</style></head><body><h1>${title}</h1>${body}<script>setTimeout(function(){window.print();},350);<\/script></body></html>`); w.document.close(); };
  const covText = date => { const cv=(nightData[date]||{}).coverages||{}; const a=["am","pm","nextAm"].flatMap(s=>(cv[s]||[]).map(id=>perAr(s)+": "+(fd(id)?.name||""))); const b=coverages.filter(c=>c.date===date).map(c=>perAr(c.period)+": "+(fd(c.coverDoctorId)?.name||"")); return a.concat(b).join(" · ")||"—"; };
  const printSchedule = () => { const rows=days.map(({date,di})=>{ const docs=((nightData[date]||{}).doctors||[]).map(id=>fd(id)?.name).filter(Boolean).join("، ")||"—"; return `<tr><td>${dmy(date)}</td><td>${DAYS[di]}</td><td>${docs}</td><td>${covText(date)}</td></tr>`; }).join(""); openPrint(`جدول الدوام المسائي — ${MONTHS[mo.m]} ${mo.y}`, `<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الدوام المسائي</th><th>التغطيات</th></tr></thead><tbody>${rows}</tbody></table>`); };
  const printDays = () => { const body=days.map(({date,di})=>{ const docs=((nightData[date]||{}).doctors||[]).map(id=>fd(id)?.name).filter(Boolean).join("، ")||"—"; const r=analyzeDay(date,doctors,leaves,nightData,coverages,null); const g=r.gaps.map(x=>`عيادة ${fd(x.ownerId)?.name} (${perAr(x.period)})`).join("، "); return `<h2>${dmy(date)} ${DAYS[di]}</h2><p>المسائي: ${docs}<br>التغطيات: ${covText(date)}${g?`<br><span style="color:#be123c">عيادات مكشوفة: ${g}</span>`:""}</p>`; }).join(""); openPrint(`تقرير الأيام — ${MONTHS[mo.m]} ${mo.y}`, body); };
  const printDoctors = () => { const md=days.map(x=>x.date); const body=doctors.map(d=>{ const ev=md.filter(dt=>((nightData[dt]||{}).doctors||[]).includes(d.id)).map(dmy).join("، ")||"—"; const cov=coverages.filter(c=>c.coverDoctorId===d.id&&md.includes(c.date)).map(c=>dmy(c.date)+" "+perAr(c.period)).join("، ")||"—"; const s=doctorSessions(d,md,nightData,coverages,leaves); return `<h2>د.${d.name} <span style="font-weight:400;color:#64748b;font-size:12px">(${rankLabel(rankOf(d))})</span></h2><p>الدوام المسائي: ${ev}<br>التغطيات المؤدّاة: ${cov}<br>الرعاية (Direct): ${s.direct} · الدعم (Supportive): ${s.supportive}</p>`; }).join(""); openPrint(`تقرير الأطباء — ${MONTHS[mo.m]} ${mo.y}`, body); };

  const filled = days.filter(d=>{ const nd=nightData[d.date]; return nd && ((nd.doctors||[]).length || coverages.some(c=>c.date===d.date)); });
  const statusOf = date => { const r=analyzeDay(date,doctors,leaves,nightData,coverages,null); const nd=nightData[date]||{}; return ((nd.doctors||[]).length && r.gaps.length===0 && r.conflicts.length===0) ? "done":"pending"; };
  const listDays = filled.filter(d=>{ if(sFilter!=="all" && statusOf(d.date)!==sFilter) return false; if(search){ const q=search.trim(); const nd=nightData[d.date]||{}; const names=(nd.doctors||[]).map(id=>fd(id)?.name||"").join(" ")+" "+coverages.filter(c=>c.date===d.date).map(c=>fd(c.coverDoctorId)?.name||"").join(" "); if(!names.includes(q)&&!d.date.includes(q)) return false; } return true; });
  const offset = days.length?days[0].di:0;

  return <div className="fade">
    {/* month nav */}
    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:16 }}>
      <button onClick={()=>setMo(p=>({y:p.m===0?p.y-1:p.y,m:(p.m+11)%12}))} style={{ ...sGhost, width:38, padding:"9px 0" }}>‹</button>
      <div style={{ flex:1, textAlign:"center", fontWeight:700, fontSize:16 }}>{MONTHS[mo.m]} {mo.y}</div>
      <button onClick={()=>setMo(p=>({y:p.m===11?p.y+1:p.y,m:(p.m+1)%12}))} style={{ ...sGhost, width:38, padding:"9px 0" }}>›</button>
    </div>

    {/* Toolbar: options + filters + sharing */}
    <div style={{ ...card(), padding:14, marginBottom:14 }}>
      <div style={{ fontSize:11, fontWeight:700, color:C.muted, marginBottom:7 }}>أدوات الجدول</div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginBottom:10 }}>
        <button onClick={autoEvening} style={sBtn(C.primary)}>⚡ توزيع تلقائي للمسائي</button>
        <button onClick={coverAll} style={sBtn("#0e7490")}>✓ إكمال الناقص (التغطيات)</button>
        <button onClick={copyPrev} style={sGhost}>📋 نسخ الشهر السابق</button>
        <label style={{ ...sGhost, display:"inline-flex", alignItems:"center", gap:6, cursor:"pointer" }}>➕ إضافة يوم<input type="date" onChange={e=>{ if(e.target.value&&dayIdx(e.target.value)>=0){ ensureDay(e.target.value); setSel(e.target.value); setMo({y:+e.target.value.split("-")[0],m:+e.target.value.split("-")[1]-1}); setView("list"); } }} style={{ border:"none", background:"none", width:18, padding:0 }} value="" /></label>
        <button onClick={clearMonth} style={{ ...sGhost, color:C.err }}>🗑 مسح الشهر</button>
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:8, alignItems:"center", paddingTop:10, borderTop:`1px solid ${C.line2}` }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 بحث باسم طبيب أو تاريخ" style={{ ...sIn, flex:"1 1 180px", padding:"8px 11px" }} />
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["all","الكل"],["pending","معلّق"],["done","مكتمل"]].map(([k,l])=>(
            <button key={k} onClick={()=>setSFilter(k)} style={{ padding:"8px 13px", border:"none", fontSize:12.5, fontWeight:700, background:sFilter===k?C.primary:"#fff", color:sFilter===k?"#fff":C.sub }}>{l}</button>
          ))}
        </div>
        <div style={{ display:"flex", border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
          {[["list","📋 جدول"],["calendar","📅 تقويم"]].map(([k,l])=>(
            <button key={k} onClick={()=>setView(k)} style={{ padding:"8px 13px", border:"none", fontSize:12.5, fontWeight:700, background:view===k?C.primaryD:"#fff", color:view===k?"#fff":C.sub }}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:7, alignItems:"center", paddingTop:10, marginTop:10, borderTop:`1px solid ${C.line2}` }}>
        <span style={{ fontSize:11, fontWeight:700, color:C.muted }}>مشاركة:</span>
        <button onClick={printSchedule} style={sGhost}>🖨 طباعة الجدول</button>
        <button onClick={printDays} style={sGhost}>📅 تقرير الأيام</button>
        <button onClick={printDoctors} style={sGhost}>👨‍⚕️ تقرير الأطباء</button>
      </div>
    </div>

    {/* Section 1: resolution */}
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:gaps.length?12:0, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700, minWidth:130 }}>🩺 الحلول المطلوبة {gaps.length>0 && <span style={{ color:C.warn }}>({gaps.length})</span>}</div>
        {gaps.length>0 && <button onClick={coverAll} style={sBtn(C.primary)}>حلّ الكل بالأنسب</button>}
      </div>
      {ana.conflicts.length>0 && ana.conflicts.map((c,i)=>(
        <div key={"c"+i} style={{ background:"#fff1f2", border:`1px solid #fecdd3`, borderRadius:10, padding:"9px 11px", marginBottom:7, fontSize:12.5, color:C.err, fontWeight:600 }}>⛔ {c.text}</div>
      ))}
      {gaps.length===0 && ana.conflicts.length===0 ? <div style={{ background:"#ecfdf5", color:C.ok, borderRadius:10, padding:"12px", textAlign:"center", fontWeight:700, fontSize:13 }}>✓ لا عيادات مكشوفة هذا الشهر</div> :
        gaps.map(g=>{ const av=availForGap(g); const own=fd(g.ownerId); return (
          <div key={gapKey(g)} style={{ background:"#fffbf3", border:"1px solid #fde9c8", borderRadius:10, padding:"10px 11px", marginBottom:7 }}>
            <div style={{ fontSize:12.5, marginBottom:7, color:"#7c5410" }}><b>{dmy(g.date)} {DAYS[g.di]}</b> — عيادة د.{own?own.name:"؟"} ({perAr(g.period)}) <span style={{ fontSize:10.5, color:C.muted }}>· {g.reason}</span></div>
            {av.length===0 ? <div style={{ fontSize:12, color:C.err, fontWeight:600 }}>لا يوجد طبيب متاح</div> :
              <div style={{ display:"flex", gap:6 }}>
                <select value={picks[gapKey(g)]||""} onChange={e=>setPicks(p=>({...p,[gapKey(g)]:e.target.value}))} style={{ ...sIn, flex:1, padding:"8px 10px" }}>
                  <option value="">⭐ الأنسب: د.{av[0].doc.name} · عبء {av[0].load}{av[0].status==="free"?" · متفرّغ":""}</option>
                  {av.map(a=><option key={a.doc.id} value={a.doc.id}>د.{a.doc.name} — {a.status==="free"?"متفرّغ":"لديه التزام"} · عبء {a.load}</option>)}
                </select>
                <button onClick={()=>coverGap(g)} style={sBtn(C.primary)}>تغطية</button>
              </div>}
          </div>
        ); })}
    </div>

    {/* Section 2: evening schedule */}
    <div style={{ ...card(), padding:16, marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, flexWrap:"wrap" }}>
        <div style={{ flex:1, fontSize:15, fontWeight:700 }}>🌙 جدول المسائي <span style={{ fontWeight:400, color:C.muted, fontSize:12 }}>({view==="calendar"?days.length:listDays.length})</span></div>
      </div>
      {view==="calendar" ? (
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:6, marginBottom:6 }}>
            {DAYS.map(d=><div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:C.sub }}>{d}</div>)}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:6 }}>
            {Array.from({length:offset},(_,i)=><div key={"e"+i} />)}
            {days.map(({date,di,day})=>{ const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean); const r=analyzeDay(date,doctors,leaves,nightData,coverages,null); const isT=date===today; const bad=r.gaps.length>0||r.conflicts.length>0; return (
              <div key={date} onClick={()=>{ ensureDay(date); setSel(date); setView("list"); }} style={{ minHeight:84, border:`1px solid ${isT?C.accent:C.line}`, borderRadius:10, padding:"6px 7px", cursor:"pointer", background:bad?"#fffdf7":"#fff" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:800, color:isT?C.primary:C.sub }}>{day}</span>
                  {bad && <span style={{ width:7, height:7, borderRadius:"50%", background:r.conflicts.length?C.err:C.warn }} />}
                </div>
                {docs.length?docs.map(d=><div key={d.id} style={{ display:"flex", alignItems:"center", gap:4, background:d.color+"14", borderRadius:7, padding:"2px 5px", marginBottom:3 }}><span style={{ width:13, height:13, borderRadius:"50%", background:d.color, color:"#fff", fontSize:6.5, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center" }}>{sn(d.name).slice(0,2)}</span><span style={{ fontSize:9, fontWeight:700, color:d.color, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{sn(d.name)}</span></div>):<div style={{ fontSize:13, color:"#dbe3ee", textAlign:"center", paddingTop:6 }}>·</div>}
              </div>
            ); })}
          </div>
          <div style={{ fontSize:11, color:C.muted, marginTop:8, textAlign:"center" }}>اضغط أي يوم للتعديل</div>
        </div>
      ) : listDays.length===0 ? <Empty icon="🌙" title="لا أيام مطابقة" hint="استخدم «توزيع تلقائي» أو «إضافة يوم» من الأدوات" /> :
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {listDays.map(({date,di})=>{
            const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
            const open=sel===date; const nDi=dayIdx(nextWork(date)); const cv=nd.coverages||{};
            return <div key={date} style={{ border:`1px solid ${open?C.accent:C.line}`, borderRadius:12, overflow:"hidden" }}>
              <div onClick={()=>setSel(open?null:date)} style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 13px", cursor:"pointer", background: open?"#f0fdfa":"#fff" }}>
                <div style={{ minWidth:42, textAlign:"center" }}><div style={{ fontSize:16, fontWeight:800, color:C.primary }}>{date.split("-")[2]}</div><div style={{ fontSize:9.5, color:C.muted }}>{DAYS[di]}</div></div>
                <div style={{ flex:1, display:"flex", flexWrap:"wrap", gap:5 }}>
                  {docs.length?docs.map(d=><span key={d.id} style={{ display:"inline-flex", alignItems:"center", gap:5, background:d.color+"14", color:d.color, border:`1px solid ${d.color}30`, borderRadius:20, padding:"3px 10px 3px 4px", fontSize:12.5, fontWeight:700 }}><Avatar doc={d} size={20}/>{sn(d.name)}</span>):<span style={{ fontSize:12.5, color:C.muted }}>— لا دوام</span>}
                </div>
                <span style={{ color:C.muted, fontSize:12 }}>{open?"▲":"▼"}</span>
              </div>
              {open && <div style={{ padding:"4px 13px 13px", borderTop:`1px solid ${C.line2}` }}>
                <div style={label}>الطبيب المسائي</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
                  {doctors.map(d=>{ const on=(nd.doctors||[]).includes(d.id); const lv=onLeave(d,date,leaves); return (
                    <button key={d.id} onClick={()=>toggleEvening(date,d.id)} disabled={lv&&!on} style={{ border:`1px solid ${on?d.color:C.line}`, background:on?d.color:"#fff", color:on?"#fff":(lv?C.muted:C.text), borderRadius:18, padding:"5px 12px", fontSize:12, fontWeight:600, opacity:lv&&!on?.5:1 }}>{sn(d.name)}{lv?" (إجازة)":""}</button>
                  ); })}
                </div>
                {docs.map(d=>{ const needs=[]; if(isClinic(getSlot(d,di,"am")))needs.push(["am","صباح",di]); if(isClinic(getSlot(d,di,"pm")))needs.push(["pm","ظهر",di]); if(isClinic(getSlot(d,nDi,"am")))needs.push(["nextAm","صباح الغد",nDi]);
                  if(clinicClosedOnLeave(d,date,leaves)||!needs.length) return null;
                  return <div key={d.id} style={{ background:"#f8fafc", borderRadius:10, padding:"9px 11px", marginBottom:6 }}>
                    <div style={{ fontSize:11.5, color:C.sub, marginBottom:6 }}>تغطية عيادة د.{sn(d.name)}</div>
                    {needs.map(([slot,lbl,sdi])=>{ const cur=(cv[slot]||[])[0]; const av=rankAvail(getAvailable(doctors,[d.id],sdi,slot==="nextAm"?nextWork(date):date,slot==="nextAm"?"am":slot,leaves,nightData,{},coverages)); return (
                      <div key={slot} style={{ display:"flex", gap:6, alignItems:"center", marginBottom:5 }}>
                        <span style={{ fontSize:11, color:C.muted, minWidth:64 }}>{lbl}</span>
                        <select value={cur||""} onChange={e=>e.target.value?setCov(date,slot,e.target.value):clearCov(date,slot)} style={{ ...sIn, flex:1, padding:"7px 9px", fontSize:12.5 }}>
                          <option value="">{av.length?`⭐ الأنسب: د.${av[0].doc.name} (عبء ${av[0].load})`:"— لا متاح —"}</option>
                          {av.map(a=><option key={a.doc.id} value={a.doc.id}>د.{a.doc.name} — {a.status==="free"?"متفرّغ":"التزام"} · عبء {a.load}</option>)}
                        </select>
                      </div>
                    ); })}
                  </div>;
                })}
                {coverages.filter(c=>c.date===date).length>0 && <div style={{ marginTop:6 }}>
                  {coverages.filter(c=>c.date===date).map(c=>{ const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; return cd&&(
                    <div key={c.id} style={{ display:"flex", alignItems:"center", gap:7, fontSize:12, background:"#f0fdfa", borderRadius:8, padding:"5px 9px", marginBottom:4 }}>
                      <span style={{ color:C.primary, fontWeight:700 }}>🔄 {perAr(c.period)}: {cd.name}</span>{ad&&<span style={{ color:C.muted }}>بدل {ad.name}</span>}
                      <span style={{ flex:1 }}/><button onClick={()=>removeCovIndiv(c.id)} style={{ ...sGhost, color:C.err, padding:"3px 9px" }}>حذف</button>
                    </div>
                  ); })}
                </div>}
              </div>}
            </div>;
          })}
        </div>}
    </div>

    {/* Section 3: individual coverage */}
    <div style={{ ...card(), padding:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🔄 تغطية فردية / بديلة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الغائب (اختياري)</label><select value={cf.absentId} onChange={e=>setCf({...cf,absentId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>الفترة</label><select value={cf.period} onChange={e=>setCf({...cf,period:e.target.value})} style={sIn}><option value="am">صباح</option><option value="pm">ظهر</option><option value="evening">مسائي</option></select></div>
        <div><label style={label}>التاريخ</label><input type="date" value={cf.date} onChange={e=>setCf({...cf,date:e.target.value})} style={sIn} /></div>
        <div><label style={label}>المغطّي</label><select value={cf.coverId} onChange={e=>setCf({...cf,coverId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
      </div>
      <button onClick={submitCov} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة تغطية</button>
    </div>
  </div>;
}

// ════════════════════════════════ LEAVES ════════════════════════════════
function LeavesPage({ doctors, leaves, nightData, coverages, today, fd, setLeaves, setCoverages, showToast }) {
  const TYPES = { annual:"سنوية", sick:"مرضية", emergency:"طارئة", other:"أخرى" };
  const [f, setF] = useState({ doctorId:"", type:"annual", start:"", end:"", clinicClosed:true });
  const add = () => { if(!f.doctorId||!f.start||!f.end){showToast("أكمل الحقول","warn");return;} if(f.end<f.start){showToast("التواريخ غير صحيحة","err");return;} setLeaves(ls=>[...ls,{id:uid(),doctorId:+f.doctorId,type:f.type,start:f.start,end:f.end,clinicClosed:f.clinicClosed}]); setF({doctorId:"",type:"annual",start:"",end:"",clinicClosed:true}); showToast("تم تسجيل الإجازة"); };
  const del = id => setLeaves(ls=>ls.filter(l=>l.id!==id));
  const autoCoverLeave = l => { const d=fd(l.doctorId); if(!d) return; const md=monthDays(+l.start.split("-")[0],+l.start.split("-")[1]-1).map(x=>x.date); const load=id=>doctorSessions(doctors.find(x=>x.id===id),md,nightData,coverages,leaves).direct; const adds=[]; const used={}; const s=new Date(l.start),e=new Date(l.end); for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4) continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; ["am","pm"].forEach(p=>{ if(!isClinic(getSlot(d,wi,p))) return; if(coverages.some(c=>c.date===ds&&c.period===p&&c.absentId===d.id)) return; const av=getAvailable(doctors,[d.id],wi,ds,p,leaves,nightData,{},coverages).filter(a=>a.status!=="leave").map(a=>({a,L:load(a.doc.id)})).sort((x,y)=>(x.a.status==="free"?0:1)-(y.a.status==="free"?0:1)||x.L-y.L); const key=ds+"|"+p; const taken=used[key]||[]; const pick=av.find(x=>!taken.includes(x.a.doc.id)); if(pick){ adds.push({id:uid(),absentId:d.id,date:ds,period:p,coverDoctorId:pick.a.doc.id,reason:"leave"}); (used[key]=used[key]||[]).push(pick.a.doc.id); } }); } if(!adds.length){ showToast("لا عيادات مكشوفة أو لا متاح","warn"); return; } setCoverages(cs=>[...cs,...adds]); showToast(`تمت تغطية ${adds.length} عيادة بالأنسب`); };
  const sorted = leaves.slice().sort((a,b)=>b.start.localeCompare(a.start));

  return <div className="fade">
    <div style={{ ...card(), padding:16, marginBottom:16 }}>
      <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>🏖 تسجيل إجازة</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <div><label style={label}>الطبيب</label><select value={f.doctorId} onChange={e=>setF({...f,doctorId:e.target.value})} style={sIn}><option value="">—</option>{doctors.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
        <div><label style={label}>النوع</label><select value={f.type} onChange={e=>setF({...f,type:e.target.value})} style={sIn}>{Object.entries(TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
        <div><label style={label}>من</label><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value})} style={sIn} /></div>
        <div><label style={label}>إلى</label><input type="date" value={f.end} onChange={e=>setF({...f,end:e.target.value})} style={sIn} /></div>
      </div>
      <label style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, fontSize:13, color:C.sub, cursor:"pointer" }}>
        <input type="checkbox" checked={f.clinicClosed} onChange={e=>setF({...f,clinicClosed:e.target.checked})} /> العيادة مغلقة خلال الإجازة (لا تحتاج تغطية)
      </label>
      <button onClick={add} style={{ ...sBtn(C.primary), width:"100%", marginTop:12 }}>إضافة</button>
    </div>

    {sorted.length===0 ? <Empty icon="🏖" title="لا إجازات مسجّلة" /> :
      <div className="grid-cards">{sorted.map(l=>{ const d=fd(l.doctorId); if(!d) return null;
        // impact
        const clinics=[],carried=[],evening=[];
        const s=new Date(l.start),e=new Date(l.end);
        for(let dt=new Date(s);dt<=e;dt.setDate(dt.getDate()+1)){ const wi=dt.getDay(); if(wi>4)continue; const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; const nd=nightData[ds]||{}; const cds=nd.coverages||{};
          ["am","pm"].forEach(p=>{ if(isClinic(getSlot(d,wi,p))){ const ex=coverages.find(c=>c.date===ds&&c.period===p&&c.absentId===d.id); clinics.push({ds,p,cov:ex?ex.coverDoctorId:null}); } });
          if((nd.doctors||[]).includes(d.id)) evening.push(ds);
          ["am","pm","nextAm"].forEach(sl=>{ if((cds[sl]||[]).includes(d.id)) carried.push({ds,p:sl}); });
          coverages.forEach(cv=>{ if(cv.date===ds&&cv.coverDoctorId===d.id) carried.push({ds,p:cv.period}); });
        }
        const uncovered = l.clinicClosed!==false?0:clinics.filter(c=>!c.cov).length;
        return <div key={l.id} style={{ ...card(), padding:14 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
            <Avatar doc={d} size={34}/>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>{d.name}</div>
              <div style={{ fontSize:11.5, color:C.sub }}>{TYPES[l.type]} · {dmy(l.start)} ← {dmy(l.end)}</div>
            </div>
            <button onClick={()=>del(l.id)} style={{ ...sGhost, color:C.err, padding:"6px 11px" }}>حذف</button>
          </div>
          {/* weekly schedule */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:4, marginBottom:10 }}>
            {[0,1,2,3,4].map(di=><div key={di} style={{ border:`1px solid ${C.line2}`, borderRadius:8, overflow:"hidden", textAlign:"center" }}>
              <div style={{ background:"#f8fafc", fontSize:9, fontWeight:700, color:C.sub, padding:"3px 0" }}>{DAYS[di]}</div>
              {["am","pm"].map(p=>{ const sl=getSlot(d,di,p); const dir=DIRECT_SLOTS.includes(sl); return <div key={p} style={{ fontSize:9, padding:"4px 1px", color:dir?C.primary:C.muted, background:dir?"#f0fdfa":"#fff", fontWeight:dir?700:400 }}>{SLOT_AR[sl]||"—"}</div>; })}
            </div>)}
          </div>
          {/* impact */}
          <div style={{ background:"#f8fbfc", borderRadius:10, padding:"9px 11px" }}>
            <div style={{ fontSize:11.5, fontWeight:700, color:C.text, marginBottom:5 }}>🏥 عياداته خلال الإجازة ({clinics.length}){uncovered>0&&<span style={{ color:C.err }}> · مكشوف {uncovered}</span>}</div>
            {uncovered>0 && <button onClick={()=>autoCoverLeave(l)} style={{ ...sBtn(C.primary), padding:"7px 13px", fontSize:12, marginBottom:7 }}>⚡ تغطية عيادات الإجازة بالأنسب</button>}
            {clinics.length===0?<div style={{ fontSize:11, color:C.muted }}>لا عيادات</div>:clinics.map((c,i)=><div key={i} style={{ fontSize:11, color:C.sub, padding:"1px 0" }}>• {dmy(c.ds)} {perAr(c.p)} — {c.cov?<span style={{ color:C.ok }}>✓ {fd(c.cov)?.name}</span>:(l.clinicClosed!==false?<span style={{ color:C.ok }}>مغلقة</span>:<span style={{ color:C.err }}>مكشوفة</span>)}</div>)}
            {carried.length>0&&<div style={{ fontSize:11, color:C.warn, marginTop:6 }}>🔄 تغطياته لزملاء: {carried.length} — تحتاج إعادة تعيين</div>}
            {evening.length>0&&<div style={{ fontSize:11, color:"#7c3aed", marginTop:3 }}>🌙 دوامه المسائي: {evening.length} — يحتاج بديلاً</div>}
          </div>
        </div>;
      })}</div>}
  </div>;
}

      <button onClick={addDoc} style={sBtn(C.primary)}>إضافة</button>
    </div>
    {doctors.length===0 ? <Empty icon="👨‍⚕️" title="لا أطباء بعد" hint="أضف أول طبيب من الأعلى" /> :
      <div className="grid-cards">{doctors.map(d=>{ const isOpen=open===d.id; return (

            <span style={{ color:C.muted }}>{isOpen?"▲":"▼"}</span>
          </div>
          {isOpen && <div style={{ padding:"4px 14px 14px", borderTop:`1px solid ${C.line2}` }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
              <div><label style={label}>الاسم</label><input value={d.name} onChange={e=>upd(d.id,{name:e.target.value})} style={sIn} /></div>

              <div><label style={label}>المنصب الإداري</label><select value={d.adminPosition||"none"} onChange={e=>upd(d.id,{adminPosition:e.target.value})} style={sIn}>{Object.entries(POS_LABEL).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
              <div><label style={label}>اللون</label><div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>{PALETTE.map(c=><button key={c} onClick={()=>upd(d.id,{color:c})} style={{ width:22, height:22, borderRadius:"50%", background:c, border:d.color===c?"2px solid #1e293b":"2px solid #fff" }} />)}</div></div>

            </div>
            <label style={label}>جدول العيادات الأسبوعي</label>

              {[0,1,2,3,4].map(di=><div key={di}>
                <div style={{ fontSize:10.5, fontWeight:700, color:C.sub, textAlign:"center", marginBottom:4 }}>{DAYS[di]}</div>
                {["am","pm"].map(p=><select key={p} value={getSlot(d,di,p)} onChange={e=>setSlot(d.id,di,p,e.target.value)} style={{ ...sIn, padding:"6px 4px", fontSize:11, marginBottom:4 }}>{SLOT_OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>)}
              </div>)}
            </div>
            <button onClick={()=>{ if(confirm("حذف الطبيب؟")) del(d.id); }} style={{ ...sGhost, color:C.err, width:"100%" }}>حذف الطبيب</button>
          </div>}
        </div>
      ); })}</div>}
  </div>;
}

// ════════════════════════════════ STATS ════════════════════════════════
function StatsPage({ doctors, leaves, nightData, coverages, today, fd }) {
  const now = new Date();
  const overview = doctors.map(d=>{
    const dates = monthDays(now.getFullYear(), now.getMonth()).map(x=>x.date);
    const sess = doctorSessions(d, dates, nightData, coverages, leaves);
    const expectDirect = Math.round(directTarget(d) * (dates.length/5));
    return { d, sess, expectDirect };
  }).sort((a,b)=>(b.sess.direct+b.sess.supportive)-(a.sess.direct+a.sess.supportive));

  return <div className="fade">
    <div style={{ ...card(), padding:"16px 18px", marginBottom:16 }}>
      <div style={{ fontSize:15, fontWeight:700 }}>📈 العبء الوظيفي — {MONTHS[now.getMonth()]} {now.getFullYear()}</div>
      <div style={{ fontSize:11.5, color:C.sub, marginTop:3 }}>Direct (رعاية) مقابل المتوقّع · حسب سياسة CAPP 001</div>
    </div>
    {doctors.length===0 ? <Empty icon="📈" title="لا بيانات بعد" /> :
      <div className="grid-cards">{overview.map(({d,sess,expectDirect})=>{
        const pct = expectDirect?Math.min(100,Math.round(sess.direct/expectDirect*100)):0;
        return <div key={d.id} style={{ ...card(), padding:14 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
            <Avatar doc={d} size={32}/>
            <div style={{ flex:1 }}><div style={{ fontWeight:700, fontSize:13.5 }}>{d.name}</div><div style={{ fontSize:11, color:C.sub }}>{rankLabel(rankOf(d))}</div></div>
            <div style={{ textAlign:"center" }}><div style={{ fontSize:18, fontWeight:800, color:C.primary }}>{sess.direct}</div><div style={{ fontSize:10, color:C.muted }}>/ {expectDirect}</div></div>
          </div>
          <div style={{ height:8, background:"#eef3f8", borderRadius:6, overflow:"hidden" }}><div style={{ width:pct+"%", height:"100%", background:pct>=85?C.ok:pct>=60?C.accent:C.warn, borderRadius:6 }} /></div>
          <div style={{ display:"flex", gap:14, marginTop:8, fontSize:11.5, color:C.sub }}>
            <span>رعاية: <b style={{ color:C.primary }}>{sess.direct}</b></span>
            <span>دعم: <b>{sess.supportive}</b></span>
          </div>
        </div>;
      })}</div>}
  </div>;
}

// ════════════════════════════════ SEED (أطباء القسم) ════════════════════════════════
const _SM = { c:"clinic", v:"virtual", a:"audit", t:"training", d:"admin", x:"" };
const _mkSched = r => { const s={}; for(let i=0;i<5;i++) s[i]={ pm:_SM[r[i][0]], am:_SM[r[i][1]] }; return s; };
const _SEED = [
  ["محمد الشهراني",[0],[["c","c"],["x","t"],["c","d"],["d","c"],["c","d"]]],
  ["طارق السرحاني",[],[["x","t"],["c","c"],["x","c"],["c","t"],["c","c"]]],
  ["ثائرة المهناء",[0],[["c","c"],["v","a"],["c","x"],["c","x"],["x","c"]]],
  ["مهدي الشايب",[1],[["x","v"],["c","c"],["x","t"],["c","t"],["c","c"]]],
  ["ديمة كمال",[3],[["c","a"],["d","c"],["d","c"],["c","v"],["c","d"]]],
  ["مريم الإبراهيم",[2],[["c","x"],["x","c"],["c","a"],["c","c"],["v","c"]]],
  ["بثينة الغانم",[0],[["c","d"],["d","c"],["t","c"],["c","d"],["c","v"]]],
  ["عبدالرحمن الفرحان",[1],[["c","x"],["c","v"],["c","x"],["c","c"],["c","x"]]],
  ["أمل عسقلان",[0],[["c","a"],["c","d"],["d","c"],["c","v"],["c","d"]]],
  ["بسام القريافي",[2],[["x","x"],["c","v"],["c","c"],["x","x"],["c","x"]]],
  ["شذا القحطاني",[4],[["t","x"],["c","v"],["d","c"],["d","c"],["c","t"]]],
  ["أمل العسكر",[1],[["c","v"],["d","c"],["c","t"],["c","t"],["t","d"]]],
  ["فايزة الشهري",[1],[["d","d"],["c","c"],["d","d"],["c","c"],["d","d"]]],
  ["حنان المحيسن",[1],[["c","c"],["c","t"],["x","x"],["a","v"],["c","c"]]],
  ["محمد القحطاني",[0],[["d","c"],["t","c"],["d","t"],["c","d"],["c","d"]]],
  ["مضر فتيح",[4],[["c","t"],["c","d"],["c","d"],["t","c"],["d","c"]]],
  ["عزيزة دريهم",[4],[["d","v"],["d","d"],["c","d"],["c","c"],["c","c"]]],
];
const SEED_DOCTORS = _SEED.map((e,i)=>({ id:9001+i, name:e[0], color:PALETTE[i%PALETTE.length], nightDays:e[1], blockedDays:[], rank:"specialist", adminPosition:"none", sched:_mkSched(e[2]) }));

// ════════════════════════════════ APP ════════════════════════════════
function App() {
  const [doctors, setDoctors]     = useState(()=>{ const st=S.get("v2_docs"); return (st&&st.length)?st:SEED_DOCTORS; });
  const [leaves, setLeaves]       = useState(()=>S.get("v2_leaves")||[]);
  const [nightData, setNight]     = useState(()=>S.get("v2_night")||{});
  const [coverages, setCoverages] = useState(()=>S.get("v2_cov")||[]);
  const [page, setPage]           = useState("dashboard");
  const [toast, setToast]         = useState(null);
  useEffect(()=>S.set("v2_docs",doctors),[doctors]);
  useEffect(()=>S.set("v2_leaves",leaves),[leaves]);
  useEffect(()=>S.set("v2_night",nightData),[nightData]);
  useEffect(()=>S.set("v2_cov",coverages),[coverages]);
  useEffect(()=>{
    let changed=false; const nn={...nightData}; const keep=[];
    coverages.forEach(c=>{
      const evOwner = c.absentId && (nn[c.date]?.doctors||[]).includes(c.absentId) && (c.period==="am"||c.period==="pm");
      if(evOwner){ const d={...(nn[c.date]||{doctors:[],coverages:{}})}; const cv={am:[],pm:[],nextAm:[],...(d.coverages||{})}; if(!(cv[c.period]||[]).includes(c.coverDoctorId)) cv[c.period]=[...(cv[c.period]||[]),c.coverDoctorId]; d.coverages=cv; nn[c.date]=d; changed=true; }
      else keep.push(c);
    });
    if(changed){ setNight(()=>nn); setCoverages(()=>keep); }
  }, []);
  const today = new Date().toISOString().split("T")[0];
  const fd = id => doctors.find(d=>d.id===id);
  const showToast = (msg,kind="ok") => { setToast({msg,kind}); setTimeout(()=>setToast(null),2200); };

  const TABS = [["dashboard","الرئيسية","◧"],["engine","الدوام والتغطيات","🌙"],["leaves","الإجازات","🏖"],["doctors","الأطباء","👨‍⚕️"],["stats","الإحصائيات","📈"]];
  const cur = TABS.find(t=>t[0]===page);
  const subt = { dashboard:"نظرة عامة وتنبيهات", engine:"المحرك — حلول · مسائي · تغطيات", leaves:"تسجيل الإجازات وأثرها", doctors:"بيانات الأطباء وجداولهم", stats:"العبء الوظيفي والتقارير" };
  const pageEl = <>
      {page==="dashboard" && <Dashboard doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} onGoto={setPage} />}
      {page==="engine" && <EnginePage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setNight={setNight} setCoverages={setCoverages} showToast={showToast} />}
      {page==="leaves" && <LeavesPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} setLeaves={setLeaves} setCoverages={setCoverages} showToast={showToast} />}
      {page==="doctors" && <DoctorsPage doctors={doctors} leaves={leaves} today={today} fd={fd} setDoctors={setDoctors} showToast={showToast} />}
      {page==="stats" && <StatsPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} />}
  </>;

  return <div className="shell">
    <aside className="sidebar">
      <div className="brand">
        <div style={{ width:40, height:40, borderRadius:12, background:"linear-gradient(135deg,#0f766e,#14b8a6)", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:800 }}>ط</div>
        <div><div style={{ fontWeight:700, fontSize:15.5 }}>الجداول الطبية</div><div style={{ fontSize:11, color:C.sub }}>إدارة الدوام</div></div>
      </div>
      {TABS.map(([id,lbl,ic])=>(
        <button key={id} className={"navbtn"+(page===id?" active":"")} onClick={()=>setPage(id)}><span className="ic">{ic}</span>{lbl}</button>
      ))}
      <div style={{ flex:1 }} />
      <div style={{ fontSize:11, color:C.muted, textAlign:"center", padding:"10px 0" }}>{doctors.length} طبيب · {MONTHS[new Date().getMonth()]}</div>
    </aside>
    <div className="main">
      <div className="topbar">
        <h1>{cur?cur[2]+" "+cur[1]:""}</h1>
        <p>{subt[page]}</p>
      </div>
      <div className="content">{pageEl}</div>
    </div>
    <div className="bottomnav">
      {TABS.map(([id,lbl,ic])=>(
        <button key={id} onClick={()=>setPage(id)} style={{ flex:1, background:"none", border:"none", padding:"9px 2px 8px", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:page===id?C.primary:C.muted }}>
          <span style={{ fontSize:17 }}>{ic}</span>
          <span style={{ fontSize:9.5, fontWeight:page===id?700:500 }}>{lbl}</span>
        </button>
      ))}
    </div>
    <Toast toast={toast} />
  </div>;
}

const container = document.getElementById("root");
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
