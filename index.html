// LOGIN GATE
// ══════════════════════════════════════════════════════
const PIN_CODE = "1133";
// ⬇️ مهم: ضع هنا بريد (بريدات) المدير المصرّح له بالدخول السحابي بصلاحية كاملة.
// أي بريد غير مطابق لطبيب وغير موجود هنا = يُمنع من الدخول (وليس مديراً افتراضياً).
const ADMIN_EMAILS = ["tmalsarhani@gmail.com"];
function LoginGate({ onSuccess }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [fbErr, setFbErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState("cloud"); // cloud | pin

  const submit = (val) => {
    if (val === PIN_CODE) { onSuccess(); }
    else { setError(true); setPin(""); setTimeout(()=>setError(false), 1500); }
  };
  const press = (n) => {
    const next = (pin + n).slice(0,4);
    setPin(next);
    if (next.length === 4) setTimeout(()=>submit(next), 150);
  };

  const cloudLogin = () => {
    if (!window.fbAuth) { setFbErr("الاتصال السحابي غير متاح"); return; }
    if (!email || !pass) { setFbErr("أدخل البريد وكلمة المرور"); return; }
    setBusy(true); setFbErr("");
    window.fbAuth.signInWithEmailAndPassword(email.trim(), pass)
      .then(()=>{ /* onAuthStateChanged handles the rest */ })
      .catch(err=>{
        const m = err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"||err.code==="auth/user-not-found" ? "البريد أو كلمة المرور غير صحيحة"
          : err.code==="auth/invalid-email" ? "صيغة البريد غير صحيحة"
          : err.code==="auth/too-many-requests" ? "محاولات كثيرة، انتظر قليلاً"
          : "تعذّر تسجيل الدخول";
        setFbErr(m); setBusy(false);
      });
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"radial-gradient(circle at 30% 20%, #2c5282 0%, #1e3a5f 40%, #0f1e36 100%)", direction:"rtl", fontFamily:"'Segoe UI',Tahoma,sans-serif", padding:16 }}>
      <div style={{ background:"#fff", borderRadius:20, padding:"32px 28px", width:340, boxShadow:"0 20px 60px rgba(0,0,0,.3)", textAlign:"center" }}>
        <div style={{ width:72, height:72, borderRadius:20, background:"linear-gradient(135deg,#1e3a5f,#2c5282)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:38, margin:"0 auto 14px", boxShadow:"0 8px 20px rgba(30,58,95,.3)" }}>🦷</div>
        <div style={{ fontWeight:800, fontSize:20, color:"#1e293b" }}>قسم إصلاح الأسنان</div>
        <div style={{ fontSize:13, color:"#64748b", marginTop:4, marginBottom:18 }}>مركز طب الأسنان التخصصي</div>

        {mode==="cloud" ? (
          <>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="البريد الإلكتروني" autoCapitalize="none"
              style={{ width:"100%", padding:"11px 14px", border:"1px solid #e2e8f0", borderRadius:10, fontSize:14, outline:"none", marginBottom:10, direction:"ltr", textAlign:"left" }} />
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="كلمة المرور" onKeyDown={e=>{if(e.key==="Enter")cloudLogin();}}
              style={{ width:"100%", padding:"11px 14px", border:"1px solid #e2e8f0", borderRadius:10, fontSize:14, outline:"none", marginBottom:10, direction:"ltr", textAlign:"left" }} />
            <div style={{ height:18, fontSize:12, color:"#dc2626", fontWeight:700, marginBottom:8 }}>{fbErr}</div>
            <button onClick={cloudLogin} disabled={busy} style={{ width:"100%", padding:"12px", background:busy?"#94a3b8":"linear-gradient(135deg,#1e3a5f,#2c5282)", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:busy?"default":"pointer" }}>{busy?"جارٍ الدخول…":"تسجيل الدخول"}</button>
            <button onClick={()=>setMode("pin")} style={{ marginTop:12, background:"none", border:"none", color:"#94a3b8", fontSize:12, cursor:"pointer" }}>الدخول برقم سري (بدون سحابة)</button>
          </>
        ) : (
          <>
            <div style={{ fontSize:12, color:"#94a3b8", marginBottom:14 }}>دخول محلي بدون حفظ سحابي</div>
            <div style={{ display:"flex", justifyContent:"center", gap:12, marginBottom:8 }}>
              {[0,1,2,3].map(i => (
                <div key={i} style={{ width:16, height:16, borderRadius:"50%", border:`2px solid ${error?"#dc2626":"#2c5282"}`, background: i<pin.length ? (error?"#dc2626":"#2c5282") : "transparent", transition:"all .15s" }} />
              ))}
            </div>
            <div style={{ height:18, fontSize:12, color:"#dc2626", fontWeight:700, marginBottom:8 }}>{error ? "رقم سري خاطئ" : ""}</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10 }}>
              {[1,2,3,4,5,6,7,8,9].map(n => (
                <button key={n} onClick={()=>press(String(n))} style={keyBtn}>{n}</button>
              ))}
              <button onClick={()=>setPin("")} style={{ ...keyBtn, fontSize:14, color:"#94a3b8" }}>مسح</button>
              <button onClick={()=>press("0")} style={keyBtn}>0</button>
              <button onClick={()=>setPin(p=>p.slice(0,-1))} style={{ ...keyBtn, fontSize:18, color:"#94a3b8" }}>⌫</button>
            </div>
            <button onClick={()=>setMode("cloud")} style={{ marginTop:14, background:"none", border:"none", color:"#94a3b8", fontSize:12, cursor:"pointer" }}>الدخول بالحساب السحابي</button>
          </>
        )}
      </div>
    </div>
  );
}
const keyBtn = { padding:"18px 0", fontSize:22, fontWeight:700, color:"#1e3a5f", background:"#f1f5f9", border:"none", borderRadius:14, cursor:"pointer", transition:"all .12s" };

// ══════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════
function App() {
  const [authed, setAuthed] = useState(() => S.get("fin_auth") === true);
  const [doctors,   setDoctors]   = useState(() => S.get("fin_docs")   || INIT_DOCTORS);
  const [leaves,    setLeaves]    = useState(() => S.get("fin_leaves")  || []);
  const [nightData, setNightData] = useState(() => S.get("fin_night")   || {});
  const [absences,  setAbsences]  = useState(() => S.get("fin_abs")     || []);
  const [coverages, setCoverages] = useState(() => S.get("fin_cov")     || []);
  const [approvals, setApprovals] = useState(() => S.get("fin_approvals") || {});
  const [page,      setPage]      = useState("dashboard");
  const [toast,     setToast]     = useState(null);
  const today = new Date().toISOString().split("T")[0];

  const showToast = (msg, type="ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2500);
  };

  const fd = id => doctors.find(d => d.id === id);

  // ─── Firebase cloud sync (Phase 1: admin login + cloud storage) ───
  const [fbUser, setFbUser] = useState(null);
  const [cloudReady, setCloudReady] = useState(false);
  const cloudLoaded = React.useRef(false);
  const DB_PATH = "clinicData/main";
  // ─── Role: "admin" (full access) or "doctor" (read-only own page). Determined by matching login email to a doctor's email ───
  const [role, setRole] = useState("admin");
  const [myDoctorId, setMyDoctorId] = useState(null);

  React.useEffect(() => {
    try {
      if (!window.fbAuth) { setRole("admin"); setCloudReady(true); return; }
      const unsub = window.fbAuth.onAuthStateChanged(u => {
        setFbUser(u || null);
        if (u) {
          setAuthed(true); S.set("fin_auth", true);
          setCloudReady(false); // انتظر تحديد الدور وتحميل البيانات قبل عرض أي واجهة
          window.fbDB.ref(DB_PATH).once("value").then(snap => {
            const d = snap.val();
            if (d) { // السحابة هي مصدر الحقيقة — نكتب فوق أي بيانات محلية قديمة (يمنع الإجازات الوهمية)
              setDoctors(d.docs || INIT_DOCTORS); S.set("fin_docs", d.docs || INIT_DOCTORS);
              setLeaves(d.leaves || []);          S.set("fin_leaves", d.leaves || []);
              setNightData(d.night || {});        S.set("fin_night", d.night || {});
              setCoverages(d.cov || []);          S.set("fin_cov", d.cov || []);
              setApprovals(d.approvals || {});    S.set("fin_approvals", d.approvals || {});
            }
            // ─── تحديد الدور بمطابقة بريد الدخول مع بريد الأطباء ───
            const docsList = (d && d.docs) ? d.docs : (S.get("fin_docs") || INIT_DOCTORS);
            const em = (u.email || "").trim().toLowerCase();
            const mine = em ? docsList.find(x => (x.email || "").trim().toLowerCase() === em) : null;
            const isAdminEmail = em && ADMIN_EMAILS.map(a => a.trim().toLowerCase()).includes(em);
            if (mine && !isAdminEmail) { setRole("doctor"); setMyDoctorId(mine.id); }
            else if (isAdminEmail)     { setRole("admin");  setMyDoctorId(null); }
            else                       { setRole("blocked"); setMyDoctorId(null); } // غير مصرّح — لا مدير افتراضي
            cloudLoaded.current = true;
            setCloudReady(true);
          }).catch(()=>{ setRole("blocked"); cloudLoaded.current = true; setCloudReady(true); });
        } else {
          setRole("admin"); // لا يوجد مستخدم سحابي → دخول محلي/PIN كمدير
          setCloudReady(true);
        }
      });
      return () => { try { unsub && unsub(); } catch(e){} };
    } catch(e) { setRole("admin"); setCloudReady(true); }
  }, []);

  React.useEffect(() => {
    try {
      if (!window.fbDB || !fbUser || !cloudLoaded.current || role !== "admin") return;
      const t = setTimeout(() => {
        try { window.fbDB.ref(DB_PATH).set({ docs:doctors, leaves, night:nightData, cov:coverages, approvals, updated:Date.now() }).catch(()=>{}); } catch(e){}
      }, 800);
      return () => clearTimeout(t);
    } catch(e) {}
  }, [doctors, leaves, nightData, coverages, approvals, fbUser, role]);

  // ─── مزامنة مباشرة لحساب الطبيب (قراءة فقط): تنعكس تعديلات المدير فوراً دون إعادة دخول ───
  React.useEffect(() => {
    if (role !== "doctor" || !window.fbDB || !fbUser) return;
    const ref = window.fbDB.ref(DB_PATH);
    const handler = ref.on("value", snap => {
      const d = snap.val();
      if (!d) return;
      setDoctors(d.docs || INIT_DOCTORS);
      setLeaves(d.leaves || []);
      setNightData(d.night || {});
      setCoverages(d.cov || []);
      setApprovals(d.approvals || {});
    });
    return () => { try { ref.off("value", handler); } catch(e){} };
  }, [role, fbUser]);

  const save = () => {
    S.set("fin_docs",   doctors);
    S.set("fin_leaves", leaves);
    S.set("fin_night",  nightData);
    S.set("fin_abs",    absences);
    S.set("fin_cov",    coverages);
    // Auto-snapshot: keep last 3 internal backups
    try {
      const snaps = S.get("fin_snapshots") || [];
      snaps.unshift({ t:new Date().toISOString(), docs:doctors, leaves, night:nightData, cov:coverages });
      S.set("fin_snapshots", snaps.slice(0,3));
      S.set("fin_lastbackup", new Date().toISOString());
    } catch(e) {}
  };

  const restoreBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (d.docs)  { setDoctors(d.docs);   S.set("fin_docs", d.docs); }
        if (d.leaves){ setLeaves(d.leaves);  S.set("fin_leaves", d.leaves); }
        if (d.night) { setNightData(d.night);S.set("fin_night", d.night); }
        if (d.cov)   { setCoverages(d.cov);  S.set("fin_cov", d.cov); }
        showToast("✅ تم استعادة النسخة الاحتياطية");
      } catch(err) { showToast("ملف غير صالح", "warn"); }
    };
    reader.readAsText(file);
  };

  const [undoStack, setUndoStack] = useState([]);
  const pushUndo = () => {
    setUndoStack(s => [...s.slice(-9), { night: JSON.parse(JSON.stringify(nightData)), cov: JSON.parse(JSON.stringify(coverages)) }]);
  };
  const doUndo = () => {
    setUndoStack(s => {
      if (!s.length) { showToast("لا يوجد تعديل للتراجع عنه", "warn"); return s; }
      const last = s[s.length-1];
      setNightData(last.night); S.set("fin_night", last.night);
      setCoverages(last.cov); S.set("fin_cov", last.cov);
      showToast("↩️ تم التراجع");
      return s.slice(0, -1);
    });
  };

  const updateDocs = next => { setDoctors(next); S.set("fin_docs", next); };
  const updateNight = next => { pushUndo(); setNightData(next); S.set("fin_night", next); };
  const updateCoverages = next => { setCoverages(next); S.set("fin_cov", next); };

  const setMonthApproval = (key, val) => {
    const next = { ...approvals, [key]: val };
    setApprovals(next); S.set("fin_approvals", next);
  };

  const addIndivCoverage = (cov) => {
    const next = [...coverages, { id:Date.now(), ...cov }];
    updateCoverages(next);
    showToast("✅ تم تسجيل التغطية");
  };
  const removeIndivCoverage = (id) => {
    updateCoverages(coverages.filter(c => c.id !== id));
    showToast("تم الحذف", "warn");
  };

  const importExcel = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = window.XLSX.read(new Uint8Array(e.target.result), { type:"array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(ws, { header:1 });
        const nameToId = {}; doctors.forEach(d=>{ nameToId[d.name.trim()] = d.id; nameToId[d.name.replace(/\s/g,"")] = d.id; });
        const findId = nm => { if(!nm) return null; const t=nm.trim(); return nameToId[t] ?? nameToId[t.replace(/\s/g,"")] ?? null; };
        const nextNight = { ...nightData };
        const newCov = [...coverages];
        let count = 0;
        rows.slice(1).forEach(r => {
          const date = (r[0]||"").toString().trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
          const nightIds = (r[1]||"").toString().split(",").map(s=>findId(s)).filter(Boolean);
          const am = (r[2]||"").toString().split(",").map(s=>findId(s)).filter(Boolean);
          const pm = (r[3]||"").toString().split(",").map(s=>findId(s)).filter(Boolean);
          const nextAm = (r[4]||"").toString().split(",").map(s=>findId(s)).filter(Boolean);
          const note = (r[6]||"").toString().trim();
          if (nightIds.length || am.length || pm.length || nextAm.length || note) {
            nextNight[date] = { doctors:nightIds, coverages:{ am, pm, nextAm }, note };
            count++;
          }
          // individual coverages col 5: "absent> cover / period ; ..."
          const indivRaw = (r[5]||"").toString().trim();
          if (indivRaw) {
            indivRaw.split(";").forEach(part=>{
              const m = part.split(">");
              if (m.length<2) return;
              const absentId = findId(m[0]);
              const rest = m[1].split("/");
              const coverId = findId(rest[0]);
              const periodTxt = (rest[1]||"").trim();
              const period = periodTxt.includes("صباح")?"am":periodTxt.includes("مسائي")?"evening":"pm";
              if (absentId && coverId) newCov.push({ id:Date.now()+Math.random(), date, period, coverDoctorId:coverId, absentId, reason:"absence" });
            });
          }
        });
        updateNight(nextNight);
        updateCoverages(newCov);
        showToast(`✅ تم استيراد ${count} يوم من Excel`);
      } catch(err) { showToast("تعذّر قراءة الملف — تأكد من القالب", "warn"); }
    };
    reader.readAsArrayBuffer(file);
  };

  const loadJuneSeed = () => {
    const N = {
      "2026-06-01":[15],"2026-06-02":[8],"2026-06-03":[16,5],"2026-06-07":[8,16],
      "2026-06-08":[12],"2026-06-09":[15],"2026-06-10":[8,20],"2026-06-11":[16,21,4],
      "2026-06-14":[8,16],"2026-06-15":[6],"2026-06-16":[15],"2026-06-17":[8,20],
      "2026-06-18":[16,9,13],"2026-06-21":[8,16],"2026-06-22":[3],"2026-06-23":[15],
      "2026-06-24":[8,20],"2026-06-25":[16,7,10],"2026-06-28":[8,16],"2026-06-29":[19],"2026-06-30":[15],
    };
    const next = { ...nightData };
    Object.entries(N).forEach(([d,ids])=>{
      next[d] = { doctors:ids, coverages:{ am:[], pm:[], nextAm:[] }, note:"" };
    });
    updateNight(next);
    // Clear coverages for June then add the known ones
    const juneCov = coverages.filter(c=>{ const [y,m]=c.date.split("-"); return !(+y===2026&&+m===6); });
    const add = (date,period,coverId,absentId)=>juneCov.push({ id:Date.now()+Math.random(), date, period, coverDoctorId:coverId, absentId, reason:"absence" });
    // 4/6 عيادة عزيزة(5): مضر(3) صباحاً، العسكر(9) ظهراً
    add("2026-06-04","am",3,5); add("2026-06-04","pm",9,5);
    // 11/6 ثائرة(21) يغطيها مهدي(13) ، حنان(4) يغطيها ديمه(14)
    add("2026-06-11","pm",13,21); add("2026-06-11","pm",14,4);
    // 18/6 مهدي(13) يغطيها ثائرة(21)
    add("2026-06-18","pm",21,13);
    // 23/6 مضر(3) يغطيها بثينة(19)
    add("2026-06-23","pm",19,3);
    // 25/6 عسقلان(7) يغطيها العسكر(9)، شذا(10) يغطيها مضر(3)
    add("2026-06-25","pm",9,7); add("2026-06-25","pm",3,10);
    updateCoverages(juneCov);
    setMonthApproval && setMonthApproval("2026-5", null);
    showToast("✅ تم تحميل بيانات يونيو التجريبية");
  };

  const ensureDay = (date) => {
    if (!nightData[date]) {
      updateNight({ ...nightData, [date]: { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } } });
    }
  };

  const addNightDoc = (date, docId) => {
    if (onLeave(fd(docId), date, leaves)) { showToast("الطبيب في إجازة","warn"); return; }
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    if (cur.doctors.includes(docId)) return;
    if (cur.doctors.length >= 3) { showToast("الحد الأقصى 3 مناوبين","warn"); return; }
    const next = { ...nightData, [date]: { ...cur, doctors: [...cur.doctors, docId] } };
    updateNight(next);
    showToast("✅ تم إضافة المناوب");
  };

  const removeNightDoc = (date, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const next = { ...nightData, [date]: { ...cur, doctors: cur.doctors.filter(id => id !== docId) } };
    updateNight(next);
  };

  const addCoverage = (date, slot, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const covs = cur.coverages || { am:[], pm:[], nextAm:[] };
    if ((covs[slot]||[]).includes(docId)) return;
    const next = { ...nightData, [date]: { ...cur, coverages: { ...covs, [slot]: [...(covs[slot]||[]), docId] } } };
    updateNight(next);
    showToast("✅ تم تعيين التغطية");
  };

  const removeCoverage = (date, slot, docId) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const covs = cur.coverages || { am:[], pm:[], nextAm:[] };
    const next = { ...nightData, [date]: { ...cur, coverages: { ...covs, [slot]: (covs[slot]||[]).filter(id => id !== docId) } } };
    updateNight(next);
  };

  // Fix "absent but assigned" conflict: remove ALL of this doctor's duties on that date
  const removeAllDutiesForDay = (date, docId) => {
    const next = { ...nightData };
    // clean this day's record
    const cur = next[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const covs = cur.coverages || { am:[], pm:[], nextAm:[] };
    next[date] = {
      ...cur,
      doctors: (cur.doctors||[]).filter(id => id !== docId),
      coverages: {
        am: (covs.am||[]).filter(id=>id!==docId),
        pm: (covs.pm||[]).filter(id=>id!==docId),
        nextAm: (covs.nextAm||[]).filter(id=>id!==docId),
      }
    };
    // clean the PREVIOUS workday's nextAm (which lands on this morning)
    const d = new Date(date);
    for (let i=1;i<=4;i++){ const p=new Date(d); p.setDate(d.getDate()-i); const wd=p.getDay(); if(wd!==5&&wd!==6){ const ps=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`; const pnd=next[ps]; if(pnd?.coverages?.nextAm?.includes(docId)){ next[ps]={...pnd, coverages:{...pnd.coverages, nextAm:pnd.coverages.nextAm.filter(id=>id!==docId)}}; } break; } }
    updateNight(next);
    // also remove individual coverages where this doctor is the cover on that date
    const cleanedCov = coverages.filter(c => !(c.date===date && c.coverDoctorId===docId));
    if (cleanedCov.length !== coverages.length) updateCoverages(cleanedCov);
    showToast("✅ تم إزالة تكليف الطبيب لهذا اليوم");
  };

  // Auto-distribute pending coverages, least-loaded doctor first (fair load)
  const autoFillPending = (year, monthIdx) => {
    // Build current load per doctor (extra nights*2 + coverages - absences) for the month
    const inM = (ds) => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
    const load = {}; doctors.forEach(d=>load[d.id]=0);
    Object.entries(nightData).forEach(([date,nd])=>{
      if(!inM(date)) return;
      const di = dayIdx(date);
      (nd.doctors||[]).forEach(id=>{ const d=fd(id); if(d && !(d.nightDays||[]).includes(di)) load[id]=(load[id]||0)+2; });
      const c=nd.coverages||{};
      [...(c.am||[]),...(c.pm||[]),...(c.nextAm||[])].forEach(id=>load[id]=(load[id]||0)+1);
    });
    coverages.forEach(cv=>{ if(inM(cv.date)){ load[cv.coverDoctorId]=(load[cv.coverDoctorId]||0)+1; if(cv.absentId) load[cv.absentId]=(load[cv.absentId]||0)-1; } });

    const next = JSON.parse(JSON.stringify(nightData));
    let filled = 0;
    // Collect pending slots
    Object.keys(next).filter(inM).sort().forEach(date=>{
      const nd = next[date]; const di = dayIdx(date);
      if (di<0) return;
      const nextDate = nextWork(date); const nextDi = dayIdx(nextDate);
      nd.coverages = nd.coverages || { am:[], pm:[], nextAm:[] };
      (nd.doctors||[]).forEach(nightId=>{
        const nightDoc = fd(nightId); if(!nightDoc) return;
        if (clinicClosedOnLeave(nightDoc,date,leaves)) return; // clinic closed during leave
        const slots = [];
        if (isClinic(getSlot(nightDoc,di,"am")) && !(nd.coverages.am||[]).length) slots.push({key:"am",covDate:date,covDi:di});
        if (isClinic(getSlot(nightDoc,di,"pm")) && !(nd.coverages.pm||[]).length) slots.push({key:"pm",covDate:date,covDi:di});
        if (isClinic(getSlot(nightDoc,nextDi,"am")) && !(nd.coverages.nextAm||[]).length) slots.push({key:"nextAm",covDate:nextDate,covDi:nextDi});
        slots.forEach(({key,covDate,covDi})=>{
          // candidates: not on leave, not blocked, not the night doctor, not already busy that period
          const avail = getAvailable(doctors, nd.doctors||[], covDi, covDate, key==="pm"?"pm":"am", leaves, nightData, { [key]: nd.coverages[key]||[] }, coverages)
            .filter(x=>x.status==="free");
          if (!avail.length) return;
          // pick least loaded
          avail.sort((a,b)=>(load[a.doc.id]||0)-(load[b.doc.id]||0));
          const chosen = avail[0].doc;
          nd.coverages[key] = [...(nd.coverages[key]||[]), chosen.id];
          load[chosen.id] = (load[chosen.id]||0) + 1;
          filled++;
        });
      });
    });
    if (filled>0) { updateNight(next); showToast(`✅ تم توزيع ${filled} تغطية معلّقة بعدالة`); }
    else showToast("لا توجد تغطيات معلّقة قابلة للتوزيع", "warn");
  };

  const clearMonth = (year, month) => {
    const next = { ...nightData };
    Object.keys(next).forEach(date => {
      const [y,m] = date.split("-");
      if (+y===year && +m===month+1) delete next[date];
    });
    updateNight(next);
    // also clear individual coverages for this month
    const cleanedCov = coverages.filter(c => { const [y,m]=c.date.split("-"); return !(+y===year && +m===month+1); });
    if (cleanedCov.length !== coverages.length) updateCoverages(cleanedCov);
    showToast("تم تصفير الشهر (الدوام + التغطيات)", "warn");
  };

  const resetDay = (date) => {
    const next = { ...nightData };
    delete next[date];
    updateNight(next);
    const cleanedCov = coverages.filter(c => c.date !== date);
    if (cleanedCov.length !== coverages.length) updateCoverages(cleanedCov);
    showToast("تم إعادة تعيين اليوم", "warn");
  };

  const copyDay = (fromDate, toDate) => {
    const src = nightData[fromDate];
    if (!src) { showToast("لا يوجد دوام في اليوم المصدر", "warn"); return; }
    const next = { ...nightData, [toDate]: JSON.parse(JSON.stringify(src)) };
    updateNight(next);
    showToast("تم نسخ الدوام");
  };

  const setDayNote = (date, note) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const next = { ...nightData, [date]: { ...cur, note } };
    updateNight(next);
  };

  const setDaySlots = (date, slots) => {
    const cur = nightData[date] || { doctors:[], coverages:{ am:[], pm:[], nextAm:[] } };
    const next = { ...nightData, [date]: { ...cur, eveningSlots: Math.max(1, slots) } };
    updateNight(next);
  };

  // Copy a whole month's night assignments to another month, matching by weekday & week index
  const copyMonth = (fromY, fromM, toY, toM) => {
    const next = { ...nightData };
    // Build source list ordered
    const srcDim = new Date(fromY, fromM+1, 0).getDate();
    const srcDays = [];
    for (let d=1; d<=srcDim; d++){ const date=`${fromY}-${String(fromM+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayIdx(date)>=0) srcDays.push(date); }
    const tgtDim = new Date(toY, toM+1, 0).getDate();
    const tgtDays = [];
    for (let d=1; d<=tgtDim; d++){ const date=`${toY}-${String(toM+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayIdx(date)>=0) tgtDays.push(date); }
    let copied = 0;
    tgtDays.forEach((tDate, i) => {
      const sDate = srcDays[i];
      if (sDate && nightData[sDate]?.doctors?.length) {
        next[tDate] = JSON.parse(JSON.stringify(nightData[sDate]));
        copied++;
      }
    });
    updateNight(next);
    showToast(`✅ تم نسخ ${copied} يوم`);
  };

  // Swap two doctors across the whole month: every night/coverage assignment of A becomes B and vice versa
  const swapDoctors = (idA, idB) => {
    if (!idA || !idB || idA===idB) { showToast("اختر طبيبين مختلفين", "warn"); return; }
    const swapId = id => id===idA ? idB : id===idB ? idA : id;
    const next = {};
    Object.entries(nightData).forEach(([date,nd])=>{
      const c = nd.coverages||{};
      next[date] = {
        ...nd,
        doctors: (nd.doctors||[]).map(swapId),
        coverages: { am:(c.am||[]).map(swapId), pm:(c.pm||[]).map(swapId), nextAm:(c.nextAm||[]).map(swapId) }
      };
    });
    updateNight(next);
    const newCov = coverages.map(cv=>({ ...cv, coverDoctorId:swapId(cv.coverDoctorId), absentId:cv.absentId?swapId(cv.absentId):cv.absentId }));
    updateCoverages(newCov);
    showToast(`✅ تم التبديل بين ${fd(idA)?.name} و ${fd(idB)?.name}`);
  };

  const pendingCount = useMemo(() => {
    let count = 0;
    Object.entries(nightData).forEach(([date, nd]) => {
      (nd.doctors||[]).forEach(did => {
        const d = fd(did); if (!d) return;
        const di = dayIdx(date);
        const ndi = dayIdx(nextWork(date));
        const covs = nd.coverages || {};
        if (isClinic(getSlot(d,di,"am"))  && !(covs.am||[]).length)     count++;
        if (isClinic(getSlot(d,di,"pm"))  && !(covs.pm||[]).length)     count++;
        if (isClinic(getSlot(d,ndi,"am")) && !(covs.nextAm||[]).length) count++;
      });
    });
    return count;
  }, [nightData, doctors]);

  const TABS = [
    { id:"dashboard",icon:"📊", label:"لوحة التحكم" },
    { id:"monthly",  icon:"🗓", label:"إدارة الدوام والتغطيات" },
    { id:"doctors",  icon:"👨‍⚕️", label:"الأطباء" },
    { id:"leaves",   icon:"🏖", label:"الإجازات" },
    { id:"stats",    icon:"📈", label:"الإحصائيات" },
  ];

  if (!authed) return <LoginGate onSuccess={() => { setAuthed(true); S.set("fin_auth", true); }} />;

  const signOut = () => { try { if (window.fbAuth) window.fbAuth.signOut(); } catch(e){} S.set("fin_auth", false); setAuthed(false); setRole("admin"); setMyDoctorId(null); };
  // انتظر حتى تُحسم الصلاحية وتُحمّل البيانات قبل عرض أي شيء (يمنع ظهور واجهة المدير للطبيب)
  if (!cloudReady) return <div className="loading">⏳ جاري التحقق من الصلاحيات...</div>;
  if (role === "blocked") return <BlockedScreen onSignOut={signOut} />;
  // حساب الطبيب يرى صفحته فقط (قراءة فقط)
  if (role === "doctor") return <DoctorView doctor={fd(myDoctorId)} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} today={today} onSignOut={signOut} />;

  return (
    <div style={{ display:"flex", minHeight:"100vh", background:"#f0f4f8", direction:"rtl", fontFamily:"'Segoe UI',Tahoma,sans-serif", fontSize:14 }}>
      {/* SIDEBAR */}
      <aside style={{ width:210, background:"#fff", display:"flex", flexDirection:"column", flexShrink:0, boxShadow:"2px 0 12px rgba(0,0,0,.04)", zIndex:2 }}>
        <div style={{ padding:"22px 18px 16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ width:38, height:38, borderRadius:11, background:"linear-gradient(135deg,#1e3a5f,#2c5282)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, color:"#fff", boxShadow:"0 4px 12px rgba(30,58,95,.35)" }}>⚕</div>
            <div>
              <div style={{ color:"#1e293b", fontWeight:800, fontSize:14 }}>الجداول الطبية</div>
              <div style={{ color:"#94a3b8", fontSize:10 }}>مركز طب الأسنان التخصصي</div>
            </div>
          </div>
        </div>
        <div style={{ height:1, background:"#f1f5f9", margin:"0 16px 10px" }} />
        <nav style={{ padding:"0 12px", flex:1 }}>
          {TABS.map(t => {
            const active = page===t.id;
            return (
              <button key={t.id} onClick={() => setPage(t.id)}
                style={{ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"11px 14px", borderRadius:10, border:"none", cursor:"pointer", fontSize:13, fontWeight:active?700:500, marginBottom:4, transition:"all .15s", position:"relative",
                  background: active ? "linear-gradient(135deg,#1e3a5f,#2c5282)" : "transparent",
                  color: active ? "#fff" : "#64748b",
                  boxShadow: active ? "0 4px 12px rgba(30,58,95,.3)" : "none",
                }}>
                <span style={{ width:26, height:26, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, background: active?"rgba(255,255,255,.2)":"#f1f5f9" }}>{t.icon}</span>
                {t.label}
                {t.id==="monthly" && pendingCount>0 && (
                  <span style={{ position:"absolute", left:10, background:"#ef4444", color:"#fff", borderRadius:10, padding:"1px 7px", fontSize:10, fontWeight:700 }}>{pendingCount}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div style={{ padding:14, margin:12, borderRadius:12, background:"linear-gradient(135deg,#eff4fa,#e2ecf7)" }}>
          <div style={{ color:"#94a3b8", fontSize:10, marginBottom:8 }}>📅 {today}</div>
          <button onClick={() => { save(); showToast("✅ تم الحفظ"); }}
            style={{ width:"100%", padding:"8px", background:"linear-gradient(135deg,#1e3a5f,#2c5282)", border:"none", borderRadius:8, color:"#fff", cursor:"pointer", fontSize:11, fontWeight:700, boxShadow:"0 3px 10px rgba(30,58,95,.25)" }}>
            💾 حفظ الكل
          </button>
          <button onClick={doUndo} disabled={!undoStack.length}
            style={{ width:"100%", padding:"7px", marginTop:6, background: undoStack.length?"#fff":"#f1f5f9", border:"1px solid #cdddec", borderRadius:8, color: undoStack.length?"#2c5282":"#cbd5e1", cursor: undoStack.length?"pointer":"default", fontSize:10, fontWeight:700 }}>
            ↩️ تراجع {undoStack.length>0?`(${undoStack.length})`:""}
          </button>
          <div style={{ marginTop:10, padding:"8px", background:"#f8fafc", borderRadius:9, border:"1px solid #eef2f7" }}>
            <div style={{ fontSize:9, color:"#94a3b8", fontWeight:700, marginBottom:5, textAlign:"center" }}>💾 النسخ الاحتياطي</div>
            <div style={{ display:"flex", gap:5 }}>
              <button onClick={() => { const data={docs:S.get("fin_docs"),leaves:S.get("fin_leaves"),night:S.get("fin_night"),cov:S.get("fin_cov"),approvals:S.get("fin_approvals"),exported:new Date().toISOString()}; const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`نسخة_احتياطية_${new Date().toISOString().split("T")[0]}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1500); S.set("fin_lastbackup", new Date().toISOString()); showToast("✅ تم حفظ النسخة"); }}
                style={{ flex:1, padding:"7px", background:"#2c5282", border:"none", borderRadius:7, color:"#fff", cursor:"pointer", fontSize:9, fontWeight:700 }}>⬇️ حفظ نسخة</button>
              <label style={{ flex:1, padding:"7px", background:"#fff", border:"1px solid #cdddec", borderRadius:7, color:"#2c5282", cursor:"pointer", fontSize:9, fontWeight:700, textAlign:"center" }}>
                ⬆️ استعادة
                <input type="file" accept=".json" style={{ display:"none" }} onChange={e=>{ if(e.target.files[0]) restoreBackup(e.target.files[0]); }} />
              </label>
            </div>
          </div>
          <button onClick={() => { if(window.fbAuth) window.fbAuth.signOut(); S.set("fin_auth", false); setAuthed(false); }}
            style={{ width:"100%", padding:"6px", marginTop:8, background:"transparent", border:"1px solid #cdddec", borderRadius:8, color:"#2c5282", cursor:"pointer", fontSize:10, fontWeight:600 }}>
            🔒 قفل
          </button>
        </div>
      </aside>

      {/* MAIN */}
      <main style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
        <div style={{ background:"#fff", padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", boxShadow:"0 2px 12px rgba(30,58,95,.05)" }}>
          <div>
            <div style={{ fontWeight:800, fontSize:19, color:"#0f1e36", letterSpacing:"-0.3px" }}>{TABS.find(t=>t.id===page)?.label}</div>
            <div style={{ fontSize:11, color:"#94a3b8" }}>الرئيسية / {TABS.find(t=>t.id===page)?.label}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:12, color:"#64748b", fontWeight:600 }}>{MONTHS[new Date().getMonth()]} {new Date().getFullYear()}</span>
            <div style={{ width:36, height:36, borderRadius:10, background:"linear-gradient(135deg,#1e3a5f,#2c5282)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:700, fontSize:14 }}>د</div>
          </div>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:22 }}>
          {page==="dashboard" && <DashboardPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} today={today} onGoto={setPage} onLoadSeed={loadJuneSeed} onImportExcel={importExcel} onAddIndiv={addIndivCoverage} onRemoveDuties={removeAllDutiesForDay} onAddDoc={addNightDoc} />}
          {page==="monthly" && <MonthlyPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} today={today} onAutoFill={(y,m,mode) => { let base = nightData; if(mode==="all"){ base={}; Object.keys(nightData).forEach(d=>{const [yy,mm]=d.split("-"); if(+yy!==y||+mm!==m+1) base[d]=nightData[d];}); } const next=autoFill(y,m,doctors,leaves,base); updateNight(next); showToast(mode==="all"?"✅ تم التوزيع الكامل":"✅ تم إكمال الأيام الناقصة"); }} onAddDoc={addNightDoc} onRemoveDoc={removeNightDoc} onAddCov={addCoverage} onRemoveCov={removeCoverage} onClearMonth={clearMonth} onResetDay={resetDay} onCopyDay={copyDay} onSetNote={setDayNote} onEnsureDay={ensureDay} onCopyMonth={copyMonth} onSwap={swapDoctors} approvals={approvals} onApprove={setMonthApproval} onAddIndiv={addIndivCoverage} onRemoveIndiv={removeIndivCoverage} onAutoFillPending={autoFillPending} onSetSlots={setDaySlots} />}
          {page==="doctors"  && <DoctorsPage doctors={doctors} leaves={leaves} today={today} fd={fd} onUpdateDocs={updateDocs} showToast={showToast} />}
          {page==="leaves"   && <LeavesPage doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} today={today} fd={fd} onUpdate={(next) => { setLeaves(next); S.set("fin_leaves",next); }} onAddIndiv={addIndivCoverage} onRemoveIndiv={removeIndivCoverage} showToast={showToast} />}
          {page==="stats"    && <StatsPage doctors={doctors} nightData={nightData} coverages={coverages} leaves={leaves} />}
        </div>
      </main>

      {toast && (
        <div style={{ position:"fixed", bottom:20, left:"50%", transform:"translateX(-50%)", background: toast.type==="warn"?"#d97706":"#15803d", color:"#fff", padding:"10px 24px", borderRadius:28, fontWeight:700, fontSize:13, zIndex:9999, boxShadow:"0 4px 16px rgba(0,0,0,.2)" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// DASHBOARD PAGE (Material-style)
// ══════════════════════════════════════════════════════
function DashboardPage({ doctors, leaves, nightData, coverages, fd, today, onGoto, onLoadSeed, onImportExcel, onAddIndiv, onRemoveDuties, onAddDoc }) {
  const [covDate, setCovDate] = useState("");
  const now = new Date();
  const thisMonth = (ds) => { const [y,m]=ds.split("-"); return +y===now.getFullYear() && +m===now.getMonth()+1; };

  // Stats
  const monthNights = Object.entries(nightData).filter(([d,nd])=>thisMonth(d)&&(nd.doctors||[]).length);
  const totalNightAssigns = monthNights.reduce((a,[,nd])=>a+(nd.doctors||[]).length,0);
  const totalCovs = Object.entries(nightData).filter(([d])=>thisMonth(d)).reduce((a,[,nd])=>{const c=nd.coverages||{};return a+(c.am||[]).length+(c.pm||[]).length+(c.nextAm||[]).length;},0) + coverages.filter(c=>thisMonth(c.date)).length;
  const activeLeaves = leaves.filter(l=>l.start<=today && today<=l.end).length;
  let pending = 0;
  Object.entries(nightData).forEach(([date,nd])=>{
    if(!thisMonth(date)) return;
    const di=dayIdx(date), nextDi=dayIdx(nextWork(date)), covs=nd.coverages||{};
    (nd.doctors||[]).map(id=>fd(id)).filter(Boolean).forEach(d=>{
      if(isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)pending++;
      if(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)pending++;
      if(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length)pending++;
    });
  });

  const cards = [
    { icon:"🌙", label:"الدوام المسائي (الشهر)", val:totalNightAssigns, bg:"#eef4fb", ic:"#1e3a5f", page:"monthly" },
    { icon:"🔄", label:"التغطيات (الشهر)", val:totalCovs, bg:"#eefaf3", ic:"#15803d", page:"coverage" },
    { icon:"⚠️", label:"تغطيات معلّقة", val:pending, bg:"#fdeef0", ic:"#dc2626", page:"monthly" },
    { icon:"🏖", label:"إجازات حالية", val:activeLeaves, bg:"#fdf6ec", ic:"#d97706", page:"leaves" },
  ];

  // Per-day distribution chart (this month) — nights count per day-of-week
  const byWeekday = [0,1,2,3,4].map(di => {
    let count = 0;
    Object.entries(nightData).forEach(([date,nd])=>{ if(thisMonth(date)&&dayIdx(date)===di) count+=(nd.doctors||[]).length; });
    return count;
  });
  const maxWd = Math.max(...byWeekday, 1);

  // Top loaded doctors (this month extra load)
  const loads = doctors.map(doc=>{
    const fixedDays = doc.nightDays||[];
    let extra=0, covCount=0;
    Object.entries(nightData).forEach(([date,nd])=>{
      if(!thisMonth(date)) return;
      if((nd.doctors||[]).includes(doc.id) && !fixedDays.includes(dayIdx(date))) extra++;
      const c=nd.coverages||{};
      covCount += ((c.am||[]).includes(doc.id)?1:0)+((c.pm||[]).includes(doc.id)?1:0)+((c.nextAm||[]).includes(doc.id)?1:0);
    });
    covCount += coverages.filter(c=>c.coverDoctorId===doc.id && thisMonth(c.date)).length;
    return { doc, load: (extra*2)+covCount };
  }).filter(x=>x.load>0).sort((a,b)=>b.load-a.load).slice(0,6);
  const maxLoad = Math.max(...loads.map(l=>l.load), 1);

  const analysis = analyzeMonth(now.getFullYear(), now.getMonth(), doctors, leaves, nightData, coverages);
  const conflicts = analysis.conflicts;
  const gaps = analysis.gaps;
  const slotLabel = p => p==="am"?"صباح":p==="pm"?"ظهر":"مسائي";

  // This week (Sunday → Thursday)
  const todayD = new Date(now); const dow = todayD.getDay();
  const sunday = new Date(todayD); sunday.setDate(todayD.getDate() - ((dow+0)%7)); // back to Sunday
  const weekDates = Array.from({length:5},(_,i)=>{ const d=new Date(sunday); d.setDate(sunday.getDate()+i); return d.toISOString().split("T")[0]; });
  const weekSet = new Set(weekDates);
  // Evening doctors this week
  const weekNight = [];
  weekDates.forEach(date=>{ const nd=nightData[date]; (nd?.doctors||[]).forEach(id=>{const d=fd(id);if(d)weekNight.push({d,date,di:dayIdx(date)});}); });
  // On leave this week
  const weekLeave = doctors.filter(d=>leaves.some(l=>l.doctorId===d.id && l.start<=weekDates[4] && l.end>=weekDates[0]))
    .map(d=>{ const l=leaves.find(l=>l.doctorId===d.id && l.start<=weekDates[4] && l.end>=weekDates[0]); return { d, l }; });
  // Coverage duties this week
  const weekCov = [];
  weekDates.forEach(date=>{
    const nd=nightData[date]; const c=nd?.coverages||{};
    [...(c.am||[]),...(c.pm||[]),...(c.nextAm||[])].forEach(id=>{const d=fd(id);if(d)weekCov.push({d,date});});
    coverages.filter(cv=>cv.date===date).forEach(cv=>{const d=fd(cv.coverDoctorId);if(d)weekCov.push({d,date});});
  });
  const uniqByDoc = arr => { const seen={}; return arr.filter(x=>{ if(seen[x.d.id])return false; seen[x.d.id]=1; return true; }); };

  // Calendar grid for current month
  const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const calCells = [];
  for(let d=1; d<=dim; d++){ const date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; const di=dayIdx(date); if(di>=0) calCells.push({date,di,d}); }
  const firstOff = calCells[0]?.di ?? 0;
  const [calSel, setCalSel] = useState(null);


  return (
    <div>
      {/* Gaps — uncovered open clinics with one-click fix */}
      {gaps.length>0 && (
        <div style={{ background:"#fff7ed", border:"1px solid #fed7aa", borderRadius:14, padding:"14px 18px", marginBottom:16 }}>
          <div style={{ fontWeight:800, fontSize:14, color:"#c2410c", marginBottom:10 }}>🔶 عيادات مكشوفة تحتاج تغطية ({gaps.length})</div>
          {gaps.map((g,i)=>{
            // candidates: free that period, not the owner, not on leave, not busy
            const an = analyzeDay(g.date, doctors, leaves, nightData, coverages, null);
            const occ = an.occupied||{am:{},pm:{},evening:{}};
            const cands = doctors.filter(d=>
              d.id!==g.ownerId &&
              !(occ[g.period]?.[d.id]?.length) &&
              !(occ.evening?.[d.id]?.length) &&
              !onLeave(d,g.date,leaves) &&
              !(d.blockedDays||[]).includes(g.di) &&
              !isClinic(getSlot(d,g.di,g.period))
            );
            const sugg = (g.suggestions||[]).filter(id=>cands.find(c=>c.id===id));
            const top = sugg[0];
            return (
              <div key={i} style={{ padding:"9px 0", borderTop:i>0?"1px solid #fed7aa":"none" }}>
                <div style={{ fontSize:12, color:"#9a3412", marginBottom:6 }}>
                  🔸 عيادة <strong>{fd(g.ownerId)?.name}</strong> ({slotLabel(g.period)}) يوم {fmtDate(g.date)} — {g.reason}
                </div>
                <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
                  {top && (
                    <button onClick={()=>onAddIndiv({ date:g.date, period:g.period, coverDoctorId:top, absentId:g.ownerId, reason:"absence" })}
                      style={{ background:"#15803d", color:"#fff", border:"none", borderRadius:7, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer" }}>
                      ⚡ تعيين {fd(top)?.name}
                    </button>
                  )}
                  <select value="" onChange={e=>{ if(e.target.value) onAddIndiv({ date:g.date, period:g.period, coverDoctorId:+e.target.value, absentId:g.ownerId, reason:"absence" }); }}
                    style={{ ...SEL, width:"auto", flex:"0 1 200px", fontSize:12, padding:"6px 10px" }}>
                    <option value="">— اختر طبيباً آخر —</option>
                    {cands.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                  {cands.length===0 && <span style={{ fontSize:11, color:"#dc2626" }}>لا يوجد طبيب متاح</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Conflicts alert with fix buttons */}
      {conflicts.length>0 && (
        <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:14, padding:"14px 18px", marginBottom:16 }}>
          <div style={{ fontWeight:800, fontSize:14, color:"#dc2626", marginBottom:10 }}>⚠️ تعارضات تحتاج انتباه ({conflicts.length})</div>
          {conflicts.map((c,i)=>{
            const fixable = c.type==="absent-busy" && c.docId && c.date;
            // suggest a replacement (least loaded, free, not absent) for night shift if applicable
            let sugg = null;
            if (fixable && c.inNight) {
              const an = analyzeDay(c.date, doctors, leaves, nightData, coverages, null);
              const occ = an.occupied||{am:{},pm:{},evening:{}};
              const di = dayIdx(c.date);
              const cands = doctors.filter(d=>
                d.id!==c.docId && !(d.nightDays&&d.nightDays.length) &&
                !onLeave(d,c.date,leaves) && !(d.blockedDays||[]).includes(di) &&
                !(occ.evening?.[d.id]?.length) && !(occ.am?.[d.id]?.length) && !(occ.pm?.[d.id]?.length)
              );
              sugg = cands[0]?.id;
            }
            return (
              <div key={i} style={{ padding:"8px 0", borderTop:i>0?"1px solid #fecaca":"none" }}>
                <div style={{ fontSize:12, color:"#991b1b", marginBottom:fixable?6:0 }}>🔴 {c.text}</div>
                {fixable && (
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    <button onClick={()=>onRemoveDuties(c.date, c.docId)} style={{ background:"#dc2626", color:"#fff", border:"none", borderRadius:7, padding:"5px 12px", fontSize:11, fontWeight:700, cursor:"pointer" }}>🗑️ إزالة التكليف</button>
                    {c.inNight && (sugg
                      ? <button onClick={()=>{ onRemoveDuties(c.date, c.docId); setTimeout(()=>onAddDoc(c.date, sugg), 60); }} style={{ background:"#15803d", color:"#fff", border:"none", borderRadius:7, padding:"5px 12px", fontSize:11, fontWeight:700, cursor:"pointer" }}>🔄 استبدال بـ {fd(sugg)?.name}</button>
                      : <span style={{ fontSize:10, color:"#dc2626", alignSelf:"center" }}>لا يوجد بديل متاح للاستبدال</span>
                    )}
                    <button onClick={()=>onGoto("monthly")} style={{ background:"#fff", color:"#1e3a5f", border:"1px solid #cdddec", borderRadius:7, padding:"5px 12px", fontSize:11, fontWeight:700, cursor:"pointer" }}>فتح في الجدول</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Stat cards */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:12, marginBottom:20 }}>
        {cards.map(c => (
          <div key={c.label} onClick={()=>onGoto(c.page)} style={{ background:c.bg, borderRadius:16, padding:"16px", cursor:"pointer", border:"1px solid rgba(0,0,0,.04)" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
              <div style={{ fontSize:11, color:"#64748b", fontWeight:600 }}>{c.label}</div>
              <div style={{ width:34, height:34, borderRadius:10, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:17 }}>{c.icon}</div>
            </div>
            <div style={{ fontSize:32, fontWeight:800, color:c.ic, lineHeight:1 }}>{c.val}</div>
          </div>
        ))}
      </div>

      {/* Big monthly calendar */}
      <div style={{ background:"#fff", borderRadius:16, padding:18, marginBottom:20, boxShadow:"0 4px 16px rgba(30,58,95,.06)" }}>
        <div style={{ fontWeight:800, fontSize:16, marginBottom:14 }}>📅 تقويم {MONTHS[now.getMonth()]} {now.getFullYear()}</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:6 }}>
          {DAYS.map(d=><div key={d} style={{ textAlign:"center", fontSize:12, fontWeight:700, color:"#64748b", padding:"4px 0" }}>{d}</div>)}
          {Array.from({length:firstOff},(_, i)=><div key={`o${i}`} />)}
          {calCells.map(({date,di,d})=>{
            const nd=nightData[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
            const indivN = coverages.filter(c=>c.date===date).length;
            const r = analyzeDay(date, doctors, leaves, nightData, coverages, null);
            const isToday = date===today;
            const isSel = calSel===date;
            return (
              <div key={date} onClick={()=>setCalSel(isSel?null:date)} style={{ minHeight:64, borderRadius:10, border: isToday?"2px solid #2c5282":"1px solid #eef2f7", background: isSel?"#eff4fb":"#fbfdff", padding:"5px 6px", cursor:"pointer", overflow:"hidden" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span style={{ fontSize:13, fontWeight:800, color: isToday?"#2c5282":"#1e293b" }}>{d}</span>
                  {(r.gaps.length>0||r.conflicts.length>0) && <span style={{ width:7, height:7, borderRadius:"50%", background:"#dc2626" }} />}
                </div>
                {docs.slice(0,2).map(dc=>(
                  <div key={dc.id} style={{ fontSize:9, fontWeight:700, color:"#fff", background:dc.color, borderRadius:4, padding:"1px 4px", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>🌙 {sn(dc.name)}</div>
                ))}
                {indivN>0 && <div style={{ fontSize:9, color:"#ea580c", marginTop:2 }}>🔄 {indivN}</div>}
              </div>
            );
          })}
        </div>
        {calSel && (() => {
          const nd=nightData[calSel]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
          const ind=coverages.filter(c=>c.date===calSel);
          return (
            <div style={{ marginTop:12, padding:"12px 14px", background:"#f8fafc", borderRadius:10, border:"1px solid #eef2f7" }}>
              <div style={{ fontWeight:800, fontSize:13, marginBottom:6 }}>{DAYS[dayIdx(calSel)]} {calSel.split("-")[2]}/{+calSel.split("-")[1]}</div>
              {docs.length>0 ? docs.map(d=><span key={d.id} style={{ display:"inline-block", background:d.color+"18", color:d.color, border:`1px solid ${d.color}44`, borderRadius:14, padding:"3px 10px", fontSize:12, fontWeight:700, margin:"2px" }}>🌙 {d.name}</span>) : <span style={{ fontSize:12, color:"#94a3b8" }}>لا دوام مسائي</span>}
              {ind.map(c=>{const cd=fd(c.coverDoctorId);return cd&&<span key={c.id} style={{ display:"inline-block", background:"#fff7ed", color:"#ea580c", border:"1px solid #fed7aa", borderRadius:14, padding:"3px 10px", fontSize:12, fontWeight:700, margin:"2px" }}>🔄 {cd.name}</span>;})}
            </div>
          );
        })()}
      </div>

      {/* This week — three cards */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:14, marginBottom:20 }}>
        {/* Evening this week */}
        <div style={{ background:"#fff", borderRadius:16, padding:16, boxShadow:"0 4px 16px rgba(30,58,95,.06)", borderTop:"3px solid #2c5282" }}>
          <div style={{ fontWeight:800, fontSize:13, color:"#2c5282", marginBottom:10 }}>🌙 الدوام المسائي هذا الأسبوع</div>
          {weekNight.length>0 ? weekNight.map(({d,date,di},i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:7 }}>
              <span style={{ fontSize:10, color:"#94a3b8", minWidth:34 }}>{DAYS[di]}</span>
              <span style={{ width:22, height:22, borderRadius:"50%", background:d.color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800 }}>{sn(d.name).slice(0,2)}</span>
              <span style={{ fontSize:13, fontWeight:700, color:d.color }}>{d.name}</span>
            </div>
          )) : <div style={{ fontSize:12, color:"#cbd5e1" }}>لا يوجد</div>}
        </div>
        {/* On leave this week */}
        <div style={{ background:"#fff", borderRadius:16, padding:16, boxShadow:"0 4px 16px rgba(30,58,95,.06)", borderTop:"3px solid #d97706" }}>
          <div style={{ fontWeight:800, fontSize:13, color:"#d97706", marginBottom:10 }}>🏖 في إجازة هذا الأسبوع</div>
          {weekLeave.length>0 ? weekLeave.map(({d,l},i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:7 }}>
              <span style={{ width:22, height:22, borderRadius:"50%", background:d.color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800 }}>{sn(d.name).slice(0,2)}</span>
              <span style={{ fontSize:13, fontWeight:700, color:"#475569" }}>{d.name}</span>
              <span style={{ fontSize:9, color: l.clinicClosed!==false?"#15803d":"#ea580c" }}>{l.clinicClosed!==false?"🔒":"🔄"}</span>
            </div>
          )) : <div style={{ fontSize:12, color:"#cbd5e1" }}>لا يوجد</div>}
        </div>
        {/* Coverage this week */}
        <div style={{ background:"#fff", borderRadius:16, padding:16, boxShadow:"0 4px 16px rgba(30,58,95,.06)", borderTop:"3px solid #15803d" }}>
          <div style={{ fontWeight:800, fontSize:13, color:"#15803d", marginBottom:10 }}>🔄 لديه تغطية هذا الأسبوع</div>
          {uniqByDoc(weekCov).length>0 ? uniqByDoc(weekCov).map(({d},i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:7 }}>
              <span style={{ width:22, height:22, borderRadius:"50%", background:d.color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800 }}>{sn(d.name).slice(0,2)}</span>
              <span style={{ fontSize:13, fontWeight:700, color:"#475569" }}>{d.name}</span>
            </div>
          )) : <div style={{ fontSize:12, color:"#cbd5e1" }}>لا يوجد</div>}
        </div>
      </div>

      {/* Top loaded doctors */}
      <div style={{ marginBottom:20 }}>
        <div style={{ background:"#fff", borderRadius:16, padding:18, boxShadow:"0 4px 16px rgba(30,58,95,.06)" }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>📈 أكثر الأطباء عبئاً</div>
          <div style={{ fontSize:11, color:"#94a3b8", marginBottom:16 }}>العبء الإضافي (هذا الشهر)</div>
          {loads.length===0 ? <div style={{ fontSize:12, color:"#cbd5e1", textAlign:"center", padding:"30px 0" }}>لا يوجد عبء إضافي بعد</div> :
            loads.map(({doc,load})=>(
              <div key={doc.id} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:9 }}>
                <span style={{ fontSize:11, fontWeight:600, minWidth:90, maxWidth:110, color:"#475569" }}>{doc.name}</span>
                <div style={{ flex:1, height:10, background:"#f1f5f9", borderRadius:6, overflow:"hidden" }}>
                  <div style={{ height:"100%", width:`${(load/maxLoad)*100}%`, background:`linear-gradient(90deg,${doc.color},${doc.color}aa)`, borderRadius:6 }} />
                </div>
                <span style={{ fontSize:12, fontWeight:800, color:doc.color, minWidth:18, textAlign:"center" }}>{load}</span>
              </div>
            ))
          }
        </div>
      </div>

      {/* Quick actions */}
      <div style={{ background:"#fff", borderRadius:16, padding:18, border:"1px solid #eef2f7" }}>
        <div style={{ fontWeight:700, fontSize:14, marginBottom:12, color:"#1e293b" }}>⚡ إجراءات سريعة</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:10 }}>
          {[{l:"🌙 الدوام والتغطيات",p:"monthly",bg:"#eef4fb",c:"#1e3a5f"},
            {l:"👨‍⚕️ الأطباء",p:"doctors",bg:"#f3f0fb",c:"#6d28d9"},
            {l:"🏖 الإجازات",p:"leaves",bg:"#eefaf3",c:"#15803d"},
            {l:"📈 الإحصائيات",p:"stats",bg:"#fdf6ec",c:"#d97706"},
          ].map(b=>(
            <button key={b.p} onClick={()=>onGoto(b.p)} style={{ padding:"15px", borderRadius:12, border:"1px solid rgba(0,0,0,.04)", cursor:"pointer", color:b.c, fontWeight:700, fontSize:13, background:b.bg }}>{b.l}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

// MONTHLY PAGE

// Full-page individual coverages with month navigation
function CoveragePageFull({ doctors, leaves, nightData, coverages, fd, onAddIndiv, onRemoveIndiv }) {
  const now = new Date();
  const [month, setMonth] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const calDays = useMemo(() => {
    const dim = new Date(month.y, month.m+1, 0).getDate();
    return Array.from({length:dim},(_,i)=>{ const d=i+1; const date=`${month.y}-${String(month.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; return { date, di:dayIdx(date), day:d }; }).filter(x=>x.di>=0);
  }, [month]);
  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:16 }}>
        <button onClick={()=>setMonth(p=>p.m===0?{y:p.y-1,m:11}:{y:p.y,m:p.m-1})} style={Btn.nav}>→</button>
        <div style={{ fontWeight:800, fontSize:17, minWidth:130, textAlign:"center" }}>{MONTHS[month.m]} {month.y}</div>
        <button onClick={()=>setMonth(p=>p.m===11?{y:p.y+1,m:0}:{y:p.y,m:p.m+1})} style={Btn.nav}>←</button>
      </div>
      <ExtraCoveragesView date={null} doctors={doctors} leaves={leaves} nightData={nightData} coverages={coverages} fd={fd} calDays={calDays} month={month} onAddIndiv={onAddIndiv} onRemoveIndiv={onRemoveIndiv} />
    </div>
  );
}

function MonthlyPage({ doctors, leaves, nightData, coverages, fd, today, onAutoFill, onAddDoc, onRemoveDoc, onAddCov, onRemoveCov, onClearMonth, onResetDay, onCopyDay, onSetNote, onEnsureDay, onCopyMonth, onSwap, approvals, onApprove, onAddIndiv, onRemoveIndiv, onAutoFillPending, onSetSlots }) {
  const now = new Date();
  const [month, setMonth] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [selDate, setSelDate] = useState(null);
  const [filter, setFilter] = useState("all"); // all | pending | done
  const [showCal, setShowCal] = useState(false); // calendar is secondary
  const [search, setSearch] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [previewHtml, setPreviewHtml] = useState(null);
  const [showSwap, setShowSwap] = useState(false);
  const [swapA, setSwapA] = useState("");
  const [swapB, setSwapB] = useState("");
  const monthKey = `${month.y}-${month.m}`;
  const isApproved = approvals && approvals[monthKey];
  const [viewMode, setViewMode] = useState("calendar"); // calendar | table | boxes
  const [subTab, setSubTab] = useState("night"); // night | extra
  const [showTools, setShowTools] = useState(false);
  const [showPrint, setShowPrint] = useState(false);

  const calDays = useMemo(() => {
    const dim = new Date(month.y, month.m+1, 0).getDate();
    return Array.from({ length:dim }, (_,i) => {
      const d = i+1;
      const date = `${month.y}-${String(month.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      return { date, di: dayIdx(date), day: d };
    }).filter(x => x.di >= 0);
  }, [month]);

  const firstOffset = calDays[0]?.di ?? 0;

  const printPDF = () => {
    const chip = (d) => `<span style="display:inline-block;background:${d.color}22;color:${d.color};border:1px solid ${d.color}55;border-radius:5px;padding:2px 10px;margin:2px;font-weight:700">${d.name}</span>`;
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;

    // ── TABLE 1: Evening shifts — date + night doctor + their coverages described relative to shift
    const eveRows = calDays.filter(({date}) => (nightData[date]?.doctors||[]).length)
      .map(({ date, di }) => {
        const nd = nightData[date];
        const covs = nd.coverages || {};
        const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
        const nextDi = dayIdx(nextWork(date));
        // For EACH night doctor, build their own coverage status block
        const perDoc = docs.map(d => {
          const needs = [];
          if (isClinic(getSlot(d,di,"am")))     needs.push({ key:"am", label:"صباحاً" });
          if (isClinic(getSlot(d,di,"pm")))     needs.push({ key:"pm", label:"ظهراً" });
          if (isClinic(getSlot(d,nextDi,"am"))) needs.push({ key:"nextAm", label:"اليوم التالي صباحاً" });
          if (needs.length === 0) {
            return `<div style="margin-bottom:6px"><strong style="color:${d.color}">🌙 ${d.name}</strong> <span style="color:#16a34a;font-size:11px">— لا يحتاج تغطية (لا عيادة)</span></div>`;
          }
          const lines = needs.map(n => {
            const coverIds = covs[n.key]||[];
            if (!coverIds.length) return `<div style="font-size:11px;color:#dc2626;margin-right:14px">• عيادة ${n.label}: ⚠️ تحتاج تغطية (غير معيّنة)</div>`;
            const names = coverIds.map(id=>fd(id)?.name).filter(Boolean).join("، ");
            return `<div style="font-size:11px;color:#15803d;margin-right:14px">• عيادة ${n.label}: يغطّيها ${names}</div>`;
          }).join("");
          return `<div style="margin-bottom:6px"><strong style="color:${d.color}">🌙 ${d.name}</strong>${lines}</div>`;
        }).join("");
        return `<tr>
          <td style="text-align:center;vertical-align:top"><strong>${dmy(date)}</strong></td>
          <td style="text-align:center;vertical-align:top">${DAYS[di]}</td>
          <td>${perDoc}</td>
        </tr>`;
      }).join("");

    // ── TABLE 2: Coverages organized by ACTUAL occurrence date (the day the cover doctor actually works)
    // Collect all coverage events keyed by actual date
    const covByDate = {}; // date -> [{coverDoc, period, detail}]
    const pushCov = (actualDate, coverId, period, detail) => {
      const cd = fd(coverId); if(!cd) return;
      if(!covByDate[actualDate]) covByDate[actualDate] = [];
      covByDate[actualDate].push({ cd, period, detail });
    };
    // From night-shift coverages
    calDays.forEach(({ date, di }) => {
      const nd = nightData[date] || {};
      const covs = nd.coverages || {};
      const nightNames = (nd.doctors||[]).map(id=>fd(id)?.name).filter(Boolean).join("، ");
      const nextDate = nextWork(date);
      (covs.am||[]).forEach(id=>pushCov(date,   id, "صباحاً", `عيادة ${nightNames} (صاحب الدوام المسائي ${DAYS[di]} ${dmy(date)})`));
      (covs.pm||[]).forEach(id=>pushCov(date,   id, "ظهراً",  `عيادة ${nightNames} (صاحب الدوام المسائي ${DAYS[di]} ${dmy(date)})`));
      (covs.nextAm||[]).forEach(id=>pushCov(nextDate, id, "صباحاً", `عيادة ${nightNames} (صاحب الدوام المسائي ${DAYS[di]} ${dmy(date)} — اليوم التالي)`));
    });
    // From individual coverages
    (coverages||[]).forEach(c => {
      const ad = c.absentId ? fd(c.absentId) : null;
      pushCov(c.date, c.coverDoctorId, (c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً"), `تغطية فردية${ad?` بدلاً من ${ad.name}`:""}`);
    });

    // Build table 2 rows sorted by actual date
    const covRows = Object.keys(covByDate).sort().map(date => {
      const di = dayIdx(date);
      const items = covByDate[date];
      return items.map((it,idx) => `<tr>
        ${idx===0?`<td rowspan="${items.length}" style="text-align:center;vertical-align:middle"><strong>${dmy(date)}</strong><br><span style="color:#64748b;font-size:12px">${di>=0?DAYS[di]:""}</span></td>`:""}
        <td>${chip(it.cd)}</td>
        <td style="text-align:center">${it.period}</td>
        <td style="font-size:12px">${it.detail}</td>
      </tr>`).join("");
    }).join("");

    const eveTable = eveRows
      ? `<table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الدوام المسائي والتغطيات لكل طبيب</th></tr></thead><tbody>${eveRows}</tbody></table>`
      : `<p style="text-align:center;color:#94a3b8">لا يوجد دوام مسائي مسجّل</p>`;
    const covTable = covRows
      ? `<table><thead><tr><th>التاريخ الفعلي</th><th>الطبيب المُغطّي</th><th>الفترة</th><th>العيادة المُغطّاة</th></tr></thead><tbody>${covRows}</tbody></table>`
      : `<p style="text-align:center;color:#94a3b8">لا توجد تغطيات</p>`;

    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>جدول ${MONTHS[month.m]} ${month.y}</title>
    <style>
      body{font-family:Tahoma,sans-serif;padding:24px;direction:rtl;color:#1e293b}
      h1{text-align:center;font-size:22px;margin-bottom:2px}
      .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
      h2{font-size:16px;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid #1e3a8a;color:#1e3a8a}
      table{width:100%;border-collapse:collapse;margin-bottom:10px}
      th{background:#1e3a8a;color:#fff;padding:9px 12px;font-size:13px;text-align:right}
      td{border:1px solid #e2e8f0;padding:8px 12px;font-size:13px}
      tr:nth-child(even){background:#f8fafc}
      .btn{position:fixed;top:12px;left:12px;background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
      @media print{.btn{display:none}body{padding:12px}}
    </style></head><body>
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <h1>جدول الدوام المسائي والتغطيات</h1>
    <div class="sub">مركز طب الأسنان التخصصي — قسم إصلاح الأسنان — ${MONTHS[month.m]} ${month.y}</div>
    
    <h2>🌙 أولاً: جدول الدوام المسائي والتغطيات المرتبطة به</h2>
    ${eveTable}
    <h2>🔄 ثانياً: جدول التغطيات حسب اليوم الفعلي</h2>
    <div style="color:#64748b;font-size:12px;margin-bottom:8px">مرتّبة بتاريخ وقوع التغطية فعلياً (تغطية "اليوم التالي" تظهر في يومها الحقيقي)</div>
    ${covTable}
    <div style="margin-top:30px;text-align:left;font-size:13px;color:#1e293b;border-top:2px solid #e2e8f0;padding-top:14px;width:240px"><div style="font-weight:bold">رئيس قسم إصلاح الأسنان</div><div style="margin-top:6px">د. أمل العسكر</div><div style="margin-top:18px;color:#94a3b8">التوقيع: ............................</div></div>
    </body></html>`;
    // Show in-app preview with print button (window.open is blocked in artifact sandbox)
    setPreviewHtml(html);
  };

  // Print as BOXES — each day a card with date, names, coverages
  const printBoxes = () => {
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;
    const boxes = calDays.filter(({date}) => (nightData[date]?.doctors||[]).length || coverages.some(c=>c.date===date))
      .map(({ date, di }) => {
        const nd = nightData[date] || {};
        const covs = nd.coverages || {};
        const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
        const nextDi = dayIdx(nextWork(date));
        // Per night doctor: their name + coverage status
        const docBlocks = docs.map(d => {
          const needs = [];
          if (isClinic(getSlot(d,di,"am")))     needs.push({ key:"am", label:"صباحاً" });
          if (isClinic(getSlot(d,di,"pm")))     needs.push({ key:"pm", label:"ظهراً" });
          if (isClinic(getSlot(d,nextDi,"am"))) needs.push({ key:"nextAm", label:"اليوم التالي صباحاً" });
          let inner = "";
          if (needs.length === 0) {
            inner = `<div class="cov-line" style="color:#16a34a">لا يحتاج تغطية</div>`;
          } else {
            inner = needs.map(n=>{
              const ids = covs[n.key]||[];
              if (!ids.length) return `<div class="cov-line" style="color:#dc2626">${n.label}: ⚠️ غير معيّنة</div>`;
              const names = ids.map(id=>fd(id)?.name).filter(Boolean).join("، ");
              return `<div class="cov-line">${n.label}: يغطّيها ${names}</div>`;
            }).join("");
          }
          return `<div class="doc-block"><span class="doc" style="background:${d.color}22;color:${d.color};border-color:${d.color}55">🌙 ${d.name}</span>${inner}</div>`;
        }).join("");
        const indivItems = coverages.filter(c=>c.date===date).map(c=>{ const cd=fd(c.coverDoctorId); const ad=c.absentId?fd(c.absentId):null; return cd?`🔄 ${cd.name} (${(c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً")})${ad?` بدلاً من ${ad.name}`:""}`:""; }).filter(Boolean);
        return `<div class="box">
          <div class="box-head"><span class="box-date">${dmy(date)}</span><span class="box-day">${DAYS[di]}</span></div>
          <div class="box-body">${docs.length ? docBlocks : '<span class="empty">لا دوام مسائي</span>'}</div>
          ${indivItems.length ? `<div class="box-indiv"><div class="cov-title">تغطيات فردية</div>${indivItems.map(l=>`<div class="cov-line">${l}</div>`).join("")}</div>` : ""}
        </div>`;
      }).join("");

    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>مربعات ${MONTHS[month.m]} ${month.y}</title>
    <style>
      body{font-family:Tahoma,sans-serif;padding:20px;direction:rtl;color:#1e293b;background:#fff}
      h1{text-align:center;font-size:20px;margin-bottom:2px}
      .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
      .box{border:1.5px solid #cdddec;border-radius:12px;overflow:hidden;page-break-inside:avoid}
      .box-head{background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
      .box-date{font-size:18px;font-weight:800}
      .box-day{font-size:13px;font-weight:700}
      .box-docs{padding:10px 12px;display:flex;flex-wrap:wrap;gap:5px}
      .box-body{padding:10px 12px}
      .doc-block{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #eef2f7}
      .doc-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
      .doc{display:inline-block;margin-bottom:4px;border:1px solid;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700}
      .empty{color:#94a3b8;font-size:12px}
      .box-cov{padding:0 12px 10px}
      .cov-title{font-size:11px;font-weight:700;color:#475569;margin-bottom:4px;border-top:1px dashed #e2e8f0;padding-top:6px}
      .cov-line{font-size:11px;color:#15803d;margin-bottom:2px}
      .box-indiv{padding:0 12px 10px}
      .box-indiv .cov-line{color:#ea580c}
      .btn{position:fixed;top:12px;left:12px;background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}
      @media print{.btn{display:none}body{padding:8px}}
    </style></head><body>
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <h1>جدول الدوام المسائي — مربعات</h1>
    <div class="sub">مركز طب الأسنان التخصصي — قسم إصلاح الأسنان — ${MONTHS[month.m]} ${month.y}</div>
    
    <div class="grid">${boxes || '<p style="color:#94a3b8">لا توجد بيانات</p>'}</div>
    </body></html>`;
    setPreviewHtml(html);
  };

  // Download a file via blob (works on live site)
  const downloadFile = (content, filename, mime) => {
    try {
      const blob = new Blob([content], { type:mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
    } catch(e) { setPreviewHtml(`<pre dir="ltr" style="padding:20px;font-family:monospace">${content.replace(/</g,"&lt;")}</pre>`); }
  };

  // Export as Excel (.xls via HTML table — opens in Excel/Numbers)
  // Export evening shifts as ICS calendar file
  const exportICS = () => {
    let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DentalDept//Schedule//AR\r\nCALSCALE:GREGORIAN\r\n";
    calDays.filter(({date})=>(nightData[date]?.doctors||[]).length).forEach(({date,di})=>{
      const docs=(nightData[date]?.doctors||[]).map(id=>fd(id)).filter(Boolean);
      const d = date.replace(/-/g,"");
      docs.forEach(doc=>{
        ics += "BEGIN:VEVENT\r\n";
        ics += `UID:${date}-${doc.id}@dental\r\n`;
        ics += `DTSTART;VALUE=DATE:${d}\r\n`;
        ics += `SUMMARY:🌙 دوام مسائي - ${doc.name}\r\n`;
        ics += `DESCRIPTION:دوام مسائي ${DAYS[di]} - قسم إصلاح الأسنان\r\n`;
        ics += "END:VEVENT\r\n";
      });
    });
    ics += "END:VCALENDAR";
    downloadFile(ics, `الدوام_المسائي_${MONTHS[month.m]}_${month.y}.ics`, "text/calendar;charset=utf-8");
  };

  const exportExcel = () => {
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;
    let rows = "";
    calDays.filter(({date})=>(nightData[date]?.doctors||[]).length || coverages.some(c=>c.date===date)).forEach(({date,di})=>{
      const nd = nightData[date]||{}; const covs = nd.coverages||{};
      const docs = (nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
      const nextDi = dayIdx(nextWork(date));
      const covCell = [];
      docs.forEach(d=>{
        if(isClinic(getSlot(d,di,"am"))) covCell.push(`${d.name} صباحاً: ${(covs.am||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"غير معيّنة"}`);
        if(isClinic(getSlot(d,di,"pm"))) covCell.push(`${d.name} ظهراً: ${(covs.pm||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"غير معيّنة"}`);
        if(isClinic(getSlot(d,nextDi,"am"))) covCell.push(`${d.name} غداً صباحاً: ${(covs.nextAm||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"غير معيّنة"}`);
      });
      coverages.filter(c=>c.date===date).forEach(c=>{const cd=fd(c.coverDoctorId);if(cd)covCell.push(`تغطية فردية: ${cd.name} (${(c.period==="am"?"صباحاً":c.period==="evening"?"مسائي":"ظهراً")})`);});
      rows += `<tr><td>${dmy(date)}</td><td>${DAYS[di]}</td><td>${docs.map(d=>d.name).join("، ")||"—"}</td><td>${covCell.join(" | ")||"لا تغطيات"}</td></tr>`;
    });
    const xls = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>
    <table border="1"><thead><tr style="background:#1e3a5f;color:#fff;font-weight:bold">
    <th>التاريخ</th><th>اليوم</th><th>الدوام المسائي</th><th>التغطيات</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
    downloadFile("\ufeff"+xls, `الدوام_المسائي_${MONTHS[month.m]}_${month.y}.xls`, "application/vnd.ms-excel;charset=utf-8");

  };

  // Share via WhatsApp (text)
  const shareWhatsApp = () => {
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;
    let txt = `🌙 *جدول الدوام المسائي*\n📍 مركز طب الأسنان التخصصي — قسم إصلاح الأسنان\n📅 ${MONTHS[month.m]} ${month.y}\n\n`;
    calDays.filter(({date})=>(nightData[date]?.doctors||[]).length).forEach(({date,di})=>{
      const nd=nightData[date]||{}; const covs=nd.coverages||{};
      const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
      txt += `*${dmy(date)} ${DAYS[di]}*\n`;
      docs.forEach(d=>{
        txt += `  🌙 ${d.name}\n`;
        const nextDi = dayIdx(nextWork(date));
        if(isClinic(getSlot(d,di,"am"))) txt += `     • صباحاً: ${(covs.am||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"⚠️ تحتاج تغطية"}\n`;
        if(isClinic(getSlot(d,di,"pm"))) txt += `     • ظهراً: ${(covs.pm||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"⚠️ تحتاج تغطية"}\n`;
        if(isClinic(getSlot(d,nextDi,"am"))) txt += `     • غداً صباحاً: ${(covs.nextAm||[]).map(id=>fd(id)?.name).filter(Boolean).join("،")||"⚠️ تحتاج تغطية"}\n`;
      });
      txt += `\n`;
    });
    txt += `━━━━━━━━━━━━━━\nمركز طب الأسنان التخصصي\n*رئيس قسم إصلاح الأسنان*\nد. أمل العسكر`;
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, "_blank");
  };

  const shareEmailAll = () => {
    const emails = doctors.map(d=>d.email).filter(e=>e&&e.includes("@"));
    if (!emails.length) { showToast("لا توجد إيميلات مسجّلة — أضفها في صفحة الأطباء","warn"); return; }
    const dmy = (ds)=>`${ds.split("-")[2]}/${+ds.split("-")[1]}`;
    let lines = "";
    calDays.filter(({date})=>(nightData[date]?.doctors||[]).length).forEach(({date,di})=>{
      const nd=nightData[date]||{}; const covs=nd.coverages||{};
      const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean);
      lines += `${dmy(date)} ${DAYS[di]}:\n`;
      docs.forEach(d=>{
        lines += `  - دوام مسائي: ${d.name}\n`;
        const nextDi = dayIdx(nextWork(date));

  // Backup all data as JSON
  // Monthly report — full summary for management
  // Print calendar grid with full names (like the on-screen calendar)
  // Print individual sheet per doctor (their night shifts + coverages this month)
  const printDoctorSheets = () => {
    const dmy = (ds) => `${ds.split("-")[2]}/${+ds.split("-")[1]}`;

    const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>أوراق الأطباء ${MONTHS[month.m]} ${month.y}</title>
    <style>body{font-family:Tajawal,Tahoma,sans-serif;padding:20px;direction:rtl;color:#1e293b}

    table{width:100%;border-collapse:collapse}th{background:#1e3a5f;color:#fff;padding:8px;font-size:13px}td{border:1px solid #e2e8f0;padding:7px;font-size:13px}tr:nth-child(even){background:#f8fafc}

  const printCalendar = () => {

      return { doc, fixedN, extraN, covs, load:Math.max(0,(extraN*2)+covs-absD) };

    <style>body{font-family:Tahoma,sans-serif;padding:24px;direction:rtl;color:#1e293b}h1{text-align:center;font-size:22px;margin-bottom:2px}.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}

    </body></html>`;
    setPreviewHtml(html);
  };

  const exportBackup = () => {
    const data = { docs:S.get("fin_docs"), leaves:S.get("fin_leaves"), night:S.get("fin_night"), cov:S.get("fin_cov"), exported:new Date().toISOString() };
    downloadFile(JSON.stringify(data,null,2), `نسخة_احتياطية_${new Date().toISOString().split("T")[0]}.json`, "application/json");
  };

  // Summary counts
  const summary = useMemo(() => {
    let assigned=0, pending=0, totalCov=0;
    calDays.forEach(({date,di}) => {
      const nd = nightData[date];
      if (nd?.doctors?.length) {
        assigned++;
        const nextDi = dayIdx(nextWork(date));
        const covs = nd.coverages||{};
        nd.doctors.forEach(did=>{
          const d = fd(did); if(!d) return;
          if (clinicClosedOnLeave(d,date,leaves)) return; // clinic closed → no coverage needed
          if (isClinic(getSlot(d,di,"am")) && !(covs.am||[]).length) pending++;
          if (isClinic(getSlot(d,di,"pm")) && !(covs.pm||[]).length) pending++;
          if (isClinic(getSlot(d,nextDi,"am")) && !(covs.nextAm||[]).length) pending++;
        });
        totalCov += (covs.am||[]).length+(covs.pm||[]).length+(covs.nextAm||[]).length;
      }
    });
    return { assigned, pending, totalCov, indiv: coverages.filter(c=>{const [y,m]=c.date.split("-");return +y===month.y&&+m===month.m+1;}).length };
  }, [nightData, coverages, calDays, month, leaves]);

  const filledDays = calDays.filter(({date}) => {
    const nd = nightData[date];
    const hasCov = coverages.some(c=>c.date===date);
    // show any day that exists in nightData (even empty, just created), has coverages, or is selected
    const has = (nd?.doctors?.length) || hasCov || (nd && date===selDate);
    if (filter==="all") return has;
    if (filter==="pending") {
      if (!nd?.doctors?.length) return false;
      const di = dayIdx(date); const nextDi = dayIdx(nextWork(date)); const covs = nd.coverages||{};
      return nd.doctors.some(did=>{const d=fd(did);if(!d)return false;
        return (isClinic(getSlot(d,di,"am"))&&!(covs.am||[]).length)||(isClinic(getSlot(d,di,"pm"))&&!(covs.pm||[]).length)||(isClinic(getSlot(d,nextDi,"am"))&&!(covs.nextAm||[]).length);});
    }
    if (filter==="done") {
