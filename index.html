// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
const isClinic = t => t === "clinic_am" || t === "clinic_pm" || t === "clinic";
const getSlot  = (doc, di, p) => doc?.sched?.[di]?.[p] || "";
const sn       = n => n.replace("د.","").replace("د ","").trim().slice(0,5);
const wSlots   = doc => {
  let count = 0;
  Object.values(doc.sched||{}).forEach(d => {
    if (d.am && d.am !== "") count += 1;
    if (d.pm && d.pm !== "") count += 1;
  });
  // Evening clinic counts as 2 periods per fixed evening day
  const eveDays = Array.isArray(doc.nightDays) ? doc.nightDays.length : (doc.nightDay !== null && doc.nightDay !== undefined ? 1 : 0);
  count += eveDays * 2;
  return count;
};
const onLeave  = (doc, date, leaves) => !date||!doc ? false : leaves.some(l=>l.doctorId===doc.id&&l.start<=date&&date<=l.end);
// True if doctor is on a leave that CLOSES the clinic on that date (no coverage needed)
const clinicClosedOnLeave = (doc, date, leaves) => !date||!doc ? false : (leaves||[]).some(l=>l.doctorId===doc.id && l.start<=date && date<=l.end && l.clinicClosed!==false);

const dayIdx = dateStr => {
  const d = new Date(dateStr);
  const map = {0:0,1:1,2:2,3:3,4:4}; // Sun=0..Thu=4
  const wd = d.getDay();
  return wd >= 5 ? -1 : wd;
};

const nextWork = dateStr => {
  const d = new Date(dateStr);
  d.setDate(d.getDate()+1);
  while(d.getDay()>=5) d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
};

const fmtDate = dateStr => {
  const d = new Date(dateStr);
  return `${d.getDate()}/${d.getMonth()+1}`;
};

const needsCoverage = (doc, di) => ({
  am: isClinic(getSlot(doc, di, "am")),
  pm: isClinic(getSlot(doc, di, "pm")),
});

function getAvailable(doctors, excludeIds, di, date, period, leaves, nightData, coverageData, allCoverages) {
  // Doctors who are night doctors on THIS date (busy that evening / next morning)
  const nightDocIds = nightData[date]?.doctors || [];
  // Doctors already assigned to the SAME coverage slot
  const covDocIds = (coverageData[date]?.[period] || []);

  // Doctors busy covering ANY slot in nightData that maps to the SAME real time
  // same_am/same_pm -> on `date`; next_am -> on nextWork(date) morning
  const busyCovering = new Set();
  Object.entries(nightData).forEach(([d, nd]) => {
    const covs = nd.coverages || {};
    // covering same-day morning on `date`
    if (d === date && period === "am") (covs.am||[]).forEach(id => busyCovering.add(id));
    if (d === date && period === "pm") (covs.pm||[]).forEach(id => busyCovering.add(id));
    // a next_am coverage assigned on day `d` actually happens on nextWork(d) morning
    if (period === "am" && nextWork(d) === date) (covs.nextAm||[]).forEach(id => busyCovering.add(id));
    // a same-day coverage might coincide with someone's next_am target — already handled above
  });

  // Individual coverages at same date+period
  (allCoverages || []).forEach(c => {
    if (c.date === date && c.period === period) busyCovering.add(c.coverDoctorId);
  });

  const allExclude = [...new Set([...excludeIds, ...nightDocIds, ...covDocIds, ...busyCovering])];
  return doctors
    .filter(d => !allExclude.includes(d.id))
    .map(d => {
      if (onLeave(d, date, leaves)) return { doc: d, status: "leave" };
      const slot = getSlot(d, di, period);
      if (slot === "") return { doc: d, status: "free" };
      if (["admin","training","committee"].includes(slot)) return { doc: d, status: "warn", conflict: slot };
      return { doc: d, status: "busy" };
    })
    .filter(x => x.status !== "busy")
    .sort((a,b) => ({free:0,warn:1,leave:2}[a.status] - {free:0,warn:1,leave:2}[b.status]));
}

function autoFill(year, month, doctors, leaves, nightData) {
  const result = { ...nightData };
  const dim = new Date(year, month+1, 0).getDate();
  const hasNight = d => Array.isArray(d.nightDays) && d.nightDays.length > 0;
  const fd = id => doctors.find(d => d.id === id);
  const fixed = doctors.filter(hasNight);
  const rotate = doctors.filter(d => !hasNight(d));
  const usage = {}; // how many evening shifts each doctor has this month

  // STEP 0: purge any doctor who is on leave from existing assignments
  Object.keys(result).forEach(date => {
    const nd = result[date];
    if (!nd?.doctors?.length) return;
    const kept = nd.doctors.filter(id => { const d = fd(id); return d && !onLeave(d, date, leaves); });
    result[date] = { ...nd, doctors: kept };
  });

  // Count existing usage for ROTATE doctors only (fixed don't count toward fairness)
  Object.values(result).forEach(nd => (nd.doctors||[]).forEach(id => { if(rotate.find(r=>r.id===id)) usage[id] = (usage[id]||0)+1; }));
  rotate.forEach(d => { if(usage[d.id]==null) usage[d.id]=0; });

  for (let day = 1; day <= dim; day++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const di = dayIdx(date);
    if (di < 0) continue;
    const existing = result[date]?.doctors || [];
    // how many evening clinics does this day need? (per-day setting, default 1)
    const need = result[date]?.eveningSlots || 1;

    // Fixed doctors for this weekday always go in
    const fixedDocs = fixed.filter(d => d.nightDays.includes(di) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di));
    const chosen = [...new Set([...existing, ...fixedDocs.map(d=>d.id)])];

    // Fill remaining slots with rotate doctors — FAIRNESS FIRST
    const nextDi = dayIdx(nextWork(date));
    const coverageNeed = d => (isClinic(getSlot(d,di,"am"))?1:0) + (isClinic(getSlot(d,di,"pm"))?1:0) + (isClinic(getSlot(d,nextDi,"am"))?1:0);
    const prevWork = (() => { const dt=new Date(date); do { dt.setDate(dt.getDate()-1); } while(dt.getDay()>=5); return dt.toISOString().split("T")[0]; })();
    const workedYesterday = d => (result[prevWork]?.doctors||[]).includes(d.id);

    while (chosen.length < need) {
      const avail = rotate.filter(d => !chosen.includes(d.id) && !onLeave(d, date, leaves) && !(d.blockedDays||[]).includes(di))
        .sort((a,b) => {
          // PRIORITY 1: FAIRNESS — least evening shifts this month comes first
          const ua = usage[a.id]||0, ub = usage[b.id]||0;
          if (ua !== ub) return ua - ub;
          // PRIORITY 2: avoid consecutive (worked previous work day)
          const wa = workedYesterday(a)?1:0, wb = workedYesterday(b)?1:0;
          if (wa !== wb) return wa - wb;
          // PRIORITY 3: prefer doctors needing less coverage (fewer clinics to cover)
          return coverageNeed(a) - coverageNeed(b);
        });
      if (!avail.length) break;
      chosen.push(avail[0].id);
      usage[avail[0].id] = (usage[avail[0].id]||0) + 1;
    }

    if (chosen.length) {
      result[date] = { ...(result[date]||{}), doctors: chosen, coverages: result[date]?.coverages || { am: [], pm: [], nextAm: [] }, eveningSlots: need };
    }
  }
  return result;
}

// Detect conflicts: doctor on leave but assigned night/coverage, or double-booked same time
function detectConflicts(doctors, leaves, nightData, coverages) {
  const fd = id => doctors.find(d=>d.id===id);
  const conflicts = [];
  // 1. Night doctor on leave
  Object.entries(nightData).forEach(([date,nd])=>{
    (nd.doctors||[]).forEach(id=>{
      const d = fd(id); if(!d) return;
      if (onLeave(d, date, leaves)) conflicts.push({ type:"leave", date, text:`${d.name} له دوام مسائي يوم ${date} لكنه في إجازة` });
    });
    // coverage doctor on leave
    const covs = nd.coverages||{};
    ["am","pm","nextAm"].forEach(slot=>{
      (covs[slot]||[]).forEach(id=>{
        const d = fd(id); if(!d) return;
        const covDate = slot==="nextAm" ? nextWork(date) : date;
        if (onLeave(d, covDate, leaves)) conflicts.push({ type:"leave", date:covDate, text:`${d.name} يغطّي يوم ${covDate} لكنه في إجازة` });
      });
    });
  });
  // 2. Individual coverage doctor on leave
  (coverages||[]).forEach(c=>{
    const d = fd(c.coverDoctorId); if(!d) return;
    if (onLeave(d, c.date, leaves)) conflicts.push({ type:"leave", date:c.date, text:`${d.name} يغطّي (فردي) يوم ${c.date} لكنه في إجازة` });
  });
  // 3. Double-booked: same doctor covering 2 things same real period
  const slotKey = (date, period) => `${date}__${period}`;
  const booking = {}; // key -> [names]
  const addBooking = (date, period, id, label) => {
    const d = fd(id); if(!d) return;
    const k = slotKey(date, period);
    if(!booking[k]) booking[k] = [];
    if (booking[k].find(x=>x.id===id)) {
      conflicts.push({ type:"double", date, text:`${d.name} مسجّل مرتين في ${period==="am"?"صباح":"ظهر"} ${date}` });
    }
    booking[k].push({ id, label });
  };
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (covs.am||[]).forEach(id=>addBooking(date,"am",id));
    (covs.pm||[]).forEach(id=>addBooking(date,"pm",id));
    (covs.nextAm||[]).forEach(id=>addBooking(nextWork(date),"am",id));
  });
  (coverages||[]).forEach(c=>addBooking(c.date, c.period, c.coverDoctorId));

  // 4. Same clinic period covered TWICE: night-schedule coverage + individual coverage for same absent doctor
  Object.entries(nightData).forEach(([date,nd])=>{
    const covs = nd.coverages||{};
    (nd.doctors||[]).forEach(nightId=>{
      ["am","pm"].forEach(slot=>{
        const nightCovered = (covs[slot]||[]).length > 0;
        // individual coverage for the SAME night doctor, same date, same period
        const indiv = (coverages||[]).filter(c=>c.date===date && c.period===slot && c.absentId===nightId);
        if (nightCovered && indiv.length) {
          const nm = fd(nightId)?.name||"";
          conflicts.push({ type:"double", date, text:`عيادة ${nm} (${slot==="am"?"صباح":"ظهر"}) ${date} مُغطّاة مرتين: مرة في جدول الدوام ومرة بتغطية فردية` });
        }
      });
    });
  });
  // 5. Absent doctor (individual coverage) is themselves assigned a duty same day
  // Helper: find the previous workday's date string (whose nextAm coverage lands on `date`)
  const prevWorkOf = (dateStr) => {
    const d = new Date(dateStr);
    for (let i=1;i<=4;i++){
      const p = new Date(d); p.setDate(d.getDate()-i);
      const wd = p.getDay(); // 0=Sun..6=Sat ; skip Fri(5),Sat(6)
      if (wd!==5 && wd!==6) return `${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,"0")}-${String(p.getDate()).padStart(2,"0")}`;
    }
    return null;
  };
  (coverages||[]).forEach(c=>{
    if (!c.absentId) return;
    const absId = c.absentId;
    const nm = fd(absId)?.name||"";
    // a) assigned as a cover doctor in another individual coverage same date
    const asCover = (coverages||[]).some(o=>o.date===c.date && o.coverDoctorId===absId);
    // b) assigned in night-schedule coverage same date (am/pm of today)
    const nd = nightData[c.date]||{}; const cv = nd.coverages||{};
    const inTodayCov = [...(cv.am||[]),...(cv.pm||[])].includes(absId);
    // b2) assigned to cover "tomorrow morning" from the PREVIOUS workday's record (lands on c.date)
    const pw = prevWorkOf(c.date);
    const prevNd = pw ? (nightData[pw]||{}) : {};
    const inNextAmCov = ((prevNd.coverages||{}).nextAm||[]).includes(absId);
    // c) has a night shift same date
    const hasNight = (nd.doctors||[]).includes(absId);
    if (asCover || inTodayCov || inNextAmCov || hasNight) {
      conflicts.push({ type:"absent-busy", date:c.date, text:`${nm} مسجّل غائباً يوم ${c.date} لكنه مكلّف بتغطية/دوام نفس اليوم — راجع التكليف` });
    }
  });
  return conflicts;
}

// ══════════════════════════════════════════════════════
// UNIFIED ENGINE — single source of truth for a day
// For each real working period (am, pm) it computes:
//   - clinics that must be staffed (each doctor with a clinic that day)
//   - who is OCCUPIED that period (their own clinic, a coverage duty, an evening shift)
//   - whether each clinic-owner is ABSENT/on-leave (clinic open) → needs a cover
//   - GAPS (uncovered open clinics) + CONFLICTS (double-booked / absent-but-assigned)
//   - SUGGESTIONS (least-loaded free doctors) for each gap
// "evening" = the night shift itself. A doctor's own daytime clinic still needs cover when
//   they take an evening shift OR cover OR are absent (per user rule #1).
// ══════════════════════════════════════════════════════
function analyzeDay(date, doctors, leaves, nightData, coverages, loadMap) {
  const di = dayIdx(date);
  if (di < 0) return { gaps:[], conflicts:[], periods:{} };
  const fd = id => doctors.find(d=>d.id===id);
  const nd = nightData[date] || {};
  const covs = nd.coverages || {};
  const dayIndiv = (coverages||[]).filter(c=>c.date===date);

  // previous workday's nextAm coverage duties land on THIS morning
  const prevWorkOf = (ds) => { const d=new Date(ds); for(let i=1;i<=4;i++){const p=new Date(d);p.setDate(d.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null; };
  const pw = prevWorkOf(date);
  const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];

  // ---- Build occupancy: who is busy each period, and why ----
  // periods we track for staffing: am, pm
  const PERS = ["am","pm"];
  const occupied = { am:{}, pm:{}, evening:{} }; // docId -> reason
  const mark = (per, id, reason) => { if(id==null) return; (occupied[per][id] = occupied[per][id]||[]).push(reason); };

  // evening shift holders (occupied all day effectively for their own daytime clinics)
  (nd.doctors||[]).forEach(id=>mark("evening", id, "دوام مسائي"));

  // each doctor's own clinic occupies them that period (unless their clinic is closed by leave, or they're absent/evening — those make it a GAP not occupancy)
  doctors.forEach(d=>{
    PERS.forEach(per=>{
      if (isClinic(getSlot(d,di,per))) mark(per, d.id, "عيادته");
    });
  });

  // night-schedule coverage duties (am/pm today, + nextAm from prev day lands on am)
  (covs.am||[]).forEach(id=>mark("am", id, "تغطية دوام مسائي"));
  (covs.pm||[]).forEach(id=>mark("pm", id, "تغطية دوام مسائي"));
  prevNextAm.forEach(id=>mark("am", id, "تغطية صباح الغد (من أمس)"));

  // individual coverage duties
  dayIndiv.forEach(c=>{ if(c.period==="am"||c.period==="pm") mark(c.period, c.coverDoctorId, "تغطية فردية"); else if(c.period==="evening") mark("evening", c.coverDoctorId, "تغطية مسائية"); });

  // ---- Determine absence per doctor (individual coverage with absentId, or on-leave) ----
  const absentReason = {}; // docId -> reason string
  dayIndiv.forEach(c=>{ if(c.absentId) absentReason[c.absentId] = "غياب/عذر"; });
  doctors.forEach(d=>{ if(onLeave(d,date,leaves)) absentReason[d.id] = clinicClosedOnLeave(d,date,leaves) ? "إجازة (عيادة مغلقة)" : "إجازة (عيادة قائمة)"; });

  // ---- Compute gaps & conflicts per period ----
  const gaps = [];      // {date,di,period,ownerId,reason}
  const conflicts = []; // {type,date,text}
  const periods = { am:[], pm:[], evening:[] };

  // Doctors busy in the EVENING this day = original night doctors + anyone with an evening individual coverage
  const eveningBusy = new Set([...(nd.doctors||[])]);
  dayIndiv.forEach(c=>{ if(c.period==="evening") eveningBusy.add(c.coverDoctorId); });

  PERS.forEach(per=>{
    // each doctor who HAS a clinic this period
    doctors.forEach(d=>{
      if (!isClinic(getSlot(d,di,per))) return;
      const closed = clinicClosedOnLeave(d,date,leaves);
      // is this clinic owner unavailable to run their own clinic?
      const ownerEvening = eveningBusy.has(d.id);                   // took evening shift OR evening coverage
      const ownerAbsent  = !!absentReason[d.id] && !closed;          // absent/leave-open
      const ownerCovering = (occupied[per][d.id]||[]).some(r=>r.includes("تغطية")); // busy covering elsewhere same period
      const mustCover = (ownerEvening || ownerAbsent || ownerCovering) && !closed;
      // who is assigned to cover THIS owner's clinic this period?
      const coversForOwner = [];
      // individual coverage explicitly targeting this owner+period
      dayIndiv.forEach(c=>{ if(c.period===per && c.absentId===d.id) coversForOwner.push(c.coverDoctorId); });
      // night-schedule coverage: if owner is a night doctor, their am/pm slot is covered by covs[per]
      if ((nd.doctors||[]).includes(d.id)) { const ids = per==="am"?[...(covs.am||[]),...prevNextAm]:(covs.pm||[]); if(ids.length) coversForOwner.push(...ids); }
      if (closed) {
        periods[per].push({ ownerId:d.id, state:"closed" });
        return;
      }
      if (mustCover && coversForOwner.length===0) {
        gaps.push({ date, di, period:per, ownerId:d.id, reason: ownerEvening?"دوام/تغطية مسائية":ownerAbsent?absentReason[d.id]:"مكلّف بتغطية أخرى" });
        periods[per].push({ ownerId:d.id, state:"gap" });
      } else if (mustCover) {
        periods[per].push({ ownerId:d.id, state:"covered", coverIds:coversForOwner });
      } else {
        periods[per].push({ ownerId:d.id, state:"self" }); // runs own clinic
      }
    });

    // CONFLICT: a doctor occupied 2+ ways same period (e.g., own clinic + a coverage duty, or two coverages)
    Object.entries(occupied[per]).forEach(([id,reasons])=>{
      const real = reasons.filter((r,i)=>reasons.indexOf(r)===i);
      // own clinic + covering at same time = conflict (can't be two places)
      const hasOwn = reasons.includes("عيادته");
      const hasCover = reasons.some(r=>r.includes("تغطية"));
      if (hasOwn && hasCover) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} لديه عيادته و مكلّف بتغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
      else if (reasons.length>=2 && reasons.filter(r=>r.includes("تغطية")).length>=2) conflicts.push({ type:"double", date, text:`${fd(+id)?.name||""} مكلّف بأكثر من تغطية في نفس الفترة (${per==="am"?"صباح":"ظهر"}) ${fmtDate(date)}` });
    });
  });

  // CONFLICT: absent doctor still assigned a duty (any period)
  Object.keys(absentReason).forEach(idStr=>{
    const id=+idStr;
    const dutyAm = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const dutyPm = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    const inNight = (nd.doctors||[]).includes(id);
    const dutyEve = inNight || (occupied.evening[id]||[]).some(r=>r.includes("تغطية"));
    if (dutyAm||dutyPm||dutyEve) conflicts.push({ type:"absent-busy", date, docId:id, inNight, text:`${fd(id)?.name||""} غائب/في إجازة يوم ${fmtDate(date)} لكنه مكلّف بتغطية/دوام نفس اليوم` });
  });

  // CONFLICT (RULE: one day = one task): evening-busy doctor also has a daytime coverage duty same day
  eveningBusy.forEach(id=>{
    const amDuty = (occupied.am[id]||[]).some(r=>r.includes("تغطية"));
    const pmDuty = (occupied.pm[id]||[]).some(r=>r.includes("تغطية"));
    if (amDuty||pmDuty) conflicts.push({ type:"evening-plus-cover", date, text:`${fd(id)?.name||""} له دوام/تغطية مسائية ومكلّف بتغطية نهارية نفس اليوم (${fmtDate(date)}) — غير مسموح` });
  });

  // ---- Suggestions for each gap: least-loaded, free that period, not absent, not the owner ----
  gaps.forEach(g=>{
    const busy = new Set(Object.keys(occupied[g.period]).map(Number));
    const cands = doctors.filter(d=>
      d.id!==g.ownerId &&
      !busy.has(d.id) &&
      !absentReason[d.id] &&
      !onLeave(d,date,leaves) &&
      !(d.blockedDays||[]).includes(g.di)
    );
    cands.sort((a,b)=>((loadMap&&loadMap[a.id])||0)-((loadMap&&loadMap[b.id])||0));
    g.suggestions = cands.slice(0,3).map(d=>d.id);
  });

  return { gaps, conflicts, periods, occupied, absentReason };
}

// Rank reference (expected work periods per week-cycle): consultant=8, specialist=9
const RANK_REF = { consultant:8, specialist:9 };
const rankOf = doc => doc?.rank || "specialist";
const rankLabel = r => r==="consultant" ? "استشاري" : "أخصائي";

// Workload per doctor for a month, by ACTUAL worked periods.
// Rules: each worked period = 1; empty period = 0; evening shift = 2; coverage performed = 1.
// A doctor's own clinic period is NOT counted if it was covered by someone else, or the doctor is absent/on-leave.
function computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves) {
  const load = {}; doctors.forEach(d=>load[d.id]=0);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const fd = id => doctors.find(x=>x.id===id);

  // collect all working dates in the month (from nightData + coverages + every weekday with clinics)
  const dates = new Set();
  Object.keys(nightData||{}).forEach(d=>{ if(inM(d)) dates.add(d); });
  (coverages||[]).forEach(c=>{ if(inM(c.date)) dates.add(c.date); });
  // also include all weekdays of the month so own-clinic periods are counted even with no night/coverage
  const dim = new Date(year, monthIdx+1, 0).getDate();
  for(let d=1; d<=dim; d++){ const ds=`${year}-${String(monthIdx+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(dayIdx(ds)>=0) dates.add(ds); }

  dates.forEach(date=>{
    const di = dayIdx(date); if(di<0) return;
    const nd = nightData[date]||{}; const covs = nd.coverages||{};
    const prevWorkOf = (ds)=>{const dd=new Date(ds);for(let i=1;i<=4;i++){const p=new Date(dd);p.setDate(dd.getDate()-i);if(p.getDay()!==5&&p.getDay()!==6)return p.toISOString().split("T")[0];}return null;};
    const pw = prevWorkOf(date);
    const prevNextAm = pw ? ((nightData[pw]?.coverages||{}).nextAm||[]) : [];
    const dayIndiv = (coverages||[]).filter(c=>c.date===date);

    // 1) evening shift = +2
    (nd.doctors||[]).forEach(id=>{ load[id]=(load[id]||0)+2; });

    // 2) own clinic periods actually worked
    doctors.forEach(d=>{
      ["am","pm"].forEach(per=>{
        if (!isClinic(getSlot(d,di,per))) return; // empty/admin/etc → 0
        // is this period covered by someone else, or doctor unavailable?
        const onLv = onLeave(d,date,leaves||[]);
        const isEvening = (nd.doctors||[]).includes(d.id);
        const indivCoveredForThis = dayIndiv.some(c=>c.period===per && c.absentId===d.id);
        const nightCoveredForThis = isEvening && (per==="am" ? [...(covs.am||[]),...prevNextAm].length>0 : (covs.pm||[]).length>0);
        const coveredElsewhere = onLv || indivCoveredForThis || nightCoveredForThis;
        if (!coveredElsewhere) load[d.id]=(load[d.id]||0)+1; // worked own clinic
      });
    });

    // 3) coverage duties performed = +1 each
    (covs.am||[]).forEach(id=>load[id]=(load[id]||0)+1);
    (covs.pm||[]).forEach(id=>load[id]=(load[id]||0)+1);
    prevNextAm.forEach(id=>load[id]=(load[id]||0)+1);
    dayIndiv.forEach(c=>{ load[c.coverDoctorId]=(load[c.coverDoctorId]||0)+1; });
  });
  return load;
}

// Given a load map, return a function that labels a doctor's load relative to peers
function makeLoadLabeler(loadMap) {
  const vals = Object.values(loadMap||{}).filter(v=>v>0).sort((a,b)=>a-b);
  if (!vals.length) return () => ({ icon:"⚪", text:"—", val:0 });
  const lo = vals[Math.floor(vals.length/3)] || vals[0];
  const hi = vals[Math.floor(vals.length*2/3)] || vals[vals.length-1];
  return (id) => {
    const v = loadMap[id]||0;
    if (v===0) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v<=lo) return { icon:"🟢", text:"الأقل عبئاً", val:v };
    if (v>=hi) return { icon:"🔴", text:"الأكثر عبئاً", val:v };
    return { icon:"🟡", text:"متوسط", val:v };
  };
}

// Analyze every filled day in a month → aggregate gaps + conflicts
function analyzeMonth(year, monthIdx, doctors, leaves, nightData, coverages) {
  const load = computeLoadMap(year, monthIdx, doctors, nightData, coverages, leaves);
  const inM = ds => { const [y,m]=ds.split("-"); return +y===year && +m===monthIdx+1; };
  const allGaps=[], allConflicts=[];
  const dates = new Set([...Object.keys(nightData||{}), ...(coverages||[]).map(c=>c.date)].filter(inM));
  [...dates].sort().forEach(date=>{
    const r = analyzeDay(date, doctors, leaves, nightData, coverages, load);
    allGaps.push(...r.gaps); allConflicts.push(...r.conflicts);
  });
  return { gaps:allGaps, conflicts:allConflicts, load };
}

// CREATE LOGIN BUTTON — admin creates a Firebase account for a doctor (linked by email)
// Uses a secondary Firebase app so the admin stays logged in.
// ══════════════════════════════════════════════════════
function CreateLoginButton({ doc, showToast }) {
  const [open, setOpen] = useState(false);
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);
  const email = (doc.email || "").trim();

  const create = () => {
    if (!email || !email.includes("@")) { showToast("أدخل بريد الطبيب أولاً في الحقل أعلاه", "warn"); return; }
    if (!pass || pass.length < 6) { showToast("كلمة المرور 6 أحرف على الأقل", "warn"); return; }
    if (!window.fbSecondaryApp) { showToast("الاتصال السحابي غير متاح", "warn"); return; }
    setBusy(true);
    const secAuth = window.fbSecondaryApp.auth();
    secAuth.createUserWithEmailAndPassword(email, pass)
      .then(() => secAuth.signOut())
      .then(() => { setBusy(false); setDone(true); setOpen(false); setPass(""); showToast("✅ تم إنشاء حساب الطبيب"); })
      .catch(err => {
        setBusy(false);
        const m = err.code==="auth/email-already-in-use" ? "هذا البريد له حساب مسبقاً"
          : err.code==="auth/weak-password" ? "كلمة المرور ضعيفة (6 أحرف+)"
          : err.code==="auth/invalid-email" ? "صيغة البريد غير صحيحة"
          : "تعذّر الإنشاء";
        showToast(m, "warn");
      });
  };

  if (done) return (
    <div style={{ display:"flex", alignItems:"center", gap:8, background:"#f0fdf4", border:"1px solid #bbf7d0", borderRadius:8, padding:"7px 10px", fontSize:12, color:"#15803d", fontWeight:700 }}>
      ✅ تم إنشاء الحساب — سلّم الطبيب بريده وكلمة المرور
    </div>
  );

  if (!open) return (
    <button onClick={()=>setOpen(true)} style={{ width:"100%", padding:"8px", background:"#fff", border:"1px dashed #93b4d8", borderRadius:8, color:"#1e3a5f", cursor:"pointer", fontSize:12, fontWeight:700 }}>🔑 إنشاء حساب دخول لهذا الطبيب</button>
  );

  return (
    <div style={{ background:"#f8fbff", border:"1px solid #dbe7f3", borderRadius:9, padding:10 }}>
      <div style={{ fontSize:11, color:"#64748b", marginBottom:6, direction:"ltr", textAlign:"right" }}>📧 {email || "— لا يوجد بريد —"}</div>
      <input type="text" value={pass} onChange={e=>setPass(e.target.value)} placeholder="كلمة مرور مؤقتة (6 أحرف+)"
        style={{ width:"100%", padding:"8px 10px", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, outline:"none", direction:"ltr", textAlign:"left", marginBottom:8 }} />
      <div style={{ display:"flex", gap:6 }}>
        <button onClick={create} disabled={busy} style={{ flex:1, padding:"8px", background:busy?"#94a3b8":"linear-gradient(135deg,#1e3a5f,#2c5282)", color:"#fff", border:"none", borderRadius:7, fontSize:12, fontWeight:700, cursor:busy?"default":"pointer" }}>{busy?"جارٍ الإنشاء…":"إنشاء"}</button>
        <button onClick={()=>{ setOpen(false); setPass(""); }} style={{ padding:"8px 14px", background:"#fff", border:"1px solid #e2e8f0", borderRadius:7, fontSize:12, cursor:"pointer" }}>إلغاء</button>
      </div>
    </div>
  );
}

          {myLeaves.length===0 ? <div style={{ textAlign:"center", color:"#cbd5e1", padding:"16px 0", fontSize:13 }}>لا توجد إجازات مسجّلة</div> : myLeaves.map(l=>{ const days=Math.round((new Date(l.end)-new Date(l.start))/86400000)+1; const T={annual:"سنوية",sick:"مرضية",emergency:"طارئة",other:"أخرى"}; return (
            <div key={l.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", background:"#f8fafc", borderRadius:9, marginBottom:6, fontSize:12 }}>

            </div>); })}
        </div>
        <div style={{ textAlign:"center", marginTop:18, fontSize:11, color:"#94a3b8" }}>مركز طب الأسنان التخصصي — قسم إصلاح الأسنان · عرض الطبيب (قراءة فقط)</div>
      </div>

  );
}

// APP
