<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الجدول المعتمد — قسم الأسنان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --primary:#0FA39A; --primaryD:#0B7E77; --eve:#6D5DF6; --bg:#EEF3F8; --surface:#fff; --line:#E4ECF3; --ink:#0D1B2A; --text:#34465A; --muted:#8A9BB0; --ok:#16A34A; --warn:#E0982B; --err:#E5484D; }
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.hdr{background:linear-gradient(120deg,var(--primaryD),var(--primary) 65%,var(--eve));color:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:13px;box-shadow:0 12px 30px rgba(15,163,154,.25);margin-bottom:14px;flex-wrap:wrap}
.hdr .lg{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.hdr h1{margin:0;font-size:19px;font-weight:800}
.hdr .sub{font-size:12.5px;opacity:.92;margin-top:2px}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700}
.live .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;color:var(--text)}
.nav .m{flex:1;text-align:center;font-size:17px;font-weight:800;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 1px 2px rgba(16,40,70,.04),0 8px 24px rgba(16,40,70,.06);margin-bottom:10px}
.day{display:flex;align-items:flex-start;gap:12px}
.dn{min-width:52px;text-align:center}
.dn b{display:block;font-size:20px;font-weight:800;color:var(--primary)}
.dn span{font-size:11.5px;color:var(--muted)}
.body{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 12px;font-size:13.5px;font-weight:700;background:#ECEAFE;color:var(--eve);border:1px solid #DDD6FE}
.cov{font-size:13px;color:var(--primaryD);font-weight:600;line-height:1.7;background:#EFFAFB;border:1px solid #D7EEF1;border-radius:8px;padding:6px 11px;margin-bottom:5px}
.empty-day{font-size:12px;color:var(--muted)}
.state{padding:40px 16px;text-align:center;color:var(--muted);font-size:15px}
.upd{font-size:10.5px;color:var(--muted);text-align:center;margin-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;font-size:13px;color:var(--text)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}

.vtoggle{display:flex;gap:6px;margin-bottom:12px}
.vtoggle button{flex:1;padding:11px 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.vtoggle button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wd{background:linear-gradient(135deg,var(--primary),var(--eve));color:#fff;text-align:center;font-weight:700;padding:8px 0;border-radius:9px;font-size:12.5px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px;min-height:90px;display:flex;flex-direction:column;gap:3px}
.gc.empty{background:transparent;border:none;min-height:0}
.gnum{font-weight:800;color:var(--primaryD);font-size:15px;margin-bottom:4px}
.gchip{background:#ECEAFE;color:var(--eve);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcovs{display:flex;flex-direction:column;gap:3px;margin-top:1px}
.gcov{font-size:12px;color:var(--primaryD);background:#EFFAFB;border:1px solid #D7EEF1;border-radius:7px;padding:4px 7px;font-weight:600;line-height:1.55;white-space:normal;word-break:break-word}
.gcov .per{display:inline-block;background:var(--primaryD);color:#fff;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;margin-inline-end:4px}
.gcov .ar{color:#0e7490;font-weight:800}
.dr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.dr .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dr .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--eve));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.dr .nm{font-weight:800;color:var(--ink);font-size:16px}
.dr .mini{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.dr .tag{font-size:12.5px;font-weight:700;border-radius:20px;padding:4px 11px}
.dr .line{font-size:13.5px;color:var(--text);line-height:1.75;padding:3px 0}
@media(max-width:560px){ .hdr h1{font-size:15px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="lg">ط</div>
    <div><h1>الجدول المسائي والتغطيات — المعتمد</h1><div class="sub">قسم الأسنان · عرض للقراءة فقط</div></div>
    <div class="live"><span class="dot"></span>رابط حي — يتحدّث تلقائياً</div>
  </div>
  <div class="nav">
    <button id="prev">‹</button>
    <div class="m" id="mlabel">—</div>
    <button id="next">›</button>
  </div>
  <div class="legend"><span><i style="background:#6D5DF6"></i>عيادة مسائية</span><span><i style="background:#0B7E77"></i>تغطية</span><span style="color:var(--muted)">التغطية: المغطّي <b style="color:#0e7490">◂</b> الغائب</span></div>
  <div class="vtoggle">
    <button id="t_grid" class="on">🗂 جدول شهري</button>
    <button id="t_list">☰ قائمة</button>
    <button id="t_doc">👥 حسب الطبيب</button>
  </div>
  <div id="list"><div class="state">⏳ جارٍ تحميل الجدول المعتمد…</div></div>
  <div class="upd" id="upd"></div>
</div>
<script>
/* ===== إعداد Realtime Database: عدّل هذا فقط (نفس الرابط في إعدادات التطبيق) ===== */
const DB_URL = "https://restorative-department-default-rtdb.europe-west1.firebasedatabase.app"; // قاعدتك
/* ============================================================================== */
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WDAY=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const LEAVE_AR={annual:"إجازة سنوية",sick:"إجازة مرضية",emergency:"إجازة طارئة",other:"إجازة أخرى"};
const perFull=p=>p==="am"?"العيادة الصباحية":p==="pm"?"عيادة الظهر":p==="nextAm"?"عيادة صباح الغد":(p||"");
let DATA=null; let cur=new Date(); cur.setDate(1);
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dmy(ds){const p=ds.split("-");return p[2]+"/"+(+p[1]);}
function covReason(ownerId,date,reason,leaves){ if(reason==="evening"||ownerId==null) return "دوام مسائي"; if(reason==="post_evening") return "راحة بعد دوام مسائي (أمس)"; if(reason==="absence") return "غياب"; const lv=(leaves||[]).find(l=>l.doctorId===ownerId&&date>=l.start&&date<=l.end); if(lv) return LEAVE_AR[lv.type]||"إجازة"; if(reason==="leave") return "إجازة"; return reason||"غياب"; }
function sn(n){ n=(n||"").trim(); const p=n.split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function dayData(y,m,fd){ const dim=new Date(y,m+1,0).getDate(); const out=[]; for(let d=1;d<=dim;d++){ const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; const wd=new Date(date).getDay(); if(wd>=5) continue; const nd=(DATA.nightData||{})[date]||{}; const docs=(nd.doctors||[]).map(id=>fd(id)).filter(Boolean); const covs=(DATA.coverages||[]).filter(c=>c.date===date); const nightCovs=[]; const cv=nd.coverages||{}; ["am","pm","nextAm"].forEach(sl=>(cv[sl]||[]).forEach(id=>{ const c=fd(id); if(c) nightCovs.push({sl,name:c.name}); })); out.push({d,date,wd,docs,covs,nightCovs}); } return out; }

function renderList(y,m,fd){
  const rows=[];
  dayData(y,m,fd).forEach(({d,date,wd,docs,covs,nightCovs})=>{
    if(!docs.length&&!covs.length&&!nightCovs.length) return;
    rows.push(`<div class="card"><div class="day">
      <div class="dn"><b>${d}</b><span>${WDAY[wd]}</span></div>
      <div class="body">
        ${docs.length?`<div class="chips">${docs.map(x=>`<span class="chip">🌙 د.${esc(x.name)}</span>`).join("")}</div>`:""}
        ${covs.map(c=>`<div class="cov">🔄 تم تغطية ${esc(perFull(c.period))} لـ د.${esc(fd(c.absentId)?.name||"—")} بـ د.${esc(fd(c.coverDoctorId)?.name||"—")} بسبب ${esc(covReason(c.absentId,c.date,c.reason,DATA.leaves))}</div>`).join("")}
        ${nightCovs.map(x=>`<div class="cov">🔄 تم تغطية ${esc(perFull(x.sl))} لطبيب المسائي بـ د.${esc(x.name)} بسبب دوام مسائي</div>`).join("")}
      </div></div></div>`);
  });
  return rows.length?rows.join(""):`<div class="state">لا يوجد دوام مسائي أو تغطيات معتمدة في ${MONTHS[m]} ${y}</div>`;
}

function pS(p){ return p==="am"?"صباح":p==="pm"?"ظهر":p==="nextAm"?"صباح الغد":p==="evening"?"مساء":(p||""); }
function fn(n){ return (n||"").split(/\s+/)[0]; }
function renderGrid(y,m,fd){
  const head=WDAY.slice(0,5).map(w=>`<div class="wd">${w}</div>`).join("");
  let cells=""; const firstWd=new Date(`${y}-${String(m+1).padStart(2,"0")}-01`).getDay();
  const pad=firstWd<=4?firstWd:0; for(let i=0;i<pad;i++) cells+=`<div class="gc empty"></div>`;
  const ord="am pm nextAm evening";
  dayData(y,m,fd).forEach(({d,date,docs,covs,nightCovs})=>{
    const lines=[];
    covs.slice().sort((a,b)=>ord.indexOf(a.period)-ord.indexOf(b.period)).forEach(c=>{
      lines.push(`<div class="gcov"><span class="per">${esc(pS(c.period))}</span>د.${esc(fn(fd(c.coverDoctorId)?.name))} <span class="ar">◂</span> د.${esc(fn(fd(c.absentId)?.name))}</div>`);
    });
    nightCovs.slice().sort((a,b)=>ord.indexOf(a.sl)-ord.indexOf(b.sl)).forEach(x=>{
      lines.push(`<div class="gcov"><span class="per">${esc(pS(x.sl))}</span>د.${esc(fn(x.name))} <span class="ar">◂</span> مسائي</div>`);
    });
    cells+=`<div class="gc"><div class="gnum">${d}</div>${docs.map(x=>`<div class="gchip">🌙 د.${esc(fn(x.name))}</div>`).join("")}${lines.length?`<div class="gcovs">${lines.join("")}</div>`:""}</div>`;
  });
  return `<div class="grid">${head}${cells}</div>`;
}

function renderByDoctor(y,m,fd){
  const docs=(DATA.doctors||[]).slice();
  const dd=dayData(y,m,fd);
  const blocks=[];
  docs.forEach(doc=>{
    const eves=dd.filter(x=>x.docs.some(p=>p.id===doc.id)).map(x=>`${WDAY[x.wd]} ${dmy(x.date)}`);
    const covLines=[];
    dd.forEach(x=>{
      x.covs.filter(c=>c.coverDoctorId===doc.id).forEach(c=>covLines.push(`${WDAY[x.wd]} ${dmy(x.date)} — ${esc(perFull(c.period))} لـ د.${esc(fd(c.absentId)?.name||"—")} (${esc(covReason(c.absentId,c.date,c.reason,DATA.leaves))})`));
      ["am","pm","nextAm"].forEach(sl=>{ if(((x.nightCovs||[]).some(n=>n.sl===sl))){} });
      const cv=( (DATA.nightData||{})[x.date]||{}).coverages||{};
      ["am","pm","nextAm"].forEach(sl=>{ (cv[sl]||[]).forEach(id=>{ if(id===doc.id) covLines.push(`${WDAY[x.wd]} ${dmy(x.date)} — ${esc(perFull(sl))} لطبيب المسائي (دوام مسائي)`); }); });
    });
    if(!eves.length && !covLines.length) return;
    const covHtml = covLines.length ? (`<div class="line"><b>التغطيات:</b></div>` + covLines.map(l=>`<div class="line">• ${l}</div>`).join("")) : "";
    const eveHtml = eves.length ? `<div class="line"><b>المسائي:</b> ${esc(eves.join("، "))}</div>` : "";
    blocks.push(`<div class="dr">
      <div class="h"><div class="av">${esc(sn(doc.name))}</div><div class="nm">د.${esc(doc.name)}</div></div>
      <div class="mini"><span class="tag" style="background:#ECEAFE;color:var(--eve)">🌙 مسائي ${eves.length}</span><span class="tag" style="background:#EFFAFB;color:var(--primaryD)">🔄 تغطيات ${covLines.length}</span></div>
      ${eveHtml}${covHtml}
    </div>`);
  });
  return blocks.length?blocks.join(""):`<div class="state">لا بيانات معتمدة في ${MONTHS[m]} ${y}</div>`;
}

let viewMode="grid";
function render(){
  if(!DATA) return;
  const y=cur.getFullYear(), m=cur.getMonth();
  $("mlabel").textContent=MONTHS[m]+" "+y;
  const fd=id=>(DATA.doctors||[]).find(d=>d.id===id);
  $("list").innerHTML = viewMode==="grid"?renderGrid(y,m,fd):viewMode==="doc"?renderByDoctor(y,m,fd):renderList(y,m,fd);
}
async function load(){
  if(DB_URL.startsWith("PASTE")){ $("list").innerHTML=`<div class="state">⚙️ لم يُهيّأ الرابط الحي بعد.<br>افتح هذا الملف وضع DB_URL (نفس رابط القاعدة في إعدادات التطبيق).</div>`; return; }
  try{
    const base=DB_URL.replace(/\/+$/,"");
    const res=await fetch(`${base}/public/schedule.json`,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const doc=await res.json();
    if(!doc||!doc.data) throw new Error("empty");
    DATA=JSON.parse(doc.data);
    const upd=doc.updatedAt?new Date(doc.updatedAt):null;
    $("upd").textContent=upd?("آخر اعتماد ونشر: "+upd.toLocaleString("ar",{dateStyle:"full",timeStyle:"short"})):"";
    render();
  }catch(e){ $("list").innerHTML=`<div class="state">⚠️ تعذّر تحميل الجدول — لم يُنشر بعد أو الرابط/القواعد غير صحيحة.</div>`; }
}
function setView(v){ viewMode=v; ["grid","list","doc"].forEach(k=>{ const b=document.getElementById(k==="grid"?"t_grid":k==="list"?"t_list":"t_doc"); if(b) b.classList.toggle("on",k===v); }); render(); }
$("t_grid").onclick=()=>setView("grid"); $("t_list").onclick=()=>setView("list"); $("t_doc").onclick=()=>setView("doc");
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render();};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render();};
load();
setInterval(load, 120000); // تحديث تلقائي كل دقيقتين
</script>
</body>
</html>
